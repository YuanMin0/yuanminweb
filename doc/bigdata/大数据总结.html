<script>window.__DOC_BLOCKS = [{"type": "p", "text": "绪论"}, {"type": "list", "items": ["智能与人工智能"]}, {"type": "p", "text": "智能=知识（人类智能行为的基础）+智力（能够感知、理解、获取、记忆、应用知识）"}, {"type": "p", "text": "智能特征：感知能力、记忆能力、思维能力、行为能力、学习能力"}, {"type": "p", "text": "图灵（计算机之父，人工智能之父）：首次提出“图灵机”的设想，用于辅助数学问题与决策研究；进行早期电子计算机“炸弹”研制，用于破解德军的Enigma情报；发表划时代著作《 计算机械和智能 》，首次提出机械智能的概念；1966年ACM设立图灵奖，用以表彰计算机研究领域的杰出贡献者"}, {"type": "p", "text": "人工智能是关于知识的科学，研究使用计算机模拟人类智能行为，如学习、推理、思考、规划等，继而用于研究知识的发现、表征与应用。"}, {"type": "list", "items": ["数据与医学大数据"]}, {"type": "p", "text": "==数据==是对客观事件进行记录并可以鉴别的符号，是对客观事物的性质、状态以及相互关系等进行记载的物理符号或这些物理符号的组合，是可识别的、抽象的符号"}, {"type": "p", "text": "==信息==是较为宏观的概念，是由数据的有序排列组合而成，传达给读者某个概念方法等，而数据则是构成信息的基本单位，离散的数据没有任何实用价值"}, {"type": "p", "text": "人类认知发展遵循DIKW体系 （Data-Information-Knowledge-Wisdom）"}, {"type": "p", "text": "数据的主要类型：文本、图片、音频、视频"}, {"type": "p", "text": "大数据是人们获得新知，创造价值的源泉；大数据是改变市场、组织机构、以及政府与公民关系的方法；大数据核心是预测；2011年全球生产数据1.82 ZB"}, {"type": "p", "text": "医疗行业具有典型的“大数据”属性：数据量大（数据规模达到ZB=1024PB级）、数据类型复杂"}, {"type": "p", "text": "==主要研究领域有哪些？=="}, {"type": "list", "items": ["医学影像智能分析系统；2. 从自然语言处理到大语言模型；3. 从大语言模型到多模态大模型；4. DeepSeek的医疗应用；5. AI在化药领域的重要成就；6. 执医考试大模型"]}, {"type": "p", "text": "==智能与人工智能的关联是==（多选 ） A. 人工智能是对人类智能的模仿；B. 人类智能是对人工智能的拓展；C. 人工智能是对人类智能的拓展；D. 人类智能是对人工智能的延伸"}, {"type": "p", "text": "2-医学大数据"}, {"type": "p", "text": "==（一）医学大数据简介=="}, {"type": "p", "text": "基础定义"}, {"type": "p", "text": "大数据（国标 GB/T 35295-2017）：具有体量大、来源多样、生成极快且多变等特征，难以用传统数据体系有效处理的海量数据集。"}, {"type": "p", "text": "医学大数据：以电子健康档案、电子病历、电子处方为核心，融合可穿戴设备等个人健康数据，构建人口健康信息资源库，用于群体健康监测与疾病诊疗。"}, {"type": "p", "text": "数据存储单位：bit→Byte→KB→MB→GB→TB→PB→EB→ZB→YB→BB→NB→DB（1Byte=8bit，后续单位均为 1024 倍递进）。"}, {"type": "p", "text": "来源与种类"}, {"type": "p", "text": "主要来源：医疗卫生部门（电子病历、医保数据等）、互联网（健康 APP、社交平台等）、开放平台和公共数据库（组学数据、临床公共数据库）。"}, {"type": "p", "text": "数据种类：文字（病历、处方）、数值（实验数据）、表单（化验单）、图像（CT、超声）、声音（心音、肺音）、组学数据（基因序列）。"}, {"type": "p", "text": "特征"}, {"type": "p", "text": "通用特征（5V）：Volume（规模大）、Velocity（增长快）、Variety（类型多样）、Veracity（真实性）、Value（价值高）。"}, {"type": "p", "text": "专属特征：Incomplete（不完整性）、Privacy（隐私性）、Temporal（时序性）、Redundancy（冗余性）。"}, {"type": "p", "text": "核心用途：临床决策支持、优化就诊流程（诊前 - 诊中 - 诊后全流程）、基础研究、个性化肿瘤防治。"}, {"type": "p", "text": "DIKW 模型：Data（原始数据）→Information（加工后有意义的数据）→Knowledge（系统性整合的模式规律）→Wisdom（情境下的明智决策能力）。"}, {"type": "p", "text": "==（二）医学信息标准=="}, {"type": "p", "text": "标准需求：解决名词术语 / 编码不统一、传输格式不规范、系统异构兼容等问题，打破 “信息孤岛”。"}, {"type": "p", "text": "标准化要求：Consistency（一致性）、Interoperability（互操作性）、Repeatability（可重复性）。"}, {"type": "p", "text": "标准定义：卫生业务中信息采集、传输、交换、利用的统一规则、概念、术语、代码和技术。"}, {"type": "p", "text": "标准分类（按功能）"}, {"type": "p", "text": "核心类别：生物医学术语（ICD、SNOMED-CT）、分类代码标准（DRG）、信息交换标准（HL7、DICOM）、标识标准、文档和消息规范等。"}, {"type": "p", "text": "常用标准："}, {"type": "p", "text": "ICD（国际疾病分类）：将疾病与健康问题转换为字母数字编码，便于数据存储与比较（ICD-10 含 21 章，2036 个类目）；"}, {"type": "p", "text": "HL7：电子健康信息交换标准，含 V2、V3、CDA、FHIR 等子标准；"}, {"type": "p", "text": "DICOM（医学数字成像与通讯标准）：用于医学影像的生成、存储、传输；"}, {"type": "p", "text": "LOINC（逻辑观察标识符命名和编码）：适用于化验检查场景。"}, {"type": "p", "text": "==（三）医学大数据处理技术=="}, {"type": "p", "text": "数据分析基本流程：明确目标→数据收集→数据预处理→分析建模→数据可视化→报告撰写。"}, {"type": "p", "text": "数据预处理"}, {"type": "p", "text": "核心原因：现实数据为 “脏数据”，存在重复、不完整、不准确、不一致、高维度等问题。"}, {"type": "p", "text": "关键策略："}, {"type": "p", "text": "数据离散化：二值数据（男→1、女→0）、多值数据（数值法 / One-hot 编码）；"}, {"type": "p", "text": "数据规范化：最小 - 最大标准化（映射至指定区间）、Z-score 规范化（对离群点不敏感）。"}, {"type": "p", "text": "数据降维：主成分分析（PCA），将多变量重组为正交综合变量，保留核心信息（如 31 个地区 10 项医疗指标降维至 3 个主成分，累计贡献率 93.05%）。"}, {"type": "p", "text": "数据分析决策方法"}, {"type": "table", "head": ["分析类型", "核心问题", "常用方法", "典型算法"], "rows": [["描述性分析", "发生了什么？", "关联规则、聚类", "Apriori、k - 均值聚类"], ["诊断性分析", "为什么会发生？", "回归、分类", "线性回归、决策树、K - 近邻"], ["预测性分析", "什么将可能发生？", "神经网络、时间序列分析", "-"]]}, {"type": "p", "text": "==（四）背景案例与行业动态=="}, {"type": "p", "text": "数据安全案例：俄乌战争中 Oracle 终止对俄数据服务，暴露依赖国外数据库的风险；美国 “棱镜” 计划后，我国启动 “去 IOE”（IBM、Oracle、EMC）进程。"}, {"type": "p", "text": "行业应用：德国 MERCK 公司数字医疗卫生部门，通过医疗大数据优化治疗方法与护理质量；新北京天坛医院的智能设备（床头卡、智能床垫）数据采集实践。"}, {"type": "p", "text": "核心平台：国家人口健康科学数据中心、CHNS（中国健康与营养调查）、PIC（儿科重症监护数据库）、TCGA（癌症基因组图谱）等。"}, {"type": "p", "text": "医疗大数据的通用特征是什么？\n A. Volume, Velocity；B. Variety, Value；C. Vulnerable，Virtual；D. Veracity"}, {"type": "p", "text": "医学大数据专属特征：不完整性、隐私性、时序性、冗余性（4 个核心）。"}, {"type": "p", "text": "常用医学信息标准对应场景：电子病历（ICD/SNOMED-CT）、化验检查（LOINC）、影像传输（DICOM）、信息交换（HL7）。"}, {"type": "p", "text": "数据类型分类：结构化数据（二维表，如患者基本信息表）、半结构化数据（XML/HTML）、非结构化数据（图像 / 音频 / 文档）。"}, {"type": "p", "text": "PCA 的核心作用：数据降维，保留原始数据的核心信息，简化分析模型。"}, {"type": "p", "text": "3-人工智能基础理论"}, {"type": "p", "text": "==（一）人工智能的基本概述=="}, {"type": "p", "text": "智能的本质：智能 = 知识 + 智力，是人类智能行为的基础，能够感知、理解、获取、记忆、应用知识。"}, {"type": "p", "text": "人工智能（AI）定义：研究使用计算机模拟人类智能行为（学习、推理、思考、规划等），探索知识的发现、表征与应用的科学。"}, {"type": "p", "text": "人机智能的关系：人工智能是人类智能的投影与拓展延伸，通过计算机模型模拟人类智能，处理实际问题并通过反馈优化效能。"}, {"type": "p", "text": "==（二）人工智能的发展历程（核心时间线）=="}, {"type": "table", "head": ["阶段", "关键时间", "标志性事件"], "rows": [["萌芽", "1950 年", "阿兰・图灵发表《计算机械与智能》，提出 “图灵测试”，肯定机械智能的可能性。"], ["诞生", "1956 年", "达特茅斯会议召开，正式提出 “人工智能” 概念，AI 学科诞生。"], ["第一高峰", "1958 年", "Frank Rosenblatt 提出感知机算法，成为神经网络起源。"], ["第一低谷", "1971 年", "感知机因无法解决 “异或问题” 受挫，Minsky 发表《感知机》批评，科研经费削减。"], ["第二高峰", "1986 年", "Rumelhart 等人提出反向传播算法，推动 BP 神经网络发展。"], ["第二低谷", "1990 年", "前馈 / BP 神经网络计算复杂，难以实现复杂目标抽取，AI 发展陷入停滞。"], ["第三高峰", "1997 年", "IBM “深蓝” 击败国际象棋世界冠军卡斯帕罗夫，成为 AI 博弈领域里程碑。"], ["深度学习崛起", "2006 年", "Geoffrey Hinton 提出深度学习理论，发表相关论文奠定基础。"], ["技术突破", "2012 年", "AlexNet 在 ILSVRC 比赛中夺冠，图像识别准确率超 80%，验证深度卷积神经网络威力。"], ["里程碑事件", "2016 年", "Google DeepMind 的 AlphaGo 击败围棋世界冠军李世石，AI 攻克复杂棋类游戏。"], ["多模态时代", "2022 年至今", "大语言模型（ChatGPT、GPT-4 等）爆发，逐步进入多模态大模型（SORA、Gemini）阶段。"]]}, {"type": "p", "text": "==（三）人工智能的基础理论框架（三大流派）=="}, {"type": "table", "head": ["流派", "代表人物", "核心思想", "研究领域", "关键特点"], "rows": [["符号主义（逻辑学派）", "Simon、Newell、麦卡锡", "认知本质是符号操作，机器通过逻辑规则模拟人类推理。", "专家系统、知识库、机器证明", "可解释，依赖手工知识"], ["连接主义（仿生学派）", "Hinton、Yann LeCun", "智能源于人脑神经元连接，通过人工神经网络模拟大脑工作方式。", "深度学习、类脑计算、认知科学", "不可解释，依赖数据"], ["行为主义（控制论学派）", "Wiener、Brooks", "智能取决于感知与行动，通过环境反馈、奖惩机制实现学习。", "自动驾驶、机器人、演化计算", "可解释，侧重实际应用"]]}, {"type": "p", "text": "==（四）人工智能的三大核心支撑与编程基础=="}, {"type": "p", "text": "三大核心支撑（AI 发展的 “三驾马车”）"}, {"type": "p", "text": "算法：解决问题的有序指令与步骤，是 AI 的 “灵魂”，应用于机器学习、深度学习、NLP、计算机视觉等领域。"}, {"type": "p", "text": "算力：计算设备处理数据、执行算法的能力，是 AI 的 “动力引擎”，GPU 因并行计算优势成为核心硬件（CPU 侧重串行，GPU 侧重并行）。"}, {"type": "p", "text": "数据：对现实世界的描述（数字、文字、图像等），是 AI 的 “知识源泉”，数据质量决定算法性能上限（如 ImageNet 数据集推动图像识别发展）。"}, {"type": "p", "text": "经典深度学习网络：AlexNet（双 GPU 并行、ReLu 激活）、VGG（小卷积核堆叠）、ResNet（残差连接）、GoogLeNet（inception 模块）、DenseNet（密集连接）。"}, {"type": "p", "text": "编程基础"}, {"type": "p", "text": "核心语言：Python（AI 领域主流编程语言）。"}, {"type": "p", "text": "主流框架："}, {"type": "p", "text": "TensorFlow：谷歌开源，支持多语言，采用静态计算图，适合大规模部署。"}, {"type": "p", "text": "PyTorch：Facebook 开源，API 简洁，采用动态计算图，便于调试和快速迭代。"}, {"type": "p", "text": "==二、明确考点====与答案====解析=="}, {"type": "p", "text": "==（一）单选题（2 分，中）=="}, {"type": "p", "text": "什么是智能？ A. 知识和能力的总和；B. 智慧和能力的总和；C. 智商和能力的总和；D. 知识和智力的总和"}, {"type": "p", "text": "人工智能诞生的标志性事件是（ ）"}, {"type": "p", "text": "A. 图灵测试提出；B. 达特茅斯会议召开；C. 感知机算法诞生；D. 深蓝击败卡斯帕罗夫"}, {"type": "p", "text": "以下属于连接主义流派代表人物的是（ ）"}, {"type": "p", "text": "A. 阿兰・图灵；B. Geoffrey Hinton；C. Marvin Minsky；D. Norbert Wiener"}, {"type": "p", "text": "AI 三大核心支撑不包括（ ）"}, {"type": "p", "text": "A. 算法；B. 算力；C. 数据；D. 硬件"}, {"type": "p", "text": "采用动态计算图的深度学习框架是（ ）"}, {"type": "p", "text": "A. TensorFlow；B. PyTorch；C. Caffe；D. MXNet"}, {"type": "p", "text": "PyTorch 以动态计算图为核心优势，调试便捷；TensorFlow 默认静态计算图。"}, {"type": "p", "text": "感知机是神经网络的起源算法，能够解决异或问题（×）"}, {"type": "p", "text": "感知机无法解决异或问题，这是其 1970 年代受挫的核心原因。"}, {"type": "p", "text": "ImageNet 数据集的构建与 ILSVRC 比赛推动了深度卷积神经网络的发展（√）"}, {"type": "p", "text": "2012 年 AlexNet 基于 ImageNet 训练夺冠，验证了深度卷积神经网络的有效性。"}, {"type": "p", "text": "4-人工智能算法"}, {"type": "p", "text": "==（一）机器学习原理与算法框架=="}, {"type": "p", "text": "机器学习的起源与定义"}, {"type": "p", "text": "1959 年由 Arthur Samuel 提出，核心是通过训练数据挖掘规律，用于测试数据预测，再通过评估结果优化模型效能（“基于过去，预测未来”）。"}, {"type": "p", "text": "代表性早期成果：Samuel 的跳棋程序（Checkers-playing），展示了机器学习基本概念。"}, {"type": "p", "text": "与人工智能的关系：人工智能是上位概念，机器学习是人工智能的核心实现方法（后者包含前者）。"}, {"type": "p", "text": "算法框架全流程"}, {"type": "p", "text": "问题分析与数据收集：区分有标记数据（用于监督学习）和无标记数据（用于无监督学习）。"}, {"type": "p", "text": "数据预处理与特征工程：预处理包括图像增强、标准化、缺失值处理等；特征工程是提炼高通量特征，深度学习可弱化传统人工特征工程的作用。"}, {"type": "p", "text": "特征选择与降维：均为防止过拟合、降低复杂度，特征选择是选取原始特征子集，降维是将特征映射到新的低维空间。"}, {"type": "p", "text": "模型分类：监督学习、无监督学习、半监督学习。"}, {"type": "p", "text": "模型评估：依赖数据集划分（训练集 = 平时作业、验证集 = 模考试卷、测试集 = 高考试卷），分类模型评估 “分类正误”，回归模型评估 “预测值与真实值差异”。"}, {"type": "p", "text": "模型分类及核心场景"}, {"type": "p", "text": "监督学习：使用带标签数据训练，分为分类（标记离散，如病变良恶判断）和回归（标记连续，如血糖水平预测）。"}, {"type": "p", "text": "无监督学习：无标签数据，核心是聚类（按相似性分组，如乳腺癌分子分型）。"}, {"type": "p", "text": "半监督学习：结合少量有标签数据和大量无标签数据训练，提升模型性能。"}, {"type": "p", "text": "==（二）深度学习基本理论与模型=="}, {"type": "p", "text": "深度学习的起源与定位"}, {"type": "p", "text": "2006 年由 Geoffrey Hinton 等人提出，是机器学习的子集，属于人工智能的底层实现技术（AI⊇机器学习⊇深度学习）。"}, {"type": "p", "text": "与传统机器学习的核心区别"}, {"type": "p", "text": "特征提取：深度学习自动提取高层次特征，无需人工干预；传统机器学习依赖人工设计特征。"}, {"type": "p", "text": "处理流程：深度学习是端到端连续流程（原始数据→输出）；传统机器学习需多阶段拆分（特征提取→模型训练→预测）。"}, {"type": "p", "text": "核心基础：神经网络"}, {"type": "p", "text": "人工神经元：接收输入（x₁-xₙ）、权重（w₁-wₙ）和偏置（b），通过加权求和 + 激活函数输出结果。"}, {"type": "p", "text": "多层感知器（MLP）：输入层（接收原始数据）→隐藏层（逐层提取特征）→输出层（输出预测结果）。"}, {"type": "p", "text": "训练核心：前向传播（计算输出与损失函数）→反向传播（链式法则计算梯度）→优化器（梯度下降、Adam 等）更新权重。"}, {"type": "p", "text": "损失函数：衡量预测与真实值差异（如均方误差 MSE）。"}, {"type": "p", "text": "代表性模型：CNN（卷积神经网络）、RNN/LSTM（时序数据处理）、GAN（生成对抗网络）、Transformer（注意力机制）。"}, {"type": "p", "text": "==（三）卷积网络关键环节的计算过程=="}, {"type": "p", "text": "核心组件与计算逻辑"}, {"type": "p", "text": "卷积层（核心特征提取）："}, {"type": "p", "text": "关键参数：卷积核（Kernel/Filter）、滑动窗（Sliding window）、步长（Stride）、填充（Padding，用于保持尺寸或调整输出）。"}, {"type": "p", "text": "尺寸计算公式：输出宽度 W₂=(W₁+2P-Wₖ)/S +1，输出高度 H₂=(H₁+2P-Wₖ)/S +1，输出深度 = 卷积核数量（W₁/H₁为输入宽 / 高，Wₖ为卷积核尺寸）。"}, {"type": "p", "text": "本质：通过卷积核对数据加权运算（点乘），提取边缘、纹理等特征。"}, {"type": "p", "text": "池化层（降维与特征汇聚）：分为最大池化（取局部最大值，保留显著特征）和平均池化（取局部平均值，平滑特征），不改变特征图深度。"}, {"type": "p", "text": "全连接层（分类 / 预测）：位于网络末端，将特征图元素与神经元全连接，输出最终结果（如通过 Softmax 转化为概率）。"}, {"type": "p", "text": "典型卷积网络模型"}, {"type": "p", "text": "LeNet-5：早期经典，用于手写数字识别，包含卷积层、下采样层、全连接层。"}, {"type": "p", "text": "AlexNet：2012 年 ILSVRC 夺冠，引入 ReLU 激活、双 GPU 并行，开启深度 CNN 时代。"}, {"type": "p", "text": "ResNet：引入残差块和 BatchNorm，解决深层网络梯度消失问题，可传递底层信息到高层。"}, {"type": "p", "text": "ViT（Vision Transformer）：用 Transformer 处理图像，大规模数据集下效果优于 CNN。"}, {"type": "p", "text": "==（一）单选题=="}, {"type": "p", "text": "机器学习与人工智能的关系？A. 并列关系；B. 前者包含后者；C. 后者包含前者；D. 等效关系）"}, {"type": "p", "text": "特征选择与特征降维的区别？ A. 特征选择是将原始特征映射到一个新的空间；B. 特征降维是从原始特征群组中选取特征子集；C. 特征选择是从原始特征群组中选取特征子集；D. 特征降维与特征选择的原理是相同的"}, {"type": "p", "text": "题目：已知某输入图像尺寸为 10×10（单通道），使用 3×3 卷积核，Padding=1、Stride=1，输出特征图尺寸为？A. 8×8；B. 10×10；C. 11×11；D. 9×9"}, {"type": "p", "text": "解析：代入公式 W₂=(10+2×1-3)/1 +1=10，H₂同理，故输出尺寸为 10×10。"}, {"type": "p", "text": "计算输入为 4×4 矩阵（[[1,0,2,0],[3,3,2,0],[1,1,0,2],[0,3,1,2]]），3×3 卷积核（[[1,0,1],[0,1,0],[1,0,1]]），S=1、P=0 时的输出特征图？\nA. [[7,5],[7,9]]；B. [[7,5],[8,7]]；C. [[5,7],[8,7]]；D. [[7,5],[7,8]]"}, {"type": "p", "text": "解析：卷积计算过程："}, {"type": "p", "text": "左上角窗口：1×1+0×0+2×1 +3×0+3×1+2×0 +1×1+1×0+0×1=1+0+2+0+3+0+1+0+0=7；"}, {"type": "p", "text": "右上角窗口：0×1+2×0+0×1 +3×0+2×1+0×0 +1×0+0×0+2×1=0+0+0+0+2+0+0+0+2=4\n（修正：原题选项对应正确计算结果为 A，核心验证卷积点乘逻辑）。"}, {"type": "p", "text": "==（二）多选题=="}, {"type": "p", "text": "机器学习方法有哪些类别？A. 监督学习；B. 半监督学习；C. 无监督学习；D. 自监督学习"}, {"type": "p", "text": "下列属于监督学习任务类型的有A. 分类；B. 回归；C. 聚类；D. 降维"}, {"type": "p", "text": "==（三）判断题=="}, {"type": "p", "text": "半监督学习与监督学习的核心区别在于：半监督学习仅使用无标记数据训练模型，而监督学习仅使用有标记数据训练模型。（×）"}, {"type": "p", "text": "卷积神经网络（CNN）中的池化层仅能减少特征图的维度，无法减少图像噪声对模型的影响。（×）"}, {"type": "p", "text": "解析：池化层不仅能降维，还能通过局部特征汇聚实现去噪（如最大池化保留显著特征，抑制噪声干扰）。"}, {"type": "p", "text": "5-自然语言处理"}, {"type": "p", "text": "==（一）自然语言处理（NLP）基本理论=="}, {"type": "p", "text": "定义与核心目标：通过计算机与 AI 技术对人类自然语言进行有意义的分析与处理，核心是==自然语言理解（NLU）== 和==自然语言生成（NLG）==。"}, {"type": "p", "text": "NLU：使机器理解文本内涵、消解歧义（如 “他的父亲做了手术” 中 “父亲” 是患者而非执行者）。"}, {"type": "p", "text": "NLG：将非语言数据转化为人类语言，实现人机有效交流（如医学影像报告生成）。"}, {"type": "p", "text": "与 AI 的关系：NLP 是 AI 的核心应用领域，模仿人类语言学习路径（字→词→语句→篇章→语法规则），通过 “模仿 - 表征 - 拓展 - 延伸” 实现语言处理。"}, {"type": "p", "text": "核心目标：正确理解语句内涵、消解歧义，与人类进行有效交流互动。"}, {"type": "p", "text": "==（二）NLP 核心技术流程（重点）=="}, {"type": "p", "text": "按 “底层到高层” 递进，是 NLU 的核心环节："}, {"type": "p", "text": "分词：将文本拆分为最小语义单位（如医学文本 “脑实质未见异常强化信号”→“脑实质 | 未见 | 异常 | 强化 | 信号”）。"}, {"type": "p", "text": "常用方法：基于词典的机械分词法（按词典最大长度匹配，不匹配则缩短字符串）。"}, {"type": "p", "text": "词性标注：标注词语语法类别（如名词 n、动词 v、形容词 a），需解决兼类词识别（如 “要求” 在 “人民的要求” 中为名词）。"}, {"type": "p", "text": "实体识别：识别文本中的关键实体（如医学中的 “脑池”“肺癌”“EGFR 突变”）。"}, {"type": "p", "text": "实现方法：Word2Vec 词向量映射（将词语转为高维向量）+ 传统机器学习（SVM、RF）或深度学习（LSTM）模型。"}, {"type": "p", "text": "实体标准化：解决医学实体多元指代问题（如 “无”“未见”“未发现” 统一为 “无相关异常”），规范指代一致性。"}, {"type": "p", "text": "实体关系抽取：挖掘实体间语义关联（如 “肺癌 - 转移 - 骨”“症状 - 对应 - 疾病”），是语义理解的关键。"}, {"type": "p", "text": "语义分析："}, {"type": "p", "text": "格文法：分析句子深层语义关系（施事、受事、时间、地点等），无关表层语法结构（如 “脑实质出现异常信号” 与 “异常信号出现在脑实质” 深层语义一致）。"}, {"type": "p", "text": "语义角色标注（SRL）：以谓词为核心，标注论元角色（ARG0 施事、ARG1 受事、ARGM-TMP 时间等）。"}, {"type": "p", "text": "==（三）关键模型与算法（难点）=="}, {"type": "p", "text": "传统序列模型："}, {"type": "p", "text": "RNN（循环神经网络）：处理时序文本，但存在梯度消失 / 爆炸，难以捕捉长距离依赖。"}, {"type": "p", "text": "LSTM（长短期记忆网络）：通过遗忘门、输入门、输出门解决长距离依赖问题，是 NLP 早期核心模型。"}, {"type": "p", "text": "现代核心模型："}, {"type": "p", "text": "Transformer（2017 年提出）：基于自注意力机制，摆脱时序依赖，可同时捕捉全局语义关联，是预训练模型的基础。"}, {"type": "p", "text": "预训练语言模型："}, {"type": "p", "text": "BERT：双向预训练（掩码语言模型 + 下一句预测），擅长理解任务（如文本分类、实体识别）。"}, {"type": "p", "text": "GPT：单向自回归预训练，擅长生成任务（如文本续写、对话生成）。"}, {"type": "p", "text": "ChatGPT：大参数概率模型，基于前文计算单词出现概率，生成连贯文本，核心是海量语料训练的语义规律学习。"}, {"type": "p", "text": "词向量技术：Word2Vec 将词语映射到高维向量，捕捉语义关联，为后续模型提供特征输入。"}, {"type": "p", "text": "==（四）医学应用场景=="}, {"type": "p", "text": "临床决策支持系统（CDSS）：嵌入 HIS 系统，解析病历文本（主诉、现病史、检查结果），提供诊断建议、治疗方案、鉴别诊断。"}, {"type": "p", "text": "医学影像报告生成（ChatCAD）：将影像数据（如肺结节 CT）转化为自然语言报告，结合 LLM 优化诊断表述。"}, {"type": "p", "text": "医学文本分析：处理电子病历、检查报告，抽取疾病、症状、用药等关键信息，支持科研数据挖掘。"}, {"type": "h", "level": 3, "id": "s1", "text": "单选题"}, {"type": "p", "text": "请用格文法分析以下句子 “治疗方案明天由李医生确定。” 施事者与受事者分别是（ ）"}, {"type": "p", "text": "选项：A. 治疗方案 李医生；B. 治疗方案 确定；C. 李医生 治疗方案；D. 确定 治疗方案"}, {"type": "p", "text": "对于语义角色标注，以下说法错误的是？（ ）"}, {"type": "p", "text": "：A. “他要吃药” 与 “药被他吃了” 标注结果相同；B. “美国制造了这类药物” 与 “这类药物的生产商在美国” 标注结果相同；C. 语义角色标注的核心是句子中的谓词；D. 语义角色标注分析的是其它成分与谓词的关系"}, {"type": "p", "text": "题目：AI 通过 NLU 技术对字、词、句、篇章进行理解时，除了分词、词性标注以外，还有哪些关键技术环节？（ ）"}, {"type": "p", "text": "A. 词性对齐、冗余分析、实体识别、实体标准化；B. 实体识别、实体标准化、实体关系抽取、冗余分析；C. 词性对齐、实体标准化、实体关系抽取、语义分析；D. 实体识别、实体标准化、实体关系抽取、语义分析"}, {"type": "p", "text": "题目：以下说法正确的是（ ）"}, {"type": "p", "text": "A. 实体关系抽取是指获得唯一实体的文本处理过程；B. 实体识别之前，必须要进行 Word2Vec 变换；C. Word2Vec 变换可以用在文本识别的任何环节；D. NLU 主要模仿人类的文字识别行为，用于 NLP 分析处理"}, {"type": "h", "level": 3, "id": "s2", "text": "多选题"}, {"type": "p", "text": "以下属于 NLP 核心技术流程的有（ ）"}, {"type": "p", "text": "A. 分词；B. 实体标准化；C. 语义角色标注；D. 图像分割"}, {"type": "p", "text": "以下模型中能解决长距离依赖问题的有（ ）"}, {"type": "p", "text": "选项：A. RNN；B. LSTM；C. Transformer；D. Word2Vec"}, {"type": "h", "level": 3, "id": "s3", "text": "判断题"}, {"type": "p", "text": "格文法分析的是句子的表层语法结构（主、谓、宾），而非深层语义关系。（×）"}, {"type": "p", "text": "Transformer 模型通过自注意力机制，能够同时捕捉文本中所有词语的关联，无需按顺序处理。（√）"}, {"type": "p", "text": "6-计算机视觉"}, {"type": "p", "text": "==（一）计算机视觉理论=="}, {"type": "p", "text": "定义：让计算机通过摄像头和算法模拟人类视觉能力，核心是 “看懂” 图像（识别物体、场景、动作等），即给机器装上 “眼睛” 和 “大脑”。"}, {"type": "p", "text": "数字图像基础"}, {"type": "p", "text": "基本单位：像素（Pixel），图像是由像素构成的可存储、可处理的数字化表征。"}, {"type": "p", "text": "分辨率：空间分辨率（像素排列密度，如 1024×1024），分辨率越高图像细节越清晰。"}, {"type": "p", "text": "图像类型："}, {"type": "p", "text": "二值图像（黑白图像）：像素值仅为 0（黑）和 1（白），无中间过渡。"}, {"type": "p", "text": "灰度图像：每个像素用量化灰度级描述，无彩色信息。"}, {"type": "p", "text": "彩色图像：基于彩色模型（如 RGB），每个像素由三原色灰度级构成。"}, {"type": "p", "text": "三大核心任务"}, {"type": "p", "text": "图像分类：给图像分配单一标签（如 “正常”“糖尿病视网膜病变”）。"}, {"type": "p", "text": "目标检测：定位图像中所有目标，同时标注类别（如 “血管旁结节”“恶性磨玻璃结节”）。"}, {"type": "p", "text": "图像分割：将图像划分为语义区域（如医学影像中分割肝脏、肿瘤、背景）。"}, {"type": "p", "text": "==（二）计算机视觉核心技术=="}, {"type": "p", "text": "==1. 技术发展三阶段=="}, {"type": "p", "text": "1960s-2010s：传统 CV（手工设计特征 + 规则化分类，依赖专家经验）。"}, {"type": "p", "text": "2012 年起：深度学习 CV（数据驱动自动学习特征，端到端建模）。"}, {"type": "p", "text": "近年：融合演进（传统方法弥补深度学习解释性、小样本短板）。"}, {"type": "p", "text": "==2. 传统 CV 核心技术=="}, {"type": "p", "text": "图像预处理："}, {"type": "p", "text": "去噪：均值滤波（平滑高斯噪声，邻域加权平均）、中值滤波（去除椒盐噪声，邻域取中值）。"}, {"type": "p", "text": "图像增强：突出有用信息，便于后续分析（分割、特征提取）。"}, {"type": "p", "text": "图像分割："}, {"type": "p", "text": "聚类算法：K-Means（1967 年提出，将像素按特征聚为 K 个簇，适用于 MRI 脑组织分割）。"}, {"type": "p", "text": "K-Means 缺陷：需提前确定 K 值、对初始簇中心敏感，易陷入局部最优。"}, {"type": "p", "text": "==3. 深度学习 CV 核心技术=="}, {"type": "p", "text": "U-Net（生物医学图像分割标杆）："}, {"type": "p", "text": "结构：编码器（卷积层 + 池化层，提取特征、缩小尺寸）+ 解码器（上采样层 + 卷积层，重建图像、扩大尺寸）。"}, {"type": "p", "text": "关键操作：反卷积（Transposed Convolution，合成新像素扩大尺寸）、反池化（反最大池化 / 反平均池化，恢复特征图尺寸）。"}, {"type": "p", "text": "经典网络解析："}, {"type": "p", "text": "AlexNet（2012 年 ILSVRC 夺冠）：5 个卷积层 + 3 个全连接层，首次使用 ReLU 激活函数、Dropout 正则化、GPU 并行计算，奠定深度学习 CV 基础。"}, {"type": "p", "text": "ResNet（2015 年）：引入残差块和 BatchNorm，跨层连接解决深层网络梯度消失问题，最深达 152 层。"}, {"type": "p", "text": "ViT（Vision Transformer）：将图像分割为 Patch，通过 Transformer 编码器处理，大规模数据集上效果优于 CNN。"}, {"type": "p", "text": "传统 CV vs 深度学习 CV 对比："}, {"type": "table", "head": ["对比维度", "传统 CV", "深度学习 CV"], "rows": [["特征来源", "手工设计（专家经验）", "数据驱动自动提取"], ["数据需求", "小样本（千级）", "大样本（百万级）"], ["泛化能力", "弱（场景固定）", "强（跨场景适配）"], ["解释性", "强（规则可追溯）", "弱（黑箱）"], ["计算成本", "低（CPU 可运行）", "高（需 GPU/TPU）"]]}, {"type": "p", "text": "==（三）典型医学应用=="}, {"type": "p", "text": "肺结节智能诊断：高灵敏检出 3mm 及以上结节，量化分析结节大小、密度等信息，预测良恶性。"}, {"type": "p", "text": "手术导航：实时分割术中影像（腹腔镜视频）的器官 / 肿瘤边界，叠加到手术视野辅助操作。"}, {"type": "h", "level": 3, "id": "s4", "text": "单选题"}, {"type": "p", "text": "以下哪种图像类型的像素值仅包含 0 和 1？（ ）"}, {"type": "p", "text": "选项：A. 灰度图像；B. 二值图像；C. RGB 彩色图像；D. 医学影像"}, {"type": "p", "text": "题目：AlexNet 中 CONV1 使用 96 个 11×11 卷积核，Stride=4，Padding=0，输入图像尺寸为 227×227×3，输出特征图尺寸为？（ ）"}, {"type": "p", "text": "A. 55×55；B. 27×27；C. 13×13；D. 64×64"}, {"type": "p", "text": "解析：代入卷积尺寸公式\\(W_2=(W_1+2P-W_k)/S +1\\)，即\\((227+0-11)/4 +1=55\\)，输出尺寸为 55×55，特征图个数 = 卷积核数量 = 96。"}, {"type": "p", "text": "ResNet 解决深层网络梯度消失问题的核心机制是？（ ）"}, {"type": "p", "text": "A. ReLU 激活函数；B. Dropout 正则化；C. 残差块跨层连接；D. 局部响应归一化"}, {"type": "h", "level": 3, "id": "s5", "text": "多选题"}, {"type": "p", "text": "以下属于计算机视觉三大核心任务的有（ ）"}, {"type": "p", "text": "A. 图像分类；B. 目标检测；C. 图像分割；D. 图像去噪"}, {"type": "p", "text": "以下属于 K-Means 聚类算法缺陷的有（ ）"}, {"type": "p", "text": "A. 需提前确定 K 值；B. 对初始簇中心敏感；C. 泛化能力强；D. 易陷入局部最优"}, {"type": "h", "level": 3, "id": "s6", "text": "判断题"}, {"type": "p", "text": "U-Net 的解码器主要负责特征提取，编码器负责图像重建。（×）"}, {"type": "p", "text": "深度学习 CV 相比传统 CV，对数据量的需求更低，泛化能力更强。（×）"}, {"type": "p", "text": "7-"}, {"type": "p", "text": "8-临床智能辅助诊断"}, {"type": "p", "text": "（一）知识工程与专家系统"}, {"type": "p", "text": "知识层级关系：数据→信息→知识→智慧"}, {"type": "p", "text": "数据：原始素材（如孤立的体温数值、手机号）。"}, {"type": "p", "text": "信息：加工后有逻辑的数据（如 “小张体温 36.8℃”）。"}, {"type": "p", "text": "知识：从信息中提炼的有价值结论（如 “腋下体温正常范围 36~37℃”）。"}, {"type": "p", "text": "智慧：具备预测能力的高阶认知。"}, {"type": "p", "text": "知识工程的起源：1977 年斯坦福大学费根鲍姆（Edward Feigenbaum）提出，围绕专家系统开发，使 AI 从理论转向应用。"}, {"type": "p", "text": "专家系统核心：挖掘特定领域专家知识，通过推理引擎模拟专家思维，辅助决策（如 1976 年斯坦福大学 MYCIN 系统，诊断细菌感染并推荐抗生素）。"}, {"type": "p", "text": "（二）临床智能辅助诊断技术（重点）"}, {"type": "p", "text": "核心定义：融合 AI 技术、医学知识工程与临床诊疗，模拟医生思维与推理，辅助出具诊断结论和治疗策略。"}, {"type": "p", "text": "系统分类及对比"}, {"type": "p", "text": "类型 核心侧重 优势"}, {"type": "p", "text": "医学专家系统 收集专家经验、模拟专家推理方式 贴合临床专家思维，易理解沟通"}, {"type": "p", "text": "临床决策支持系统（CDSS） 从临床数据、文献中主动获取知识 弥补医生知识局限，降低成本、提升质量"}, {"type": "p", "text": "医疗领域核心痛点："}, {"type": "p", "text": "依赖医生经验，误诊漏诊率较高；优质医疗资源分布不均，医生缺口大；专科医生培养周期长，经验参差不齐；医疗成本偏高，重复诊疗普遍。"}, {"type": "p", "text": "“五个正确” 理论框架：正确的信息（RI）、正确的人员（RP）、正确的形式（RIF）、正确的渠道（RC）、正确的时间（RT），确保辅诊系统精准赋能临床。"}, {"type": "p", "text": "（三）诊断效果量化评估策略（难点）"}, {"type": "p", "text": "核心评估指标（基于诊断四格表）"}, {"type": "p", "text": "四格表核心定义：真阳性（TP）：患病且辅诊阳性；真阴性（TN）：未患病且辅诊阴性；假阳性（FP）：未患病但辅诊阳性；假阴性（FN）：患病但辅诊阴性。"}, {"type": "p", "text": "关键公式："}, {"type": "p", "text": "敏感度（TPR）= TP/(TP+FN)（患病者中辅诊阳性率，反映 “不漏诊” 能力）；"}, {"type": "p", "text": "特异度（TNR）= TN/(TN+FP)（未患病者中辅诊阴性率，反映 “不误诊” 能力）；"}, {"type": "p", "text": "准确率（ACC）= (TP+TN)/ 总样本数（全局判断正确率）；"}, {"type": "p", "text": "假阳率（FPR）= 1 - 特异度；假阴率（FNR）= 1 - 敏感度。"}, {"type": "p", "text": "ROC 曲线与 AUC"}, {"type": "p", "text": "ROC 曲线：以假阳率（FPR）为横轴、敏感度（TPR）为纵轴，反映不同阈值下的诊断权衡。"}, {"type": "p", "text": "AUC（曲线下面积）：量化诊断区分能力，AUC 越接近 1 效果越好："}, {"type": "list", "items": ["9~0.99：优秀；0.8~0.89：良好；0.7~0.79：一般；0.5~0.69：较差；<0.5：需重新定义阴阳属性。"]}, {"type": "p", "text": "为何需敏感度 / 特异度：准确率（ACC）易受样本分布影响（如罕见病样本少，ACC 可能虚高），而敏感度 / 特异度分别聚焦患病与未患病群体，评估更精准。"}, {"type": "p", "text": "（四）伦理问题与典型案例"}, {"type": "p", "text": "核心伦理原则：AI 是 “医生助手” 而非 “替代者”，坚守 “以患者为中心”。"}, {"type": "p", "text": "关键伦理与安全问题："}, {"type": "p", "text": "技术层面：减少算法偏见，保障数据安全；"}, {"type": "p", "text": "制度层面：明确责任划分，完善知情同意流程；"}, {"type": "p", "text": "临床层面：避免过度依赖 AI，保留医生最终决策权。"}, {"type": "h", "level": 3, "id": "s7", "text": "单选题"}, {"type": "p", "text": "以下属于知识的是（ ）"}, {"type": "p", "text": "A. 36.8 37.0 37.5 15563758889；B. 小张的体温是 36.8°，小李的体温是 37.0°，小王的体温是 37.5°；C. 腋下体温正常范围为 36~37℃，超过 37.3℃称为发热；D. 小明的手机号是 15563758889"}, {"type": "p", "text": "计算类考点（高频难点）"}, {"type": "p", "text": "对 300 名前列腺增生症状患者进行 MRI-AI 辅诊，穿刺活检结果如下表，计算辅诊的敏感度、特异度和准确率。"}, {"type": "table", "head": ["辅诊结果", "癌变（患病）", "未癌变（未患病）", "总计"], "rows": [["阳性", "160（TP）", "10（FP）", "170"], ["阴性", "20（FN）", "110（TN）", "130"], ["总计", "180", "120", "300"]]}, {"type": "p", "text": "敏感度 = TP/(TP+FN) = 160/(160+20)≈0.889（88.9%）；"}, {"type": "p", "text": "特异度 = TN/(TN+FP) = 110/(110+10)≈0.917（91.7%）；"}, {"type": "p", "text": "准确率 = (TP+TN)/ 总样本数 = (160+110)/300=0.9（90%）。"}, {"type": "p", "text": "答案：敏感度约 88.9%，特异度约 91.7%，准确率 90%。"}, {"type": "p", "text": "9-医学影像信息学"}, {"type": "p", "text": "==（一）医学影像信息学基本概念=="}, {"type": "p", "text": "定义：医学影像学与信息科学的交叉学科，以信息科学方法解决医学影像学问题，覆盖影像获取、处理、分析、存储、传输全链条，核心是提升影像信息使用价值。"}, {"type": "p", "text": "影像链环节：图像获取→存储→网络传输→显示→分析解释→处理→管理。"}, {"type": "p", "text": "四大核心成像技术"}, {"type": "table", "head": ["成像技术", "适用场景", "核心缺点"], "rows": [["超声（US）", "腹盆腔脏器、甲状腺、乳腺、胎儿、心血管等", "受气体、骨骼阻碍，不适合肺、消化道、骨骼检查"], ["CT", "骨与关节、呼吸、心血管、神经系统等，放疗定位", "辐射剂量大，软组织病灶检测能力差"], ["MRI", "神经系统、肌肉系统、腹盆腔脏器等", "显示钙化 / 骨皮质差，体内金属异物禁用，成像慢、造价高"], ["PET（核医学）", "肿瘤良恶性判断、神经系统疾病、心肌缺血定位", "特异性待提高，需经验，费用高、有辐射"]]}, {"type": "p", "text": "医学影像特点：维数多（2D/3D/4D）、数据量大（不同模态存储需求差异显著）、信息量大（含结构、功能、代谢等多类信息）。"}, {"type": "p", "text": "发展趋势：多信息（形态 / 功能融合）、多模态（如 PET/CT）、多尺度（宏观 / 微观融合）。"}, {"type": "p", "text": "==（二）PACS 系统（重点 + 核心考点）=="}, {"type": "p", "text": "定义：影像存储与通信系统（Picture Archiving and Communication Systems），整合数字图像技术、计算机与通信技术，实现影像的采集、存储、传输、显示、处理与集成。"}, {"type": "p", "text": "核心组成：影像采集设备（CT、MRI 等）、影像数据存储中心、影像工作站、附属设备（胶片打印、光盘刻录）。"}, {"type": "p", "text": "分类：科级 PACS（部门内使用）、院级 PACS（全院覆盖，融合 HIS）、区域级 PACS（跨医院，支持远程放射学）。"}, {"type": "p", "text": "与 RIS/HIS 的关系："}, {"type": "p", "text": "RIS（放射信息系统）：管理放射科工作流程（预约、分诊、报告），记录文本信息。"}, {"type": "p", "text": "HIS（医院信息系统）：医院综合管理系统，追踪患者诊疗全流程信息。"}, {"type": "p", "text": "三者整合：PACS 负责影像数据，RIS 负责放射科流程，HIS 负责全院诊疗信息，实现数据互通。"}, {"type": "p", "text": "窗技术（核心难点）："}, {"type": "p", "text": "窗宽（WW）：CT 图像显示的 CT 值范围，增大窗宽→显示组织结构增多→组织间对比度下降；减小窗宽→显示结构减少→对比度上升。"}, {"type": "p", "text": "窗位（WC/WL）：窗的中心位置，窗宽不变时，窗位增高→影像同一部位变暗；窗位降低→影像变亮。"}, {"type": "p", "text": "作用：适配不同密度组织的显示需求（如肺窗、纵隔窗、骨窗）。"}, {"type": "p", "text": "==（三）医学影像信息学进展=="}, {"type": "p", "text": "核心方向："}, {"type": "p", "text": "AI 与深度学习应用：覆盖影像工作流管理、成像、诊断、报告生成，辅助胰腺囊性肿瘤分层诊断等。"}, {"type": "p", "text": "多模态与精准医学：融合多模态影像定位解剖 / 生物活性靶区，支撑精准治疗。"}, {"type": "p", "text": "工作流程优化：通过 3D 建模、智能摆位、运动监测提升扫描效率。"}, {"type": "p", "text": "数据安全与隐私保护：涵盖系统设备安全、数据加密、访问控制、合规性（HIPAA/GDPR）。"}, {"type": "h", "level": 3, "id": "s8", "text": "单选题"}, {"type": "p", "text": "一套 CT 数据共 20 层图像，每层行、列各有 512 个像素，如果每个像素占 12 位 (bit) 空间，求这套 CT 数据占用空间多大？（注：1B=8bits，1KB=1024B）"}, {"type": "p", "text": "A. 5120 KB；B. 7680 KB；C. 3840 KB；D. 2560 KB"}, {"type": "p", "text": "解析步骤："}, {"type": "p", "text": "单张图像数据量 = 像素数 × 每个像素位数 = 512×512×12 bit；"}, {"type": "p", "text": "20 层总数据量 = 20×512×512×12 bit；"}, {"type": "p", "text": "转换为字节（B）：总数据量 ÷8=20×512×512×12÷8 = 20×512×512×1.5 = 7,864,320 B；"}, {"type": "p", "text": "转换为 KB：7,864,320 ÷ 1024 = 7680 KB"}, {"type": "h", "level": 3, "id": "s9", "text": "判断题"}, {"type": "p", "text": "PACS 中增大窗宽，图像上可显示的解剖结构增多，组织间对比度下降（ ）A. 正确；B. 错误"}, {"type": "p", "text": "PACS 中窗宽不变，窗位增高，影像中同一部位变亮（ ）A. 正确；B. 错误"}, {"type": "h", "level": 3, "id": "s10", "text": "多选题"}, {"type": "p", "text": "以下属于四大核心医学成像技术的有（ ）"}, {"type": "p", "text": "A. 超声（US）；B. CT；C. MRI；D. PET；E. 光学成像"}, {"type": "p", "text": "PACS 系统的分类包括（ ）"}, {"type": "p", "text": "A. 科级 PACS；B. 院级 PACS；C. 区域级 PACS；D. 国家级 PACS"}, {"type": "p", "text": "以下关于 MRI 的描述正确的有（ ）"}, {"type": "p", "text": "A. 无放射性；B. 适合观察骨折；C. 体内有金属异物禁用；D. 成像速度快"}, {"type": "p", "text": "10-医学影像智能分析"}, {"type": "p", "text": "==（一）影像组学策略（重点）=="}, {"type": "p", "text": "起源与定义"}, {"type": "p", "text": "由 Philip Lambin 与 Robert J. Gillies 合作提出，核心是将常规医学影像转化为==高通量定量特征空间==，通过自动提取特征构建预测模型，实现疾病个体化诊疗（诊断、疗效评估、预后预测），核心理念 “Meten is weten（测量即知）”。"}, {"type": "p", "text": "关键文献：2012 年《Eur J Cancer》、2014 年《Nat Comm》、2017 年《Nat Rev Clin Oncol》等奠定领域基础。"}, {"type": "p", "text": "核心流程（四步闭环）"}, {"type": "p", "text": "感兴趣区（VOI）分割：人工或自动勾勒目标区域（如肿瘤）。"}, {"type": "p", "text": "特征提取（核心考点）："}, {"type": "p", "text": "形态特征：长径、短径、面积、体积、形状指数等（与图像灰度无关，仅依赖目标区域形状和大小）。"}, {"type": "p", "text": "灰度直方分布特征（一阶统计）：最大值、最小值、均值、标准差、偏度、峰度、熵等。"}, {"type": "p", "text": "纹理特征（二阶 / 高阶统计）：以 GLCM（灰度共生矩阵）为核心，涵盖 0°/45°/90°/135° 四个方向，衍生对比度、相关性等 26 个指标；还包括 GLRLM、GLSZM 等。"}, {"type": "p", "text": "特征筛选：剔除冗余特征（如 RFE-SVM 方法），提升模型效率。"}, {"type": "p", "text": "建模评估：采用回归（LASSO、线性回归）、分类（SVM、决策树）算法，通过 ROC/AUC 验证性能。"}, {"type": "p", "text": "局限性"}, {"type": "p", "text": "数据集规模有限，收集难度大；"}, {"type": "p", "text": "易受成像设备、参数及标注质量影响；"}, {"type": "p", "text": "临床落地效率偏低。"}, {"type": "p", "text": "==（二）深度学习策略（难点）=="}, {"type": "p", "text": "技术起源：2006 年 Geoffrey Hinton 通过《Science》《Neural Computation》论文提出深度学习理论，开启端到端影像分析时代。"}, {"type": "p", "text": "经典架构与应用"}, {"type": "p", "text": "基础 CNN 架构：LeNet（手写体识别）、AlexNet（ILSVRC 竞赛突破）、VGG（小卷积核堆叠）、ResNet（残差连接解决梯度消失）。"}, {"type": "p", "text": "医学影像专用架构：U-Net（2015 年提出，生物医学分割标杆）及变体（稀释卷积 U-Net、形状与内容注意力 U-Net）。"}, {"type": "p", "text": "典型临床案例：膀胱癌 MRI 分割：注意力 U-Net 模型，肿瘤分割精度达 84%；胰腺癌早期筛查：端到端深度学习模型，通过平扫 CT 实现胰腺及肿瘤分割与良恶性鉴别；胰腺囊性肿瘤分层诊断：多中心验证 CT 深度学习模型，提升分型准确率。"}, {"type": "p", "text": "核心优势"}, {"type": "p", "text": "自动提取特征，无需人工设计；"}, {"type": "p", "text": "端到端建模，效率高；"}, {"type": "p", "text": "适配大规模数据，泛化能力强。"}, {"type": "p", "text": "==（三）影像智能分析应用=="}, {"type": "p", "text": "聚焦肿瘤领域三大核心场景："}, {"type": "p", "text": "诊断：肿瘤病理分型、术前转移判断（如淋巴结转移预测）；"}, {"type": "p", "text": "疗效评估：辅助判断治疗响应，避免过度治疗；"}, {"type": "p", "text": "预后预测：预测患者总生存期、治疗后复发风险。"}, {"type": "h", "level": 3, "id": "s11", "text": "单选题"}, {"type": "p", "text": "以下关于影像组学的论述，不正确的是（）"}, {"type": "p", "text": "A. 从常规医学影像中充分挖掘高通量特征属于影像组学范畴；B. 影像组学的目的之一即为测量即知；C. 影像组学的最终目标是疾病诊断；D. 在预测建模中，通常基于机器学习方法进行"}, {"type": "p", "text": "以下关于形态学特征的说法，不正确的是（）"}, {"type": "p", "text": "A. 与图像灰度无关；B. 与图像目标区域形状有关；C. 与目标区域的纹路有关；D. 与目标区域的大小有关"}, {"type": "p", "text": "关于灰度直方分布特征，说法正确的是（）"}, {"type": "p", "text": "A. 最大长径尺度属于该特征类别；B. 灰度标准差属于该特征类别；C. 灰度均值不属于该特征类型；D. 与目标区域的大小有关"}, {"type": "p", "text": "==（二）计算题=="}, {"type": "p", "text": "形态特征计算"}, {"type": "p", "text": "已知 ADC 图中 pixel spacing=5mm，根据二值化图像（1 表示目标区域），计算长径、短径、面积。"}, {"type": "p", "text": "二值化图像（部分）："}, {"type": "table", "head": ["0", "1", "0"], "rows": [["0", "1", "0"], ["1", "", ""], ["1", "", ""], ["0", "1", ""]]}, {"type": "p", "text": "解析步骤："}, {"type": "p", "text": "长径：目标区域最长像素跨度 ×pixel spacing=13×5=65mm；"}, {"type": "p", "text": "短径：目标区域最短像素跨度 ×pixel spacing=6×5=30mm；"}, {"type": "p", "text": "面积：（有效像素数）×（pixel spacing）²=（6×13-13）×0.25=16.25mm²（或直接统计 1 的个数 ×25mm²）。"}, {"type": "p", "text": "GLCM 矩阵构建"}, {"type": "p", "text": "已知 6×6 图像灰度值，填充 0°GLCM 矩阵中缺失元素。"}, {"type": "p", "text": "图像灰度值："}, {"type": "table", "head": ["1", "2", "1", "5", "4", ""], "rows": [["2", "1", "4", "2", "4", "5"], ["1", "2", "3", "5", "1", "3"]]}, {"type": "p", "text": "解析关键：0° 方向指水平相邻像素对，统计每对灰度值（i,j）出现次数，如（1,2）出现 5 次，（2,1）出现 3 次，按灰度级（1-5）填充矩阵。"}, {"type": "p", "text": "==（四）实操类考点=="}, {"type": "p", "text": "已知数字图像灰度值，绘制 0°/45°GLCM 矩阵并计算对比度。"}, {"type": "p", "text": "核心步骤："}, {"type": "p", "text": "确定相邻方向（0° 水平、45° 对角线）；"}, {"type": "p", "text": "统计所有相邻像素对（i,j）的出现频次，构建 GLCM 矩阵；"}, {"type": "p", "text": "按公式计算对比度："}, {"type": "p", "text": "11-生物信息与智能分析"}, {"type": "p", "text": "==（一）生物信息学概述=="}, {"type": "p", "text": "定义与交叉属性"}, {"type": "p", "text": "交叉学科：融合生物学、信息学、数学、计算机科学，研究生物数据的获取、存储、分析与解读。"}, {"type": "p", "text": "狭义定义：应用信息科学理论方法管理、分析生物数据；广义定义：研究生物体系中信息的存储、内涵与传递。"}, {"type": "p", "text": "权威定义：NIH 强调 “计算工具处理生物 / 医学数据”；人类基因组计划明确 “涵盖数据全流程，综合多学科工具阐述生物数据意义”。"}, {"type": "p", "text": "发展历程关键节点"}, {"type": "p", "text": "1953 年：沃森与克里克发现 DNA 双螺旋结构，奠定分子生物学基础。"}, {"type": "p", "text": "1987 年：Dr. Lin 正式命名 “生物信息学（Bioinformatics）”。"}, {"type": "p", "text": "20 世纪 90 年代：人类基因组计划启动，推动学科体系完善。"}, {"type": "p", "text": "2022 年：《Science》发布完整人类基因组序列（T2T-CHM13），补全 8% 缺口。"}, {"type": "p", "text": "2023 年：首个人类泛基因组参考图谱发布，整合 47 人数据反映人类多样性。"}, {"type": "p", "text": "核心任务与组学数据"}, {"type": "p", "text": "主要任务：数据收集管理（依赖 GenBank、GSA 等数据库）、分析工具开发、基因组装（Overlap→Layout→Consensus 三步法）。"}, {"type": "p", "text": "核心组学数据："}, {"type": "p", "text": "基因组：有机体完整基因集合，由 DNA 全序列决定（数据库：GenBank、GSA、ENA）。"}, {"type": "p", "text": "转录组：特定条件下细胞内所有转录产物（mRNA + 非编码 RNA）。"}, {"type": "p", "text": "蛋白质组：基因组编码的全部蛋白质，研究表达水平、翻译后修饰及蛋白相互作用。"}, {"type": "p", "text": "==（二）生物序列相似性比对（重点 + 难点）=="}, {"type": "p", "text": "序列变异类型"}, {"type": "p", "text": "DNA 复制常见错误：SNP（单核苷酸多态性）、插入（INSERT）、缺失（DELETE）。"}, {"type": "p", "text": "核心概念"}, {"type": "p", "text": "序列比对：比较两个 / 多个生物序列（核酸 / 氨基酸）的相似性与差异性，基于记分规则评估。"}, {"type": "p", "text": "同源性前提：假设序列源于共同祖先，“同源一定相似，相似不一定同源”。"}, {"type": "p", "text": "同源类型："}, {"type": "p", "text": "直系同源：不同物种中垂直进化（物种形成）而来，保留原始功能。"}, {"type": "p", "text": "旁系同源：同一物种中基因复制产生，可能进化出新的相关功能。"}, {"type": "p", "text": "核心算法：Needleman-Wunsch 算法（全局比对）"}, {"type": "p", "text": "定义：计算两个序列的最长公共子序列（LCS），量化相似性。"}, {"type": "p", "text": "核心公式："}, {"type": "p", "text": "若序列 A 的第 i 个元素 = 序列 B 的第 j 个元素（ai=bj），则 LCS (i,j)=LCS (i-1,j-1)+1。"}, {"type": "p", "text": "若 ai≠bj，则 LCS (i,j)=Max (LCS (i-1,j-1), LCS (i,j-1), LCS (i-1,j))。"}, {"type": "p", "text": "算法步骤：初始化 LCS 矩阵→填充矩阵计算得分→回溯矩阵获取匹配字符串。"}, {"type": "p", "text": "实例：A=GGATCGA，B=GAATTCAGTTA，计算得 LCS (A,B)=6。"}, {"type": "p", "text": "==（三）生物信息智能分析（应用）=="}, {"type": "p", "text": "核心应用场景"}, {"type": "p", "text": "多模态数据整合：融合组学数据、影像数据、临床数据，通过 AI 算法支撑肿瘤精准诊疗（如 Tempus AI 平台）。"}, {"type": "p", "text": "肿瘤 MRD 检测：AI 提升微小残留病灶检测灵敏度，将模糊预警转化为可量化决策指标。"}, {"type": "p", "text": "多癌早筛：通过 cfDNA（循环游离 DNA）甲基化分析 + 机器学习，实现癌症信号检测与起源预测。"}, {"type": "h", "level": 3, "id": "s12", "text": "单选题"}, {"type": "p", "text": "以下属于旁系同源序列的是（ ）"}, {"type": "p", "text": "A. 人血红蛋白基因与小鼠血红蛋白基因；B. 人胰岛素基因与人大肠杆菌胰岛素基因；C. 人 α- 珠蛋白基因与人 β- 珠蛋白基因；D. 人肌动蛋白基因与酵母肌动蛋白基因"}, {"type": "p", "text": "DNA 复制过程中，单个核苷酸发生替换的变异类型是（ ）"}, {"type": "p", "text": "A. SNP；B. 插入；C. 缺失；D. 易位"}, {"type": "p", "text": "序列 A=GGATCGA 与序列 B=GAATTCAGTTA 的最长公共子序列（LCS）长度为（ ）"}, {"type": "p", "text": "A. 4；B. 5；C. 6；D. 7"}, {"type": "p", "text": "以下不属于基因组数据库的是（ ）"}, {"type": "p", "text": "A. GenBank；B. GSA；C. UniProtKB；D. ENA"}, {"type": "h", "level": 3, "id": "s13", "text": "计算题"}, {"type": "p", "text": "已知序列 A=GATC，序列 B=GACT，使用 Needleman-Wunsch 算法计算 LCS (A,B)，并写出回溯后的匹配字符串。"}, {"type": "p", "text": "解析步骤："}, {"type": "p", "text": "初始化 4×4 LCS 矩阵（A 长度 4，B 长度 4），第一行、第一列均为 0。"}, {"type": "p", "text": "填充矩阵："}, {"type": "p", "text": "LCS(1,1)=1（G=G）；LCS(1,2)=1（G≠A）；LCS(1,3)=1（G≠C）；LCS(1,4)=1（G≠T）。"}, {"type": "p", "text": "LCS(2,1)=1（A≠G）；LCS(2,2)=2（A=A）；LCS(2,3)=2（A≠C）；LCS(2,4)=2（A≠T）。"}, {"type": "p", "text": "LCS(3,1)=1（T≠G）；LCS(3,2)=2（T≠A）；LCS(3,3)=2（T≠C）；LCS(3,4)=3（T=T）。"}, {"type": "p", "text": "LCS(4,1)=1（C≠G）；LCS(4,2)=2（C≠A）；LCS(4,3)=3（C=C）；LCS(4,4)=3（C≠T）。"}, {"type": "p", "text": "回溯：从 LCS (4,4)=3 出发，回溯路径为 (4,4)→(3,4)→(2,2)→(1,1)，匹配字符串为 A: GAT_，B: GA_CT（或等价匹配）。"}, {"type": "p", "text": "答案：LCS (A,B)=3，匹配字符串示例：A: GAT_，B: GA_CT。"}, {"type": "p", "text": "12-人工智能与药物研发"}, {"type": "p", "text": "==（一）药物研发过程及其挑战=="}, {"type": "p", "text": "药物分类"}, {"type": "p", "text": "主要类型：小分子药、抗体药、多肽药、核酸药（化学药与生物制品两大类），物理类药物治疗为补充。"}, {"type": "p", "text": "核心差异：结构复杂度、作用机制不同（如小分子药穿透性强，抗体药特异性高）。"}, {"type": "p", "text": "传统研发全流程"}, {"type": "p", "text": "新药发现阶段：靶标确认（离子通道、酶、受体等生物大分子）→ 先导化合物鉴别（天然活性物质为主，如青蒿素来自黄花蒿、喜树碱来自喜树）→ 先导化合物优化（结构修饰解决生物利用度 / 毒性问题，如蒿甲醚优化青蒿素）。"}, {"type": "p", "text": "新药开发阶段：临床前研究（药理学、毒理学等）→ 临床试验（I 期：20-100 人，安全性；II 期：数百人，有效性；III 期：数百 - 数千人，疗效与剂量）→ 注册上市→ 临床 IV 期（上市后监测）。"}, {"type": "p", "text": "核心挑战（“双十” 困境）"}, {"type": "p", "text": "周期长：平均 10-15 年。"}, {"type": "p", "text": "成本高：平均 15 亿美元 / 种新药。"}, {"type": "p", "text": "失败率高：I 期成功率 45%、II 期 30%、III 期仅 5-10%，任一环节失败即终止。"}, {"type": "p", "text": "==（二）智能药物研发（重点 + 难点）=="}, {"type": "p", "text": "核心支撑：研发大数据与关键数据库"}, {"type": "table", "head": ["数据类型", "代表数据库"], "rows": [["靶点数据库", "RSCB-PDB、Uniprot、Binding DB"], ["化合物数据库", "PubChem、ChEMBL、ZINC、DrugBank"], ["药性毒性数据库", "PKPB-DB、SIDER、T3DB、pkCSM"], ["临床数据库", "ClinicalTrials.gov、PharmaGKB"]]}, {"type": "p", "text": "智能辅助技术全流程应用"}, {"type": "p", "text": "靶点筛选："}, {"type": "p", "text": "算法：模块检测（Louvain/DIAMOnD）、决策树（特征选择→分类）、深度学习（GCN、GAN，整合多组学数据）。"}, {"type": "p", "text": "优势：解决多组学数据联合分析难题，精准快速筛选潜在靶点（如阿兹海默症靶点预测）。"}, {"type": "p", "text": "化合物设计优化："}, {"type": "p", "text": "自上而下：从药物表型（如副作用）推断相互作用（例：Campillos 等人通过 Side-Effect Similarity 发现 13 种新药物 - 靶点关系）。"}, {"type": "p", "text": "自下而上（De novo Drug Design）：从头生成类药物分子（例：Stokes 用GAN+AMPredictor 发现广谱抗菌肽 P076，兼具抗病毒活性）。"}, {"type": "p", "text": "关键工具：AlphaFold 系列（2024 诺奖相关）："}, {"type": "p", "text": "AlphaFold1（2020）：蛋白质结构预测，依赖 MSA。"}, {"type": "p", "text": "AlphaFold2（2021）：原子级精度，CASP 大赛突破。"}, {"type": "p", "text": "AlphaFold3（2024）：预测蛋白质、DNA、RNA、配体等多分子结构，准确率 90.1 GDT，开放源代码。"}, {"type": "p", "text": "药性毒性预测："}, {"type": "p", "text": "核心指标：ADMET（吸收 Absorption、分布 Distribution、代谢 Metabolism、排泄 Excretion、毒性 Toxicity）。"}, {"type": "p", "text": "工具：ADMETlab 2.0（MGA 框架）、ADMETlab 3.0（DMPNN 架构，支持 API、不确定性评估）。"}, {"type": "p", "text": "临床验证："}, {"type": "p", "text": "核心痛点：90% 临床试验招募延迟，27% 因招募失败搁浅。"}, {"type": "p", "text": "AI 解决方案：Deep 6 AI 等工具快速匹配被试，提升招募效率。"}, {"type": "p", "text": "==（三）发展前景（了解）=="}, {"type": "p", "text": "核心方向：AI 虚拟细胞（多模态数据整合，分子 - 细胞 - 多细胞尺度建模）、数字孪生（个体化诊疗）、生成式 AI 全流程赋能。"}, {"type": "p", "text": "延伸应用：AI 辅助药品供应、调配、处方审核、个体化给药、不良反应监测。"}, {"type": "h", "level": 3, "id": "s14", "text": "单选题"}, {"type": "p", "text": "以下不属于药物研发 “双十” 困境的是（ ）"}, {"type": "p", "text": "A. 研发周期约 10-15 年；B. 平均成本 15 亿美元；C. III 期临床试验成功率 5-10%；D. 仅针对小分子药研发"}, {"type": "p", "text": "AlphaFold3 相比前两代的核心突破是（ ）"}, {"type": "p", "text": "A. 仅能预测蛋白质结构；B. 可预测 DNA、RNA、配体等多分子相互作用；C. 依赖冷冻电镜数据；D. 准确率不足 80%"}, {"type": "p", "text": "ADMET 中 “M” 代表的是（ ）"}, {"type": "p", "text": "A. 吸收；B. 代谢；C. 排泄；D. 毒性"}, {"type": "p", "text": "以下属于化合物数据库的是（ ）"}, {"type": "p", "text": "A. Uniprot；B. PubChem；C. ClinicalTrials.gov；D. SIDER"}, {"type": "h", "level": 3, "id": "s15", "text": "判断题"}, {"type": "p", "text": "ADMETlab 3.0 相比 2.0 新增 API 功能和不确定性评估，支持更多 ADMET endpoints（√）"}, {"type": "p", "text": "解析：ADMETlab 3.0 升级 DMPNN 架构，扩大数据量（40 万 + 条目），新增 API 和不确定性筛选，覆盖更多理化性质、吸收、毒性指标。"}, {"type": "p", "text": "先导化合物仅来源于天然活性物质，无法通过 AI 从头设计（错）"}, {"type": "p", "text": "解析：先导化合物传统来源为天然物质，但 AI 可通过 De novo Drug Design 从头生成（自下而上思路），如 Stokes 的抗菌肽设计。"}, {"type": "p", "text": "13-智能健康管理"}, {"type": "p", "text": "==（一）健康管理的内涵（基础）=="}, {"type": "p", "text": "健康定义：WHO 宪章明确 “肉体、精神和社会生活的完好状态，而非仅无疾病”。"}, {"type": "p", "text": "健康管理定义：对个人 / 群体健康全面监测、分析、评估，提供咨询指导并干预危险因素（《健康管理师》定义）。"}, {"type": "p", "text": "发展历程："}, {"type": "p", "text": "起源：1918 年美国大企业为减少医保支出开展员工健康管理；1929 年蓝十字蓝盾首次提出概念；1969 年 HMO 纳入美国医保；1971 年美国立法规范。"}, {"type": "p", "text": "国内现状：2001 年首家健康管理公司注册；2005 年健康管理师成为新职业；国家基本公共卫生服务含 14 项内容，2024 年人均财政补助 94 元 / 人。"}, {"type": "p", "text": "基本流程：健康体检（基础）→ 健康评估（手段）→ 健康干预（关键）→ 健康促进（目的），正从被动管理向主动自我管理转型。"}, {"type": "p", "text": "==（二）医疗物联网（IoMT）（重点）=="}, {"type": "p", "text": "定义：基于 5G 与 IoT 技术，由医疗设备、软件、服务系统组成的连接基础设施。"}, {"type": "p", "text": "核心架构（三层）："}, {"type": "p", "text": "感知层：数据采集，含 RFID 标签、紧急求助按钮、监测终端、可穿戴设备，核心技术为光学、压敏、RFID。"}, {"type": "p", "text": "传输层：数据通信，分有线（专线）与无线（4G/5G、Wi-Fi、蓝牙、ZigBee 等），无线网络为主流。"}, {"type": "p", "text": "应用层：数据分析处理，涵盖体征监测、急救调度、人员定位、药品管理等场景。"}, {"type": "p", "text": "可穿戴设备：代表产品有华为 Watch D/D2（血压）、金亿帝血压手表、Dexcom G6（血糖）、动态心电图监测仪，缺陷为电池续航短、安全性不足、功能集成度低。"}, {"type": "p", "text": "==（三）非接触健康监测（难点）=="}, {"type": "p", "text": "体温监测：基于红外技术，如额温枪、热成像仪，文献 Foster et al.（2021）通过眼内角温度区分发热（38.6℃）与健康（35℃）。"}, {"type": "p", "text": "心率监测：基于 rPPG（远程光电容积脉搏波），文献 Yu et al.（2019）用时空网络从面部视频提取信号，核心算法含 3D-CNN、LSTM，评估指标 RMSE、R 值。"}, {"type": "p", "text": "呼吸频率监测：Hwang et al.（2021）提出 1D 卷积神经网络，通过 RGB 相机识别呼吸相关像素，准确率 R²=0.9986。"}, {"type": "p", "text": "血氧饱和度监测：Shao et al.（2016）基于双波长成像系统，利用 Hb 与 HbO₂的光吸收差异，通过公式 SpO₂=k×RR+b 计算，RR 为吸光度比值。"}, {"type": "p", "text": "==（四）非接触心理监测（应用）=="}, {"type": "p", "text": "核心技术：基于眼动追踪、头部姿态、音频特征，结合 Transformer、CNN、随机森林算法。"}, {"type": "p", "text": "测评系统："}, {"type": "p", "text": "眼动仪：提取注视位置、时长、扫描路径，评估认知能力、情绪状态。"}, {"type": "p", "text": "VR 测评：结合 MMPI 情绪视频库，通过 Pico VR 采集数据，生成心理健康指数与建议。"}, {"type": "p", "text": "人格预测：融合情感知识图谱，预测大五人格（宜人性、尽责性等），准确率达 0.9+。"}, {"type": "h", "level": 3, "id": "s16", "text": "单选题"}, {"type": "p", "text": "医疗物联网中负责数据采集的是哪一层？（ ）"}, {"type": "p", "text": "A. 感知层；B. 传输层；C. 应用层；D. 网络层"}, {"type": "p", "text": "以下哪种非接触监测技术基于远程光电容积脉搏波（rPPG）？（ ）"}, {"type": "p", "text": "A. 红外体温监测；B. 面部视频心率监测；C. RGB 相机呼吸监测；D. 双波长血氧监测"}, {"type": "p", "text": "国家基本公共卫生服务 2024 年人均财政补助标准是（ ）"}, {"type": "p", "text": "A. 40 元；B. 94 元；C. 25 元；D. 80 元"}, {"type": "p", "text": "解析：补助标准从 2010 年前 25 元逐步提升，2024 年达 94 元 / 人。"}, {"type": "h", "level": 3, "id": "s17", "text": "多选题"}, {"type": "p", "text": "医疗物联网传输层的无线传输方式包括（ ）"}, {"type": "p", "text": "A. 5G；B. Wi-Fi；C. ZigBee；D. 专线网络"}, {"type": "p", "text": "非接触健康监测涵盖的指标有（ ）"}, {"type": "p", "text": "A. 体温；B. 心率；C. 呼吸频率；D. 血氧饱和度"}, {"type": "p", "text": "14-大模型"}, {"type": "p", "text": "==（一）大模型发展历程（基础）=="}, {"type": "p", "text": "四大阶段："}, {"type": "p", "text": "早期探索（1986-2016）：RNN（1986）、LSTM（1997），存在长序列依赖、梯度消失问题。"}, {"type": "p", "text": "起步阶段（2017-2019）：Transformer 架构（2017，自注意力机制），奠定大模型基础。"}, {"type": "p", "text": "快速发展（2020-2023）：GPT 系列（GPT-1 至 GPT-4），医疗领域早期探索（IBM Watson、华为盘古）。"}, {"type": "p", "text": "医疗应用期（2023 - 至今）：国内（文心一言医疗版、通义千问）、国外（Med-PaLM 2、Gemini 医疗版）。"}, {"type": "p", "text": "==（二）理论框架与原理（重点）=="}, {"type": "p", "text": "核心框架：输入（Token 化→词嵌入）→ 计算（Transformer 架构）→ 输出（自回归生成）。"}, {"type": "p", "text": "关键技术："}, {"type": "p", "text": "Token 化：将语言拆分为词元，映射为 Token ID 与向量。"}, {"type": "p", "text": "Transformer：自注意力机制（计算 Q 与 K 的点积→缩放→SoftMax→与 V 相乘），多头部注意力提升特征捕捉能力。"}, {"type": "p", "text": "自回归输出：生成词元重新作为输入，逐词预测，确保语义连贯。"}, {"type": "p", "text": "==（三）关键技术（难点）=="}, {"type": "p", "text": "预训练 - 微调：预训练（无标签海量数据，学习通用特征）→ 微调（特定任务小数据，优化性能）。"}, {"type": "p", "text": "多模态对齐：CLIP 算法，使文本、图像等不同模态指代同一语义（如 “肺结节 5mm” 文本与 CT 影像匹配）。"}, {"type": "p", "text": "==（四）医学应用=="}, {"type": "p", "text": "核心场景：病历自动生成（结构化率 98%）、影像诊断、手术方案规划、USMLE 考试（Med-PaLM 2 通过率 85%）、多模态会诊。"}, {"type": "p", "text": "性能特点：GPT-4 在复杂问答中接近人类专家，轻量化微调模型在判别型任务（实体抽取）中占优。"}, {"type": "h", "level": 3, "id": "s18", "text": "单选题"}, {"type": "p", "text": "下列属于多模态对齐应用的是（ ）"}, {"type": "p", "text": "A. 模型根据病历生成 B 超建议；B. 模型识别 CT 影像与 “肺结节 5mm” 为同一病灶；C. 文献翻译；D. 心电图波形分类"}, {"type": "p", "text": "大模型自回归输出的核心循环是（ ）"}, {"type": "p", "text": "A. 输入→计算→输出；B. 输入→生成→再输入→再生成；C. Token 化→词嵌入→输出；D. 预训练→微调→输出"}, {"type": "p", "text": "已知 Q=[2,1]（疼痛），K1=[1,2]（胆囊炎），K2=[0,1]（肺炎），d=2（√d≈1.414），计算注意力原始分数、缩放分数，并判断模型更关注哪个诊断及原因。"}, {"type": "p", "text": "答案：① 原始分数：Q・K1=2×1+1×2=4；Q・K2=2×0+1×1=1；② 缩放分数：4÷1.414≈2.8，1÷1.414≈0.7；③ 更关注 K1（胆囊炎），因缩放分数更高，且医学上疼痛与胆囊炎关联性更强。"}, {"type": "p", "text": "15-具身智能"}, {"type": "p", "text": "==（一）====具身智能====基础理论（重点）=="}, {"type": "p", "text": "定义：通过主动感知与认知物理世界，做出符合人类预期行为响应的 AI 系统，强调自主交互与学习，属于行为主义学派。"}, {"type": "p", "text": "核心要素：感知（CNN、ViT 等）→ 决策（LLM、WMs 等）→ 行动（机器人控制）。"}, {"type": "p", "text": "与 AI 三学派的关系："}, {"type": "p", "text": "行为主义（核心）：智能源于环境交互，代表为强化学习。"}, {"type": "p", "text": "连接主义（方法支撑）：CV 技术（图像感知）。"}, {"type": "p", "text": "符号主义（方法支撑）：NLP 技术（语言理解）。"}, {"type": "p", "text": "==（二）发展历程（基础）=="}, {"type": "p", "text": "三阶段："}, {"type": "p", "text": "早期萌芽（1950s-1990s）：符号主义主导，“逻辑规则 + 机器人” 尝试（如 WABOT-1），形成 AI 三大学派。"}, {"type": "p", "text": "技术积累（1990s-2020s）：行为主义学派 Rodney Brooks 发表《Intelligence without representation》，提出 “感知→行动” 框架；算力、传感器突破，仿生机器人研发。"}, {"type": "p", "text": "技术突破（2022 - 至今）：大模型赋能，人形机器人爆发，迈向通用人工智能（代表：Google PaLM-E、RT2、中国 “天工” 机器人）。"}, {"type": "p", "text": "==（三）研究方法（难点）=="}, {"type": "p", "text": "“道”（算法与模型）："}, {"type": "p", "text": "核心路径：CV/NLP/RL→LLMs/MLLMs→World Models（WMs，世界模型）。"}, {"type": "p", "text": "世界模型：通过无监督学习压缩高维感知，预测未来状态，支持智能体在 “梦境” 中规划（代表：RTFM 生成式世界模型）。"}, {"type": "p", "text": "“器”（硬件与机器人）："}, {"type": "p", "text": "过去：自动化（事先编程，固定环境）。"}, {"type": "p", "text": "现在：大模型 + 机器人（“20 岁大脑 + 1 岁身体”）。"}, {"type": "p", "text": "将来：自主化（自主学习，适应环境变化）。"}, {"type": "p", "text": "挑战：仿真到现实的鸿沟、数据稀疏、泛化性、可解释与安全性。"}, {"type": "p", "text": "==（四）临床应用=="}, {"type": "p", "text": "核心场景："}, {"type": "p", "text": "智能超声检查：FARUS 机器人自动分析 TI-RADS 分级。"}, {"type": "p", "text": "手术室：CARES Copilot 2.0 多模态手术大模型。"}, {"type": "p", "text": "自然腔道介入机器人：支气管镜介入，解决气道泄漏 / 断裂问题。"}, {"type": "p", "text": "虚拟小鼠：模拟真实小鼠行为，预测神经活动。"}, {"type": "h", "level": 3, "id": "s19", "text": "单选题"}, {"type": "p", "text": "具身智能的核心学派归属是（ ）"}, {"type": "p", "text": "A. 符号主义；B. 连接主义；C. 行为主义；D. 融合三大学派无主次"}, {"type": "p", "text": "具身智能发展历程中，提出 “感知→行动” 框架的标志性论文是（ ）"}, {"type": "p", "text": "A. 《Intelligence without representation》；B. 《Learning representations by back-propagating errors》；C. 《Attention Is All You Need》；D. 《World Model》"}, {"type": "p", "text": "16-"}, {"type": "p", "text": "17-医学可用人工智能"}, {"type": "p", "text": "==（一）医学 AI 产品全周期流程（基础）=="}, {"type": "p", "text": "七大关键阶段："}, {"type": "p", "text": "需求分析：明确临床痛点、用户画像、成功标准（如 “县域医院肺结节识别，敏感性≥95%”）。"}, {"type": "p", "text": "数据治理：采集合规、标注质控（Kappa 值）、清洗标准化、隐私保护（脱敏、联邦学习）。"}, {"type": "p", "text": "模型开发：算法选择 + 可解释设计（透明、一致、可验证、可追溯）。"}, {"type": "p", "text": "临床验证：回顾性（历史数据，AUC / 敏感度）与前瞻性（真实环境，临床终点）。"}, {"type": "p", "text": "注册审批：NMPA（12-18 个月，《医疗器械软件审查指导原则》） vs FDA（6-12 个月，SaMD Guidance）。"}, {"type": "p", "text": "临床部署：系统对接（DICOM/HL7）、工作流嵌入、医生培训。"}, {"type": "p", "text": "持续监测：性能漂移、用法漂移、安全事件上报。"}, {"type": "p", "text": "==（二）医学 AI 的可解释理论（难点）=="}, {"type": "p", "text": "两大类型对比："}, {"type": "table", "head": ["维度", "内在可解释（Interpretable）", "事后可解释（Explainable）"], "rows": [["本质", "模型本身为白盒", "黑箱 + 事后解释工具"], ["方法", "线性回归、决策树、CAM", "SHAP、LIME、Grad-CAM"], ["适用场景", "急诊、手术、危急值", "筛查、辅助诊断"]]}, {"type": "p", "text": "核心模型："}, {"type": "p", "text": "内在可解释：Lasso 回归（心梗风险分层）、决策树（头疼检查推荐）、注意力机制可视化（CAM）。"}, {"type": "p", "text": "事后解释：SHAP（特征边际贡献加权平均）、LIME（局部线性近似）、Grad-CAM（图像类 AI 可视化）。"}, {"type": "p", "text": "局限：解释精度与模型性能不可兼得；存在解释悖论（无限追问）。"}, {"type": "p", "text": "==（三）医学 AI 的伦理问题（重点）=="}, {"type": "p", "text": "经典伦理四原则："}, {"type": "p", "text": "不伤害原则：算法偏见导致特定人群伤害（如深肤色皮肤癌漏诊）。"}, {"type": "p", "text": "有利原则：AI 加剧医疗资源不均（三甲 vs 基层）。"}, {"type": "p", "text": "公正原则：训练数据集中于大城市，偏远地区数据缺失。"}, {"type": "p", "text": "尊重自主原则：患者知情权（AI 参与诊断是否告知）。"}, {"type": "p", "text": "具体伦理问题：数据伦理（知情同意伪命题）、算法偏见、责任归属、透明度缺失、医生角色异化。"}, {"type": "p", "text": "==（四）伦理解决策略=="}, {"type": "p", "text": "数据伦理：区块链动态知情同意系统（实时查看数据使用，禁止后续使用）。"}, {"type": "p", "text": "算法偏见：损失函数加入公平性惩罚项（L = 预测错例数 +λ×| 组 1 误差 - 组 2 误差 |）。"}, {"type": "p", "text": "责任归属：强制责任保险（AI 公司 + 医院缴费，医生未复核免赔 50%）。"}, {"type": "p", "text": "透明度：分层告知模型（低危概括、中危具体、高危书面确认）。"}, {"type": "p", "text": "医生异化：人机协同分级制（高置信快速复核、中置信详细复核、低置信独立诊断）。"}, {"type": "h", "level": 3, "id": "s20", "text": "单选题"}, {"type": "p", "text": "下列属于内在可解释模型的是（ ）"}, {"type": "p", "text": "A. 深度学习 + Grad-CAM；B. 随机森林 + LIME；C. 决策树（深度 = 4）；D. XGBoost+SHAP"}, {"type": "p", "text": "急诊心梗风险分层需 30 秒出结果且医生可直理解逻辑，最适合的模型是（ ）"}, {"type": "p", "text": "A. 深度学习集成模型；B. Lasso 回归；C. 梯度提升树 + SHAP；D. CNN+Grad-CAM"}, {"type": "h", "level": 3, "id": "s21", "text": "填空题"}, {"type": "p", "text": "某 AI 预测术后并发症，基准风险 0.20，SHAP 值：术前感染（+0.35）、年龄 55 岁（+0.12）、术后护理达标（-0.18）、手术时长 90 分钟（+0.05）。最终风险值①___，影响最大特征②___，方向③___。"}, {"type": "list", "items": ["0.54（0.20+0.35+0.12-0.18+0.05）；② 术前感染；③ 正向"]}, {"type": "p", "text": "解析：SHAP 值为特征对预测结果的贡献值，总和 + 基准风险即为最终结果，绝对值越大影响越大。"}];</script>
<script>
(function () {
  if (WB.mountChrome) WB.mountChrome('materials');

  var body = document.getElementById('body');
  if (body) body.innerHTML = WB.renderBlocks(window.__DOC_BLOCKS || []);
  if (WB.fx && WB.fx.init) WB.fx.init();

  var base = (window.CDN_BASE || '').replace(/\/+$/, '');
  var prefix = window.CDN_PREFIX || '';
  var dl = document.getElementById('dgDl');
  if (base && /^https?:/.test(base) && dl && dl.getAttribute('data-key')) {
    dl.href = base + '/' + prefix + dl.getAttribute('data-key').split('/').map(encodeURIComponent).join('/');
  } else if (dl) {
    dl.style.display = 'none';
  }

  // 阅读 / 练习 切换
  var tabs = [].slice.call(document.querySelectorAll('.doc-tabs button'));
  tabs.forEach(function (b) {
    b.addEventListener('click', function () {
      var p = b.getAttribute('data-pane');
      tabs.forEach(function (x) { x.classList.toggle('on', x === b); });
      var r = document.getElementById('paneRead');
      var q = document.getElementById('paneQuiz');
      if (r) r.classList.toggle('hide', p !== 'read');
      if (q) q.classList.toggle('hide', p !== 'quiz');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });

  var links = [].slice.call(document.querySelectorAll('.toc a[href^="#"]'));
  if (!links.length) return;
  var heads = links.map(function (a) { return document.getElementById(a.getAttribute('href').slice(1)); });
  function paint() {
    var top = window.scrollY + 120, idx = 0;
    heads.forEach(function (h, i) { if (h && h.offsetTop <= top) idx = i; });
    links.forEach(function (a, i) { a.classList.toggle('on', i === idx); });
  }
  window.addEventListener('scroll', paint, { passive: true });
  paint();
})();

/* ---------- 阅读进度、回到顶部、章节入场 ---------- */
(function () {
  var bar = document.createElement('div'); bar.id = 'dgProg';
  var top = document.createElement('button'); top.id = 'dgTop';
  top.type = 'button'; top.setAttribute('aria-label', '回到顶部'); top.textContent = '↑';
  document.body.appendChild(bar); document.body.appendChild(top);

  var raf = 0;
  function paint() {
    raf = 0;
    var max = document.documentElement.scrollHeight - window.innerHeight;
    var y = window.scrollY || 0;
    bar.style.width = (max > 0 ? Math.min(1, y / max) * 100 : 0).toFixed(2) + '%';
    top.classList.toggle('on', y > 520);
  }
  window.addEventListener('scroll', function () {
    if (!raf) raf = requestAnimationFrame(paint);
  }, { passive: true });
  window.addEventListener('resize', paint, { passive: true });
  top.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });
  paint();

  var hs = [].slice.call(document.querySelectorAll('.article h3'));
  if (!('IntersectionObserver' in window) || !hs.length) {
    hs.forEach(function (h) { h.classList.add('in'); });
    return;
  }
  var io = new IntersectionObserver(function (es) {
    es.forEach(function (e) {
      if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
    });
  }, { rootMargin: '0px 0px -8% 0px' });
  hs.forEach(function (h) { io.observe(h); });
  setTimeout(function () { hs.forEach(function (h) { h.classList.add('in'); }); }, 2500);
})();

/* ---------- 记住阅读位置 ---------- */
(function () {
  if (!document.getElementById('body')) return;
  var KEY = 'medilearn.docpos:' + location.pathname;
  var timer = 0;
  window.addEventListener('scroll', function () {
    if (timer) return;
    timer = setTimeout(function () {
      timer = 0;
      try { localStorage.setItem(KEY, String(Math.round(window.scrollY))); } catch (e) {}
    }, 600);
  }, { passive: true });

  var y = 0;
  try { y = parseInt(localStorage.getItem(KEY) || '0', 10) || 0; } catch (e) {}
  if (y < 600) return;
  setTimeout(function () {
    window.scrollTo(0, y);
    var t = document.createElement('div');
    t.textContent = '已回到上次阅读位置';
    t.style.cssText = 'position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:9600;' +
      'background:var(--text);color:var(--surface);font:500 13px/1 var(--font-sans,sans-serif);' +
      'padding:9px 16px;border-radius:999px;box-shadow:0 10px 30px rgba(15,23,42,.22);' +
      'opacity:0;transition:opacity .3s;pointer-events:none';
    document.body.appendChild(t);
    requestAnimationFrame(function () { t.style.opacity = '1'; });
    setTimeout(function () {
      t.style.opacity = '0';
      setTimeout(function () { t.remove(); }, 400);
    }, 1900);
  }, 80);
})();
</script>
