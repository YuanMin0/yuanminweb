e": "list", "items": ["Curr Opin Struct Biol, 2015, 33: 126-134."]}, {"type": "list", "items": ["载体蛋白", "通道蛋白", "--------------------------------------------------------------------------------------------", "---------------------------------------------------------------------------------------------", "---------------------------------------------------------------------------------------------", "---------------------------------------------------------------------------------------------", "1)", "4)", "3)", "5)", "2)"]}, {"type": "h", "text": "-----------------------"}, {"type": "list", "items": ["被动运输"]}, {"type": "h", "text": "主动运输"}, {"type": "list", "items": ["简单扩散", "易化扩散", "载体蛋白 通道蛋白 (离子/水通道)", "ATP驱动泵", "协同运输", "(Na+-K+泵)", "膜运输蛋白", "passive transport", "active transport 共运输", "对向运输"]}, {"type": "h", "text": "细胞膜"}, {"type": "list", "items": ["膜脂", "膜蛋白", "膜糖", "磷脂", "胆固醇", "糖脂", "两亲性分子", "细胞膜的双分子骨架", "水溶液中脂质体的稳定结构", "“两暗夹一明”的单位膜", "跨膜蛋白", "外周蛋白", "脂锚定蛋白", "胞外", "跨膜", "胞内", "非共价键", "共价键", "GPI", "锚定蛋白", "糖脂和糖蛋白", "糖链朝向细胞表面", "细胞膜的分子结构模型", "不对称性", "流动性", "流动镶嵌模型"]}, {"type": "p", "text": "1963年授予澳大利亚科学家约翰·卡鲁·埃克尔斯（John Carew Eccles）、英国科学家"}, {"type": "p", "text": "阿伦·霍奇金（Alan Lloyd Hodgkin）和安德鲁·赫克（Andrew Huxley）"}, {"type": "list", "items": ["发现神经细胞膜的外围和中心部位与神经兴奋及抑制有关的离子机制：分别阐明了神经细胞动作电位", "的模式，动作电位依存性Na+、K +离子通道表达于细胞膜，进一步证实离子通道的膜镶嵌结构"]}, {"type": "p", "text": "1991年授予德国科学家厄温·内尔（Erwin Neher）和伯特·萨克曼（Bert Sakmann）"}, {"type": "list", "items": ["发现细胞中单离子道功能，并发明膜片钳技术。借助膜片钳技术，多种离子通道的特性与功能被揭示，", "为神经生物学研究领域带来了革命性变革，也为许多离子通道相关疾病治疗做出重大贡献"]}, {"type": "list", "items": ["1997年授予丹麦科学家延斯·克里斯蒂安·斯科（Jens Christian Skou）", "表彰1957年发现细胞膜上的Na+-K+ATP酶，通过消耗能量，物质可以从低浓度向高浓度进行", "跨膜转运。Na+-K+泵普遍存在于动植物细胞中，具有重要的生理作用"]}, {"type": "p", "text": "2003年授予科学家彼得·阿格雷（Peter Agre）和罗德里克·麦金农（RMacKinnon）"}, {"type": "list", "items": ["表彰他们在“发现细胞膜通道”（水通道和离子通道）方面做出突出贡献"]}, {"type": "list", "items": ["缪金林", "讲师", "细胞生物学教研室", "国家分子医学转化中心", "miaojinlin@163.com"]}];</script>
