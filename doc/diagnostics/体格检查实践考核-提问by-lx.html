<script>window.__DOC_BLOCKS = [{"type": "p", "text": "体格检查考核"}, {"type": "p", "text": "一、一般、头颈部检查"}, {"type": "p", "text": "（一）血压测量"}, {"type": "p", "text": "【操作核心要点 / 扣分点】"}, {"type": "p", "text": "必须充分暴露上臂，禁止隔着衣服测量（-10 分）"}, {"type": "p", "text": "测量前需触诊上肢肘窝的肱动脉（-10 分）"}, {"type": "p", "text": "袖带下缘距肘窝需≥2 厘米（-10 分）"}, {"type": "p", "text": "袖带松紧度以 “一指插入为宜”，过松 / 过紧均扣分（-10 分）"}, {"type": "p", "text": "听诊器禁止塞入袖带内（-20 分）"}, {"type": "p", "text": "口述血压数值时，必须先读收缩压，后读舒张压，读反扣分（-10 分）"}, {"type": "p", "text": "关闭水银槽开关前，需将水银全部流入水银壶（-10 分）"}, {"type": "p", "text": "【提问及标准答案】"}, {"type": "p", "text": "坐位测量时，肱动脉的位置应与（第 4 肋）平齐"}, {"type": "p", "text": "仰卧位测量时，肱动脉的位置应与（腋中线）平齐"}, {"type": "p", "text": "（二）头颈部淋巴结触诊"}, {"type": "p", "text": "【操作核心要点 / 扣分点】"}, {"type": "p", "text": "触诊顺序：耳前→耳后→枕后→颌下→颏下→颈前→颈后→锁骨上淋巴结，顺序错误扣分（-20 分）"}, {"type": "p", "text": "耳前、耳后、枕后触诊需双手同时进行，禁止左右漏触诊（-20 分）"}, {"type": "p", "text": "触诊颌下、颏下、颈前、颈后淋巴结时，患者头部需稍低并偏向检查侧，否则扣分（-20 分）"}, {"type": "p", "text": "【提问及标准答案】"}, {"type": "p", "text": "颈前三角、颈后三角的界限组成："}, {"type": "p", "text": "颈前三角：由颈正中线、下颌下缘、胸锁乳突肌前缘围成的三角区域"}, {"type": "p", "text": "颈后三角：由胸锁乳突肌后缘、锁骨上缘、斜方肌前缘围成的三角区域"}, {"type": "p", "text": "（三）腋窝、滑车淋巴结触诊"}, {"type": "p", "text": "【操作核心要点 / 扣分点】"}, {"type": "p", "text": "腋窝淋巴结触诊顺序：腋窝尖群→中央群→胸肌群→肩胛下群→外侧群，顺序错误扣分（-20 分）"}, {"type": "p", "text": "滑车淋巴结触诊：左手托左肘关节、右手托右肘关节，托肘手法错误扣分（-20 分）"}, {"type": "p", "text": "触诊位置错误、左右漏触诊均扣分（-20 分 / 项）"}, {"type": "p", "text": "【提问及标准答案】"}, {"type": "p", "text": "淋巴结触诊的核心内容：肿大淋巴结的==部位、大小、数目、硬度、活动度、有无压痛、有无粘连==，局部皮肤有无红肿、瘢痕、瘘管（少于 5 点扣分）"}, {"type": "p", "text": "（四）角膜反射、对光反射、集合反射"}, {"type": "p", "text": "【操作核心要点 / 扣分点】"}, {"type": "p", "text": "角膜反射：需捏出棉絮轻触角膜，仅触碰睫毛、未触及角膜扣分（-20 分 / 项）"}, {"type": "p", "text": "对光反射：必须同时做直接 + 间接对光反射，间接反射需隔开双眼（-20 分 / 项）"}, {"type": "p", "text": "集合反射：检查前需嘱咐患者注视目标，否则扣分（-20 分）"}, {"type": "p", "text": "【提问及标准答案】"}, {"type": "p", "text": "直接及间接对光反射会引起瞳孔（收缩）"}, {"type": "p", "text": "角膜反射起始于三叉神经的（眼神经）"}, {"type": "p", "text": "（五）鼻窦区压痛检查"}, {"type": "p", "text": "【操作核心要点 / 扣分点】"}, {"type": "p", "text": "上颌窦、额窦、筛窦的触诊位置错误均扣分（-20 分 / 项）"}, {"type": "p", "text": "【提问及标准答案】"}, {"type": "p", "text": "副鼻窦压痛常见于（鼻窦炎）"}, {"type": "p", "text": "（蝶窦）在体表难以触及"}, {"type": "p", "text": "（六）扁桃体及气管检查"}, {"type": "p", "text": "【操作核心要点 / 扣分点】"}, {"type": "p", "text": "压舌板使用方法错误扣分（-20 分）"}, {"type": "p", "text": "检查扁桃体时，需嘱咐患者发出 “啊” 音（-20 分）"}, {"type": "p", "text": "气管检查时，食指和无名指需放在胸锁关节上（-20 分）"}, {"type": "p", "text": "【提问及标准答案】"}, {"type": "p", "text": "扁桃体 2 度肿大是指超过（咽腭弓）"}, {"type": "p", "text": "气管偏向患侧多见于（肺不张）"}, {"type": "p", "text": "（七）甲状腺峡部及腺叶触诊（两种方法）"}, {"type": "p", "text": "【操作核心要点 / 扣分点】"}, {"type": "p", "text": "未触诊峡部扣分（-20 分）"}, {"type": "p", "text": "触诊腺叶时，未将气管推向一侧扣分（-20 分）"}, {"type": "p", "text": "检查内容（大小、质地、结节、压痛、震颤等）缺少 3 点以上扣分（-20 分）"}, {"type": "p", "text": "检查手法错误扣分（-20 分）"}, {"type": "p", "text": "【提问及标准答案】"}, {"type": "p", "text": "甲状腺 2 度肿大是指（能触及且能看到），但肿大范围不超过（胸锁乳突肌）"}, {"type": "p", "text": "甲状腺肿大多见于（甲亢）"}, {"type": "p", "text": "二、胸肺检查"}, {"type": "p", "text": "（一）乳房触诊"}, {"type": "p", "text": "【操作核心要点 / 扣分点】"}, {"type": "p", "text": "触诊原则：先触健侧、后触患侧，顺序错误扣分（-20 分）"}, {"type": "p", "text": "触诊顺序：左侧顺时针（左上→左下→右下→右上→乳头），右侧逆时针（右上→右下→左下→左上→乳头），顺序错误扣分（-10 分 / 侧）"}, {"type": "p", "text": "未使用滑行触诊法扣分（-20 分）"}, {"type": "p", "text": "触诊内容不全：需询问有无压痛，触诊有无包块（大小、数目、性质、移动度），内容不全扣分（-10 分 / 项）"}, {"type": "p", "text": "【提问及标准答案】"}, {"type": "p", "text": "急性乳腺炎和乳腺癌的鉴别要点：急性乳腺炎局部多有==红、肿、热、痛的炎症表现=="}, {"type": "p", "text": "（二）胸廓扩张度检查"}, {"type": "p", "text": "【操作核心要点 / 扣分点】"}, {"type": "p", "text": "前胸壁检查：双手指方向平行于肋缘、平对剑突水平，不符合扣分（-10 分 / 项）"}, {"type": "p", "text": "后背部检查：双手指位于第十肋水平，大拇指方向与脊柱平行，向内轻推皮肤，不符合扣分（-10 分 / 项，向内推皮肤错误扣 20 分）"}, {"type": "p", "text": "未嘱患者深呼吸，观察大拇指距离前、后正中线的距离扣分（-20 分）"}, {"type": "p", "text": "【提问及标准答案】"}, {"type": "p", "text": "胸廓扩张度受限见于何种疾病？"}, {"type": "p", "text": "答案：慢阻肺、肺炎、胸腔积液、肺不张（说出 2 个即可给分）"}, {"type": "p", "text": "（三）语音震颤及语音共振听诊"}, {"type": "p", "text": "【提问】"}, {"type": "p", "text": "语音震颤减弱 / 消失常见病：胸腔积液、气胸、肺气肿、肺不张"}, {"type": "p", "text": "语音震颤增强常见病：大叶性肺炎实变期、肺梗死、空洞型肺结核"}, {"type": "p", "text": "（四）肺下界活动度叩诊"}, {"type": "p", "text": "三、心脏检查"}, {"type": "p", "text": "心脏触诊"}, {"type": "p", "text": "心包摩擦感 vs 胸膜摩擦感鉴别：==屏住呼吸==，屏气后仍存在为心包摩擦感；随呼吸起伏为胸膜摩擦感"}, {"type": "p", "text": "心尖部抬举样搏动：提示==左心室肥厚=="}, {"type": "p", "text": "胸骨左缘抬举样搏动：提示==右心室肥厚=="}, {"type": "p", "text": "心脏相对浊音界叩诊"}, {"type": "p", "text": "靴形心：常见病 ==主动脉瓣关闭不全=="}, {"type": "p", "text": "梨形心：常见病 ==二尖瓣狭窄=="}, {"type": "p", "text": "心脏听诊（听诊区及顺序）"}, {"type": "p", "text": "患者多取卧位或坐位，膜型体件紧贴皮肤，钟型体件轻放胸前。必要时配合左侧卧位及坐位前倾听诊。（心尖区听诊不少于1min）听诊内容：率律四音 心音辨识"}, {"type": "p", "text": "第一心音（S₁）：二尖瓣 + 三尖瓣关闭产生，标志==心脏收缩开始=="}, {"type": "p", "text": "第二心音（S₂）：主动脉瓣 + 肺动脉瓣关闭产生，标志==心脏舒张开始=="}, {"type": "p", "text": "水冲脉及毛细血管搏动征"}, {"type": "h", "level": 3, "id": "s1", "text": "水冲脉操作步骤"}, {"type": "list", "items": ["医患沟通与体位准备"]}, {"type": "p", "text": "==告知目的==：\"您好，我需要检查您的脉搏情况，请配合\""}, {"type": "p", "text": "==体位要求==：被检者取==坐位或仰卧位==，检查者站于被检者==右侧=="}, {"type": "p", "text": "==肢体摆放==：被检者手臂自然放松，掌心向上"}, {"type": "list", "items": ["触诊手法"]}, {"type": "p", "text": "检查者用==右手掌掌面==紧贴被检者手腕掌侧，拇指轻放于桡骨茎突上，==示指、中指、环指三指指====腹==置于桡动脉搏动处，==禁止用拇指==、==力度适中==。"}, {"type": "list", "items": ["关键操作"]}, {"type": "p", "text": "抬高上肢：平稳将被检者前臂高举超过头部（≥90°），与身体呈垂直或接近垂直状态"}, {"type": "p", "text": "感知特征：在抬高过程中持续感受脉搏变化，阳性时可感知骤起骤落的冲击感，如潮水涨落或水冲样搏动"}, {"type": "p", "text": "双侧对比：同法检查对侧桡动脉，判断是否对称"}, {"type": "h", "level": 3, "id": "s2", "text": "毛细血管搏动征操作步骤"}, {"type": "list", "items": ["医患沟通与体位摆放"]}, {"type": "p", "text": "礼貌告知：您好，现在为您检查血管情况，请您配合"}, {"type": "p", "text": "受检者取仰卧位 / 坐位，检查者立于患者右侧"}, {"type": "p", "text": "充分暴露手指，肢体自然放松"}, {"type": "list", "items": ["选取检查部位"]}, {"type": "p", "text": "首选指甲床，也可选择口唇黏膜、耳垂部位检查"}, {"type": "list", "items": ["规范检查手法"]}, {"type": "p", "text": "检查者用食指指尖轻压受检者指甲末端。缓慢施加适度压力，使甲床局部呈现苍白色。保持轻微按压状态，双眼紧盯受压边缘。观察甲床颜色随心脏搏动的节律变化"}, {"type": "list", "items": ["双侧对比检查"]}, {"type": "p", "text": "同法依次检查双侧手指甲床，对比两侧体征是否一致"}, {"type": "list", "items": ["结果判定"]}, {"type": "p", "text": "阳性：受压发白处随心动周期，出现规律性红白交替搏动"}, {"type": "p", "text": "阴性：无节律性颜色波动，肤色平稳无搏动变化"}, {"type": "p", "text": "规范报告：毛细血管搏动征：阳性 / 阴性，双侧对称"}, {"type": "p", "text": "水冲脉、毛细血管搏动征：常见于主动脉瓣关闭不全、甲亢、重度贫血"}, {"type": "p", "text": "四、腹部检查"}, {"type": "p", "text": "肠鸣音 + 静脉曲张方向判别"}, {"type": "p", "text": "肠鸣音操作步骤"}, {"type": "p", "text": "==医====患沟通与体位== 告知：您好，现在为您听诊腹部，请放松配合。受检者取==仰卧位==，双腿自然平放，充分暴露腹部，腹部肌肉放松。"}, {"type": "h", "level": 3, "id": "s3", "text": "规范听诊"}, {"type": "p", "text": "==首选听诊部位==：右下腹脐与髂前上棘连线中外 1/3 处"}, {"type": "p", "text": "常规顺序：右下腹→右上腹→左上腹→左下腹"}, {"type": "p", "text": "每处==至少听诊 1 分钟==，肠鸣音稀少时延长至 3~5 分钟"}, {"type": "h", "level": 3, "id": "s4", "text": "计数与性质观察"}, {"type": "p", "text": "记录每分钟肠鸣音次数，辨别音调高低、蠕动声响强弱"}, {"type": "p", "text": "肠鸣音听诊部位：==右下腹=="}, {"type": "p", "text": "正常肠鸣音频率：==4～5 次 / 分钟=="}, {"type": "p", "text": "肠鸣音活跃：急性胃肠炎、服泻药、胃肠道大出血"}, {"type": "p", "text": "肠鸣音亢进：==机械性肠梗阻=="}, {"type": "p", "text": "肠鸣音消失：急性腹膜炎、麻痹性肠梗阻-"}, {"type": "p", "text": "右锁骨中线肝上下界叩诊"}, {"type": "p", "text": "肝脏上下界叩诊范围：==9～11cm=="}, {"type": "p", "text": "腹部移动性浊音叩诊"}, {"type": "p", "text": "移动性浊音阳性：腹腔积液＞==1000ml=="}, {"type": "p", "text": "腹部浅、深触诊"}, {"type": "p", "text": "触诊深度：浅触诊约==1cm==；深触诊约==2cm==（4～5cm 也可）"}, {"type": "p", "text": "肝脏触诊（单手 + 双手）"}, {"type": "p", "text": "一、检查准备"}, {"type": "p", "text": "患者仰卧屈膝，放松腹部，暴露上腹。医生站患者右侧。嘱患者做腹式呼吸：吸气鼓腹，呼气收腹"}, {"type": "p", "text": "二、单手触诊法"}, {"type": "p", "text": "右手四指并拢、掌指伸直，指尖朝向肋缘。右手先放右下腹脐水平，从下往上触。呼吸配合：呼气手指用力下压深部，吸气手指随腹壁上抬，触碰下移肝缘。沿右锁骨中线、前正中线两条线依次触诊。触摸肝大小、质地、边缘、表面、有无压痛。适用：体型偏瘦、腹壁柔软人群"}, {"type": "p", "text": "三、双手触诊法（深部触诊）"}, {"type": "p", "text": "适用：肥胖、腹壁厚、腹水、肝位置深、腹肌紧张者。左手托住患者右后腰部，向前上方顶推肝脏，右手姿势同单手触诊，置于右侧腹部。借左手推力让肝脏下移，右手配合呼吸滑动触诊肝下缘"}, {"type": "p", "text": "肝颈静脉回流征阳性：提示==右心衰竭=="}, {"type": "p", "text": "液波震颤 + 振水音"}, {"type": "p", "text": "液波震颤阳性：腹腔积液＞==3000ml=="}, {"type": "p", "text": "墨菲氏征 + 麦氏点压痛反跳痛"}, {"type": "p", "text": "一、墨菲氏征"}, {"type": "p", "text": "定位：右侧锁骨中线与右肋缘交界处（胆囊点）"}, {"type": "p", "text": "操作体位：患者仰卧，放松腹部，自然腹式呼吸"}, {"type": "p", "text": "检查手法：医师左手掌平放于患者右胸下部，左手拇指垂直按压在胆囊点处，其余四指自然贴附胸壁，嘱患者缓慢深吸气"}, {"type": "p", "text": "阳性判断：吸气过程中，肿大的胆囊下移触碰按压的拇指，患者突发剧烈疼痛，随即屏住吸气，即为墨菲氏征阳性"}, {"type": "p", "text": "临床意义：阳性提示急性胆囊炎"}, {"type": "p", "text": "二、麦氏点压痛、反跳痛"}, {"type": "p", "text": "定位：脐与右髂前上棘连线中外 1/3 交界处"}, {"type": "p", "text": "压痛检查：右手并拢食指、中指，指腹缓慢按压麦氏点，询问患者有无局部疼痛感，出现明显痛感即为压痛阳性"}, {"type": "p", "text": "反跳痛检查：手指按压至腹部深层停留 2~3 秒，随后迅速抬手，患者局部疼痛骤然加重，甚至痛感向周围放射，即为反跳痛阳性"}, {"type": "p", "text": "补充体征：若伴随腹肌紧张，提示炎症加重、腹膜受刺激"}, {"type": "p", "text": "临床意义：麦氏点压痛 + 反跳痛，高度提示急性阑尾炎"}, {"type": "p", "text": "墨菲征阳性：提示==急性胆囊炎=="}, {"type": "p", "text": "五、脊柱、四肢与关节"}, {"type": "p", "text": "颈腰椎活动度 + 脊柱叩击痛"}, {"type": "p", "text": "一、颈椎活动度"}, {"type": "p", "text": "==体位==：端坐位，双肩放平固定，上身不动"}, {"type": "p", "text": "==前屈==：缓慢低头，下颌贴近前胸。正常角度：35°~45°"}, {"type": "p", "text": "==后伸==：缓慢仰头，视线朝上方。正常角度：35°~45°"}, {"type": "p", "text": "==左右侧屈==：头部偏向同侧肩膀，肩部不晃动。正常角度：单侧各 45°"}, {"type": "p", "text": "==左右旋转==：头部水平转向左右，下巴对准肩头。正常角度：单侧各 60°~80°"}, {"type": "p", "text": "观察要点：有无活动受限、疼痛、颈部歪斜"}, {"type": "p", "text": "二、腰椎活动度"}, {"type": "p", "text": "==体位==：站立位，双脚与肩同宽，固定骨盆下肢"}, {"type": "p", "text": "==前屈==：上身匀速向前弯腰。正常角度：90°"}, {"type": "p", "text": "==后伸==：上半身平稳向后仰身。正常角度：30°"}, {"type": "p", "text": "==左右侧屈==：腰部向两侧侧弯，下肢不动。正常角度：单侧各 30°"}, {"type": "p", "text": "==左右旋转==：腰部带动躯干左右转动，双脚固定。正常角度：单侧各 30°"}, {"type": "p", "text": "观察要点：活动幅度、有无腰痛、活动障碍"}, {"type": "p", "text": "三、脊柱叩击痛"}, {"type": "list", "items": ["间接叩击法（仅查颈椎）"]}, {"type": "p", "text": "左手掌紧贴患者头顶"}, {"type": "p", "text": "右手半握拳，轻叩左手手背"}, {"type": "p", "text": "分次叩击，询问痛感"}, {"type": "p", "text": "==阳性==：颈部疼痛、伴随上肢放射痛，提示颈椎间盘、椎体病变"}, {"type": "list", "items": ["直接叩击法（胸、腰、骶椎）"]}, {"type": "p", "text": "手持叩诊锤，沿脊柱正中棘突"}, {"type": "p", "text": "从上至下逐个棘突均匀轻叩"}, {"type": "p", "text": "==阳性==：叩击局部明显疼痛"}, {"type": "p", "text": "==临床意义==：提示椎体骨折、骨质病变、椎间盘突出、脊柱炎症结核"}, {"type": "p", "text": "扣分点：\n颈段：固定肩部，嘱病人···xxx（10）观察活动有无受限、询问疼痛（10）\n腰段：固定骨盆（双手置于髂前上棘）xxx"}, {"type": "p", "text": "脊柱直接（10）、间接叩诊法（10）"}, {"type": "p", "text": "脊柱活动度最大部位：==颈椎、腰椎=="}, {"type": "p", "text": "脊柱叩击禁忌：==颈椎==一般不采用直接叩击法"}, {"type": "p", "text": "Jackon 实验 + 直腿抬高实验"}, {"type": "p", "text": "一、Jackson 压头试验（椎间孔挤压试验）"}, {"type": "p", "text": "检查目的：诊断神经根型颈椎病"}, {"type": "p", "text": "体位：患者端坐，腰背挺直，颈部放松"}, {"type": "p", "text": "操作手法：医师立于患者后方，双手重叠按压头顶，沿脊柱纵向缓慢向下施压；也可将头部轻偏向患侧后再加压"}, {"type": "p", "text": "阳性判断：颈部、肩部出现酸痛，痛感、麻木感沿单侧上肢放射传导"}, {"type": "p", "text": "临床意义：提示颈椎椎间孔狭窄，神经根受压"}, {"type": "p", "text": "二、直腿抬高试验"}, {"type": "p", "text": "检查目的：排查腰椎间盘突出、坐骨神经受压"}, {"type": "p", "text": "体位：患者仰卧，双下肢伸直，肌肉放松"}, {"type": "p", "text": "基础操作：一手按住膝关节保持伸直，另一手托住足跟，缓慢匀速向上抬高下肢"}, {"type": "p", "text": "阳性判定：抬高角度不足 70° 时，出现大腿后侧、小腿放射性疼痛、麻木即为阳性，阳性多见于腰 4~5、腰 5~ 骶 1 节段腰椎间盘突出症"}, {"type": "p", "text": "Jackson 压头试验阳性：颈椎病、颈椎间盘突出症"}, {"type": "p", "text": "直腿抬高试验阳性：腰椎间盘突出症、单纯坐骨神经痛"}, {"type": "p", "text": "浮髌试验 + 侧方加压实验"}, {"type": "p", "text": "浮髌试验阳性：膝关节积液＞==50ml=="}, {"type": "p", "text": "膝关节内外侧疼痛：提示==内外侧副韧带损伤=="}, {"type": "p", "text": "六、神经反射与病理征"}, {"type": "p", "text": "腹壁反射"}, {"type": "p", "text": "==1.====体位==：患者仰卧屈膝，腹部充分放松，上肢平放身体两侧"}, {"type": "list", "items": ["用钝头器械（棉签柄、叩诊锤柄），由外向内轻划腹壁皮肤，依次检查左右侧上、中、下腹壁"]}, {"type": "p", "text": "==上腹壁反射==：肋弓下缘、==胸 7～8==、沿肋下外侧往中线轻划"}, {"type": "p", "text": "==中腹壁反射==：脐水平旁侧、==胸 9～10==、肚脐旁由外向内划动"}, {"type": "p", "text": "==下腹壁反射====：==腹股沟上方腹壁、==胸 11～12==、下腹部外侧向中线轻划"}, {"type": "list", "items": ["结果判定"]}, {"type": "p", "text": "==正常==：受刺激部位腹肌立刻收缩"}, {"type": "p", "text": "==减弱==：腹肌收缩幅度变小"}, {"type": "p", "text": "==消失==：无腹肌收缩反应"}, {"type": "p", "text": "==亢进==：收缩反应异常强烈"}, {"type": "p", "text": "4．临床意义"}, {"type": "p", "text": "单侧反射消失：提示==同侧锥体束受损=="}, {"type": "p", "text": "对应区域消失：对应节段脊髓病变"}, {"type": "p", "text": "双侧全部消失：常见于昏迷、急性腹膜炎"}, {"type": "p", "text": "生理性减弱：肥胖、高龄、产后腹壁松弛人群"}, {"type": "p", "text": "腹壁反射对应脊髓节段：T7～T12"}, {"type": "p", "text": "双侧腹壁反射全消失：==昏迷、急性腹膜炎=="}, {"type": "p", "text": "单侧腹壁反射消失：==同侧锥体束损害=="}, {"type": "p", "text": "肱二头肌反射 + 跟腱反射"}, {"type": "p", "text": "肱二头肌反射脊髓节段：==颈髓 5～6 节=="}, {"type": "p", "text": "踝 / 跟腱反射脊髓节段：==骶====髓 1～2 节=="}, {"type": "p", "text": "踝阵挛 + 髌阵挛"}, {"type": "p", "text": "一、髌阵挛"}, {"type": "p", "text": "体位：患者仰卧，下肢自然放松，膝关节微屈曲"}, {"type": "p", "text": "操作手法：一手托起患者腘窝处，维持屈膝姿势；另一手拇指与食指按压髌骨上缘，骤然、快速向下推动髌骨，并持续保持向下的推力。髌骨出现规律性、连续性上下颤动，即为阳性"}, {"type": "p", "text": "临床意义：锥体束损伤，常见于脑血管病、脊髓病变等"}, {"type": "p", "text": "二、踝阵挛"}, {"type": "p", "text": "体位：患者仰卧，髋关节、膝关节轻度屈曲"}, {"type": "p", "text": "操作手法：一手扶住小腿后侧固定下肢，另一手手掌抵住足底前端，突然用力将足快速背屈，并持续维持背屈张力。踝关节发生节律性交替屈伸抖动，即为阳性"}, {"type": "p", "text": "临床意义：提示锥体束功能异常，多见于脊髓、脑部中枢病变"}, {"type": "p", "text": "病理反射（4 个）"}, {"type": "list", "items": ["巴宾斯基征 Babinski"]}, {"type": "p", "text": "操作：钝头棉签 / 叩诊锤柄，沿足底外侧缘，从足跟向前划至小趾根部，再转向拇趾侧"}, {"type": "p", "text": "阳性：拇趾背伸，其余四趾呈扇形张开"}, {"type": "list", "items": ["奥本海姆征 Oppenheim"]}, {"type": "p", "text": "操作：拇指、食指沿胫骨前缘，自上而下用力滑压"}, {"type": "p", "text": "阳性表现：同巴宾斯基征"}, {"type": "list", "items": ["戈登征 Gordon"]}, {"type": "p", "text": "操作：手用力捏压腓肠肌"}, {"type": "p", "text": "阳性表现：同巴宾斯基征"}, {"type": "list", "items": ["霍夫曼征（Hoffmann 征）"]}, {"type": "p", "text": "操作：患者手腕自然放松，五指呈半屈曲状态，手臂摆放平稳，医生左手握住患者手腕部位固定肢体，右手食指、中指夹住患者中指，用拇指指尖快速弹刮患者中指指甲。"}, {"type": "p", "text": "阳性表现：弹刮后，患者其余四指不自觉向内屈曲、收拢，即为阳性"}, {"type": "p", "text": "巴宾斯基征阳性表现：==拇指背屈，其余四指扇形展开=="}, {"type": "p", "text": "脑膜刺激征（3 个）"}, {"type": "p", "text": "一、颈强直"}, {"type": "p", "text": "==体位==：患者去枕仰卧，下肢伸直放松"}, {"type": "p", "text": "==操作==：一手托住患者枕部，另一手轻按胸前固定躯干，缓慢被动屈曲颈部"}, {"type": "p", "text": "==阳性判断==：颈部僵硬阻力大，低头困难，下颌无法贴近前胸，伴颈部疼痛"}, {"type": "p", "text": "二、克尼格征（Kernig 征）"}, {"type": "p", "text": "==体位==：仰卧"}, {"type": "p", "text": "==操作==：先将一侧下肢髋关节、膝关节均屈曲 90°，一手固定膝关节，另一手托足跟，缓慢向上伸直小腿"}, {"type": "p", "text": "==阳性判断==：伸膝明显受限，小腿与大腿夹角＜135°，后侧剧烈牵拉痛"}, {"type": "p", "text": "三、布鲁津斯基征（Brudzinski 征）"}, {"type": "p", "text": "==体位==：去枕仰卧"}, {"type": "p", "text": "==操作==：同颈强直手法，被动缓慢屈颈"}, {"type": "p", "text": "==阳性判断==：头部前屈时，双侧下肢不由自主屈膝、收腹蜷缩"}, {"type": "p", "text": "脑膜刺激征组成：==颈强直、布鲁津斯基征、克氏征=="}, {"type": "p", "text": "颈强直阳性：颈部阻力增高、僵直"}, {"type": "p", "text": "布鲁津斯基征阳性：屈颈时双下肢屈曲"}, {"type": "p", "text": "克氏征阳性：屈髋屈膝未达 135° 即出现伸膝受限、伴疼痛"}];</script>
<script>
(function () {
  if (WB.mountChrome) WB.mountChrome('materials');

  var body = document.getElementById('body');
  if (body) body.innerHTML = WB.renderBlocks(window.__DOC_BLOCKS || []);
  if (WB.fx && WB.fx.init) WB.fx.init();

  var base = (window.CDN_BASE || '').replace(/\/+$/, '');
  var prefix = window.CDN_PREFIX || '';
  var dl = document.getElementById('dgDl');
  if (base && /^https?:/.test(base) && dl && dl.getAttribute('data-key')) {
    dl.href = base + '/' + prefix + dl.getAttribute('data-key').split('/').map(encodeURIComponent).join('/');
  } else if (dl) {
    dl.style.display = 'none';
  }

  // 阅读 / 练习 切换
  var tabs = [].slice.call(document.querySelectorAll('.doc-tabs button'));
  tabs.forEach(function (b) {
    b.addEventListener('click', function () {
      var p = b.getAttribute('data-pane');
      tabs.forEach(function (x) { x.classList.toggle('on', x === b); });
      var r = document.getElementById('paneRead');
      var q = document.getElementById('paneQuiz');
      if (r) r.classList.toggle('hide', p !== 'read');
      if (q) q.classList.toggle('hide', p !== 'quiz');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });

  var links = [].slice.call(document.querySelectorAll('.toc a[href^="#"]'));
  if (!links.length) return;
  var heads = links.map(function (a) { return document.getElementById(a.getAttribute('href').slice(1)); });
  function paint() {
    var top = window.scrollY + 120, idx = 0;
    heads.forEach(function (h, i) { if (h && h.offsetTop <= top) idx = i; });
    links.forEach(function (a, i) { a.classList.toggle('on', i === idx); });
  }
  window.addEventListener('scroll', paint, { passive: true });
  paint();
})();

/* ---------- 阅读进度、回到顶部、章节入场 ---------- */
(function () {
  var bar = document.createElement('div'); bar.id = 'dgProg';
  var top = document.createElement('button'); top.id = 'dgTop';
  top.type = 'button'; top.setAttribute('aria-label', '回到顶部'); top.textContent = '↑';
  document.body.appendChild(bar); document.body.appendChild(top);

  var raf = 0;
  function paint() {
    raf = 0;
    var max = document.documentElement.scrollHeight - window.innerHeight;
    var y = window.scrollY || 0;
    bar.style.width = (max > 0 ? Math.min(1, y / max) * 100 : 0).toFixed(2) + '%';
    top.classList.toggle('on', y > 520);
  }
  window.addEventListener('scroll', function () {
    if (!raf) raf = requestAnimationFrame(paint);
  }, { passive: true });
  window.addEventListener('resize', paint, { passive: true });
  top.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });
  paint();

  var hs = [].slice.call(document.querySelectorAll('.article h3'));
  if (!('IntersectionObserver' in window) || !hs.length) {
    hs.forEach(function (h) { h.classList.add('in'); });
    return;
  }
  var io = new IntersectionObserver(function (es) {
    es.forEach(function (e) {
      if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
    });
  }, { rootMargin: '0px 0px -8% 0px' });
  hs.forEach(function (h) { io.observe(h); });
  setTimeout(function () { hs.forEach(function (h) { h.classList.add('in'); }); }, 2500);
})();

/* ---------- 记住阅读位置 ---------- */
(function () {
  if (!document.getElementById('body')) return;
  var KEY = 'medilearn.docpos:' + location.pathname;
  var timer = 0;
  window.addEventListener('scroll', function () {
    if (timer) return;
    timer = setTimeout(function () {
      timer = 0;
      try { localStorage.setItem(KEY, String(Math.round(window.scrollY))); } catch (e) {}
    }, 600);
  }, { passive: true });

  var y = 0;
  try { y = parseInt(localStorage.getItem(KEY) || '0', 10) || 0; } catch (e) {}
  if (y < 600) return;
  setTimeout(function () {
    window.scrollTo(0, y);
    var t = document.createElement('div');
    t.textContent = '已回到上次阅读位置';
    t.style.cssText = 'position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:9600;' +
      'background:var(--text);color:var(--surface);font:500 13px/1 var(--font-sans,sans-serif);' +
      'padding:9px 16px;border-radius:999px;box-shadow:0 10px 30px rgba(15,23,42,.22);' +
      'opacity:0;transition:opacity .3s;pointer-events:none';
    document.body.appendChild(t);
    requestAnimationFrame(function () { t.style.opacity = '1'; });
    setTimeout(function () {
      t.style.opacity = '0';
      setTimeout(function () { t.remove(); }, 400);
    }, 1900);
  }, 80);
})();
</script>
