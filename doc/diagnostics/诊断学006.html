 {"type": "p", "text": "A、急性肾小球肾炎"}, {"type": "p", "text": "B、急性尿道炎"}, {"type": "p", "text": "C、急性膀胱炎"}, {"type": "p", "text": "D、急性肾盂肾炎"}, {"type": "p", "text": "E、尿道综合征"}, {"type": "p", "text": "正确答案: D"}, {"type": "p", "text": "119.为明确诊断首选的最简单有效的检查方法是(1分)"}, {"type": "p", "text": "A、腹部立位平片"}, {"type": "p", "text": "B、肾功能"}, {"type": "p", "text": "C、尿常规+尿沉渣分析"}, {"type": "p", "text": "D、逆行肾盂造影"}, {"type": "p", "text": "E、肾穿刺活检"}, {"type": "p", "text": "正确答案: C"}, {"type": "p", "text": "（120-122共用题干）患者，女，44岁，周身高度水肿伴有腹水，尿常规：尿蛋白（++++），24小时尿蛋白＞3.5g，合并高脂血症，血浆白蛋白＜30g/L"}, {"type": "p", "text": "120.【假设】该患者应用强的松1mg/（kg·d）治疗一周后，临床医生判断此患者对激素治疗有效，其主要根据是什么(1分)"}, {"type": "p", "text": "A、患者尿量明显增多，水肿消退"}, {"type": "p", "text": "B、患者尿中红细胞减少"}, {"type": "p", "text": "C、患者血常规红细胞增加"}, {"type": "p", "text": "D、患者食欲增加"}, {"type": "p", "text": "E、患者血钾降低"}, {"type": "p", "text": "正确答案: A"}, {"type": "p", "text": "121.肾病综合征出现大量蛋白尿，其主要原因是(1分)"}, {"type": "p", "text": "A、肾小球滤过膜屏障作用受损"}, {"type": "p", "text": "B、肾小管重吸收蛋白质障碍"}, {"type": "p", "text": "C、肝脏合成蛋白质不足"}, {"type": "p", "text": "D、蛋白摄入不足"}, {"type": "p", "text": "E、清蛋白分解代谢增强"}, {"type": "p", "text": "正确答案: A"}, {"type": "p", "text": "122.该患者诊断为肾病综合征，其主要依据是(1分)"}, {"type": "p", "text": "A、高度水肿伴腹水"}, {"type": "p", "text": "B、尿蛋白++++"}, {"type": "p", "text": "C、24h尿蛋白＞3.5g"}, {"type": "p", "text": "D、高脂血症"}, {"type": "p", "text": "E、血浆白蛋白＜30g/L"}, {"type": "p", "text": "正确答案: C"}, {"type": "p", "text": "（123-125共用题干）患者，男，60岁，既往有心房颤动病史，此次因下肢骨折术后长期卧床，某天突发胸痛、呼吸困难，体查口唇发绀"}, {"type": "p", "text": "123.首先需要考虑的诊断是(1分)"}, {"type": "p", "text": "A、肺栓塞"}, {"type": "p", "text": "B、肺部感染"}, {"type": "p", "text": "C、气胸"}, {"type": "p", "text": "D、急性心梗"}, {"type": "p", "text": "E、心脏破裂"}, {"type": "p", "text": "正确答案: A"}, {"type": "p", "text": "124.【假设信息】如回报D-二聚体阳性，那需尽快完善哪项检查以便确诊(1分)"}, {"type": "p", "text": "A、心电图"}, {"type": "p", "text": "B、胸片"}, {"type": "p", "text": "C、CT肺动脉造影"}, {"type": "p", "text": "D、心脏彩超"}, {"type": "p", "text": "E、肺通气功能检测
