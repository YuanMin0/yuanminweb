<script>window.__DOC_BLOCKS = [{"type": "h", "level": 3, "id": "s1", "text": "第五章 公共卫生伦理"}, {"type": "p", "text": "来源：空军军医大学（第四军医大学）军事医学伦理学教研室，主讲人：张秋菊"}, {"type": "p", "text": "学习目标：掌握公共卫生伦理三大理论基础、五大伦理原则；熟悉四大实践领域的伦理要求。"}, {"type": "h", "level": 3, "id": "s2", "text": "一、公共卫生伦理的含义和理论基础"}, {"type": "h", "level": 3, "id": "s3", "text": "（一）公共卫生伦理的含义"}, {"type": "list", "items": ["公共卫生（Public Health）：关系到一个国家或地区人民大众健康的公共事业，是通过有组织的社区努力来预防疾病、延长寿命、促进健康的科学与艺术。", "具体包括：对重大疾病尤其是传染病（结核、艾滋病、SARS、新冠肺炎等）的预防、监控和治疗；对食品、药品、公共环境卫生的监督管制；卫生宣传、健康教育、免疫接种等。", "重点：公共卫生的工作重点不是直接治疗疾病，而是改善疾病或伤害在人群中流行的社会条件。", "历史视角：最早的疫苗（1796—1979）；威廉·麦克尼尔《瘟疫与人》：\"传染病过去是，而且以后也一定会是影响人类历史的一个最基础的决定因素。\"", "公共卫生伦理：研究公共卫生活动中应该遵循的伦理道德要求，是伦理学基本理论和观念在公共卫生领域的具体应用。"]}, {"type": "h", "level": 3, "id": "s4", "text": "公共卫生伦理 vs 医学伦理"}, {"type": "p", "text": "维度"}, {"type": "p", "text": "生物医学、临床伦理学"}, {"type": "p", "text": "公共卫生伦理学"}, {"type": "p", "text": "研究对象"}, {"type": "p", "text": "患者个人——微观"}, {"type": "p", "text": "社会公众、健康人——宏观"}, {"type": "p", "text": "关注的问题"}, {"type": "p", "text": "治疗、患者个人疾病、患者权利"}, {"type": "p", "text": "预防、防止伤害发生、传染病流行；人权、政治性色彩强"}, {"type": "p", "text": "主要关系"}, {"type": "p", "text": "医患关系"}, {"type": "p", "text": "关系多样"}, {"type": "p", "text": "决策者"}, {"type": "p", "text": "医生个人或群体"}, {"type": "p", "text": "政府机构或相关部门"}, {"type": "p", "text": "伦理基础"}, {"type": "p", "text": "强调尊重患者个人自主性"}, {"type": "p", "text": "强调资源分配的公平"}, {"type": "p", "text": "侧重领域"}, {"type": "p", "text": "新药、器械、生物制品等"}, {"type": "p", "text": "影响健康的行为、生活方式等"}, {"type": "h", "level": 3, "id": "s5", "text": "（二）公共卫生伦理的理论基础"}, {"type": "h", "level": 3, "id": "s6", "text": "1. 功利主义（utilitarianism）"}, {"type": "list", "items": ["核心口号：\"最大多数人的最大幸福\"\"达到最大善\"。", "疑问：为获得最大多数人最大幸福的行为都能得到伦理辩护吗？"]}, {"type": "h", "level": 3, "id": "s7", "text": "2. 自由主义（liberalism）"}, {"type": "list", "items": ["核心观点：每个人都有同等的生命价值，公民拥有基本的健康权利。", "疑问：基于自由主义原则建立的社会能否保护自己？", "社群主义（communitarianism，共同体主义）", "核心观点：社会有责任改善其成员的生存状况；共同体中的个体要采取健康的生活方式，这是一种美德。"]}, {"type": "h", "level": 3, "id": "s8", "text": "三大理论对比"}, {"type": "p", "text": "维度"}, {"type": "p", "text": "功利主义"}, {"type": "p", "text": "自由主义"}, {"type": "p", "text": "社群主义"}, {"type": "p", "text": "核心关注"}, {"type": "p", "text": "结果/效益"}, {"type": "p", "text": "个体权利"}, {"type": "p", "text": "共同体价值"}, {"type": "p", "text": "决策依据"}, {"type": "p", "text": "最大多数人的最大幸福"}, {"type": "p", "text": "尊重个人自主选择"}, {"type": "p", "text": "维护社会团结与美德"}, {"type": "p", "text": "对强制干预态度"}, {"type": "p", "text": "若效果好可以接受"}, {"type": "p", "text": "原则上反对"}, {"type": "p", "text": "若符合公共利益可以接受"}, {"type": "p", "text": "中国公卫实践"}, {"type": "p", "text": "集中资源办大事"}, {"type": "p", "text": "知情同意、隐私保护"}, {"type": "p", "text": "爱国卫生运动、联防联控"}, {"type": "p", "text": "主要风险"}, {"type": "p", "text": "牺牲少数人"}, {"type": "p", "text": "个人主义泛滥"}, {"type": "p", "text": "压制个体差异"}, {"type": "p", "text": "三个理论不是谁对谁错，而是各有侧重。一个合格的公卫人，要能在这三种视角之间切换思考。"}, {"type": "h", "level": 3, "id": "s9", "text": "（三）健康伦理、健康权利、健康责任"}, {"type": "list", "items": ["核心理念：\"健康为人人，人人为健康\"。", "John Knowles：\"一个人在健康方面的自由是另一个人在税费和保险金方面的枷锁。\""]}, {"type": "h", "level": 3, "id": "s10", "text": "• 健康权利："}, {"type": "list", "items": ["国际法依据：1946年《世界卫生组织组织法》首次确认健康为基本人权；", "国内法依据：2020年《基本医疗卫生与健康促进法》第4条——国家和社会尊重、保护公民的健康权；", "机会平等权：保障基本医疗服务的可及性和公平性，非结果保证权。"]}, {"type": "h", "level": 3, "id": "s11", "text": "• 健康责任（三层结构）："}, {"type": "list", "items": ["顶层：政府主导——制定政策、投入资源、建立体系；", "中层：社会支撑——医疗机构、社区组织、企事业单位协同；", "底层：个人基础——每个人是自己健康的第一责任人。", "比喻：健康责任像三条腿的凳子——缺了任何一条腿都不稳。"]}, {"type": "h", "level": 3, "id": "s12", "text": "二、公共卫生伦理原则"}, {"type": "h", "level": 3, "id": "s13", "text": "1. 全社会参与原则"}, {"type": "p", "text": "公共卫生需要全社会共同参与（国家援鄂抗疫医疗队、居家办公线上上课、社区值守、志愿者等抗疫实践）。案例检验：血吸虫病传播防控——把村民变成防控同盟军而非\"对抗\"对象。"}, {"type": "h", "level": 3, "id": "s14", "text": "2. 社会公益原则"}, {"type": "list", "items": ["公益性指医疗卫生政策为谋求大多数人健康的一种公正选择，通过卫生资源配置和一系列卫生政策实现。", "例：国家免疫规划\"九苗防十二病\"、基本药物制度、医保制度、公共场所控烟、限制某些高新技术发展、普及适宜技术、为患者提供免费医疗服务。", "三个服从：个人利益服从社会利益；局部利益服从整体利益；眼前利益服从长期利益。"]}, {"type": "h", "level": 3, "id": "s15", "text": "3. 社会公正原则"}, {"type": "p", "text": "指每个社会成员在卫生保健权利上能得到公正的对待。现实问题：进城务工人员公共卫生服务两难、女性疾病防治、部分儿童健康权保障。"}, {"type": "list", "items": ["分配公正：资源、服务、负担如何公平分配（疫苗优先给贫困山区还是大城市？）", "程序公正：决策过程公开透明（制定封控政策时是否听取居民意见？）"]}, {"type": "h", "level": 3, "id": "s16", "text": "• 回报公正：对贡献者予以回报（抗疫一线人员应有表彰和补偿）"}, {"type": "p", "text": "案例检验：王家村\"三年无报告\"的根源——村医怕考核，背后是制度设计的不公正。"}, {"type": "h", "level": 3, "id": "s17", "text": "4. 互助协同原则"}, {"type": "list", "items": ["国内\"一方有难，八方援助\"（解放军支援湖北抗击疫情、红十字会接收捐赠、大V妈妈捐口罩十万）；", "国际援助：\"山川异域，风月同天\"\"青山一道同云雨，明月何曾是两乡\"；", "2020年4月16日《求是》杂志刊发习近平总书记重要文章《团结合作是国际社会战胜疫情最有力武器》：病毒没有国界，疫情不分种族，人类是休戚与共的命运共同体，唯有团结协作、携手应对，国际社会才能战胜疫情。"]}, {"type": "h", "level": 3, "id": "s18", "text": "5. 信息公开原则"}, {"type": "list", "items": ["个体的隐私和尊严应该保护？", "在公众赋予的资源和授权范围内为社会提供信息；保护个人隐私和公共利益相冲突时，即不公开会给公众利益带来重大伤害时，应该公开信息；反之，则应保护个人隐私。", "案例：武汉返乡人员信息被泄露（Excel表格含身份证号、家庭住址），泄露个人隐私违法（《中华人民共和国侵权责任法》）；杭州疫情通报与个人隐私保护的平衡。"]}, {"type": "h", "level": 3, "id": "s19", "text": "互动快问快答（对应原则）："}, {"type": "list", "items": ["某地发生食物中毒，卫健委怕影响旅游收入压住不报 → 信息公开原则", "流感疫苗只给公务员接种 → 社会公正原则", "控烟条例出台前未征求烟民和烟草行业意见 → 全社会参与原则", "某药企想买断疟疾特效药专利权抬高价格 → 社会公益原则"]}, {"type": "h", "level": 3, "id": "s20", "text": "三、公共卫生某些领域的伦理要求"}, {"type": "h", "level": 3, "id": "s21", "text": "（一）疾病防制的伦理要求"}, {"type": "h", "level": 3, "id": "s22", "text": "1. 传染病防制："}, {"type": "list", "items": ["严格执行隔离消毒措施、严格遵守各项操作规程；", "坚持预防为主的积极防疫思想（预防艾滋病是全社会的责任）；", "扩大检测与保护受检对象（警惕强制检测、易感人群强制筛查）；", "尊重传染病患者的人格和权利（案例：伤寒玛丽被判终身隔离监禁27年，控告纽约州卫生部门侵犯人权）；", "遵守国家法律规定，及时收集及上报疫情。"]}, {"type": "h", "level": 3, "id": "s23", "text": "2. 慢性非传染病防制："}, {"type": "list", "items": ["慢性病占总死亡人数86.6%；主要死因：心脑血管病、癌症、慢性呼吸系统疾病（癌症前五位：肺癌、肝癌、胃癌、食道癌、结直肠癌）；高血压占79.4%、糖尿病占9.7%、慢性阻塞性肺病占9.9%；慢性病年轻化；慢性病可防可控。", "全面贯彻实行三级预防与措施；", "强化对患者及家属的知识教育与行为指导；", "关注慢性病患者心理健康，促进足够的社会支持。"]}, {"type": "p", "text": "（2010《慢性非传染性疾病综合防控示范区工作指导方案》）"}, {"type": "h", "level": 3, "id": "s24", "text": "（二）职业性损害防制的伦理要求"}, {"type": "list", "items": ["关注职业人群心理健康问题（焦虑症、孤独症、强迫症、抑郁症）；", "预防为主、防治结合：职业病一旦发生往往不可逆，预防永远是第一选择；", "深入一线、监督指导：坐在办公室\"看材料\"做不好职业卫生。尘肺病患者肺里洗出来的不是灰尘，是一个家庭未来的希望。"]}, {"type": "h", "level": 3, "id": "s25", "text": "（三）健康教育和健康促进的伦理要求"}, {"type": "list", "items": ["积极主动、一视同仁：尊重每个受教育者，不分贫富贵贱；", "参与政策制定：不只是\"发传单\"，要推动政策改变；", "深入基层：《阿拉木图宣言》——健康促进要\"到最需要的人身边去\"；", "科学态度+群众形式：用老百姓听得懂的话，讲最科学的理；", "《健康中国行动》：普及健康知识、提高全民健康素养水平，是提高全民健康水平最根本最经济最有效的措施之一。"]}, {"type": "h", "level": 3, "id": "s26", "text": "（四）应对突发公共卫生事件的道德要求"}, {"type": "p", "text": "四大特点：突发性（不可预测，时间紧迫）、公共性（群体波及，社会联动）、危害性（健康威胁，秩序冲击）、复杂性（多因交织，应对多维）。"}, {"type": "h", "level": 3, "id": "s27", "text": "五大伦理要求："}, {"type": "list", "items": ["依法防疫，心中有法：《突发公共卫生事件应急条例》——用SARS教训写成的法律；", "敬畏生命，恪守协作：快速反应、听从安排、挺身而出，系统化作战；", "科学态度，积极研究：检测手段、防治药物、疫苗研发——科技是终极武器；", "无私奉献，爱国主义：把患者生命放在首位，将自己的生死置之度外；", "人类命运共同体：病毒没有护照、不需要签证，国际援助与合作是伦理要求（中国援助20亿剂疫苗给120+国家/组织）。"]}, {"type": "h", "level": 3, "id": "s28", "text": "四、小结与案例"}, {"type": "note", "variant": "key", "title": "小结", "text": "理论基础——功利主义、自由主义、社群主义；伦理原则——全社会参与、社会公益、社会公正、互助协同、信息公开；工作伦理要求——疾病防控、职业损害防控、健康教育与促进、突发事件应对。公共卫生始终面临着如何平衡个人与群体、权利与责任、自由与安全的哲学问题。"}, {"type": "p", "text": "案例结局揭晓（王家村甲肝）：那位科长找镇党委书记和县民宗局干部，三个人头晚进村坐在族长家火塘边谈整四小时——给族长看邻村甲肝暴发照片、解释\"粪口传播\"、说清不消毒的后果。结果：族长站村口用喇叭喊话\"这是来救咱娃的，都配合！\"；水井消毒和疫苗接种两天完成全覆盖；事后排查全村实际感染者23人。"}, {"type": "p", "text": "教师寄语：科学是手段，伦理是边界；再好的防控效果也不能以践踏人的尊严为代价；没有伦理约束的\"群体健康\"容易变成\"多数人的暴政\"；保护多数人不等于可以随意牺牲少数人；做公卫既要心中有\"数\"，更要心中有\"人\"。《鼠疫》《水俣病》：瘟疫是一面镜子，照射出了一个国家的肌理和本质。"}, {"type": "p", "text": "案例思考（婚检与艾滋病告知）：2015年3月，王某和未婚妻叶某在某市妇幼保健院婚检，报告出来后医师单独叫住叶某。王某询问医师，医师却说一切正常。婚后不久王某被查出感染艾滋病毒。追问：谁有义务把叶某感染艾滋病的情况告诉王某？"}, {"type": "h", "level": 3, "id": "s29", "text": "五、练习题"}, {"type": "list", "items": ["甲肝防控（单选题1分）：A.立即行动　B.暂缓行动　C.迂回策略　D.其他"]}, {"type": "h", "level": 3, "id": "s30", "text": "正确答案：C"}, {"type": "p", "text": "说明：本章课件中共有 31 张截图，其中 1 张（文件：屏幕截图 2026-10-01 182532.png）因系统服务限制未能识别其文字内容，其余 30 张均已完整提取。"}];</script>
<script>
(function () {
  if (WB.mountChrome) WB.mountChrome('materials');

  var body = document.getElementById('body');
  if (body) body.innerHTML = WB.renderBlocks(window.__DOC_BLOCKS || []);
  if (WB.fx && WB.fx.init) WB.fx.init();

  var base = (window.CDN_BASE || '').replace(/\/+$/, '');
  var prefix = window.CDN_PREFIX || '';
  var dl = document.getElementById('dgDl');
  if (base && /^https?:/.test(base) && dl && dl.getAttribute('data-key')) {
    dl.href = base + '/' + prefix + dl.getAttribute('data-key').split('/').map(encodeURIComponent).join('/');
  } else if (dl) {
    dl.style.display = 'none';
  }

  // 阅读 / 练习 切换
  var tabs = [].slice.call(document.querySelectorAll('.doc-tabs button'));
  tabs.forEach(function (b) {
    b.addEventListener('click', function () {
      var p = b.getAttribute('data-pane');
      tabs.forEach(function (x) { x.classList.toggle('on', x === b); });
      var r = document.getElementById('paneRead');
      var q = document.getElementById('paneQuiz');
      if (r) r.classList.toggle('hide', p !== 'read');
      if (q) q.classList.toggle('hide', p !== 'quiz');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });

  var links = [].slice.call(document.querySelectorAll('.toc a[href^="#"]'));
  if (!links.length) return;
  var heads = links.map(function (a) { return document.getElementById(a.getAttribute('href').slice(1)); });
  function paint() {
    var top = window.scrollY + 120, idx = 0;
    heads.forEach(function (h, i) { if (h && h.offsetTop <= top) idx = i; });
    links.forEach(function (a, i) { a.classList.toggle('on', i === idx); });
  }
  window.addEventListener('scroll', paint, { passive: true });
  paint();
})();
</script>
