<script>window.__DOC_BLOCKS = [{"type": "h", "level": 3, "id": "s1", "text": "绪论"}, {"type": "p", "text": "==1.道德=="}, {"type": "list", "items": ["概念"]}, {"type": "p", "text": "在社会实践中形成的，以善恶评价为形式，依靠社会舆论、传统习俗和内心信念，调节人际关系的心理意识、原则规范、行为活动的综和。"}, {"type": "list", "items": ["内涵", "道德是社会实践关系的反映（道德的根本观点）", "道德是调节利益的规范", "道德是一种重要的意识形态（道德的一般本质）", "道德是非制度化的调节规范（道德的特殊本质）", "道德的内容形式（意识、关系、活动）", "道德分类", "基本特征", "是阶级性和全民性统一", "是变动性与稳定性统一", "是自律性和他律性统一", "是现实性与理想性统一", "是协调性和进取性统一"]}, {"type": "p", "text": "==2.职业道德=="}, {"type": "list", "items": ["涵义"]}, {"type": "p", "text": "所谓职业道德，就是从业人员在职业活动中应当遵循的道德规范和必须具备的道德品质。随着社会生产活动和社会分工的发展而逐步形成和发展。"}, {"type": "list", "items": ["基本要素"]}, {"type": "p", "text": "职业理想 职业态度 职业责任 职业技能"}, {"type": "p", "text": "职业纪律 职业良心 职业荣誉 职业作风"}, {"type": "list", "items": ["基本特点"]}, {"type": "p", "text": "范围上具有专业性---职业范围"}, {"type": "p", "text": "内容上具有稳定性---核心责任"}, {"type": "p", "text": "形式上具有多样性---守则誓词"}, {"type": "p", "text": "==3.医学道德=="}, {"type": "list", "items": ["定义"]}, {"type": "p", "text": "医学道德就是医疗卫生工作者在医疗卫生服务活动中应该具备的道德意识、遵循的道德规范和具备的道德品质。"}, {"type": "list", "items": ["特点", "具有鲜明的专业性", "具有突出的传承性", "具有显著的普适性"]}, {"type": "p", "text": "==4.伦理和道德关系=="}, {"type": "list", "items": ["都涉及处理人们之间，进而处理人与社会之间关系应遵循的道理和规则。", "道德侧重于规范实践，侧重于个体，强调内在的操守和外在行为；", "伦理侧重于理论，侧重于社会整体，更强调客观；道德是伦理的素材，伦理是对道德的思考"]}, {"type": "p", "text": "==5.伦理学=="}, {"type": "list", "items": ["概念"]}, {"type": "p", "text": "伦理学是以道德为研究客体，专门研究道德的起源、本质、作用、及其发展变化规律的学科。"}, {"type": "list", "items": ["任务", "研究人类伦理道德（基本）", "研究制定优良道德（先进）", "研究优良道德实现的过程、途径、方法", "类型", "描述伦理学：用经验描述的方法，揭示伦理的客观事实。"]}, {"type": "p", "text": "人们认为什么是对的，什么是错的？"}, {"type": "list", "items": ["元伦理学/分析伦理学：从语言学和逻辑学的角度分析解释道德概念和判断。"]}, {"type": "p", "text": "什么是善？什么是恶？"}, {"type": "list", "items": ["规范伦理学：从道德规范的论证制定实施角度研究道德价值规范。"]}, {"type": "p", "text": "人们应怎样行为？人们应遵守什么规则？"}, {"type": "list", "items": ["美德伦理学：从道德规范的认同内化动机行动角度研究道德品质"]}, {"type": "p", "text": "==6.医学伦理学=="}, {"type": "list", "items": ["医学伦理学则是运用一般伦理学原理，研究和指导医疗卫生领域的道德现象、道德关系、道德问题和道德建设的学说和理论。", "研究对象"]}, {"type": "p", "text": "医学伦理学以医学领域中的道德意识现象和活动现象为研究对象。"}, {"type": "list", "items": ["医德现象：医学领域中人们道德关系的具体体现。"]}, {"type": "p", "text": "医德意识---观念、心理、理论"}, {"type": "p", "text": "医德规范---原则、范畴、准则"}, {"type": "p", "text": "医德活动---行为、修养、评价"}, {"type": "list", "items": ["医德关系：由利益关系决定的，派生在医学领域中的人与人、人与社会、人与自然之间的关系。"]}, {"type": "p", "text": "医务人员与患者关系、医务人员相互之间关系、医务人员与社会的关系、医务人员与医学发展的关系、医学发展与人类发展进步的关系"}, {"type": "list", "items": ["核心问题", "医患关系问题：医疗服务者和服务对象的关系；医疗单位与社会以及医学和人类的关系"]}, {"type": "p", "text": "1>没有患者就没有医者；没有医患关系就没有其他医疗卫生人际关系。"}, {"type": "p", "text": "2>医患关系问题是经常的、大量的、突出的，道德调节任务也是复杂的、繁重的、迫切的。"}, {"type": "p", "text": "3>制约着其他医疗人际关系状况，关系着医疗卫生行业形象，影响着医疗质量。"}, {"type": "list", "items": ["医疗卫生道德和利益的关系问题：生命健康利益、经济利益、个人利益、社会利益"]}, {"type": "p", "text": "1>道德关系本质上是一种思想化、精神化了的利益关系。"}, {"type": "p", "text": "2>道德和利益的关系是研究解决伦理问题的前提和基础。"}, {"type": "p", "text": "3>道德和利益关系问题贯穿伦理思想历史发展的全过程。"}, {"type": "list", "items": ["理论基础", "生命论"]}, {"type": "p", "text": "1>以人们对生命的基本认识和看法作为医德评价原则的伦理观。"}, {"type": "p", "text": "2>如何对待生命、特别是人的生命，是一般伦理学的一个重要命题。"}, {"type": "p", "text": "3>医学伦理学把这一命题发展到极至，并作为整个医学伦理学理论的重要出发点和立足点。"}, {"type": "p", "text": "4>生命神圣论：人的生命存在具有最高道德价值，神圣不可侵犯、至高无上。（难题：计划生育、节育、流产、优生、停止抢救）"}, {"type": "p", "text": "5>生命质量论：根据人的体能智能等自然素质的高低优劣，采取不同对待的生命伦理观。（难题：残疾人的生命质量一定低吗）"}, {"type": "p", "text": "6>生命价值论：根据生命对自身和他人、社会的效用，采取不同对待的生命伦理观。（难题：伤害一部分人的生命拯救更多人生命可行吗）"}, {"type": "list", "items": ["人道论"]}, {"type": "p", "text": "1>人道的朴素含义是怎样对待自己、怎样对待他人、怎样对待人类的问题。要把人当作人来对待的问题。"}, {"type": "p", "text": "2>善待人生、善待他人、善待同类的思想，是人类文明的重要内容之一。"}, {"type": "p", "text": "3>同情关心病人、尊重病人人格、维护病人权利、珍视生命价值"}, {"type": "list", "items": ["义务论"]}, {"type": "p", "text": "1>义务论是关于道德责任的学说。主张人要遵照某种规定原则或某种事物本身所固有的正当性去行动。"}, {"type": "p", "text": "2>义务论突出绝对的义务和责任，强调无条件的遵循和执行。"}, {"type": "p", "text": "3>医学义务论，以医德责任为中心，研究探讨医务人员该做什么，不该做什么，注重研究医疗行为动机和目的，确保行为合乎伦理规则。"}, {"type": "list", "items": ["美德论"]}, {"type": "p", "text": "1>美德是评价人们有积极意义的行为品性的伦理学概念。"}, {"type": "p", "text": "2>美德论是研究人的优秀道德品质的构成和价值，以及如何培养和形成的伦理学流派，它又称德性论或品德论。"}, {"type": "p", "text": "3>古希腊哲学家柏拉图最早提出“美德即知识”"}, {"type": "p", "text": "亚里士多德则构建了较完整的美德论体系"}, {"type": "list", "items": ["效果论"]}, {"type": "p", "text": "1>效果论是一种以行为的效果作为善恶标准的伦理学流派，认为行为的善恶仅仅取决于行为的效果，而同动机无关。"}, {"type": "p", "text": "2>伦理学史上，功利主义、快乐主义、幸福论、价值学的直觉主义等流派都主张效果论。"}, {"type": "list", "items": ["公益论"]}, {"type": "p", "text": "1>公益论是指以社会公众利益为原则，强调社会公益与个人健康利益相统一的医学伦理观。"}, {"type": "p", "text": "2>医学的公益领域主要有：控制人口数量、提高人口素质、保护环境、保护资源、保护性别比例协调、维持人类种系的延续及其纯洁性等。"}, {"type": "p", "text": "3>兼容观 兼顾观 社会效益观 全局观"}, {"type": "list", "items": ["学科特点", "阶级性与人类性的统一"]}, {"type": "p", "text": "受社会道德的制约影响有阶级烙印。"}, {"type": "p", "text": "相同的医学目的、近似的医患关系决定了鲜明的人类性。"}, {"type": "list", "items": ["继承性与时代性的统一"]}, {"type": "p", "text": "不同时代生产力水平不同、医疗手段和需求不同、医患矛盾内容形式不同"}, {"type": "p", "text": "医学使命所决定的医学道德的趋前性、先进性，是人类文明的精华"}, {"type": "list", "items": ["科学性与人文性的统一"]}, {"type": "p", "text": "与医学科学紧密结合、高度尊重信赖科学技术。"}, {"type": "p", "text": "承载人文关怀，理解人、爱护人、关心人、帮助人。"}, {"type": "list", "items": ["理论性与实践性的统一"]}, {"type": "p", "text": "完备的理论真知是前提；学以致用的笃行是根本"}, {"type": "list", "items": ["规范性与辐射性的统一"]}, {"type": "p", "text": "指导约束规范本行业人员行为；影响着各行各业和社会的文明"}, {"type": "list", "items": ["社会作用", "有利于医务人员的自我完善，培养德才兼备的医学人才"]}, {"type": "p", "text": "科学素养是手段、身心素养是基础、伦理素养是根本"}, {"type": "list", "items": ["有利于技术与伦理的统一，实现医疗质量的提高"]}, {"type": "p", "text": "医学对象是有思想感情的人而不是冰冷的物体,医学不是纯粹技术。"}, {"type": "p", "text": "技术与伦理统一，能够更好地进行医学决策、充分发挥技术的作用、维护医学的权威性、提高医疗质量。"}, {"type": "p", "text": "忽视伦理的作用，不仅医疗质量难以提高，甚至会误入歧途。"}, {"type": "list", "items": ["有利于解决医德难题，促进医学科学的发展"]}, {"type": "p", "text": "生物医学的发展和高新技术研究应用，是一把双刃剑。"}, {"type": "p", "text": "给病患和社会带来更多福利的同时，减少伤害，是一个重要的伦理问题。"}, {"type": "list", "items": ["有利于医药卫生单位及社会的精神文明建设"]}, {"type": "h", "level": 3, "id": "s2", "text": "医学伦理学的产生和发展"}, {"type": "p", "text": "==1.我国古代医德思想的孕育发展=="}, {"type": "list", "items": ["我国古代医德思想的萌始期（原始社会）"]}, {"type": "p", "text": "同情、互助、保健、血缘、生命观念"}, {"type": "list", "items": ["我国古代医德思想的形成期（西周春秋战国）", "周朝"]}, {"type": "p", "text": "出现了分科司业的医生，西周时期医学已经出现了分科，分为疾科、疡科、食科(营养)和兽科。"}, {"type": "p", "text": "岁终对医生进行考核，根据医疗成绩分别规定他们的俸禄。"}, {"type": "list", "items": ["春秋战国"]}, {"type": "p", "text": "围绕儒家核心思想“仁”，赋予医学“医乃仁术”的职业思想。"}, {"type": "p", "text": "“医乃仁术” 强调医学“济世活人” 社会职能,体现出朴素的人道主义精神。"}, {"type": "p", "text": "“医乃仁术”强调医生的自我道德修养和自律。"}, {"type": "p", "text": "《师传》 “余愿闻而藏之，则而行之，上以治民，下以治身，使百姓无病，上下和亲，德泽下流，子孙无忧，传于后世，无有终时，可得闻乎？”强调医者须志于医道，传后世而无患，首先从品德方面选择医者"}, {"type": "p", "text": "《黄帝内经》分《灵枢》《素问》两部分。是我国现存最早的一部系统医学理论著作，共18卷162篇。"}, {"type": "p", "text": "《宝命全形》“天覆地载，万物悉备，莫贵于人” 把尊重病人的生命医德的基本原则"}, {"type": "p", "text": "《征四失论》 “故十不全者，精神不专，志意不理，内外相失，故时疑殆”。明确医疗差错除技术原因，更工作作风和态度问题。"}, {"type": "p", "text": "扁鹊：倡导反巫、随俗为变"}, {"type": "list", "items": ["我国古代医德思想的发展期（秦汉隋唐）"]}, {"type": "p", "text": "秦律：“疠病”与“疠迁所”"}, {"type": "p", "text": "汉代《淮南子·说山训》“良医者，常治无病之病，故无病”"}, {"type": "p", "text": "确立预防疾病的医学原则和医德原则。"}, {"type": "p", "text": "汉代张仲景：“勤求古训，博采众方” “上以疗君亲之疾，下以救贫贱之厄，中以保身长全” 济世救人的医学职业目的。批判痛斥:“居世之士，曾不留神医药,”“唯名利是务” 。"}, {"type": "p", "text": "西晋杨泉，“夫医者，非仁爱之士，不可托也；非聪明理达，不可任也；非廉洁纯良，不可信也。是以古之用医，必选名姓之后，其德能仁恕博爱，其智能宣畅曲解” 《物理论·论医》"}, {"type": "p", "text": "唐朝 耀州孙思邈(公元581－682年)，少年学医，垂暮手不释卷，内、外、妇、儿、五官、针灸各科兼通。誉为“孙真人”“药王”。孙思邈整理前人医德思想形成体系，对古代医德思想发展做出极大贡献。是古代医德规范开拓者和医德思想集大成者。《备急千金要方》、《千金翼方》各30卷。《大医精诚》《大医习业》医德专篇，全面论述从医目的、品德修养、献身精神、医疗作风。主张医家必须具备“精” “诚”两个方面"}, {"type": "list", "items": ["我国古代医德思想的成熟期"]}, {"type": "p", "text": "唐以后，孙思邈医德理论，经过医家不断补充发展趋于完善。特别是一批具有医师道德规范性质的医德文献陆续问世，成为我国古代医德思想走向成熟的重要标志。"}, {"type": "p", "text": "北宋林逋《省心录.论医》：无恒德者，不可为医"}, {"type": "p", "text": "南宋太医局1156年刊刻二十卷《小儿卫生总微方论》，首篇《医工论》指出：凡为医之道，必先正己，然后正物 ，正己者，谓能明理己尽术也。正物者，谓能用药已对病也"}, {"type": "p", "text": "南宋名医张杲 采集历代医学典故和名医传记，编成《医说》10卷，从医德修养和原则方面发展了孙思邈的医德思想。"}, {"type": "p", "text": "强调：不可恃一技之长图谋私利，更不能乘人之危，希求淫邪之报。"}, {"type": "p", "text": "元代 张从正著《儒门事亲》15卷。借鉴儒家“仁” 把医学提高到仁道和孝道的高度。批判轻视医学以医为奴的倾向，提出以医为师的观点。强调医生保持应有的独立职业人格和操守。"}, {"type": "p", "text": "明代徐春甫著《古今医统》，提出“医为司命之寄，不可权饰妄造” 。"}, {"type": "p", "text": "李梃著《医学入门·习医规格》提出“治病即愈，亦医学分内之事也。纵守清素，借此治生，亦不可过取重索，当听其所酬。如病家赤贫，一毫不取，尤见其仁且廉也。”"}, {"type": "p", "text": "龚廷贤著《万病回春》提出“医家十要”、“病家十要”、“医家病家通病”等篇章。"}, {"type": "p", "text": "陈实功：编写《外科正宗》四卷，全面总结明以前外科学成就。医德专门篇章《医家五戒十要》，就医生的专业学习、道德修养、言行举止、服务态度以及如何处理好同行之间的关系，作了明确论述，具体实用的医德规范。1978年，被美国出版的《生命伦理学百科全书》列为世界古代医德文献之一。"}, {"type": "p", "text": "清代喻嘉言著《医门法律》提出以“法”来诊治病人，以“律”来判断治疗的失误。明确诊治规范和是非标准，开创医德评价。从望、闻、问、切到辨证施治，到处方用药，应分门分类，条条清楚，这是“法”，治病要依“法”。辨证施治容易犯的“六十种”错误，提出禁例常规，这是“律”，判断诊治失误责与罪要以“律”"}, {"type": "list", "items": ["我国古代医德的优良传统", "重视生命价值，全力救死扶伤", "体贴病家疾苦，强调廉洁行医", "精心钻研医术，反对粗疏作风", "行为举止端正，讲究礼貌习俗", "不分尊卑贵贱，病人一律平等", "尊重关心同道，谦虚谨慎求实"]}, {"type": "p", "text": "==2.国外古代医德思想的孕育发展=="}, {"type": "list", "items": ["古埃及医德"]}, {"type": "p", "text": "前4000年进入奴隶制社会，掌握医学解剖学知识和灌肠放血等技术。出现了专科化医生。"}, {"type": "p", "text": "医德思想大多通过法典形式表现，规定奴隶主享有最好的医疗。"}, {"type": "p", "text": "美容、按摩、水疗，使用贵重药品和复杂处方以及防腐尸体（木乃伊）等比较先进的医疗技术，都是供奴隶主专用的，奴隶则没有资格享受。"}, {"type": "list", "items": ["古印度医德"]}, {"type": "p", "text": "前4000年至3000年初进入奴隶社会，世界上最古老医学经典《阿输吠陀》记载了当时医德思想。"}, {"type": "p", "text": "《摩奴法典》规定，医疗差错，根据病人阶级地位不同，医生所受处罚也不同。"}, {"type": "p", "text": "《妙闻集》和《闍罗迦集》两部医学著作集中反映古印度医学的辉煌成就。"}, {"type": "list", "items": ["古巴比伦医德"]}, {"type": "p", "text": "前3000年末至2000年初的伊拉克地区"}, {"type": "p", "text": "《汉漠拉比法典》有7章写到医生的地位、报酬和处罚，体现出较系统的医德规范。"}, {"type": "p", "text": "“医生用青铜刀治上等人的病而致死亡，应处以断手之罪，而使奴隶死亡则只须赔偿一个奴隶；”"}, {"type": "p", "text": "“治上等人的眼白内障引起的伤害，也以断手处之，而使奴隶失明，只要罚奴隶身价的一半等等。”"}, {"type": "list", "items": ["古希腊医德"]}, {"type": "p", "text": "古希腊医德约前6-4世纪形成。"}, {"type": "p", "text": "希波克拉底（Hippocrates前460—377年）西方医学的创始人之一。倡导医巫分离古希腊医德思想奠基人。"}, {"type": "p", "text": "《希波克拉底文集》中《誓言》《论法规》《论艺术》集中体现了他的医德思想。"}, {"type": "list", "items": ["古罗马医德"]}, {"type": "p", "text": "前2-5世纪，罗马继承古希腊医学医德。"}, {"type": "p", "text": "法律法规体现出的医德观念：《十二铜表法》禁止把死者葬于市内；《安东尼奥法令》救治贫民；《查士丁尼法典》医生要力戒阿谀谄媚。"}, {"type": "p", "text": "盖伦（Galen130-220）医德思想"}, {"type": "p", "text": "《最好的医生也是哲学家》“医生不可能一方面赚钱，一方面从事伟大的艺术—医学”“研究医学，抛弃了娱乐，不求身外之物。”“医生应力求掌握哲学及其分科逻辑学、科学和伦理学”。"}, {"type": "p", "text": "盖伦轻利的医德思想深为人民敬仰。朴素唯物观混有唯心目的论，被宗教神学歪曲利用奉为教条，对后世医德思想产生消极影响。"}, {"type": "list", "items": ["中世纪欧洲医德"]}, {"type": "p", "text": "公元5—14世纪中世纪欧洲，基督教神学统治一切意识形态，医德披上了宗教外衣。"}, {"type": "p", "text": "为医生制定许多内容繁杂、条目细致宗教色彩规范，限制理性思考，阻碍思想发展，西方医学医德长期停滞。"}, {"type": "p", "text": "积极方面----宗教慈善事业---照护所"}, {"type": "list", "items": ["古阿拉伯医德"]}, {"type": "p", "text": "继承古希腊医德传统，约在公元6—13世纪形成。医学杰出代表犹太名医迈蒙尼提斯，重要医德文献《迈蒙尼提斯祷文》"}, {"type": "p", "text": "强调为了人类的生命与健康，要时时刻刻恪守医家之德，不为贪欲、虚荣、名利所干扰而忘却为人类谋幸福的目标。行医动机、态度、作风至今仍值得效仿。"}, {"type": "p", "text": "==3.西方近现代医学伦理学的产生发展=="}, {"type": "list", "items": ["17-19世纪末，是西方医学伦理由古代医德学向近代医学伦理学的转变的重要时期。古代医德学作为道德准则和行为规范的积累不能成为一门学科。古代医德学向近代医学伦理学的转变来自于两方面因素的影响。其一，近代社会结构巨大变化引起的政治、经济、文化的重构，改变了社会思想和人们的道德观念，为近代医学伦理学的形成提供了思想基础。其二科学技术进入划时代的发展时期，科学技术革命使以实验医学为基础的医学科学迅速发展，为近代医学伦理学的形成提供了物质基础。", "近代医学伦理学发展"]}, {"type": "p", "text": "明确提出为人道主义行医，摆脱神学影响"}, {"type": "p", "text": "医德由个体道德要求发展到对集体行医规范"}, {"type": "p", "text": "义务论成为医德行为的指导思想"}, {"type": "list", "items": ["现代医学伦理学发展"]}, {"type": "p", "text": "医德规范国际化系统化"}, {"type": "p", "text": "医德思想教育研究进一步重视深化"}, {"type": "p", "text": "医德核心内容由义务论向公益论转化"}, {"type": "p", "text": "医德发展实践，对法律依赖性越来越大"}, {"type": "p", "text": "==4.中国近现代医学伦理学的产生发展=="}, {"type": "list", "items": ["旧民主主义革命时期医学伦理思想"]}, {"type": "p", "text": "沦为半殖民地半封建社会的过程中，西方医学连同文化传入中国，"}, {"type": "p", "text": "中国近代医学伦理思想伴随着反帝反封建的革命斗争革新发展，具有浓厚的救国救民倾向。"}, {"type": "p", "text": "以民族主义、爱国主义和人道主义为特征，孕育形成了民族主义和人道主义相结合的旧民主主义医德。"}, {"type": "p", "text": "晚清时期，许多具有爱国主义和民族主义思想的知识分子和医生，在探索救国救民的道路的过程中，为近代中国医学伦理思想的发展做出了杰出贡献"}, {"type": "p", "text": "民国时期，“如何对待中西医学”以及“中国医学如何发展”一派主张全盘西化；一派主张完全尊古；一派主张中西汇通。既是医学观之争，又是医德观之争，也是一场维护发展传统医德的斗争。"}, {"type": "list", "items": ["新民主主义革命时期医学伦理思想"]}, {"type": "p", "text": "新民主主义革命时期，在中国共产党的领导下，以马克思主义世界观和历史观为基础，清除封建腐朽道德观念和批判资产阶级人道主义基础上，继承中外历史上优良医德传统，把爱国主义和国际主义结合起来，大力倡导救死扶伤的革命人道主义精神，我国医学道德跨入了新的历史阶段。"}, {"type": "p", "text": "土地革命时期，1931年毛泽东同志为红色卫生学校制定了“培养政治坚定，技术优良的红色医生”的医学教育方针。"}, {"type": "p", "text": "1932年朱德《怎样做一个红色医生》的报告明确提出“红色医生必须要具有坚定的政治立场，对人民、对病员要满怀阶级感情；要有艰苦奋斗，舍己为人，救死扶伤的工作精神，同时还必须具备科学知识和精湛的医疗技术”。"}, {"type": "p", "text": "抗日战争时期，《纪念白求恩》《为人民服务》光辉文章的发表为丰富提升我军医德思想奠定了基础"}, {"type": "p", "text": "坚持“救死扶伤，实行革命的人道主义”、坚持全心全意“为人民服务”、坚持“防治结合，预防为主”等重要指导原则的提出，形成了我军医德原则的基本框架，成为我军医德的指导思想"}, {"type": "p", "text": "1939年毛泽东发表《纪念白求恩》倡导的“毫不利已、专门利人”“对工作的极端的负责任”“对同志对人民的极端的热忱”“对技术精益求精”，做“一个高尚的人，一个纯粹的人，一个有道德的人，一个脱离了低级趣味的人，一个有益于人民的人”的白求恩精神，是对我党我军医疗卫生工作职业道德和精神风貌的高度概括凝练，是我党极其重要的医德文献。"}, {"type": "p", "text": "1941革命人道主义"}, {"type": "list", "items": ["社会主义医学伦理思想"]}, {"type": "p", "text": "新中国成立后，社会主义生产关系确立，大力进行社会主义、共产主义、爱国主义和为人民服务宗旨教育，大力倡导集体主义道德价值观，全社会逐步树立和确立了社会主义的医德观。大体说来，社会主义医学伦理思想的完善和发展经历了三个阶段。"}, {"type": "p", "text": "第一个阶段（1949-1976）：防病治病、救死扶伤、全心全意为人民服务的医学伦理思想和伦理原则，在全国范围内确立、体现和发展。"}, {"type": "p", "text": "第二个阶段（1966-1976）:在“文化大革命”阶级斗争为纲和“破四旧” 冲击下，一些行之有效的医疗制度作为“条条框框”“砸烂”废除，甚至医护人员分工都被取消，混乱的秩序严重影响了医疗质量"}, {"type": "p", "text": "第三个阶段（1976至今）：特别是党的十一届三中全会以来，职业道德作为社会主义思想道德建设的重要内容重新确立，医学伦理学的研究和指导作用，日益得到党和国家卫生部门的重视，医学伦理学得以复兴发展"}, {"type": "p", "text": "==5.生命伦理学=="}, {"type": "list", "items": ["兴起背景", "现代医学技术发展带来的伦理问题", "社会文化发展引发的医学伦理问题", "主要问题", "患者权利和知情同意", "生殖控制伦理问题", "卫生资源公正分配问题", "死亡标准方式问题", "医学模式转变问题", "理论内容", "生命伦理学的含义"]}, {"type": "p", "text": "生命伦理学是对生命诸问题的道德哲学注释，是对人类生存过程中生命科学技术和卫生保健政策以及医疗活动中道德问题的伦理研究，是有关人和其他生命体生存状态和生命终极问题的学科，包括“理论生命伦理学”和“应用生命伦理学”"}, {"type": "list", "items": ["生命伦理学学科性质"]}, {"type": "p", "text": "克劳塞（K. D. Clouser)：生命伦理学是对新难题、新知识和受到威胁权利的自然反应，是伦理学应用于特定领域，不是基本原理定理的新发现。生命伦理学包括医学伦理学。"}, {"type": "p", "text": "马普斯（T. A. Mappes)：生物医学伦理学为一般伦理学的学科，任务是解决与医学实践和生物医学研究有关的伦理学问题，建立人们应该有什么样的道德观，而不是人们事实上有什么道德观的问题。"}, {"type": "p", "text": "恩格尔哈特（H. T. Engelhardt) ：生命伦理学是文化与科学技术相互作用基础上更好地理解人和人类的哲学，通过改变一些基本概念达到政策改变的作用，如脑死亡的定义，生命伦理学是文化自我理解和自我改造的中心要素。生命伦理学作为一门哲学，比医学伦理学具有更广泛的意义。"}, {"type": "list", "items": ["生命伦理学应用原则"]}, {"type": "p", "text": "自主 无伤 有利 公正"}, {"type": "list", "items": ["生命伦理学核心问题"]}, {"type": "p", "text": "生命神圣与生命质量的关系"}, {"type": "p", "text": "生命价值与社会价值的关系"}, {"type": "p", "text": "患者利益与社会公益的关系"}, {"type": "list", "items": ["生命伦理学核心问题"]}, {"type": "p", "text": "生命控制：避孕、流产、人工授精、体外受精、无性繁殖；遗传和优生方面的产前诊断、性别选择、遗传咨询、基因治疗、DNA重组、优生；人体器官移植。"}, {"type": "p", "text": "死亡控制：脑死亡和心肺死亡标准；主动被动安乐死；植物人的处理；有缺陷新生儿处理等。"}, {"type": "p", "text": "行为控制：对精神病患者的行为干预，药物控制、器械控制、手术控制。"}, {"type": "p", "text": "资源分配：稀有卫生资源的宏观和微观分配；卫生政策和医疗保障公正等。"}, {"type": "h", "level": 3, "id": "s3", "text": "医学伦理学的原则与规范"}, {"type": "p", "text": "==1.医学伦理学基本原则=="}, {"type": "p", "text": "医学伦理学基本原则是指在医学实践活动中调节医患关系以及医务人员、医疗机构与社会关系的基本出发点和基本准则，是衡量医务人员职业道德的基本尺度。"}, {"type": "p", "text": "四原则：尊重、不伤害、有利和公正。"}, {"type": "p", "text": "==2.尊重原则=="}, {"type": "p", "text": "医务人员对患者的生命、人格及其自主权的尊重。"}, {"type": "list", "items": ["内容", "重患者的生命"]}, {"type": "p", "text": "尽力救治患者，维护其生命存在；提高生命质量，维护其生命价值"}, {"type": "list", "items": ["尊重患者的人格"]}, {"type": "p", "text": "同情患者痛苦，减少缓解痛苦"}, {"type": "p", "text": "尊重患者内心感受和价值理念"}, {"type": "p", "text": "肯定患者生命存在的价值意义"}, {"type": "list", "items": ["尊重患者的隐私权"]}, {"type": "p", "text": "患者私密性信息不泄露"}, {"type": "p", "text": "患者身体不被随意观察"}, {"type": "list", "items": ["尊重患者的自主"]}, {"type": "p", "text": "患者自主权是指处于医疗关系中具有行为能力的患者，在医患有效沟通交流之后，经过深思熟虑，就有关自己疾病和健康问题做出合乎理性的决定，并据此采取负责的行动。"}, {"type": "list", "items": ["患者自主的条件"]}, {"type": "p", "text": "1>患者能够理解的医方提供的正确适量适度信息为前提；"}, {"type": "p", "text": "2>患者必须具有一定的自主能力，丧失或缺乏自主能力的患者，其自主由家属或监护人代替；"}, {"type": "p", "text": "3>患者作出决定时，精神必须处于稳定状态"}, {"type": "p", "text": "4>患者的决定必须是深思熟虑并和家人商讨过；"}, {"type": "p", "text": "5>患者的决定不会与他人、社会利益发生严重冲突。"}, {"type": "list", "items": ["医方做主的条件"]}, {"type": "p", "text": "1>患者昏迷，病情十分危急，需要立即处置和抢救，来不及获取病人家属知情同意。"}, {"type": "p", "text": "2>“无主”（无任何代行自主权人）患者需要急诊急救，本人不能行使自主权。"}, {"type": "p", "text": "3>患者不合理决定，严重损害自身生命健康或对他人社会危害严重。"}, {"type": "list", "items": ["对医者的要求", "尊重患者的生命、人格尊严，呵护患者的隐私。", "尊重患者知情同意权利，对于缺乏或丧失知情同意能力患者，应尊重家属监护人的知情同意权利。", "处理好患者自主与医方做主的关系，履行帮助、劝导、限制患者及其亲属选择的责任。"]}, {"type": "p", "text": "==3.不伤害原则=="}, {"type": "p", "text": "医务人员在诊治过程中，应尽量避免对患者造成生理上和心理上的伤害，更不能人为有意地制造伤害。"}, {"type": "list", "items": ["不伤害原则相对性"]}, {"type": "p", "text": "凡是在医疗和护理上必需的或者是属于适应症范围的医疗手段，是符合不伤害原则正当伤害。"}, {"type": "p", "text": "凡是对患者不必要的或者是禁忌的，无论有意还是无意，勉强实施使患者受到伤害，就违背了不伤害原则的不当伤害。"}, {"type": "list", "items": ["临床伤害分类"]}, {"type": "p", "text": "1>内容角度：身体伤害 精神伤害 经济伤害"}, {"type": "p", "text": "2>主观意志角度："}, {"type": "p", "text": "1》有意伤害：医务人员出于极不负责或打击报复等给患者造成的直接伤害"}, {"type": "p", "text": "无意伤害：医务人员非故意而是在正常的诊治、护理过程中给患者造成的间接伤害"}, {"type": "p", "text": "2》可知伤害：医务人员预先知晓或应该知晓给患者带来的伤害"}, {"type": "p", "text": "不可知伤害：医务人员无法预先知晓而给患者带来的意外伤害"}, {"type": "p", "text": "3》可控伤害：医务人员经过努力可以也应该降低或杜绝给患者造成伤害"}, {"type": "p", "text": "不可控伤害：超出了医务人员的控制能力而给患者造成的伤害"}, {"type": "p", "text": "4》责任伤害：医务人员的有意伤害以及虽然无意但属于可知、可控而未加认真预测与控制、任其发生对患者的伤害"}, {"type": "p", "text": "非责任伤害：意外伤害或虽医务人员可知而不可控，给患者造成的伤害"}, {"type": "list", "items": ["不伤害原则对医者要求"]}, {"type": "p", "text": "1>树立不伤害的意识，医疗中首先想到不伤害患者，杜绝有意和责任伤害，把不可避免但可控的伤害控制在最低限度；"}, {"type": "p", "text": "2>正确处理审慎与胆识关系，选择最佳方案，防范无意但却可知伤害以及意外伤害的出现。"}, {"type": "p", "text": "3>善于权衡伤害和受益，对有危险或伤害的医疗措施比较评价，只有相对于受益，危险或伤害能够接受，才符合不伤害原则。"}, {"type": "p", "text": "==4.有利原则=="}, {"type": "p", "text": "行善原则。有利原则要求医务人员的医疗诊治行为应该保护患者的利益、促进患者健康、增进其幸福。"}, {"type": "list", "items": ["内容"]}, {"type": "p", "text": "康复 治愈 好转 减少痛苦 健康促进 节省费用 满足正当心理需求"}, {"type": "list", "items": ["有利原则对医者的要求"]}, {"type": "p", "text": "1>首先考虑患者的利益，做对患者有益的事，努力维护患者生命健康，始终将患者利益放在首位；"}, {"type": "p", "text": "2>准确诊断、有效治疗，努力提高患者生命质量，满足患者健康需求；"}, {"type": "p", "text": "3>提供最优化服务，全面权衡利害得失，选择受益最大、伤害最小的医学决策；"}, {"type": "p", "text": "4>坚持公益原则，将有利于患者同有利于社会健康公益统一起来。"}, {"type": "p", "text": "==5.公正原则=="}, {"type": "p", "text": "公正原则要求医务人员合理分配和实现人们的医疗和健康利益。在医疗服务中, 合理、公平、正直地对待每一位患者的伦理原则。价值主要在于协调日趋复杂的医患关系, 解决日趋尖锐的健康利益分配的基本矛盾。"}, {"type": "list", "items": ["依据"]}, {"type": "p", "text": "医患双方地位、人格、尊严相互平等。（平等待患）"}, {"type": "p", "text": "人人享有平等的生命健康权和医疗保健权。（一视同仁）"}, {"type": "list", "items": ["分类"]}, {"type": "p", "text": "公正形式：报偿性公正、程序性公正、分配性公正"}, {"type": "p", "text": "公正原则：形式公正（相同的疾患同样对待，不同的疾患不同对待）"}, {"type": "p", "text": "实质公正（根据个人需要、能力、对社会的贡献、家庭角色）"}, {"type": "list", "items": ["要求"]}, {"type": "p", "text": "1>公正地分配卫生资源。"}, {"type": "p", "text": "医务人员既有宏观分配卫生资源的建议权，又有参与微观分配卫生资源的权利。"}, {"type": "p", "text": "2>公正地对待患者，特别是老年患者、精神病患者、残疾患者、年幼患者要给予足够的耐心和尊重等。"}, {"type": "p", "text": "3>处理医患纠纷和医护差错事故，要坚持实事求是，站在公正的立场上。"}, {"type": "p", "text": "==6.我国社会主义医德基本特点=="}, {"type": "list", "items": ["马克思主义伦理观为指导"]}, {"type": "p", "text": "社会主义医德是以社会主义和共产主义的道德理论为指导，全面继承人类优秀的医德传统，科学概括社会主义条件下的医德现象而产生和发展起来的，是医德发展史上最进步最科学的医德理论。"}, {"type": "p", "text": "历史唯物主义关于道德起源、本质、功能和发展规律为医德建设研究提供了科学理论基石。"}, {"type": "p", "text": "实践到认识再到实践认识路线，解放思想、实事求是、与时俱进的思想路线，为医德研究提供科学方法和思想动力保证。"}, {"type": "list", "items": ["以集体主义为原则"]}, {"type": "p", "text": "集体主义是在个人根本利益和集体利益一致的基础上，主张个人从属于社会，个人利益应当服从社会集体利益的一种思想理论和精神"}, {"type": "p", "text": "个人主义是在抽象人性论和人是自私的理论基础上一切从个人出发，以个人为核心，把个人利益放在集体利益之上，只顾自己不顾别人的错误思想。"}, {"type": "list", "items": ["集体主义科学性"]}, {"type": "p", "text": "“人的本质是一切社会关系的总和”理论基础"}, {"type": "p", "text": "强调个人集体协调统一，尊重个人正当利益，只有发生矛盾时，坚持集体重于个人，个人利益服从集体利益。"}, {"type": "p", "text": "作为社会主义道德基本原则，强调协调个人利益和集体利益的关系以达到共同发展的目的。"}, {"type": "list", "items": ["集体主义的医德价值"]}, {"type": "p", "text": "集体主义以集体、社会和人民的健康利益为最高利益，有利于医学人道主义精神发扬和医学根本目实现。"}, {"type": "p", "text": "集体主义强调个人的正当利益，有利于维护医务人员合理的切身利益，有利于医务人员积极性发挥。"}, {"type": "p", "text": "有利于发挥团队优势，形成整体的合力，提高医疗效率，实现效益价值最大化。"}, {"type": "list", "items": ["适应超越社会主义市场经济", "市场经济对社会主义医德建设机遇"]}, {"type": "p", "text": "一是市场经济发展，极大促进了我国生产力发展，为医疗事业提供了强大经济支撑，为社会主义医德建设提供坚实的物质基础。二是市场经济所蕴涵新道德准则极大丰富增强了社会主义道德内涵。"}, {"type": "list", "items": ["市场经济对社会主义医德建设挑战"]}, {"type": "p", "text": "求利原则，既可以强化人们正确的利润效率意识，又可能诱发拜金主义倾向；"}, {"type": "p", "text": "竞争原则，既可以激励奋发进取开拓创新意识，又可能引发不择手段、损人利己的行为；"}, {"type": "p", "text": "自主原则，既可以催生人们的自由平等意识，又可能产生个人主义、本位主义倾向；"}, {"type": "p", "text": "等价交换原则，既可以增强人们的平等互利意识，又可能助长非经济领域中的权钱交易"}, {"type": "p", "text": "==7.我国社会主义医德根本原则=="}, {"type": "list", "items": ["社会主义医德的根本原则概括"]}, {"type": "p", "text": "1981年全国第一届医学伦理学大会上提出和确立：防病治病、救死扶伤，实行社会主义的医学人道主义，全心全意为人民健康服务"}, {"type": "list", "items": ["社会主义医德的根本原则内涵", "救死扶伤"]}, {"type": "p", "text": "救死扶伤明确了医学服务的核心任务和医疗卫生人员的核心医德责任"}, {"type": "p", "text": "践行医德基本途径，实现健康基本手段"}, {"type": "p", "text": "竭尽全力挽救患者，维护人民的健康"}, {"type": "list", "items": ["防病治病"]}, {"type": "p", "text": "体现了防治结合的医疗理念，从宏观层面指明了医学服务必须承担完整的医德责任"}, {"type": "p", "text": "既要重视对患者的救治，也要重视疾病的预防工作。正确认识处理患者个体、社会公众、生态环境关系"}, {"type": "list", "items": ["实行社会主义人道主义"]}, {"type": "p", "text": "明确了医学服务的职业道德要求"}, {"type": "p", "text": "敬畏和珍爱人的生命"}, {"type": "p", "text": "理解和维护人的尊严"}, {"type": "p", "text": "尊重和保护病人权利，"}, {"type": "p", "text": "同情和关爱病人身心健康"}, {"type": "p", "text": "人道主义的实行受一定社会政治制度、经济关系、文化传统、宗教信仰的制约。"}, {"type": "p", "text": "社会主义人道主义建立在集体主义原则和人民利益高于一切的思想基础上，集古今中外医学人道主义精神之大成，是党的革命人道主义传统的继承发扬。"}, {"type": "list", "items": ["全心全意为人民健康服务"]}, {"type": "p", "text": "明确了社会主义医疗事业的根本目的和崇高道德境界"}, {"type": "p", "text": "社会主义医德的根本价值"}, {"type": "p", "text": "人民是历史的创造者，全心全意为人民服务，符合历史发展规律"}, {"type": "p", "text": "党的宗旨不是空洞的信条，必须落实体现到各个行业领域的实际工作中去"}, {"type": "p", "text": "始终把人民群众健康利益放在工作第一位，一切以人民利益为重，一切服从人民利益需要"}, {"type": "p", "text": "把救死扶伤作为理所当然和义不容辞之责，投入全部精力，毫无保留救助患者"}, {"type": "list", "items": ["性质"]}, {"type": "p", "text": "继承性、崇高性、科学性"}, {"type": "list", "items": ["地位"]}, {"type": "p", "text": "理论：医德规范体系的总纲精髓。"}, {"type": "p", "text": "实践：调节医德关系的根本标准。"}, {"type": "list", "items": ["意义"]}, {"type": "p", "text": "为我国医疗事业发展提供了正确价值导向"}, {"type": "p", "text": "帮助广大医务人员树立正确道德价值取向"}, {"type": "p", "text": "提供了卫生改革政策制订的价值评价标准"}, {"type": "p", "text": "==8.医德规范=="}, {"type": "list", "items": ["概念"]}, {"type": "p", "text": "依据一定的医学道德理论和原则制定的，用以调整医学实践中各种利益关系、评价医学行为善恶的准则。医德原则的具体体现。既包括普遍适用于医疗活动的一般准则，也包括专门适用于不同科室、不同专业的特殊准则。"}, {"type": "list", "items": ["构成"]}, {"type": "p", "text": "学道德规范以“哪些应该做、哪些不应该做”为内容，以简明扼要、易于记忆理解为形式。"}, {"type": "p", "text": "==9.国际国内主要医学道德规范=="}, {"type": "list", "items": ["国际上具有代表性的医学道德规范", "《希波克拉底誓言》是古今中外医德文献的经典。", "《日内瓦宣言》1948年，世界医学会颁布的第一个国际性医德文件，国际医学伦理权威文献，极强的规范、指导和激励作用，", "《国际医德守则》1949年10月，伦敦世界医学会第三次会议颁布，该守则涵盖医师一般职责、医师对患者和医师相互之间三个方面职责。", "2002年《新世纪医学职业精神：医师宣言》明确提出了医学职业精神三项基本原则和十项职业责任。"]}, {"type": "p", "text": "三项基本原则：把患者利益放在首位，患者自主，社会公正。"}, {"type": "p", "text": "十项职业责任：致力于提高专业水准；对患者诚实，为患者保密；和患者保持适当关系；不断提高医疗服务的品质；推动医疗服务的普及；对有限的资源进行公平分配；进行科学知识的创新；保证知识的可靠性；解决利益冲突而维护信任；承担本专业内部的责任。"}, {"type": "p", "text": "中国医师协会2005年正式签署该宣言"}, {"type": "list", "items": ["国内主要医学道德规范", "《医务人员医德规范及实施办法》1988年卫生部", "《医疗机构从业人员行为规范》2012年6月26日，卫生部、食品药品监督管理局和中医药管理局发布八条基本医德准则。", "《中国医学生誓词》1991年国家教育委员会发布", "《临床医师公约》1996年中国科学院和中国工程院28名医学界院士联名提出五条医学道德规范。", "《中国医师道德准则》2014年6月25日，中国医师协会颁布，明确医师应处理好与患者、同行、社会及企业的关系，共列出40条准则，为医师划出了道德底线。"]}, {"type": "p", "text": "==10.我国医学道德规范的基本内容=="}, {"type": "list", "items": ["救死扶伤、以人为本（服务宗旨）"]}, {"type": "p", "text": "秉持“大医精诚”理念，弘扬人道主义精神，救死扶伤、防病治病，全心全意为人民健康服务。"}, {"type": "p", "text": "医疗活动中以人为本，关爱患者，尊重人的价值，强调患者的中心地位。"}, {"type": "list", "items": ["严谨求实、精益求精（学风研风）"]}, {"type": "p", "text": "认真学习，诚信科研，抵制学术不端。"}, {"type": "p", "text": "热爱专业，加强三基(基本知识理论技能)三严(严肃严格严密)训练。"}, {"type": "p", "text": "认真吸取国内外先进经验，积极开展新技术、新疗法、不断提高医疗水平。"}, {"type": "p", "text": "做到及时准确诊疗，选择最佳术式，确定最好方案，力争理想康复效果。"}, {"type": "list", "items": ["平等交往、一视同仁 （医患关系）"]}, {"type": "p", "text": "平等交往是指医患双方平等相处，不凌驾患者之上。"}, {"type": "p", "text": "一视同仁是指对所有患者同等对待。不因种族、宗教、地域、贫富、地位、残疾、疾病歧视患者。"}, {"type": "p", "text": "平等待患是对患者权利尊严的尊重关心，体现人际交往社会地位和人格尊严的平等。"}, {"type": "list", "items": ["举止端庄、语言文明（职业形象）"]}, {"type": "p", "text": "行为文明。做到态度和蔼可亲，动作轻盈敏捷，举止沉着稳重，紧急情况有条不紊"}, {"type": "p", "text": "装束文明。着装规范、整洁、朴素、大方。"}, {"type": "p", "text": "语言文明。模范运用礼貌语言，突出医学特点，讲究语言艺术性。"}, {"type": "list", "items": ["廉洁行医、遵纪守法 （利益操守）"]}, {"type": "p", "text": "清正廉洁、奉公守法，严格自律。"}, {"type": "p", "text": "不索取收受患者财物，不谋取不正当利益。"}, {"type": "p", "text": "不收受回扣提成，不参加企业安排或支付费用的营业性娱乐活动。"}, {"type": "p", "text": "不骗取套取基本医疗保障资金或为他人提供便利"}, {"type": "p", "text": "不参与医疗药品器械广告宣传促销，不倒卖号源"}, {"type": "list", "items": ["诚实守信、保守医密（职业信誉）"]}, {"type": "p", "text": "守信是医务人员对待患者的一条普遍要求"}, {"type": "p", "text": "诚心为医，即忠诚于患者和医学事业；言行一致，做实事、守信用。杜绝弄虚作假、背信弃义、欺诈取巧不良医风。"}, {"type": "p", "text": "尊重患者知情同意权和隐私权，保守患者医疗秘密。"}, {"type": "list", "items": ["互尊互学、团结协作（同事关系）"]}, {"type": "p", "text": "彼此平等，互相尊重，和谐共事"}, {"type": "p", "text": "互相学习，共同提高，发挥优势"}, {"type": "p", "text": "彼此独立，互相支持和帮助"}, {"type": "p", "text": "彼此信任，互相协作和监督"}, {"type": "p", "text": "共同维护患者利益和社会公益"}, {"type": "list", "items": ["乐于奉献、热心公益 （公益精神）"]}, {"type": "p", "text": "积极参加政府安排的抗灾救灾、应对突发性卫生事件等医疗任务和扶贫、义诊、助残、支农、援外等社会公益性医疗活动。"}, {"type": "p", "text": "主动开展公众健康教育及社区保健服务，促进改善公众健康状况。"}, {"type": "h", "level": 3, "id": "s4", "text": "医学伦理学基本范畴"}, {"type": "p", "text": "==1.医德权利=="}, {"type": "p", "text": "就是医生和患者双方，在医疗活动中，在医学道德所允许范围内，可以行使的权力和享受的利益"}, {"type": "list", "items": ["患者的权利"]}, {"type": "p", "text": "患者在患病和接受治疗服务期间应有的权力和必须保障的利益"}, {"type": "list", "items": ["患者权利是一种道义、有条件的权利，包含法律范围，如隐私权和知情同意权。患者权利作为伦理学概念，涉及伦理道义内容，许多权利有赖于患者权利意识和医者道德义务自觉来实现。", "内容"]}, {"type": "p", "text": "1>基本医疗权"}, {"type": "p", "text": "任何患者都享有医疗的权利"}, {"type": "p", "text": "任何患者医疗权利是平等的"}, {"type": "p", "text": "2>知情同意权"}, {"type": "p", "text": "知情同意权，指医疗中病人在知晓理解自己疾病信息的前提下，经过深思熟虑，就有关自己疾病健康问题作出符合科学理性的决定并据此采取负责行动的权利。知情同意是病人权利最实质内容和保障。患者有拒绝治疗的权利。患者有拒绝任何实验的权利"}, {"type": "p", "text": "3>保护隐私权"}, {"type": "p", "text": "治病需要和对医生信任，医生取得病人隐私。"}, {"type": "p", "text": "了解病人隐私，只能为正确诊断病情，选择恰当方案，及时解除痛苦，恢复病人健康。"}, {"type": "p", "text": "必须充分尊重病人隐私权。处理不慎，会给病人名誉身心造成严重损害，不利于康复，甚至影响工作生活。"}, {"type": "p", "text": "4>免除一定社会责任权"}, {"type": "p", "text": "疾病往往影响患者机体能力，导致承担社会义务能力减弱。"}, {"type": "p", "text": "患者有权依据病情暂时或者长期免除一些社会工作义务。"}, {"type": "p", "text": "5>医疗赔偿权"}, {"type": "p", "text": "有权对不负责任、质量低劣、有损健康的医疗服务提出赔偿要求，甚至追究法律责任。"}, {"type": "p", "text": "医疗责任事故 技术事故"}, {"type": "list", "items": ["医者的权利"]}, {"type": "p", "text": "法律权利——在医疗工作中医生依法行使的医疗权力和享受的利益"}, {"type": "p", "text": "道德权利——在医疗工作中依道义允许行使的权力和享受的利益"}, {"type": "list", "items": ["自主的诊治权"]}, {"type": "p", "text": "医生最基本的权利，正规培训考核、国家认定获得。"}, {"type": "p", "text": "医生有包括疾病诊断、诊疗措施采用、治疗方法选择等医疗方案和医学行为的自主决定权。"}, {"type": "p", "text": "医生有取得患者现病史、既往病史、遗传史、生活方式和个人隐私等信息的自主权力。"}, {"type": "p", "text": "患者及家属对治疗方案措施可以参与讨论并提出意见，但始终不能代替医生作出决定。"}, {"type": "p", "text": "医生诊治权利不受外界任何因素的影响和干扰，包括政治或社会原因的干预。"}, {"type": "p", "text": "1975年世界医学会通过的《东京宣言》第四条规定：“医师对其医疗的病人有医疗的责任，在作医疗决定时是完全自主的。”"}, {"type": "list", "items": ["特殊的干涉权"]}, {"type": "p", "text": "特定情况下，医生限制患者的自主权利，实现医疗意志达到对患者应尽责任目的，一般也称为医生的特殊权。"}, {"type": "p", "text": "特殊干涉权，不可以任意行使，只有当患者自主原则与生命价值原则、有利原则、无伤害原则和社会公益原则发生矛盾时，才能使用。"}, {"type": "p", "text": "拒绝治疗时/要求知道病情时/要求保密时/须行为控制时/试验性治疗时"}, {"type": "list", "items": ["宣告死亡的权利"]}, {"type": "p", "text": "患者的死亡是一个生物学过程，医生依照国家认定的死亡标准作出死亡判断，并对外界宣布。"}, {"type": "p", "text": "对死亡的认定是一个纯医学判断，不能加入其他价值判断。"}, {"type": "list", "items": ["工作学习研究的权利"]}, {"type": "p", "text": "为保障医疗工作正常进行、不断提高业务水平，医务人员工作学习生活有受保护的权利。"}, {"type": "p", "text": "设备使用权利-----诊疗用品器械"}, {"type": "p", "text": "科学研究权利-----科学研究、学术交流、参加学术团体"}, {"type": "p", "text": "继续教育权利-----有获得进修、考察、深造的权利。"}, {"type": "p", "text": "经济待遇权利-----物质待遇，工资、津贴、福利"}, {"type": "p", "text": "人身安全权利------人格尊严人身安全不受侵犯"}, {"type": "list", "items": ["民主管理权"]}, {"type": "p", "text": "作为医学力量主体对所在机构的医政工作有批评建议权"}, {"type": "p", "text": "医生有权关心医疗卫生事业发展，对预防保健环境保护精神卫生等提出建议参与实施。"}, {"type": "p", "text": "医生有权参与国家卫生战略目标方针政策的制定并充分发表意见。"}, {"type": "p", "text": "==2.医德义务=="}, {"type": "p", "text": "医患双方应尽的道德责任。它是调节医务人员与病人、社会的道德关系的一项重要行为准则"}, {"type": "list", "items": ["特点"]}, {"type": "p", "text": "1>无条件性和非权利动机性"}, {"type": "p", "text": "履行道德义务不以享受或获取某种权利、利益为前提，为病人服务，不能把获得病人和社会给予自己权利的多少作为决定应承担医德义务多寡的砝码。"}, {"type": "p", "text": "2>承担履行义务的自觉性和自律性"}, {"type": "list", "items": ["医者的义务"]}, {"type": "p", "text": "1>对患者的义务"}, {"type": "p", "text": "抢救转诊的义务"}, {"type": "p", "text": "遵守法律法规和技术操作规范义务"}, {"type": "p", "text": "如实告知说明的义务"}, {"type": "p", "text": "保护患者隐私的义务"}, {"type": "p", "text": "如实记载妥善保管病历的义务"}, {"type": "p", "text": "2>对社会义务"}, {"type": "p", "text": "面向社会预防保健责任"}, {"type": "p", "text": "参加社会现场急救责任"}, {"type": "p", "text": "发展医学科学责任"}, {"type": "list", "items": ["患者的义务"]}, {"type": "p", "text": "1>如实提供病情有关信息的义务"}, {"type": "p", "text": "如实提供病史、病情等相关信息，是及时、正确的诊断和治疗疾病的前提。"}, {"type": "p", "text": "2>遵守医院规章制度的义务"}, {"type": "p", "text": "医院各项规章制度是保证医院正常医疗秩序，提高医护质量的有力措施。"}, {"type": "p", "text": "探视制度、卫生制度、陪护制度、尸体常规处置、传染病隔离制度等。"}, {"type": "p", "text": "3>保持和恢复健康的义务"}, {"type": "p", "text": "积极配合治疗，建立合理生活方式，积极锻炼身体，增强抗病能力，减少疾病发生，养成良好生活习惯的义务。"}, {"type": "p", "text": "患病承担社会责任能力减弱，给家庭社会造成负担。任何人都没有故意伤害自己，使自己罹患疾病的权利。"}, {"type": "p", "text": "疾病与生活方式密切，不良生活方式和行为模式致病，是未尽健康义务和违反健康道德的表现。如吸烟引起癌症，酗酒导致肝硬化等。"}, {"type": "p", "text": "4>给付医疗费用的义务"}, {"type": "p", "text": "医疗费用包括诊疗、处方、检验、药品、手术、处置、住院等各种费用的总和。"}, {"type": "p", "text": "医疗费用是医者劳动付出的体现，患者不能以救治失败为理由拒付。"}, {"type": "p", "text": "急诊抢救的急危重症病人，医师不得因病人未先交付医疗费用而拒绝及时诊治"}, {"type": "p", "text": "5>支持教学活动促进医学发展的义务"}, {"type": "p", "text": "医学发展需要对罕见疑难病进行研究，寻找预防治疗方法。未能明确诊断一些疑难病症，需要进行尸体解剖。"}, {"type": "p", "text": "新药使用、新疗法推广以及医学生的培养，都需要得到患者的支持配合。"}, {"type": "p", "text": "发展医学科学是一项事关人类长远利益、造福子孙后代的事业，病人有义务支持和促进医学事业的发展。"}, {"type": "p", "text": "==3.医德情感=="}, {"type": "p", "text": "医务人员在医疗过程中，根据一定的医德要求对患者、医学事业以及各种行为的内心体验。\n①特点"}, {"type": "p", "text": "1>职业特殊性---热爱医学和患者"}, {"type": "p", "text": "2>自觉纯洁性---排除个人“私情”"}, {"type": "p", "text": "3>医德情感是医德意识、医德良心、医德意志、医德信念的基础，是正确处理医患关系，提高服务水平的支撑"}, {"type": "list", "items": ["内容"]}, {"type": "p", "text": "1>责任感：对患者和人民群众整体健康利益负责"}, {"type": "p", "text": "2>同情感：热爱人和生命为核心的强烈人道主义意识"}, {"type": "p", "text": "3>事业感： 对医学事业强烈兴趣和献身精神"}, {"type": "p", "text": "==4.理智=="}, {"type": "p", "text": "医者认识理解和思考决断医学伦理问题的理性能力，或辨别是非利害关系及控制自己行为的理性能力，常常表现为清醒、冷静、合乎实际的思维。"}, {"type": "list", "items": ["作用"]}, {"type": "p", "text": "1>认知与自制能力----主要是感知辨识情感优劣，从而控制平衡自我情绪；"}, {"type": "p", "text": "2>智慧与决疑能力----主要是通过优化情感，整合医学服务中的主体多元素质，为病人提供最佳的医学服务。"}, {"type": "list", "items": ["要求"]}, {"type": "p", "text": "1>要防范自我情感不良应答、盲目诉求、过度膨胀及情感缺失，以道德理性全面整合自我情感世界。"}, {"type": "p", "text": "2>要正确对待对方情感，不为患方恶性心态干扰，不以无益廉价情感应付迁就讨好，坚持科学精神，保持清醒头脑，认真负责地对待病人。"}, {"type": "p", "text": "3>要正确认识对待周围情感氛围，恪守科学原则和医德规范，抵制排除不良情绪的群体化。"}, {"type": "p", "text": "==5.良心=="}, {"type": "p", "text": "伦理学特有的范畴，是人们在履行对他人和社会义务过程中所形成的内化为主体意识状态的道德责任感和自我评价能力。是道德情感、情绪、意志内在统一，是以道德原则规范为内心信念情感的道义力量。"}, {"type": "list", "items": ["良心形式上与义务紧密相连", "良心构成上是多种心理意识有机结合（孟子四心）", "良心本质上是一定道德原则规范的体现"]}, {"type": "p", "text": "医德良心是医务人员对自己行为荣辱美丑的深刻感受检点。是在履行对患者和社会的医疗义务中形成的发自内心的对所担负职业道德的自我意识和自我评价。"}, {"type": "list", "items": ["内容要求"]}, {"type": "p", "text": "1>医德良心要求医务人员忠实于患者"}, {"type": "p", "text": "2>医德良心要求医务人员忠实于社会"}, {"type": "p", "text": "3>医德良心要求医务人员忠实于医学事业"}, {"type": "list", "items": ["作用方式"]}, {"type": "p", "text": "1>行为前-------自觉选择行为方式"}, {"type": "p", "text": "2>行为中-------自觉监督行为表现"}, {"type": "p", "text": "3>行为后-------自觉评价行为结果"}, {"type": "p", "text": "==6.荣誉=="}, {"type": "p", "text": "社会对医务人员道德行为价值的肯定褒奖和医务人员理性自尊的统一。既是社会对医者高尚行为肯定，又是个人对社会肯定性评价的自我认同；体现为履行医德受到褒奖而产生的自我赞赏。"}, {"type": "list", "items": ["科学把握医德荣誉"]}, {"type": "p", "text": "1>荣誉感与虚荣心的矛盾。"}, {"type": "p", "text": "2>集体荣誉与个人荣誉的矛盾"}, {"type": "p", "text": "3>社会毁誉与自我褒贬的矛盾。"}, {"type": "list", "items": ["树立正确的名誉观"]}, {"type": "p", "text": "1>重视名誉。追求名誉是职业荣誉感和个人自尊表现，符合社会要求。"}, {"type": "p", "text": "2>不唯名誉。名誉永远同医术医德、创造贡献相随。脱离工作的名誉，虚伪毫无价值。"}, {"type": "p", "text": "3>求名有道。获得名誉，保持名誉，必须确立正当目的，选择正当手段。"}, {"type": "p", "text": "==7.医德审慎=="}, {"type": "p", "text": "医者行为前的周密思考和行为中的谨慎从事。既是信念良心的具体体现，又是义务感责任感的总体表现，是对病人高度负责精神和严谨科学作风的有机结合。"}, {"type": "list", "items": ["行的审慎（慎行）"]}, {"type": "p", "text": "“诊断审慎” “治疗审慎”"}, {"type": "p", "text": "“用药如用兵”“用药如用刑”的告诫"}, {"type": "p", "text": "“当代医圣”张孝骞教授“戒\\慎\\恐\\惧” 从医座右铭"}, {"type": "list", "items": ["言的审慎（谨言）"]}, {"type": "p", "text": "语言不仅是了解病人疾病的手段，也是心理治疗的一种方法。"}, {"type": "p", "text": "希波克拉底：“医生有两件东西可以治病，一是语言，二是药物”"}, {"type": "p", "text": "礼貌性语言、安慰性语言、鼓励性语言、保护性语言"}, {"type": "list", "items": ["审慎的作用"]}, {"type": "p", "text": "有助于防止医疗差错事故，保障病人生命健康安全"}, {"type": "p", "text": "有助于正确诊断治疗，攻克疑难杂症。"}, {"type": "p", "text": "有助于选择最优化的治疗方案。"}, {"type": "p", "text": "有助于建立和谐的医患关系"}, {"type": "p", "text": "==8.医德胆识=="}, {"type": "p", "text": "在病人面临生命安危和风险而医务人员可以有所作为时，应该具备的敢于为病人预见风险、承担风险并善于化解风险的勇气和能力。"}, {"type": "p", "text": "胆识本质:关爱病人 尊重科学 勇于担当"}, {"type": "list", "items": ["医学胆识的价值"]}, {"type": "p", "text": "能够帮助医者在面对急、危、重症病人时抓住有效的抢救时机，提高救治效率；"}, {"type": "p", "text": "能够帮助医者在患者损伤不可避免时，做出争取最大善果和最小恶果的合理选择；"}, {"type": "p", "text": "能够帮助医者尽快对疑难病症及时做出正确的诊断和处理。"}, {"type": "list", "items": ["行医真理：胆识与审慎的统一"]}, {"type": "p", "text": "胆识是“不怕”，不怕面临最有风险的必然选择"}, {"type": "p", "text": "审慎是“怕”，怕失掉最佳选择"}, {"type": "p", "text": "胆识决定敢于救死扶伤，审慎决定能够实现救死扶伤，相辅相成"}, {"type": "p", "text": "==9.保密=="}, {"type": "p", "text": "医务人员在医疗活动中应当具有的保守医疗秘密不得对外泄露和传播的道德品质。"}, {"type": "p", "text": "医疗秘密：患者的隐私、生理特征、不名誉疾病（性病、精神病）、不良诊断和预后（癌症、爱滋病）"}, {"type": "list", "items": ["保密的依据"]}, {"type": "p", "text": "隐私权"}, {"type": "p", "text": "医疗效果"}, {"type": "list", "items": ["保密的分类及原则："]}, {"type": "p", "text": "对患者保密：原则：对患者康复有利"}, {"type": "p", "text": "为患者保密：原则：不损害他人和社会的利益"}, {"type": "list", "items": ["保密的道德要求："]}, {"type": "p", "text": "询问和检查须完全从诊治需要出发"}, {"type": "p", "text": "防止无意识泄密"}, {"type": "h", "level": 3, "id": "s5", "text": "医疗人际关系伦理"}, {"type": "p", "text": "==1.医患关系伦理=="}, {"type": "list", "items": ["含义"]}, {"type": "p", "text": "狭义：医生与患者为治疗疾病而建立的人际关系。"}, {"type": "p", "text": "广义：医务人员群体与以患者为中心的群体之间，为维护和促进 健康而建立起来的一种交往关系。"}, {"type": "list", "items": ["特点", "目的明确且一致"]}, {"type": "p", "text": "医患交往形式有异，目的相同，为了患者恢复健康或提高健康水平。"}, {"type": "list", "items": ["利益满足和价值实现统一"]}, {"type": "p", "text": "一致的利益 统一的医学道德原则"}, {"type": "list", "items": ["尊严权利平等，医学知识不对称"]}, {"type": "p", "text": "医患在医学知识和能力的占有上不对称"}, {"type": "p", "text": "医务人员在诊治中处于主导"}, {"type": "p", "text": "若人格尊严、权利受到对方 尊重/侵犯，会受到医学道德谴责，法律制裁。"}, {"type": "list", "items": ["医患差异的客观存在性"]}, {"type": "p", "text": "医学的实践性 生理个体差异 诊疗经验差异 医患双方认知 医疗单位管理 政府经费投入"}, {"type": "list", "items": ["性质", "法律：契约关系"]}, {"type": "p", "text": "医疗合同又称医疗契约，指平等主体的患者与医疗机构设立、变更、终止民事权利与义务关系的协议。"}, {"type": "list", "items": ["伦理：信托关系"]}, {"type": "p", "text": "原因：信托人不具备医学专业知识"}, {"type": "p", "text": "基础：信任和依赖"}, {"type": "p", "text": "客体：生命健康"}, {"type": "p", "text": "特征：权力不对等，伴随风险"}, {"type": "list", "items": ["社会文化：服务与被服务的关系"]}, {"type": "p", "text": "彼此平等、相互信任基础上的服务与被服务的关系"}, {"type": "list", "items": ["医患关系的历史与现状", "古代医学中的医患关系"]}, {"type": "p", "text": "融洽、紧密、稳定的；简朴、单一、依赖的"}, {"type": "list", "items": ["现代医学中的医患关系"]}, {"type": "p", "text": "物化 片段化 非人格化"}, {"type": "list", "items": ["当前我国的医患关系"]}, {"type": "p", "text": "和谐是主流"}, {"type": "list", "items": ["医患不和谐原因"]}, {"type": "p", "text": "1>医方：自我保护意识 医德医风差 技术水平有限"}, {"type": "p", "text": "2>患方：维权意识增强 治疗期望过高 医学知识缺乏 经济状况不佳"}, {"type": "p", "text": "3>法制因素：法治建设 法律法规 “举证责任倒置”"}, {"type": "p", "text": "4>舆论及社会心态：媒介舆论 文化习俗 社会心态"}, {"type": "p", "text": "5>医疗体制：医疗公益体现不足 卫生资源配置不合理 医疗保障体系不健全"}, {"type": "list", "items": ["医患关系的内容和模式", "基本内容"]}, {"type": "p", "text": "1>技术内容： 医疗技术活动中医务人员与患者之间建 立起来的行为关系，针对诊断、治疗、护理 以及预防保健的具体方法和问题。"}, {"type": "p", "text": "联系医患关系的桥梁"}, {"type": "p", "text": "维持非技术关系的前提"}, {"type": "p", "text": "2>非技术内容： 医务人员与患者由于社会、心 理、经济、文化等方面的影响，形 成的道德关系、利益关系、价值关 系、法律关系和文化关系。"}, {"type": "p", "text": "较活跃的因素"}, {"type": "p", "text": "影响技术关系"}, {"type": "list", "items": ["基本模式"]}, {"type": "p", "text": "1>萨斯-荷伦德模式（地位、 主动性）[主动-被动型]"}, {"type": "p", "text": "医生完全把握了医疗的主动权、决策权，怎样医疗全由医生说了算，病人无任何意志参与医疗。"}, {"type": "p", "text": "传统的、历史悠久的"}, {"type": "p", "text": "医方权威性不受任何怀疑，患者不会提出任何异议"}, {"type": "p", "text": "一般适用于急症重伤、麻醉等意识丧失情况下的抢救医疗"}, {"type": "p", "text": "父母与婴儿的关系"}, {"type": "p", "text": "2>指导-合作型"}, {"type": "p", "text": "医生仍占有主导地位，患者有条件、有限度地表达意志，接受医生的解释并执行治疗方案，患者“被要求与医生合作”。"}, {"type": "p", "text": "医患间存在着相互作用，医生和患者都具有主动性"}, {"type": "p", "text": "现代医学中医患关系的基础模型。期待高依从性"}, {"type": "p", "text": "常见于急性病、危重病，但头脑清醒患者就医时"}, {"type": "p", "text": "父母与青少年（子女）的关系"}, {"type": "p", "text": "3>共同参与型"}, {"type": "p", "text": "前两种医患关系基础上发展而来，以平等观念和言行方式，听取并尊重患者想法，医患双方共同制定并积极实施医疗方案。"}, {"type": "p", "text": "“帮助患者自疗”"}, {"type": "p", "text": "如成年人间的关系"}, {"type": "p", "text": "心理治疗、精神治疗大部分慢性患者"}, {"type": "list", "items": ["和谐医患关系的伦理要求", "密切沟通交流"]}, {"type": "p", "text": "语言沟通 & 非语言交流"}, {"type": "p", "text": "相互了解、理解"}, {"type": "p", "text": "积极宽容、谅解"}, {"type": "p", "text": "克服心理障碍、文化差异"}, {"type": "list", "items": ["自觉维护对方利益"]}, {"type": "p", "text": "尊重维护患方权利，学法＋树德"}, {"type": "p", "text": "让患方感受到尊重和 维护"}, {"type": "p", "text": "引导患方尊重、珍视"}, {"type": "list", "items": ["坚决履行各自义务"]}, {"type": "p", "text": "1>端正认识"}, {"type": "p", "text": "认识到履行各自义务有助干保障相应权利的实现、医患关系的协调与合作，缓解医患关系紧张、减少医患纠纷等。"}, {"type": "p", "text": "2>纠正误区"}, {"type": "p", "text": "被“求医赐药”观念、权威心理或家长作风"}, {"type": "p", "text": "医疗买卖、健康交易"}, {"type": "list", "items": ["正确处理权利与义务"]}, {"type": "p", "text": "法律权利与法律义务是一致的，互为条件的；道德权利与道德义务未必一致，即履行道德义务时不一定以获得道德权利为前提。"}, {"type": "list", "items": ["遵守共同的医学道德规范"]}, {"type": "p", "text": "医者：①情感投入，人性化服务②职业责任感③廉洁执业"}, {"type": "p", "text": "患者：①文明就医②尊重医务人员③实事求是④冷静客观"}, {"type": "p", "text": "==2.医际关系伦理=="}, {"type": "list", "items": ["含义"]}, {"type": "p", "text": "医学实践主体在职业活动中形成的业缘关系。 医患关系处于核心地位，医际关系处于从属地位。"}, {"type": "list", "items": ["特点", "协同性"]}, {"type": "p", "text": "大健康观、系统医学观 医务人员密切协同、综合救治"}, {"type": "list", "items": ["平等性"]}, {"type": "p", "text": "有职责分工 没有高低贵贱之分 相互平等的同志关系"}, {"type": "list", "items": ["同一性"]}, {"type": "p", "text": "以共同职业目的和道德目标为前提，服从救死扶伤，服从协调医患关系。"}, {"type": "list", "items": ["竞争性"]}, {"type": "p", "text": "目的是形成比学赶帮超的关系环境，既协作又竞争"}, {"type": "list", "items": ["模式", "优势互补", "指导-被指导", "合作竞争", "作用"]}, {"type": "p", "text": "当代医学发展的客观需要"}, {"type": "p", "text": "发挥医疗机构的整体效应"}, {"type": "p", "text": "医务人员的成长成才"}, {"type": "p", "text": "建立和谐的医患关系"}, {"type": "list", "items": ["协调医际关系的伦理要求（同心、同德、互信、互助、共优）"]}, {"type": "p", "text": "齐心协力，维护患者利益和社会公益"}, {"type": "p", "text": "彼此平等，互相理解和尊重"}, {"type": "p", "text": "彼此独立，互相支持和帮助"}, {"type": "p", "text": "彼此信任，互相协助和监督"}, {"type": "p", "text": "互相学习，共同提高和发展"}, {"type": "h", "level": 3, "id": "s6", "text": "临床诊疗伦理"}, {"type": "p", "text": "==1.临床诊疗的伦理原则=="}, {"type": "list", "items": ["临床诊疗的伦理背景", "诊疗技术的双重性", "服务对象的特殊性", "疾病过程的复杂性", "医务人员的差异性", "生命至上", "最优化原则", "知情同意", "保守医密"]}, {"type": "p", "text": "==2.临床诊断的伦理要求=="}, {"type": "list", "items": ["问诊"]}, {"type": "p", "text": "举止端庄，态度热情"}, {"type": "p", "text": "全神贯注，语言得当"}, {"type": "p", "text": "耐心倾听，正确引导"}, {"type": "p", "text": "适度接触，适当辅诊"}, {"type": "list", "items": ["体格检查"]}, {"type": "p", "text": "全面系统，认真细致"}, {"type": "p", "text": "关心体贴，减少痛苦"}, {"type": "p", "text": "尊重患者，心正无私"}, {"type": "list", "items": ["辅助检查", "医生"]}, {"type": "p", "text": "审慎确定检查项目"}, {"type": "p", "text": "知情同意，尽职尽责"}, {"type": "p", "text": "综合分析检查结果"}, {"type": "p", "text": "通俗解释临床诊断"}, {"type": "list", "items": ["医技人员"]}, {"type": "p", "text": "严谨求实，防止差错"}, {"type": "p", "text": "尊重患者，工作敏捷"}, {"type": "p", "text": "精心管理，保证安全"}, {"type": "p", "text": "积极进取，加强协作"}, {"type": "p", "text": "==3.临床治疗的伦理要求=="}, {"type": "list", "items": ["药物治疗的伦理要求", "医生"]}, {"type": "p", "text": "对症下药，剂量安全"}, {"type": "p", "text": "合理配伍，细致观察"}, {"type": "p", "text": "节约费用，公正分配"}, {"type": "list", "items": ["药剂工作人员"]}, {"type": "p", "text": "审方认真，坚持查对"}, {"type": "p", "text": "操作正规，质量达标"}, {"type": "p", "text": "忠于职守，廉洁奉公"}, {"type": "list", "items": ["手术治疗的伦理要求", "手术前"]}, {"type": "p", "text": "准确掌握指征，手术动机纯正"}, {"type": "p", "text": "患者或其家属知情同意"}, {"type": "p", "text": "认真做好术前准备"}, {"type": "p", "text": "新术式/新技术的伦理审查"}, {"type": "list", "items": ["手术中"]}, {"type": "p", "text": "关心患者，体贴入微"}, {"type": "p", "text": "态度严肃，作风严谨"}, {"type": "p", "text": "精诚团结，密切协作"}, {"type": "list", "items": ["手术后"]}, {"type": "p", "text": "严密观察，勤于护理"}, {"type": "p", "text": "减轻痛苦，加速康复"}, {"type": "list", "items": ["其他治疗的伦理要求", "心理治疗"]}, {"type": "p", "text": "熟练掌握心理治疗的知识、技巧"}, {"type": "p", "text": "展示出感同身受"}, {"type": "p", "text": "心态健康、积极、稳定"}, {"type": "p", "text": "要保守患者的秘密、隐私"}, {"type": "list", "items": ["饮食营养治疗"]}, {"type": "p", "text": "营养安全科学"}, {"type": "p", "text": "创造良好环境"}, {"type": "p", "text": "满足患者的饮食习惯和营养需求"}, {"type": "list", "items": ["康复治疗"]}, {"type": "p", "text": "理解与尊重"}, {"type": "p", "text": "关怀与帮助"}, {"type": "p", "text": "联系与协作"}, {"type": "p", "text": "==4.特殊科室诊疗的伦理要求=="}, {"type": "list", "items": ["急诊科治疗"]}, {"type": "p", "text": "时间紧，任务重。患者心理状态波动，医患沟通难以充分，需多学科合作。"}, {"type": "p", "text": "维护患者利益 迅速准确处置 尊重患者权利 如实真诚沟通 尊重患者隐私 医际公正诚实"}, {"type": "list", "items": ["妇产科治疗"]}, {"type": "p", "text": "兼顾孕妇和胎儿两方面,从单纯的疾病诊治和产科处理，扩展到围生期、妇女保健和优生优育等。"}, {"type": "p", "text": "尊重妇女的人格 保护患者隐私 弘扬奉献精神 慎重对待女性生殖器官疾病。 当下+未来"}, {"type": "list", "items": ["老年病科治疗"]}, {"type": "p", "text": "病程长，恢复慢；无明显症状与体征，初期不易察觉，病情合并多，并发症多"}, {"type": "p", "text": "尊重患者、维护合法权利 转变理念，合理管理和治疗 有节制、可持续治疗 重视心理关怀"}, {"type": "list", "items": ["ICU治疗"]}, {"type": "p", "text": "生命尊严、生活质量与生存，传统观念、社会压力与理智的两难，技术、管理与人性化医疗，资源浪费与资源合理配置的矛盾。"}, {"type": "p", "text": "给予患者心理支持 注重患者的知情同意 遵守公平性原则 考虑卫生经济伦理问题 区别对待患者的放弃治疗 防止高科技滥用"}, {"type": "h", "level": 3, "id": "s7", "text": "护理伦理"}, {"type": "p", "text": "==1.护理伦理的含义和作用=="}, {"type": "list", "items": ["含义内涵"]}, {"type": "p", "text": "护理实践中协调护患医关系及护理工作与整个医疗工作之间关系的行为准则和规范。"}, {"type": "list", "items": ["孕育发展"]}, {"type": "p", "text": "古代的医护一体 (生活照护+生活照护)→融于医德"}, {"type": "p", "text": "19世纪护理职业诞生，形成护理伦理"}, {"type": "list", "items": ["地位作用", "护理伦理是医疗质量的保障", "护理伦理是医院管理的基础", "护理伦理是现代医学模式的支柱", "护理伦理是护理人员自我完善的途径"]}, {"type": "p", "text": "==2.护理伦理基本规范内容=="}, {"type": "list", "items": ["基础护理、整体护理、心理护理", "内容"]}, {"type": "p", "text": "热爱专业 敬业爱岗"}, {"type": "p", "text": "刻苦钻研 精益求精"}, {"type": "p", "text": "关爱病人 一视同仁"}, {"type": "p", "text": "诚信待患 保守秘密"}, {"type": "p", "text": "举止端庄 语言文明"}, {"type": "p", "text": "团结协作 相互监督"}, {"type": "p", "text": "高度自律 自觉慎独"}, {"type": "p", "text": "==3.特殊科室护理伦理要求=="}, {"type": "list", "items": ["妇产科护理伦理", "特点"]}, {"type": "p", "text": "服务对象的年龄跨度大、心理护理的难度大、预防保健的任务重、护理质量的高要求、护理决策的全面性"}, {"type": "list", "items": ["要求"]}, {"type": "p", "text": "产科工作涉及母婴两代人的生命安危，涉及多个家庭的幸福。产科护士将孕产妇及胎儿、新生儿作为重点服务对象，但也不能忽视对孕产妇家庭其他成员的心理支持；在进行护理决策时，以母婴两代人的安全为重，也要综合考虑其丈夫及家庭成员的意见。"}, {"type": "p", "text": "忠诚履责，冷静果断 保护隐私，尊重患者 关爱患者，心系社会"}, {"type": "list", "items": ["老年病人护理伦理", "特点"]}, {"type": "p", "text": "护理工作负荷重 心理护理要求高"}, {"type": "list", "items": ["要求"]}, {"type": "p", "text": "体现尊重，鼓励自护 理解关怀，有效沟通 细致观察，审慎护理"}, {"type": "list", "items": ["儿科护理伦理", "特点"]}, {"type": "p", "text": "护理工作的复杂性 护患关系的多重性"}, {"type": "p", "text": "免疫力低，患病表现不同于成人 病情表达不及成人准确 心理发育不成熟 自我保护能力弱"}, {"type": "list", "items": ["要求"]}, {"type": "p", "text": "密切观察，细致护理 精益求精，恪守慎独 体贴关爱，治病育人 理解家属，耐心解惑"}, {"type": "list", "items": ["传染科护理伦理", "特点"]}, {"type": "p", "text": "社会责任重 消毒隔离严 时间观念强 心理护理任务重"}, {"type": "list", "items": ["要求"]}, {"type": "p", "text": "有效防护，履行职责 心理护理，细致周到 保护隐私，依法上报 预防为主，服务社会"}, {"type": "p", "text": "==4.护理伦理实质和伦理决策=="}, {"type": "list", "items": ["护理伦理的实质"]}, {"type": "p", "text": "尊重人的生命，尊重人的尊严，尊重人的权利"}, {"type": "list", "items": ["护理伦理决策", "护理伦理决策就是从护理伦理理论、原则和规范出发,从护理伦理的角度来思考问题以做出恰当的、符合护理伦理的决定。", "护理伦理决策基本要求：尊重科学事实、符合伦理原则、遵循法律法规、具有时效性、进行动态调"]}, {"type": "h", "level": 3, "id": "s8", "text": "公共卫生伦理"}, {"type": "p", "text": "==1.公共卫生伦理的含义和理论基础=="}, {"type": "list", "items": ["含义"]}, {"type": "p", "text": "公共卫生具体包括对重大疾病尤其是传染病(如结核、艾滋病、SARS、新冠肺炎等)的预防、监控和治疗;对食品、药品、公共环境卫生的监督管制，以及相关的卫生宣传、健康教育、免疫接种等。"}, {"type": "p", "text": "公共卫生伦理:研究公共卫生活动中应该遵循的伦理道德要求。伦理学的基本理论和观念在公共卫生领域中的具体应用。"}, {"type": "list", "items": ["理论基础", "功利主义", "自由主义", "社群主义", "人类命运共同体"]}, {"type": "p", "text": "==2.公共卫生伦理的原则=="}, {"type": "p", "text": "全社会参与原则"}, {"type": "p", "text": "社会公益原则"}, {"type": "p", "text": "社会公正原则"}, {"type": "p", "text": "互相协同原则"}, {"type": "p", "text": "信息公开原则"}, {"type": "p", "text": "==3.公共卫生某些领域的伦理要求=="}, {"type": "list", "items": ["疾病防制的伦理要求", "传染病防制的伦理要求"]}, {"type": "p", "text": "严格执行隔离消毒措施、严格遵守各项操作规程"}, {"type": "p", "text": "坚持预防为主的积极防疫思想"}, {"type": "p", "text": "尊重传染病患者的人格和权利"}, {"type": "p", "text": "遵守国家法律规定，及时收集及上报疫情"}, {"type": "list", "items": ["慢性非传染病防制的伦理要求"]}, {"type": "p", "text": "全面贯彻实行三级预防与措施"}, {"type": "p", "text": "强化对患者及家属的知识教育与行为指导"}, {"type": "p", "text": "关注慢性病患者的心理健康，促进足够的社会支持"}, {"type": "list", "items": ["职业性损害防制的伦理要求", "始终坚持“预防为主，防治结合”的工作理念", "始终坚持“深入一线，监督指导”的工作方式", "健康教育和健康促进的伦理要求", "履行法律义务，充分利用一切机会和场合积极主动地开展健康教育", "积极参与有利于健康促进的公共政策的制定、支持性环境的创建和卫生保健体系的建立", "深入农村、社区，将健康教育与健康促进工作渗透在初级卫生保健工作", "不断完善自我,以科学态度和群众喜闻乐见的形式开展健教和健促", "应对突发公共卫生事件的道德要求", "恪守职责和加强协作，发扬敬畏生命的人道主义精神", "树立崇高的职业责任感和科学态度", "勇于克服困难，具有献身精神"]}, {"type": "h", "level": 3, "id": "s9", "text": "参战与救灾的医德要求"}, {"type": "p", "text": "==1.战场和灾区环境的特殊性=="}, {"type": "p", "text": "环境的危险性、环境的艰苦性、环境的多变性、环境的冲击性"}, {"type": "p", "text": "==2.参战和救灾时医疗人际关系的特殊性=="}, {"type": "list", "items": ["医患关系", "比例严重失调", "缺乏稳定性", "缺乏医疗设备中介", "医方自主性增强", "医际关系", "医际关系泛化", "医际关系的临时性", "目的的同一性", "运作的协同性", "患际关系"]}, {"type": "p", "text": "竞争性、合作性"}, {"type": "p", "text": "==3.战场医疗救治的医德要求=="}, {"type": "list", "items": ["发扬革命英雄主义"]}, {"type": "p", "text": "集体的、无私无畏的、理智的"}, {"type": "list", "items": ["发扬革命的人道主义", "无条件支持我方的正义战争", "坚决执行优待俘虏的方针、政策", "树立高度的事业心和责任感", "自觉控制情感和保持理智", "认真执行相关法规", "西方现代军事医学伦理的基杰准则", "战地医务人员中立，救治一切受伤者", "军事医学人体实验应在自愿和知情同意基础之上进行", "保护战俘的健康", "医师不参与研制和开发生化武器", "西方战争对医学伦理的挑战", "战争使医患关系扭曲，伤病员自主权受到损害，毫无机密、隐私可言，知情同意也常常作为军事的牺牲品。", "在紧急救治中，战地医师难以同等对待俘虏", "战俘的尊严受到践踏"]}, {"type": "p", "text": "==4.灾害医学救治的医德原则=="}, {"type": "list", "items": ["坚持非营业性无偿救治的原则"]}, {"type": "p", "text": "社会公益活动"}, {"type": "p", "text": "不能向受灾者索取报酬"}, {"type": "p", "text": "尽量使受灾人员获得可能得到的益处"}, {"type": "list", "items": ["争取最大健康效益的原则"]}, {"type": "p", "text": "最大限度的挽救生命"}, {"type": "p", "text": "最大限度的减少死亡和伤残"}, {"type": "p", "text": "最大限度的保护和恢复社会劳动力的健康、灾区的生产与生活"}, {"type": "list", "items": ["军事医疗类选法"]}, {"type": "p", "text": "在战时或救灾时，对伤病员按一定原则进行筛选，决定优先治疗的顺序，以确保最大限度地完成军事任务和救护使命"}, {"type": "list", "items": ["积极适应特殊环境的原则"]}, {"type": "p", "text": "具有良好的自控能力和自我调节能力"}, {"type": "list", "items": ["强化协调与配合的原则"]}, {"type": "p", "text": "既要积极展开救治工作，又要服从统一指挥，积极主动与各机构的救灾人员互相配合，以提高抢救效率"}, {"type": "list", "items": ["医德尺度宽严相济的原则"]}, {"type": "p", "text": "严:医德要求以“命令“指示”“纪律”等刚性形式出现"}, {"type": "p", "text": "宽:不以平常的医疗标准去要求、衡量"}, {"type": "h", "level": 3, "id": "s10", "text": "医学科研伦理"}, {"type": "p", "text": "==1.科研诚信与医学科研人员道德规范=="}, {"type": "list", "items": ["科研诚信"]}, {"type": "p", "text": "遵守科学道德规范、遵循科学研究的基本原则和方法，并坚持诚实守信的科学精神"}, {"type": "list", "items": ["医学科研人员道德规范", "尊重科学，严谨治学", "动机纯正，勇于创新", "谦虚谨慎，团结协作"]}, {"type": "p", "text": "==2.人体实验伦理=="}, {"type": "list", "items": ["人体实验"]}, {"type": "p", "text": "人体实验，也称涉及人的生物医学研究，一般是指以人作为研究对象所进行的科学研究。"}, {"type": "list", "items": ["道德评价", "人体实验是医学的起点和基础", "人体实验是医学科研必经的最后阶段"]}, {"type": "p", "text": "1>种属的差异;"}, {"type": "p", "text": "2>人有不同的心理活动和社会特征，"}, {"type": "p", "text": "3>对于不能用动物复制模型的疾病"}, {"type": "list", "items": ["人体实验的矛盾", "主动与被动的矛盾", "科学利益、社会利益与被试者利益的矛盾", "自愿与无奈的矛盾", "人体实验的伦理原则", "医学目的原则", "维护受试者权益原则"]}, {"type": "p", "text": "首先考虑的是维护受试者的健康利益;"}, {"type": "p", "text": "当这一原则与人体试验的其它原则发生矛盾的时候，应该优先考虑这一原则"}, {"type": "p", "text": "试验前权衡利弊，严密设计有效、安全的方案"}, {"type": "p", "text": "试验中要将不良影响降到最低"}, {"type": "p", "text": "试验应在高水平科研人员和医师监督下进行"}, {"type": "list", "items": ["CIOMS 安慰剂对照用于以下情况是合理的:"]}, {"type": "p", "text": "当没有公认的有效的干预时:当不采用公认有效的干预,至多使受试者感到暂时的不适、或延迟症状的缓解时;当采用一个公认有效的干预作为对照,将会产生科学上不可靠的结果,而使用安慰剂不会增加受试者任何严重的、或不可逆损害的风险。"}, {"type": "list", "items": ["合理使用盲法原则"]}, {"type": "p", "text": "对受试者的盲法不告知受试者到底谁分配到治疗组、谁分配到对照组，但前提需要告知受试者使用的是盲法，在取得同意的情况下才能进行。"}, {"type": "p", "text": "盲法是以受试者利益不受侵害为前提。"}, {"type": "list", "items": ["知情同意原则"]}, {"type": "p", "text": "信息公开、信息的理解、自主同意"}, {"type": "list", "items": ["公正原则"]}, {"type": "p", "text": "受试者的纳入和排除必须是公平的"}, {"type": "p", "text": "受试者参与研究有权利得到公平的回报"}, {"type": "list", "items": ["伦理审查原则"]}, {"type": "p", "text": "==3.动物实验伦理=="}, {"type": "list", "items": ["动物实验"]}, {"type": "p", "text": "为了获得有关生物学、医学等方面的新知识或解决具体问题而使用动物进行实验"}, {"type": "list", "items": ["动物实验的伦理要求", "3R原则"]}, {"type": "p", "text": "尽量用没有知觉的实验材料代替活体动物"}, {"type": "p", "text": "使用最少量的动物获取同样多的实验数据"}, {"type": "p", "text": "减少非人道程序对动物的影响范围和程度"}, {"type": "list", "items": ["五项自由"]}, {"type": "p", "text": "必要性原则、保护原则、福利原则、利益平衡性原则、公正性原则"}, {"type": "p", "text": "==4.生物医学研究领域的重要伦理规范=="}, {"type": "list", "items": ["国际伦理规范"]}, {"type": "p", "text": "《纽伦堡法典》"}, {"type": "p", "text": "《赫尔辛基宣言》"}, {"type": "p", "text": "《贝尔蒙报告》"}, {"type": "p", "text": "CIOMS"}, {"type": "list", "items": ["国内伦理规范"]}, {"type": "p", "text": "《涉及人的生命科学和医学研究伦理审查办法》"}, {"type": "p", "text": "《药物临床试验质量管理规范》"}, {"type": "p", "text": "《人类辅助生殖技术和人类精子库伦理原则》"}, {"type": "p", "text": "《人类胚胎干细胞研究伦理指导原则》"}, {"type": "p", "text": "《人类遗传资源管理条例》"}, {"type": "h", "level": 3, "id": "s11", "text": "生命伦理学热点问题之一——基因克隆问题"}, {"type": "p", "text": "==1.人类辅助生殖技术的伦理问题=="}, {"type": "list", "items": ["人类辅助生殖技术的含义及分类", "人工授精"]}, {"type": "p", "text": "1>用器械将精液注入宫颈管内或宫腔内取代性交使女性妊娠的方法"}, {"type": "p", "text": "2>夫精人工授精 AIH、供体人工授精 AID"}, {"type": "p", "text": "3>冲突"}, {"type": "p", "text": "人工授精对传统婚姻关系的冲击"}, {"type": "p", "text": "人工授精对传统血缘关系的冲击"}, {"type": "p", "text": "人工授精后代的伦理学难题"}, {"type": "p", "text": "人工授精的道德底线：严格掌握适应症；严格掌握精子来源和质量；严格控制每份精子的使用人数；严格执行保密与互盲原则"}, {"type": "list", "items": ["体外受精胚胎移植"]}, {"type": "p", "text": "1>胚胎的地位问题"}, {"type": "p", "text": "2>父母的身份问题"}, {"type": "p", "text": "3>代理母亲”和试管婴儿技术"}, {"type": "list", "items": ["人类辅助生殖技术的伦理原则", "有利于患者的原则", "知情同意的原则", "保护后代的原则", "社会公益原则", "保密原则", "严防商业化原则", "伦理监督的原则"]}, {"type": "p", "text": "==2.人体器官移植中的伦理问题=="}, {"type": "list", "items": ["器官移植概述", "器官移植的历史"]}, {"type": "p", "text": "《列子》、18世纪，开始出现学者做组织或器官移植的动物实验"}, {"type": "list", "items": ["器官移植的类型"]}, {"type": "p", "text": "异种移植、同种移植"}, {"type": "list", "items": ["器官移植中的主要伦理问题", "供体来源问题", "选择受体问题", "器官能否商品化", "器官移植的伦理原则", "自愿和知情同意原则", "安全有效原则", "公正原则", "禁止商业交易原则", "互助原则", "医务人员在器官移植中的道德要求", "关心患者健康， 坚持人道主义为先", "审慎选择供体，保护供者利益与健康", "坚持公正原则，避免差别对待患者", "恪守职业道德，防止器官移植犯罪"]}, {"type": "p", "text": "==3.克隆技术的伦理问题=="}, {"type": "list", "items": ["生殖性克隆的含义和伦理争论", "利用核移技术克隆的一个遗传信息与亲代相同的人胚，然后再将它植入子宫引起怀孕，出而生育孩子，即克隆人。", "反对"]}, {"type": "p", "text": "克隆技术还不成熟，克隆人可能有很多先天性生理缺陷。"}, {"type": "p", "text": "克隆人的身份难以认定，他们与被克隆者之间的关系无法纳入现有的伦理体系。"}, {"type": "p", "text": "人类繁殖后代的过程不再需要两性共同参与，将对现有的社会关系、家庭结构造成难以承受的巨大冲击。"}, {"type": "p", "text": "大量基因结构完全相同的克隆人，可能诱发新型疾病的广泛传播，对人类的生存不利。"}, {"type": "p", "text": "克隆人可能因自己的特殊身份而产生心理缺陷，形成新的社会问题。"}, {"type": "list", "items": ["赞成"]}, {"type": "p", "text": "克隆将是人类迈出的实现人类长生梦想的实质性的第一步"}, {"type": "list", "items": ["应该暂时禁止克隆人，条件成熟可以克隆人，但不能成批地克隆同一个人", "克隆技术与人类生活"]}, {"type": "p", "text": "克隆技术有利于生命科学基础研究的深入发展"}, {"type": "p", "text": "克隆技术有利于农业生产的发展"}, {"type": "p", "text": "克隆技术有利于人类的医疗卫生保健事业"}, {"type": "list", "items": ["克隆技术的伦理问题"]}, {"type": "p", "text": "克隆人是对人权和人的尊严的挑战"}, {"type": "p", "text": "克隆人违反生物进化的自然发展规律"}, {"type": "p", "text": "克隆人将扰乱正常的伦理定位"}, {"type": "p", "text": "克隆人在技术上的安全性在伦理上难以确认"}, {"type": "list", "items": ["我国“人胚胎干细胞研究指导原则”"]}, {"type": "p", "text": "禁止进行生殖性克隆人的任何研究"}, {"type": "p", "text": "禁止买卖人类配子、受精卵、胚胎或胎儿组织"}, {"type": "list", "items": ["人类胚胎干细胞研究的伦理规范", "禁止生殖性克隆", "支持治疗性克隆的研究", "谨慎对待胚胎实验", "用辅助生殖多余的捐献胚胎建立胚胎干细胞系研究的道德规范", "用体细胞核移植术创造胚胎进行胚胎干细胞研究的道德规范", "建立鼓励对人类胚胎干细胞生物学基础研究的伦理准则", "建立胚胎干细胞系的使用法规", "将胚胎干细胞用于临床治疗的行动准则", "制定胚胎干细胞用于人类疑难杂症的治疗的可能", "建立和健全生命伦理委员会的审查、监控和评估机制"]}, {"type": "p", "text": "==4.基因诊断与基因治疗中的伦理问题=="}, {"type": "list", "items": ["无创产前基因检测引发的伦理学思考", "体细胞基因治疗的伦理争议", "基因诊断、治疗的伦理分争", "人类遗传物质的纯洁性、神圣性是否受到了亵渎", "胎儿的生命权和父母的选择权", "对个体和人类社会是否安全", "是否会造成医疗费用的猛增", "生殖细胞的基因治疗可行吗？", "基因诊断、治疗的伦理原则", "尊重病人", "知情同意", "有益于病人", "保守秘密"]}, {"type": "h", "level": 3, "id": "s12", "text": "生命伦理学热点问题二——死的问题"}, {"type": "p", "text": "==1.人体死亡标准=="}, {"type": "list", "items": ["心肺死亡标准"]}, {"type": "p", "text": "长期以来，人们判定 人死亡是以心肺功能 的停止作为标准。"}, {"type": "list", "items": ["脑死亡标准"]}, {"type": "p", "text": "1968年召开的世界第22 届医学大会上，美国哈佛大学 医学院死亡定义审查委员会提 出了“脑功能不可逆性丧失” 作为新的死亡标准脑死亡。"}, {"type": "list", "items": ["出现不可逆的昏迷", "自主的肌肉运动和自主呼吸消失", "诱导反射缺失", "脑电波平直", "以上四条标准持续24小时观察和反复测试结果无变化，即可宣布死亡", "执行脑死亡标准的道德意义"]}, {"type": "p", "text": "1>更科学地判定人的死亡"}, {"type": "p", "text": "2>维护了死者的尊严"}, {"type": "p", "text": "3>有利于节约医疗资源"}, {"type": "p", "text": "4>有利于器官移植"}, {"type": "p", "text": "==2.安乐死的伦理问题=="}, {"type": "list", "items": ["含义", "现代阐释：目前医学条件下患有不治之症、濒临死亡且非常痛苦的患者，由本人或家属诚恳委托医生使用药物或其他方式以尽可能无痛苦状态下结束生命的一种临终处置方式。", "医学伦理角度：身患不治之症的患者在危重濒死状态时，由于躯体和精神的极端痛苦，难以忍受，在患者或其家属的合理及迫切要求下，经过医生、权威的医学专家机构鉴定确定，符合法律规定，按照法律程序，用人为的、仁慈的医学方法使患者在无痛苦状态下度过死亡阶段而终结生命的全过程。", "分类", "按执行方式"]}, {"type": "p", "text": "主动安乐死：通过医生之手运用药物等手段加速结束病人的生命"}, {"type": "p", "text": "被动安乐死：一般是指撤除患者赖以维持生命、拖延时日所需的生命维持系统，或是放弃必要的医疗抢救措施，使之等待死神的降临自然逝去"}, {"type": "list", "items": ["按患者同意方式"]}, {"type": "p", "text": "自愿安乐死、非自愿安乐死"}, {"type": "list", "items": ["伦理问题", "安乐死伦理争论的观点"]}, {"type": "p", "text": "1>支持：安乐死帮助患者结束生命，免除了临终难以忍受的痛苦，这是符合人道主义的。"}, {"type": "p", "text": "依据"}, {"type": "p", "text": "1》人权主义的观点：人生抉择的自主性和自由在于个人，每个人有权利根据自己的处境选择生存和死亡"}, {"type": "p", "text": "2》功利主义的观点：宗旨：追求最大多数人的最大幸福"}, {"type": "p", "text": "3》医学人道主义观点：让罹患绝症的病患安乐死是减轻他的痛苦，是比让其活得很痛苦更人道的"}, {"type": "p", "text": "4》生命质量论和生命价值论的观点：医学伦理学的基本理论指导医务人员临床行为的重要伦理依据"}, {"type": "p", "text": "2>反对：安乐死是变相杀人，与医务人员救死扶伤的神圣职责是背道而驰的。"}, {"type": "p", "text": "依据"}, {"type": "p", "text": "1》生命神圣论的观点 无论在何种情形下都应 该尽力保存病人的生命"}, {"type": "p", "text": "2》医学人道主义观点：安乐死是变相杀人，有违医学人道主义"}, {"type": "p", "text": "3》不可逆的诊断未必绝对：实施安乐死可能会使病人丧失很多机会"}, {"type": "p", "text": "4》违背了传统的血缘亲情观念：安乐死会使病人家属放任亲人的死亡，甚至参与结束亲人的生命"}, {"type": "p", "text": "5》自愿安乐死中的“自愿”值得怀疑：“自愿”的安乐死不可信"}, {"type": "p", "text": "6》实施安乐死可能会给社会带来消极后果：家庭、心理、负面看法等"}, {"type": "list", "items": ["实施安乐死在一定程度上使医务人员放弃探索“不治之症”的责任，并有可能导致一些患者错过转危为安的机会，医学科研也会受到影响", "正确对待安乐死"]}, {"type": "p", "text": "正确认识安乐死这一概念"}, {"type": "p", "text": "进行死亡教育"}, {"type": "list", "items": ["安乐死必须符合伦理条件", "只有法律部门才能量刑结束一个人的生命，任何其他部门或个人、特别是医务人员没有这个权利。"]}, {"type": "p", "text": "==3.临终关怀的伦理问题=="}, {"type": "list", "items": ["临终关怀的定义"]}, {"type": "p", "text": "是对临终 病人和家属提供姑息性和 支持性的医护措施。"}, {"type": "list", "items": ["临终关怀的伦理要素", "关怀对象：临终病人、病人家属", "临终病人：患有在当前医学技术条件下无法治愈的疾病，估计在六个月内将要走到生命终点、结束人生旅途的患者。", "关怀方式：疼痛控制、症状处理、生活护理、心理护理 、家属情感支持", "晚期临终病人心理活动的五个阶段"]}, {"type": "p", "text": "否认期、协议期、接受期、愤怒期、抑郁期"}, {"type": "list", "items": ["关怀机构：独立的临终关怀医院、医院附设的临终关怀病区、临终关怀家庭病床", "关怀目的：维护病人尊严，提升病人临终阶段生命品质", "临终关怀的道德要求", "以照料为中心", "维护病人尊严", "提高临终生活质量", "共同面对死亡", "协助病人安静地、有尊严地死去", "临终关怀发展状况", "雏形：Hospice Care朝圣者或旅行者途中休息、重新补充体力的驿站。", "现代临终关怀：发祥地英国、创始人桑德斯博士、第一家医院圣克里斯托弗临终关怀医院", "国内：四个里程碑"]}, {"type": "p", "text": "1>1988年创建我国第一个临终关怀研究机构，天津医学院临终关怀研究中心"}, {"type": "p", "text": "2>1990年在天津医学院开设我国第一家临终关怀病房"}, {"type": "p", "text": "3>李嘉诚基金会在大陆建立宁养院"}, {"type": "p", "text": "4>2006年建立国家一级学会：中国生命关怀协会"}, {"type": "list", "items": ["临终关怀的伦理意义", "彰显医学人道主义的真谛", "体现生命神圣论、生命质量论与生命价值论的统一", "符合社会道德和人类文明发展要求"]}, {"type": "h", "level": 3, "id": "s13", "text": "医德评价和医德修养"}, {"type": "p", "text": "==1.医德评价=="}, {"type": "p", "text": "依据一定的医学道德标准，对医务人员、医疗卫生部门的行为和活动的道德价值所做出的优与劣、善与恶的评判。"}, {"type": "p", "text": "主体（社会评价、自我评价）+客体"}, {"type": "p", "text": "==2.医德评价的作用=="}, {"type": "list", "items": ["医务人员医学道德品质形成的重要手段", "改善医疗卫生机构医德医风、促进医学进步的有力武器"]}, {"type": "p", "text": "==3.医德评价的标准=="}, {"type": "p", "text": "指衡量医疗行为善恶及社会效果优劣的尺度"}, {"type": "list", "items": ["是否有利于患者疾病的缓解和康复"]}, {"type": "p", "text": "个体健康利益---医疗标准"}, {"type": "list", "items": ["是否有利于人类生命质量的提高和生存环境的改善"]}, {"type": "p", "text": "长远代际利益---科学标准"}, {"type": "list", "items": ["是否有利于医学科学的发展和社会进步"]}, {"type": "p", "text": "社会健康利益---社会标准"}, {"type": "p", "text": "==4.医德评价的依据=="}, {"type": "p", "text": "评价对象提供给评价主体，用以和标准对照的现实根据。"}, {"type": "list", "items": ["动机和效果", "动机指行为的主观愿望和意向"]}, {"type": "p", "text": "效果指行为产生的客观结果"}, {"type": "list", "items": ["坚持动机与效果的辨证统一，反对以片面的动机论或效果论去评价医务人员的行为和活动", "目的和手段", "目的指医疗实践中期望达到的目标。"]}, {"type": "p", "text": "手段指实现医疗目的的方法途径。"}, {"type": "list", "items": ["坚持目的与手段的辨证统一，目的决定手段，手段服务目的，反对以片面的目的论或手段论去评价医务人员的行为和活动", "有效性原则、优化性原则、一致性原则、社会性原则"]}, {"type": "p", "text": "==5.医德评价的方式=="}, {"type": "list", "items": ["社会舆论", "社会舆论是指患者、社会公众等对医务人员、医疗保健机构的活动和行为所公开表达的褒贬态度和议论。", "有组织的正式舆论、非正式的口头舆论", "传统习俗", "传统习俗是人们在长期社会生活中形成的、历史上沿袭下来的对某种或某一问题的习惯性常识性的看法、行为倾向和生活方式。", "稳定性、习惯性"]}, {"type": "p", "text": "传统习俗既可增强医德信念，又容易形成社会舆论"}, {"type": "list", "items": ["有精华有糟粕", "内心信念", "内心信念是指医务人员通过长期的学习和实践，内心深处形成的对医德真诚信仰和强烈责任感。", "自我谴责、自我满足、自我安慰", "三者关系", "相互联系、相互补充、相互促进", "社会舆论是现实力量，具有广泛性", "传统习俗是历史力量，具有持久性", "内心信念是自我力量，具有深刻性", "具体方法"]}, {"type": "p", "text": "医德考评表、社会监督、伦理查房、医德医风评价系统"}, {"type": "p", "text": "==6.医德修养的含义=="}, {"type": "p", "text": "医德修养是医务人员通过自我教育、自我锻炼和自我陶冶把医德规范转化为个人医德品质的过程。"}, {"type": "p", "text": "医学道德的境界：大公无私、公私兼顾、自私自利、损公肥私"}, {"type": "p", "text": "==7.医德修养的作用=="}, {"type": "list", "items": ["有助于医学道德教育的深化和医务人员养成良好的医学道德品行:", "有助于医疗卫生保健机构形成良好的医德医风促进医疗人际关系的和谐"]}, {"type": "p", "text": "==8.医德修养的途径和方法=="}, {"type": "list", "items": ["学习方法"]}, {"type": "p", "text": "理论、思想、行为"}, {"type": "list", "items": ["立志方法", "躬行慎独", "反省方法"]}];</script>

  tabs.forEach(function (b) {
    b.addEventListener('click', function () {
      var p = b.getAttribute('data-pane');
      tabs.forEach(function (x) { x.classList.toggle('on', x === b); });
      var r = document.getElementById('paneRead');
      var q = document.getElementById('paneQuiz');
      if (r) r.classList.toggle('hide', p !== 'read');
      if (q) q.classList.toggle('hide', p !== 'quiz');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });

  var links = [].slice.call(document.querySelectorAll('.toc a[href^="#"]'));
  if (!links.length) return;
  var heads = links.map(function (a) { return document.getElementById(a.getAttribute('href').slice(1)); });
  function paint() {
    var top = window.scrollY + 120, idx = 0;
    heads.forEach(function (h, i) { if (h && h.offsetTop <= top) idx = i; });
    links.forEach(function (a, i) { a.classList.toggle('on', i === idx); });
  }
  window.addEventListener('scroll', paint, { passive: true });
  paint();
})();

/* ---------- 章节入场 ---------- */
(function () {
  var hs = [].slice.call(document.querySelectorAll('.article h3'));
  if (!hs.length) return;
  if (!('IntersectionObserver' in window)) {
    hs.forEach(function (h) { h.classList.add('in'); });
    return;
  }
  var io = new IntersectionObserver(function (es) {
    es.forEach(function (e) {
      if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
    });
  }, { rootMargin: '0px 0px -8% 0px' });
  hs.forEach(function (h) { io.observe(h); });
  setTimeout(function () { hs.forEach(function (h) { h.classList.add('in'); }); }, 2500);
})();

/* ---------- 记住阅读位置 ---------- */
(function () {
  if (!document.getElementById('body')) return;
  var KEY = 'medilearn.docpos:' + location.pathname;
  var timer = 0;
  window.addEventListener('scroll', function () {
    if (timer) return;
    timer = setTimeout(function () {
      timer = 0;
      try { localStorage.setItem(KEY, String(Math.round(window.scrollY))); } catch (e) {}
    }, 600);
  }, { passive: true });

  var y = 0;
  try { y = parseInt(localStorage.getItem(KEY) || '0', 10) || 0; } catch (e) {}
  if (y < 600) return;
  setTimeout(function () {
    window.scrollTo(0, y);
    var t = document.createElement('div');
    t.textContent = '已回到上次阅读位置';
    t.style.cssText = 'position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:9600;' +
      'background:var(--text);color:var(--surface);font:500 13px/1 var(--font-sans,sans-serif);' +
      'padding:9px 16px;border-radius:999px;box-shadow:0 10px 30px rgba(15,23,42,.22);' +
      'opacity:0;transition:opacity .3s;pointer-events:none';
    document.body.appendChild(t);
    requestAnimationFrame(function () { t.style.opacity = '1'; });
    setTimeout(function () {
      t.style.opacity = '0';
      setTimeout(function () { t.remove(); }, 400);
    }, 1900);
  }, 80);
})();
</script>
