<script>
(function () {
  WB.mountChrome('materials');
  var body = document.getElementById('body');
  body.innerHTML = WB.renderBlocks(window.__DOC_BLOCKS || []);

  /* 目录：按 h3 生成 */
  var toc = document.getElementById('docToc');
  var hs = body.querySelectorAll('h3');
  hs.forEach(function (h, i) {
    h.id = 's' + (i + 1);
    if (i >= 60) return;
    var a = document.createElement('a');
    a.href = '#s' + (i + 1);
    a.textContent = h.textContent;
    toc.appendChild(a);
  });
  if (hs.length > 60) {
    var more = document.createElement('div');
    more.className = 'small dim';
    more.style.cssText = 'padding:6px 11px';
    more.textContent = '… 另有 ' + (hs.length - 60) + ' 个小节';
    toc.appendChild(more);
  }
  if (!hs.length) toc.style.display = 'none';

  /* 阅读进度 */
  var prog = document.getElementById('tocProg');
  function onScroll() {
    if (!prog) return;
    var h = document.documentElement.scrollHeight - window.innerHeight;
    prog.style.width = (h > 0 ? Math.min(100, window.scrollY / h * 100) : 0) + '%';
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  /* 移动端目录折叠 */
  var tg = document.getElementById('tocToggle');
  if (tg) tg.addEventListener('click', function () {
    var open = tg.getAttribute('aria-expanded') === 'true';
    tg.setAttribute('aria-expanded', String(!open));
    toc.classList.toggle('open', !open);
  });

  WB.fx.init();
})();
</script>
