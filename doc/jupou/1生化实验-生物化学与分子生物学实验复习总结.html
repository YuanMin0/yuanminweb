L Tris缓冲液(PH 8.8)，供测酶活性用 取C液0.1mL置于编号为Cp的试管中，加入", "0.4mL生理盐水，供测蛋白质含量 记录体积", "30% - 60%"]}, {"type": "list", "items": ["5.丙酮沉淀（选做） 向上述剩余悬液中逐滴加入冷丙酮，使丙酮终浓度"]}, {"type": "p", "text": "达33％，混匀后离心2min (8000r/min) ，弃沉淀 量取上清液体积后，缓缓加入冷丙酮，使丙酮终浓"}, {"type": "p", "text": "度达50％，混匀后立即离心2min(8000r/min)，弃 上清 向此沉淀中加入5mL Tris pH8.8缓冲液，使沉淀溶"}, {"type": "p", "text": "解，再离心5min (3000r/min)，将上清液倒入试管 中，记录体积、弃沉淀，上清液即为部分纯化的碱 性磷酸酶液，此为 D 液 取D液0.1mL置于编号为DE的试管中，加入0.9mL"}, {"type": "p", "text": "Tris缓冲液(PH 8.8)，供测酶活性 取D液0.1mL置于编号为Dp的试管中，供测蛋白质"}, {"type": "list", "items": ["含量", "33% - 50%", "思考题：根据学过的知识，分析在本实验中，哪些 因素会影响测得的碱性磷酸酶活性单位数值？"]}, {"type": "h", "text": "磷酸苯二钠法测定碱性磷酸酶活性"}, {"type": "list", "items": ["根据产物红色的深浅测定酚的含量", "酶活性单位：37℃下15 min生成1mg酚为1个酶活性单位", "每mL样品中", "酶活性单位 A标准 A样品 = X 标准管中的酚含量 X 稀释倍数"]}, {"type": "h", "text": "实验五：脲酶的Km值简易测定"}, {"type": "list", "items": ["酶的特 征常数", "• Km值等于酶促反应速度为最大速度一半时的 底物浓度，单位是摩尔／升（mol/L）。Km 值愈小，酶与底物的亲和力愈大。 • 酶促反应的特征常数只与酶的结构、底物和 反应环境（如温度、pH、离子强度）有关， 与酶的浓度无关。", "米—曼氏方程 （Michaelis-Menten equation） V=", "Vmax [S]", "Km + [S]", "米-曼氏方程解释：", "当[S]Km时，v＝ Vmax [S] /Km， 即v正比于[S]", "当[S]Km时，v≈ Vmax,  即[S]而v不变"]}, {"type": "p", "text": "Km值：当酶反应速率达到最大反应速率一半时的底物浓度，单位是mol／L。 Km值最小的底物称为该酶的最适底物也就是天然底物。"}, {"type": "list", "items": ["Km + [S]", "Vmax [S] V", "Vmax", "= Km=[S] =", "底物浓 度对酶促 反应速度", "的影响", "v Vm", "Vm 2"]}, {"type": "p", "text": "0                                                            [S]"}, {"type": "p", "text": "[S]与v关系： 当[S]很低时，[S]与v成比例-- 一级反应 当[S]较高时，[S]与v不成比例 当[S]很高时，[S]，v不变--零级反应"}, {"type": "h", "text": "原理"}, {"type": "list", "items": ["O      C", "NH2", "NH2", "2H2O", "脲 酶", "（NH4）2CO3", "+ 6NaI + 8KI + Na2CO3 + 6H2O", "(NH4)2CO3 + 8NaOH + 4(KI)2HgI2", "2O", "Hg", "Hg", "NH2I", "碘化双汞铵（橙黄色）", "1. 煮沸脲液时注意试管口不能对人，变性脲酶液要煮 沸变性彻底"]}, {"type": "h", "text": "Km值与 Vmax值测定"}, {"type": "list", "items": ["双倒数作图法又称林-贝氏作图法（1934） 1"]}, {"type": "p", "text": "=        Km       1     +      1 V       Vmax    [S]         Vmax"}, {"type": "list", "items": ["1/V", "-1/Km       0                                  1/[S]", "斜率= Km/ Vmax", "1/Vmax"]}, {"type": "list", "items": ["1. DNA、RNA的理化性质特点：", "– 核酸分子中既含有酸性基团（磷酸基）也含有碱性基团（氨", "基），因而核酸具有两性性质，是两性电解质。", "– 由于核酸分子中的磷酸是一个中等强度的酸，而碱性（氨基）"]}, {"type": "p", "text": "是一个弱碱，所以核酸通常表现为酸性，等电点比较低。如 DNA的等电点为pI 4-4.5，RNA的等电点为pI 2-2.5。"}, {"type": "list", "items": ["– DNA为白色纤维状固体，RNA为白色粉末状固体。", "– DNA和RNA都是极性化合物，因此他们一般都微溶于水，", "而不溶于乙醇，乙醚，氯仿等有机溶剂。"]}, {"type": "h", "text": "实验六：动物组织中核酸的提取"}, {"type": "list", "items": ["2. 核酸的存在方式："]}, {"type": "p", "text": "DNA和RNA在细胞中通常以与蛋白质结合的状 态存在。他们与蛋白质结合形成的复合物分别称为 DNP（脱氧核糖核蛋白）和RNP（核糖核蛋白）。"}, {"type": "h", "text": "分离纯化核酸的原则"}, {"type": "list", "items": ["1.  应保证核酸一级结构的完整性", "•完整的一级结构是保证核酸结构与功能研究的最基本要求 1）减少化学因素对核酸的降解："]}, {"type": "p", "text": "控制pH值范围(pH值5-9); 保持一定离子强度 2）减少物理因素对核酸的降解： 温度不要过高；避免机械剪切力破坏核酸结构"}, {"type": "list", "items": ["3）防止核酸的生物降解：", "–细胞内或外来的各种核酸酶能消化核酸链中的磷酸二酯键， 破坏核酸一级结构。"]}, {"type": "p", "text": "–进行核酸分离时最好新鲜生物组织或细胞样品，若不能马上 进行提取，应将材料贮存于液氮中或-70℃冰箱中。"}, {"type": "list", "items": ["–所用器械和一些试剂需高温灭菌，提取缓冲液中需加核酸酶 抑制剂。"]}, {"type": "list", "items": ["2.  排除蛋白质、脂类、糖类等其他分子的污染", "3.  无其他核酸分子的污染（如抽提DNA分子时应去除RNA分子）。"]}, {"type": "h", "text": "核酸纯化原理"}, {"type": "list", "items": [" DNA分离纯化原理：", "• 脱氧核糖核蛋白（DNP）在0.14 mol/L NaCl中溶解度很低， 而核糖核蛋白（RNP）却较易溶解，因此用上述浓度的NaCl 洗涤组织匀浆，可得到DNP，再用氯仿-异戊醇除蛋白即可得 到DNA。", "• RNA分离纯化原理：", "• 组织匀浆在酚与十二烷基硫酸钠(SDS)存在下，RNA与蛋白质", "分离。酚使蛋白质变性凝固，RNA则溶解在水相中，用乙醇", "使RNA从水相中沉淀而达到分离。"]}, {"type": "h", "text": "核酸分离纯化中各试剂的作用"}, {"type": "p", "text": "① DNP在2 mol/L NaCl中易溶解 DNP在0.14 mol/L NaCl中不溶 RNP在0.14 mol/L NaCl中易溶解 ②  EDTA：DNA酶抑制剂 DNA酶需要金属二价离子Mg2+、Ca2+的激 活，因此使用金属二价离子螯合剂EDTA，可 抑制DNA酶活性。"}, {"type": "p", "text": "③ 氯仿异戊醇抽提： 氯仿可使蛋白质变性并加速有机相与液相 分层； 异戊醇有助于消除抽提过程中产生的气泡。"}, {"type": "list", "items": ["1.DNA分离纯化"]}, {"type": "h", "text": "④  乙醇沉淀法："}, {"type": "list", "items": ["• DNA溶液是DNA以水合状态稳定存在，当加入 乙醇时，乙醇会夺去DNA周围的水分子，使DNA失 水而易于聚合。用无水乙醇沉淀DNA，这是实验中 最常用的沉淀DNA的方法。乙醇与核酸不会起任何化 学反应，对DNA很安全，因此是理想的沉淀剂。", "• 可用95％乙醇来替代无水乙醇（因为无水乙 醇的价格远远比95％乙醇昂贵）但是加95％的乙 醇使总体积增大，而DNA在溶液中有一定程度的 溶解，因而DNA损失也增大，尤其用多次乙醇沉 淀时，就会影响收得率。折中的做法是初次沉淀 DNA时可用95％乙醇代替无水乙酵，最后的沉淀 步骤要使用无水乙醇。"]}, {"type": "h", "text": "2. RNA分离纯化："}, {"type": "list", "items": ["①0.5 mol/L醋酸-醋酸钠溶液  使混合物中DNA沉淀", "2 mol/L 醋酸醋酸钠溶液  提供一定盐离子促进", "RNA沉淀", "②SDS：阴离于型表面活性剂", "•           使蛋白质变性，有破胞和抑制核酸酶的作用；", "③苯酚抽提法：", "苯酚是极强烈的蛋白质变性剂，它几乎使所有", "遇到的蛋白质都变性。能增加去除蛋白的效果， 并对核酸酶有抑制作用。", "④乙醇沉淀法：原理同DNA沉淀。"]}, {"type": "list", "items": ["  尽量保持低温下操作，作时注意避免破坏核酸", "结构", "一般来讲，核酸沉淀应在低温下长时间下进行。但是", "低温长时间沉淀，易导致盐与DNA共沉淀，影响以后", "的实验。因此一般使用0℃冰水，10-15min， DNA样", "品足可达到实验要求。", "  使用酚时应注意", "酚通常是透明无色的结晶，如果酚结晶呈现粉红色或", "黄色，表明其中含有酚的氧化产物。变色的酚不能用", "于核酸抽提实验，氧化物可破坏核酸的磷酸二酯键。", "酚腐蚀性很强，并可引起严重灼伤，操作时应戴手套。"]}, {"type": "h", "text": "注意事项"}, {"type": "h", "text": "DNA分离纯化实验步骤"}, {"type": "list", "items": ["吸取上层水液，边摇边加入等体积无水乙醇，即可见有长纤维状DNA析出"]}, {"type": "p", "text": "剪碎组织 放入匀浆器加入0.14 mol/L NaCl-0.01 mol/L EDTA液7 mL"}, {"type": "p", "text": "弃上清。沉淀中加入0.14 mol/L NaCl-0.01 mol/L EDTA液3mL混匀。"}, {"type": "list", "items": ["匀浆，装于离心管中 3000 r/min ，5 min"]}, {"type": "p", "text": "沉淀中加入3 mL 0.14 mol/L NaCl-0.01 mol/L EDTA, 混匀，转入匀浆器 匀浆，在搅拌下缓缓滴入250 g/L SDS 0.4 mL"}, {"type": "list", "items": ["匀浆，使沉淀悬浮均匀"]}, {"type": "p", "text": "再加入2 mol/L NaCl 4 mL（此时由于大分子脱氧核糖核蛋白的溶出， 溶液粘度骤然升高，再匀浆，使之均匀）"}, {"type": "list", "items": ["转入三角烧瓶", "加氯仿-异丙醇 5 mL，剧烈振摇10min。混合物装于离心管中", "上层水液，下层氯仿，交界面为变性蛋白。", "3000 r/min 离心5 min", "3000 r/min离心10min"]}, {"type": "h", "text": "RNA分离纯化实验步骤"}, {"type": "p", "text": "加入3 mL 0.05 mol/L 醋酸-醋酸钠缓冲液, 250 g/L SDS 0.5 mL，匀浆"}, {"type": "list", "items": ["移入三角烧瓶中，65℃水浴中继续振摇5-8min， 取出流水冷却"]}, {"type": "p", "text": "分装于5mL离心管中3000 r/min 离心 10 min 上层为稍浑浊含有RNA的水相，中层 为变性蛋白质，下层为酚液，管底残 渣含有DNA"}, {"type": "p", "text": "收集上层水液于量筒中，测水液的体积，加入1/10 体积的2 mol/L 醋 酸钠溶液，混匀。再加2.5 倍体积预冷的无水乙醇，混匀，冷处放置 至絮状沉淀充分形成（絮状沉淀即为RNA）"}, {"type": "list", "items": ["再加入等体积 80% 酚（约4mL），匀浆"]}, {"type": "h", "text": "实验七：质粒的提取"}, {"type": "list", "items": ["载体", "质粒 噬菌体 病毒", "目的基因（外源基因）", "基因组DNA cDNA 人工合成 PCR产物", "限制酶消化", "开环载体DNA", "目的基因", "连接酶", "重组体 转化 体外包装，转染", "带重组体的宿主", "筛选", "表型筛选", "酶切电泳鉴定", "菌落原位杂交"]}, {"type": "h", "text": "重组DNA技术操作的主要步骤"}, {"type": "list", "items": ["• 本实验采用试剂盒： – BL液为平衡液，用于活化层析柱的硅基质 – P1液为等渗溶液，细菌悬液，用于悬浮细菌沉淀 +溶菌", "酶 – P2液为细菌裂解液，试剂为NaOH和SDS，用于裂解细", "菌和染色体DNA变性 – P3液为中和液，试剂为醋酸钾，用于中和碱，使染色"]}, {"type": "p", "text": "体DNA沉淀析出 – PD液为去蛋白液 – PW漂洗液，为含盐的75%的酒精溶液 – 层析柱，主要为硅基质材料，用于吸附质粒DNA – EB洗脱缓冲液，用于洗脱层析柱上DNA"}, {"type": "h", "text": "实验试剂"}, {"type": "list", "items": ["• 在强碱和有SDS去垢剂环境下，细菌发", "生溶菌和裂解。染色体DNA发生不可逆", "变性，并与SDS结合。用酸性溶液中和", "碱后，与SDS结合的染色体DNA发生沉", "淀，而分子较小的质粒仍然溶在溶液中", "• 溶液中的质粒通过层析方法，高效回收"]}, {"type": "h", "text": "质粒提取试剂盒原理--碱裂解法"}, {"type": "list", "items": ["吸附柱的预先平衡"]}, {"type": "p", "text": "将吸附柱放入收集管中加入500 μL 的BL, 12000 转，1min, 弃废液，备 用。吸附柱要当天处理"}, {"type": "h", "text": "实验步骤"}, {"type": "list", "items": ["收集细菌1.5mL,重复一次 12000转，1min，尽量去除上清", "加入250μL P1液 充分震荡使重悬，不能有菌块", "加入250μL P2液", "温和颠倒6-8次使细菌充分裂解， 溶液变清亮，禁止剧烈震荡，裂 解时间<5min", "加入350μL P3液"]}, {"type": "p", "text": "温和颠倒6-8次，充分混匀，中和 碱液，出现白色沉淀，禁止剧烈 震荡，然后12000转，离心10min"}, {"type": "h", "text": "实验步骤"}, {"type": "list", "items": ["吸取上清，加入到层", "析柱中", "加入上清，12000转离心1min", "加入600μL PW液", "12000转，离心1min，洗涤两次 （重复一次）", "回收DNA"]}, {"type": "p", "text": "12000转，离心2min，取出层析柱， 套在一个新1.5ml 离心管中，放置 2min，在吸附膜中央加入30 μL DNA洗脱液，室温静止2min， 12000转，离心2min"}, {"type": "p", "text": "限制性内切酶 （restriction endonuclease，RE） • 一类能识别双链DNA分子中特定核 苷酸顺序（一般具有双重对称的回 文结构），并以内切方式水解双链 DNA的核酸水解酶； • 分为Ⅰ、Ⅱ、Ⅲ三种类型； • 主要用于基因克隆和基因测序。"}, {"type": "h", "text": "实验八：限制性核酸内切酶的消化 和琼脂糖凝胶电泳"}, {"type": "h", "text": "BamHⅠ XhoⅠ"}, {"type": "list", "items": ["• BamHⅠ识别序列 GGATCC •                                   CCTAGG • XhoⅠ识别序列    CTCGAG •                                 GAGCTC • 双酶切使用的是 K buffer", "• 本次实验因为使用的快酶，故使用厂商为 快酶提供的通用buffer"]}, {"type": "p", "text": "Star活性 • 限制酶在一些特定条件下使用时，可 以把与原来识别的特定的DNA序列不同的 碱基序列切断，这个现象称为star活性"}, {"type": "list", "items": ["• 导致star活性出现的因素： • 低离子强度 • 高pH值 • 过高的甘油浓度(> 5% v/v） 酶的保存液是50%甘油，为了控制star活", "性，酶体积应小于反应体积的1/10", "在20μl的反应体系中，最多加入的酶量为  2μl"]}, {"type": "h", "text": "实验操作-酶切"}, {"type": "list", "items": ["• 取1个清洁干燥灭菌的Ep管，编号，依次加入： 质粒DNA                                  1μg（12μl） 10×QuickCut Green Buffer  2μl 双蒸水                                      4.4μl BamHⅠ                                   0.8μl XhoⅠ                                       0.8μl • 手指轻弹管底，混匀，高速离心机10000r/min 离心10-15s； • 37℃水浴锅中水浴20min； • 20μl加入凝胶加样孔中。"]}, {"type": "h", "text": "实验操作-琼脂糖凝胶电泳"}, {"type": "list", "items": ["称取1 g琼脂糖于100 ml 1×TAE中，在微波炉中使", "琼脂糖颗粒完全溶解，冷却至45-50ºC时加入 10μl的EB，摇匀后倒入制胶板中。", "室温冷却凝胶凝固后，加1×TAE电泳缓冲液至液", "面覆盖凝胶1-2mm，小心垂直向上拔出梳子。", "用微量移液枪小心加入样品槽中。 电泳：控制电压保持在60-120V。当溴酚蓝条带", "移动到距凝胶前沿约2cm时，停止电泳。 取出凝胶，置于紫外透射仪上观察并照相记录。", "思考题：酶切不出现目的基因片段的 可能因素都有哪些？"]}, {"type": "list", "items": ["实验九： PCR技术及其应用"]}, {"type": "h", "text": "PCR的基本原理"}, {"type": "list", "items": ["• PCR反应条件 • PCR过程 • PCR的特点", "标准的PCR反应体系"]}, {"type": "p", "text": "4种dNTP混合物   各200umol/L 引物         各10～100pmol 模板DNA       0.1～2ug Taq DNA聚合酶    2.5u Mg2+         1.5mmol/L"}, {"type": "list", "items": ["1 2 3 4 5", "22", "55", "72", "94", "时间（min）", "温 度", "（℃）"]}, {"type": "h", "text": "PCR的基本原理"}, {"type": "list", "items": ["• PCR反应条件 • PCR过程 • PCR的特点", "适温延伸", "3 高温变性", "1 低温退火", "重复1~3步", "25~30轮", "目的DNA片段 扩增100万倍以上", "DNA双螺旋", "DNA单链 与引物复性", "DNA", "变 性", "形 成", "条 单 链", "子链延伸", "DNA加倍"]}, {"type": "h", "text": "PCR的基本原理"}, {"type": "list", "items": ["• PCR反应条件 • PCR过程 • PCR的特点", "• 灵敏度高", "1.皮克(pg=10-12)量级扩增到微克(ug=10-6)水平 2. 能从100万个细胞中检出一个靶细胞 3.病毒检测的灵敏度可达3个RFU 4.细菌检测的最小检出率为3个细菌 • 简便、快速", "1.一次性加好反应液，2～4 小时完成扩增 2.扩增产物一般用电泳分析 • 对标本的纯度要求低", "血液、体腔液、洗嗽液、毛发、细胞、活组", "织等组织的粗提DNA"]}, {"type": "list", "items": ["1）PCR反应成分", "（1）模板", "单、双链DNA均可。", "不能混有蛋白酶、核酸酶、DNA聚合酶抑制剂、 DNA结合蛋白类。", "一般100ng DNA模板/100L。", "模板浓度过高会导致反应的非特异性增加。"]}, {"type": "h", "text": "PCR反应注意事项"}, {"type": "h", "text": "（2）引物浓度"}, {"type": "list", "items": ["0.1-0.5 mol/L", "浓度过高易导致模板与引物错配,反应特异性 下降。", "（3）Taq DNA聚合酶（thermus aquaticus)", "0.5-2.5 U/50 l", "酶量增加使反应特异性下降;酶量过少影响反 应产量。"]}, {"type": "list", "items": ["（4）dNTP", "dNTP浓度取决于扩增片段的长度", "四种dNTP浓度应相等"]}, {"type": "h", "text": "浓度过高易产生错误碱基的掺入，浓度过 低则降低反应产量"}, {"type": "list", "items": ["dNTP可与Mg2+结合，使游离的Mg2+浓度下降， 影响DNA聚合酶的活性。"]}, {"type": "h", "text": "（5） Mg2+"}, {"type": "list", "items": ["Mg2+是DNA聚合酶的激活剂。", "0.5mmol/L-2.5mmol/L反应体系。", "Mg2+浓度过低会使Taq酶活性丧失、PCR产量下降； Mg2+过高影响反应特异性。"]}, {"type": "p", "text": "Mg2+可与负离子结合，所以反应体系中dNTP、 EDTA等的浓度影响反应中游离的Mg2+浓度。"}, {"type": "h", "text": "2）循环参数"}, {"type": "list", "items": ["(1)变性", "使双链DNA解链为单链", "95oC 20-30秒", "(2) 退火", "温度由引物长度和GC含量决定。", "增加温度能减少引物与模板的非特异性结", "合;降低温度可增加反应的灵敏性。"]}, {"type": "h", "text": "（3）延伸"}, {"type": "list", "items": ["70-75oC，", "延伸时间由扩增片段长度决定", "（4）循环次数", "主要取决于模版DNA的浓度", "一般为25-35次", "次数过多：扩增效率降低", "错误掺入率增加"]}, {"type": "h", "text": "引物设计："}, {"type": "list", "items": ["（1)序列应位于高度保守区，与非扩增区无同源 序列。", "（2）引物长度以15-40 bp为宜。", "（3）碱基尽可能随机分布，G+C占50-60%。", "（4）引物内部避免形成二级结构。", "（5）两引物间避免有互补序列。", "（6）引物3’端为关键碱基；5’端无严格限制。"]}, {"type": "h", "text": "1、打开软件界面，找到储存 好的目的序列"}, {"type": "list", "items": ["2、选定准备扩增的序列 3、点击“分析” 点击“引物设计”", "4、预设相应的参数 思考题", "• 1、PCR技术的基本原理是什么？其影响因素分别 有哪些？ • 2、引物设计的主要原则和注意事项是什么？ • 3、PCR技术的主要用途有哪些？"]}, {"type": "h", "text": "本资料仅供参考"}, {"type": "list", "items": ["预祝航医三队全体都能考出好成绩！", "陈醋小生 2013.10"]}];</script>
