<script>window.__DOC_BLOCKS = [{"type": "p", "text": "==1.====阿托品=="}, {"type": "list", "items": ["不良反应（与剂量有关）", "一般表现：0.5mg-轻度心率减慢，略有口感，无汗；1mg-口干，心率加速，瞳孔轻度扩大；2.0mg-心悸，显著口干，瞳孔扩大，有时出现视近物模糊", "中枢神经系统中毒症状：5mg-语言不清，不安疲倦，头痛等；10mg-烦躁不安，谵妄，，幻觉，惊厥等", "阿托品的最低致死量：成人为80-130mg，儿童为100mg", "禁忌症：青光眼，前列腺肥大，麻痹行肠梗阻", "中毒解救", "洗胃，导泻，促排", "解毒药物：毒扁豆碱1-4mg（儿童0.5mg）静脉注射；地西泮", "人工呼吸，物理降温", "解救有机磷酸酯类中毒而用阿托品过量时，不能用新斯的明、毒扁豆碱等抗胆碱酯酶药", "药理作用", "松弛内脏平滑肌", "眼:散瞳，升高眼压，调节麻痹(与毛果芸香碱的调节痉作用相对)", "抑制腺体分泌", "心血管系统:小剂量，阻断副交感神经节后纤维上的 M1 胆碱受体，从而减少突触中 Ach 对递质释放的抑制作用，表现为减慢心率的作用。大剂量时，阻断窦房结 M2 受体，解除迷走神经对心脏的抑制作用，因而心率加速，促进房室传导。扩张血管，改善微循环。", "中枢神经系统:主要表现为中枢兴奋现象。中毒剂量时，产生幻觉、定向障碍、运动失调、惊厥。严重时由兴奋转为抑制。(产生的作用类似于激动交感神经后产生的作用)", "临床应用", "解除平滑肌痉挛:用于各种内脏绞痛。(肾绞痛和胆绞痛疗效差，结合阿片类镇痛剂)", "抑制腺体分泌:用于全麻前给药，减少呼吸道腺体分泌。", "眼科应用:虹膜睫状体炎，验光配镜散瞳。", "缓慢型心律失常:治疗迷走神经过度兴奋所致的案性心动过缓、房室传导阻;窦房结功能低下所致的室性异位节律。", "抗休克(感染性):解除微血管痉挛，改善心、脑、肝、肾等重要脏器的缺血状态，有助于休克好转。伴有高热或心率过快者，不用。", "解除有机磷酸酯类中毒。(口干，视力模糊，心率加快，瞳孔扩大，皮肤潮红，中毒反应(毒扁豆碱，禁用吩噻嗪类)"]}, {"type": "p", "text": "==2.====有机磷酸酯=="}, {"type": "list", "items": ["中毒机制：可与ACHE牢固结合，而抑制了该酶的活性，其结合点与易逆性ACHE药相似，也在ACHE的酶解部位丝氨酸的羟基。ACHE失去水解ACH能力，ACH积聚。\n（2）中毒治疗：", "阿托品：特异性高效能解毒药，能迅速对抗体内ACH的毒蕈碱样作用，松弛多种平滑肌，抑制多种腺体分泌，加快心率和扩瞳，从而有效减轻中毒引起的恶心，呕吐腹痛，支气管分泌多，缩瞳，心率减慢，血压下降等症状。阿托品对中枢烟碱受体无明显作用，所以对惊厥，躁动不安等中枢症状作用差，应早期给药直到症状消失或阿托品化。", "ACHE复活药（碘，氯解磷定，双复磷）：能使ACHE恢复活性，可以解救单独用阿托品不能控制的严重病，缩短中毒病程。", "解救", "维持呼吸循环", "对毒物“围追堵截”-迅速清除毒物，以免毒物继续吸收。"]}, {"type": "p", "text": "A.脱离现场;"}, {"type": "p", "text": "B.脱去污染衣物，肥皂水或清水冲洗体表、甲床缝隙、毛发经口中毒者应反复"}, {"type": "p", "text": "C.洗胃:根据毒物种类，选择合适的洗胃液。洗胃液常选用:微温1%盐水，2%碳酸氢钠溶液；对硫磷、马拉硫磷禁用氧化剂，敌百虫禁用碱性溶液。"}, {"type": "p", "text": "D.硫酸镁导泻。"}, {"type": "list", "items": ["对“症”下药：及早、足量、反复，以出现轻度“阿托品化”"]}, {"type": "p", "text": "A.瞳孔扩大-抑制瞳孔括约肌收缩"}, {"type": "p", "text": "B.口干-抑制腺体分泌"}, {"type": "p", "text": "C.面红-皮肤血管扩张"}, {"type": "p", "text": "D.轻度不安-中枢兴奋作用。阿托品对N样症状、中枢症状作用差；严格控制阿托品用量，达到阿托品化，避免阿托品中毒。"}, {"type": "p", "text": "==3.====新斯的明=="}, {"type": "list", "items": ["作用机制（易逆性抗胆碱酯酶药）", "抑制胆碱酯酶活性而发挥完全拟胆碱作用", "直接激活胆碱受体（NM）而发挥作用", "促进运动神经末梢释放乙酰胆碱。", "临床应用", "重症肌无力", "腹气胀和尿潴留", "肌松药（非去极化型）中毒", "阵发性室上心动过速"]}, {"type": "p", "text": "==4.====高血压药物=="}, {"type": "list", "items": ["利尿药", "排钾利尿药：氢氯噻嗪、氯噻嗪(噻嗪类)。", "袢利尿药：呋塞米、布美他尼、托拉塞米。", "兼有排钾及扩血管作用的利尿药：吲达帕胺。", "排钾、保钾双重作用的固定复方制剂：氢氯噻嗪/阿米洛利。", "β受体拮抗药"]}, {"type": "p", "text": "机制：降低心率及交感活性使心排血量降低。"}, {"type": "p", "text": "代表药：普萘洛尔、阿替洛尔、美托洛尔、比索洛尔、卡维地洛、阿罗洛尔和拉贝洛尔等。"}, {"type": "list", "items": ["钙通道阻滞药(CCB)"]}, {"type": "p", "text": "机制：二氧吡啶类拮抗平滑肌上的L-型钙离子通道而发挥扩张血管的作用；非二氢吡啶类降低心排血量。"}, {"type": "list", "items": ["二氢吡啶类：硝苯地平、非洛地平、尼群地平、氨氯地平、左旋氨氯地平、尼卡地平和拉西地平等。", "非二氢吡啶类：地尔硫䓬，维拉帕米。", "血管紧张素转换酶抑制剂(ACEl)"]}, {"type": "p", "text": "机制：抑制ACE酶使血管紧张素Ⅱ减少，增加缓激肽生成。"}, {"type": "p", "text": "代表药：卡托普利、依那普利、贝那普利、雷米普利、福辛普利、赖诺普利、咪哒普利等。"}, {"type": "list", "items": ["血管紧张素Ⅱ受体拮抗药(ARB)"]}, {"type": "p", "text": "机制：通过拮抗血管紫张素Ⅱ的AT1受体有可能继而激活AT2受体发挥降压作用。"}, {"type": "p", "text": "代表药物：氯沙坦、缬沙坦、厄贝沙坦、坎地沙坦、替米沙坦、奥美沙坦。"}, {"type": "list", "items": ["α1受体拮抗药"]}, {"type": "p", "text": "机制：拮抗血管平滑肌上的α1受体，使血管扩张而降压。"}, {"type": "p", "text": "代表药：多沙唑嗪、特拉唑嗪、哌唑嗪、乌拉地尔、酚苄明、妥拉唑林。"}, {"type": "list", "items": ["复方制剂"]}, {"type": "p", "text": "机制：联合起到协同降压、不良反应下降。"}, {"type": "p", "text": "代表药：复方利血平/氨苯蝶啶片(降压0号)、氯沙坦/氢氯噻嗪、厄贝沙坦/氢氯噻嗪、培哚普利/吲达帕胺。"}, {"type": "p", "text": "==5.====肾上腺素的临床应用=="}, {"type": "list", "items": ["心脏停搏：因溺水，中枢抑制药中毒，麻醉和手术意外，急性传染病和心传导高度阻滞引起的心脏停搏可做AD心室内注射具有起搏作用。", "过敏性休克：输液或青霉素等过敏引起的过敏性休克，AD能明显收缩小动脉和毛西血管前括约肌，使毛细血管通透性降低，改善心脏功能和接触支气管平滑肌痉挛，从而迅速缓解症状，挽救病人生命。", "支气管哮喘急性发作及其他速发型变态反应：AD可解除哮喘时支气管平滑肌痉挛，还可抑制组织和肥大细胞释放过敏反应物质，以及减轻呼吸道水肿和渗出，从而使支气管哮喘急性发作得到迅速控制。", "局部应用：AD加入普鲁卡因或利多卡因可延缓局麻药吸收增强局麻效应延长局麻时间，减少局嘛吸收中毒发生。但手指、足趾、耳部、阴茎等循环末梢部位手术时不宜加肾上腺素，以免发生组织坏死。还可治疗青光眼。", "局部止血：鼻粘膜或牙龈出血"]}, {"type": "p", "text": "==6.====阿司匹林=="}, {"type": "list", "items": ["作用机制", "镇痛作用：主要是通过抑制前列腺素及其他能使痛觉对机械性或化学性刺激敏感的物质（如缓激肽、组胺）的合成，属于外周性镇痛药。", "抗炎作用：作用于炎症组织，通过抑制前列腺素或其他能引起炎性反应的物质（如组胺）的合成而起消炎作用，抑制溶酶体酶的释放及白细胞活力等也可能与其有关；", "解热作用：可能通过作用于下视丘体温调节中枢引起外周血管扩张，皮肤血流增加、出汗、使散热增加而起解热作用，此种中枢性作用可能与前列腺素在下视丘的合成受到抑制有关；", "对血小板聚集的抑制作用：是通过抑制血小板的前列腺素环氧酶（PG）、从而防止血栓烷A2（TXA2）的生成而起作用（TXA2可促使血小板聚集）。此作用为不可逆性。", "药理作用", "解热镇痛：解热镇痛作用迅速可靠，主要用于发热、头痛、肌肉痛、神经痛、痛经等轻中度钝痛", "抗炎抗风湿：治疗急性风湿关节炎疗效迅速确切，为首选药，并有鉴别诊断价值。对类风湿关节炎也有较好的作用。较大剂量（成人每天3-5g）", "抗血栓：不可逆抑制血小板cox，减少血小板血栓素A2，抑制血小板聚集，抗血栓", "其他：可降低结肠癌风险，可预防阿尔兹海默病的发生，还可治疗放射诱发的腹泻，取出胆道蛔虫。", "不良反应", "胃肠道反应：最常见，它抑制COX1干扰PGS合成，刺激胃黏膜引起上腹不适，胃灼痛，诱发或加重溃疡和出血，抗风湿剂量阿司匹林可引起恶心呕吐，损伤胃黏膜呈无痛性出血。", "过敏反应：荨麻疹和血管神经性水肿多，罕见阿司匹林哮喘。", "凝血障碍：一般剂量长期使用抑制血小板功能，出血时间延长。", "水杨酸反应：用药过量出现的中毒反应，头痛头晕，耳鸣视力障碍，出汗，恶心呕吐，甚至惊厥昏迷。", "对肝，肾功能影响：转氨酶活性高，肝大恶心黄疸，Rey综合征，表现为肝损害和脑病。", "阿司匹林哮喘：某些哮喘病患者服用乙酰水杨酸后可诱发哮喘，称为”阿司匹林哮喘“，后果严重，可致死", "瑞夷综合征：儿童和青少年常见，表现为肝损害和脑病，可致死。"]}, {"type": "p", "text": "==7.====吗啡=="}, {"type": "list", "items": ["药理作用", "中枢神经系统"]}, {"type": "p", "text": "镇痛镇静致欣快"}, {"type": "p", "text": "镇咳 延髓孤束核"}, {"type": "p", "text": "抑制呼吸——降低呼吸中枢对二氧化碳敏感性，抑制脑桥呼吸调整中枢"}, {"type": "p", "text": "缩瞳 副交感神经兴奋，针尖样瞳孔为中毒表现"}, {"type": "p", "text": "兴奋脑干催吐化学感受区，恶心、呕吐"}, {"type": "p", "text": "下丘脑体温调节中枢，抑制下丘脑激素分泌"}, {"type": "list", "items": ["平滑肌"]}, {"type": "p", "text": "提高平滑肌张力，引起便秘"}, {"type": "p", "text": "奥迪括约肌痉挛，引起胆绞痛"}, {"type": "p", "text": "提高膀胱括约肌张力，引起尿潴留"}, {"type": "p", "text": "降低子宫张力，延长产程"}, {"type": "p", "text": "大剂量收缩支气管，诱发加重哮喘"}, {"type": "list", "items": ["心血管系统"]}, {"type": "p", "text": "扩张血管——血压下降"}, {"type": "p", "text": "呼吸抑制——PCO2升高——颅内压升高"}, {"type": "list", "items": ["免疫系统——抑制体液免疫和细胞免疫", "临床应用", "镇痛："]}, {"type": "p", "text": "创伤、烧伤（短期）"}, {"type": "p", "text": "心梗（血压无下降者）"}, {"type": "p", "text": "胆绞痛与肾绞痛（与解痉药合用）"}, {"type": "p", "text": "晚期癌症患者"}, {"type": "list", "items": ["心源性哮喘"]}, {"type": "p", "text": "扩张血管，降低外周阻力"}, {"type": "p", "text": "抑制呼吸中枢，降低呼吸频率"}, {"type": "p", "text": "缓解紧张焦虑"}, {"type": "p", "text": "减轻心脏负荷，降低耗氧"}, {"type": "list", "items": ["止泻"]}, {"type": "p", "text": "严重单纯性腹泻，对急性、慢性腹泻均有效"}, {"type": "p", "text": "==8.====吗啡和阿司匹林镇痛作用和临床作用区====别=="}, {"type": "list", "items": ["作用强度：吗啡有强的镇痛作用，对各种疼痛均有效，阿司匹林只有中等程度的镇痛作用，主要用于一些慢性钝痛，对急性锐痛没有镇痛作用。", "作用机制：吗啡激动了中枢的阿片受体，阿司匹林抑制了外周前列腺素的生物合成。", "临床应用：吗啡主要用于其他镇痛药无效的急性锐痛及癌性疼痛，阿司匹林主要用于肌肉痛、牙痛、关节痛等慢性钝痛。", "吗啡长期应用会产生欣快感与成瘾性，阿司匹林没有欣快感及成瘾性。"]}, {"type": "p", "text": "==9.====吗啡为什么能治心源性哮喘而不能治支气管哮=="}, {"type": "list", "items": ["吗啡能有效扩张外周血管的阻力，明显减轻心脏的泵血负荷，从而消除全身性的水肿。", "吗啡是一种常见的镇静催眠药物。当发生心源性哮喘时，患者的情绪时非常紧张和焦虑的，心脏的负荷也就会明显增加。用吗啡可以缓解病人的紧张情绪，减轻心脏负担。", "吗啡可以显著降低呼吸中枢对二氧化碳的敏感性，使得喘息症状有明显的缓解。", "吗啡有一定的抑制呼吸中枢，使支气管收缩的功能，从而加重的呼吸困难，因此禁用于支气管哮喘。"]}, {"type": "p", "text": "==10.====糖皮质激素=="}, {"type": "list", "items": ["临床应用", "严重急性感染（中毒性感染或同时伴休克，多种结核病急性期如结核性脑膜炎，胸膜炎，心包炎腹膜炎），抗炎治疗及防止某些炎症后遗症。", "自身免疫性疾病（风心病，风湿关节炎，SLE）过敏性疾病（荨麻疹，支哮，过敏性休克）器官移植排斥反应。", "抗休克治疗：感染中毒性休克早，短时间突击使用大量糖皮脂激素。过敏性休克结合肾上腺素合用。低血容量性休克。", "血液病（AA，儿童急淋，粒细胞减少症）", "局部应用（湿疹，肛门瘙痒，接触性皮炎，肌肉关节劳损）", "替代疗法（急慢性肾上腺功能不全，肾上腺次全切后）", "不良反应", "短期即可发生、几乎不可避免的不良反应：失眠、情绪不稳、食欲增加、体重增加。", "长期大量应用时的不良反应："]}, {"type": "p", "text": "1>类肾上腺皮质功能亢进综合征-因物质代谢和水盐代谢紊乱所致，如满月脸、水牛背、向心性肥胖、肌萎缩、皮肤变薄、痤疮、多毛、浮肿、低血钾、高血压、高血脂、糖尿等。采用低盐、低糖、高蛋白饮食和加用氯化钾可减轻症状。"}, {"type": "p", "text": "2>诱发或加重感染-因糖皮质激素抑制机体防御功能，且无抗菌作用。长期应用常可诱发感染或使体内潜在病灶扩散，特别是在原有疾病已使抵抗力降低如肾病综合征者更易产生。还可使原来静止的结核病灶扩散、恶化(机会感染)。故结核病患者必要时应并用抗结核药。"}, {"type": "p", "text": "3>消化系统并发症-使胃酸、胃蛋白酶分泌增加，抑制胃粘液分泌，降低胃肠粘膜的抵抗力，故可诱发或加剧胃、十二指肠溃疡，甚至造成消化道出血或穿孔。对少数患者可诱发胰腺炎或脂肪肝。"}, {"type": "p", "text": "4>诱发心血管系统并发症-由于水、钠潴留和血脂升高，诱发高血压、动脉粥样硬化。"}, {"type": "p", "text": "5>兴奋中枢-糖皮质激素可诱发精神异常。有精神病或癫痫病史者禁用或慎用。6>白内障和青光眼-糖皮质激素能诱发白内障，全身给药或局部给药均可发生，可能与糖皮质激素抑制晶状体上皮Na-K泵功能，导致晶体纤维积水和蛋白质凝集有关。糖皮质激素还能使眼内压升高，诱发青光眼或使青光眼恶化。"}, {"type": "p", "text": "7>骨骼肌肉系统-骨质疏松、肌肉萎缩、伤口愈合迟缓等与激素促进蛋白质分解、抑制其合成及抑制成骨细胞的活性，增加钙、磷排泄有关。骨质疏松多见于儿童、老人和绝经妇女，严重者可有自发性骨折，部分患者可出现股骨头坏死。"}, {"type": "p", "text": "8>内分泌与代谢系统-对内源性垂体-下丘脑轴的抑制导致肾上腺萎缩和肾上腺皮质功能低下，长期服用超生理剂量的糖皮质激素不可突然停药，否则会发生肾上腺危象。此外还有类固醇性糖尿病、水纳水钠潴留等。"}, {"type": "p", "text": "9>伤口愈合迟缓、影响生长发育、孕妇可致畸胎。"}, {"type": "list", "items": ["停药后为什么出现肾上腺皮质功能不全"]}, {"type": "p", "text": "长期用药者减量过快或突然停药，可引起肾上腺皮质功能不全。当久用GCS后，可致皮质萎缩。突然停药后，如遇到应激状态，可因体内缺乏GCS而引发肾上腺危象发生。(肾上腺危象：是指由各种原因导致肾上腺皮质激素分泌不足或缺如而引起的一系列临床症状，可累及多个系统。主要表现为肾上腺皮质激素缺乏所致的症状，如脱水、血压下降、体位性低血压、虚脱、厌食、呕吐、精神不振、嗜睡乃至昏迷。患者有时会被误诊为急腹症而行手术治疗或延误诊断，最终进展全昏迷，甚至死亡。)"}, {"type": "list", "items": ["长期用药应注意什么药理作用", "在长时间使用糖皮质激素治疗过程中，遇下列情况之一者，应撤去或停用糖皮质激素：A.心维持量已减至正常基础需要量：如泼尼松每日 5. 0 ~7. 5mg, 经过长期观察，病情已稳定不再活动者；B.因治疗效果差，不宜再用糖皮质激素，应改药者；C.因严重副作用或并发症，难以继续用药者。", "不可骤然停药，应缓慢减量;", "停药前加用ACTH 7d左右", "在停药1年内如遇应激情况，如感染、创伤、手术时，应及时给予足量的糖皮质激素", "药理作用", "强大的抗炎作用：对炎症抑制蛋白及某些靶酶影响，并抑制多种炎性细胞因子的产生，而且可以在转录水平上直接某些黏附分子的表达，还可增加多种抗炎介质的表达，能诱导炎细胞凋亡，从而产生抗炎作用。", "免疫抑制作用：抑制巨噬细胞吞噬和处理抗原；阻碍淋巴母细胞转化，破坏淋巴细胞；干扰淋巴细胞在抗原作用下的分裂和增值，阻断致敏T淋巴细胞诱发的单核细胞和巨噬细胞的募集等。", "抗休克作用：超大剂量可用于治疗中毒性、心源性和过敏性休克。", "血液与造血系统：血中红细胞、白细胞、血小板增多；血中淋巴细胞减少。", "中枢神经系统：提高中枢神经系统兴奋性，出现欣快、激动。失眠等。", "物质代谢：糖代谢-促进糖异生，使血糖升高，使肝糖原、肌糖原合成增加。蛋白质代谢-使蛋白质代谢加强，造成负氮平衡，大剂量还可抑制蛋白质合成；长期应用可导致生长减慢，肌肉消瘦，创伤难愈。脂肪代谢-长期大剂量升高血浆胆固醇，形成水牛背、满月脸之类的向心性肥胖。水盐代谢-抑制钙磷在肠道的吸收和在肾小管的重吸收，使尿钙排出增加，长期使用会造成骨质疏松。核酸代谢-复杂。", "骨骼和骨骼肌-长期大量应用可导致骨质疏松。", "允许作用-糖皮质激素对有些组织细胞虽无直接活性，但可给其他激素发挥作用创造有利条件。", "其他：退热，促进盐酸和胃蛋白酶分泌。"]}, {"type": "p", "text": "==11.====抗菌药=="}, {"type": "list", "items": ["机制", "抑制细菌细胞壁合成：青霉素类及头孢菌素类能与细菌胞膜上的青霉素结合蛋白PBPs结合，阻碍肽聚糖的交叉联接，导致细胞壁缺损使细菌破裂溶解而死亡。", "改变胞浆膜的通透性：①多肽类抗生素，其阳离子与胞浆膜中的磷脂结合，使膜功能受损②抗真菌药物及两性霉素B能与真菌胞质膜上的麦角固醇类结合，形成微孔或通道，使膜的通透性增加，细胞内容物会外漏而使细菌死亡。", "抑制细菌蛋白质的合成：与30s亚基结合（四环素、氨基糖苷类抗生素）或与50s亚基结合（红霉素、氯霉素、林可霉素）从而抑制细菌肽链的形成或延长；影响蛋白质全过程：氨基糖苷类抗生素。", "影响核酸代谢：利福平抑制DNA依赖的RNA聚合酶，阻碍mRNA合成；喹诺酮类抑制DNA回旋酶及拓扑异构酶Ⅳ，阻碍敏感细菌DNA复制。", "影响叶酸代谢：磺胺类、甲氨苄啶（TME）分别抑制二氢蝶酸合成酶和二氢叶酸合成酶，干扰叶酸代谢。阻碍叶酸前体物质嘌呤、嘧啶的合成，从而发挥着抗菌作用。", "避免抗菌药物的滥用（治疗应用原则）", "根据适应症用药：首先要判断是否是细菌感染，如果确定细菌感染或者可疑的细菌感染，才能够应用抗菌药物治疗。", "有针对性的选择用药：抗菌药物的选择要结合感染的部位，另外还要结合是社区获得性感染，还是院内获得性感染。要初步判断是敏感的细菌感染，还是耐药的细菌感染，有针对性的选择抗菌药物来治疗。", "根据药敏结果用药：如果患者感染的病情偏重，或者比较复杂，应尽可能进行细菌的培养，可以采用血培养、痰培养等，然后根据药敏的结果，选用敏感的抗菌药物治疗。", "避免过度使用抗菌药物：一方面，如果能单药治疗的不选择联合治疗，另一方面，一旦恢复之后要尽早停药，避免过长时间的应用抗菌药物。", "逐级用药：如果简单、低级别的抗菌药物能够控制感染，不能够过度选择更高级别的抗菌药物来治疗。", "避免二重感染：对于长期应用抗菌药物治疗的患者，要注意避免二重感染的问题。", "细菌耐药机制", "产生灭活酶：是微生物产生耐药机制的最重要机制，如β-内酰胺酶，氨基苷类抗生素钝化酶等。", "抗菌药物作用靶位改变：①改变靶蛋白，降低与抗生素的亲和力②产生新的靶蛋白，使抗生素不能与之结合③靶蛋白数量增加，从而耐药。", "改变细菌外膜通透性：细菌接触抗生素后，可通过改变通道蛋白的性质和数量来降低膜通透性从而产生获得耐药性。", "影响主动流出系统：对抗菌药物的选择性特点，使某些外排药物速度大于药物内流速度，降低细菌内的积聚而产生耐药。", "四代头孢菌素作用特点", "一代：G+作用强于二三代，G-作用较弱，易被β-内酰胺酶破坏，肾毒性最强，治疗敏感菌致呼吸道和尿路感染、皮肤及软组织感染，头孢噻吩，头孢唑林。", "二代：G+作用略弱于一代，G-作用明显，对厌氧菌有一定作用，但对铜绿假单胞菌无效，对多种β-内酰胺酶较稳定，肾毒性较低，用于敏感菌致肺炎，胆道感染，菌血症，尿路感染及其他组织感染，头孢呋辛，头孢孟多。", "三代：G+作用不及一二代，对G-包括肠杆菌类，铜绿假单胞菌及厌氧菌作用较强，对β-内酰胺酶有较高稳定性，基本无肾毒性，用于危及生命的败血症，脑膜炎，肺炎等，能有效控制铜绿假单胞菌感染，头孢噻肟，头孢曲松。", "四代：G+/G-均高效，对β-内酰胺酶高度稳定，无肾毒性，用于对三代耐药的细菌感染，头孢匹罗，头孢吡肟。"]}, {"type": "p", "text": "==12.====从药理学谈谈如何合理用药=="}, {"type": "list", "items": ["每一药物都有其固有的药理作用。在质的方面表现为选择性作用，在量方面表现为作用强度与持久度。同一剂量的药物在不同个体所形成的血药浓度和作用部位的浓度不同，持续时间也不同，因而作用强度和维持时间也出现很大差异。要保证临床上每个病人都能达到最大疗效，最小不良反应的治疗目的，单纯根据药理作用选药和用药显然是不够的，必须掌握药物作用因素，结合病人的具体情况和一些检测数据，在严密的科学原则基础上，根据情况做出具体处理。下面介绍临床合理用药几个必须考虑的原则及注意事项。", "血药浓度测定与合理给药：药物的血药浓度测定具有非常重要的意义，因为血药浓度不仅是药效动力学的根据，也是药代动力学的主要内容，特别是对安全幅度小，血药浓度个体差异大，药理作用强与血药浓度密切相关，而治疗效果不易在短期内作出判断的药物，测定其血药浓度，从而依据血药浓度制定合理的给药方案，是提高药物疗效降低毒性反应的可行办法之一。", "肝功能与合理用药：肝脏是代谢药物的主要器官，有些药物经代谢时对肝脏有一定的毒性作用，肝功能不足时那些在肝解毒的药物作用将加强并延长，而在肝活化的药物则作用减弱。如新生霉素、利福平等，当肝功能不足时易引起药物在体内蓄积升高血药浓度产生不良反应，这类药物应慎用。", "肾功能与合理用药：肾脏是药物的主要排泄途径。肾功能不良时应用主要经肾脏排泄的药物，应减少用药或延长给药时间，以防止排泄障碍血药浓度过高而发生中毒。以抗生素为例，红霉素主要经肝脏代谢，肾功能不良时可以常规使用。青霉素主要经肾脏排泄，但毒性极微，肾功能严重损害或不良时剂量只需略加调整。四环素类经肾脏排泄，对肾脏有一定毒性，肾功能损害时不宜应用。卡那霉素及庆大霉素主要经肾脏排泄且毒性较大，肾功能损害时要减量，并可按药代动力学公式进行计算给药剂量。因此可根据不同的肾功能情况来计算和调整给药方案。", "身体状况与合理给药：根据疾病的性质和病史衡量得失决定是否需要给药。在确定主诉病因的同时，还要了解其他并存的疾病。例如老年哮喘病人就要了解有无高血压，否则选用拟肾上腺素类药物治疗可能发生危险，所以选药不仅要有针对适应症，还要排除禁忌症。", "半衰期与合理用药：每一个药物都有各自的半衰期，由于药物的半衰期各自不同，因此按照一般习惯每日给3次的给药方案并不适合所有的药物，更不适合每一个病人。为了维护恒定的有效浓度而达到满意的治疗效果，按一定的时间间隔给药是必要的，在临床上可适当根据药物的有效浓度结合半衰期确定给药时间更为合适。"]}, {"type": "p", "text": "==13.====治疗心绞痛的药物=="}, {"type": "list", "items": ["硝酸酯类常用的药物有：硝酸甘油、硝酸异山梨酯等。", "β受体阻断药常用的药物有：普萘洛尔、阿替洛尔、美托洛尔等。", "钙拮抗药常用的药物有：维拉帕米、地尔硫卓、硝苯地平等。"]}, {"type": "p", "text": "==14.====左旋多巴的不良反应和增效剂=="}, {"type": "list", "items": ["不良反应", "早期：胃肠道反应-恶心呕吐；心血管反应-体位性低血压和心律失常。", "长期：运动过多症-不自主运动（异动症）；症状波动-开关现象（要联合用药）；精神症状（用氯丙嗪）。", "各类左旋多巴增效药：", "外周氨基酸脱羧酶（AADC）抑制剂-卡比多巴", "单胺氧化酶B（MAO-B）抑制药-司来吉兰，雷沙吉兰", "儿茶酚氧位甲基转移酶（COMT）抑制药-托卡朋，硝替卡朋，恩他卡朋。"]}, {"type": "p", "text": "==15.====利尿药=="}, {"type": "list", "items": ["高效利尿药：主要用于髓袢升支粗段髓质部和皮质部，如呋塞米、步美他尼、伊他尼酸。机制：抑制Na-K-2CL共同转运系统。", "中效利尿药：主要用于髓袢升支粗段髓质部（远曲小管开始部位），如噻嗪类、氯噻酮等。机制：抑制Na-K-2CL共同转运系统。", "低效利尿药：主要作用于远曲小管和集合管，如螺内酯、氨苯蝶啶、阿米洛利等。机制：螺内酯竞争性拮抗醛固酮受体；氨苯喋啶、阿米洛利阻滞Na通道，抑制NaCl再吸收。", "作用于近曲小管的利尿药，如乙酰唑胺等。机制：影响细胞内H+的形成从而影响H-Na交换。"]}, {"type": "p", "text": "==16.====抗心律失常药=="}, {"type": "list", "items": ["钠通道阻滞药：奎尼丁、利多卡因、氟卡尼", "β肾上腺素受体拮抗药：普萘洛尔", "延长动作电位时程药：胺碘酮", "钙通道阻滞药：维拉帕米", "用药原则", "如在抗心律失常治疗中应用某一药物尚有疗效，则应尽量避免联合用药；抗抑郁药、抗癫痫药、抗心律失常药、需尽量单一用药", "避免同时应用同一类药物", "避免同时应用作用或副作用相似的药物", "联合用药时应减少各药的剂量", "各种心律失常的选药原则：室上性快速心律失常首选β受体阻断剂、维拉帕米、地尔硫卓；房性心动过速、房扑和房颤也可选用上述三药。"]}];</script>
<script>
(function () {
  if (WB.mountChrome) WB.mountChrome('materials');

  var body = document.getElementById('body');
  if (body) body.innerHTML = WB.renderBlocks(window.__DOC_BLOCKS || []);
  if (WB.fx && WB.fx.init) WB.fx.init();

  var base = (window.CDN_BASE || '').replace(/\/+$/, '');
  var prefix = window.CDN_PREFIX || '';
  var dl = document.getElementById('dgDl');
  if (base && /^https?:/.test(base) && dl && dl.getAttribute('data-key')) {
    dl.href = base + '/' + prefix + dl.getAttribute('data-key').split('/').map(encodeURIComponent).join('/');
  } else if (dl) {
    dl.style.display = 'none';
  }

  // 阅读 / 练习 切换
  var tabs = [].slice.call(document.querySelectorAll('.doc-tabs button'));
  tabs.forEach(function (b) {
    b.addEventListener('click', function () {
      var p = b.getAttribute('data-pane');
      tabs.forEach(function (x) { x.classList.toggle('on', x === b); });
      var r = document.getElementById('paneRead');
      var q = document.getElementById('paneQuiz');
      if (r) r.classList.toggle('hide', p !== 'read');
      if (q) q.classList.toggle('hide', p !== 'quiz');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });

  var links = [].slice.call(document.querySelectorAll('.toc a[href^="#"]'));
  if (!links.length) return;
  var heads = links.map(function (a) { return document.getElementById(a.getAttribute('href').slice(1)); });
  var tocBox = document.getElementById('docToc');
  var prog = document.getElementById('tocProg');
  var lastIdx = -1;

  function paint() {
    var top = window.scrollY + 120, idx = 0;
    heads.forEach(function (h, i) { if (h && h.offsetTop <= top) idx = i; });
    links.forEach(function (a, i) { a.classList.toggle('on', i === idx); });

    /* 当前项跟随：目录本身可滚动时，把它带到可视区中部 */
    if (idx !== lastIdx && tocBox && tocBox.scrollHeight > tocBox.clientHeight + 4) {
      var a = links[idx];
      if (a) {
        var r = a.getBoundingClientRect(), br = tocBox.getBoundingClientRect();
        if (r.top < br.top + 8 || r.bottom > br.bottom - 8) {
          tocBox.scrollTop += (r.top - br.top) - tocBox.clientHeight / 2 + r.height / 2;
        }
      }
    }
    lastIdx = idx;

    /* 全文阅读进度 */
    if (prog) {
      var max = document.documentElement.scrollHeight - window.innerHeight;
      prog.style.width = (max > 0 ? Math.min(1, window.scrollY / max) * 100 : 0) + '%';
    }
  }

  /* 移动端目录折叠 */
  var tg = document.getElementById('tocToggle');
  if (tg && tocBox) {
    tg.addEventListener('click', function () {
      var open = tocBox.classList.toggle('open');
      tg.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    tocBox.addEventListener('click', function (e) {
      if (e.target.closest('a') && window.innerWidth <= 900) {
        tocBox.classList.remove('open');
        tg.setAttribute('aria-expanded', 'false');
      }
    });
  }

  window.addEventListener('scroll', paint, { passive: true });
  window.addEventListener('resize', paint, { passive: true });
  paint();
})();

/* ---------- 章节入场 ---------- */
(function () {
  var hs = [].slice.call(document.querySelectorAll('.article h3'));
  if (!hs.length) return;
  if (!('IntersectionObserver' in window)) {
    hs.forEach(function (h) { h.classList.add('in'); });
    return;
  }
  var io = new IntersectionObserver(function (es) {
    es.forEach(function (e) {
      if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
    });
  }, { rootMargin: '0px 0px -8% 0px' });
  hs.forEach(function (h) { io.observe(h); });
  setTimeout(function () { hs.forEach(function (h) { h.classList.add('in'); }); }, 2500);
})();

/* ---------- 记住阅读位置 ---------- */
(function () {
  if (!document.getElementById('body')) return;
  var KEY = 'medilearn.docpos:' + location.pathname;
  var timer = 0;
  window.addEventListener('scroll', function () {
    if (timer) return;
    timer = setTimeout(function () {
      timer = 0;
      try { localStorage.setItem(KEY, String(Math.round(window.scrollY))); } catch (e) {}
    }, 600);
  }, { passive: true });

  var y = 0;
  try { y = parseInt(localStorage.getItem(KEY) || '0', 10) || 0; } catch (e) {}
  if (y < 600) return;
  setTimeout(function () {
    window.scrollTo(0, y);
    var t = document.createElement('div');
    t.textContent = '已回到上次阅读位置';
    t.style.cssText = 'position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:9600;' +
      'background:var(--text);color:var(--surface);font:500 13px/1 var(--font-sans,sans-serif);' +
      'padding:9px 16px;border-radius:999px;box-shadow:0 10px 30px rgba(15,23,42,.22);' +
      'opacity:0;transition:opacity .3s;pointer-events:none';
    document.body.appendChild(t);
    requestAnimationFrame(function () { t.style.opacity = '1'; });
    setTimeout(function () {
      t.style.opacity = '0';
      setTimeout(function () { t.remove(); }, 400);
    }, 1900);
  }, 80);
})();
</script>
