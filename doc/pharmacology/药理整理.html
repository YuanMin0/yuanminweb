<script>window.__DOC_BLOCKS = [{"type": "p", "text": "==2022级临床专业药理学整理=="}, {"type": "p", "text": "==一．肾上腺素受体激动及阻断药=="}, {"type": "p", "text": "肾上腺素激动α1受体引起血管收缩，也可以激动β2引起血管舒张。（所以使用氯丙嗪禁止使用肾上腺素升压）"}, {"type": "p", "text": "去甲肾上腺素较弱激动心脏β1受体，升高血压。(冷盐水稀释口服用于局部止血)"}, {"type": "p", "text": "小剂量去甲肾上腺素较弱激动心脏β1受体，心率由于血压升高反射性减弱。（大剂量收缩压舒张压明显增加，但是总脉压下降）"}, {"type": "p", "text": "去甲肾上腺素仅限于早期神经源性休克，肾上腺素过敏性休克，异丙肾上腺素用于感染性休克，多巴胺用于各种休克（去甲肾上腺素外漏会导致局部坏死，且大剂量注射会导致急性肾功能衰竭,皮下浸润注射酚妥拉明可缓解）"}, {"type": "p", "text": "α受体-瞳孔扩张，糖原分解；β₁受体介导心率↑ ；β₂受体介导支扩；β₃受体介导脂肪分解"}, {"type": "p", "text": "眼底检查：阿托品，后阿托品，托吡卡胺，去氧肾上腺素"}, {"type": "p", "text": "肾上腺素的典型血压改变多为双相反应，即给药后迅速出现明显升压作用，而后出现微弱降压反应，后者持续作用时间较长。"}, {"type": "p", "text": "房室传导阻滞：阿托品，异丙肾上腺素"}, {"type": "p", "text": "多巴胺小剂量肾血管舒张（D1受体），大剂量肾血管收缩（α1），激动α，β1，DA受体"}, {"type": "p", "text": "肾上腺素与局麻药配伍，延缓局麻药吸收，延长麻醉时间"}, {"type": "p", "text": "麻黄碱用于预防支气管哮喘发作和轻症治疗，对于重症急性发作疗效较差（急性选用异丙肾上腺素）。"}, {"type": "p", "text": "麻黄碱，口服容易快速产生耐药性，且性质稳定，促进α，β受体，促进肾上腺素能神经末梢释放去甲肾上腺素。"}, {"type": "p", "text": "异丙肾上腺素（非选择性β受体激动剂）舒张血管，舒张支气管（治疗哮喘常见不良反应是心动过速），增加组织耗氧量（使血压收缩压上升，舒张压下降，脉压增大）"}, {"type": "p", "text": "特布他林（间羟叔丁肾上腺素），选择性激动β2，主要用于支气管哮喘治疗。"}, {"type": "p", "text": "非选择性α受体阻断药,短效类：酚妥拉明（会使血压下降，继而引发反射性心动过速），妥拉唑林;长效类：酚苄明;选择性α₁受体阻断药：哌唑嗪;选择性α₂受体阻断药：育亨宾"}, {"type": "p", "text": "β受体阻断剂：A.降心率，降心肌收缩力，所以心肌耗氧量也下降；B.收缩支气管平滑肌，增加呼吸道阻力；C.抑制机体糖原和脂肪的分解；D.抑制肾素的释放；E.降低眼内压。"}, {"type": "p", "text": "非选择性β阻滞剂：普萘洛尔（个体差异大）（减缓用胰岛素后血糖恢复）（治疗甲亢）（抑制心肌收缩力，减慢心率）、纳多洛尔、噻吗洛尔（减少房水形成治疗原发性开角型青光眼）、卡替洛尔、吲哚洛尔（有内在拟交感活性）"}, {"type": "p", "text": "选择性β1阻滞剂：美托洛尔、艾司"}, {"type": "p", "text": "拉贝洛尔（有内在拟交感活性）能阻断α1，β1，β2。"}, {"type": "p", "text": "高血压合并糖尿病首选ACEI，***普利；高血压合并心动过速首选***洛尔。"}, {"type": "p", "text": "突触前膜："}, {"type": "p", "text": "M1，负反馈，抑制Ach释放"}, {"type": "p", "text": "α2，负反馈，抑制NE释放"}, {"type": "p", "text": "β2，正反馈，促进NE释放"}, {"type": "h", "level": 3, "id": "s1", "text": "血液及造血系统"}, {"type": "p", "text": "肝素（口服不易吸收，常见不良反应：出血）应用过量可注射鱼精蛋白使其与肝素结合失活。"}, {"type": "p", "text": "肝素与双香豆素（注射过量用维生素K缓解）（与广谱抗生素合用效果增强）均可用于血栓栓塞性疾病"}, {"type": "p", "text": "肝素——抗凝作用主要依赖抗凝血酶Ⅲ（AT-Ⅲ是）凝血酶及因子Ⅻa、Ⅺa、Ⅸa、Ⅹa等含丝氨酸残基蛋白酶的抑制剂"}, {"type": "p", "text": "确定抗凝效果检测："}, {"type": "p", "text": "肝素：凝血时间或部分凝血活酶时间"}, {"type": "p", "text": "低分子量肝素：测定血浆凝血因子Xa活性"}, {"type": "p", "text": "华法林（双香豆素）：凝血酶原时间"}, {"type": "p", "text": "利多格雷为强大的TXA₂合酶抑制药并具中度的TXA₂受体拮抗作用，临床报道其对血小板血栓和冠状动脉血栓的作用比水蛭素及阿司匹林更有效”"}, {"type": "p", "text": "噻氯匹定，阿司匹林，抑制血小板聚集"}, {"type": "p", "text": "肝素过量使用与凝血因子缺失导致的出血，无法使用维生素K解决。"}, {"type": "p", "text": "静注氨甲苯酸能使抑制纤维蛋白的溶解，控制出血。肌注维生素B₁₂（其缺乏会影响叶酸的循环使用）主要用于治疗恶性贫血（主要治病因素是内因子缺乏）"}, {"type": "p", "text": "长期使用乙胺嘧啶抑制二氢叶酸还原酶，使叶酸不能转变为四氢叶酸。"}, {"type": "p", "text": "10小分子右旋糖酐；40低分子右旋糖酐；70中分子右旋糖酐"}, {"type": "h", "level": 3, "id": "s2", "text": "中枢神经系统"}, {"type": "p", "text": "脑内胆碱能受体绝大部分是M1受体。"}, {"type": "p", "text": "GABAa（前体使谷氨酸）受体（苯二氮卓类增强其作用，抗焦虑，镇定）属于化学门控离子通道受体。"}, {"type": "p", "text": "黑质-纹状体通路功能减弱导致帕金森病"}, {"type": "p", "text": "精神分裂症（尤其是Ⅰ型）则是由于中脑-边缘通路和中脑-皮质通路的D₂样（D2，D3，D4）受体功能亢进所致。因此，目前临床治疗精神分裂症的药物大多是DA受体拮抗药。"}, {"type": "p", "text": "静脉注射地西泮后首先分布的部位是脑组织（抗焦虑作用的部位是大脑边缘系统）。"}, {"type": "p", "text": "苯二氮卓类（对快动眼睡眠时相影响较小）（中枢性肌肉松弛作用）（停药反应轻微）（药物中毒时使用氟马西尼特异性解救）。"}, {"type": "p", "text": "外周肌松药：筒箭毒碱，琥珀胆碱。"}, {"type": "p", "text": "不看书复习"}, {"type": "p", "text": "大发作和局限性发作，首选苯妥英钠；小发作（失神性发作）首选乙琥胺（可引起再生障碍性贫血）；大发作合并小发作首选丙戊酸钠；三叉神经痛首选卡马西平，广谱类抗癫痫药：马西平，丙戊酸钠，氯硝西泮；治疗癫痫持续状态，首选地西泮静脉注射；次选苯巴比妥静脉注射（肌阵挛性发作首选硝西泮）"}, {"type": "p", "text": "引起病人对巴比妥类药物成瘾的主要原因是：停药后快眼动睡眠时间延长，梦魇增多。"}, {"type": "p", "text": "苯巴比妥还可诱导肝微粒体UDP-葡糖醛酸基转移酶的合成，临床上用其增加机体对游离胆红素的结合转化反应，治疗新生儿黄疸（磺胺类药物加重黄疸，苯巴比妥减轻黄疸）"}, {"type": "p", "text": "苯妥英钠（长期使用牙龈增生）（膜稳定作用）有三抗，癫痫疼痛心失常"}, {"type": "p", "text": "治疗浓度的苯妥英钠能选择性阻滞L型和N型钙通道，但对哺乳动物丘脑神经元的T型Ca²⁺通道无阻滞作用，这可能是其治疗失神小发作无效的原因。"}, {"type": "p", "text": "硫酸镁抗惊厥竞争Ca受体（中毒时最早出现膝跳反射消失，静脉缓慢注射氯化钙解救）"}, {"type": "p", "text": "虽然课本上是讲小发作首选乙琥胺，但临床实际上首选的就是丙戊酸钠，医院里甚至根本不会使用乙琥胺。"}, {"type": "p", "text": "黑质纹状体系统内使左旋多巴转化为多巴胺酶的使氨基酸脱酶"}, {"type": "p", "text": "PD患者的黑质多巴胺神经能神经元退行性变，酪氨酸羟化酶同步减少，使脑内酪氨酸转化为L-DOPA极度减少，但将L-DOPA转化为多巴胺的能力仍存在。L-DOPA是多巴胺的前体，通过血脑屏障后，补充纹状体中多巴胺的不足而发挥治疗作用”。"}, {"type": "p", "text": "外周血:左旋多巴→氨基酸脱羧酶→多巴胺（95%）"}, {"type": "p", "text": "进入中枢:左旋多巴→多巴脱羧酶→多巴胺（1%）"}, {"type": "p", "text": "卡比多巴（维生素6与卡比多巴相反）→抑制外周左旋多巴转化→进入中枢"}, {"type": "p", "text": "卡比多巴+左旋多巴＝心宁美"}, {"type": "p", "text": "中枢乙酰胆碱多了就会导致肌肉震颤，所以东莨菪碱可以抗震颤麻痹，中枢多巴胺多了就会导致运动过多症（长期不良反应），所以左旋多巴不良反应有运动过度症。"}, {"type": "p", "text": "中枢多巴胺多乙酰胆碱少就是舞蹈样症状"}, {"type": "p", "text": "中枢多巴胺少乙酰胆碱多就是帕金森综合征：运动迟缓(多巴胺少)静止震颤(乙酰胆碱多)"}, {"type": "p", "text": "多巴胺受体激动剂：溴隐亭"}, {"type": "p", "text": "单胺氧化酶抑制剂：司来吉兰"}, {"type": "p", "text": "中枢胆碱受体阻断药：苯海索（有口干，尿潴留，便秘等副作用）"}, {"type": "p", "text": "金刚烷胺（Amantadine）"}, {"type": "p", "text": "氯丙嗪：顽固性呃逆（对前庭原因引起的呃逆—晕动症无效）；小剂量镇吐（延髓化学催吐化学感觉区），治疗精神分裂症（阻断中脑相关多巴胺受体D1，D2）（口服吸收少）（增加催乳素产生-拮抗结节漏斗系统的D2受体）（锥体外系反应拮抗黑质-纹状体D2受体）（禁用于癫痫）"}, {"type": "p", "text": "异丙嗪：抗组胺药，也用于镇吐，抗晕动（无膈神经抑制作用）"}, {"type": "p", "text": "精神病因是中枢多巴胺亢进引起的疾病"}, {"type": "p", "text": "氯丙嗪能使体温降到正常或者正常以下，阿司匹林只能降到正常不能降到正常以下"}, {"type": "p", "text": "冬眠合剂：氯丙嗪+异丙嗪+哌替啶"}, {"type": "p", "text": "奋乃静、氟奋乃静、三氟拉嗪，对锥体外系反应的作用均强，氯丙嗪（吩噻嗪类药物降压作用最强）次之，硫利达嗪对锥体外系反应作用最弱。"}, {"type": "p", "text": "常用于治疗以兴奋躁动、幻觉、妄想为主的精神分裂症的药物是氟哌啶醇。"}, {"type": "p", "text": "三氟拉嗪和氟奋乃静主要用于精神分裂症偏执型和慢性精神分裂症。"}, {"type": "p", "text": "硫利达嗪抗幻觉妄想作用弱。"}, {"type": "p", "text": "氯普噻吨适用于带有强迫状态或焦虑抑郁情绪的精神分裂症、焦虑性神经官能症以及更年期抑郁症患者。"}, {"type": "p", "text": "舒比利：治疗情绪低落，抑郁，顽固性恶心呕吐，对紧张型精神分裂症疗效好。"}, {"type": "p", "text": "非典型抗精神分裂症药…代表药包括氯氮平、奥氮平、喹硫平、利培酮（三平一酮）。"}, {"type": "p", "text": "锂盐治疗剂量（使突触间隙NA浓度下降）对正常人精神活动无影响，抗躁狂作用显著，也有一定的抗抑郁作用。但是易中毒，不良反应多，安全范围窄。"}, {"type": "p", "text": "抑制5-HT再摄取的药物通过增加突触间隙的5-HT而发挥抗抑郁作用，是抗抑郁药物。"}, {"type": "p", "text": "丙咪嗪（米帕明），对心肌有奎尼丁样作用（最严重的副作用），阿托品样作用（最常见副作用），治疗各种抑郁症，对内源性抑郁症，更年期抑郁症效果更好。"}, {"type": "p", "text": "属于选择性5-羟色胺再摄取抑制剂的是氟西汀、帕罗西汀、舍曲林、氟伏沙明、西酞普兰和艾司西酞普兰。"}, {"type": "h", "level": 3, "id": "s3", "text": "非甾体抗炎药"}, {"type": "p", "text": "阿片受体激动药包括阿片生物碱类镇痛药和人工合成类镇痛药，前者包括吗啡和可待因，后者包括哌替啶、美沙酮、芬太尼等。"}, {"type": "p", "text": "吗啡受过消除明显，生物利用度小（成瘾性高，不用于临床麻醉前给药）（镇痛主要部位丘脑内侧，脑室及导水管周围灰质）（镇痛可持续4-6小时）（镇痛镇静镇咳，致欣快，抑制呼吸并缩瞳）（镇咳-延髓孤束核受体）（欣快作用-蓝斑核）（急性心源性哮喘，肺部疾病一律不用）。"}, {"type": "p", "text": "哌替啶长时间使用会引起抽搐，肌肉震颤，惊厥，故不用于长时间镇痛（治疗心源性哮喘）。"}, {"type": "p", "text": "纳洛酮用于解救吗啡急性中毒（对吗啡成瘾者可迅速诱发戒断症状）（阿片受体拮抗剂：纳洛酮，纳曲酮）（对各型阿片受体均有竞争性拮抗作用，用于阿片类药物急性中毒）。"}, {"type": "p", "text": "芬太尼镇痛作用为吗啡的100倍，美沙酮镇痛强度与吗啡相当，但持续时间长。"}, {"type": "p", "text": "喷他佐辛成瘾性小，未列入麻醉管理（镇痛效果个体差异大）；美沙酮脱毒治疗；芬太尼+氟哌利多 神经阻滞麻醉。"}, {"type": "p", "text": "阿扑吗啡用于治疗酒精依赖。"}, {"type": "p", "text": "NASIDS主要通过抑制下丘脑PG的生成而发挥解热作用(解热是全身性的，所以中枢解热；镇痛是局部的所以外周镇痛)。"}, {"type": "p", "text": "其药理机制与抑制体内环氧化酶（COX）活性而减少局部组织前列腺素（PG）的生物合成有关，胃肠功能紊乱是最常见的应用NSAIDs的不良反应，其原因主要是COX-1的阻断，而经COX-1生成的PG对于抑制胃酸分泌，保护胃粘膜有重要的作用。"}, {"type": "p", "text": "阿司匹林：迅速被胃黏膜，血浆，红细胞中的酯酶水解为水杨酸。（抗炎抗风湿，解热镇痛，小剂量抑制血小板，大剂量促进血小板合成）（过量中毒使用碳酸氢钠加速肾脏排泄）"}, {"type": "p", "text": "阿司匹林副作用：胃肠道反应，凝血障碍，水杨酸反应，过敏反应，瑞夷综合征。（水钠潴留是布洛芬的不良反应）"}, {"type": "p", "text": "阿司匹林抑制环加氧酶，减少血栓素生成，抗血小板聚集及血栓形成。"}, {"type": "p", "text": "对乙酰氨基酚，解热镇痛首选，抗炎作用极弱。"}, {"type": "p", "text": "非那西汀的体内代谢产物对乙酰氨基酚在体内氧化为对乙酰苯醌亚胺，它为有毒的代谢中间体，会引起肝细胞、肾小管细胞坏死。"}, {"type": "p", "text": "塞来昔布是选择性环氧酶-2抑制剂"}, {"type": "p", "text": "消炎痛又名吲哚美辛，不良反应多，具有强大的镇痛解热作用，常用于不易控制的发热。（对胃十二指肠粘膜损害最严重的药物）"}, {"type": "p", "text": "保泰松具有很强的抗炎，抗风湿作用，而解热作用相对较弱。（解热镇痛作用弱，抗炎抗风湿作用强，毒性大）"}, {"type": "p", "text": "吡罗昔康主要治疗风湿性及类风湿关节炎和急性痛风。别嘌醇适用于慢性痛风，阿司匹林和保泰松、非那西汀都能治疗风湿性、类风湿性关节炎，不用于治疗急性痛风。"}, {"type": "p", "text": "秋水仙碱治疗痛风的机制是选择性消炎作用。"}, {"type": "p", "text": "非甾体抗炎药可引起微小病变型肾病。"}, {"type": "p", "text": "非那西汀代谢终产物有毒性。"}, {"type": "h", "level": 3, "id": "s4", "text": "心血管系统"}, {"type": "p", "text": "早后除极常发生在完全复极之前，而迟后除极发生在动作电位完全或接近完全复极时。早后除极所触发的心律失常以尖端扭转型室性心动过速常见（奎尼丁可导致）。早后除极由于动作电位时程过度延长引起的（胞外低钾），迟后除极由于细胞内钙超载引起的（强心苷中毒）。"}, {"type": "p", "text": "Ⅰa类（适度阻滞钠通道）——代表药物是奎尼丁（抗胆碱，阻断α受体，扩张血管，降低血压，减弱心肌收缩力）（用于心律失常经复律后，维持窦性心律）、普鲁卡因胺（引起红斑狼疮样综合症）。（适度抑制0相上升最大速率，适度抑制传导，APD动作电位时程延长）"}, {"type": "p", "text": "Ⅰb类(轻度阻滞钠通道)——代表药是利多卡因（缩短ERP，其余药延长）、苯妥英钠等。"}, {"type": "p", "text": "Ⅰc类（明显阻滞钠通道）——代表药是普罗帕酮、氟卡尼。"}, {"type": "p", "text": "Ⅲ类药物延长APD，阻滞多种钾通道（胺碘酮【角膜微型沉积】【两延四阻：3相钾离子外流】）。"}, {"type": "p", "text": "心房纤颤首选地高辛，其次选择维拉帕米（便秘）（钙离子通道阻滞药）"}, {"type": "p", "text": "奎尼丁不良反应有金鸡纳反应。"}, {"type": "p", "text": "利多卡因的首过消除很强，必须静脉给药。"}, {"type": "p", "text": "维拉帕米，氯丙嗪，丙咪嗪，普萘洛尔，硝酸甘油，吗啡（首过消除明显）。"}, {"type": "p", "text": "首选药物：窦性心动过速：普萘洛尔（β肾上腺素受体阻断药，治疗量缩短APD,ERP大剂量膜稳定，延长APD,ERP）;室上性心律失常：维拉帕米;室性心律失常：利多卡因（对房颤无效）（心室，浦肯野纤维）;强心苷中毒导致的室性心律失常：苯妥英钠；房颤：地高辛；广谱：普罗帕酮，胺碘酮（特别适用于器质性心脏病的心律失常）。"}, {"type": "p", "text": "保钾利尿药为低效能利尿药。主要作用于远曲小管远端和集合管，拮抗醛固酮受体或抑制Na⁺通道，利尿作用弱，减少K⁺排出，如螺内酯（竞争醛固酮受体）、氨苯蝶啶（直接抑制Na-K）等"}, {"type": "p", "text": "袢利尿剂，本类药物主要作用部位在髓袢升支粗段，选择性地抑制Na⁺-K⁺-2Cl⁻转运子。是目前最强效的利尿药。常用药物有呋塞米（速尿，增加肾血流，抑制浓缩和稀释过程）（长期大量使用引起胃肠出血）、依他尼酸（利尿酸）和布美他尼。"}, {"type": "p", "text": "噻嗪类及类噻嗪类利尿药为中效能利尿药，主要作用于远曲小管近端，抑制Na⁺-Cl⁻同向转运子，如氢氯噻嗪。（缩血管，降低血流量，诱发肾衰，抑制稀释）（短期利尿，长期扩张外周血管产生降压作用）"}, {"type": "p", "text": "碳酸酐酶抑制药作用于近曲小管，抑制碳酸酐酶的活性，代表药为乙酰唑胺。"}, {"type": "p", "text": "脑水肿首选甘露醇，急性肺水肿首选呋塞米。"}, {"type": "p", "text": "甘露醇，多巴胺吗，呋塞米增加肾血流。"}, {"type": "p", "text": "治疗尿崩症：垂体后叶素，卡马西平，格列本脲，氯磺丙脲，氢氯噻嗪（抑制胰岛素分泌）。"}, {"type": "p", "text": "高血压患者服用吲达帕胺和氨氯地平。"}, {"type": "p", "text": "保钾利尿药长期应用对心脏不好，螺内酯可引起性激素样副作用。"}, {"type": "p", "text": "急性高山病：乙酰唑胺（减少房水生成，降低眼内压，无耳毒性）。"}, {"type": "p", "text": "根据各种药物的作用和作用部位，可将抗高血压药物分为下列几类：1.利尿药如氢氯噻嗪等。2.交感神经抑制药：①中枢性降压药：如可乐定（中枢α2受体激动剂）（副作用有抑郁症）等。②神经节阻断药：如樟磺咪芬等。③去甲肾上腺素能神经末梢阻断药：如利血平等。④β受体阻断药：如普萘洛尔（抑制肾素释放）等。3.肾素血管紧张素系统抑制药：①血管紧张素转化酶（ACE）抑制药：如卡托普利等。②血管紧张素1型受体（AT₁）阻断药：如氯沙坦等。③肾素抑制药：如阿利吉仑（抑制肾素活性）。4.钙通道阻滞药（拉西地平，氨氯地平长效，尼莫地平中效，硝苯地平短效）。5.血管扩张药如肼屈嗪（扩张小动脉，易诱发心绞痛）和硝普钠（高血压危急病人，降低左室前后负荷，易导致低血压）哌唑嗪（阻断α1受体）（不良反应：体位低血压，最常见的是首剂效应）等。"}, {"type": "p", "text": "长期使用噻嗪类利尿药（氢氯噻嗪）注意补钾"}, {"type": "p", "text": "呋塞米：合并有氮质血症或尿毒症的高血压患者、高血压危象患者可选用高效利尿药。"}, {"type": "p", "text": "硝苯地平：适用于合并有心绞痛或肾脏疾病、糖尿病、哮喘、高脂血症及恶性高血压患者。"}, {"type": "p", "text": "普萘洛尔：适用于高血压伴心绞痛、偏头痛、焦虑症的患者。"}, {"type": "p", "text": "卡托普利：适用于合并有糖尿病及胰岛素抵抗、左心室肥厚、心力衰竭、急性心肌梗塞的高血压患者。（抑制循环与局部组织中的肾素-血管紧张素-醛固酮系统）"}, {"type": "p", "text": "普通处方用药一般不超过7日"}, {"type": "p", "text": "ACEI：抑制体循环即局部组织中血管紧张素Ⅰ（AngⅠ）向血管紧张素Ⅱ（AngⅡ）的转化。（卡托普利，治疗慢性心功能不全和逆转心肌肥厚）"}, {"type": "p", "text": "左心衰利尿（呋塞米降低左室前后负荷），右心衰强心。"}, {"type": "p", "text": "卡维地洛、比索洛尔和美托洛尔，目前已被推荐作为治疗慢性心力衰竭（选温和的药不用常规的药）的常规用药。"}, {"type": "p", "text": "强心苷治疗心衰的重要药理学基础是：增加衰竭心脏输出量的同时也不增加心肌耗氧量(强心苷与心肌细胞膜上的强心苷受体Na⁺-K⁺-ATP酶结合并抑制其活性)（减慢房室传导治疗心房纤颤）（先天性心脏病）"}, {"type": "p", "text": "长效：洋地黄毒苷（心力衰竭合并房颤是应用洋地黄类药物的最佳指征，西地兰），脂溶性高，口服吸收好。"}, {"type": "p", "text": "中效：地高辛（口服生物利用度个体差异大）（缩短心房ERP，延长房室结ERP）（与奎尼丁合用提高地高辛血药浓度）（中毒先兆：室早，窦缓降低至60次/分钟，色视）。"}, {"type": "p", "text": "短效：毒毛花苷K和毛花苷丙，口服不吸收，需静脉注射给药。"}, {"type": "p", "text": "阿托品治疗强心苷中毒引起的窦性心律过缓。"}, {"type": "p", "text": "室性心动过速，房室传导阻滞等心脏反应是强心苷最严重、最危险的不良反应；头痛为中枢神经系统反应；胃肠道反应是强心苷类药物最常见的早期中毒症状。"}, {"type": "p", "text": "血管扩张药（肼屈嗪-扩张小动脉）（硝酸甘油-扩张静脉）治疗心衰是基于减轻心脏前后负荷。"}, {"type": "p", "text": "他汀类药物主要对LDL-C（低密度脂蛋白）的降低作用最强，TC（胆固醇）次之（他汀类又称HMG-COA还原酶抑制。HMG-COA还原酶是肝细胞合成胆固醇过程中的限速酶，催化HMG-COA生成甲羟戊酸（MVA），MAV生成是内源性胆固醇合成的关键步骤）（会导致横纹肌溶解）（氟伐他汀抗血小板聚集，改善胰岛素抵抗作用）。"}, {"type": "p", "text": "TC-总胆固醇；TG-甘油三酯。"}, {"type": "p", "text": "贝特类药物（高TG血症，Ⅲ型高脂蛋白血症）（激活LPL，降低TG，VLDL，升高HDL-C）"}, {"type": "p", "text": "烟酸类（广谱调血脂药）（除Ⅰ型以外各型原发性高脂蛋白血症）降低甘油三酯为主。"}, {"type": "p", "text": "普罗布考对低密度脂蛋白的作用不大（降血脂及抗氧化作用）。"}, {"type": "p", "text": "依折麦布为新型胆固醇吸收抑制药，多与他汀类药物合用。"}, {"type": "p", "text": "考来烯胺，与胆汁酸结合阻碍其肠肝循环，降低TC,LDL-C（Ⅱa/b型高脂蛋白血症，家族性杂合子高脂蛋白血症）。"}, {"type": "p", "text": "硝酸甘油 扩张静脉血管→回心血量↓→心脏前负荷↓→心脏容积（内压力）↓→心室壁张力↓"}, {"type": "p", "text": "硝酸甘油不良反应：大剂量的硝酸甘油可以可以把二价铁转化成三价铁即高铁血红蛋白 导致发绀；水肿，头疼，头颈部皮肤潮红。"}, {"type": "p", "text": "β肾上腺素受体阻断药对硝酸酯类不敏感或疗效差的稳定型心绞痛，尤其适用于伴有心律失常及高血压的心绞痛患者。对冠状动脉痉挛诱发的变异型心绞痛不宜应用。"}, {"type": "p", "text": "钙通道抑制剂适用于变异性心绞痛，贝塔受体阻断剂用于稳定型心绞痛。"}, {"type": "p", "text": "普萘洛尔与硝酸酯类合用治疗协同降低心肌耗氧量治疗心绞痛。"}];</script>
<script>
(function () {
  if (WB.mountChrome) WB.mountChrome('materials');

  var body = document.getElementById('body');
  if (body) body.innerHTML = WB.renderBlocks(window.__DOC_BLOCKS || []);
  if (WB.fx && WB.fx.init) WB.fx.init();

  var base = (window.CDN_BASE || '').replace(/\/+$/, '');
  var prefix = window.CDN_PREFIX || '';
  var dl = document.getElementById('dgDl');
  if (base && /^https?:/.test(base) && dl && dl.getAttribute('data-key')) {
    dl.href = base + '/' + prefix + dl.getAttribute('data-key').split('/').map(encodeURIComponent).join('/');
  } else if (dl) {
    dl.style.display = 'none';
  }

  // 阅读 / 练习 切换
  var tabs = [].slice.call(document.querySelectorAll('.doc-tabs button'));
  tabs.forEach(function (b) {
    b.addEventListener('click', function () {
      var p = b.getAttribute('data-pane');
      tabs.forEach(function (x) { x.classList.toggle('on', x === b); });
      var r = document.getElementById('paneRead');
      var q = document.getElementById('paneQuiz');
      if (r) r.classList.toggle('hide', p !== 'read');
      if (q) q.classList.toggle('hide', p !== 'quiz');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });

  var links = [].slice.call(document.querySelectorAll('.toc a[href^="#"]'));
  if (!links.length) return;
  var heads = links.map(function (a) { return document.getElementById(a.getAttribute('href').slice(1)); });
  var tocBox = document.getElementById('docToc');
  var prog = document.getElementById('tocProg');
  var lastIdx = -1;

  function paint() {
    var top = window.scrollY + 120, idx = 0;
    heads.forEach(function (h, i) { if (h && h.offsetTop <= top) idx = i; });
    links.forEach(function (a, i) { a.classList.toggle('on', i === idx); });

    /* 当前项跟随：目录本身可滚动时，把它带到可视区中部 */
    if (idx !== lastIdx && tocBox && tocBox.scrollHeight > tocBox.clientHeight + 4) {
      var a = links[idx];
      if (a) {
        var r = a.getBoundingClientRect(), br = tocBox.getBoundingClientRect();
        if (r.top < br.top + 8 || r.bottom > br.bottom - 8) {
          tocBox.scrollTop += (r.top - br.top) - tocBox.clientHeight / 2 + r.height / 2;
        }
      }
    }
    lastIdx = idx;

    /* 全文阅读进度 */
    if (prog) {
      var max = document.documentElement.scrollHeight - window.innerHeight;
      prog.style.width = (max > 0 ? Math.min(1, window.scrollY / max) * 100 : 0) + '%';
    }
  }

  /* 移动端目录折叠 */
  var tg = document.getElementById('tocToggle');
  if (tg && tocBox) {
    tg.addEventListener('click', function () {
      var open = tocBox.classList.toggle('open');
      tg.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    tocBox.addEventListener('click', function (e) {
      if (e.target.closest('a') && window.innerWidth <= 900) {
        tocBox.classList.remove('open');
        tg.setAttribute('aria-expanded', 'false');
      }
    });
  }

  window.addEventListener('scroll', paint, { passive: true });
  window.addEventListener('resize', paint, { passive: true });
  paint();
})();

/* ---------- 章节入场 ---------- */
(function () {
  var hs = [].slice.call(document.querySelectorAll('.article h3'));
  if (!hs.length) return;
  if (!('IntersectionObserver' in window)) {
    hs.forEach(function (h) { h.classList.add('in'); });
    return;
  }
  var io = new IntersectionObserver(function (es) {
    es.forEach(function (e) {
      if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
    });
  }, { rootMargin: '0px 0px -8% 0px' });
  hs.forEach(function (h) { io.observe(h); });
  setTimeout(function () { hs.forEach(function (h) { h.classList.add('in'); }); }, 2500);
})();

/* ---------- 记住阅读位置 ---------- */
(function () {
  if (!document.getElementById('body')) return;
  var KEY = 'medilearn.docpos:' + location.pathname;
  var timer = 0;
  window.addEventListener('scroll', function () {
    if (timer) return;
    timer = setTimeout(function () {
      timer = 0;
      try { localStorage.setItem(KEY, String(Math.round(window.scrollY))); } catch (e) {}
    }, 600);
  }, { passive: true });

  var y = 0;
  try { y = parseInt(localStorage.getItem(KEY) || '0', 10) || 0; } catch (e) {}
  if (y < 600) return;
  setTimeout(function () {
    window.scrollTo(0, y);
    var t = document.createElement('div');
    t.textContent = '已回到上次阅读位置';
    t.style.cssText = 'position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:9600;' +
      'background:var(--text);color:var(--surface);font:500 13px/1 var(--font-sans,sans-serif);' +
      'padding:9px 16px;border-radius:999px;box-shadow:0 10px 30px rgba(15,23,42,.22);' +
      'opacity:0;transition:opacity .3s;pointer-events:none';
    document.body.appendChild(t);
    requestAnimationFrame(function () { t.style.opacity = '1'; });
    setTimeout(function () {
      t.style.opacity = '0';
      setTimeout(function () { t.remove(); }, 400);
    }, 1900);
  }, 80);
})();
</script>
