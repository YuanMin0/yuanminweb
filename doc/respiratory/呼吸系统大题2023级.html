<script>window.__DOC_BLOCKS = [{"type": "p", "text": "一、慢性阻塞性肺疾病（COPD）+ COPD与支气管哮喘鉴别"}, {"type": "p", "text": "（一）COPD核心要点"}, {"type": "list", "items": ["定义：不完全可逆持续性气流受限，进行性加重，气道、肺组织慢性炎症。", "病因：首位长期吸烟；诱因：反复呼吸道感染；先天少见α1-抗胰蛋白酶缺乏。", "症状：慢性咳痰、进行性活动后呼吸困难（标志性症状）；晚期消瘦、乏力。", "体征：桶状胸、过清音、呼气延长、双肺呼吸音减低。", "金标准：肺功能，舒张后FEV₁/FVC＜70%；RV、TLC升高提示肺气肿。", "治疗", "稳定期：戒烟；支气管扩张剂为核心；重度频繁加重联用吸入激素；长期家庭低流量氧疗（1～2L/min）。", "急性加重：多为感染诱发；抗感染、短效支气管扩张剂、短期全身激素、低流量吸氧。", "并发症：慢性肺心病、Ⅱ型呼吸衰竭、自发性气胸、肺部感染。"]}, {"type": "p", "text": "（二）COPD与支气管哮喘鉴别"}, {"type": "list", "items": ["COPD：气道、肺组织存在永久性结构破坏，气流受限不完全可逆，持续性疾病，进行性加重。", "支气管哮喘：仅气道平滑肌痉挛、黏膜水肿，无永久肺结构损伤，气流受限完全可逆，发作性疾病。"]}, {"type": "p", "text": "临床表现："}, {"type": "p", "text": "COPD"}, {"type": "list", "items": ["常年存在慢性咳嗽、咳白色黏痰，冬春季节加重；", "标志性症状：进行性活动后气短，逐年加重，无完全无症状缓解期；", "喘息程度轻，活动后明显；", "晚期消瘦、桶状胸。"]}, {"type": "p", "text": "支气管哮喘"}, {"type": "list", "items": ["发作性胸闷、喘息、干咳，夜间/凌晨加重；", "缓解期可完全正常，无任何不适；", "接触诱因后突发发作，脱离诱因或用药后快速缓解；", "无长期咳痰，无桶状胸。"]}, {"type": "p", "text": "肺功能："}, {"type": "p", "text": "COPD"}, {"type": "list", "items": ["支气管舒张试验：阴性或弱阳性；", "吸入舒张剂后 FEV₁/FVC 仍＜70%；", "RV、TLC升高，提示肺气肿，肺功能无法恢复正常。"]}, {"type": "p", "text": "支气管哮喘"}, {"type": "list", "items": ["支气管舒张试验阳性：用药后FEV₁提升≥12%，且绝对值增加≥200ml；", "发作期通气障碍，缓解后肺功能指标完全恢复正常；", "无持续残气量升高。"]}, {"type": "p", "text": "治疗：COPD"}, {"type": "list", "items": ["基础一线药物：长效支气管扩张剂（长效抗胆碱药、长效β₂激动剂）；", "仅重度频繁急性加重患者联合吸入激素；", "首要干预手段：戒烟。"]}, {"type": "p", "text": "支气管哮喘"}, {"type": "list", "items": ["长期控制核心药物：吸入糖皮质激素；"]}, {"type": "p", "text": "​2. 急救按需使用短效β₂受体激动剂。"}, {"type": "p", "text": "二、支气管扩张"}, {"type": "list", "items": ["病因：幼年麻疹、肺炎、百日咳气道损伤；结核、先天发育异常。", "典型三联征：慢性咳嗽、大量脓痰、反复咯血。", "体征：病变固定部位持续湿啰音，病程久可见杵状指。", "确诊检查：胸部高分辨率CT（HRCT），可见支气管柱状/囊状扩张。", "治疗：体位引流排痰；抗感染控制急性感染；反复大出血可手术切除病灶。"]}, {"type": "p", "text": "三、肺炎分类"}, {"type": "list", "items": ["按获得场所", "CAP社区获得性肺炎：最常见致病菌肺炎链球菌；表现寒战高热、铁锈色痰。", "HAP医院获得性肺炎：多见革兰阴性菌（克雷伯、铜绿假单胞）、金葡菌。", "解剖分类：大叶性肺炎、小叶性肺炎、间质性肺炎。", "治疗核心：敏感抗生素抗感染；辅以氧疗、祛痰、退热等对症支持。"]}, {"type": "p", "text": "四、肺脓肿"}, {"type": "list", "items": ["分型及诱因", "吸入性肺脓肿：醉酒、麻醉、误吸；好发右肺；致病菌多厌氧菌，咳大量臭脓痰。", "血源性肺脓肿：皮肤感染、败血症，金葡菌多见，双肺多发病灶。", "典型影像：胸片见肺部空洞伴液平面。", "治疗：足量足疗程抗生素；痰液引流；内科无效、巨大空洞需手术。"]}, {"type": "p", "text": "五、肺结核（分型、诊断、治疗）"}, {"type": "list", "items": ["临床分型"]}, {"type": "p", "text": "原发性肺结核、血行播散性肺结核、继发性肺结核（成人最常见）、结核性胸膜炎、其他肺外结核。"}, {"type": "list", "items": ["诊断要点", "早期筛查首选：胸部X线；", "判断疗效、确诊金标准：痰结核分枝杆菌检查（痰菌转阴为治疗有效首要指标）。", "抗结核药物分类", "杀菌药：异烟肼、利福平、链霉素、吡嗪酰胺；", "抑菌药：乙胺丁醇。", "标准化治疗原则：早期、联合、适量、规律、全程。", "手术适应症：毁损肺、巨大结核球、久治不愈空洞、反复大咯血。"]}, {"type": "p", "text": "六、肺癌"}, {"type": "list", "items": ["临床表现"]}, {"type": "p", "text": "早期：刺激性干咳，痰中带血丝；"}, {"type": "p", "text": "局部晚期：胸痛、咯血、胸闷、呼吸困难、声音嘶哑、上腔静脉综合征；"}, {"type": "list", "items": ["肺外表现（副癌综合征）"]}, {"type": "p", "text": "杵状指、肥大性骨关节病、库欣综合征、抗利尿激素分泌异常、高钙血症，多见于小细胞肺癌。"}, {"type": "list", "items": ["病理分型特点", "鳞癌：中央型，向管腔内生长，易阻塞支气管，生长慢转移晚；", "腺癌：目前我国最常见，周围型，女性多见，早期易远处转移；", "小细胞肺癌：恶性程度最高，早期转移，易伴副癌综合征，放化疗敏感。", "治疗", "早期Ⅰ、Ⅱ期：首选外科手术（肺叶切除+系统淋巴结清扫）；", "局部晚期：放化疗联合；", "晚期：化疗、靶向、免疫治疗为主。"]}, {"type": "p", "text": "七、纵隔肿瘤（病因、表现、TNM分期）"}, {"type": "list", "items": ["分区好发肿瘤：前畸后神上胸腺", "前上纵隔：胸腺瘤；前纵隔：畸胎瘤；后纵隔脊柱旁：神经源性肿瘤（最常见后纵隔肿瘤）。", "临床表现：肿瘤压迫气管、食管、大血管，出现胸闷、气促、吞咽困难；胸腺瘤合并重症肌无力。临床表现看侵犯", "TNM分期：T原发肿瘤大小、N淋巴结转移、M远处转移，Ⅰ期无淋巴结转移可直接手术，N2淋巴结转移多不直接手术。"]}, {"type": "p", "text": "八、特发性肺纤维化（IPF）+ 间质性肺疾病"}, {"type": "p", "text": "（一）特发性肺纤维化IPF"}, {"type": "list", "items": ["典型影像HRCT：双下肺、胸膜下网格影、蜂窝肺、牵拉性支气管扩张。", "体征：双肺Velcro爆裂音、杵状指。", "肺功能：限制性通气障碍，TLC肺总量下降，弥散功能DLCO降低。", "治疗：无细菌感染无需常规抗生素；糖皮质激素、免疫抑制剂、抗氧化药物。"]}, {"type": "p", "text": "（二）间质性肺疾病临床分类"}, {"type": "list", "items": ["特发性间质性肺炎（IPF为主）；", "过敏性肺炎（养鸽/鸟类接触史，CD8淋巴细胞升高）；", "结节病；", "结缔组织病继发间质性肺病。"]}, {"type": "p", "text": "共同特点：进行性干咳、活动后气短、限制性通气障碍。"}, {"type": "p", "text": "九、肺栓塞PTE"}, {"type": "list", "items": ["形成机制：静脉血栓脱落，随血流堵塞肺动脉；", "三大高危因素：血液高凝、静脉血流淤滞、血管内皮损伤（术后长期卧床、肿瘤、妊娠、创伤）；", "典型临床表现三联征：呼吸困难、胸痛、咯血；重者休克、晕厥。", "治疗原则", "基础治疗：抗凝（肝素、低分子肝素、华法林，仅抑制血栓蔓延，不能溶血栓）；", "高危患者（低血压、休克、主干血栓）：溶栓治疗。"]}, {"type": "p", "text": "十、肺动脉高压"}, {"type": "list", "items": ["诊断依据：静息肺动脉平均压≥30mmHg为显性肺动脉高压；运动＞30mmHg隐性肺动脉高压；胸片特征残根征。", "症状：活动后呼吸困难（首发）、乏力、胸痛、晚期右心衰竭水肿。"]}, {"type": "p", "text": "肺动脉高压→右室负荷增加→右室肥厚、扩张→右心衰竭"}, {"type": "p", "text": "特发性肺动脉高压：排除所有继发因素后确诊；治疗：靶向肺血管扩张药物、对症抗心衰。"}, {"type": "p", "text": "肺心病："}, {"type": "p", "text": "病因："}, {"type": "list", "items": ["最常见病因：COPD（占80%～90%）", "其他气道肺疾病：支扩、重症肺结核、间质性肺病、肺纤维化", "胸廓疾病：脊柱侧弯、胸膜广泛增厚、胸廓成形术后", "肺血管疾病：特发性肺动脉高压、肺栓塞反复发作"]}, {"type": "p", "text": "并发症："}, {"type": "list", "items": ["肺性脑病：最严重、首要死因，CO₂潴留导致中枢神经症状；意识模糊、烦躁、昏迷、扑翼样震颤", "酸碱、电解质紊乱（呼酸最常见）；", "心律失常：房早、阵发性室上速；", "消化道出血、DIC、肾功能损伤。"]}, {"type": "p", "text": "胸腔积液：漏出液 vs 渗出液鉴别"}, {"type": "p", "text": "十二、气胸分型、胸部体征"}, {"type": "list", "items": ["分型", "闭合性气胸：破口自行闭合，抽气后胸腔维持负压；", "交通性气胸：破口持续开放，抽气后压力迅速归零；", "张力性气胸：单向活瓣，胸腔持续正压，危及生命。", "典型体征：患侧胸廓饱满、肋间隙增宽，气管向健侧移位，叩诊鼓音，听诊呼吸音消失。", "治疗核心：排气减压；重症气胸首选胸腔闭式引流。"]}, {"type": "p", "text": "十三、脓胸"}, {"type": "list", "items": ["三期病理生理"]}, {"type": "p", "text": "渗出期（急性）、纤维化脓期、机化期（慢性）。"}, {"type": "list", "items": ["急、慢性脓胸治疗", "急性脓胸：尽早胸腔闭式引流，排出脓液；急性期禁止开放引流，防止纵隔摆动休克；", "慢性脓胸：胸膜纤维板增厚束缚肺，首选胸膜纤维板剥脱术，恢复肺扩张。"]}, {"type": "p", "text": "十四、急性呼吸窘迫综合征ARDS"}, {"type": "list", "items": ["病因：重症肺炎、重症胰腺炎、创伤、感染、心肺手术；", "发病机制：肺泡弥漫损伤，肺泡塌陷，肺内分流增加，顽固性低氧；", "诊断标准：氧合指数PaO₂/FiO₂≤200mmHg，PCWP≤18mmHg排除心衰；", "机械通气原则：肺保护性通气，小潮气量、适度PEEP、控制吸气平台压＜35cmH₂O。"]}, {"type": "p", "text": "ARDS与心源性肺水肿鉴别"}, {"type": "list", "items": ["ARDS：无心脏病史，PCWP≤18mmHg，双肺弥漫均匀斑片影，利尿效果差；", "心源性肺水肿：心衰病史，PCWP＞18mmHg，肺门蝶形影，利尿、强心快速缓解。"]}, {"type": "p", "text": "十五、呼吸衰竭"}, {"type": "list", "items": ["分类", "Ⅰ型呼衰：PaO₂＜60mmHg，PaCO₂正常/降低，换气障碍（肺炎、ARDS、间肺病）；", "Ⅱ型呼衰：PaO₂＜60mmHg+PaCO₂＞50mmHg，通气不足（COPD、气道阻塞）。", "病因：气道阻塞、肺实质病变、胸廓胸膜疾病、呼吸肌/中枢病变。", "治疗原则：保持气道通畅、氧疗、改善通气、控制感染、纠正酸碱电解质紊乱。", "临床表现", "低氧血症：呼吸困难、发绀、心率快、烦躁、意识模糊；", "高碳酸血症：头痛、嗜睡、球结膜水肿、扑翼样震颤、昏迷。"]}, {"type": "p", "text": "Ⅱ型呼衰需持续低流量吸氧，高浓度吸氧抑制呼吸中枢加重CO₂潴留。"}, {"type": "p", "text": "十六、胸壁疾病"}, {"type": "p", "text": "一、胸壁结核"}, {"type": "list", "items": ["病因与感染途径", "多为继发性，原发灶多为肺结核、胸膜结核；", "三条侵入途径：", "淋巴道（最常见）；② 肺部/胸膜病灶直接蔓延；③ 血行播散（少见）；", "好发人群：青少年、免疫力低下、体弱人群。", "临床表现（核心考点）", "全身结核中毒症状轻微：低热、乏力、盗汗，重者才明显；", "局部特征寒性脓肿：肿块隆起、有波动感，无红、无热、无剧痛，区别普通化脓脓肿；", "脓肿破溃形成经久不愈窦道，流出稀薄干酪样脓液；", "侵犯肋骨/胸骨：局部隐痛，咳嗽、活动加重；脊柱结核流注可出现哑铃状脓肿。", "辅助检查"]}, {"type": "p", "text": "胸片/CT可见肋骨骨质破坏、胸壁软组织肿块，常伴肺内结核病灶；脓液普通细菌培养阴性，抗酸染色可查结核菌；病理见结核肉芽肿可确诊。"}, {"type": "list", "items": ["治疗", "基础：规范全身抗结核治疗，疗程12个月以上；", "单纯寒性脓肿：穿刺抽脓+腔内注抗结核药，加压包扎，禁止切开引流；", "骨质破坏、窦道、反复复发：手术完整切除病灶、窦道、坏死肋骨/胸骨。"]}, {"type": "p", "text": "二、胸壁肿瘤"}, {"type": "p", "text": "（一）分类"}, {"type": "list", "items": ["原发性：起源胸壁软组织、肋骨、胸骨；", "转移性：肺癌、乳腺癌、前列腺癌转移肋骨，多见。"]}, {"type": "p", "text": "（二）良性胸壁肿瘤（常考3种）"}, {"type": "list", "items": ["骨软骨瘤：肋骨最常见良性骨肿瘤，骨性突起、无症状、生长缓慢；", "软骨瘤：肋软骨交界处多发，质地硬、边界清；", "骨纤维瘤：软组织/肋骨来源，无侵袭性。"]}, {"type": "p", "text": "其他：脂肪瘤、神经纤维瘤、血管瘤。"}, {"type": "p", "text": "（三）恶性胸壁肿瘤（常考3种）"}, {"type": "list", "items": ["软骨肉瘤：胸壁原发恶性骨肿瘤最多见，易局部复发；", "骨肉瘤：恶性度极高，疼痛肿胀明显，早期转移；", "纤维肉瘤：软组织恶性肿瘤，生长快、侵袭周围组织。"]}, {"type": "p", "text": "其他：多发性骨髓瘤、各类转移癌。"}, {"type": "p", "text": "（四）临床表现"}, {"type": "list", "items": ["良性：生长缓慢、无痛、边界清晰、活动度可，无全身消耗；", "恶性：持续性局部疼痛、肿块短期内迅速增大、质地硬固定；晚期消瘦、贫血，易发生病理性骨折。"]}, {"type": "p", "text": "（五）治疗原则"}, {"type": "list", "items": ["原发性良、恶性肿瘤：首选完整手术切除；", "单发转移性胸壁肿瘤：全身条件允许可行手术缓解疼痛、控制病灶；多发转移以放化疗为主。"]}, {"type": "p", "text": "三、鉴别要点"}, {"type": "list", "items": ["胸壁结核：寒性脓肿、结核中毒症状、抗酸杆菌阳性；", "化脓性胸壁脓肿：红、肿、热、痛，脓液黏稠，普通细菌培养阳性；", "胸壁肿瘤：实性肿块无波动，病理活检区分良恶性。"]}];</script>
<script>

      var r = document.getElementById('paneRead');

    });
  });

  var links = [].slice.call(document.querySelectorAll('.toc a[href^="#"]'));
  if (!links.length) return;
  var heads = links.map(function (a) { return document.getElementById(a.getAttribute('href').slice(1)); });
  function paint() {
    var top = window.scrollY + 120, idx = 0;
    heads.forEach(function (h, i) { if (h && h.offsetTop <= top) idx = i; });
    links.forEach(function (a, i) { a.classList.toggle('on', i === idx); });
  }
  window.addEventListener('scroll', paint, { passive: true });
  paint();
})();

/* ---------- 阅读进度、回到顶部、章节入场 ---------- */
(function () {
  var bar = document.createElement('div'); bar.id = 'dgProg';
  var top = document.createElement('button'); top.id = 'dgTop';
  top.type = 'button'; top.setAttribute('aria-label', '回到顶部'); top.textContent = '↑';
  document.body.appendChild(bar); document.body.appendChild(top);

  var raf = 0;
  function paint() {
    raf = 0;
    var max = document.documentElement.scrollHeight - window.innerHeight;
    var y = window.scrollY || 0;
    bar.style.width = (max > 0 ? Math.min(1, y / max) * 100 : 0).toFixed(2) + '%';
    top.classList.toggle('on', y > 520);
  }
  window.addEventListener('scroll', function () {
    if (!raf) raf = requestAnimationFrame(paint);
  }, { passive: true });
  window.addEventListener('resize', paint, { passive: true });
  top.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });
  paint();

  var hs = [].slice.call(document.querySelectorAll('.article h3'));
  if (!('IntersectionObserver' in window) || !hs.length) {
    hs.forEach(function (h) { h.classList.add('in'); });
    return;
  }
  var io = new IntersectionObserver(function (es) {
    es.forEach(function (e) {
      if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
    });
  }, { rootMargin: '0px 0px -8% 0px' });
  hs.forEach(function (h) { io.observe(h); });
  setTimeout(function () { hs.forEach(function (h) { h.classList.add('in'); }); }, 2500);
})();

/* ---------- 记住阅读位置 ---------- */
(function () {
  if (!document.getElementById('body')) return;
  var KEY = 'medilearn.docpos:' + location.pathname;
  var timer = 0;
  window.addEventListener('scroll', function () {
    if (timer) return;
    timer = setTimeout(function () {
      timer = 0;
      try { localStorage.setItem(KEY, String(Math.round(window.scrollY))); } catch (e) {}
    }, 600);
  }, { passive: true });

  var y = 0;
  try { y = parseInt(localStorage.getItem(KEY) || '0', 10) || 0; } catch (e) {}
  if (y < 600) return;
  setTimeout(function () {
    window.scrollTo(0, y);
    var t = document.createElement('div');
    t.textContent = '已回到上次阅读位置';
    t.style.cssText = 'position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:9600;' +
      'background:var(--text);color:var(--surface);font:500 13px/1 var(--font-sans,sans-serif);' +
      'padding:9px 16px;border-radius:999px;box-shadow:0 10px 30px rgba(15,23,42,.22);' +
      'opacity:0;transition:opacity .3s;pointer-events:none';
    document.body.appendChild(t);
    requestAnimationFrame(function () { t.style.opacity = '1'; });
    setTimeout(function () {
      t.style.opacity = '0';
      setTimeout(function () { t.remove(); }, 400);
    }, 1900);
  }, 80);
})();
</script>
