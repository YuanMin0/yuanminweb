<script>window.__DOC_BLOCKS = [{"type": "p", "text": "选择"}, {"type": "p", "text": "多发伤初步处理后再次评估时应该注意什么 CRASH PLAN"}, {"type": "p", "text": "医学史：阿维森纳与希波克拉底、盖仑（“该安息”）并称西方传统医学三巨匠。阿维森纳《医典》是现代医学的重要基础之一。"}, {"type": "p", "text": "运动前的热身目的 "}, {"type": "p", "text": "提升肌肉韧带延展性防损伤；提高心肺适应力；激活神经肌肉协调性；促进循环减轻疲劳。"}, {"type": "p", "text": "医患沟通四大基本原则：诚信原则、简明原则、时效性和连续性原则、双向互动与反馈原则。"}, {"type": "p", "text": "周围神经损伤引起的疼痛，有哪些治疗方法 药物（抗炎、神经营养、镇痛）、物理治疗、康复训练、神经手术、中医针灸推拿。"}, {"type": "p", "text": "高渗性脱水：细胞内失水为主，口渴明显。"}, {"type": "p", "text": "低渗性脱水：细胞外失水为主，循环衰竭早，口渴不明显。"}, {"type": "p", "text": "等渗性脱水：细胞外液丢失，治疗静滴平衡盐溶液 / 等渗盐水扩容特别是有脉搏细速和血压下降等血容量不足表现者，需快速输注以恢复血容量。"}, {"type": "p", "text": "膳食调查通常采用的方法有哪些 称重法、记账法、24 小时回顾法、食物频率问卷法、化学分析法"}, {"type": "p", "text": "CO 中毒治疗"}, {"type": "p", "text": "最有效治疗：==氧疗==；重度中毒==24-48h 脑水肿达高峰==，需降颅压。神经保护治疗"}, {"type": "p", "text": "术后肺不张、肺炎的预防措施有哪些 术前戒烟 + 呼吸训练；术后翻身拍背、排痰、早期下床、雾化；合理镇痛、无菌操作"}, {"type": "p", "text": "需要禁食的情况有哪些 消化道梗阻 / 穿孔 / 出血、腹部手术前后、急性胰腺炎 / 胆囊炎、严重呕吐 / 意识障碍、检查前准备。"}, {"type": "p", "text": "破伤风：由破伤风杆菌外毒素引起的以横纹肌抽搐为特征的急性厌氧性感染。致病菌：破伤风杆菌；致病条件：伤口局部缺氧"}, {"type": "p", "text": "术后脑卒中的危险因素有哪些 高龄、高血压、糖尿病、房颤、动脉硬化；术中低血压 / 大出血 / 脱水；术后血栓、感染；既往卒中史。"}, {"type": "p", "text": "下列哪些属于后期复苏的措施 气管插管 / 机械通气、电除颤；建立静脉通路，用肾上腺素、胺碘酮；监测生命体征，防治脑水肿。"}, {"type": "p", "text": "一氧化碳对心脏的损害包括 心肌缺氧缺血、心律失常；心肌收缩力下降；诱发心绞痛、心梗、心衰"}, {"type": "p", "text": "心肺复苏，如何维持循环和呼吸，有哪些措施"}, {"type": "p", "text": "循环：胸外按压（100-120 次 / 分，深度 5-6cm）、建立通路、用药、电除颤"}, {"type": "p", "text": "呼吸：开放气道、人工呼吸（30:2）、气管插管、机械通气"}, {"type": "p", "text": "有机磷中毒的救治原则 清除毒物；阿托品 + 胆碱酯酶复能剂；维持呼吸循环；达阿托品化后维持剂量。"}, {"type": "p", "text": "临终患者的需求 生理：控痛、缓解不适；心理：减焦虑、获安全感；社会：家人陪伴、尊重意愿；精神：尊严离世。"}, {"type": "p", "text": "膳食调查通常采用的方法"}, {"type": "p", "text": "名解"}, {"type": "p", "text": "衰弱 Frailty：衰弱是指老年人生理储备下降导致机体易损性增加，抗应激能力减退的非特异性状态。"}, {"type": "p", "text": "休克 有效循环血量骤减，组织灌注不足，引发代谢障碍与细胞受损的综合征"}, {"type": "p", "text": "火器伤 火药、炸药发射 / 爆炸的投射物所致组织损伤。"}, {"type": "p", "text": "阿托品化指征：口干、皮肤干、肺部啰音减少或消失、瞳孔较前扩大、心率增快（90-100次/分）"}, {"type": "p", "text": "靶心率：运动治疗中允许达到的最高心率与适宜心率，是运动强度核心指标。"}, {"type": "p", "text": "死亡三联征 低体温、酸中毒、凝血功能障碍"}, {"type": "p", "text": "毒蕈碱样症状：即腺体分泌增多，表现为出汗、流泪、口吐白沫、出现肺水肿；平滑肌痉挛：恶心、呕吐、大小便失禁、瞳孔缩小。"}, {"type": "p", "text": "创伤 机械性外力造成的人体组织破坏与功能障碍"}, {"type": "p", "text": "多发伤 同一致伤因素致==2 ====个====及以上解剖部位==损伤，至少 1 处危及生命"}, {"type": "p", "text": "老年综合征MODSE 老年多器官功能不全综合征，器官老化和慢性疾病作为诱因导致老年人 2 个及以上器官序贯 / 同时功能不全。"}, {"type": "p", "text": "直立性低血压 卧位转立位时血压快速下降，出现头晕、黑朦。"}, {"type": "p", "text": "BMI 体重指数，体重 (kg)/ 身高 (m)²，评价营养与肥胖"}, {"type": "p", "text": "SIRS全身炎症反应综合征：感染或非感染诱因作用与机体，激活炎症细胞，产生大量炎性介质，引起失控的全身炎症反应。"}, {"type": "p", "text": "营养状况评价 膳食、体格、实验室检查综合评估机体营养状态"}, {"type": "p", "text": "阿托品中毒 过量用阿托品致中枢兴奋、瞳孔极度散大、高热、谵妄、昏迷。"}, {"type": "p", "text": "论述"}, {"type": "p", "text": "1论述老年多器官功能不全综合症的病因学特点和临床特征"}, {"type": "p", "text": "病因学特点：（器官老化+慢性疾病）"}, {"type": "p", "text": "1感染是MODSE的首要诱发因素，诱发MODSE的致病菌大多为革兰阴性菌或混合感染。"}, {"type": "p", "text": "2慢性病急性发作是MODSE的另一主要诱发因素，其中以心脑血管急症多见。"}, {"type": "p", "text": "3药物使用不当或药物毒副作用在MODSE的诱发因素中占相当比例，其中最常见的是选用抗生素不当诱发肾功能衰竭，或肠道菌群失调导致伪膜性肠炎而诱发MODSE。"}, {"type": "p", "text": "4营养不良消化道出血，食物中毒等亦可能是MODSE的诱发因素。"}, {"type": "p", "text": "临床特征："}, {"type": "p", "text": "常在器官功能受损基础上发生。"}, {"type": "p", "text": "感染和慢性病急性发作是常见诱因。"}, {"type": "p", "text": "器官衰竭顺序与原患慢性病相关。"}, {"type": "p", "text": "临床表现不典型延误诊治。"}, {"type": "p", "text": "病程迁延，反复发作。"}, {"type": "list", "items": ["低中高频电疗法的频率,以及禁忌症"]}, {"type": "p", "text": "频率：低频 0-1000Hz；中频 1kHz-100kHz；高频＞100kHz"}, {"type": "p", "text": "禁忌症：出血倾向、急性炎症、恶性肿瘤、植入起搏器、高热、孕妇腰腹、感觉障碍"}, {"type": "list", "items": ["影响创伤愈合的因素"]}, {"type": "p", "text": "局部：感染、异物 / 失活组织、血运障碍、制动不足、伤口张力大"}, {"type": "p", "text": "全身：营养不良、糖尿病、高龄、激素 / 细胞毒药物、免疫低下"}, {"type": "list", "items": ["什么是传导热疗法？常用传导热疗法有哪些？"]}, {"type": "p", "text": "以各种热源为介体，将热直接传导于人体的治疗疾病的方法，称为传导热疗法。常用的传导热疗作用法有蜡疗，泥疗，砂疗、热空气，蒸浴，坎离砂，化学热袋等"}, {"type": "list", "items": ["肌力分几级"]}, {"type": "p", "text": "0 级：无收缩；1 级：轻微收缩；2 级：水平移动；3 级：抗重力；4 级：抗轻度阻力；5 级：正常肌力"}, {"type": "list", "items": ["创伤院内救治的主要内容有哪些？"]}, {"type": "p", "text": "初步评估和生命支持:确保气道通畅呼吸正常、循环稳定。"}, {"type": "p", "text": "控制出血：通过直接压迫、止血带或手术止血等方式控制出血。"}, {"type": "p", "text": "影像学检查：如X线、CT、MRI等，以明确损伤情况。"}, {"type": "p", "text": "实验室检查：包括血常规、凝血功能、生化检查等。5.手术治疗：根据损伤情况，进行清创、骨折固定、内脏修复等手术。6.抗生素使用：预防或治疗感染。"}, {"type": "p", "text": "疼痛管理：使用镇痛药物缓解疼痛。"}, {"type": "p", "text": "康复治疗：促进患者功能恢复。"}, {"type": "list", "items": ["试述老年患者用药管理的原则及注意事项"]}, {"type": "p", "text": "个体化用药，以最小有效剂量起始，定期评估药物必要性，避免多药共用，关注肝肾功能调整剂量，优先选择副作用少的药物，加强用药依从性教育，监测不良反应"}, {"type": "list", "items": ["何谓调制的中频电流疗法，调制的意义何在？"]}, {"type": "p", "text": "利用10-50HZ的低频电流，对中频1K到5KHZ的正弦电流进行幅度调制的疗法"}, {"type": "p", "text": "意义："}, {"type": "p", "text": "为调出多种治疗波形和刺激密度。"}, {"type": "p", "text": "使治疗中克服适应性与适应深、浅组织的治疗及不同治疗作用的需要"}, {"type": "list", "items": ["试述不利于创伤修复的因素"]}, {"type": "p", "text": "感染：破坏组织修复的最常见原因，常见致病菌有金黄色葡萄球菌，溶血性链球菌，大肠杆菌，绿脓杆菌等。"}, {"type": "p", "text": "异物存留和活组织过多，此类物质充填伤处的组织裂隙，阻碍新生的细胞与基质连接，不利于组织修复。"}, {"type": "p", "text": "血流循环障碍：较重的休克是组织低灌流；伤口包扎或缝合过紧，止血带使用时间过长，导致局部缺血，以及伤前有闭塞性脉管炎等影响局部血运的疾病均可致组织修复迟缓。"}, {"type": "p", "text": "局部制动不够，使新生的组织受到继续损伤，"}, {"type": "p", "text": "全身性因素，营养不良，如蛋白及微量元素缺乏，使细胞增生和基质形成缓慢或质量欠佳，使用皮质激素，细胞毒等药物，使创伤性炎症和细胞增生受抑制本身，有免疫功能低下的疾病等。"}, {"type": "p", "text": "简答"}, {"type": "p", "text": "1简述肠内肠外营养使用时的选择原则"}, {"type": "p", "text": "在肠外营养支持与肠内营养支持之间，应首选肠内营养支持；"}, {"type": "p", "text": "周围静脉营养支持与中心静脉营养支持之间优先选择周围静脉营养支持；"}, {"type": "p", "text": "只有当营养需要量较高或期望短期内改善营养状况时，可考虑用中心静脉营养支持肠内营养；"}, {"type": "p", "text": "肠内营养不能满足病人需要时，可同时用肠外营养支持进行补充，需较长时间，营养支持者"}, {"type": "p", "text": "应尽可能选择肠内营养支持"}, {"type": "list", "items": ["运动疗法禁忌症是什么？"]}, {"type": "p", "text": "绝对禁忌：急性炎症、未固定骨折、严重心肺衰竭、大出血、肿瘤转移"}, {"type": "p", "text": "相对禁忌：发热、严重骨质疏松、未控制高血压"}, {"type": "list", "items": ["犬咬伤的急救原则"]}, {"type": "p", "text": "清洗：立即肥皂水或流动清水反复冲洗伤口不低于15分钟"}, {"type": "p", "text": "伤口深时用注射器反复冲洗，至少30分钟"}, {"type": "p", "text": "专业清洗设备对伤口内部进行冲洗，最后用生理盐水冲洗伤口内残留的肥皂水"}, {"type": "p", "text": "消毒：彻底冲洗后用稀碘伏或其他具有灭活病毒能力的医用制剂涂擦或清洗伤口内部，灭活伤口局部残存的狂犬病病毒"}, {"type": "p", "text": "创面处理"}, {"type": "p", "text": "接种狂犬疫苗"}, {"type": "list", "items": ["蛇咬伤急诊处理原则", "伤口处理：及时冲洗；局部皮肤切开排毒；负压吸引毒液；及时清创；可拔火罐排除毒液", "局部解毒：应用胰蛋白酶一地酸钙钠抗蛇毒血清蛇药制剂等", "抗蛇毒血清", "中医中药治疗", "对症治疗：利尿，血液净化，呼吸循环支持，应用破伤风抗毒素，预防感染，肾上腺皮质激素应用，纠正脏器功能衰竭等", "外科患者营养缺失的原因"]}, {"type": "p", "text": "手术、创伤所致的高分解代谢"}, {"type": "p", "text": "医源性禁食所致的饥饿或半饥饿状态；"}, {"type": "p", "text": "疾病及并发症所致的营养素丢失和摄入不足。"}, {"type": "p", "text": "其他因营养缺失的因素"}, {"type": "list", "items": ["试述骨折康复治疗基本作用"]}, {"type": "p", "text": "改善局部血循环，促进骨愈合，防止骨脱钙，"}, {"type": "p", "text": "维持肌肉一定运动，防止废用性萎缩，"}, {"type": "p", "text": "预防挛缩及关节内粘连，"}, {"type": "p", "text": "促进局部血肿及渗出吸收，减轻水肿与粘连"}, {"type": "p", "text": "提高病人整体素质及情绪状态"}, {"type": "list", "items": ["简述狂犬病暴露分级处置原则", "热射病治疗原则"]}, {"type": "p", "text": "快速降温、纠正休克、防治脑水肿、保护脏器、对症支持"}, {"type": "list", "items": ["肠内营养常见并发症"]}, {"type": "p", "text": "胃肠道（腹泻 / 腹胀）、机械（堵管、黏膜损伤）、感染（吸入性肺炎）、代谢（高血糖 / 电解质紊乱）"}, {"type": "list", "items": ["SBRT与常规放疗相比的优势"]}, {"type": "p", "text": "精准度高、剂量集中、疗程短、正常组织损伤小、局部控制率高"}, {"type": "list", "items": ["低钾血症处理原则：", "尽量口服", "伴有酸中毒、血氯过高或肝功损害时，应用谷氨酸钾", "尿量＞40ml/小时， 即见尿补钾原则", "浓度不宜过高(≤ 0.3% )", "速度不宜过快（＜80滴/分），防止心脏骤停 禁忌直接静脉注射！", "钾入细胞内速度很慢，15小时平衡，勿急", "短期大量补钾，勤查血清钾及心电图", "低钙症状被低钾掩盖，同时补钙", "首选盐水稀释，忌初期用葡萄糖", "防治重在预防，生理需要量3-4克治疗剂量5-6克", "高钾血症治疗"]}, {"type": "p", "text": "消除诱因控制原发病 及时纠酸 正确地补钾"}, {"type": "p", "text": "停用一切含钾的药物或溶液"}, {"type": "p", "text": "减低血钾浓度:（1）促使K+入细胞内（5% NaHCO3 25% G.S+InS β-受体激动剂）（2）利尿剂（3）阳离子交换树脂（4）透析疗法腹膜透析or 血液 透析（特别是CRRT）"}, {"type": "p", "text": "对抗心律失常 10%葡萄糖酸钙溶液20 mL IV"}, {"type": "p", "text": "案例分析"}, {"type": "p", "text": "1女，75岁，腹腔镜直肠癌根治术后两天，出现发热，体温最高38.5℃，并感腹胀，保守治疗后好转，后因咳嗽频繁，出现伤口裂开"}, {"type": "p", "text": "术后非感染性发热的常见原因有哪些？处理原则"}, {"type": "p", "text": "术后发热的常见原因包括手术时间长，大于两小时，广泛组织损伤术中输血，药物过敏，麻醉药引起的肝中毒等，可予以物理降温，对症处理，严密观察"}, {"type": "p", "text": "术后腹胀的常见原因及治疗"}, {"type": "p", "text": "早期肠麻痹积气；腹膜炎致肠麻痹；机械性肠梗阻；处理：胃肠减压，无效手术"}, {"type": "p", "text": "术后早期腹胀多是胃肠道功能受抑制，肠腔积气不能排除所致 术后数日未排气，兼有腹胀，无肠鸣音，可能是腹膜炎或其他原因所致肠麻痹 如腹胀伴阵发性绞痛，肠鸣音亢进，甚至出现气过水声或金属音，则为机械性肠梗阻治疗， 可应用持续胃肠减压，放置肛管，如保守治疗无效，则需再次手术解除梗阻"}, {"type": "p", "text": "如何预防切口裂开的发生？"}, {"type": "p", "text": "减张缝合、加强营养、避免腹压骤增、腹带保护"}, {"type": "list", "items": ["男，80岁，因腹痛并黑便两月，经检查活检确诊胃癌。近两个月来体重下降9kg，患者 bmi 28 千克每平方米，长期便秘，并有吸烟史20年，慢性支气管炎6年。现拟行手术治疗。"]}, {"type": "p", "text": "出现肺部并发症的高危因素有哪些？"}, {"type": "p", "text": "高龄、吸烟、慢支、便秘、肥胖、手术应激"}, {"type": "p", "text": "术后出现伤口裂开的危险因素有哪些？"}, {"type": "p", "text": "高龄、体重骤降、营养不良、咳嗽、便秘"}, {"type": "p", "text": "术中术后有哪些措施可以防止伤口裂开？"}, {"type": "p", "text": "术中减张缝合、术后腹带、控咳嗽 / 便秘、营养支持"}, {"type": "list", "items": ["骨折、创伤的诊断,现场急救方法,后续详细治疗方法"]}, {"type": "p", "text": "诊断：外伤史 + 局部症状 + X 线 / CT 确诊"}, {"type": "p", "text": "现场急救：止血、包扎、固定、搬运，优先保障生命"}, {"type": "p", "text": "后续治疗：复位、固定、抗感染、镇痛、康复训练"}];</script>
<script>
(function () {
  if (WB.mountChrome) WB.mountChrome('materials');

  var body = document.getElementById('body');
  if (body) body.innerHTML = WB.renderBlocks(window.__DOC_BLOCKS || []);
  if (WB.fx && WB.fx.init) WB.fx.init();

  var base = (window.CDN_BASE || '').replace(/\/+$/, '');
  var prefix = window.CDN_PREFIX || '';
  var dl = document.getElementById('dgDl');
  if (base && /^https?:/.test(base) && dl && dl.getAttribute('data-key')) {
    dl.href = base + '/' + prefix + dl.getAttribute('data-key').split('/').map(encodeURIComponent).join('/');
  } else if (dl) {
    dl.style.display = 'none';
  }

  // 阅读 / 练习 切换
  var tabs = [].slice.call(document.querySelectorAll('.doc-tabs button'));
  tabs.forEach(function (b) {
    b.addEventListener('click', function () {
      var p = b.getAttribute('data-pane');
      tabs.forEach(function (x) { x.classList.toggle('on', x === b); });
      var r = document.getElementById('paneRead');
      var q = document.getElementById('paneQuiz');
      if (r) r.classList.toggle('hide', p !== 'read');
      if (q) q.classList.toggle('hide', p !== 'quiz');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });

  var links = [].slice.call(document.querySelectorAll('.toc a[href^="#"]'));
  if (!links.length) return;
  var heads = links.map(function (a) { return document.getElementById(a.getAttribute('href').slice(1)); });
  function paint() {
    var top = window.scrollY + 120, idx = 0;
    heads.forEach(function (h, i) { if (h && h.offsetTop <= top) idx = i; });
    links.forEach(function (a, i) { a.classList.toggle('on', i === idx); });
  }
  window.addEventListener('scroll', paint, { passive: true });
  paint();
})();

/* ---------- 阅读进度、回到顶部、章节入场 ---------- */
(function () {
  var bar = document.createElement('div'); bar.id = 'dgProg';
  var top = document.createElement('button'); top.id = 'dgTop';
  top.type = 'button'; top.setAttribute('aria-label', '回到顶部'); top.textContent = '↑';
  document.body.appendChild(bar); document.body.appendChild(top);

  var raf = 0;
  function paint() {
    raf = 0;
    var max = document.documentElement.scrollHeight - window.innerHeight;
    var y = window.scrollY || 0;
    bar.style.width = (max > 0 ? Math.min(1, y / max) * 100 : 0).toFixed(2) + '%';
    top.classList.toggle('on', y > 520);
  }
  window.addEventListener('scroll', function () {
    if (!raf) raf = requestAnimationFrame(paint);
  }, { passive: true });
  window.addEventListener('resize', paint, { passive: true });
  top.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });
  paint();

  var hs = [].slice.call(document.querySelectorAll('.article h3'));
  if (!('IntersectionObserver' in window) || !hs.length) {
    hs.forEach(function (h) { h.classList.add('in'); });
    return;
  }
  var io = new IntersectionObserver(function (es) {
    es.forEach(function (e) {
      if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
    });
  }, { rootMargin: '0px 0px -8% 0px' });
  hs.forEach(function (h) { io.observe(h); });
  setTimeout(function () { hs.forEach(function (h) { h.classList.add('in'); }); }, 2500);
})();

/* ---------- 记住阅读位置 ---------- */
(function () {
  if (!document.getElementById('body')) return;
  var KEY = 'medilearn.docpos:' + location.pathname;
  var timer = 0;
  window.addEventListener('scroll', function () {
    if (timer) return;
    timer = setTimeout(function () {
      timer = 0;
      try { localStorage.setItem(KEY, String(Math.round(window.scrollY))); } catch (e) {}
    }, 600);
  }, { passive: true });

  var y = 0;
  try { y = parseInt(localStorage.getItem(KEY) || '0', 10) || 0; } catch (e) {}
  if (y < 600) return;
  setTimeout(function () {
    window.scrollTo(0, y);
    var t = document.createElement('div');
    t.textContent = '已回到上次阅读位置';
    t.style.cssText = 'position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:9600;' +
      'background:var(--text);color:var(--surface);font:500 13px/1 var(--font-sans,sans-serif);' +
      'padding:9px 16px;border-radius:999px;box-shadow:0 10px 30px rgba(15,23,42,.22);' +
      'opacity:0;transition:opacity .3s;pointer-events:none';
    document.body.appendChild(t);
    requestAnimationFrame(function () { t.style.opacity = '1'; });
    setTimeout(function () {
      t.style.opacity = '0';
      setTimeout(function () { t.remove(); }, 400);
    }, 1900);
  }, 80);
})();
</script>
