<script>window.__DOC_BLOCKS = [{"type": "p", "text": "外科"}, {"type": "p", "text": "无菌术"}, {"type": "p", "text": "高压蒸气灭菌是使蒸气进入灭菌室内，积聚而使压力增高，室内温度也随之升高。当高压蒸气达到一定的温度和时间，即能杀灭包括具有顽强抵抗力的细菌芽孢在内的一切微生物。适用于大多数医用物品（包括橡胶类物品（A对）、玻璃类物品、金属类物品、布类敷料等）。煮沸法是将物品放于水中，煮沸至100℃，持续15～20分钟，可杀灭一般细菌；持续1小时，可杀灭带芽孢的细菌。适用于金属器械、玻璃制品及橡胶类（B对）物品。"}, {"type": "p", "text": "（P6）“高压蒸气灭菌法（A对）是目前医院内应用最多的灭菌法，效果很可靠”。（P7）“低温甲醛蒸气法（B对）有效气体浓度3～11mg/L，灭菌温度为50～80℃，灭菌时间30～60分钟”。（P7）“煮沸法（C对）…在水中煮沸至100℃并持续15～20分钟，一般细菌即可被杀灭，但带芽孢的细菌至少需煮沸1小时才能被杀灭”。（P7）“干热灭菌法（D对）适用于耐热、不耐湿，蒸气或气体不能穿透物品的灭菌”。（P7）“电离辐射法（E对）属于工业化灭菌法，主要应用于无菌医疗耗材（如一次性注射器、丝线）和某些药品"}, {"type": "p", "text": "/本人这样记的…消毒剂：就(酒精)你(氯己定 )笨(苯扎溴铵)。剩下的都是灭菌剂。"}, {"type": "p", "text": "消毒制剂:甲（甲醛） 乙（乙醇）丙（苯扎 溴铵） 丁（氯己丁）戊（戊二醛）。甲醛 和戊二醛也可用于灭菌。"}, {"type": "p", "text": "药物浸泡时酒精每周校对1次， 灭菌后可保 存2周。"}, {"type": "p", "text": "肝炎， 铜绿假单胞菌感染者，开放性肺结 核的手术器械应在2000mg/L有效氯溶液中 浸泡60分钟， 然后清洗，高压蒸汽灭菌。 不管药怎么变都是60分钟。"}, {"type": "note", "variant": "key", "title": "考点", "text": "手术室管理遵循（D/W/M）原则"}, {"type": "p", "text": "Day:每天清洁消毒一次"}, {"type": "p", "text": "Week:每周彻底清扫一次"}, {"type": "p", "text": "Month:每月细菌培养一次（手术者洗手后 手指、手术室空气、消毒物品）"}, {"type": "note", "variant": "key", "title": "考点", "text": "气性坏疽、铜绿假单胞菌感染者术后（ 手术室） ：40%甲醛+高锰酸钾熏蒸"}, {"type": "note", "variant": "key", "title": "考点", "text": "肝炎、开放结核、铜绿假单胞菌所用（ 手术器械）：有效氯 1小时（60min）/"}, {"type": "p", "text": "术者前臂一旦触及有菌物后，更换无菌手套（A错）并不能解决问题，正确处理应为更换无菌手术衣或加套无菌袖套。"}, {"type": "p", "text": "此题书本上无统一叙述，通常在无菌手术后手套末破，连续施行一手术时不必重新刷手，仅浸泡酒精5分钟穿手术衣、戴手套。仅对于无菌手术采取此法，对于有可能被污染的手术（如感染灶的处理或胃肠道手术），进行下一台手术时需重新洗手并进行手消毒。手术过程中若手套有破损，则无论是否为无菌手术都要重新进行洗手、手消毒。"}, {"type": "p", "text": "（P10）“肝炎、铜绿假单胞菌感染、开放性结核病人，所用手术器械先在2000mg/L有效氯溶液中浸泡60分钟，然后清洗、高压蒸气灭菌"}, {"type": "p", "text": "体液和酸碱平衡"}, {"type": "p", "text": "成年男性体液量占体重60%，女性占50%（A错）"}, {"type": "p", "text": "细胞内液，男性占体重40％，女性占35%，绝大部分存在于骨骼肌中（B对）。"}, {"type": "p", "text": "细胞外液，男女均占体重20％。在细胞外液中，血浆占体重5％（C错），组织液占体重15％。"}, {"type": "p", "text": "还有极小部分的无功能性细胞外液，包括脑脊液、关节液、消化液和结缔组织液等（D错）。"}, {"type": "p", "text": "细胞外液和细胞内液的渗透压一般为290～310mOsm/L（E错）。"}, {"type": "p", "text": "若在短期内体内丧失的液体量达到体重的5％（B对），即丧失25％的细胞外液，病人则会出现脉搏细速、肢端湿冷、血压不稳定或下降等血容量不足之症状。当体液继续丧失达体重的6～7％时（相当于丧失细胞外液的30～35％），则有更严重的休克表现。对于已经有脉搏细速和血压下降等症状患者，需从静脉快速补液3000ml（按体重60kg计算）以恢复其血容量，以平衡盐溶液或复方氯化钠为宜。单纯应用生理盐水有导致高氯性酸中毒的风险（生理盐水中的Cl⁻含量比血清Cl⁻含量高50mmol/L）。以上数据以及处理方法需牢记。"}, {"type": "p", "text": "钾离子作为维持细胞内外电平衡重要的离子，过高或过低必然引起细胞的不稳定，对肌肉的活动、心脏节律等造成严重影响。低钾血症的临床表现主要分为运动系统表现、消化系统表现、心律失常以及代谢性碱中毒（低钾低氯均可引起碱中毒）。运动系统主要表现为肌无力，还可有软瘫、腱反射减退或消失（A对）。消化系统主要表现为厌食、恶心、呕吐和腹胀、肠蠕动消失等肠麻痹表现（B对）。心律失常主要表现为早期心肌应激性增强，心动过速，可有房性、室性期前收缩，晚期由于传导阻滞可导致心动过缓（C对）。低钾引起代谢性碱中毒（D对）的原因，一方面钾离子由细胞内移出，与钠、氢离子交换增加，使细胞外氢离子浓度降低；另一方面远曲肾小管钠、钾离子交换减少，钠、氢离子交换增加，使排氢增多，这两方面的作用即可使病人发生低钾性碱中毒。此时，尿中氢离子增多呈酸性，出现反常性酸性尿"}, {"type": "p", "text": "高钾血症有导致病人心搏突然停止的危险，故一经诊断需积极治疗。治疗方法主要概括为以下几点："}, {"type": "list", "items": ["停止一切含钾离子药物使用；", "静脉注射5％碳酸氢钠；", "使用葡萄糖溶液及胰岛素（又称“极化液”）；", "口服阳离子交换树脂；", "对于血钾高于6.5mmol/L或上述降钾治疗无效者，予透析治疗快速降钾；", "10％葡萄糖酸钙20ml缓慢静脉注射可用于拮抗高钾的心脏毒性作用，用于对抗心律失常。"]}, {"type": "p", "text": "高钾血症的急救是临床医生必须掌握的知识。其中静脉注射5％碳酸氢钠的作用是："}, {"type": "list", "items": ["注射的高渗溶液可使血容量增加，使血清K⁺得到稀释（A对）；", "注射碱性溶液造成的碱血症可促进K⁺移入细胞内，降低细胞外K⁺的浓度；", "增加肾远曲小管中Na⁺含量，增加Na⁺、K⁺交换，使K⁺由尿排除，减轻酸中毒（B对）；", "Na⁺可对抗K⁺的作用（C对）。钙离子能缓解K⁺对心肌的毒性作用，可对抗心律失常，而钠离子无抗心律失常的作用（D错）。"]}, {"type": "p", "text": "瘢痕性幽门梗阻病人的症状主要为反复呕吐，导致脱水；钾摄入不足，且由于含有K⁺及Cl⁻的酸性胃液的大量丢失引起低钾低氯性碱中毒。补充5％葡萄糖盐水，既恢复了细胞外液量，又提供了患者必要的能量；补充氯化钾，既补充了Cl⁻，起到了纠正轻度碱中毒的作用，还补充了血钾（D对）。但应注意须在病人尿量超过40ml/h才可开始补K⁺。补碱会加重碱中毒（乳酸钠也为碱性液体）（ABCE错）。林格氏液为生理盐水中加入氯化钾及氯化钙，比生理盐水成分完全，可代替生理盐水使用，因其由英国生理学家“林格”所发明，所以称林格氏液，实际上就是通称的复方氯化钠注射液。"}, {"type": "p", "text": "/轻度代酸和代碱都是不需要补碱补酸的， 补液过后都能纠正。 补碱指证：碳酸氢根< 10(内科＜5)或者PH<7.2。补酸是碳酸氢根>45或者P H>7.65 /"}, {"type": "p", "text": "/5%葡萄糖等渗/"}, {"type": "p", "text": "外科病人补液量＝每日生理需要量+累积损失量+日损失量。正常成年人每日生理需要量为2000ml，包含氯化钠4.5g（相当于5％葡萄糖盐水500ml）+1500ml 10％葡萄糖溶液。累积损失量指发病至开始治疗这部分时间，因各种原因导致的水和电解质丢失。病人排尿2000ml为正常排尿，未提及病人有脱水症状，因此该病人累积损失量为0。该病人日损失量为全天胃肠减压量800ml，丢失大量含电解质的消化液，故可用5%葡萄糖盐水适当补充这部分损失的含电解质溶液。补液总量＝每日生理需要量+累积损失量+日损失量＝（10％葡萄糖溶液1500ml+5％葡萄糖盐水500ml）+0+5%葡萄糖盐水800ml=5%葡萄糖盐水1300ml+10％葡萄糖溶液1500ml。从临床考虑，由于患者无法进食且电解质丢失严重，故可适当增加电解质溶液所占的比例，由选项可知5％葡萄糖盐水1500ml+10％葡萄糖1000ml为最接近的选项（D对）"}, {"type": "p", "text": "癔病是由精神因素，如生活事件、内心冲突、暗示或自我暗示，作用于易病个体引起的精神障碍。癔病发作时常为腕关节，掌指关节屈曲，指骨间关节伸直，拇指内收，下肢伸直或全身僵硬，呼吸阵发性加快，引起通气过度，二氧化碳呼出过多，引起呼吸性碱中毒（C对）。呼吸性碱中毒后，病人可发生眩晕，手足抽搐和口周麻木。代谢性酸中毒（A错）常见病因有碱性物质丢失过多、酸性物质产生过多和肾功能不全等。代谢性碱中毒（B错）常见病因有胃液丧失过多、碱性物质摄入过多、缺钾和利尿剂的作用等。呼吸性酸中毒（D错）常见原因有全身麻醉过深、镇静剂过量、中枢神经系统损伤、气胸、急性肺水肿和呼吸机使用不当等。"}, {"type": "p", "text": "输血"}, {"type": "p", "text": "输血作为一种替代性治疗，可以补充血容量、改善循环、增加携氧能力，提高血浆蛋白，增进机体免疫力和凝血功能。近些年来提倡成分输血，不输全血。输血的主要适应证是大量失血，失血量少于总血容量的30％时，不输全血，可输晶体和胶体来补充血容量。失血量超过总血容量的30％时，可输入适量全血（A对）。重症感染时（C错），可考虑输注浓缩粒细胞，以提高机体抵抗能力，从而控制感染。恶性肿瘤并发贫血（B错）和慢性失血所致贫血（D错）都不是全血成分的减少，应以补充浓缩红细胞为主。"}, {"type": "p", "text": "短期内输入库存血5000ml，属大量输血，库存血中的抗凝剂枸橼酸钠在肝脏转化为碳酸氢钠，从而导致代谢性碱中毒（B对）。不要错误的认为：大量输库存血一方面引起血钾升高发生代谢性酸中毒，另一方面库存血中的枸橼酸钠在肝转化为碳酸氢钠，导致代谢性碱中毒，从而将答案误为代谢性酸中毒（A错）或代谢性酸中毒合并代谢性碱中毒（E错）。"}, {"type": "p", "text": "预存自体库血的输入时间一般不宜超过10日也算正确（D对）。如是胸、腹开放性损伤超过4小时，发生污染的机会很大，应视为自体输血的禁忌证"}, {"type": "p", "text": "回收式自体输血目前多采用血液回收机收集失血，经自动处理后去除血浆和有害物质，可得到浓缩红细胞，然后再回输（C对）。输入全血（A错）适应证：失血量超过总血容量的30％。输入血浆（B错）适应证：严重肝脏病、凝血因子缺乏、弥漫性血管内凝血（DIC）、烧伤等。输入洗涤红细胞（D错）适应证：对白细胞凝集素有发热反应者及肾功能不全不能耐受库存血中之高钾者。"}, {"type": "p", "text": "我国目前使用的抗凝剂为枸橼酸盐磷酸盐葡萄糖和酸性枸橼酸盐葡萄糖，在2～8℃，抗凝血可保存21天，如果在前者中加入腺苷，可保存35天。"}, {"type": "p", "text": "血液预热：一般速度下可输入1～2L冷藏血而不需要预热（B对）。但当快速大量输冷藏血或新生儿输血或输入含很强的Cryo时，应在血袋外加保护袋预热（﹤32℃）后输入。"}, {"type": "p", "text": "外科休克"}, {"type": "p", "text": "微循环是指微动脉和微静脉之间的血液循环。典型的微循环由微动脉、后微动脉、毛细血管前括约肌、真毛细血管、通血毛细血管 （或称直捷通路）、微静脉和动-静脉吻合支等部分组成。人体的微循环约占总循环量的20％"}, {"type": "p", "text": "中心静脉压（CVP）的正常值为5～10cm H₂O（A对）。当CVP﹤5cm H₂O时，表示血容量不足（C对）；当CVP＞15cmH₂O时，则提示心功能不全、静脉血管床过度收缩或肺循环阻力升高（D对）。血容量、静脉血管张力均可影响静脉回心血量，从而影响中心静脉压（E对）。在休克代偿期，机体有效循环血容量减少，回心血量减少，中心静脉压降低。但由于交感神经兴奋，心脏收缩增强，全身血管收缩，血压可维持正常。可见中心静脉压的变化一般比动脉压变化早"}, {"type": "p", "text": "在休克早期，由于机体的代偿作用（交感-肾上腺轴兴奋导致大量儿茶酚胺释放，以及肾素-血管紧张素分泌增加等环节，可引起心跳加快，心排出量增加以维持循环容量相对稳定；选择性收缩外周和内脏的小血管使循环血量重新分布，保证心、脑等重要器官的有效灌注），造成了血压虽无明显下降，但实际上休克已经存在的现象，故血压并非反映休克程度最敏感的指标（A错，为本题正确答案）。常用脉率/收缩压（mmHg）计算休克指数，指数为0.5多提示无休克；﹥1.0～1.5提示有休克；﹥2.0为严重休克（B对）。皮肤温度色泽是体表灌流情况的标志，如轻压指甲，局部暂时缺血呈苍白，松压后色泽迅速转为正常，则表明末梢循环已恢复、休克好转（C对）。休克恢复后，血压正常，尿量一般正常，若血压正常但尿量少且比重偏低者，提示有急性肾衰竭可能（D对）。"}, {"type": "p", "text": "/为什么尿比重低？因为肾小管坏死失去浓缩功能/"}, {"type": "p", "text": "（P35）“理想的血管活性药物应能迅速提高血压，改善心脏和脑血流灌注，又能改善肾和肠道等内脏器官血流灌注”（P35）“多巴胺是最常用的血管活性药，兼具兴奋α、β₁和多巴胺受体作用，其药理作用与剂量有关。小剂量时主要是β₁和多巴胺受体作用，可增强心肌收缩力和增加CO，并扩张肾和胃肠道等内脏器官血管；大剂量时则为α受体作用，增加外周血管阻力。抗休克时主要取其强心和扩张内脏血管的作用，宜采取小剂量。为提升血压，可将小剂量多巴胺与其他缩血管药物合用，而不增加多巴胺的剂量（A对）”。（P35）“去甲肾上腺素（B错）是以兴奋α受体为主、轻度兴奋β受体的血管收缩剂，能兴奋心肌，收缩血管，升高血压及增加冠状动脉血流量，作用时间短”。（P36）“异丙肾上腺素是能增强心肌收缩和提高心率的β受体兴奋剂…因对心肌有强大收缩作用和容易发生心律失常，不能用于心源性休克（C错）”。"}, {"type": "p", "text": "多巴胺是最常用的血管收缩剂，具有兴奋α、β₁和多巴胺受体的作用。小剂量多巴胺主要兴奋β₁和多巴胺受体，增加心肌收缩力、增加心排出量，并扩张肾脏及胃肠道血管，有保护肾功能的作用，故作为治疗休克的首选（A对），尤其适用于合并肾功能不全者。在使用多巴胺血压无法上升时才选择联用其他血管活性药物如去甲肾上腺素（B错）、异丙肾上腺素（C错）等，而不加大多巴胺的剂量，因可使全身血管收缩、血压上升的同时保护心脏、肾脏的基本血供。休克早期，微循环处于收缩状态，临床上较少使用血管收缩剂（如去甲肾上腺素、肾上腺素（D错）、新福林（E错）等）。异丙肾上腺素为β受体兴奋剂，可增加心肌收缩力、加快心率，且易导致心律失常，更应慎用。"}, {"type": "p", "text": "/先盐后糖，先晶后胶，先快后慢，见尿补钾，见痉补钙，无效补镁/"}, {"type": "p", "text": "在确诊为感染性休克的病人中，可能未见明显的感染病灶，但具有全身炎症反应综合征（SIRS）：①体温﹥38℃或﹤36℃（A对）；②心率﹥90次/分（B对）；③呼吸急促﹥20次/分或过度通气，PaCO₂﹤32.3mm Hg（C对）；④白细胞计数﹥12×10⁹/L或﹤4×10⁹/L，或未成熟白细胞﹥10％。原真题答案给出D也为正确选项，可能是未注意到“未成熟白细胞﹥0.1％”为数据错误。"}, {"type": "p", "text": "由于细菌本身，分泌的内、外毒素等的损害，使得单纯的休克变得复杂，机体细胞受损发生早，甚至造成多器官功能障碍（C对）。心源性休克（A错）、低血容量性休克（B错）、过敏性休克（D错）三者以有效循环血容量锐减及组织灌注不足为基础，但是无内、外毒素等损害，相对于感染性休克危害较轻。"}, {"type": "p", "text": "麻醉"}, {"type": "p", "text": "麻醉前准备包括："}, {"type": "list", "items": ["为避免发生胃内容物反流、呕吐或误吸导致窒息和吸入性肺炎，择期手术前应保证胃排空。成人应禁食12小时，禁水4小时。小儿应禁食4～8小时，禁水2～3小时（E对）；", "合并高血压者，应经严格内科治疗，维持血压在180/100mmHg以下较为安全（A对）；", "凡有心衰史、房颤或心脏明显扩大者，应以洋地黄类药物治疗，并与手术当天停药（C错，为本题正确答案）；", "合并呼吸系统疾病者，应停止吸烟至少2周，并进行呼吸功能训练，雾化吸入，应用有效抗生素3～5天以控制肺部感染（B对）；", "合并糖尿病者，应控制血糖不高于8.3mmol/L（D对）。"]}, {"type": "p", "text": "/手术当天停药"}, {"type": "p", "text": "洋地黄，降压药，胰岛素"}, {"type": "p", "text": "手术前一天"}, {"type": "p", "text": "降糖药"}, {"type": "p", "text": "氯磺丙脲术前2-3天晚上停药"}, {"type": "p", "text": "2水"}, {"type": "p", "text": "4母乳"}, {"type": "p", "text": "6配方奶粉"}, {"type": "p", "text": "8脂肪蛋白"}, {"type": "p", "text": "成人268婴儿246"}, {"type": "p", "text": "围术期术前12禁食4紧水"}, {"type": "p", "text": "胃手术无需术前抗生素"}, {"type": "p", "text": "幽门梗阻要温盐水洗胃"}, {"type": "p", "text": "结直肠手术术前1d及当天灌肠，抗生素/"}, {"type": "p", "text": "一氧化二氮（N₂O），又称“笑气”，早期被用于牙科手术的麻醉，是人类最早应用于医疗的麻醉剂之一。因其可使体内封闭腔内压升高，因此不宜应用于肠梗阻患者。使用氧化亚氮还有如下注意事项：大手术需配合硫喷妥钠及肌肉松弛剂等；吸入气体中必须维持吸入氧浓度（FIO₂）高于0.3，以免发生低氧血症；麻醉终止后，应继续吸纯氧5～10分钟，以防止缺氧。"}, {"type": "p", "text": "/全麻 2种"}, {"type": "p", "text": "吸入麻醉药："}, {"type": "p", "text": "心地善良：地氟醚适合心脏手术"}, {"type": "p", "text": "七里香:七氟醚和花一样香，恶心呕吐少"}, {"type": "p", "text": "雅安地震:安氟醚：适合眼手术"}, {"type": "p", "text": "压抑:异氟醚：控制性降压"}, {"type": "p", "text": "笑破肚子：氧化亚氮（笑气） ：肠梗阻慎 用"}, {"type": "p", "text": "静脉麻醉药：4种 （静脉麻醉药，肌松药， 镇痛药）"}, {"type": "p", "text": "硫喷妥钠（喷唾沫） ：整天喷，嘴贱，喉 痉挛"}, {"type": "p", "text": "依托米酯：用于冠心病→衣脱，心动"}, {"type": "p", "text": "(肌松药维库溴铵也是用于冠心病， 维护心脏)"}, {"type": "p", "text": "丙泊芬/异丙酚：起效快苏醒快， 心脏病受不了(分手让人心碎)"}, {"type": "p", "text": "氯氨酮：禁用于青光眼→氯—绿-青。 唯一有镇痛作用的。/"}, {"type": "p", "text": "手术时麻醉过深可能有导致死亡的危险，正常剂量的麻醉药物有时会出现病人已麻醉但是肌肉未完全松弛，不利于手术的进行，此时应用肌松药可以迅速松弛肌肉。需注意，肌松药仅有松弛骨骼肌的作用（A对），没有麻醉效能（B错），亦不能使病人神志和感觉丧失（C错）。肌松药能使得呼吸肌麻痹，故严禁将肌松药用于未麻醉、无呼吸机辅助呼吸的病人。体温降低有减慢新陈代谢，延长肌松药的作用（D错），因此在术中要密切观察，注意调整用量。"}, {"type": "p", "text": "成人气管内插管是医生必须掌握的临床操作之一，主要用于：①麻醉期间保持病人的呼吸通畅，防止异物进入呼吸道，便于及时吸出气管内分泌物或血液；②进行有效的人工或机械通气，防止病人缺氧和CO₂蓄积；③便于吸入性全身麻醉药的应用。两个数据要记牢：导管插入气管内的深度在成人为4～5cm，导管尖端至中切牙的距离约为18～22cm。"}, {"type": "p", "text": "普鲁卡因（C对）是目前毒性最小的局麻药，表现为中枢神经兴奋型，症状较轻。若有过敏反应则相当严重，如抢救不及时可立即死亡。"}, {"type": "p", "text": "丁卡因（B错）毒性大，因其扩散和表面穿透力强，常用于黏膜表面麻醉。若用量大，浓度高或局部有伤口，很易发生严重的心血管中毒反应，出现抽搐，甚至心跳突然停止。"}, {"type": "p", "text": "利多卡因（A错）轻度中毒表现为寒战和肢体抽动，神情淡漠或嗜睡等中枢抑制症状，严重者有抽搐。"}, {"type": "p", "text": "布比卡因（D错）是麻醉作用时间最长的局麻药，中毒表现为中枢神经兴奋型。本品易在心肌组织内蓄积，因此对心脏的毒性较强，且易引起室性心律失常。"}, {"type": "p", "text": "局麻药注入体内后，一部分呈游离状态的起麻醉作用，另一部分与局麻组织的蛋白结合，或吸收入血与血浆蛋白结合，结合状态的药物将暂时失去药理活性。与利多卡因（A错），丁卡因（B错），普鲁卡因（C错）相比，布比卡因的血浆蛋白结合率最高，游离药的浓度最低，因此透过血胎屏障进入胎儿体内的药物浓度低，较适合于分娩镇痛（D对）。值得一提的是，罗哌卡因虽然蛋白结合率低于布比卡因，但是前者具有感觉和运动分离的作用，因此更适用于分娩镇痛。/分娩:罗哌卡因，布比卡因/"}, {"type": "p", "text": "局麻药的麻醉效能主要决定于脂溶性，脂溶性（D对）越强，则亲细胞能力越强，麻醉效能越强"}, {"type": "p", "text": "局麻药的解离常数（pKa）（A错）越大，对于生物膜穿透功能越差（离子难以穿透生物膜），起效时间延长、弥散性越差。"}, {"type": "p", "text": "局麻药的麻醉效能也与蛋白结合率（E错）有关，蛋白结合率越高，则排泄率越低，作用时间越长。"}, {"type": "p", "text": "麻醉效能与相对分子质量（B错）和浓度（C错）没有关系。"}, {"type": "p", "text": "局麻药的不良反应包括毒性反应和过敏反应，其中毒性反应主要与用量超限、药物注射或渗入血液、病人耐受力差有关；过敏反应即变态反应，临床上多见于酯类局麻药，酰胺类极少见。过敏性休克仅见于极少部分患者（A错），为局麻药的严重不良反应。出现过敏性休克时，应注意呼吸管理，充分给氧，必要时应用镇静药（如巴比妥类药物）（七版黄家驷外科学P297）。"}, {"type": "p", "text": "酯类局麻药（包括普鲁卡因、丁卡因）主要被血浆假性胆碱酯酶水解（B对）；/一只(酯类)假(假性胆碱酯酶)普(普鲁卡因)丁(丁卡因)/"}, {"type": "p", "text": "酰胺类局麻药（包括利多卡因、布比卡因、罗哌卡因）在肝内被微粒体酶所水解（C对）。/邓布(布比卡因) 利多(利多卡因)在暹(酰胺) 罗(罗哌卡因)大干(肝)一场/"}, {"type": "p", "text": "普鲁卡因的成人一次限量为1g"}, {"type": "p", "text": "/钉子很容易扎穿，粘膜穿透力最强——丁卡因/"}, {"type": "p", "text": "利多卡因成人一次限量表面麻醉为100mg，局部浸润麻醉和神经阻滞为400mg（D对）。"}, {"type": "p", "text": "普鲁卡因的成人一次限量为1g。"}, {"type": "p", "text": "丁卡因成人一次限量表面麻醉为40mg，局部浸润麻醉和神经阻滞为80mg。"}, {"type": "p", "text": "布比卡因和罗哌卡因的成人一次限量为150mg。"}, {"type": "p", "text": "/用了普鲁卡因1g"}, {"type": "p", "text": "利多卡因说 要死"}, {"type": "p", "text": "丁卡因 死吧/"}, {"type": "p", "text": "局部麻醉是用局部麻醉药暂时阻断某些周围神经的冲动传导，使这些神经所支配的区域产生麻醉作用，简称局麻。常用的局麻方法包括：①表面麻醉（A对）；②局部浸润麻醉（B对）；③区域阻滞（C对）；④神经阻滞（E对）。骶管阻滞（D错，为本题正确答案）为硬膜外阻滞的一种，属于椎管内麻醉，而广义的局麻包括椎管内麻醉，故此题不严谨。"}, {"type": "p", "text": "锁骨上：干【骨干】"}, {"type": "p", "text": "肌间路：根【根基】"}, {"type": "p", "text": "腋径路：支【椰汁】"}, {"type": "p", "text": "（P59）“臂神经丛主要由C₅₋₈和T₁（C、T分别代表颈和胸）脊神经的前支组成并支配上肢的感觉和运动/比(臂丛)胡八一(C5~8 T1)有钱(前支)/"}, {"type": "p", "text": "（P60）“肌间沟径路和锁骨上径路还可发生膈神经麻痹、喉返神经麻痹和霍纳综合征，锁骨上径路较易发生气胸（E对）；肌间沟径路较易引起高位硬膜外阻滞，或药液意外注入蛛网膜下隙而引起全脊椎麻醉”。"}, {"type": "p", "text": "神经纤维被阻滞的顺序依次为：自主神经（C类纤维传导的痛觉及交感神经）→ 感觉神经（Aδ纤维传导的温痛觉、Aβ纤维传导的触～压觉）→ 运动神经（Aα纤维传导的躯体运动）→ Aγ纤维传导的固有感觉（深部感觉和位置觉）。/自觉运固/"}, {"type": "p", "text": "（P66）“腰麻的禁忌证：①中枢神经系统疾患，如脑脊膜炎、脊髓前角灰白质炎、颅内压增高等；②凝血功能障碍；③休克（A对）；④穿刺部位有皮肤感染；⑤脓毒症；⑥脊柱外伤或结核；⑦急性心力衰竭或冠心病发作"}, {"type": "p", "text": "对于硬膜外麻醉来说，局麻药注入硬膜外后，因为硬膜外腔为负压，无脑脊液，药液将通过虹吸现象吸附于黄韧带和硬脊膜间，药液流动能力小，故体位对麻醉平面的影响很小（A错，为本题正确答案）。穿刺间隙（B对）决定麻醉节段的上下平面的位置；导管方向（C对）可决定药液的扩散方向，导管向头端插入，药液向颈胸段扩散，向尾端插入，药液向腰骶段扩散；注药方式（D对）决定麻醉范围，在药物剂量相同的情况下，一次注射麻醉平面较广，分次注射范围较窄；药物容积（E对）大，则扩散快，麻醉范围广，反之麻醉范围窄。"}, {"type": "p", "text": "在药液中增加肾上腺素，利用的是肾上腺素的缩血管作用，使得局麻药吸收速度减慢，延长作用时间，同时可减轻局麻药吸收所引起的毒性反应。临床上常选择1：20万的比例加入肾上腺素，则100ml的局麻药中加肾上腺素的最佳剂量为100×1/200000＝0.0005g＝0.5mg"}, {"type": "p", "text": "增加局麻药的容量可以扩大局麻药在硬膜下间隙的扩散范围，增加局麻药的浓度可以使起效时间和作用时间增强，增加局麻药的剂量（D对）时，局部药物的容量和浓度均增加（BC错），故能更大程度加速局麻药起效和延长作用持续时间，并提供最大的感觉和运动阻滞深度。"}, {"type": "p", "text": "全身（乙醚）麻醉深度的分期标准可分为四期。"}, {"type": "list", "items": ["第Ⅰ期（镇痛期）指从麻醉诱导开始到病人意识消失。此时大脑皮层逐渐受到抑制，意识逐渐丧失，痛觉减退，呼吸和心率稍增快，其他反射仍存在。此期不宜手术；", "第Ⅱ期（兴奋期）（A错）指大脑皮层受到抑制，皮层下中枢失去控制，临床表现为兴奋状态，如呼吸紊乱、血压和心率波动。最后出现深而有节律的呼吸。此期禁止任何手术；", "第Ⅲ期（手术麻醉期）指皮层下中枢被抑制，兴奋状态消失，痛觉消失。此期适宜手术，分为4级。第一级（B错）：呼吸规律，频率稍快；眼睑反射消失，眼球活动减少；但肌肉不松弛。可施行一般手术；第二级（C对）：眼球固定中央，瞳孔不大；呼吸频率稍慢，但幅度无明显改变；肌张力逐渐减弱。可施行腹部手术；第三级（D错）：瞳孔开始散大；胸式呼吸减弱，腹式呼吸增强；血压下降，肌松弛。可施行刺激强度大的手术及操作；第四级：肌完全松弛，呼吸逐渐停止，循环显著抑制。应立即施行人工呼吸，减浅麻醉；（4）第Ⅳ期（延髓麻醉期）指呼吸停止，血压测不到，瞳孔散大。如不及时抢救可导致心脏停搏。"]}, {"type": "p", "text": "/1、I期（镇痛期）：不宜手术"}, {"type": "p", "text": "II期（兴奋期）：禁忌任何手术"}, {"type": "p", "text": "III期（手术麻醉期）：此期宜手术，分4级"}, {"type": "p", "text": "1级：可施行一般手术"}, {"type": "p", "text": "2级：腹部手术"}, {"type": "p", "text": "3级：可施行刺激强度大的手术及操作"}, {"type": "p", "text": "4级：应立即施行人工呼吸，减浅麻醉"}, {"type": "p", "text": "IV期（延髓麻醉期） ：如不及时抢救可导 致心脏停搏/"}, {"type": "p", "text": "（八版生理学P182）CO₂蓄积主要出现酸中毒的临床表现：血液PH下降刺激颈动脉体和主动脉体，使得心率增快、血压升高以加速血液流动，代偿机体组织缺氧状态；呼吸加大加深，以排出过量的CO₂。当CO₂迅速排除后，血液酸中毒解除，使得机体血压下降；但是对于呼吸来说，中枢化学感受器在CO₂引起的通气反应中起主要作用，CO₂的迅速排出使得血液中PCO₂下降过快，低PCO₂的血液到达脑部，呼吸中枢因缺少足够的CO₂刺激而受到抑制，于是呼吸变慢变浅甚至停止（A对）。"}, {"type": "p", "text": "重症检测治疗与复苏"}, {"type": "p", "text": "吹气时向后压环状软骨的目的是使头极度后仰造成的呼吸道弯曲变直，有利于吹气的进行"}, {"type": "p", "text": "按压～吹气比例为30：2，按压频率以100次/分计算，吹气频率为8～10次/分"}, {"type": "p", "text": "MODS的病因有："}, {"type": "list", "items": ["各种外科引起的脓毒症；", "严重的创伤、烧伤（B对）或大手术致失血、缺水；", "各种原因的休克，心跳、呼吸骤停复苏后（A对）；", "各种原因导致肢体、大面积的组织或器官缺血-再灌注损伤；", "合并脏器坏死或感染的急腹症（C对）；", "输血、输液、药物或机械通气；", "患某些疾病的病人更容易发生MODS，如心脏、肝、肾的慢性疾病，糖尿病，免疫功能低下。"]}, {"type": "p", "text": "ARDS早期的主要临床表现有："}, {"type": "list", "items": ["咳嗽咳痰：咳出血水样痰是ARDS的典型表现；", "呼吸频率增快（A对），呼吸做功增加和顽固性低氧血症，有呼吸窘迫感，用一般的吸氧法不能得以缓解（B对），PaO₂降至8.0kPa（60mmHg）（E对）；", "无明显的呼吸困难，肺部听诊无啰音（C错，为本题正确答案），X线胸片一般无明显异常（D对）。"]}, {"type": "p", "text": "ARDS继续发展可出现严重呼吸困难和听诊出现干性或湿性啰音。"}, {"type": "p", "text": "ARDS（急性呼吸窘迫综合征）是因肺实质急性弥漫性损伤而导致的急性缺氧性呼吸困难，临床表现以进行性呼吸困难（B对）和顽固性低氧血症（C对）为特征。其特征性病变是非心源性肺水肿（A对），即漏出性肺水肿。ARDS患者由于肺间质和肺泡水肿、充血，肺表面活性物质减少引起肺表面张力增加，肺顺应性降低"}, {"type": "p", "text": "昏迷病人经口气管内插管，因插管及前部膨胀的气囊压迫局部气管壁，可能导致局部缺血损害，故一般以维持24～28小时为限，超过此限应行气管切开（B对）。经典认为年龄较小的儿童最好是采用无套囊的气管导管，以防止发生拔管后喘鸣；近年来的许多研究发现，应用带套囊的气管导管并未增加小儿拔管后喘鸣合并症的发生率，尤其是低压套囊导管的出现，另外，小儿声门下形状的变异亦相当明显。因此，目前这些观点已经不适用于现代临床（过去认为C正确，先该观点存在争议）。下颌发育不全的病人，因无法将口开合较大，通常经口无法直接观察声门，故此类病人口腔直视气管插管操作是困难的（D对）。口腔内手术，经鼻腔插管可为口腔内操作提供足够的空间和良好的视线，并防止异物进入气管，利于手术的进行"}, {"type": "p", "text": "疼痛治疗"}, {"type": "p", "text": "世界卫生组织推荐的癌症三阶梯止痛疗法："}, {"type": "list", "items": ["按药效的强弱依阶梯方式顺序使用：非阿片类药物（如阿司匹林）→弱阿片类药（如可待因）→强阿片类药（如吗啡）+辅助用药（如安定、氯丙嗪等）（A对）；", "尽量使用口服给药（E对）。口服给药→直肠给药→注射给药；", "按时给药（C错，为本题正确答案）；", "用药剂量个体化，应用时从小剂量开始，逐渐加大剂量（B对）。"]}, {"type": "p", "text": "吗啡类药物不再有效时，便需考虑药物以外的治疗，主要包括椎管内注药和放、化疗及激素疗法（D对）。椎管内注药主要是硬膜外注射吗啡麻醉神经根，或蛛网膜下隙内注射神经损毁性药物（苯酚、无水乙醇等），彻底毁坏痛觉传导神经，缓解疼痛；放化疗及激素疗法针对的是对此种治疗敏感的癌症细胞引起的疼痛，本身也是治疗癌症的方法。"}, {"type": "p", "text": "围术期处理"}, {"type": "p", "text": "嵌顿疝还纳修补术（A错）、脾破裂行脾切除术（D错）、十二指肠溃疡穿孔修补术（E错）都属于急症手术。胃癌为恶性肿瘤，需要尽早做好术前准备后行手术治疗，因此胃癌根治术为限期手术（B错）。甲状腺腺瘤为良性肿瘤，短期内不会对病人生命造成威胁，因此甲状腺腺瘤切除术（C对）属于择期手术。"}, {"type": "p", "text": "胃与消化道其他部分不同，为高胃酸环境，多数细菌难以存活，胃部手术可视为清洁手术，通常不需要预防使用抗菌药物，主要应加强消毒灭菌和无菌操作。在临床中，结、直肠手术前应常规应用口服广谱抗生素（C错）。"}, {"type": "p", "text": "结肠癌患者术前应常规进行肠道准备，目的是减少肠道内的粪便残留和细菌数量，从而降低术后感染和吻合口瘘的发生率。其具体措施包括：术前两日进流食（A对）（流食几乎不产生残渣，可减少肠道内粪便，有利于结肠手术的进行）；口服肠道抗生素和泻剂（B对）的目的是为了抑制肠道细菌生长，排空肠腔，目的是降低手术过程中肠道内细菌和杂质污染腹腔的危险；术前12～24小时行肠道灌洗（D对）可进一步清洁排空结肠。在直肠癌手术切除的具体操作中，首先要将肿瘤所在肠管的两段用纱布条扎紧，随即结扎相应血管，以防止癌细胞在肠腔内或血液中扩散种植和转移，可在扎闭的肠腔内给予稀释的抗癌化学药物后行肠袢切除，但抗肿瘤药物灌肠无意义（C错，为本题正确答案），不是常规肠道准备的要求。"}, {"type": "p", "text": "/①全麻未清醒→平卧， 头转向一侧→至清 醒；"}, {"type": "list", "items": ["蛛网膜下隙阻滞→平卧或头低位12小时 ；/我的理解 防止脑脊液外渗造成头痛/", "颅脑手术后如无休克或昏迷， 取15~30° 头高脚低斜坡位；", "颈、胸手术后→高半坐位卧式", "腹部手术→低半坐位卧式或斜坡卧位；", "脊柱或臀部手术→俯卧或仰卧位；", "腹腔内有污染→尽早改为半坐位或头高 脚低位，以便体位引流；", "休克→下肢抬高15~20°， 头部和躯干抬 高20~30°；", "肥胖病人→侧卧位， 有利于呼吸和静脉 回流。 /"]}, {"type": "p", "text": "发热是术后最常见的症状，但术后发热一般不一定表示发生感染，由于细菌的繁殖需要时间达到一定数量方能引起症状，故非感染性发热通常比感染性发热来得早，分别平均在术后1.4天和2.7天。另外伤口感染应有伤口红肿痛及脓性分泌物表现（A错）；腹腔感染除了发热外，会出现腹膜刺激征（C错）；肺炎患者除发热外，肺部存在湿啰音、咳嗽咳痰（B错）。术后一天内突发寒战高热首先应想到输血或输液反应的可能（D对）。"}, {"type": "p", "text": "胃肠道手术病人肠道功能受损，需待到肠道功能基本恢复后，可开始进食，肠道功能基本恢复的征兆是闻及肠鸣音或肛门已排气（A对）。"}, {"type": "p", "text": "对于缝合处组织张力大，全身情况较差时，为防止切口裂开可采用减张缝合，主要用于腹壁切口，一般在术后2周左右伤口基本愈合时可拆线（B对）。"}, {"type": "p", "text": "乳胶片通常用于浅表伤口的引流，一般在术后1～2日即拔除，时间过长有碍于伤口的愈合（C错，为本题正确答案）。"}, {"type": "p", "text": "一般性手术后的病人，应鼓励早期活动（D对），这有利于患者呼吸和运动功能的恢复，并防止坠积性肺炎、下肢深静脉血栓形成等疾病的发生。"}, {"type": "p", "text": "尿潴留时间过长，导尿时尿液量超过500ml者，应留置尿管1～2天（E对），有利于膀胱逼尿肌收缩力的恢复。"}, {"type": "p", "text": "/乳胶片一两天，烟卷引流到3天"}, {"type": "p", "text": "头面颈四五天，下腹会阴六七天，"}, {"type": "p", "text": "四肢十十二天，关节减T十四天。/"}, {"type": "p", "text": "引流可将感染性液体/脓液和非感染性液体（如渗血、渗液、组织液等）引出体腔（AB对），减少术后感染的发生几率，从而加快伤口愈合。吻合口瘘的发生主要与手术中吻合不当或吻合不到位有关，与是否安放引流无关（C错）；一旦发生吻合口瘘，可进行引流将自瘘中流出的异物引流出体外，对瘘起到治疗作用（D对）。"}, {"type": "p", "text": "外科病人的代谢及营养治疗"}, {"type": "p", "text": "通常的择期、限期手术，术后热量增加10％左右；创伤、感染时视其严重程度热量可增加20％～30％；大面积烧伤热量可增加50％～100％。患者行胃癌根治术属限期手术，术后患者每日热量需要量会高出正常量的10％。七版外科学认为：正常人基础能量需要为25kcal/（kg·d）。八版外科学认为：正常人基础能量需要为20～25kcal/（kg·d）。此题为按七版外科学数据计算即25kcal/（kg·d）×60kg×110％=1650kcal"}, {"type": "p", "text": "评定外科病人的营养状况主要通过临床检查、人体测量、生化及实验室检查来进行。其中常用的指标有：理想体重（A对）；体重指数（BMI）；三头肌皮皱厚度；上臂周径测量；握力测定；血浆蛋白（D对）；氮平衡试验（C对）；总淋巴细胞计数"}, {"type": "p", "text": "；溃疡性结肠炎长期腹泻者（B对），食物进入肠腔可加重病情，需使用全胃肠外营养；坏死性胰腺炎（D对）必须严格禁食，以避免食物对胰腺的刺激加重病情，需使用全胃肠外营养；"}, {"type": "p", "text": "。胆囊造瘘术是一种较简单的急救手术，目的在于引流胆汁、降低胆压，消除胆道炎症，其不影响病人进食"}, {"type": "p", "text": "肠外营养是指通过胃肠道以外途径（即静脉途径）提供营养支持的方式。凡是需要营养支持，但又不能或不宜接受肠内营养支持的病人均为肠外营养支持的适应证。"}, {"type": "p", "text": "正常状态下所需要的热量为20～25kcal/（kg·d），蛋白质1.0～1.5g/kg（折合供氮量0.2～0.24g/kg）（A对），氮（g）和热量（kcal）之比为1：150～200（B错，为本题正确答案）。"}, {"type": "p", "text": "含有适量的电解质、维生素和微量元素的肠外营养液能够补充多种人体所需的非能量供应物质（C对）。"}, {"type": "p", "text": "葡萄糖是肠外营养主要的能量来源，但是葡萄糖的代谢必须依赖胰岛素；且使用大量高渗葡萄糖作为单一的能源会产生某些有害的结果，脂肪乳剂可提供能量、生物合成碳原子及必须脂肪酸，适量补充胰岛素和脂肪乳剂十分必要（D对）。"}, {"type": "p", "text": "复方氨基酸溶液是提供生理性氮源的制剂，由于各种蛋白质由特定的氨基酸组成，因此输入的氨基酸溶液中各种氨基酸的配比应该合理，必需氨基酸和非必需氨基酸的含量一般为1：2（E对）。"}, {"type": "p", "text": "食物中的谷氨酰胺是小肠上皮细胞的重要能量来源，现小肠不再有食物通过，无法吸收到谷氨酰胺，只能利用机体产生的谷氨酰胺，使其大量消耗；谷氨酰胺又是肝脏执行解毒功能重要的物质，缺乏导致肝功能损害"}, {"type": "p", "text": "胃肠道功能正常者，营养支持时应首选肠内营养，且应该以口服为主（A对）。昏迷或不能进食的病人，若肠道功能无损害，则可用管饲给予流食（B对），以避免误吸导致吸入性肺炎。要素饮食是一种化学精制食物，与水混合后可以形成溶液或较为稳定的悬浮液，无需经过消化过程即可直接被肠道吸收和利用，为人体提供热能及营养。结肠术前准备和术后处理采用要素饮食可减少粪便残渣，以利于肠道清洁和避免术后吻合口瘘（C对）。口服或管饲有困难或仍难提高营养者，为保证病人的生命和疾病恢复，可采用胃肠外营养代替肠道吸收营养（D对）。"}, {"type": "p", "text": "外科肠外营养支持情况下，针对不同的病人情况，营养液中各成分所占的比例有所不同："}, {"type": "p", "text": "糖尿病人对血糖调节欠佳，在减少葡萄糖用量时，可相应增加脂肪乳剂的用量（A对）。"}, {"type": "p", "text": "肝病失代偿期病人，肝脏代谢功能锐减，无法及时有效的处理肠外营养输入的大量物质，营养液的用量应减为全量的1/2左右（B对）。"}, {"type": "p", "text": "严重创伤或危重病人，由于强烈的应激反应以及疾病本身的因素，使得机体呈负氮平衡，容易发生谷氨酰胺缺乏，但在体外谷氨酰胺水溶性差，容易变形，而谷氨酰胺二肽水溶性好，稳定，进入体后可很快分解为谷氨酰胺以补充谷氨酰胺的缺乏（D对）"}, {"type": "p", "text": "肾衰竭的病人，由于含氮代谢废物最终需通过尿液排出，故需限制氨基酸的用量，但无需限制葡萄糖和脂肪乳剂的用量（C错，为本题正确答案）。"}, {"type": "p", "text": "外科感染"}, {"type": "p", "text": "病程在3周之内为急性感染，超出2个月为慢性感染，介于二者之间的为亚急性感染"}, {"type": "p", "text": "通常，急性蜂窝织炎为非特异性感染，主要由溶血性链球菌、金葡菌等引起；但是对于产气性皮下蜂窝织炎来说，以厌氧菌感染为主，如肠球菌、兼性大肠埃希菌、变形杆菌、拟杆菌或产气荚膜梭菌等，多见于下腹与会阴部。故急性蜂窝织炎的致病菌为溶血性链球菌、厌氧性细菌均可。"}, {"type": "p", "text": "/1."}, {"type": "p", "text": "与肠有关→大肠杆菌"}, {"type": "p", "text": "与血液有关→金葡菌"}, {"type": "p", "text": "特殊"}, {"type": "list", "items": ["溶链→"]}, {"type": "p", "text": "a.皮下蜂窝织炎"}, {"type": "p", "text": "b.丹毒"}, {"type": "p", "text": "c.急性淋巴管炎or淋巴结炎"}, {"type": "p", "text": "d.原发性腹膜炎"}, {"type": "list", "items": ["肺炎链球菌"]}, {"type": "p", "text": "脾切除后爆发性/凶险性感染→小孩"}, {"type": "list", "items": ["病变部位和临床表现不在同一部位"]}, {"type": "p", "text": "病变部位→临床表现→病"}, {"type": "list", "items": ["手掌→手背→掌中间隙感染", "肾→膀胱刺激征→肾结核", "髋关节→膝关节→儿童髋关节结核", "输尿管→肾绞痛→输尿管结石", "胰腺→难治性溃疡，腹泻→胃泌素瘤 (左琳格-爱丽森)/"]}, {"type": "p", "text": "溶血性链球菌是常见的非特异性感染致病菌，可引起急性蜂窝织炎、急性淋巴管炎和淋巴结炎等多种浅表感染性疾病；急性淋巴管炎和淋巴结炎极少由厌氧菌感染引起，可能是因为位置较为表浅，以及厌氧菌的侵袭力在浅表组织不强的原因有关"}, {"type": "p", "text": "在发生脓性指头炎时，虽然可有发热、白细胞计数增高等全身中毒症状，但因此导致败血症者少见（A错）。掌中间隙感染（B错）多由中指和环指腱鞘感染蔓延所致，化脓性腱鞘炎（D错）多为局部刺伤后继发细菌感染所致，此两者均不是来源于脓性指头炎。中指脓性指头炎是中指末节掌面的皮下化脓性细菌感染，形成压力很高的脓腔，除引起剧烈疼痛外，还能压迫末节指骨的滋养血管，引起指骨缺血、坏死；如果治疗不及时，脓液直接侵及指骨，易引起骨髓炎"}, {"type": "p", "text": "当代外科感染中革兰阴性杆菌感染已超越革兰阳性球菌（B对）。"}, {"type": "p", "text": "厌氧菌感染时常伴有需氧菌感染，因为两类细菌有协同作用，能使坏死组织增多，易于形成脓肿（E对）。"}, {"type": "p", "text": "破伤风病菌是破伤风梭菌，为专性厌氧菌，在缺氧环境中，该菌的芽胞发育为增殖体，迅速繁殖并产生大量外毒素，主要是痉挛毒素。破伤风抗毒素能够中和游离毒素，只在疾病早期有效，毒素已与神经组织结合则难以收效（E 错）；创伤后早期彻底清创，改善局部循环才是预防破伤风的最可靠方法。"}, {"type": "p", "text": "革兰阴性杆菌的主要毒性是内毒素，虽然大多数抗生素都能杀菌，但对内毒素及其介导的多种炎症介质无效，因此，革兰性阴性杆菌所致的败血症一般病情严重，可出现三低现象（低温、低白细胞、低血压），感染性休克发生早且持续时间长（B对）。革兰阴性菌败血症可有发热，但多为间歇热（C错）。易并发心肌炎（A错）、稽留热或弛张热（C错）、转移性脓肿多见（D错），均为革兰阳性球菌败血症的特点。"}, {"type": "p", "text": "破伤风杆菌是革兰氏阳性厌氧性梭状芽孢杆菌（AC对），芽孢位于菌体一侧，呈杵状，广泛存在于灰尘、土壤及粪便当中。菌体易杀灭，芽孢具有特殊的抵抗力，故自然界主要以芽孢形式分布。"}, {"type": "p", "text": "破伤风是可以预防的疾患，预防措施包括正确处理伤口，注射破伤风类毒素主动免疫，以及在伤后采用被动免疫预防发病。三年前曾行破伤风自动免疫者，属于已经注射破伤风类毒素主动免疫者，仅需在伤后肌注0.5ml类毒素即可形成有效的免疫抗体（A对），不需注射破伤风抗毒素。"}, {"type": "p", "text": "丹毒为皮肤和黏膜网状淋巴管的急性炎症，特点是蔓延很快，很少有组织坏死或化脓，伴有全身反应。淋巴管炎无法进行清创，治疗上除了休息、抬高患肢、局部皮肤硫酸镁热敷或3％碘酊涂擦外，需全身应用磺胺药或青霉素，并在全身和局部症状消失后继续应用3～5天，以免再发（B对）。"}, {"type": "p", "text": "气性坏疽又称梭状芽胞杆菌性肌坏死，是由梭状芽胞杆菌引起的特异性感染，致病菌产生的外毒素可以引起严重毒血症及肌肉组织的广泛坏死，临床特点是病情急剧恶化，甚至出现溶血性贫血、黄疸、血红蛋白尿等全身症状并迅速恶化，故需尽早治疗，早期急诊清创（A错）。"}, {"type": "p", "text": "由于破伤风是厌氧菌，其生长繁殖必须有缺氧的环境，治疗上应彻底清创、积极注射抗毒血清、充分敞开伤口引流（C错）。"}, {"type": "p", "text": "蜂窝织炎为非特异性感染，主要由溶血性链球菌、金葡菌等引起，治疗主要是注意休息，采用热敷、理疗，应用磺胺药或广谱抗生素，多处切开引流更利于缓解皮下炎症的扩散和减少皮肤坏死（D错）；需注意口底及颌下的急性蜂窝织炎，可发生喉头水肿和压迫气管，引起呼吸困难，甚至窒息，应及早切开减压，以防止上述急症。"}, {"type": "p", "text": "气性坏疽是厌氧菌感染的一种，即梭状芽胞杆菌所致的肌坏死或肌炎（A对），此类感染发展急剧，预后严重，感染发生时，往往不是单一细菌，而是几种细菌的混合（B对）。致病菌产生的外毒素可以引起严重毒血症及肌肉组织的广泛坏死。临床特点是病情急剧恶化，甚至出现溶血性贫血、黄疸（C对）、血红蛋白尿等全身症状并迅速恶化，故需尽早治疗，早期急诊清创（D错）是治疗的关键，必要时给予截肢以挽救生命。"}, {"type": "p", "text": "抗菌药物的剂量一般按药物本身的安全剂量范围来给药（A错），而抗菌药物种类的选择与年龄、身体状况、体重等相关。"}, {"type": "p", "text": "应用抗菌药物后，不可以减免一些外科处理（B错），因为去除感染灶、通畅引流是外科治疗的基本原则，任何一种抗菌药物都不能取代引流等外科处理。一般来说，抗菌药物在外科感染治疗中仅起到辅助作用。并非所有的外科感染均需应用抗菌药物（C错），例如疖和痈未引起全身症状时，仅需要通过保持皮肤清洁、外用中药及理疗即可治愈，无需使用抗生素；抗生素的使用有其严格的指征。"}, {"type": "p", "text": "广谱抗生素并联合用药具有广泛的抑菌作用，除了抑制致病菌外，同时抑制正常菌群，有可能造成菌群失调甚至二重感染的可能，故对于抗生素的使用尽可能选用病原菌敏感的抗生素，非必要情况不采用联合用药（D错）。"}, {"type": "p", "text": "手术预防性抗生素的给药方法：应在术前0.5～2小时或麻醉开始时首次给药；手术时间超过3小时或失血量大于1500ml，术中可给予第二剂；总预防用药时间一般不超过24小时，个别情况可延长至48小时"}, {"type": "p", "text": "毛囊炎为皮肤浅表局限性感染，除局部皮肤红肿热痛外无不良全身表现，一般无需使用抗生素，仅需要通过保持皮肤清洁、外用中药及理疗即可治愈（A对）。"}, {"type": "p", "text": "以下情况需预防性应用抗生素："}, {"type": "list", "items": ["严重创伤，如大面积烧伤、开放性骨折（C错）、火器伤、腹部脏器穿孔，以及有严重污染及软组织破坏的损伤；", "进入胃肠道、呼吸道、女性生殖道的手术，结肠手术前肠道准备（D错）；", "人造物留置手术（E错）；", "病人有感染高危因素，如高龄、营养不良、糖尿病、粒细胞减少症等；或是接受类固醇、免疫抑制剂、抗癌药物治疗，免疫功能低下而需手术治疗者；", "手术时间长、创伤大，或一旦感染后果严重者，如颅脑、心脏和大血管手术，器官移植手术等"]}, {"type": "p", "text": "创伤"}, {"type": "p", "text": "正常情况下，伤后应尽早清创后一期缝合，最好在伤后6～8小时内进行。头面部伤口由于局部血运良好，抗感染能力强，且伤口多位于浅表部位，污染不易扩散至深层组织，限时可延长至10小时，甚至更长，本例面颊部开放性损伤后12小时，争取清创后一期缝合，这也有利于减少疤痕的产生（D对）。污染严重或一般伤口伤后超过8～12小时，但尚未明显感染的伤口（面颊部除外），应该清创后延迟缝合。感染伤口可放置引流，定期换药。"}, {"type": "p", "text": "烧伤冻伤蛇咬伤等"}, {"type": "p", "text": "成人双膝以下烧伤，包括双小腿（13％）和双足（7％），总共有20％（C对）。关于成年男性烧伤面积估算（九分法）：头颈部一九；双上肢二九；躯干部三九；双下肢五九再加一。关于具体部位面积估算可用口诀来记忆：3、3、3、5、6、7（分别对应发部、面部、颈部、双手、双前臂、双上臂）；13、13、再加1（分别对应躯干前、躯干后、会阴）；5、7、13、21（分别对应双臀、双足、双小腿、双大腿）。"}, {"type": "p", "text": "/来跟着我的节奏唱：\n3 3 3,\n5 6 7,\n1313会阴1, \n5213双足7, \n女性屁股与足齐（666）。/"}, {"type": "p", "text": "Ⅰ°烧伤：仅伤及表皮浅层（A错）。"}, {"type": "p", "text": "浅Ⅱ°烧伤：伤及表皮的生发层和真皮乳头层（B错）。"}, {"type": "p", "text": "深Ⅱ°烧伤：伤及真皮乳头层以下，但仍残留部分网状层，还未累及皮下组织（C错）。"}, {"type": "p", "text": "Ⅲ°烧伤为皮肤全层烧伤，并累及皮下组织（D对）乃至深部的组织，属于皮肤烧伤中最严重的一种。"}, {"type": "p", "text": "Ⅰ°烧伤表面红斑状、干燥和灼烧感（A错）。"}, {"type": "p", "text": "浅Ⅱ°烧伤局部红肿明显，有大小不一的水疱形成，水疱皮如剥脱，创面红润、潮湿、疼痛明显（B错）。"}, {"type": "p", "text": "深Ⅱ°烧伤也可有水泡，但去水疱皮后，创面微湿，红白相间，痛觉较迟钝（C对）。"}, {"type": "p", "text": "Ⅲ°烧伤无水泡，创面蜡白或焦黄、甚至炭化。硬如皮革、干燥、无渗液、发凉、针刺和拔毛无痛觉（D错）。"}, {"type": "p", "text": "Ⅰ°烧伤：再生能力强，3～7天脱屑痊愈，短期内可有色素沉着；"}, {"type": "p", "text": "浅Ⅱ°烧伤：创面可于1～2周内愈合，一般不留瘢痕，但多数有色度沉着；"}, {"type": "p", "text": "深Ⅱ°烧伤：创面修复可赖其上皮增殖形成上皮小岛，如不感染，可融合修复，需时3～4周（D对）；"}, {"type": "p", "text": "Ⅲ°烧伤：又称焦痂型烧伤，由于皮肤及其附件全部被毁，3～4周后焦痂脱落。"}, {"type": "p", "text": "烧伤24小时内，机体发生的最主要的变化是体液渗出，极易发生低血容量性休克。因此首选的主要治疗措施是液体复苏（C对）。镇静止痛（B错）、补充营养、增强免疫（E错）属于对症治疗，不属于主要治疗措施。处理创面（A错）、控制感染（D错）都是烧伤急性感染期治疗的主要措施，多在伤后3～10天进行，并非在24小时内"}, {"type": "p", "text": "补液是防治烧伤休克最重要的措施。常根据病人的烧伤面积和体重按下述公式计算补液量：伤后第1个24小时补液量：成人每1％Ⅱ°、Ⅲ°烧伤面积每公斤体重补液1.5ml（胶体液0.5ml和电解质液1ml），另加基础水分2000ml。患者烧伤面积共占体表面积的3％＋18％＋13％＋1％＝35％。患者体重65kg，根据补液公式，第1个24小时补液总量为35×65×1.5＋2000＝5412.5ml≈5500ml（D对）。"}, {"type": "p", "text": "（P472）“（三）应激性溃疡或急性糜烂性溃疡 约占20％。近年来，其发生率有明显上升。多与休克、复合性创伤、严重感染、严重烧伤（Curling溃疡）（D错）、严重脑外伤（Cushing溃疡）或大手术有关”。病变主要位于胃底（A对）及胃体部（B对），胃窦部亦可受累；一部分病变侵及十二指肠，少数可累及食管”。"}, {"type": "p", "text": "肿瘤"}, {"type": "p", "text": "华支睾吸虫主要寄生部位为次级胆管，可引起胆管内膜及胆管周围的超敏反应及炎性反应，长期慢性刺激可引起胆管上皮细胞异形增生而致癌变，主要为腺癌（C对）。华支睾吸虫引起的原发性肝癌以胆管细胞癌为主。"}, {"type": "p", "text": "与大肠癌有关（A错）的是日本血吸虫感染；"}, {"type": "p", "text": "与宫颈癌有关（B错）的是单纯疱疹病毒感染；"}, {"type": "p", "text": "与鼻咽癌有关（D错）的是EB病毒感染；"}, {"type": "p", "text": "与白血病有关（E错）的C型RNA病毒感染或者丙种球蛋白缺乏"}, {"type": "p", "text": "骨肿瘤（D对）代谢率高，对含有放射性核素的¹⁸F-FDG摄取量大，显像清晰，阳性率可高达90％左右"}, {"type": "p", "text": "消化道肿瘤（C对）相对其他肿瘤来说对¹⁸F-FDG的摄取量低，阳性诊断率较低。"}, {"type": "p", "text": "首选化疗的恶性肿瘤，可记忆为“大伯培养小林到高中”，其意思是大：大细胞淋巴瘤，伯：Burkitt 淋巴瘤，培：胚胎性横纹肌肉瘤，养：恶性滋养细胞瘤，小：小细胞肺癌，林：急性淋巴细胞白血病（C 对），高：睾丸精原细胞瘤，中：中枢神经系统淋巴瘤。"}, {"type": "p", "text": "霍奇金淋巴癌（A 错）、乳腺癌（B 错）、粒细胞白血病（D 错）等肿瘤应用化疗可使肿瘤获缓解或使肿瘤缩小，或可使手术范围缩小以尽可能多地保留器官功能，而这些肿瘤不能单独应用化疗治愈。"}, {"type": "p", "text": "恶性肿瘤容易发生转移，其方式有四种：①直接蔓延②淋巴转移③血行转移④种植转移。淋巴道转移（A对）是上皮性恶性肿瘤（癌）的首要转移方式，肉瘤也可以淋巴道转移。值得注意的是，有的肿瘤可以逆行转移，或者越过相应的引流淋巴结发生跳跃式转移，但这些都较为少见，最多见的转移方式还是区域淋巴结转移。"}, {"type": "p", "text": "皮样囊肿属于先天性疾患，属于错构瘤的一种，多发生于婴幼儿，其表面皮肤可活动，但基底常粘连固定，质较软，有波动或面团样感，一般不发生感染，不会有红肿史（C错）。"}, {"type": "p", "text": "皮脂腺囊肿因皮脂腺导管阻塞导管从而引起皮脂腺排泄障碍、淤积而成，阻塞物多为灰尘堵塞及细菌感染所致，一般无自觉症状，表现为高出皮面的肿物，表面光滑，无压痛，挤压可见豆腐渣样内容物，若并发感染可出现红肿热痛表现，即病人的“曾有红肿史”主诉"}, {"type": "p", "text": "颈部疾病"}, {"type": "p", "text": "环境缺碘是引起单纯性甲状腺肿的主要因素。碘的缺乏（A对），导致甲状腺无法合成足量的甲状腺激素，反馈性引起垂体TSH分泌增高并刺激甲状腺滤泡上皮细胞增生，产生代偿性肿大。"}, {"type": "p", "text": "此外，由于甲状腺素合成和分泌过程中某一环节的障碍，例如久食含有硫脲的萝卜、白菜等，可阻止甲状腺素的合成，或先天缺乏合成甲状腺素的酶，引起血中甲状腺素减少，反馈性引起垂体TSH分泌增高并刺激甲状腺滤泡上皮细胞增生，促使甲状腺肿大（BC对）。"}, {"type": "p", "text": "有些青春发育期、妊娠期或绝经期的妇女，由于对甲状腺素的需要量暂时性增高，也可发生轻度弥漫性甲状腺肿，也叫生理性甲状腺肿（D对）。"}, {"type": "p", "text": "长效甲状腺刺激素浓度增高（E错，为本题正确答案），长效甲状腺刺激素是1956年在突眼性甲状 腺功能亢进患者血浆中发现的一种蛋白质。它的发现推翻了长期认为促甲状腺素分泌过多，引起甲腺功能亢进的学说。LATS 是针对甲状腺细胞表面TSH受体的自身抗 体IgG， 能刺激甲状腺细胞合成和释放过多 的甲状腺素导致甲亢。由于它的作用缓慢 而持久，故称为长效甲状腺刺激素。甲亢 病人阳性率达50%，尤其突眼者。"}, {"type": "p", "text": "在甲状腺肿多发地区，集体预防极为重要，一般多用碘化食盐。常用剂量为每10～20kg食盐中均匀地加入碘化钾或碘化钠1.0g，此量足够满足人体每日的需碘量"}, {"type": "p", "text": "甲亢的诊断主要是依靠临床表现，结合辅助检查来确定。主要通过测基础代谢率、¹³¹I摄取率与血清中T₃（三碘甲状腺原氨酸）、T₄（甲状腺素）含量。测基础代谢率时，达到正常值20％及以上，即可考虑为甲亢（A对）。¹³¹I摄取率测定时，2小时内摄取率超过人体总量的25％（C对）以上或24小时内超过人体总量的50％（B错）以上即可诊断为甲亢。在测定T₃和T₄含量时，血清中T₃含量＞正常4倍左右或T₄含量＞正常的2.5倍则考虑为甲亢"}, {"type": "p", "text": "丙硫氧嘧啶（A错）属于硫脲类抗甲状腺药物，此类药物能使甲亢患者甲状腺体积增大，充血。"}, {"type": "p", "text": "甲亢手术指征为："}, {"type": "list", "items": ["继发性甲亢或高功能腺瘤；", "中度以上的原发性甲亢；", "腺体较大，伴有压迫症状，或胸骨后甲状腺肿等类型甲亢；", "抗甲状腺药物或¹³¹I治疗后复发者或坚持长期用药有困难者；", "妊娠早、中期的甲亢病人凡具有上述指征者。该患者为妊娠6周发生的甲亢，属于妊娠早期甲亢，且存在压迫症状，应及时手术治疗（E对），否则可能会导致流产、早产、胎儿宫内死亡以及妊高症等，而妊娠又可能加重甲亢，因此在妊娠早中期，仍应考虑手术治疗；到妊娠晚期，甲亢与妊娠之间的相互影响已经不大，则可待分娩后再行手术。"]}, {"type": "p", "text": "切除腺体的数量，应根据腺体大小或甲亢程度决定，通常需切除腺体的80％～90％（A错），同时切除峡部（D错），保留6～8g甲状腺组织（成人拇指末节大小甲状腺组织相当于3～4g，两侧均需保留）。"}, {"type": "p", "text": "术后出血及血肿压迫气管可导致呼吸困难和窒息，故术野常规放置引流管24～48小时（E错）。"}, {"type": "p", "text": "在处理供应甲状腺的动脉时，为避免损伤喉上神经，手术中结扎、切断甲状腺上极血管时应紧贴甲状腺上极（B错）；/紧跟上级/"}, {"type": "p", "text": "为避免损伤喉返神经，手术中结扎、切断甲状腺下极血管时应远离甲状腺下极，要尽量离开腺体背面靠近颈总动脉。/远离下级/"}, {"type": "p", "text": "使用碘剂2～3周，甲亢症状基本控制便可手术（D对），该方法适用于症状不重，以及继发性甲亢和高功能腺瘤的病人。"}, {"type": "p", "text": "使用硫脲类药物进行术前准备需注意，由于硫脲类药物能使甲状腺肿大和动脉性充血，手术时极易发生出血，增加了手术的困难和危险，因此服用硫脲类药物后必须加用碘剂2周待甲状腺缩小变硬，血管数减少后手术，此为常考点（BC错）。"}, {"type": "p", "text": "普萘洛尔是一种β受体阻断剂，能控制甲亢的症状（阻断T₄在外周组织向T₃的转化），缩短术前准备时间，且用药后不引起腺体充血，有利于手术操作，对硫脲类药物效果不好或反应严重者可改用此药，也可与碘剂合用作术前准备（A错）；普萘洛尔可与碘剂合用或单独使用。剂量从60mg/d开始，每6小时/次，一般4～7日后心率降至正常水平时，便可施行手术；由于普萘洛尔在体内半衰期不到8小时，故术前1～2小时必须再口服一次，术后继续服用4～7天即可"}, {"type": "p", "text": "发生甲状旁腺损伤后，立即静脉注射10％葡萄糖酸钙或氯化钙10～20ml（A对），可迅速提高血钙，为最便捷而有效的方法。口服葡萄糖或乳酸钙2～4g（B错），每日3次，适用于症状轻者；口服维生素D₃5万～10万U（C错），适用于症状较重或长期不能恢复者，可促进钙在胃肠内的吸收，起效缓慢。口服双氢速变固醇油剂（D错）能明显提高血中钙含量，降低神经肌肉的应激性，药效缓慢而持久。肉类、乳品和蛋类食品（E错）因含磷较高，可影响钙的吸收，停食这些食品，可有助于缓慢升高血钙。BCDE所述四种方法虽都可使血钙升高，但都不适合急救"}, {"type": "p", "text": "患者甲状腺大部切除术后当晚出现呼吸困难、烦躁、脉快，伤口辅料引流血少，考虑引流不畅，切口内血肿出血压迫（D对）气道，引起的呼吸困难。"}, {"type": "p", "text": "甲状腺危象（A错）的主要临床表现是高热（﹥39℃），心率增快（﹥120次/分），同时合并神经、循环及消化系统严重功能紊乱如烦躁、谵妄、大汗、呕吐、水泻等，但无呼吸困难表现。"}, {"type": "p", "text": "气管塌陷（B错），是气管壁长期受肿大甲状腺压迫，发生软化，切除甲状腺的大部分后，软化的气管壁失去支撑的结果，常于术后立即发生，一般不会等到术后当晚。"}, {"type": "p", "text": "喉头水肿（C错），是引起呼吸困难的常见原因，主要见于因气管插管操作损伤喉部引起，但患者未行全麻、气管插管。"}, {"type": "p", "text": "双侧喉返神经损伤（E错）引起的呼吸困难和窒息，是于手术中损伤喉返神经后会立即出现，不会等到术后当晚才发生。"}, {"type": "p", "text": "/这类题主要看引起呼吸困难和嘶哑的时间 ：术后立即出现呼吸困难考虑气道塌陷和 双侧喉返神经损伤， 术后两个小时左右出 现的考虑喉头水肿(气管插管全麻)，术后患者送回病房两个小时左右出现的考虑伤口 出血压迫症状。/"}, {"type": "p", "text": "考虑喉上神经内支（C对）损伤，导致喉部黏膜感觉丧失，饮水时容易出现误咽呛咳。喉上神经外支损伤（C错）会使环甲肌瘫痪，引起声带松弛，音调降低/上善若水，名声在外/"}, {"type": "p", "text": "/上内呛咳外音低，一返声嘶二呼困/"}, {"type": "p", "text": "甲状腺髓样癌（D对）来源于甲状腺滤泡旁细胞（又称C细胞），恶性程度中等，可分泌降钙素等多种激素，病人可有腹泻、面部潮红和多汗等类癌综合征或其他内分泌失调的表现。"}, {"type": "p", "text": "/甲状腺乳头状癌―最常见成人60%儿童 100%， 预后最好，双侧多中心，颈淋巴结早转移，沙粒毛玻璃"}, {"type": "p", "text": "滤泡状癌―容易侵袭血管较早发生血行 转移。20%"}, {"type": "p", "text": "髓样癌―神经内分泌肿瘤分泌降钙素 淀粉小体。7%"}, {"type": "p", "text": "未分化癌―恶性程度最高预后最差。15 % /"}, {"type": "p", "text": "甲状腺癌手术:"}, {"type": "p", "text": "乳头状癌"}, {"type": "p", "text": "单侧，切患侧峡部及对侧大部分"}, {"type": "p", "text": "双侧，全部切"}, {"type": "p", "text": "无淋巴结转移就不清扫"}, {"type": "p", "text": "滤泡，髓样癌"}, {"type": "p", "text": "单侧双侧均全切"}, {"type": "p", "text": "有淋巴结转移清扫意义不大"}, {"type": "p", "text": "滤泡癌先血转移， 如果淋巴转移了说明已 经入血了"}, {"type": "p", "text": "未分化"}, {"type": "p", "text": "放射"}, {"type": "p", "text": "原本以为是小结节，做手术术后发现癌的"}, {"type": "p", "text": "癌小于1cm，吃甲状腺素片"}, {"type": "p", "text": "癌1-4cm，切患侧及峡部"}, {"type": "p", "text": "癌大于4，全切 /"}, {"type": "p", "text": "对于弥漫性单纯性甲状腺肿（A对）病人可给予小量甲状腺素，以抑制垂体前叶TSH分泌，缓解甲状腺的增生和肿大。"}, {"type": "p", "text": "亚急性甲状腺炎（C对）者，甲状腺滤泡破坏，功能减退，服用泼尼松同时加用甲状腺素制剂可减轻甲状腺负担。"}, {"type": "p", "text": "桥本甲状腺肿（D对），病变的甲状腺组织被淋巴细胞、浆细胞所取代，分泌的甲状腺减少，可长期服用甲状腺素片作替代治疗。"}, {"type": "p", "text": "甲状腺癌（B对）作次全或全切除后，患者应终身服用甲状腺素片，以预防甲状腺功能减退及抑制TSH分泌，减少肿瘤复发，系因分化型甲状腺癌细胞均有TSH受体，TSH通过其受体能影响甲状腺癌的生长。"}, {"type": "p", "text": "一旦发现甲状腺结节，应仔细地从病史和体检来分析是否有恶性的可能。多数甲状腺结节隐匿生长，被发现时并无症状，但不能以此除外恶性。病史中应注意询问肿块生长速度，结节在数月内持续增长，应怀疑恶性。若短期内明显增大，老年病人应考虑有未分化癌的可能。如果结节肿大不明显，但合并声音嘶哑，吞咽困难，咳嗽气短者，或既往有甲状腺癌病史，又出现结节者，则高度提示为恶性。一般来讲，对于甲状腺结节，男性更应得到重视。体检的重点在甲状腺结节的特性和颈部淋巴结的情况。如果甲状腺结节质地坚硬，边界不清，活动度差，应怀疑为恶性，质地硬是最主要的特点。如伴有同侧的颈部淋巴结肿大或声带麻痹，则应高度怀疑为恶性。儿童（A对）甲状腺的单发结节尤其应警惕恶性可能，恶变率约50％。"}, {"type": "p", "text": "/关键在对于甲状腺结节的恶变， 儿童占了 百分之五十， 所以，占比大，关键词在甲 状腺结节。/"}, {"type": "p", "text": "甲状腺恶性结节的诊断主要根据临床表现和病理，若甲状腺肿块质硬、固定，腺体在吞咽时上下移动度小，颈淋巴结肿大，或有压迫症状者，或存在多年的甲状腺肿块，在短期内迅速增大者（A对），均应怀疑为甲状腺癌。甲状腺单发孤立结节（B对）恶性可能性大，甲状腺多发结节良性可能性大。甲状腺核素扫描可为冷结节、凉结节、热结节、温结节。冷和凉结节表明局部组织分化不良，无功能或功能低下，可见于甲状腺囊肿、钙化、纤维化、腺瘤出血、甲状腺癌，甚至个别为慢性淋巴细胞性甲状腺炎或亚甲炎。这类结节恶性概率较高，尤其是单发的冷结节，恶变率可达20％，凉结节的恶变率约10％，多发性冷结节的恶变率约0～18.3％，因此核素扫面为冷结节（D对）有助于恶性结节诊断。当结节与周围组织无粘连时，结节随吞咽移动度大（C错），此种情况无助于甲状腺恶性结节的诊断。"}, {"type": "p", "text": "。慢性肾衰竭患者，肾小球滤过率降低，尿磷排泄障碍，导致血磷增高。高血磷会与钙形成磷酸钙沉淀于软组织，使血钙降低，刺激PTH的分泌，诱发继发性甲状旁腺功能亢进（B对）。甲状旁腺瘤约占原发性甲状旁腺功能亢进的80％，电影多为单发腺瘤（A对），多发腺瘤少于1％～5％。"}, {"type": "p", "text": "囊状淋巴管瘤又称囊状水瘤，多在出生时即可见到颈部肿物，多发生于胸锁乳突肌后缘的锁骨上窝处，颈后三角（颈侧区）为好发部位，多为单发（E对），触之柔软，有囊状感，波动感明显，无触痛，边缘多不清楚。颈部肿块发生坏死、溃破、感染不一定只是颈部淋巴结结核，肿瘤、淋巴结炎等亦可。"}, {"type": "p", "text": "/颈部淋巴结结核"}, {"type": "p", "text": "胸锁乳突肌的前、后缘"}, {"type": "p", "text": "无红热疼痛，冷脓肿"}, {"type": "p", "text": "我只是肿，我可不红不热呦"}, {"type": "p", "text": "甲状腺腺瘤"}, {"type": "p", "text": "女性，"}, {"type": "p", "text": "单发"}, {"type": "p", "text": "吞咽上下移动"}, {"type": "p", "text": "囊状淋巴管瘤/囊状水瘤"}, {"type": "p", "text": "颈侧区"}, {"type": "p", "text": "光滑而柔软，波动感，边缘不清楚"}, {"type": "p", "text": "不痛不红不热"}, {"type": "p", "text": "甲状舌管囊肿"}, {"type": "p", "text": "儿童和青少年， 约50%的病例发生于20岁 之前，"}, {"type": "p", "text": "颈前"}, {"type": "p", "text": "舌骨体与囊肿之间可触及坚韧的索条，"}, {"type": "p", "text": "与舌骨体粘连，"}, {"type": "p", "text": "可随伸舌运动上下移动"}, {"type": "p", "text": "若形成通口腔的窦道， 则食物、口腔细菌 等易进入囊腔中， 细菌滋生，造成局部组 织的炎性反应， 而后化脓性改变、脓液破 溃溢出体表/"}, {"type": "p", "text": "颈部常见肿块:😂"}, {"type": "p", "text": "颈前--- 甲舌.甲状腺"}, {"type": "p", "text": "颈后--纤维.脂肪瘤"}, {"type": "p", "text": "颈侧---各种管(除了舌管)胸腺咽管囊肿 囊状 淋巴管瘤 颈动脉体瘤 血管瘤"}, {"type": "p", "text": "颏下----都有下 颌下腺炎 颏下皮样囊肿"}, {"type": "p", "text": "颈前----都甲状 甲状舌管囊肿 甲状腺疾病"}, {"type": "p", "text": "其他都---颈侧/"}, {"type": "p", "text": "甲状舌管囊肿（B对）好发于儿童和青少年，约50％的病例发生于20岁之前，绝大多数患者可见颈前位于舌骨以下的囊肿，舌骨体与囊肿之间可触及坚韧的索条与舌骨体粘连可随伸舌运动上下移动，若形成通口腔的窦道，则食物、口腔细菌等易进入囊腔中，细菌滋生，造成局部组织的炎性反应，而后化脓性改变、脓液破溃溢出体"}, {"type": "p", "text": "乳房疾病"}, {"type": "p", "text": "乳房囊性增生病（B对）好发于中年妇女，突出表现为乳房胀痛和肿块，可累及一侧或双侧乳腺，肿块呈结节状、片状，质韧不硬，少数病人可有乳头溢液"}, {"type": "p", "text": "导管内乳头状瘤（C错）主要症状是乳头溢出血性液体，而无乳房胀痛，乳房肿块一般较。"}, {"type": "p", "text": "正常月经期，早期妊娠或囊性增生病（D对）常见乳头溢液为浆液性无色溢液。"}, {"type": "p", "text": "乳腺囊性增生病的突出表现是乳房胀痛和肿块（A对），特点是部分病人有周期性，即乳房胀痛一般于月经前明显，月经后减轻，严重者整个月经周期都有疼痛。触诊发现一侧或双侧乳腺有弥漫性增厚，肿块呈颗粒状（B对）、结节状或片状，大小不一，质韧而不硬，边界不清。治疗主要是对症治疗，且疼痛通常与月经周期有关，可自行缓解，故一般不必药物治疗（D对）。本病有无恶变尚无定论。"}, {"type": "p", "text": "乳管阻塞的导管内乳头状瘤（B错）可见棕褐色溢液，是因为恶性疾病乳管阻塞，出血混合坏死组织所致。"}, {"type": "p", "text": "终止哺乳后（C错）常见乳头溢液常为乳汁，为白色或略带黄色的液体。"}, {"type": "p", "text": "乳腺是多种内分泌激素的靶器官，如雌激素、孕激素及泌乳素等，无论是月经初潮年龄早（B对）、绝经晚、不孕或者高龄初产（A对），都是体内雌孕激素未发生适时的变化所致。脂肪细胞具有保护雌激素的功能，肥胖（C对）病人体内雌激素清除较慢，可加强或延长雌激素对乳房上皮细胞的刺激，长期可引起过度刺激。过去认为单纯乳腺增生（D错），又称乳腺囊性增生病，无癌变潜能；现课本中认为该观点尚有争论，但无循证医学证据，若碰到题目，尚可认为乳腺囊性增生病不会发生恶变。"}, {"type": "p", "text": "黏液腺癌（A对）属浸润性特殊癌，是乳腺癌的病理类型中预后较好的，分化一般较高。浸润性小叶癌（B错）、浸润性导管癌（C错）、硬癌（D错）属于浸润性非特殊癌，一般分化低，预后较差。"}, {"type": "p", "text": "/口诀记忆，没有理解，容易混淆。理解性 记忆为王， 浸润特殊癌：特殊就是腺癌前 面加个定语，比如黏液腺癌（没有定语就 是非特殊癌，比如腺癌），还有高分化的 小管癌， 大量淋巴浸润的髓样癌，再加上 乳头状癌和鳞癌。 浸润非特殊癌，恶性程度高，包括低分化癌（单纯癌 癌组织和纤 维组织一样多) 髓样癌(癌比纤维多)，硬癌 (纤维比癌多) 对比记忆 食管癌髓样癌 癌比纤维多， 食管增宽，硬癌纤维比癌多，食管变窄） ，带浸润的癌（浸润小叶癌，浸 润导管癌） ，还有腺癌。纯手写，点个赞 呗～/"}, {"type": "p", "text": "局部的可凹性改变（A错）即“酒窝征”，是由于癌细胞累及Cooper韧带，使其缩短导致的皮肤凹陷。"}, {"type": "p", "text": "“橘皮样改变”（B对）是由于癌细胞浸润浅表组织淋巴管，使得淋巴管阻塞，淋巴液回流障碍，进而造成真皮水肿，由于皮肤毛囊与皮下组织粘连较紧密，在真皮水肿时毛囊处即会形成许多点状小孔，形成了凹凸不平的橘皮样改变。"}, {"type": "p", "text": "“卫星结节”（C对）虽然在教科书中未提及，但常常出现在考题中，其是由癌细胞沿皮下淋巴管广泛扩散到乳腺及其周围皮肤，形成小结节，甚至彼此融合，称为卫星结节。"}, {"type": "p", "text": "湿疹样改变（D错）是指乳头湿疹样乳腺癌，此病少见，恶性程度低，发展慢。乳头有瘙痒、烧灼感，以后出现乳头和乳晕的皮肤变粗糙、糜烂如湿疹样，进而形成溃疡。"}, {"type": "p", "text": "乳腺癌大都发生在45～50岁，更年期和绝经期前后的妇女"}, {"type": "p", "text": "已确诊乳腺癌，检查时局部皮肤充血、发红，呈现急性炎症改变，此为炎性乳癌的征象，此病并不多见，特点是发展迅速、预后差"}, {"type": "p", "text": "对于乳腺癌病人，无论是放疗还是化疗，针对的都是浸润性乳腺癌，非浸润性乳腺癌只要切除原发灶、病理证实确实无浸润，术中可不行淋巴结清扫、术后无需常规放化疗。导管内癌属于非浸润性乳腺癌，无需使用术后化疗"}, {"type": "p", "text": "/分期→术式"}, {"type": "list", "items": ["I II 期乳腺癌首选 “保乳” 和 “改良根治”。", "保乳："]}, {"type": "note", "variant": "key", "title": "考点", "text": "➕前哨淋巴结活检（临床淋巴结阴性） ；"}, {"type": "note", "variant": "key", "title": "考点", "text": "肿瘤≤3cm 肿瘤距乳头≥3cm ——适应症 ；"}, {"type": "note", "variant": "key", "title": "考点", "text": "多中心， 多灶，及无法获得切缘阴性—— 禁用；"}, {"type": "note", "variant": "key", "title": "考点", "text": "术后必须→放疗。"}, {"type": "list", "items": ["改良根治："]}, {"type": "note", "variant": "key", "title": "考点", "text": "乳腺单切➕腋清（勿伤胸长N➕胸背N ）"}, {"type": "note", "variant": "key", "title": "考点", "text": "术后腋窝（转移）淋巴结≥4个 → 放疗"}, {"type": "list", "items": ["根治术：●全切➕胸大肌➕胸小肌➕淋 清", "单纯乳房切除术："]}, {"type": "note", "variant": "key", "title": "考点", "text": "原位癌（导管内癌）➕微小癌（≤1cm） ——适应症；"}, {"type": "note", "variant": "key", "title": "考点", "text": "术后→ 不 放疗。"}, {"type": "p", "text": "术后治疗："}, {"type": "list", "items": ["放疗：→浸润癌"]}, {"type": "note", "variant": "key", "title": "考点", "text": "保乳 术后 必须 放疗"}, {"type": "note", "variant": "key", "title": "考点", "text": "改良根治术后 若淋巴结转移≥4个 必须放 疗"}, {"type": "list", "items": ["化疗：→浸润癌"]}, {"type": "p", "text": "指证："}, {"type": "note", "variant": "key", "title": "考点", "text": "淋巴结转移"}, {"type": "p", "text": "高危因素易复发："}, {"type": "note", "variant": "key", "title": "考点", "text": "T大于2cm（T2、T3、T4）"}, {"type": "note", "variant": "key", "title": "考点", "text": "小于35岁"}, {"type": "note", "variant": "key", "title": "考点", "text": "脉管浸润"}, {"type": "note", "variant": "key", "title": "考点", "text": "低分化肿瘤"}, {"type": "note", "variant": "key", "title": "考点", "text": "Her2（➕）"}, {"type": "p", "text": "方案：●TAC＞CAF 基石（8个周期） ＞C MF（6个周期）"}, {"type": "list", "items": ["内分泌治疗：ER（➕）PR（➕）"]}, {"type": "note", "variant": "key", "title": "考点", "text": "绝经前：他莫昔芬"}, {"type": "note", "variant": "key", "title": "考点", "text": "绝经后：来曲挫 （依西美 坦 补钙）"}, {"type": "list", "items": ["靶向治疗 ：Her2（➕）"]}, {"type": "note", "variant": "key", "title": "考点", "text": "赫赛汀（曲妥珠单抗）/"}, {"type": "p", "text": "前哨淋巴结活检指患侧腋窝中接受乳腺癌淋巴引流的第一站淋巴结，可采用示踪剂显示后切除活检。根据前哨淋巴结的病理结果预测腋淋巴结是否有肿瘤转移，对前哨淋巴结阴性的乳腺癌病人可不做腋淋巴结清扫。前哨淋巴结活检适用于临床腋淋巴结阴性的乳腺癌病人（D对）。前哨淋巴结活检的目的是判断乳腺癌有无淋巴结转移，与癌块大小无关（AB错）；若临床腋窝淋巴结阳性，则无需前哨淋巴结活检也能确定发生了淋巴结转移，必须做淋巴结清扫（C错）。"}, {"type": "p", "text": "癌细胞直接侵犯静脉引起远处转移，最常见的为骨、肺、肝；由于乳腺组织层次厚，一般通过直接侵犯累及肋骨者少，而由于椎旁静脉系的存在，乳腺癌的骨转移最常见于椎体、骨盆及股骨"}, {"type": "p", "text": "Paget病又称乳头湿疹样乳腺癌，是一种特殊类型的乳腺癌，原发灶在乳头区的大乳管内。"}, {"type": "p", "text": "椎旁静脉系统由椎内、外静脉丛及连接其间的椎体静脉和椎间静脉组成，该静脉系统缺乏静脉瓣膜，除在本系统内广泛吻合外，还与颅、颈、胸、腰、骶部的静脉交通，且本身压力较低，肿瘤易于通过此途径转移，通过此途径转移的肿瘤常见的有三种，自上而下分别是甲状腺癌、乳腺癌（B对）、前列腺癌。此知识点常考，需牢记。/三腺/"}, {"type": "p", "text": "/椎旁静脉转移："}, {"type": "p", "text": "甲状腺癌的颅骨转移"}, {"type": "p", "text": "乳腺癌的腰椎锥体转移"}, {"type": "p", "text": "前列腺癌的盆腔转移。/"}, {"type": "p", "text": "浆细胞性乳腺炎（B对）区别于一般的炎症性疾病，属于乳腺良性病变，是由于乳晕下导管有阻塞，引起导管扩张，管壁上皮萎缩，管内各种类脂质及细胞碎屑积聚腐蚀管壁，在管壁周围的脂肪组织内见有片状的浆细胞浸润；"}, {"type": "p", "text": "病变发展时有局部红、肿、痛等症状，并可触及肿块，也可见皮肤粘连、乳头回缩、局部水肿及腋窝淋巴结增大等征象，易误诊为乳腺癌；"}, {"type": "p", "text": "乳腺派杰病（C对）即乳头湿疹样乳腺癌，其恶性度低，发展缓慢，乳头有瘙痒、烧灼感，后发展为乳头和乳晕的皮肤变粗糙、糜烂如湿疹样，进而形成溃疡，有时有鳞屑样痂皮，累及乳头深层时可出现乳头内陷或溃烂，较晚发生淋巴结转移。"}, {"type": "p", "text": "急性乳腺炎（D错）是乳腺常见的炎症性疾病，主要表现为红肿、疼痛，感染位置较深则仅有深压痛，伴全身感染症状，但无乳头内陷表现"}, {"type": "p", "text": "乳管内乳头状瘤大部分病例发生发生在大乳管近乳头的壶腹部，瘤体小。而发生于中小乳管的乳头状瘤位于乳房周围区域，均不会引起乳头凹陷"}, {"type": "p", "text": "炎性乳癌（D对）的特点是发展迅速、预后差，局部皮肤呈炎症样表现，迅速扩散到乳房大部分皮肤，皮肤发红、水肿、增厚、粗糙、表面温度升高，由于其发展迅速，易出现淋巴结转移，与题目相符。乳汁淤积（A错）主要的表现是乳房胀痛，但是无红肿表现，是哺乳期较常见的现象，婴儿的吮吸即可缓解；"}, {"type": "p", "text": "炎性乳癌是乳腺癌的一种特殊类型，该肿瘤生长迅速，发展快，恶性程度高，预后差，治疗主要采用放疗及化疗，一般不做手术治疗"}, {"type": "p", "text": "胸部创伤"}, {"type": "p", "text": "未见反常呼吸运动，即病人肋骨骨折未形成连枷胸，骨折量较少，病人尚无需使用呼吸机以及手术固定肋骨治疗；胸片示右侧第8、9肋骨后端骨折，该位置靠近腹腔上方，有腹内脏器和膈肌损伤的可能，故给予腹部B超属必要（A对）。骨折以及软组织损伤导致呼吸时疼痛，病人无法正常自主呼吸，故需要给予镇静止痛治疗（B对）。牵引固定（C错）多适用于四肢及脊柱的骨折治疗，肋骨由于其形态和受力，不适合行牵引固定。胸带固定（D对）是常用的固定胸廓的方法，能减少肋骨断端活动、缓解疼痛，有助于病人保持自主呼吸的同时维持骨折处的稳定。"}, {"type": "p", "text": "张力性气胸：伤侧肺严重萎缩，纵膈显著向健侧移位，健侧肺受压，腔静脉回流障碍。病人表现为严重或极度呼吸困难、烦躁、意识障碍、大汗淋漓、发绀，为可迅速致死的危急重症（C对）。血气胸（D错）指气胸与血胸同时存在，一般不会导致患者迅速死亡，但值得注意的是，进行性血气胸也相当危险，应及时作开胸探查手术。"}, {"type": "p", "text": "穿刺部位需考生掌握，可以这样简单区分记忆：气体密度小，故应在胸腔上部，即锁骨中线第2肋间（A对）；液体密度高，处于胸腔底部，引流应选在腋中线与腋后线第6或第7肋间隙（B错）。挤压引流管是利用引流管内液体或空气冲击将堵塞引流管的血凝块或组织块冲出，以保持管腔通畅（C对）。深吸气时膈肌和肋间外肌收缩，胸廓扩大，深吸气后屏气胸膜腔空间最大，利于拔管"}, {"type": "p", "text": "食管疾病"}, {"type": "p", "text": "按病理形态，临床上食管癌可分为四型：缩窄型、溃疡型、髓质型、蕈伞型。缩窄型（又称硬化型）瘤体形成明显的环形狭窄，累及食管全部周径，较早出现阻塞症状"}, {"type": "p", "text": "/食管癌最多见→胸中段"}, {"type": "p", "text": "髓质型：向腔内外扩展， 恶性程度最高， 最多见。"}, {"type": "p", "text": "蕈伞型：向腔内扩展"}, {"type": "p", "text": "溃疡型：黏膜凹陷→梗阻最轻"}, {"type": "p", "text": "缩窄型/硬化型：环行狭窄→较早出现梗阻 最重 /"}, {"type": "p", "text": "胸中段食管癌较多见（C对），下段次之，上段较少。"}, {"type": "p", "text": "/"}, {"type": "p", "text": "总结了几个没考过但是很重要的考点， 总 结到这里吧。"}, {"type": "p", "text": "腐蚀性食管灼伤：病理分度(Ⅰ， Ⅱ，Ⅲ)，急 诊处理。"}, {"type": "p", "text": "原发性纵隔肿瘤：前中后纵膈的常见纵隔 肿瘤； 诊断价值最大的检查方法；治疗原 则。"}, {"type": "p", "text": "贲门失弛缓症：病理(与神经节、括约肌有 关，有癌变风险)；典型临床表现(间断性咽 下困难、胸骨后沉重感或阻塞感)；诊断(食 管吞钡造影示体部蠕动消失、下段及贲门 部呈鸟嘴状) ；非手术治疗没啥考点…手术 治疗(heller手术)。。。。。。"}, {"type": "p", "text": "没有展开来总结， 一定要好好看书去！！ ！！研友们，加油！/"}, {"type": "p", "text": "腐蚀性食管灼伤："}, {"type": "p", "text": "I度：黏膜表浅充血水肿，愈合不留瘢痕。"}, {"type": "p", "text": "II度：累及肌层， 遗留瘢痕，易致食管狭窄 。"}, {"type": "p", "text": "III度：累及全层＋周围组织凝固性坏死，可 导致食管穿孔和纵隔炎"}, {"type": "p", "text": "急救：保持呼吸通畅， 尽早吞服植物油或 蛋白水，早期应用糖皮质激素和抗生素"}, {"type": "p", "text": "原发性纵隔肿瘤："}, {"type": "p", "text": "前纵隔：皮样囊肿"}, {"type": "p", "text": "前上纵隔：胸腺瘤"}, {"type": "p", "text": "内脏器官纵隔（中纵隔） ：淋巴源性肿瘤 ，心包囊肿，支气管囊肿"}, {"type": "p", "text": "后纵隔：神经源性肿瘤"}, {"type": "p", "text": "治疗原则：绝大多数一确诊均应手术， 恶 性淋巴源性肿瘤首选放疗"}, {"type": "p", "text": "贲门失弛缓症："}, {"type": "p", "text": "病理(与神经节、括约肌有关 ， 有癌变风 险)；"}, {"type": "p", "text": "典型临床表现(间断性咽下 困难、胸骨后沉 重感或阻塞感) ；"}, {"type": "p", "text": "诊断(食管 吞钡造影示体部蠕动消失、下段 及贲门部呈 鸟嘴状)；"}, {"type": "p", "text": "手术治疗(Heller手术)/"}, {"type": "p", "text": "腹外疝"}, {"type": "p", "text": "腹外疝中，由于精索或子宫圆韧带经腹股沟管深环穿出的原因，使得此处的腹壁存在先天薄弱。在腹压增高时，腹腔内容物可经此先天薄弱处疝出，发生腹股沟斜疝（A对）。斜疝最为常见，占腹股沟疝的85％～95％，远多于腹股沟直疝（B错）。"}, {"type": "p", "text": "少数病程较长的疝，因疝的长期移动，导致疝囊颈周围结构松弛，以致盲肠、乙状结肠或膀胱随之下移而形成疝囊壁的一部分，这种疝称为滑疝，多见于右侧腹股沟，属于难复性疝（B对），滑动疝多见于右侧（A错），左右发病率之比约为1：6。滑疝疝内容物以大网膜最多见，腹外疝疝内容物以小肠最多见（C错）。腹股沟直疝常见于年老体弱者（D错），股疝多见于中年肥胖妇女。儿童的疝，因为疝环组织比较柔软，虽易嵌顿但不易绞窄（E错）。"}, {"type": "p", "text": "由于左侧睾丸较右侧睾丸下降早，鞘突闭锁也相对较早，因此左侧斜疝较右侧少（B对）。"}, {"type": "p", "text": "滑疝因疝内容物不能完全还纳，影响肠道蠕动以及肠内容物下行，可引起消化不良以及便秘的症状（D对）。"}, {"type": "p", "text": "腹股沟斜疝有先天性疝和后天性疝的区别。后天性斜疝常与后天性腹壁薄弱与缺损有关（C错，为本题正确答案）。此题不严谨，单纯把后天性斜疝归结为后天因素，也并非完全正确，某些潜在的先天的发育不全也是发病因素之一，如腹内斜肌弓状下缘发育不全或位置偏高对发病也起着重要作用。"}, {"type": "p", "text": "肠管壁疝指嵌顿的内容物仅为部分肠壁，系膜侧肠壁及其系膜并未进入疝囊，肠腔并未完全梗阻。股管为上宽下窄的漏斗形结构，上端称股环，下端为卵圆窝，由于股疝都是垂直的，疝块在卵圆窝处向前转折时形成以锐角，且股环本身较小，周围多有坚韧的韧带，因此股管容易发生嵌顿，又因股环本身较小，肠管不易完全进入，因而股疝（C对）常发生肠管壁疝。"}, {"type": "p", "text": "斜疝的疝囊颈比直疝狭小，因此嵌顿性疝多发生在斜疝（B对）。直疝多发生于年老体弱病人，腹内压增高时，易推挤腹腔前方的小肠和大网膜（C对）经直疝三角突出。难复性斜疝在临床表现方面除胀痛稍重外，其主要特点是疝块不能完全回纳（D对）。绞窄性疝若时间较长或疝囊内压力过高以及不当的手法复位，可导致疝囊内肠袢穿孔，疼痛可因疝块压力骤降而暂时有所缓解，病情因肠穿孔及腹膜炎反而更加严重"}, {"type": "p", "text": "（P326）“一岁以下婴幼儿可暂不手术。因为婴幼儿腹肌可随躯体生长逐渐强壮，疝有自行消失的可能。可采用棉线束带或绷带压住腹股沟管深环，防止疝块突出并给发育中的腹肌以加强腹壁的机会"}, {"type": "p", "text": "/既不结扎也不修补"}, {"type": "p", "text": "小于1岁，年老体弱不能手术"}, {"type": "p", "text": "只结扎不修复"}, {"type": "p", "text": "大于1岁小儿可以长好， 绞窄修补不愈合， 禁手术的情况不好修补不愈合"}, {"type": "p", "text": "只修复不结扎"}, {"type": "p", "text": "高张力疝修补"}, {"type": "p", "text": "其余结扎+修补 /"}, {"type": "p", "text": "绞窄性疝局部感染者，若行疝修补术，则容易导致感染，引起持续的炎症反应使伤口延迟愈合、易于裂开，因此一般不行疝修补术。急症时，仅作坏死肠管切除及疝囊高位结扎术。"}, {"type": "p", "text": "/前夫F，所以只要记住"}, {"type": "p", "text": "Ferguson疝修补术。 。。是修复前壁，其 余四个都是后壁就可以、"}, {"type": "p", "text": "Bassini疝修补术（后壁）、"}, {"type": "p", "text": "Halsted疝修补术（后壁）、"}, {"type": "p", "text": "Shouldice疝修补术（后壁）"}, {"type": "p", "text": "McVay疝修补术（后壁) /"}, {"type": "p", "text": "绞窄性疝（C对）因肠坏死而局部有严重感染，常使修补失败，因此，早期通常采取高位结扎，腹壁的缺损应在以后择期解决。"}, {"type": "p", "text": "疝的发病原因是疝囊及其内容物的突出，故需要把疝内容物回纳入腹腔，突出的疝囊高位切除、结扎（D对）；同时封闭疝突出的“门户”，即关闭疝门（B对）。腹股沟疝的发生原因是腹股沟管壁存在不同程度的薄弱区和缺损，加强腹股沟管管壁能从发病机制上解决问题（C对）。若内环口封闭，则疝内容物缺少了向外突出的途径，不可能突出体表，因此外环口无需修补"}, {"type": "p", "text": "几种特殊类型的嵌顿疝需要考生记忆，区别其不同主要看疝内容物的差别："}, {"type": "list", "items": ["Richter 疝（B 对）：嵌顿的内容物仅为部分肠壁；", "Littre 疝（A 对）：嵌顿的内容物为小肠憩室（通常是 Meckel 憩室）；", "逆行性嵌顿疝：嵌顿的内容物包括几段肠袢，呈现W 形。"]}, {"type": "p", "text": "嵌顿疝发生后，由于疝囊颈的相对狭窄，使得疝内容物（多数为肠管）的血供存在障碍，若长时间如此，势必发生肠内容物的缺血坏死，形成严重的并发症。故嵌顿性疝需紧急手术治疗，以防止疝内容物坏死并解除伴发的肠梗阻（D 对）。难复性疝（C 错）在临床表现方面除了胀痛稍重以外，主要特点是疝块不能完全回纳，并不存在血运障碍，不需要紧急手术治疗。"}, {"type": "p", "text": "（P329）“在腹外疝中，股疝（C对）嵌顿者最多，高达60％”。"}, {"type": "p", "text": "（P330）“股疝最常用的手术是McVay修补法（D对）。此法不仅能加强腹股沟管后壁而用于修补腹股沟疝，同时还能堵住股环而用于修补股疝"}, {"type": "p", "text": "/"}, {"type": "p", "text": "前F后B大屁股妹(M)："}, {"type": "p", "text": "加强前壁Ferguson法（front， 后壁腹，横 筋膜健全者）"}, {"type": "p", "text": "加强后壁Bassini法（basic最基础应用最广 泛） McVay法→股疝，绞窄W型(后壁严重 薄弱)"}, {"type": "p", "text": "Halsted法→将精索置于皮下（H-sex-精索 ）"}, {"type": "p", "text": "Shouldice法→加强腹横筋膜"}, {"type": "p", "text": "高位结扎：到内环口，腹膜外脂肪为标志"}, {"type": "p", "text": "小于1岁儿， 年老体弱有严重疾病：保守治 疗"}, {"type": "p", "text": "大于1岁儿，绞窄性疝：高位结扎"}, {"type": "p", "text": "嵌顿性疝：高位结扎+修补"}, {"type": "p", "text": "股疝：①McVay(包括股环高位结扎术及修 补术) ；②无张力修补（下地早恢复快、适 合腹压增高者、复发率低， 缺点：异物容 易排异感染）；③腹腔镜修补 /"}, {"type": "p", "text": "因此切口发生感染（D对）是发生切口疝的最主要原因"}, {"type": "p", "text": "即腹直肌切口处只有腹直肌一块肌性结构；腹直肌的走行是自上而下的，其收缩形成的张力也是上下方向的，经腹直肌切口是顺着腹直肌走行切开的切口，腹直肌收缩无法给予该切口足够大的水平方向的收缩力来使得切口闭合，多依靠缝合产生的张力牵拉切口两端闭合，故切口疝最好发于经腹直肌切口"}, {"type": "p", "text": "缺血性肠病的特征为严重的症状与轻微的体征不相符，但该患者第二天症状与体征同时出现"}, {"type": "p", "text": "腹部损伤"}, {"type": "p", "text": "腹部损伤可分为开放性损伤和闭合性损伤两类。其中，有腹膜破损者为穿透伤（多伴内脏损伤）（B对）（腹膜为腹腔表层的膜性组织，穿透后便意味着外界致伤物进入腹腔，腹腔内脏器均易受损伤）；无腹膜破损者为非穿透伤（偶伴内脏损伤）。"}, {"type": "p", "text": "不能把伤道想象为连接入、出口的直线来估计有无以及哪些脏器受伤，投射物常在行进中改变方向，病人在受伤瞬间的姿势也对伤道的走行产生很大影响，因此穿透伤的入、出口与伤道多呈不规则走行"}, {"type": "p", "text": "/直肠癌的直肠指诊：70%"}, {"type": "p", "text": "x线膈下游离气体阳性率：80％"}, {"type": "p", "text": "诊断性腹腔穿刺术和腹腔灌洗术：90％ /"}, {"type": "p", "text": "😂内位：脾胃空回盲横乙"}, {"type": "p", "text": "😱间位：肝胆升降子宫膀"}, {"type": "p", "text": "😒外位：其他"}, {"type": "p", "text": "😔PS：充盈膀胱间，空虚膀胱外"}, {"type": "p", "text": "注意手术探查指征中“腹痛或腹膜刺激征有进行性加重或范围扩大者”。仅仅提到“腹痛”（A错，为本题正确答案）不属于手术探查指征，腹痛作为腹部损伤最常见的症状，出现腹痛就要行手术探查显然不合理。肠鸣音消失（B对），提示可能存在腹膜炎导致的麻痹性肠梗阻，亦或是腹膜后血肿压迫腹腔神经节；膈下有游离气体（C对）为消化道穿孔的可靠征象；血压有下降趋势（D对）提示存在进行性出血；脉搏增快，体温升高提示全身情况有恶化趋势，以上情况均提示病情较重，须进行剖腹探查。只要严格掌握考点还原中所述指征，剖腹探查术所付出的代价是值得的。"}, {"type": "p", "text": "腹部闭合性损伤如肝脾破裂等，常合并出血性休克，由于休克的原因是实质性脏器破裂出血或大血管损伤，因此必需积极抗休克的同时手术探查（E对）。如不经术前补液、立即手术探查（A错），手术风险很大；如只行补液、输血并给止血药（B错）或输血并给抗生素（C错）等保守治疗，有许多病人出血并不能自止，从而失去抢救机会。有些病人出血量大、病情凶险，只有手术治疗才能彻底止血，使休克纠正，所以不能待休克纠正后再手术治疗"}, {"type": "p", "text": "脾是腹腔脏器最容易受损的器官之一，脾脏损伤发病率占腹部损伤的40％～50％（A对），其中真性破裂约占脾破裂的85％（B对）。"}, {"type": "p", "text": "脾是人体血供最丰富的器官之一，本身又质脆易受伤，多见真性破裂（破损累及被膜），损伤后大出血迅速导致休克危及生命，故需紧急手术治疗（C对）。"}, {"type": "p", "text": "因脾组织质脆难缝合，为挽救生命，常采用脾部分切除或脾全切。成人行脾切除术对免疫功能的影响轻微，暴发型感染的发病率不超过1％（D对）。"}, {"type": "p", "text": "脾切除后凶险性感染（OPSI）主要发生在婴幼儿，50％病人的致病菌为肺炎链球菌（E错，为本题正确答案）。脾作为腹部内脏最容易受损的器官，脾破裂的诊断和处理是腹部损伤一章中的常考点，部分数据考生需留意。"}, {"type": "p", "text": "轻度脾破裂时，出血量不大，可行单纯脾修补（B对）。"}, {"type": "p", "text": "腹腔为无菌环境，当外伤性脾破裂为闭合性损伤时，脾破裂所出的血无污染，可行自体血回输（C对）。"}, {"type": "p", "text": "儿童对感染的抵抗力弱，切脾后可发生以肺炎球菌为主要病原菌的脾切除后凶险性感染（OPSI），故可行自体脾片移植防止日后发生OPSI（D对）"}, {"type": "p", "text": "脾破裂出现失血性休克时提示出血量很大，且往往为进行性出血，单纯纠正失血性休克不能控制病情，应采取边纠正失血性休克边准备手术（A错）。"}, {"type": "p", "text": "立位腹平片（D错）若发现膈下新月状低密度影可辅助诊断消化道穿孔，但对于实质性脏器破裂出血缺乏诊断意义。"}, {"type": "p", "text": "胃穿孔（A错）及小肠破裂（B错）在腹部闭合性损伤少见，可引起继发性腹膜炎，出现板状腹及腹腔内积液及麻痹性肠梗阻，但早期一般无低血容量休克的表现"}, {"type": "p", "text": "腹部外伤致脾破裂，大量血液进入腹腔，血液为温和的腹膜刺激物，导致轻度的腹膜刺激征，并出现移动性浊音阳性，因循环血量减少，导致脉速及低血压。"}, {"type": "p", "text": "肝破裂（A错）可因失血导致脉细速及移动性浊音阳性，但胆汁为强烈的腹膜刺激物，多引起严强烈的腹膜刺激征。"}, {"type": "p", "text": "腹部闭合性损伤的探查顺序：应先探查肝、脾等实质性器官，同时探查膈肌、胆囊等有无损伤。接着从胃开始，逐段探查十二指肠第一段、空肠、回肠、大肠及其系膜。然后盆腔脏器，再切开胃结肠韧带显露网膜囊，检查胃后壁和胰腺。如有必要，最后还应切开后腹膜探查十二指肠二、三、四段/由上至下/"}, {"type": "p", "text": "急性化脓性腹膜炎"}, {"type": "p", "text": "腹膜的表面是一层排列规则的扁平间皮细胞（A错）。"}, {"type": "p", "text": "脏腹膜将内脏器官悬垂或固定于膈肌、腹后壁或盆腔壁，形成网膜、肠系膜及韧带等解剖结构（B错）。"}, {"type": "p", "text": "腹膜有很多皱襞，其面积几乎与全身的皮肤面积相等，约为1.7～2.0m²（C错）。"}, {"type": "p", "text": "壁腹膜主要受体神经的支配，对各种刺激敏感，痛觉定位准确（D对）。"}, {"type": "p", "text": "许多腹部手术在术后均采取坐位或半卧位，其目的就是将渗出液引流至盆腔，利用盆腔的吸收能力差的特点，使渗出液局限，减轻腹腔对其的吸收"}, {"type": "p", "text": "继发性腹膜炎（P345）“疼痛一般都很剧烈，难以忍受，呈持续性（A对B错）。深呼吸、咳嗽、转动身体时疼痛加剧（C错）。病人多不愿改变体位。疼痛先从原发病变部位开始（D错），随炎症扩散而延及全腹”。"}, {"type": "p", "text": "深呼吸、咳嗽、转动身体时疼痛加剧（C错）。病人多不愿改变体位。疼痛先从原发病变部位开始，随炎症扩散而延及全腹，而以原发病变部位为著（D错）。发热作为全身症状，往往在局部症状发展到一定程度、伴随炎症的扩散及毒素的吸收逐步体现出来，故通常为先腹痛后发热（E错）。"}, {"type": "p", "text": "/先痛后热→外科病（心梗也属于），先 热后痛→内科病。"}, {"type": "p", "text": "急性弥漫性腹膜炎→疼痛剧烈而持续， 改变体位可加重，原发病变部位显著→ 大肠杆菌最常见，一般都是混合性感染 →半卧位：局限脓液引流、避免压迫膈 肌利于呼吸循环、减少毒素吸收（和肠 粘连无关）→诊断性腹穿90%阳性率→ 标志性体征：肌紧张压痛反跳痛→腹式 呼吸减弱、肠鸣音减弱消失→恶化标志 ：腹胀加重（炸肚子boom！ ）→盆腔 脓肿：直肠刺激征/"}, {"type": "p", "text": "（P350）“正常人腹内压接近大气压，为5～7mmHg。腹内压≧12mmHg为腹腔高压，腹内压≧20mmHg伴有与腹腔高压有关的器官功能衰竭为腹腔间隔室综合征"}, {"type": "p", "text": "/正常5～7mmHg"}, {"type": "p", "text": ">=12 腹内压增加"}, {"type": "p", "text": ">=20 ACS"}, {"type": "p", "text": ">=25 开腹手术指征/"}, {"type": "p", "text": "/杜绝无用评论和不搞笑评论：有关20%的总结"}, {"type": "p", "text": "微循环占总循环血量的20%√"}, {"type": "p", "text": "失血有休克体征是全身总量20%√"}, {"type": "p", "text": "气胸观察：肺压缩量<20%√"}, {"type": "p", "text": "脾占门v的20%√"}, {"type": "p", "text": "二尖瓣狭窄合并房颤心排量下降20%→ 25%√"}, {"type": "p", "text": "脑的耗氧量占全身20%√"}, {"type": "p", "text": "肾小球滤过分数20%（19%）√"}, {"type": "p", "text": "Na+Cl+Ca2+的重吸收， 20%在髓袢70 %在近段小管√"}, {"type": "p", "text": "Ca2+在近端小管重吸收， 20%主动80 %被动√"}, {"type": "p", "text": "皮质脊髓束20%的纤维不跨中线，即皮 质脊髓前束√"}, {"type": "p", "text": "宫颈癌：20%腺癌 80%鳞癌√"}, {"type": "p", "text": "甲状腺癌：20%滤泡癌 60%乳头状癌√"}, {"type": "p", "text": "支气管激发试验：FEV1下降≥20%为阳 性√"}, {"type": "p", "text": "肺栓塞：只有20%出现呼吸困难，胸痛 ，咯血“三联征”√"}, {"type": "p", "text": "结核性胸膜炎胸水沉渣镜检找结核分枝 杆菌阳性率仅20%√"}, {"type": "p", "text": "不稳定型心绞痛冠脉造影左主干病变占 20%， 2支血管病变占20%，3支占40% ，单支血管病变10%√"}, {"type": "p", "text": "ST抬高心梗，休克发生率20%√"}, {"type": "p", "text": "二狭20%并发体循环栓塞√"}, {"type": "p", "text": "诊断腹腔间隔室综合症：腹内压（膀胱 内压）≥20mmHg√ /"}, {"type": "p", "text": "胃十二指肠疾病"}, {"type": "p", "text": "高选择性胃迷走神经切断术仅切断胃近端支配胃体、胃底的壁细胞的迷走神经，而保留胃窦部的迷走神经（主要为分布到胃窦，控制胃窦运动和幽门排空的“鸦爪”支）"}, {"type": "p", "text": "（P355）“胃溃疡多发生在小弯，常见于胃角处；也见于胃窦和胃体，大弯侧溃疡较为少见。十二指肠溃疡多见于球部”"}, {"type": "p", "text": "胆囊穿孔包裹积液（P464）（C 错）的患者曾有急性胆囊炎病史，未穿孔前即表现为右上腹绞痛或持续性疼痛伴阵发加剧，畏寒发热，右上腹局部压痛反跳痛，可触及肿大的胆囊，Murphy 征阳性。"}, {"type": "p", "text": "胰腺假性囊肿（P488）（A 错）多继发于胰腺炎或上腹部外伤后，上腹逐渐膨隆，腹胀，压迫胃、十二指肠引起恶心、呕吐，影响进食。若患者于一周前患胰腺炎，此时尿淀粉酶应该还未降为正常，且胰腺假性囊肿多位于胰体尾部而非位于肝下，故不考虑为胰腺假性囊肿。"}, {"type": "p", "text": "肝囊肿（P436）因生长缓慢可长期或终身无症状，常在 B 超检查时偶然发现，且巨大肝囊肿（D 错）一般大于 10cm"}, {"type": "p", "text": "口服液体石蜡油（C对）可润滑肠道，减轻枣核对肠腔黏膜的损伤，并促进肠道蠕动，加快异物排出。开腹探查（A错）、结肠镜检（B错）、胃镜检查（D错）仅用于上述治疗无效，且症状持续不缓解甚至加重的患者"}, {"type": "p", "text": "选择的手术方式须能同时解决患者存在十二指肠球部溃疡及幽门梗阻症状。胃大部切除术（A对）切除范围包括胃远侧的2/3～3/4并包括幽门、近胃侧部分十二指肠球部，切除产生溃疡部位的同时解决了梗阻问题。高选迷走神经切断术（B错）切断了支配胃体的迷走神经，保留了支配胃窦部的鸦爪支，可部分解决溃疡问题，但无法解决幽门梗阻。胃空肠吻合术（C错）仅能解除梗阻问题，术后溃疡仍存在，且胃空肠吻合口出可发生顽固性溃疡。迷走神经干切断术加胃窦部切除术（D对）不仅降低了胃酸分泌，且消除了梗阻部位，但现在临床应用较少。"}, {"type": "p", "text": "毕Ⅰ式是胃与十二指肠吻合，它比较符合原来的生理状况，术后胃肠道功能紊乱较少（D对）。"}, {"type": "p", "text": "毕Ⅰ式因其切胃量较毕Ⅱ式少，术后复发率相对高（E错），因此毕Ⅰ式只适用于低胃酸的胃溃疡的治疗（A错），毕Ⅱ式可用于胃溃疡及十二指肠溃疡，尤其是高胃酸的十二指肠溃疡治疗。"}, {"type": "p", "text": "毕Ⅰ式需牵拉断端在原位吻合，因而吻合口张力较大（B错）。"}, {"type": "p", "text": "行胃大部切除术后，胃酸降低，当十二指肠球部溃疡切除有困难时，可行溃疡旷置，术后未切除的溃疡仍可以愈合，此为Bancroft法，该法为毕Ⅱ式的优点"}, {"type": "p", "text": "胃大部切除术的范围包括胃远侧的2/3～3/4并包括幽门、近胃侧部分十二指肠球部，不难得出胃Ⅱ、Ⅲ型胃溃疡行胃大部切除的范围应不少于胃的60％（A对）。"}, {"type": "p", "text": "胃肠吻合口直径一般为3～4cm（B错），过大易发生倾倒综合征，过小影响胃排空。"}, {"type": "p", "text": "毕Ⅱ式胃大部切除术切除了溃疡的好发部位及泌酸的大部分胃体，因而溃疡复发率低（C错）。"}, {"type": "p", "text": "高选择性胃迷走神经切断术不需附加引流手术，因其未切断支配胃窦部迷走神经的鸦爪支，术后无排空障碍、无胃潴留；选择性迷走神经切断术并未保留鸦爪支，术后需要作胃引流手术"}, {"type": "p", "text": "由胃窦部溃疡直径 1.5cm 可知胃溃疡直径较小，且位于较为常见的胃窦部。"}, {"type": "p", "text": "胃溃疡由于胃酸常不增高，因而首选切胃量较少，且不改变消化道正常生理结构的毕Ⅰ式胃大部切除术（A 对）。"}, {"type": "p", "text": "高胃酸的十二指肠溃疡常选用切胃量较多的毕Ⅱ式胃大部切除术（B错）"}, {"type": "p", "text": "胃术后输入袢梗阻，胆汁及胰腺分泌的消化液淤积在十二指肠残端，当腹内压升高时，可有胆汁呕出，因输出袢通畅，食物通过无障碍，因此呕吐物没有食物。"}, {"type": "p", "text": "吻合口梗阻（A错）时，食物无法通过吻合口，而胆汁可通过输出袢下行，多表现为呕吐食物，不含有胆汁的液体。"}, {"type": "p", "text": "输出袢梗阻（C错）时，胆汁和食物均无法通过输出袢下行，呕吐物既有胆汁，又有食物。"}, {"type": "p", "text": "倾倒综合征（D错）包括早期倾倒综合征和晚期倾倒综合征。"}, {"type": "p", "text": "早期倾倒综合征多发生在进食后半小时，表现为心悸、出冷汗面色苍白等血容量不足的表现，可能与高渗性胃内容物过快进入肠腔导致肠道内分泌细胞大量分泌血管活性物质有关；"}, {"type": "p", "text": "晚期倾倒综合征发生在进食后2～4小时，主要表现为低血糖综合征，可能与食物进入肠道后刺激胰岛素大量分泌，导致反应性低血糖。"}, {"type": "p", "text": "呕吐大量胆汁样液体，吐后症状缓解，诊断考虑慢性输入袢梗阻"}, {"type": "p", "text": "急性输入袢梗阻（A错）时，因少量瘀滞即可导致十二指肠残端内压力升高，早期即出现疼痛及呕吐，呕吐物量少，不含胆汁"}, {"type": "p", "text": "碱性反流性胃炎常发生于毕Ⅱ式手术后(1~2y)，原因是胃空肠吻合后，正常解剖结构改变，失去幽门-十二指肠的抗返流屏障，碱性胆汁、胰液、肠液流入胃中，破坏胃黏膜屏障，导致胃黏膜充血，水肿、糜烂等改变。临床主要表现为，上腹或胸骨后烧灼痛、呕吐胆汁样液和体重减轻。因炎症主要有胆汁反流引发，因此针对胃酸的抗酸剂治疗无效。"}, {"type": "p", "text": "胃癌除了转移至胃周淋巴结外，还有两处跳跃式淋巴结转移的常见部位："}, {"type": "p", "text": "一是左锁骨上淋巴结，如触及肿大为癌细胞沿胸导管转移所致，又称Virchow淋巴结（D对）；"}, {"type": "p", "text": "二是脐周淋巴结，如触及肿大为癌细胞通过肝圆韧带淋巴管转移所致。"}, {"type": "p", "text": "脾门淋巴结（A错）转移、肝总动脉淋巴结（B错）转移、腹腔淋巴结（C错）转移均属于胃的区域淋巴结转移。"}, {"type": "p", "text": "（P364）“胃切除范围：胃切断线要求距肿瘤肉眼边缘5cm以上；远侧部癌应切除十二指肠第一部3～4cm，近侧部癌应切除食管下端3～4cm”。"}, {"type": "p", "text": "/外科常考6-8"}, {"type": "p", "text": "6-8h一期愈合"}, {"type": "p", "text": "6-8h断指断指再植"}, {"type": "p", "text": "6-8w植骨"}, {"type": "p", "text": "6-8h血肿凝成块"}, {"type": "p", "text": "6-8%乳管内乳头状瘤会癌变"}, {"type": "p", "text": "每搏输出量60-80ml"}, {"type": "p", "text": "开放性骨折伤后6-8小时不宜内固定"}, {"type": "p", "text": "6-8小时后， 化学性腹膜炎发展为细菌性腹 膜炎"}, {"type": "p", "text": "6-8h阑尾炎从上腹转移到右下腹麦氏点"}, {"type": "p", "text": "胃十二指肠穿孔如果非手术治疗6-8h无好 转，需手术"}, {"type": "p", "text": "儿童烧伤补液60-80ml/kg"}, {"type": "p", "text": "胃癌根治术手术切除最少距离肿瘤6-8cm/"}, {"type": "p", "text": "胃肠间质瘤是消化道最常见的间叶源性肿瘤，来源于间质细胞（D错）。肿瘤组织免疫组化检测CD117（+）（A对）和CD34过表达。肿瘤预后与肿瘤部位、大小（C对）、细胞有丝分裂指数（核分裂象）（B对）、肿瘤浸润深度和有无转移相关。"}, {"type": "p", "text": "小肠疾病"}, {"type": "p", "text": "蛔虫团堵塞（B对）在肠腔内引起梗阻是单纯的机械性梗阻，无血运障碍和肠道坏死，由于蛔虫自身存在运动，以及未受损的肠壁有一定的运动能力，故通常为不完全肠梗阻"}, {"type": "p", "text": "一段肠管两侧完全阻塞的肠梗阻称为闭袢性肠梗阻，由于支配肠管的血管受压，闭袢容易发生缺血、绞窄坏死。对于结肠来说，回盲瓣具有单向活瓣作用，即结肠的内容物不能反流回小肠，若出现结肠段的梗阻，则此梗阻段与回盲瓣之间形成两端闭塞的密闭肠腔，因此横结肠癌（C对）在其发生部位若形成梗阻，便会形成闭袢性肠梗阻。乙状结肠扭转（B对）形成O形受累肠段，扭转部位之间形成密闭肠腔，即发生闭袢性肠梗阻。肠蛔虫堵塞（A错）、小肠套叠（D错）均为肠梗阻原因，但不会造成闭袢性梗阻。/小肠套叠不是，结肠套叠是/"}, {"type": "p", "text": "痉挛性肠梗阻（C错）很少见，多见于急性肠炎、肠道功能紊乱或慢性铅中毒病人，腹痛在痉挛时表现为持续性，同时可出现肠鸣音亢进，但不会出现金属音调。/痉挛没有堵住，动力出现了问题/"}, {"type": "p", "text": "绞窄性肠梗阻X射线显示膨胀突出的孤立肠袢位置固定，不随时间变化。/已无血运和蠕动/"}, {"type": "p", "text": "呕吐呈反射性，吐出物为食物或胃液（E错，为本题正确答案）为早期高位肠梗阻或急性胃肠炎的表现。"}, {"type": "p", "text": "粘连越广，发生肠梗阻的几率越大，并不是肠梗阻越严重"}, {"type": "p", "text": "肠扭转是一种较严重的机械性肠梗阻，可在短时期内发生绞窄、坏死；若不能得到及时正确的处理，将有较高的死亡率；及时手术治疗，将扭转的肠袢回转复位，可降低死亡率。对于该病人，肿物致小肠扭转，可当机立断，在病人病情尚未恶化时，行肠切除吻合术（B对），将肿块切除、扭转小肠复位，或将肿物与扭转小肠共同切除。及时复位（A错）可减低死亡率，但患者有梗阻，不宜采取（注：小肠扭转一般采用Ⅰ期肠切除吻合术，结肠扭转一般采用Ⅰ期造瘘，Ⅱ期肠切除吻合）。"}, {"type": "p", "text": "乙状结肠扭转钡剂灌肠X线检查见扭转部位钡剂受阻，钡影尖端呈“鸟嘴”形（C对）；"}, {"type": "p", "text": "不同疾病的钡剂灌肠X线表现需掌握："}, {"type": "p", "text": "“中断”多见于早期食管癌，表现为局限性食管黏膜皱襞增粗、中断（A错）；"}, {"type": "p", "text": "回结肠套叠，钡剂灌肠可见受阻端钡影呈“杯口”（B错）状或“弹簧”状阴影；"}, {"type": "p", "text": "克罗恩病的X线钡餐表现为裂沟状深溃疡，黏膜呈鹅卵石样，病变呈跳跃式，而狭窄部呈线状征（D错）；"}, {"type": "p", "text": "胰头癌行低张十二指肠钡剂造影患者可见“倒3征”（E错）。"}, {"type": "p", "text": "急性出血坏死性胰腺炎（A错）为左上腹疼痛，伴左肩、左腰部放射痛，血清及腹穿淀粉酶一般增高（正常值约40～80 U/dL）。"}, {"type": "p", "text": "/血淀粉酶正常不超过200，急性胰腺炎超过 3倍才有意义， 发病6小时后开始升高（辅 助记忆2乘3得6） .急性坏死性胰腺炎虽然 血淀粉酶升高不明显， 但是腹穿的淀粉酶 肯定是高的，题出的还是很好的/"}, {"type": "p", "text": "肠扭转部分在其系膜根部，以顺时针方向旋转多见"}, {"type": "p", "text": "小肠扭转（C错）多见于青壮年，腹痛常位于脐周，呕吐较频繁，腹胀一般不明显，与该患者表现不符。"}, {"type": "p", "text": "腹痛、发热、黄疸（A错）为Charcot三联征，见于急性胆管炎"}, {"type": "p", "text": "腹痛、脓血便、发热（B错）可见于肠阿米巴病。"}, {"type": "p", "text": "腹痛、血便、里急后重（C错）可见于痢疾以及溃疡型结肠炎。"}, {"type": "p", "text": "血便、腹部肿块、发热（E错）可见于部分肠道肿瘤患者。"}, {"type": "p", "text": "阑尾疾病"}, {"type": "p", "text": "（P387）“腰大肌试验…说明阑尾位于腰大肌前方，盲肠后位或腹膜后位（C对）”。（P387）“闭孔内肌试验…提示阑尾靠近闭孔内肌"}, {"type": "p", "text": "患者疑似急性阑尾炎，McBurney点压痛对确诊最有价值（B对），因为右下腹压痛是急性阑尾炎最常见的重要体征，而且压痛点通常位于麦氏点，即McBurney点。"}, {"type": "p", "text": "右下腹固定压痛是诊断急性阑尾炎最有意义的体征（A对）。结肠充气试验阳性（C错）为急性阑尾炎辅助诊断体征，且阴性不能排除诊断。"}, {"type": "p", "text": "急性阑尾炎发病已四天，腹痛稍减轻，但仍发烧，右下腹可触及有压痛的肿块，应诊断为阑尾脓肿，当急性阑尾炎已被延误诊断超过 48 小时，形成炎性肿块，表明病变局限，病情已有改善，应暂不手术，促进肿块吸收，再考虑择期切除阑尾，盲目手术会使炎症扩散。给予广谱抗生素治疗，可促进炎症的局限和吸收（D 对）。立即手术、切除阑尾（A错）是急性阑尾炎的治疗原则。"}, {"type": "p", "text": "阑尾切除术后，引流较少应用，仅在局部有脓腔，或阑尾残端包埋不满意及处理困难时采用，如果有肠瘘形成，肠内容物可从引流管流出"}, {"type": "p", "text": "腹腔内出血（B错，为本题正确答案）是阑尾切除术的并发症之一，是由阑尾系膜的结扎线松脱，引起系膜血管出血导致，而非急性阑尾炎的并发症。腹腔脓肿（A对），内瘘（C对）、外瘘形成（D对），门静脉炎（E对）都急性阑尾炎可发生的并发症。"}, {"type": "p", "text": "（P391）“急性阑尾炎的并发症：（1）腹腔脓肿（A对）…（2）内、外瘘形成（CD对）…（3）化脓性门静脉炎（E对）”。（P391）“阑尾切除术后并发症：（1）出血（B错，为本题正确答案）”。"}, {"type": "p", "text": "小儿大网膜发育不全，不能起到足够的保护作用；腹肌发育欠缺，力量较小，无法产生明显的肌紧张表现；患儿也不能清楚的提供病史，故小儿急性阑尾炎没有右下腹明显压痛和肌紧张的典型体征（A错，为本题正确答案）。由于缺乏大网膜的保护，加上小儿自身的免疫系统尚不健全，阑尾处炎症反应产物和细菌感染易于扩散，故小儿病情发展快且较重，早期即出现高热、呕吐等症状（B对），阑尾穿孔率也较高，可达30％（C对），并发症和死亡率较高（D对）。小儿急性阑尾炎治疗原则是早期手术（E对），并配合输液、纠正脱水、应用广谱抗生素等。"}, {"type": "p", "text": "妊娠期阑尾炎若不及时治疗，炎症发展易导致流产或早产，威胁母子生命安全，治疗以手术治疗为主（A错，为本题正确答案），妊娠早期以阑尾切除术为主，后期的腹腔感染难以控制，更应早期手术（B对）；围术期加用黄体酮（C对），因为黄体酮可以抑制子宫的收缩，从而起到保胎的作用。手术切口须偏高，操作要轻柔，以减少对子宫的刺激（D对），因为妊娠时子宫逐渐增大，将盲肠和阑尾推挤向右上腹移位。妊娠是一个特殊阶段，孕妇一旦发生术后感染，则严重威胁母子生命，故需预防性术后使用广谱抗生素"}, {"type": "p", "text": "/测量妊娠子宫大小"}, {"type": "p", "text": "从孕期3月末开始，每月测一次(12 16 20 2 4 28 32 36 40周) 从耻骨联合上2-3横指开 始，每次增加两横指。"}, {"type": "p", "text": "三月联合上二三(12周耻骨联合上2-3横指) 脐耻(16) 脐下(20)脐上一(24) 脐三(28)脐突 (32)剑下二(36)/"}, {"type": "p", "text": "老人急性阑尾炎体征不典型，体温和白细胞升高均不明显，容易延误诊断和治疗，需要尽早手术"}, {"type": "p", "text": "此处病人出现气液平面是由于病人肠道本身存在一定的气体，又发生腹泻，稀便成为X线片的液相部分"}, {"type": "p", "text": "/我的总结，深得李 睿言传身教"}, {"type": "p", "text": "急性单纯性阑尾炎，经麦氏口切！"}, {"type": "p", "text": "急性化脓性阑尾炎， 经麦氏口切！脓汁用 纱布蘸干净。 （口诀:急兰麦口，不冲不引 ）"}, {"type": "p", "text": "急性穿孔性阑尾炎——腹膜炎:右侧经腹直肌 纵形切口， 切阑尾，留置引流（也冲也引 ） ，冲洗是用生理盐水冲，不能用抗生素 冲，否则引起腹膜粘连。"}, {"type": "p", "text": "阑尾周围脓肿， 一般由于未经及时治疗导 致。"}, {"type": "p", "text": "稳定——抗生素"}, {"type": "p", "text": "不稳定——切开引流， 三个月之后再切 除阑尾。"}, {"type": "p", "text": "X片气液平面→1. 来的多，腹泻。2.去的少 ，肠梗阻。 /"}, {"type": "p", "text": "结直肠与肛管"}, {"type": "p", "text": "直肠息肉是一类从直肠黏膜表面突出到直肠腔内的隆起状病变。直肠息肉可分为：①肿瘤性息肉，包括管状腺瘤（A）、绒毛状腺瘤、混合性腺瘤（E），有恶变倾向；②非肿瘤性息肉，包括增生性息肉、炎性息肉（C错）、儿童性息肉（B错）等，无恶变倾向。一般认为，绒毛状腺瘤（D对）的癌变率最高。"}, {"type": "p", "text": "CEA即血清癌胚抗原，是胎儿胃肠道产生的一组糖蛋白，在结肠癌、胃癌、肺癌、乳癌中升高，对直肠癌疗效判断、病情发展、监测和预后估计是一个较好的肿瘤标志物，但其特异性不强，灵敏度不高，对肿瘤早期诊断作用不明显。"}, {"type": "p", "text": "术前CEA指标正常不能作为缩小切除范围的依据（D错，为本题正确答案），直肠癌的外科治疗是主要的治疗方法，直肠癌的切除范围包括癌肿在内的两端足够肠段（低位直肠癌的下切缘应距肿瘤边缘2cm）、全部直肠系膜或至少包括癌肿下缘5cm的直肠系膜、周围淋巴结及浸润润的组织。"}, {"type": "p", "text": "CEA主要用于检测复发。通过CEA早期检查复发患者，结合放射学检查，可提高手术切除率和帮助结肠癌的预后判断，术后CEA未明显下降说明可能有肿瘤的残留（B对），当它水平升高时通常意味着残存肿瘤术后复发（C对）。"}, {"type": "p", "text": "CEA的分期与TNM分期呈正相关，TNMⅠ期、TNMⅡ期、TNMⅢ期、TNMⅣ期病人的血清CEA阳性率依次分别是25%、45%、75%和85%左右，即CEA的阳性率与结肠癌的分期有关（A对）（二版八年制外科学P587）。"}, {"type": "p", "text": "结肠癌是胃肠道中常见的恶性肿瘤，治疗原则是以手术切除（结肠癌根治性手术最常见）为主的综合治疗，在胃肠道肿瘤中预后最好（A对）。"}, {"type": "p", "text": "右侧结肠癌一般以全身症状、贫血、腹部肿块为主要表现（B错），左侧结肠癌一般以肠梗阻、便秘、腹泻、便血等症状为显著（C错）。结肠癌主要经淋巴转移（D错）。"}, {"type": "p", "text": "大肠癌Dukes分期："}, {"type": "p", "text": "A仅限于黏膜层"}, {"type": "p", "text": "B无淋巴结转移，侵及肌层无穿透为B1，穿 透为B2"}, {"type": "p", "text": "C有淋巴结转移， 侵及肌层无穿透为C1， 穿透为C2"}, {"type": "p", "text": "D有远隔脏器转移，要Death了"}, {"type": "p", "text": "患者为低位结肠癌，肠梗阻一周，此时全身及肠道局部情况较差，不宜行一期肠切除吻合术（B错），否则可能引起术后肠瘘，宜选用肠造口术（D对）以解除肠梗阻，待全身及肠道状况好转后二期切除肿瘤。"}, {"type": "p", "text": "患者肠梗阻系降结肠肿物导致，此时近端肠管充血水肿严重，不宜行一期根治术，否则由于肠道准备不充分，肠管血运较差，术后容易出现吻合口愈合不良，甚至出现吻合口瘘。"}, {"type": "p", "text": "结肠癌仅有肝转移者，根治性切除术后，有长期存活甚至治愈的可能。该患者结肠癌累及浆膜层，但未穿破肠壁，可以行根治性结肠切除术。CT示仅左肝外叶存在3cm转移灶，可以行左肝外叶切除术（D对B错）。术后可予以辅助化疗，可获得较好疗效。仅行全身化学疗法（A错）多用于晚期无法手术切除病灶的患者。结肠造瘘术（C错）主要用于治疗左侧结肠癌合并急性肠梗阻。"}, {"type": "p", "text": "直肠癌是乙状结肠直肠交界处至齿状线之间的癌，直肠癌发生率比结肠癌高（A错，为本题正确答案）。"}, {"type": "p", "text": "低位直肠癌所占比例高，约占直肠癌的2/3～3/4（B对）。"}, {"type": "p", "text": "绝大多数癌肿可在直肠指诊时触及（C对）。"}, {"type": "p", "text": "直肠癌大体类型可分为溃疡型、隆起型、浸润型，其中溃疡型癌约占直肠癌全部类型的1/2以上。"}, {"type": "p", "text": "Miles手术（腹会阴联合直肠癌根治术）（A错）适用于肿块下缘距肛缘小于5cm患者，在部分肿瘤大、浸润明显患者，肿块下缘距离肛缘7cm者亦可行Miles手术。"}, {"type": "p", "text": "Dixon手术（经腹腔直肠癌切除术）适用于距离肛缘5～7cm以上患者。该患者直肠癌块下缘距离肛门12cm，用经腹腔直肠癌切除术（B对）可以保留患者的肛门，术后生活质量较高。"}, {"type": "p", "text": "经腹直肠癌切除、近端造口、远端封闭手术（Hartmann手术）（C错）适用于因全身一般情况很差，不能耐受Miles手术或急性肠梗阻不宜行Dixon手术的直肠癌病人。"}, {"type": "p", "text": "拉下式直肠癌切除术（D错）适用于直肠癌块下缘距肛缘7～10cm患者。"}, {"type": "p", "text": "乙状结肠造口术（E错）用于解除远端梗阻，并保护远端肠管的吻合或损伤，促进肠道愈合。"}, {"type": "p", "text": "/Miles腹会阴联合直肠癌根治术→距齿 状线5cm以下（肛管癌是它的绝对适应 证）→切光光永久性造口"}, {"type": "p", "text": "Dixon经腹直肠癌切除术→距齿状线5c m以上（我牙齿不好）→目前应用最多 、保留肛门、若术后一段时间排便控制 差可先造口一阵子→要求远端切缘距癌 肿下缘2cm以上（切瘤子最2了）"}, {"type": "p", "text": "Hartmann经腹直肠癌切除、近端造口 、远端封闭手术→适合 全身情况差不 耐受Miles 或 急性梗阻不宜行Dixon者"}, {"type": "p", "text": "肛管长度也就1.5-2cm"}, {"type": "p", "text": "切缘距肿瘤边缘→胃癌＞5㎝、结直肠 息肉＞1㎝、直肠癌＞2㎝ /"}, {"type": "p", "text": "老年患者，肠梗阻4天，术中发现近段结肠扩张、水肿，此时病人全身情况一般很差，不能耐受Miles手术，急性肠梗阻又不宜行Dixon手术。此时合理的手术方式为Hartmann手术（D对），即经腹直肠癌切除、近端造口、远端封闭手术，留待二期还纳。直肠癌并发肠梗阻急诊手术时，可行乙状结肠双腔造口，而非横结肠造口"}, {"type": "p", "text": "肛裂、前哨痔和齿状线上相应的乳头肥大称为肛裂“三联征”（B对）。"}, {"type": "p", "text": "肛裂是齿状线下肛管皮肤层裂伤后形成的小溃疡，并不累及深部肌层（A错）。"}, {"type": "p", "text": "肛裂的主要症状是排便时剧痛（C错），典型表现为便时肛管刀割样或烧灼样疼痛，便后数分钟缓解，随后肛门括约肌痉挛，再次出现剧痛。排便时出血为痔的主要症状。"}, {"type": "p", "text": "肛裂绝大多数发生在肛管后正中部（D错），原因是：①肛管外括约肌浅部在肛门后正中形成的肛尾韧带伸缩性差、坚硬且血供较差；②肛管与直肠成角相延续，排便时，肛管后壁承受的压力最大。"}, {"type": "p", "text": "肛裂的治疗包括非手术治疗（保持局部清洁；通畅润滑大便；局麻解除括约肌痉挛等）及手术治疗（E错），只有迁延不愈、保守治疗无效以及症状严重患者才考虑手术治疗。"}, {"type": "p", "text": "肛管直肠周围软组织内或其周围间隙内发生急性化脓性感染，并形成脓肿，称肛管直肠周围脓肿。肛门周围脓肿（A对）即肛周皮下脓肿，是肛管直肠周围脓肿最常见类型，约占48%"}, {"type": "p", "text": "肛旁脓肿（P415）（B错）即肛周皮下脓肿，主要症状是肛周持续性胀痛，排便、咳嗽、下坐或受压时疼痛加重，行走不便，而无发热、白细胞升高等全身症状轻。"}, {"type": "p", "text": "根据瘘管与括约肌的关系，将肛瘘分为以下四类："}, {"type": "list", "items": ["肛管括约肌间型（B对），最常见，约占肛瘘的70%；", "经肛管括约肌型（A错），约占25%；", "肛管括约肌上型（C错），较少见，约占4%；", "肛管括约肌外型（D错），最少见，仅占0.5%。"]}, {"type": "p", "text": "/齿状线上:骶正中A，直肠上A，直肠下A"}, {"type": "p", "text": "齿状线下:肛管A"}, {"type": "p", "text": "直肠分段:腹膜返折/齿状线上5.10.15"}, {"type": "p", "text": "肛瘘(间)和血栓性外痔可以出血，但是出血 ≠便血。"}, {"type": "p", "text": "内痔出血脱出 外痔肛门不适有瘙痒，无血 便"}, {"type": "p", "text": "肛裂和内痔有鲜血"}, {"type": "p", "text": "肛瘘是脓性分泌物"}, {"type": "p", "text": "对于肛瘘："}, {"type": "p", "text": "1看到低位就是切， 单纯就切除，非单纯就 切开"}, {"type": "p", "text": "2看到高位就是挂线， 单纯就挂线，非单纯 就切+挂线"}, {"type": "p", "text": "3看到单纯都可以挂线"}, {"type": "p", "text": "肛裂:便时及便后剧痛(非手术:解痉止痛帮 助排便；手术:切除/切断"}, {"type": "p", "text": "内痔:无痛出血——蹲位视诊，非指诊"}, {"type": "p", "text": "血栓性外痔:剧痛无出血"}, {"type": "p", "text": "内扎外剥，无症状不治"}, {"type": "p", "text": "原发性内痔好发部位有三个，位于齿状线上方的右前、右后、左正中，即为截石位3、7、11点(膝胸位1 5 9)"}, {"type": "p", "text": "内痔的主要供应血管是直肠上动脉"}, {"type": "p", "text": "直肠下动脉（B错）、骶（正）中动脉（D错）为齿状线以上直肠的次要供血动脉。肛管动脉（C错）为齿状线以下直肠的供血动脉。"}, {"type": "p", "text": "外痔（P420）（D错）的主要表现为肛门不适、潮湿不洁，有时瘙痒，一般无便血。"}, {"type": "p", "text": "肝疾病"}, {"type": "p", "text": "胆囊炎、胆管炎及各种原因引起的胆道（A对）感染诱发的细菌性肝脓肿约占肝脓肿的21.6%-51.5%，可以认为，细菌性肝脓肿大部分是胆源性肝脓肿。"}, {"type": "p", "text": "细菌性肝脓肿的最常见致病菌为大肠杆菌（革兰氏阴性杆菌）及金黄色葡萄球菌（B错）。"}, {"type": "p", "text": "细菌性肝脓肿的脓液多为黄白色脓液，涂片和培养可发现细菌。"}, {"type": "p", "text": "脓液多为棕褐色，涂片可能无细菌（C错）为阿米巴性肝脓肿的特征。"}, {"type": "p", "text": "细菌性肝脓肿脓腔较小，常为多发性。"}, {"type": "p", "text": "多见于右叶，单发（D错）为阿米巴性肝脓肿的特征。"}, {"type": "p", "text": "手术切开引流具有其适应证（P429）：适用于较大脓肿，估计有穿破可能，或已穿破胸腔或腹腔；胆源性肝脓肿；位于肝左外叶脓肿，穿刺易污染腹腔；以及慢性肝脓肿。经及时抗感染治疗，小脓肿多能吸收消失。经皮肝穿刺脓肿置管引流术适用于单个较大的脓肿。可见，手术并非唯一有效的方法（E错）。"}, {"type": "p", "text": "血清 ALT121U/L（正常值小于40 U/L），Tbil58μmol/L（正常值不超过17.1μmol/L）（存在肝功能损伤），CT示肝内多发直径 1～2cm低密度灶，边缘强化明显（细菌性肝脓肿的典型CT表现），诊断考虑多发性肝脓肿"}, {"type": "p", "text": "肝癌根据肿瘤大小可分为以下四类："}, {"type": "list", "items": ["微小肝癌（直径≤2cm）；", "小肝癌（＞2cm，≤5cm）；", "大肝癌（＞5cm，≤10cm；", "巨大肝癌（＞10cm）。"]}, {"type": "p", "text": "甲胎蛋白（C对）（以下简称AFP）是诊断肝细胞癌特异性的标志物，阳性率约70%，现已广泛用于肝癌的普查、诊断、判断治疗效果及预测复发。在排除妊娠和生殖腺胚胎瘤的基础上，血清AFP≥400ng/ml为诊断肝癌的条件之一；对AFP逐渐升高不降或＞200ug/L，持续八周，应结合影像学及肝功能变化做综合分析或动态观察"}, {"type": "p", "text": "癌胚抗原（A错）是胎儿胃肠道产生的一组糖蛋白，在结肠癌、胃癌、肺癌、乳癌均可增高，也可用于大肠癌的术后复发的监测。"}, {"type": "p", "text": "ALT在心肌细胞内也含量较高，心肌梗死（E错）时心肌细胞损伤可释放，使血ALT升高。"}, {"type": "p", "text": "门静脉高压征"}, {"type": "p", "text": "门静脉压力升高时，首先出现充血性脾大（B错，为本题正确答案），当压力进一步升高时，可出现交通支扩张。"}, {"type": "p", "text": "肝功能减退使肾上腺皮质的醛固酮和神经垂体抗利尿激素在肝内分解减少，血内水平升高，促进肾小管对钠和水的重吸收，因而引起钠水潴留"}, {"type": "p", "text": "诊断为乙型肝炎肝硬化门静脉高压症合并脾功能亢进。患者门静脉高压症尚未出现出血症状，目前倾向于不作预防性手术（BC错），重点应为内科保肝治疗（D对），因为肝炎后肝硬化病人的肝功能损害多较严重，任何一种手术对病人都是负担，甚至引起肝功能衰竭。患者脾大至肋缘，说明脾脏为轻度肿大，无需行脾切除术"}, {"type": "p", "text": "/且听老夫讲下思路， 考点一网打尽，可以 把书丢了"}, {"type": "list", "items": ["门脉高压治疗的目地是预防， 控制食管 胃底静脉破解出血。", "肝功能分A.B。C（只要有黄疸，腹水）C 级严禁手术（分流，断流）", "对有大出血风险的AB级采用手术。 分流 ［非选择性是讲门静脉与下腔静脉直接连 接， 所以肝脑风险高（30%-50%）选择性 分流是将脾静脉与肾静脉连接， 缓解了门 静脉压力， 同时没有阻断肠系膜上下静脉 ， 肝脑风险低］断流是脾切除，同时阻断 门静脉， 奇静脉之间的血流，以脾切除加 贲门周围血管离断术（冠状， 胃短，胃后 ， 左隔下）为佳，急诊以贲门周围血管离 断术为首选。", "对于C级：内镜治疗（食管曲张静脉套炸 术， 是控制急性出血首选，但对胃底效果差）⇒药物治疗（ 生长抑素， 奥曲肽）⇒三腔管压迫（对食 管下段出血效果好， 对胃底效果差，因面 积太大，牵引重量为0.25-0.5Kg，病人应测 卧或头偏转， 持续时间不能超过3-5天，每 隔12h放气10-20min，可使80%出血得到控 制） ⇒TIPS（相当于将门静脉与下腔静脉 连接， 所以肝脑风险高20-40%,适用于药物 ， 内镜治疗无效，肝功能差，等待肝移植 ）", "对一般情况好， 没有明显症状，不做预 防性手术，以内科护肝为主。 /"]}, {"type": "p", "text": "三腔二囊管对食管下段压迫止血效果较明显，对胃底曲张静脉压迫效果欠佳。"}, {"type": "p", "text": "患者已存在腹水及黄疸症状，说明肝功能差，不适宜行急诊分流（A错）或急诊断流（B错），因为术后肝性脑病发生率及死亡率较高。曲张静脉套扎（C错）用于食管静脉曲张破裂效果好，但是对胃底曲张静脉破裂出血效果差。TIPS（D对）即经颈静脉肝内门体分流术，主要用于顽固性腹水和肝硬化门静脉高压症、食管胃底静脉曲张破裂大出血的治疗，其创伤小，止血效果确切，特别适用于肝功能差的病人。"}, {"type": "p", "text": "/Peutz-Jeghers综合征→肠息肉伴口周肛周 手足色素沉着→ps一点色素吧"}, {"type": "p", "text": "Gardner综合征→肠息肉伴多发性骨瘤和多 发性软组织瘤→gay易得结肠息肉却是硬骨 头"}, {"type": "p", "text": "Budd-Chiari 综合征→巴徳-吉亚利综合征， 下腔静脉阻塞， 门脉高压，腹水黄疸→BB C的人肝不好"}, {"type": "p", "text": "Zolinger-Elison→胃泌素瘤→ZE姬芮味蜜 /"}, {"type": "p", "text": "/胆汁： 分泌 刺激因素"}, {"type": "p", "text": "外科题目， 胆管细胞也可以分泌； 促胰液 素最强"}, {"type": "p", "text": "生理题目， 只能肝细胞分泌; 胆盐最强（ 食物中高蛋白最强）/"}, {"type": "p", "text": "胆囊具有浓缩及吸收功能，胆囊容积虽然只有40～60ml，但24小时内能接纳约500ml胆汁（B对）。成人每日分泌胆汁800～1200ml"}, {"type": "p", "text": "PTC采用直接胆道注射显影剂，不受肝功能和血胆红素浓度的影响，故适用于黄疸较重、肝功能差的病人检查。"}, {"type": "p", "text": "超声探查肝内胆管（＞4mm）、肝外胆管（＞10mm）有无扩张，可判定胆道梗阻部位及原因。本例超声显示肝内胆管普遍扩张，胆总管直径1.5cm（正常值0.6～0.8cm），肝内多发中低回声是梗阻性黄疸最直接的证据（A对）。胰头部有3cm×4cm×5cm大小的中低回声区（B错），提示胰头部有占位性病变，为梗阻性黄疸的间接性证据。胆囊大小3.5cm×6.5cm（C错）为胆囊萎缩的B超征象（正常胆囊大小为宽3～5cm，长5～8cm）。胆囊内强回声伴声影（D错）为胆囊结石的B超征象。胰管直径0.4cm（正常胰管直径为0.2～0.3cm）（E错）说明胰管梗阻扩张，并非梗阻性黄疸的直接证据，亦可由Vater壶腹梗阻引起。"}, {"type": "p", "text": "先天性总胆管囊肿现在称为先天性胆管扩张症，是指肝内胆管或（和）肝外胆管的先天性囊状扩张，好发于胆总管。其病因与先天性胰胆管合流异常、共同通道过长、慢性胰液胆管反流、胆管黏膜损伤、慢性炎症和胆管壁变薄有关。扩张的囊壁常因炎症、胆汁潴留以致发生溃疡，甚至癌变，其癌变率为10%，随着年龄的增长，囊肿壁的癌变率明显增高，故需尽早手术，囊肿完全切除、空肠胆管R-Y 吻合术（B对）为最常用的术式。"}, {"type": "p", "text": "/胆道畸形(今年新增)："}, {"type": "list", "items": [""]}, {"type": "p", "text": "先天性总胆管囊肿现在称为先天性胆管扩 张症："}, {"type": "p", "text": "以1型(囊性)扩张最常见。"}, {"type": "p", "text": "典型表现：腹痛，黄疸，腹部肿块"}, {"type": "p", "text": "其癌变率为10%，故需尽早手术，"}, {"type": "p", "text": "囊肿完全切除、空肠胆管R-Y 吻合术为最常 用的术式。(胆管十二指肠吻合已经淘汰)"}, {"type": "list", "items": [""]}, {"type": "p", "text": "先天性胆道闭锁：(儿童肝移植适应征)"}, {"type": "p", "text": "新生儿持续性黄疸最常见病因， 肝外胆道 闭锁最常见，女性多余男性；"}, {"type": "p", "text": "表现：梗阻性黄疸(新生儿黄疸1-2周仍不消 退反而加重)；肝脾肿大；白陶土大便"}, {"type": "p", "text": "术式：同上+Kaisai肝门空肠吻合+肝移植 /"}, {"type": "p", "text": "胆管结石（D错）需行胆总管切开取石、T管引流术，可采用开腹或腹腔镜手术，若患者合并胆囊结石，才行腹腔镜胆囊切除术。"}, {"type": "p", "text": "/书上发病在2 到3天以内急性胆囊炎(95%以上有胆囊结石)首选腹腔镜胆囊切除术/"}, {"type": "p", "text": "胆总管探查指征为："}, {"type": "p", "text": "胆总管存在梗阻；"}, {"type": "p", "text": "术中证实胆总管存在病变；"}, {"type": "p", "text": "胆总管扩张，直径超过1cm，胆囊壁明显增厚，发现胰头肿物；"}, {"type": "p", "text": "胆囊结石小，有可能通过胆囊管进入胆总管。"}, {"type": "p", "text": "胆囊切开取石（A错）术后复发率高，且引起胆汁性腹膜炎的可能性较大。"}, {"type": "p", "text": "伴有糖尿病（D对）的胆囊结石病人，无论其有无症状，在出现糖尿病的心血管、肾的并发症之前将胆囊切除比出现并发症之后手术更为安全。"}, {"type": "p", "text": "总胆管探查后放置T管，其原因有"}, {"type": "p", "text": "胆道减压引流、预防术后胆漏；"}, {"type": "p", "text": "减少胆汁对切口和乳头部的刺激，有利于探查后乳头部的炎症消退（B对）和胆道切口的愈合（A对）；"}, {"type": "p", "text": "作为支撑预防胆管狭窄；"}, {"type": "p", "text": "便于经窦道取出残余结石（D对）。"}, {"type": "p", "text": "放置T管后，进入小肠后的胆汁量减少，可引起脂类物质的消化吸收障碍（胆盐可乳化脂肪，有利于脂类的吸收），不利于消化功能的恢复（C错），故需嘱病人低脂饮食。"}, {"type": "p", "text": "患者拔管后出现持续性右上腹痛伴肌紧张（腹膜刺激征表现），最可能的原因是胆汁自瘘口漏出，引起胆汁性腹膜炎（B对）。胆道痉挛（A错）的疼痛多为阵发性，不会引起腹肌紧张，且胆道痉挛一般与拔除T管无关。"}, {"type": "p", "text": "ERCP加EST取石（A对）为此时最好的处理方法，能够直接取出致病结石，通畅胆道，并且手术损伤小，术后恢复快。"}, {"type": "p", "text": "/PTCD:经皮肝穿刺胆道引流"}, {"type": "p", "text": "ERCP:内镜逆行性胰胆管造影"}, {"type": "p", "text": "EST:内镜下十二指肠乳头括约肌切开术/"}, {"type": "p", "text": "肝内胆管结石是胆管结石的一种类型，是指左右肝管汇合部以上各分枝胆管内的结石。由于胆管解剖位置的关系，左侧结石比右侧多见（A错），左侧最常见的部位是左外叶、右侧为右后叶，与此两肝叶的肝管与肝总管汇合的解剖关系导致的引流不畅相关。"}, {"type": "p", "text": "肝内胆管结石易进入胆总管并发肝外胆管结石（B对）。"}, {"type": "p", "text": "单侧胆管阻塞时，由于病变范围较小，其余肝组织可代偿此部分肝组织的功能，可不出现黄疸（C对）。"}, {"type": "p", "text": "肝内胆管结石引起的胆管阻塞、胆汁淤积可出现疼痛，多表现为肝区和胸背部疼痛（D对）。"}, {"type": "p", "text": "急性胆囊炎可有上腹部或右上腹部阵发加剧的持续疼痛（B对）。"}, {"type": "p", "text": "突发剑突下剧烈疼痛、阵发性伴钻顶感，间歇期不痛（A错）为胆道蛔虫症（P463）的疼痛特点。"}, {"type": "p", "text": "上腹持续剧痛伴左肩、腰、背牵拉痛（C错）为急性胰腺炎（P484）的疼痛特点。"}, {"type": "p", "text": "食后上腹胀痛、伴呕吐（D错）常见于幽门梗阻（P357）或高位肠梗阻（P375）"}, {"type": "p", "text": "急性非结石性胆囊炎多见于老年男性（A错），应区别于急性结石性胆囊炎，后者女性多见。"}, {"type": "p", "text": "临床表现类似急性结石性胆囊炎，但病情发展更为迅速（B对），穿孔及坏疽发生率高（D对），一经诊断，应及早手术治疗。"}, {"type": "p", "text": "长期肠外营养时，胃肠道缺乏食物刺激，导致包括缩胆囊素在内的胃肠激素分泌减少，导致胆囊排空障碍，长期胆汁淤积及缺血可导致非结石性胆囊炎的产生（C对）。"}, {"type": "p", "text": "胆道与门静脉分属两个管腔系统，并无直接交叉，因而急性化脓性胆管炎一般不会直接并发门静脉炎（A错）。"}, {"type": "p", "text": "/主要得明白一点在于，阑尾在肠系膜包 绕，他的血管间接连着门静脉，从那的 细菌可以进门静脉，而胆道最多胆汁返 流入血，这个是返流到肝血窦里，继而 可以进入肝静脉。"}, {"type": "p", "text": "在第一肝门，门静脉，肝总管，肝固有 动脉进入，在里面分别分支汇合进入肝 血窦，经过肝血窦的dise间隙进入肝细 胞发生生化反应之后汇入肝静脉，进入 下腔静脉。所以胆道感染只能引起全身 各系统炎症，是不太可能从肝血窦返流 回门静脉的，毕竟门静脉一般来说还是 从肝外流到肝内的。 /"}, {"type": "p", "text": "重症胆管炎的严重临床表现与导管内高压导致胆汁及细菌向血液反流有关。重症急性胆管炎进展迅速，须早期采取积极的措施。原则是紧急手术（E对），切开胆总管减压，去除结石解除梗阻和通畅引流胆道。"}, {"type": "p", "text": "/由急性化脓性梗阻性胆管炎(=重症胆管炎)引起 ，感染 可引起白细胞总数升高， 以中性粒细胞为 主，其比例升高明显，排除AB"}, {"type": "p", "text": "感染性休克， 有弥散性血管内凝血，消耗 血小板"}, {"type": "p", "text": "肝细胞产生血小板生成素， 肝细胞受损肝 功能降低，血小板生成减少."}, {"type": "p", "text": "严重感染也会同时抑制骨髓造血功能./"}, {"type": "p", "text": "胆囊炎通常有发热无寒战， 有部分人有轻 度黄疸， 而西综考试默认胆囊炎没有黄疸 。希望对你有帮助/"}, {"type": "p", "text": "感染性休克常伴代谢性酸中毒，酸性内环境对心肌、血管平滑肌和肾功能均有抑制作用，故在给予扩容和血管活性药物均无起色的情况下应注重内环境的调节，纠正酸中毒。"}, {"type": "p", "text": "考虑急性化脓性胆管炎，其典型表现为Reynolds五联征（B对），包括寒战高热、腹痛、黄疸、休克及神经系统抑制表现。"}, {"type": "p", "text": "Charcot三联征（P456）（A错）为胆管炎的典型表现，包括寒战高热、腹痛、黄疸。"}, {"type": "p", "text": "Whipple 三联征（P492）（C错）为胰岛素瘤的典型表现，包括空腹或运动后低血糖症状；症状发作时血糖低于2.8mmol/L；进食或静脉推注葡萄糖可迅速缓解症状。"}, {"type": "p", "text": "重症急性胆管炎的发展有时异常迅猛，因此应早期采取积极的措施。若不及时解除胆道梗阻，则不可能阻止胆汁或细菌向血液的反流，无法阻止病情的恶化，因此，不能先保守治疗，待休克纠正后手术（D错，为本题正确答案）。恰当的处理原则是紧急手术，切开胆总管减压，去除结石、解除梗阻、通畅引流胆道，即急诊探查总胆管并引流（B对）。在病人生命体征允许的情况下，AOSC也可采用ENBD（A对）（经鼻胆管引流术）或PTCD（C对）（经皮肝穿刺胆道外引流术）"}, {"type": "p", "text": "由梗阻造成的胆道感染患者，尿胆红素阳性，血胆红素升高，尤其是直接血胆红素升高，ALP升高，肝功能改变，因此发热时查肝功能（B对）对诊断胆道是感染有一定的提示意义。"}, {"type": "p", "text": "根据患者既往行胆总管囊肿切除术+胆肠Roux-Y吻合术（该术式吻合口一般位于肝门）既往史，可推测此次发病为高位胆管梗阻引起的急性重症胆管炎。PTCD（D对）操作简单，能及时减压，对较高位胆管或非结石性阻塞效果较好，可作为首选治疗措施。ERCP置管引流（B错）创伤小，能有效降低胆管内压，对低位胆管阻塞效果较好，但对于高位胆管梗阻引起的胆管炎引流效果不肯定。"}, {"type": "p", "text": "胆囊息肉样变是指来源于胆囊壁并向胆囊腔内突出或隆起的病变，主要包括胆囊息肉、胆囊腺肌增生症和胆囊腺瘤三种。胆囊息肉恶变的危险因素包括：直径＞1cm（D错）、生长迅速（E错）；单发（A错）病变且基底部宽大；合并胆囊结石和胆囊壁增厚等，特别是年龄超过50岁；息肉外形不规则状（C错）及局部增厚者；息肉位于胆囊底部者。"}, {"type": "p", "text": "多发（B对）性胆囊息肉常支持良性息肉的诊断。"}, {"type": "p", "text": "/福利收好不谢！"}, {"type": "p", "text": "应积极切除胆囊的有:"}, {"type": "list", "items": ["有症状的胆囊结石尤其是＞3cm的", "单发宽基底d＞1cm的胆囊息肉", "瓷化胆囊", "腺瘤样息肉"]}, {"type": "p", "text": "胆囊息肉恶变的危险因素:"}, {"type": "list", "items": ["单发宽基底d＞1cm", "息肉逐渐增大", "合并胆囊结石和胆囊壁增厚", "年龄＞50"]}, {"type": "p", "text": "d＜2cm的息肉→LC"}, {"type": "p", "text": "d＞2cm的息肉或怀疑恶变的→剖腹手术"}, {"type": "p", "text": "胆囊结石需要手术的:"}, {"type": "list", "items": ["多发结石或结石＞2~3cm", "胆囊息肉＞1cm", "胆囊壁增厚(＞3mm)即慢性胆囊炎", "胆囊壁钙化或瓷化胆囊"]}, {"type": "p", "text": "急性胆囊炎急诊手术指征:"}, {"type": "list", "items": ["发病时间48-72h内", "非手术无效或恶化的", "胆囊穿孔，急性弥漫性腹膜炎"]}, {"type": "p", "text": "AOSC，急性坏死性胰腺炎"}, {"type": "p", "text": "胆囊穿孔以底部多见，颈部次之"}, {"type": "p", "text": "胆囊癌以体部底部多见 /"}, {"type": "p", "text": "腹腔内的肿瘤一般均以腺癌多见。"}, {"type": "p", "text": "胆囊癌病例中，腺癌约占82%，其中又以硬性腺癌较多见（C对）。"}, {"type": "p", "text": "胆囊癌的病因尚不清楚，临床观察胆囊癌常与胆囊良性疾患同时存在，最常见是与胆囊结石共存，胆结石越大胆囊癌的危险性越高，约70%胆囊癌并存胆囊结石（A错）。"}, {"type": "p", "text": "胆囊癌好发于胆囊体部及胆囊底部（B错）。"}, {"type": "p", "text": "胆道疾病多见于女性，胆囊癌亦不例外，男女比例约1：3～4（D错）。"}, {"type": "p", "text": "总体来讲，胆囊癌手术预后较差（E错），后期生存率仍然较低，术后患者很少生存半年以上。"}, {"type": "p", "text": "胆囊癌（C对）是胆道最常见的恶性病变，在未形成梗阻和周围浸润的情况下，无特异性症状：不伴感染则无发热症状；不伴梗阻则无黄疸和肝酶升高；病人实验室检查可见CEA、CA19-9、CA125等升高，以CA19-9最敏感。"}, {"type": "p", "text": "胆管癌一般是指原发于左、右肝管至胆总管下段的肝外胆管癌，不包括肝内的胆管细胞癌、胆囊癌和壶腹部癌。其发病可能与下列因素有关：肝胆管结石，约1/3的胆管癌合并胆管结石，而胆管结石5%～10%发生胆管癌；原发性硬化性胆管炎；先天性胆管囊性扩张（E对），胆管囊肿空肠吻合术后；肝吸虫感染，慢性伤寒带菌者，溃疡性结肠炎等。"}, {"type": "p", "text": "根据肿瘤生长的位置，胆管癌又分为上段胆管癌、中段胆管癌、下段胆管癌。上段胆管癌比下段发病率高（A对），分别约占50%～75%及10%～20%。胆管癌以上段胆管癌最为多见，而胆总管结石以下段最为多见，需注意区分。"}, {"type": "p", "text": "胆管癌特征总结如下：病理组织大多是腺癌（B对），分化好，肿瘤生长缓慢，多呈小灶性，并直接浸润相邻组织，即局限型生长较多（C对）；或沿肝内、外胆管及其淋巴分布和流向转移，并沿肝十二指肠韧带内神经鞘浸润是其转移的特点；亦可发生腹腔种植转移，血行转移较少见。"}, {"type": "p", "text": "黄疸、尿色变深以及皮肤瘙痒均提示病人存在胆色素排泄障碍。肝脏下缘触感正常情况下为较锐软组织，即使肝硬化病人，肝脏下缘（A错）触感也仅为变硬和不再锐利，不会以圆形肿块的形式出现。胰头部肿瘤（C错）极难从体表被触及，且较固定，不会随着呼吸上下运动。胆总管囊肿（D错）虽然能够造成梗阻表现，但是其难以通过体表触诊被扪及。胆道梗阻使得胆汁难以排出，除了使得血胆色素浓度上升外，多余无法排除的胆汁会积聚在胆囊中，造成胆囊膨大；胆囊位于肝脏下方，离体表较近，平时被肝叶覆盖，不易触及；当胆囊因梗阻积液肿大时，即可扪及。老年男性患者，出现黄疸及右上腹无痛性肿块，且随呼吸上下运动，考虑胰头部肿瘤引起的Courvoisier征，即无痛性胆囊（B对）增大。因为胆总管下段被胰头部包绕，胰头部肿瘤可直接浸润或压迫胆管导致胆总管梗阻，导致上段胆管扩张以及胆囊无痛性肿大。/本例是胰头癌，但触及的肿物不是胰头癌，是肿大的胆囊/"}, {"type": "p", "text": "上消化道大出血"}, {"type": "p", "text": "胃、十二指肠溃疡又称消化性溃疡，其出血占上消化道出血的40～50%，大出血的溃疡一般位于胃小弯或十二指肠球后壁（B对），都是由于溃疡基底血管被侵蚀破裂所致，多数为动脉性出血。"}, {"type": "p", "text": "选择性血管造影（C对）是将造影剂注入血管，出血速度在0.5ml/min以上就能见到造影剂从血管破口外溢进入肠腔的影像，发现出血病变和部位的阳性率较高；还能通过导管滴入血管收缩药物或注入栓塞剂进行止血治疗。"}, {"type": "p", "text": "核素扫描（D错）可用于诊断微量出血及间歇性出血，但只能显示出血在腹部某个区域，而不能判断确切的出血部位，亦不能明确病变的性质，且无法治疗出血。"}, {"type": "p", "text": "对于有黄疸、大量腹水、肝功能严重受损的病人发生大出血，尤其是对肝功能储备Child C级的病人，如果立即手术（B错，为本题正确答案），死亡率很高，可达60～70%。对于这类病人应尽量采用非手术治疗。"}, {"type": "p", "text": "/child C级=肝硬化+腹水 禁止手术🌟🌟🌟"}, {"type": "p", "text": "记住了 再错一耳巴/"}, {"type": "p", "text": "胰腺疾病"}, {"type": "p", "text": "在我国引起急性胰腺炎最主要的病因为胆道疾病，称胆源性胰腺炎，约占50%以上。在西方国家，酒精中毒/酗酒（B）是引起急性胰腺炎的主要原因。"}, {"type": "p", "text": "急性胰腺炎有多种致病因素："}, {"type": "p", "text": "胆道疾病是国内最主要的原因，占50%，发病原因就是“共同通道”受阻，胆汁逆流入胰管，动物实验显示胆盐可直接导致腺泡细胞质钙离子增高，引起腺泡细胞坏死或胰管内高压诱发急性胰腺炎（A对）。"}, {"type": "p", "text": "在西方国家，酒精中毒是急性胰腺炎的主要原因，乙醇能直接损伤胰腺（B对），还可刺激胰液分泌、引起十二指肠乳头水肿和Oddi括约肌痉挛。"}, {"type": "p", "text": "ERCP检查可引发胰腺炎（C对），因为其需要经过共同通道逆行检查，为有创检查，可致十二指肠乳头水肿，壶腹部排出不畅，引起胆汁及胰液反流入腺泡，损伤胰腺实质，导致急性胰腺炎。"}, {"type": "p", "text": "高脂血症、高血钙及与妊娠有关的代谢、内分泌和遗传等均为胰腺炎的致病因素，但其发病机制暂不明确（D对）。"}, {"type": "p", "text": "消化性溃疡只有在后壁穿孔并波及胰腺时才可能引起胰腺炎，极为少见。"}, {"type": "p", "text": "急性胰腺炎为上腹持续剧痛伴左肩、腰、背牵拉痛（C对）。"}, {"type": "p", "text": "突发剑突下剧烈疼痛、阵发性伴钻顶感，间歇期不痛（A错）为胆道蛔虫症（P463）的腹痛特点。"}, {"type": "p", "text": "上腹部或右上腹部阵发加剧的持续疼痛（B错）为急性胆囊炎（P459）的腹痛特点。"}, {"type": "p", "text": "重症急性胰腺炎可能出现的并发症包括："}, {"type": "list", "items": ["胰腺及胰周组织坏死；", "胰腺脓肿（A对）；", "胰腺假性囊肿（B对）；", "胃肠道瘘；", "腹腔出血（C对）；", "腹腔间隔室综合征（D对）。"]}, {"type": "p", "text": "胰腺假性囊肿多是急性胰腺炎所引起的，少数由腹部损伤引起（A错）。"}, {"type": "p", "text": "肿块形成过程如下：胰腺实质或胰管破裂，胰液外溢，伴随血性和炎性渗液，刺激胰腺周围的腹膜，引起纤维组织增生逐渐形成囊壁将其包裹。囊壁上没有上皮细胞覆盖，因此无分泌的功能（B错）。"}, {"type": "p", "text": "主要体征是上腹包块（C对），表现为上腹部半球形、光滑，不移动，囊性感的肿物，合并感染时有发热和触痛。"}, {"type": "p", "text": "胰腺假性囊肿经检查除外恶性后，可暂予非手术治疗。其外科治疗的适应证包括："}, {"type": "list", "items": ["出现出血、感染、破裂、压迫等并发症；", "囊肿增大（≥6cm）；", "非手术治疗无效；", "多发性囊肿；", "囊肿壁厚；", "合并慢性胰腺炎及胰管狭窄。"]}, {"type": "p", "text": "一般须待囊肿壁成熟后（6周以上）再作内引流或外引流术"}, {"type": "p", "text": "/胰腺炎4周出现腹部包块→假性囊肿"}, {"type": "p", "text": "2-3周出现持续高热→胰腺脓肿 /"}, {"type": "p", "text": "患者诊断为急性胰腺炎。增强CT（A对）是胰腺炎最具诊断价值的影像学检查，不仅能诊断急性胰腺炎，而且能鉴别出是否合并胰腺坏死。此外，CT对急性胰腺炎并发症如胰腺脓肿和假性囊肿等也具有较高的诊断价值。"}, {"type": "p", "text": "/首选简便B超，确诊CT/"}, {"type": "p", "text": "急性胰腺炎的非手术治疗适用于急性胰腺炎全身反应期，水肿性及尚无感染的出血坏死性胰腺炎，其中禁食、补液、胃肠减压（D对）是最首要的治疗方式，可减少包括胃泌素、缩胆囊素、促胰液素在内的胃肠激素的分泌，从而减少胰液的分泌，有利于胰腺炎症的恢复及组织修复。此外，胃肠减压还可防止呕吐、减轻腹胀，降低腹内压。"}, {"type": "p", "text": "急性胰腺炎手术治疗适应证为："}, {"type": "list", "items": ["急性腹膜炎不能排除其他急腹症时；", "胰腺和胰周坏死组织继发感染；", "伴胆总管下端梗阻或胆道感染者；", "合并肠穿孔、大出血或胰腺假性脓肿。对于胆源性胰腺炎，手术方式包括胆囊切除+胆总管探查+胰周坏死组织清除+引流术。"]}, {"type": "p", "text": "胰腺癌恶性程度很高，不易早期发现，切除率低和预后差为本病的特点，即使在可切除患者中，5年生存率亦不到5%（A对）。"}, {"type": "p", "text": "多数胰腺癌可出现多种血清学标记物升高，包括CA19-9、CA24-2、CA50、CEA等，其中以CA19-9的阳性率较高，最常作为胰腺癌的辅助诊断和术后随访的指标，可视为胰腺导管腺癌的主要血清标记物（D对）。"}, {"type": "p", "text": "胰腺导管腺癌术中放射治疗可用于杀死残留的肿瘤细胞，防止复发，提高手术疗效，体外放射治疗可以用于术前或术后，尤其是对不能切除的胰体尾部癌，经照射后可缓解顽固性疼痛（实用外科学P766），胰腺导管腺癌对放疗不太敏感，但放疗可使30%～50%患者腹痛和背痛得到缓解，并在一定程度上抑制肿瘤的发展（实用内科学P2065），也有主张以放射治疗为基本疗法的综合性治疗，本题C选项有争议。"}, {"type": "p", "text": "以前应用最多的化疗药物是氟尿嘧啶，近年来吉西他滨是胰腺导管腺癌首选化疗药物。"}, {"type": "p", "text": "肝炎（A错）可引起肝细胞性黄疸，一般不出现胆囊肿大。"}, {"type": "p", "text": "胆石症（P454）（B错）一般表现为阵发性上腹部剧烈疼痛，黄疸为波动性，并非进行性加重。"}, {"type": "p", "text": "慢性胰腺炎（P487）（D错）典型临床表现为腹痛、体重下降、糖尿病、脂肪泻，仅少数病人可因胰头纤维增生，可压迫胆总管而出现黄疸。"}, {"type": "p", "text": "肝癌（P433）（E错）引起的黄疸说明癌肿发展已压迫胆道，此时癌肿巨大，可在肋弓下缘触及体积增大的肝脏，而病人腹部触诊时肝未触及，故排除。"}, {"type": "p", "text": "/胰头癌–晚期进行性黄疸"}, {"type": "p", "text": "壶腹癌–早期波动性黄疸"}, {"type": "p", "text": "胆管周围癌–早期进行性黄疸"}, {"type": "p", "text": "十二指肠腺癌–晚期轻度黄疸"}, {"type": "p", "text": "胆管炎–痛性波动性黄疸"}, {"type": "p", "text": "胆管癌–无痛性持续性黄疸"}, {"type": "p", "text": "胆囊炎，胆囊结石–无黄疸"}, {"type": "p", "text": "肝内胆管结石–黄疸不明显"}, {"type": "p", "text": "肝外胆管结石–有黄疸 /"}, {"type": "p", "text": "上腹不适常为首发症状，早期因肿块压迫胰管，使胰管不同程度梗阻、扩张、扭曲及压力增高，出现上腹部不适，或上腹部隐痛（D对）、钝痛、胀痛。"}, {"type": "p", "text": "脂肪泻（A错）多见于慢性胰腺炎或者胰腺癌晚期，不是首发症状。因为胰腺功能衰竭，胰酶分泌较少，导致包括脂肪在内的营养物质消化障碍，肠道渗透压增高，出现脂肪泻。"}, {"type": "p", "text": "黄疸为胰头癌最主要的症状，多数由胰头癌压迫或直接浸润胆总管引起，呈进行性加重。黄疸（B错）需待胆道严重梗阻时才会出现，多数病人出现黄疸时已属中晚期。"}, {"type": "p", "text": "消瘦、贫血等为恶病质表现，早期胰头癌对全身影响较小，不能引起恶病质，因而早期大多不出现贫血"}, {"type": "p", "text": "胰岛素瘤是胰岛B细胞组成的肿瘤，因为B细胞分泌胰岛素，大量的胰岛素释放进入血流，引起以低血糖为主的一系列症状，其典型表现为Whipple三联征（C对）： 空腹或运动后出现低血糖症状；症状发生时血糖低于2.8mmol/L（50mg/dl）；进食或静脉推注葡萄糖可迅速缓解症状。"}, {"type": "p", "text": "Charcot三联征（B错）为急性胆管炎的典型表现，包括腹痛、寒战高热、黄疸。"}, {"type": "p", "text": "Peutz-Jeghers综合征（C错）亦称黑斑息肉病，特点为胃肠道多发性息肉伴口腔黏膜、口唇、口周、肛周及双手指掌、足底黑色素沉着，以小肠息肉为主，约30％的病人有结直肠息肉，与消化性溃疡发生无关。"}, {"type": "p", "text": "Budd-Chiari综合征（D错），指布加综合征，由各种原因所致肝静脉和其开口以上，下腔静脉阻塞性病变引起的常伴有下腔静脉高压为特点的一种肝后门脉高压症。急性期病人有发热、右上腹痛、迅速出现大量腹腔积液、黄疸、肝大，肝区有触痛，少尿。"}, {"type": "p", "text": "胰岛素瘤90%以上为单发圆形肿瘤（七版黄家驷外科学P1853页）（A对）。"}, {"type": "p", "text": "胰岛素瘤90%以上为良性肿瘤（D对）。"}, {"type": "p", "text": "手术是唯一根治性治疗手段（C对），一经诊断，手术应尽早施行。"}, {"type": "p", "text": "胰腺内分泌肿瘤的良恶性仅从组织、细胞形态学上很难区别，主要取决于有无侵袭周围组织、器官或（和）发生转移等"}, {"type": "p", "text": "周围血管疾病"}, {"type": "p", "text": "血栓闭塞性脉管炎，是一种慢性、非粥样硬化性、节段性、炎性、闭塞性、与吸烟相关的血管疾病。主要侵袭腘动脉以及肱动脉以远的中、小动静脉（B对），本病常侵及邻近的或表浅的静脉或神经，病人多为男性青壮年（A对），多有长期吸烟史。其主要病理特点是动脉血栓形成及受累动静脉的非化脓性炎症。发病前或发病过程中出现复发性游走性浅静脉炎（D对），肢体缺血症状多是周期性发作（C对），可由寒冷潮湿环境诱发，肢体复温后可稍缓解。在影像学检查中，受累血管壁的钙化在X片中往往显示不清。X线检查显示动脉有钙化斑（E错，为本题正确答案）常见于动脉硬化性闭塞症，钙盐可沉积于发生粥样硬化的动脉壁内，属于营养不良性钙化。"}, {"type": "p", "text": "血管杂音多由大血管血流改变导致，而血栓闭塞性脉管炎主要侵袭腘动脉以远及肱动脉以远的中、小动静脉，因此无血管杂音的存在（B错）。"}, {"type": "p", "text": "血栓闭塞性脉管炎和动脉硬化性闭塞症都有下肢供血不足，因而都可有间歇性跛行（B错）、足背动脉搏动消失（C错）以及静息痛/夜间疼痛（D错）。但两者的好发年龄不同，血栓性闭塞性脉管炎患者多年轻（A对），动脉硬化性闭塞症多见于45岁以上的中老年人。"}, {"type": "p", "text": "在血栓闭塞性脉管炎的治疗中，使用血管扩张剂（A错）治疗的效果有限，而该患者症状较重。本患者行腰交感神经切除术可以解除血管痉挛从而缓解疼痛，以及促进侧支循环形成，有比较好的近期效果。截肢术（C错）适用于出现下肢的坏疽，溃疡无法愈合，严重危及生命的晚期患者。溶栓疗法（D错）适用于急性血管栓塞早期内的患者，最好在发生栓塞的3天内用药。"}, {"type": "p", "text": "/跛行—二期、痛—三期、坏死—四期。踝/肱 -0. 9一期；0.4四期（死期）！二三期切腰 交感；死期剁腿！"}, {"type": "p", "text": "一期:无明显症状， 患肢凉、麻、苍白，踝 肱比＞0 9"}, {"type": "p", "text": "二期:间歇性跛行，＞＝200步是2a，＜200 步是2b"}, {"type": "p", "text": "三期:静息痛"}, {"type": "p", "text": "四期:坏疽，踝肱比＜0.4"}, {"type": "p", "text": "治疗，"}, {"type": "p", "text": "1期和2a期:抗凝抗栓"}, {"type": "p", "text": "2b期和3期:腰交感神经链切断"}, {"type": "p", "text": "4期:截肢"}, {"type": "p", "text": "——以上不知道是什么时候记得笔记， 不知 道出处😂😂😂不知道对不对/"}, {"type": "p", "text": "Pratt试验可了解深静脉交通支瓣膜的状况（D对）。下肢静脉瓣膜功能状况（A错）可以通过Trendelenburg试验来判断。下肢深静脉的通畅状况（B错），可以通过Perthes试验来判断。深静脉交通支瓣膜的情况可以通过Pratt试验来判断。大隐静脉瓣膜的状况（C错）可通过静脉造影来判断。肢体动脉供血状况（E错）可以参考肢体皮肤的颜色温度等指标了解。"}, {"type": "p", "text": "/大阴唇(大隐 Tren) 颇深(Perthe 深静脉) 踢踢脚(tt 交通支)/"}, {"type": "p", "text": "深静脉血栓"}, {"type": "list", "items": ["Neuhof征阳性 腓肠肌深部组织压痛", "Homans征阳性 踝关节过度背屈试验小 腿剧痛"]}, {"type": "p", "text": "下肢深静脉血栓的患者，若发病较早（3～5天以内），可以进行手术（A对）取栓。"}, {"type": "p", "text": "其他对症治疗手段包括抗凝（B对），抬高患肢（C对）促进静脉回流。"}, {"type": "p", "text": "但是不宜多做下肢运动（D错，为本题正确答案），以免血栓脱落造成肺栓塞。"}, {"type": "p", "text": "但在尚未形成下肢静脉血栓的患者，则鼓励进行适量的下肢活动，以免因长时间制动而形成静脉血栓。"}, {"type": "p", "text": "泌尿 男性生殖"}, {"type": "p", "text": "尿液呈红色并不一定是血尿（A错），可能由食用带色素的食物（辣椒、甜菜、人工色素）、药物（利福平、四环素）等引起。"}, {"type": "p", "text": "一般在1000mL 尿中含1 ml血液即呈肉眼血尿（B对）。一些血尿的发生会因为出血量过少而用肉眼无法发现，故将尿液离心观察沉渣，当每个高倍镜视野中红细胞＞3个即有病理意义（C对）。"}, {"type": "p", "text": "血尿对于泌尿系统是一个十分重要的临床表现，但是血尿程度与疾病严重性不成正比（D错），例如：尿路结石可能出现血尿，但是若结石排出往往预后很好；但无痛性肉眼血尿甚至仅为镜下血尿，若病人为泌尿道肿瘤患者，则疾病严重得多"}, {"type": "p", "text": "观察，等待自行下降（A错）适用于一岁以内的睾丸未降患者。"}, {"type": "p", "text": "若一岁以后睾丸仍未下降，可短期应用绒毛膜促性腺激素（B对）每周肌注2次，每次500U，总剂量为5000～10000U。"}, {"type": "p", "text": "2岁以后睾丸仍未降，则考虑行睾丸固定术（C错）将其拉下。"}, {"type": "p", "text": "若未降睾丸已发生萎缩，且不能被拉下并置入阴囊，而对侧睾丸正常，则行睾丸切除术（D错），防止在腹腔内的睾丸日后发生癌变。"}, {"type": "p", "text": "膜部和球部以尿生殖膈为界，膜部位于尿生殖膈以上，球部位于尿生殖以下。膜部的损伤，出血及血肿最常位于尿生殖膈以上（C对），如耻骨后间隙、膀胱周围"}, {"type": "p", "text": "初始血尿常见于前尿道损伤；终末血尿常见于急性膀胱炎、肾结核等；全程血尿常见于上尿路损伤及泌尿系肿瘤等疾病"}, {"type": "p", "text": "肾结核的典型症状包括尿路刺激征和血尿。"}, {"type": "p", "text": "其中，血尿常于尿频、尿痛后发生（D错），多数表现为终末性血尿，其原因是膀胱内结核性溃疡于膀胱收缩时出血所致（A对）。"}, {"type": "p", "text": "全程无痛肉眼血尿（B错）需要警惕泌尿系统肿瘤的可能。"}, {"type": "p", "text": "肾绞痛多发生于肾结石病人，肾结核一般不伴有肾绞痛（C错），仅少数病变破坏严重的肾结核，可发生结核性脓肾或输尿管堵塞，引起腰部钝痛或绞痛。"}, {"type": "p", "text": "/肾结核症状不在肾，而在膀胱。"}, {"type": "p", "text": "皮质——多发性结核结节（病理性肾结 核。可以在尿中查到结核菌，可以自愈 ） 髓质——干酪样脓肿（临床肾结核） 全肾散在钙化"}, {"type": "p", "text": "肾自截——广泛钙化， 肾功能完全丧失 ，膀胱刺激消失，尿检趋于正常。"}, {"type": "p", "text": "输尿管狭窄（多见输尿管膀胱连接处） ； 膀胱挛缩（膀胱容量显著减少50ml ）"}, {"type": "p", "text": "临床：青壮年多见，单侧90%"}, {"type": "p", "text": "1膀胱刺激征（尿频最早）"}, {"type": "p", "text": "2血尿（终末） 3脓尿（淘米水样）4无 明显腰痛， 可有对侧肿块5男性合并生 殖结核50%～70% 6全身症状。"}, {"type": "p", "text": "诊断：尿液（抗酸3次， 清晨第一次阳 性最高） 细菌培养最可靠4~8周90%阳 性 影像ivu可以了解分侧肾功能； 膀 胱镜充血水肿（三角区和输尿管口周围 明显， 膀胱容量小于50或者急性膀胱 炎不宜检查）一般抗感染无效。"}, {"type": "p", "text": "药物6～9个月无效，手术治疗"}, {"type": "p", "text": "肾切除术抗结核药治疗不少于2周 /"}, {"type": "p", "text": "长期排尿困难使得膀胱高度膨胀，内压升高，输尿管末端丧失其活瓣作用，导致膀胱输尿管反流，引起肾积水、肾功能不全，乃至肾功能衰竭（A对）。"}, {"type": "p", "text": "前列腺增生可致下尿路梗阻，病人排尿困难，需通过增加腹压促进排尿，长此以往可出现腹股沟疝（C对）、脱肛和痔疮等。"}, {"type": "p", "text": "无痛性血尿（D对）可见于前列腺增生，因为增生腺体表面黏膜较大的血管破裂。"}, {"type": "p", "text": "前列腺增生为良性病变，主要为前列腺移行带肥大，而前列腺癌好发部位为前列腺外周带。因此，一般认为前列腺增生与前列腺癌无关（B错）。/钟
