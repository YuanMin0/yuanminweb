爱一生（周癌移生）/"}, {"type": "p", "text": "钙代谢异常，尿中钙离子浓度过高，易于形成钙盐结石；但是胆结石的主要成份是胆色素和胆固醇，故钙代谢异常（A错）对于尿石症有影响，但是对于胆石症无影响。"}, {"type": "p", "text": "虽然钙代谢异常对于胆石症没有特殊影响，但是胆结石中也结合了一定量的Ca²⁺（无论是否钙代谢异常均有）；尿路结石多见草酸钙及磷酸钙成份，均含有大量的钙（C对）。"}, {"type": "p", "text": "尿石症和胆石症的发病率与地域有关（B对），我国南方地区尿石症发病率明显高于北方，西北地区胆囊结石发病率明显高于全国水平。"}, {"type": "p", "text": "体外冲击波碎石是上尿路结石治疗常用的方法，其破碎后易于自输尿管向下排出，但是对于胆结石，一般不行冲击波碎石，以手术治疗（D错）为主。"}, {"type": "p", "text": "常见的泌尿系结石作如下总结："}, {"type": "list", "items": ["草酸钙类，质硬粗糙、不规则、常呈桑椹样，棕褐色。X线平片显影（A对）；", "磷酸钙类，易碎，表面粗糙，不规则，常呈灰白色、黄色或棕色，尿路平片可见多层现象；", "尿酸类，圆形光滑，结构质密，中等硬度，极易吸附尿色素而成黄色或砖红色。X线平片不显影；", "磷酸铵镁结石，易碎粗糙、不规则或鹿角形，呈灰白色、黄色或棕色。X线平片不显影；", "胱氨酸结石，光滑圆形或鹿角形，淡黄至黄棕色，蜡样外观。X线平片不显影。"]}, {"type": "p", "text": "/读一遍就记住了，不会忘！"}, {"type": "p", "text": "草酸钙结石——有草 桑葚。"}, {"type": "p", "text": "磷酸钙，磷酸镁铵结石——鹿角形， 凤毛磷角。"}, {"type": "p", "text": "尿酸盐结石——颗粒状，盐粒。"}, {"type": "p", "text": "胱氨酸结石——蜡样，抛胱打蜡。不显影/"}, {"type": "p", "text": "膀胱肿瘤可分为上皮性肿瘤和非上皮性肿瘤，其中上皮性肿瘤是最常见的膀胱肿瘤，约占全部肿瘤的98%；而非上皮性肿瘤约占全部膀胱肿瘤的2%。上皮性肿瘤包括尿路上皮肿瘤（移行细胞癌（A对）、腺癌（C对）、鳞癌（D对）），包括肉瘤（B错）在内的其余肿瘤均为非上皮肿瘤，发病率均低于2%。"}, {"type": "p", "text": "膀胱癌出血与膀胱收缩无关，肿瘤组织坏死出血混杂在膀胱中，随尿液排出，形成全程血尿"}, {"type": "p", "text": "/哈哈 好多人都搞不清这点:"}, {"type": "p", "text": "膀胱癌一般是→全程血尿(因为多累及膀 胱后壁和侧壁) 但是！！！当累及膀胱颈 和三角区的时候是→终末血尿"}, {"type": "p", "text": "膀胱癌也可以有膀胱刺激征 但在晚期才 有 这个病人才1周 😇😇😇/"}, {"type": "p", "text": "膀胱镜检查（D对）是患膀胱癌年龄范围出现血尿病人的重要检查手段。可以直接观察到肿瘤所在部位、大小、数目、形态、有蒂或广基，初步估计基底部浸润等，在发现异常部位时，可取少量组织进行病理活检，具有确诊价值。"}, {"type": "p", "text": "尿细胞学检查（A错）可发现脱落的肿瘤细胞，可用于病人的初筛，但低级别肿瘤细胞不易与正常移行上皮细胞及炎症或结石引起的变异细胞鉴别。"}, {"type": "p", "text": "静脉尿路造影（B错）是必须的检查之一，但是其作用并不是诊断膀胱肿瘤的存在，而是了解上尿路有无同时伴发肿瘤。"}, {"type": "p", "text": "尿路B超（C错）检查是一切血尿病人的首选影像学检查，简便易行，能发现直径0.5cm以上的肿瘤，可作为病人的最初筛选。"}, {"type": "p", "text": "运动系统畸形"}, {"type": "p", "text": "单侧胸锁乳突肌挛缩可导致先天性斜颈，挛缩的肌肉牵引位于耳后的乳突，引起头向肌肉挛缩的患侧偏（A错，为本题正确答案），而下颌转向健侧（B对）。"}, {"type": "p", "text": "患病幼儿颈部活动受限制，平卧时病儿总是睡在患侧，从而使患侧头面部经常受压，长期以往，双侧面部发育不对称，未受压的健侧脸部发育较大（D对），而患侧脸部发育较小（C错，为本题正确答案），患侧眼的外眦与同侧口角的距离大于健侧。"}, {"type": "p", "text": "先天性髋关节脱位的病因包括髋臼发育不良（A对）、关节囊韧带松弛（C对），胎儿在子宫内胎位不正，承受不正常的机械性压力，影响髋关节的正常发育。"}, {"type": "p", "text": "股骨颈前倾角增大（B错）、股骨头发育不良（D错）为先天性髋关节脱位的病理改变。"}, {"type": "p", "text": "青少年特发性脊柱侧凸的治疗原则是根据Cobb角决定的，其治疗原则为"}, {"type": "list", "items": ["Cobb角＜25°，应严密观察，如每年进展＞5°且Cobb角＞25°，应行支具治疗；", "Cobb角在25°～40°之间，应行支具治疗；", "Cobb角＞40°，且每年加重＞5°，应手术治疗；", "Cobb角在40°～50°之间，进展加重的几率较大，如病人未发育成熟，应手术治疗；对于发育成熟的病人，如随访发现侧凸有明显进展，也应手术治疗；", "Cobb角＞50°应手术治疗。"]}, {"type": "p", "text": "/＜25°→观察"}, {"type": "p", "text": "20～40°→佩戴支具治疗"}, {"type": "p", "text": "＞40°→手术 /"}, {"type": "p", "text": "脊柱侧凸分为非结构性脊柱侧凸和结构性脊柱侧凸，特发性脊柱侧凸属于结构性脊柱侧凸（A错，为本题正确答案），最常见，约占脊柱侧凸75%～80%（B对）。"}, {"type": "p", "text": "根据其发病年龄，又分为：①婴儿型（0～3岁）；②少儿型（4～10岁）；③青少年型（11～18岁）；④成人型（＞18岁）"}, {"type": "p", "text": "骨折概论"}, {"type": "p", "text": "缝匠肌起于髂前上棘，止于胫骨上端内侧面，主要作用是屈髋屈膝。该病人在打篮球时，由于相撞时缝匠肌猛烈收缩，产生的暴发性牵引力作用于骨盆骨突的骨化中心而造成撕脱性损伤，此为肌肉收缩引起，故为间接暴力所致"}, {"type": "p", "text": "急性血源性骨髓炎以胫骨上段和股骨下段/膝关节附近/最多见（D对）。急性血源性骨髓炎多继发于身体其他部位的感染性病灶。当机体抵抗力下降或原发灶处理不当，细菌可进入血液发生菌血症或诱发脓毒症。菌栓进入骨营养动脉后，往往受阻于长骨干骺端的毛细血管内并在局部繁殖，引起急性血源性骨髓炎。骺板附近的微小终末动脉与毛细血管往往弯曲形成血管襻，使得该处血流缓慢，细菌容易沉积，成为骨髓炎的好发部位，如胫骨上段和股骨下段。除多见于胫骨和股骨外，肱骨、髂骨、脊柱与其他四肢骨骼（ABC错）都可以发病，肋骨和颅骨少见。"}, {"type": "p", "text": "压缩性骨折多指松质骨受外力作用而被压缩变形引起的骨折，常见于椎体和跟骨。高空坠落由于强大惯性和地面向上的反作用力之间的冲击，导致椎体承受相当于数倍于体重的重力压迫，引起的椎体骨折通常为压缩骨折"}, {"type": "p", "text": "/骤然跪倒时，如果题目里有写肌肉猛烈收 缩选横形骨折。"}, {"type": "p", "text": "如果没有那就是跪倒时直接损伤髌骨不关 肌肉的事，那就是粉碎性骨折。"}, {"type": "p", "text": "城市套路深/"}, {"type": "p", "text": "嵌插骨折（B对）因骨质相互嵌插，不易发生相对移位，为稳定性骨折，一般不出现骨折的三个特有体征"}, {"type": "p", "text": "骨折的晚期并发症包括坠积性肺炎、压疮、下肢深静脉血栓形成、感染、损伤性骨化（D对）、创伤性关节炎、关节僵硬、急性骨萎缩、缺血性骨坏死、缺血性肌挛缩。"}, {"type": "p", "text": "踝关节由胫骨、腓骨远端和距骨组成，三者相互接触共同形成一个关节结构，此处骨折可损伤关节面，造成关节面的不平整，关节软骨在活动时易磨损剥脱，易引起创伤性关节炎。"}, {"type": "list", "items": ["腘动脉分胫前、胫后动脉，胫后动脉穿过比目鱼肌腱弓向下行走，此血管固定，胫骨上1/3骨折易损伤该动脉，引起下肢严重缺血；②在小腿中1/3，小腿深筋膜与胫腓骨及骨间膜形成四个界限清楚的筋膜室，由于骨折后骨髓腔出血，或肌肉损伤出血或血管损伤出血，均可引起骨筋膜室综合征（B对）；③胫骨下1/3骨折易损伤滋养动脉，导致胫骨下段骨折缺乏血供，引起骨折的延迟愈合。创伤性关节炎（A错）多发生于关节内骨折，因为骨折使得关节面的正常结构丧失，不再平整，长期活动磨损，致使关节活动时出现疼痛。"]}, {"type": "p", "text": "肘关节骨折，例如肱骨髁上骨折，反复暴力复位或骨折后肘关节伸屈活动受限而进行反复牵拉，可导致骨膜剥离形成骨膜下血肿，血肿机化并在关节附近软组织内广泛骨化，造成严重的关节活动功能障碍，称为骨化性肌炎（B对），亦称损伤性骨化。特别多见于肘关节。"}, {"type": "p", "text": "骨折愈合包括畸形愈合，故愈合标准中并不包含局部无畸形（D错，为本题正确答案）。局部有畸形、塑型差称为畸形愈合，亦属于骨折愈合。骨折临床愈合的标准为①局部无压痛（A对）及纵向叩击痛（B对）；②局部无异常活动（C对） ；③X线平片显示骨折处有连续性骨痂，骨折线已模糊（E对）。记忆技巧：对于骨折愈合标准，可概括为几个字：不痛、不动、看不清。"}, {"type": "p", "text": "骨折的复位包括功能复位和解剖复位。解剖复位是指骨折段通过复位，恢复正常的解剖关系，对位对线良好。功能复位是指经复位后，两骨折段虽未恢复至正常的解剖关系，但在骨折愈合后对肢体功能无明显影响者。三踝骨折（A对）、肱骨髁间骨折（C对）、胫骨平台骨折（D对）都属于关节内骨折，分别累及踝关节、肘关节、膝关节，若不能实现解剖复位，骨折愈合后容易遗留关节面不平整，长期磨损容易引起创伤性关节炎，致使关节活动时出现疼痛，影响患者生活质量。肱骨干骨折（B错）要求功能复位即可。"}, {"type": "p", "text": "在肱骨干中下1/3段后外侧有桡神经沟，有由臂丛神经后束发出的桡神经经内后方紧贴骨面斜向外前方进入前臂，因此此处骨折反复手法复位易损伤桡神经（A对）。"}, {"type": "p", "text": "伸直型肱骨髁上骨折易损伤正中神经（B错）。"}, {"type": "p", "text": "肱骨内上髁骨折易损伤尺神经（C错）。"}, {"type": "p", "text": "肱骨上段骨折易损伤腋神经（D错）。"}, {"type": "p", "text": "肱骨上中段骨折易损伤肌皮神经（E错）。"}, {"type": "p", "text": "石膏管型是骨折复位后常用的固定方法之一，其优点是能根据肢体的形状塑形，固定作用确实可靠。缺点是无弹性，不能随时调节，不适于使用固定垫。所以固定范围应较大，须超过骨折部的上下关节，固定作用才能确实可靠。长腿石膏管型固定范围包括膝踝两个关节，所以适用于胫腓骨骨干骨折（C对）。而股骨干上段或中段骨折（AB错），长腿石膏管型不能确实固定骨折，临床上多采用持续胫骨结节牵引或股骨髁上牵引，部分患者需手术治疗"}, {"type": "p", "text": "骨折延迟愈合:骨折经过治疗，超过通常愈合所需时间（4-8个月），骨折处仍有反常活动（A对）。"}, {"type": "p", "text": "骨折不愈合指骨折经过治疗，超过通常愈合所需时间，再度延长治疗时间仍达不到骨性愈合（8个月以上），骨折处仍有反常活动（A对）。X线表现为骨折线清晰，两骨折端间隙宽，两断端萎缩光滑、硬化，骨髓腔被致密硬化的骨质所封闭。"}, {"type": "p", "text": "上肢骨关节损伤"}, {"type": "p", "text": "肩关节脱位多由外界暴力引起，故又称创伤性肩关节脱位。对于肩关节脱位，应首选手法复位，一般可在局麻下进行（A对），可使病人肌肉放松易于复位，同时减轻疼痛。肩关节前脱位约占肩关节复位的95%，最常用的复位方法为Hippocrates法，即足蹬法：伤员平卧，术者立于伤侧，以与伤者伤侧相同的足跟部蹬于伤者腋下并向上外方蹬推肱骨头，同时术者双手握住伤者腕部持续牵引，并轻轻内收内旋患者上臂，即可感知复位时的响声和滑动。"}, {"type": "p", "text": "髋关节后脱位常采用Bigelow法复位（B错，为本题正确答案）。"}, {"type": "p", "text": "将肩关节前脱位病人伤肢肘部接触胸前部，则手部不能触及健肩；反之将伤肢手部触及健肩时，其肘部不能接触胸前部，此为Dugas征，是肩关节前脱位的特征性体征，阳性表现为将患侧肘部紧贴胸壁时，手掌搭不到健侧肩部，或手掌搭在健侧肩部时，肘部无法贴近胸壁，复位成功，Dugas由阳性转为阴性（C对）。"}, {"type": "p", "text": "对于复位成功的病人，应将上臂固定于胸壁3-4周（D错，为本题正确答案），以利于损伤组织的修复并减少复发性脱位的机会；除去制动后再循序练习肩关节活动。"}, {"type": "p", "text": "肱骨髁内、前方，有肱动脉、正中神经经过，血管神经束的浅面有坚韧的肱二头肌腱膜，后方为肱骨，导致肱动脉、正中神经活动度较小。伸直型肱骨髁上骨折由于近折端向前下移位，极易损伤前方的肱动脉（A对）及正中神经"}, {"type": "p", "text": "Colles骨折（A错）为桡骨远端伸直型骨折，发生于桡骨远端骨松质，并向背侧移位的骨折。"}, {"type": "p", "text": "Smith骨折（B错）为桡骨远端屈曲型骨折，发生于桡骨远端骨松质，并向掌侧移位的骨折。"}, {"type": "p", "text": "Barton骨折（D错）为伴有腕关节半脱位的桡骨远端关节面骨折。"}, {"type": "p", "text": "Monteggia骨折为尺骨上1/3骨折合并桡骨头脱位。"}, {"type": "p", "text": "Galeazzi骨折（C对）为桡骨下1/3骨折合并尺骨小头（下尺桡关节）脱位。"}, {"type": "p", "text": "/MM在上GG在下"}, {"type": "p", "text": "Barton骨折=colles骨折+桡骨远端关节面骨折 /"}, {"type": "p", "text": "手外伤"}, {"type": "p", "text": "患者伤后左手呈爪手畸形（提示尺神经损伤），"}, {"type": "p", "text": "拇指对掌功能丧失（猿手）（提示正中神经损伤），"}, {"type": "p", "text": "手指浅感觉丧失，考虑其损伤的神经是尺神经及正中神经（D对）。"}, {"type": "p", "text": "桡神经（BC错）损伤表现为垂腕，伸拇、伸指障碍。"}, {"type": "p", "text": "另外，胸长神经和副神经损伤表现为翼状肩；/天赋(副神经)秉异(翼状肩)/"}, {"type": "p", "text": "腋神经损伤表现为方肩；/天方(方肩)夜(腋神经)谭/"}, {"type": "p", "text": "胫神经损伤表现为钩状足；/倒挂金(胫神经)钩(钩状足)/"}, {"type": "p", "text": "腓总神经损伤表现为马蹄内翻足。/啼(马蹄内翻足)笑皆非(腓总神经)/"}, {"type": "p", "text": "（P665）“若碾压撕脱伤要根据皮肤活力表现判断切除多少，当皮肤缺损时，其基底软组织良好或周围软组织可覆盖深部重要组织，可采用自体游离皮肤移植修复。若神经、肌腱、骨关节外露应采用皮瓣转移修复”/不是游离植皮//游离植皮:游离皮片，游离皮瓣，皮片不等于皮瓣/"}, {"type": "p", "text": "清创应力争在6～8小时内进行，可减少组织损伤，在细菌大量繁殖并入侵机体前清除其存在场所，将污染伤口变为清洁伤口"}, {"type": "p", "text": "最好在气囊止血带下进行（B对），可减少手部创面的出血，使创面清楚易于清创。"}, {"type": "p", "text": "不能在有张力的情况下，勉强缝合伤口（C对），否则可能导致伤口的愈合缓慢甚至缝合处裂开。"}, {"type": "p", "text": "手部外伤后，应尽早彻底清创。清创应力争在6～8小时内进行，可减少组织损伤，在细菌大量繁殖并入侵机体前清除其存在场所，将污染伤口变为清洁伤口。超过8小时，微生物的数量将迅速增加，造成严重的污染，不宜再行清创术。"}, {"type": "p", "text": "/面部12h头部24h 手部8h 其他6h"}, {"type": "p", "text": "因为血供依次变差"}, {"type": "p", "text": "一天三餐洗三次手， 早晚加起来洗两次脸 ，一天洗一次头/"}, {"type": "p", "text": "下肢骨关节损伤"}, {"type": "p", "text": "右髋部外伤史。右髋痛，右下肢活动受限，右下肢呈屈曲、内收、内旋和短缩畸形，诊断考虑髋关节后脱位（C对）。"}, {"type": "p", "text": "股骨颈骨折（A错）表现为患肢缩短、髋关节疼痛、肿胀、活动受限，髋关节屈曲内收外旋畸形。"}, {"type": "p", "text": "股骨转子间骨折（B错）表现为患肢缩短、髋关节疼痛、肿胀、活动受限，髋关节外旋明显，可达90°。"}, {"type": "p", "text": "髋关节前脱位（D错）表现为患肢缩短、髋关节疼痛、肿胀、活动受限，髋关节呈屈曲、外展、外旋畸形。"}, {"type": "p", "text": "股内收肌扭伤（E错）表现为患侧大腿上部疼痛，局部压痛明显，大腿内收，外展受限，患侧髋、膝关节呈稍屈外旋位。"}, {"type": "p", "text": "/髋脱位，前后脱位allis复位，中心脱位休克"}, {"type": "p", "text": "髋前，屈曲外展外旋，"}, {"type": "p", "text": "髋后，屈曲内收内旋，最多"}, {"type": "p", "text": "股骨颈骨折，外旋45-60度"}, {"type": "p", "text": "外旋外展型，pauwels角小30稳定，"}, {"type": "p", "text": "外旋内收型，pauwels角大50不稳定"}, {"type": "p", "text": "【在外找小三，内人打我家庭不稳定】"}, {"type": "p", "text": "股骨转子间骨折，外旋90度 /"}, {"type": "p", "text": "股骨颈的长轴与股骨干纵轴之间形成的角度称为颈干角，又称内倾角。正常值在110～140°之间"}, {"type": "p", "text": "股骨头无菌性坏死多见于股骨颈骨折病人，由于股骨头血运受损而发生缺血性无菌性坏死，该病变自然起始于"}, {"type": "p", "text": "股骨下1/3骨折，远折端受腓肠肌牵拉及肢体重力作用，向后方移位，常常损伤腘动脉（A对）、腘静脉、胫神经、腓总神经"}, {"type": "p", "text": "McMurray试验即旋转挤压实验，将被检查者的下肢置于内收（或外展）同时内旋（或外旋）位，自极度屈曲位逐渐被动伸直，以检查在此过程中出现的疼痛、弹响及弹动感，为半月板损伤检查特征性试验。"}, {"type": "p", "text": "内侧副韧带损伤（A错）可有固定的压痛点，其特征性体征为侧方应力试验阳性。"}, {"type": "p", "text": "十字韧带损伤（C错）的特征性体征为膝关节处的抽屉实验阳性"}, {"type": "p", "text": "创伤性关节炎（D错）为骨折的晚期并发症，患者并无骨折病史。"}, {"type": "p", "text": "半月板损伤时，关节造影不仅对鉴别诊断有参考价值，如骨软骨损伤、关节游离体、骨肿瘤等需排除，而且对决定是否手术也有意义（A对）。"}, {"type": "p", "text": "CT不能完全显示半月板、软骨等情况，不能确诊半月板的损伤"}, {"type": "p", "text": "七版黄家驷外科学P2859页认为，髌骨骨折的治疗原则是："}, {"type": "list", "items": ["尽可能保留髌骨；", "充分恢复其后关节面的平整；", "修复股四头肌扩张部分的裂伤；", "早期锻炼股四头肌；", "在尽可能条件下，早期练习膝关节的伸屈活动，以期通过模造，使髌股关节恢复吻合（C对）。"]}, {"type": "p", "text": "解剖复位，保持关节面平滑（A对），否则容易引起髌股关节的骨关节病。尽可能保留髌骨（B对），切除髌骨易导致股四头肌的伸膝功能及控制膝关节的能力受损。髌股骨折应保持膝关节伸直位固定"}, {"type": "p", "text": "（P685）“【治疗】 无移位的髌骨骨折采用非手术方法治疗。保持膝关节伸直位，用石膏托或下肢支具固定4～6周（D错），即可开始股四头肌等长收缩训练（C对）”。"}, {"type": "p", "text": "脊柱脊髓损伤"}, {"type": "p", "text": "/这是今早自己琢磨的， 自己总结的脊髓损 伤和与之对应的脊椎损伤平面， 大家可以 研究参考下， 花点时间弄明白就能轻松应 对考试啦， 外科考题经常问到的是脊椎损 伤部位， 不是直接问到脊髓平面，所以大 家换算下就好。"}, {"type": "p", "text": "首先， 正常的髓节对应的脊椎的关系(大家 可以参考解剖书对应关系模式图）"}, {"type": "p", "text": "C1到C4，大致与同序数的椎骨相对应，"}, {"type": "p", "text": "C5到C8，T1到T4与同序数椎骨的上一节锥 体相对应，"}, {"type": "p", "text": "T5到T8是上两节，T9到T12是上三节"}, {"type": "p", "text": "全部的腰髓平对第10-12胸椎， 全部骶尾髓 平对第12胸椎（胸12占一部分） 以及第一 腰椎。所以"}, {"type": "list", "items": ["高颈髓（指的是C1-C4)，对应的脊柱损 伤就是颈1到颈4， 因为还没有换神经元， 所以引起四肢硬瘫", "颈膨大（C5-T2， 由次发出的神经根支 配上肢运动） 对应的脊柱是颈4到胸1，该 平面引起上肢软瘫（因为已经换神经元了 ）下肢硬瘫，", "胸髓（T3-T12） ，对应脊柱是胸2到胸 9， 引起症状，上肢完好，下肢硬瘫（所以 第二胸椎（包括第二胸椎） 以下脊柱损伤 不会影响上肢）", "腰膨大（L1-S2， 由次发出的神经根支 配下肢运动）对应脊柱大约是胸10到腰1之 间， 所以该处损伤，上肢完好，下肢软瘫 （已经换元了）", "脊髓圆锥（S3到S5以及尾节， 脊髓圆 锥终止于第一腰椎下缘） 对应第一腰椎， 所以胸12和腰一损伤引起引起相应的综合 症（至于外科书提到胸12也可以引起损伤 ， 个人觉得可能是胸12损伤移位可以伤及 ） 但是由于支配下肢的神经根来自腰膨大 ，所以下肢无损害体征", "马尾神经损伤（马尾神经指的是脊髓圆 锥以下的腰骶神经根， 是由L2到尾节共十 对神经根组成， 起自第一腰椎下缘，终止 于第一骶椎下缘） 所以腰1以下损伤可以伤 及马尾， 症状与脊髓圆锥病变相似，但下 肢可以有软瘫。/"]}, {"type": "p", "text": "/颈椎损伤有上下肢障碍"}, {"type": "p", "text": "胸腰损伤(腰膨大也算)只有下肢障碍"}, {"type": "p", "text": "脊髓终止于第一腰椎下缘"}, {"type": "p", "text": "马尾神经起自第二腰椎"}, {"type": "list", "items": ["高颈段（C1～4）损伤：四肢硬瘫", "颈膨大段（C5～T1）损伤："]}, {"type": "p", "text": "上肢软瘫，下肢硬瘫"}, {"type": "list", "items": ["胸段（T2～T12）损伤："]}, {"type": "p", "text": "上肢正常，下肢硬瘫"}, {"type": "list", "items": ["腰膨大段（L1～S2）损伤："]}, {"type": "p", "text": "上肢正常，下肢软瘫"}, {"type": "note", "variant": "key", "title": "考点", "text": "神经中枢对运动控制以抑制为主(被破坏 后其他就变得亢进了， 如去大脑僵直，手术后动物立即出现全身肌紧张加强、四肢 强直、脊柱反张后挺现象，称为去大脑僵直（强直）)"}, {"type": "note", "variant": "key", "title": "考点", "text": "脊髓中心对运动控制以易化为主(被破坏 后变得安静)(易化是局部阈下兴奋状态能使 神经元兴奋性升高的现象)"}, {"type": "p", "text": "c1-4=n"}, {"type": "p", "text": "c5-8和t1-4=n–1"}, {"type": "p", "text": "t5-8=n–2"}, {"type": "p", "text": "t9-12=n–3 /"}, {"type": "p", "text": "颈椎压缩性骨折合并脱位，应首选颅骨牵引复位（C对）及前路椎间融合，次选后路切开复位固定术（D错）。"}, {"type": "p", "text": "若合并急性椎间盘突出，则在复位前需先行前路椎间盘切除，再行后路切开复位内固定和前路植骨融合。"}, {"type": "p", "text": "颌枕带牵引（A错）可用于治疗稳定型颈椎骨折轻度压缩者。"}, {"type": "p", "text": "颈椎骨折手法复位，石膏固定（B错）困难，很少采用。"}, {"type": "note", "variant": "warn", "title": "注意", "text": "颈椎骨折合并脱位与胸腰椎骨折合并脱位首选处理方法不一样，胸腰椎骨折合并脱位常合并脊髓损伤，无论有无脊髓神经损伤，都应首选后路切开复位内固定以恢复脊柱正常解剖序列，对合并神经损伤的病人还需行椎管减压手术。"}, {"type": "p", "text": "参与屈肘的肌肉有肱二头肌、肱肌和肱桡肌，均由C₅-C₆神经支配；/屈56/"}, {"type": "p", "text": "伸肘的肌肉主要为肱三头肌，由C₆-C₇神经支配。/伸67/"}, {"type": "p", "text": "该病人屈肘良好，说明C₅-C₆神经完好；伸肘障碍，说明损伤位于C₇。又由于脊髓和椎管的长度不一致，脊髓各个节段与相应椎骨的高度并不完全对应，脊髓下部颈节（C₅-C₈）和上部胸节对应同序数椎骨序列减1的椎骨。C₆神经对应的脊椎节段是颈5，C₇神经对应的椎体节段水平为颈6，故损伤应发生在颈5、6（C对）之间。/膈肌——C4/"}, {"type": "p", "text": "第4胸椎骨折（A错）多损伤T₆～T₇节段脊髓，感觉丧失平面应在剑突至肋弓下缘之间。"}, {"type": "p", "text": "/2 4 6 8 10 角头剑弓脐/"}, {"type": "p", "text": "周围神经损伤"}, {"type": "p", "text": "Tinel征（B对），即叩击试验，即可帮助判断神经损伤的部位，也可用于检查神经修复后神经纤维的再生情况。判断神经损伤的方法为局部按压或叩击神经干，局部出现针刺性疼痛，并有疼痛感向该神经支配区放射为阳性，表示为神经损伤部位。"}, {"type": "p", "text": "Thomas征（P779）（A错），病人仰卧，充分屈曲健侧髋和膝，并使腰部贴于床，若患肢自动抬高离开床面或迫使患肢与床面接触则腰部前突，为托马斯征阳性，见于髋部病变和腰肌挛缩。"}, {"type": "p", "text": "/纯手打。"}, {"type": "p", "text": "Dugas症，hippocrates法:肩关节脱位"}, {"type": "p", "text": "ALLIS法:髋关节脱位"}, {"type": "p", "text": "Mcmurray实验:"}, {"type": "p", "text": "外旋外翻疼痛，外侧半月板损伤"}, {"type": "p", "text": "内旋内翻疼痛，内测半月板损伤"}, {"type": "p", "text": "Apley:小腿用力下压，外旋疼痛，内侧半月 板损伤； 小腿上提，外旋疼痛 ，内测副韧 带损伤"}, {"type": "p", "text": "Lasegue症:腰椎间盘突出"}, {"type": "p", "text": "Eaton实验，spurling 症:神经根型颈椎病"}, {"type": "p", "text": "Froment征:尺神经运动功能障碍"}, {"type": "p", "text": "Allen实验阳性:尺桡动脉不通畅或损伤"}, {"type": "p", "text": "Finkelstein实验:桡骨茎突狭窄性腱鞘炎"}, {"type": "p", "text": "Mills实验:肱骨外上髁炎 /"}, {"type": "p", "text": "桡骨小头半脱位常损伤桡神经深支，由于深支支配拇指背伸的肌肉群，故会出现拇指不能背伸（B对）、2～5指不能背伸（C对），但此时桡侧腕长伸肌功能完好（因为支配该肌肉的神经纤维在肘上已从桡神经分出），伸腕功能基本正常，而仅有伸拇、伸指障碍。不能背伸腕关节（A错）多见于桡神经在肱骨中下段（桡神经沟处）受损，此时支配伸腕功能的肌肉全部瘫痪。虎口区感觉障碍（D错）多见于桡神经浅支损伤及桡神经主干损伤，因为浅支支配感觉功能。本题解答时应注意题干要求，准确判断出为桡神经深支而不是桡神经干损伤，这对准确解答至关重要。"}, {"type": "p", "text": "/桡神经：深支运动+浅支感觉"}, {"type": "p", "text": "肱骨中下1/3处损伤（高位） →感觉障 碍+垂腕+伸指伸拇障碍"}, {"type": "p", "text": "桡骨小头脱位、旋后肌综合征（低位是 深支）→伸指伸拇障碍5个手指都包括/"}, {"type": "p", "text": "因胸长神经起自神经根，因此束支损伤并不影响其功能，因而不会出现前锯肌功能丧失，双手推墙时出现翼状肩胛（A错）。前锯肌功能是否障碍是判断臂丛神经是否“根”性损伤的重要依据，如为“根”性损伤，远端神经一定产生障碍。臂丛神经损伤如只出现伸腕、伸指功能丧失、腕下垂，说明损伤部位在束支。"}, {"type": "p", "text": "臂丛由第C₅₋₈颈神经和第1胸神经前支的大部分组成（A对）。这五条神经根经斜角肌间隙，颈5、6的前支合成上干，颈7前支延为中干，颈8神经前支和胸1神经前支的大部分合成下干。出斜角肌间隙后每个干有分为前后两股，由上、中干的前股合成外侧束，下干的前股延为内侧束，三干的后股汇合成后束。即臂丛的构成可概括为五根三干六股。"}, {"type": "p", "text": "腓肠神经（B错），分布于小腿后区，为感觉神经，损伤主要引起相应部位的感觉异常，无运动障碍"}, {"type": "p", "text": "股神经（C错）支配股四头肌，损伤后可导致站立或行走时的膝关节伸直障碍。坐骨神经（D错）损伤，可导致膝关节的屈肌、小腿和足部全部肌肉均瘫痪，大腿后侧、小腿后侧、外侧及足部感觉消失。"}, {"type": "p", "text": "腕管综合征是正中神经（E对）在腕管内受压而表现出的一组症状和体征，表现为拇、示、中指感觉过敏或迟钝，鱼际肌萎缩，拇对掌无力，腕部正中神经Tinel征阳性。"}, {"type": "p", "text": "肘管综合征（P726）是指尺神经在肘部尺神经沟内因慢性损伤而产生的一组症状和体征，表现为手背尺侧、小鱼际、小指及环指尺侧半感觉异常，小指收展无力及手指收、展不灵活，环小指可呈爪形手畸形。"}, {"type": "p", "text": "梨状肌综合征（P727）是指坐骨神经在臀部受到卡压出现的一组症状和体征，表现为坐骨神经痛，体查可发现小腿轻度萎缩，小腿以下皮肤感觉异常"}, {"type": "p", "text": "/ 腕管综合征（最常见） →正中N 猿掌扳机 手 拇指对掌障碍 中示指远节感觉消失→Ti nel征、屈腕试验Phalen征（正中就是用来 屈腕的）"}, {"type": "p", "text": "肘管综合征→尺神经 爪形手 小指感觉消失 →Tinel征、夹纸试验Froment征（小手指 夹不住了）"}, {"type": "p", "text": "旋后肌综合征→桡神经深支 单纯运动障碍 5个手指的伸指障碍"}, {"type": "p", "text": "梨状肌综合征（最常见的下肢） →坐骨神 经→Tinel征、4字试验 /"}, {"type": "p", "text": "/碗中吃肘，挠挠后脑勺，坐立不安"}, {"type": "p", "text": "腕管 正中神经"}, {"type": "p", "text": "肘管 尺神经"}, {"type": "p", "text": "旋后肌 桡神经 深支"}, {"type": "p", "text": "梨状肌 坐骨神经 /"}, {"type": "p", "text": "运动系统慢性损伤"}, {"type": "p", "text": "脊柱颈段下一椎体的钩突与上一椎体的斜坡构成钩椎关节，又称Luschka关节或弓体关节（A对），这一结构在胸、腰、骶、尾脊椎并不存在。钩椎关节可防止椎间盘向侧后方突出，但当其退行变而增生时，反而可刺激侧后方的椎动脉，或压迫后方的颈神经根。"}, {"type": "p", "text": "神经根型颈椎病发病机制为神经根被侧后方突出的颈椎间盘或增生肥大的钩椎关节或关节突压迫。临床上开始多为颈肩痛，短期内加重，并向上肢放射（A对）。放射痛范围根据受压神经根不同而表现在相应皮节。皮肤可有麻木（B对）、过敏等感觉异常。同时可有上肢无力（D对）、手指动作不灵活。当头部或上肢姿势不当，或突然牵撞患肢即可发生剧烈的闪电样锐痛。神经根型颈椎病患者多有上肢牵拉试验阳性（C对）：检查者一手扶患侧颈部，一手握腕，向相反方向牵拉。此时因臂丛神经被牵张，刺激已受压之神经根而出现放射痛。"}, {"type": "p", "text": "/自己纯手打，所以有错误多多指教"}, {"type": "p", "text": "颈椎病分类：根据压迫的部位分"}, {"type": "p", "text": "神经根型：最常见"}, {"type": "p", "text": "脊髓型"}, {"type": "p", "text": "交感型"}, {"type": "p", "text": "锥动脉型"}, {"type": "p", "text": "所有的临床表现都归类为：感觉，运动 ，反射"}, {"type": "p", "text": "神经根型：颈椎主要压迫臂从神经，那 主要影响的肯定是上肢。感觉，运动， 反射都会影响。"}, {"type": "p", "text": "感觉包括：颈肩痛， 并放射(沿神经走 形)。皮肤麻木。"}, {"type": "p", "text": "运动包括：上肢无力，手指不灵活。"}, {"type": "p", "text": "反射包括：感觉过敏"}, {"type": "p", "text": "各种实验：只要使得神经张力增高的， 都会加重，也就是阳性，包括：牵拉实 验，压头实验"}, {"type": "p", "text": "脊髓型：被压迫以下的，都会异常。所 以多表现为四肢异常。"}, {"type": "p", "text": "感觉：四肢麻木，僵硬，双足踩棉花感 。出现感觉障碍平面。"}, {"type": "p", "text": "运动：双手精细动作笨拙，颤抖，双手 无力。"}, {"type": "p", "text": "反射：四肢键反射活跃或亢进，腹壁反 射，提睾反射减弱或消失，Babinski征 阳性。"}, {"type": "p", "text": "交感型：也就是交感兴奋或抑制的表现 。"}, {"type": "p", "text": "椎动脉型：远端供血不足表现。"}, {"type": "p", "text": "主要是偏头痛，突发晕厥，视力障碍。"}, {"type": "p", "text": "也因椎动脉周围有很多交感神经，所以 也有交感神经兴奋症状。"}, {"type": "p", "text": "除了脊髓型手术治疗，其他先保守治疗 /"}, {"type": "p", "text": "脊髓型颈椎病发病机制为颈椎退变结构压迫脊髓。病人表现为上肢或下肢麻木无力、僵硬、双足踩棉花感，足尖不能离地，触觉障碍、束胸感，双手精细动作笨拙，不能用筷进餐，写字颤抖，夹持东西无力，手持物经常掉落（A对）。"}, {"type": "p", "text": "颈肩痛向上肢放射（B错）为神经根型颈椎病（P733）的典型表现，因为神经根为侧后方突出的颈椎间盘或增生肥大的钩椎关节或关节突压迫。"}, {"type": "p", "text": "头痛、心悸（C错）为交感神经型颈椎病的典型表现，此型发病原因不明。"}, {"type": "p", "text": "眩晕（D错）为椎动脉型颈椎病（P734）的典型表现，因为椎动脉遭受压迫或刺激，导致椎-基底动脉供血不足。"}, {"type": "p", "text": "脊髓型颈椎病和脊髓空洞症均有感觉障碍，但发生的情况并不相同，脊髓型颈椎病痛温觉、触觉同时发生障碍，产生麻木等感觉和运动异常；而脊髓空洞症由于从脊髓中心白质部分先发生病变，白质由上行传导神经纤维组成，主要负责传导痛温觉，故该类病人会有感觉分离现象，即痛温觉丧失，触压觉及精细触觉仍然存在（C对）。脊髓型颈椎病MRI可显示脊髓不同程度的受压情况，而脊髓空洞症MRI示脊髓内有与脑脊液相同之异常信号区，因此本题D亦对，但当年给出的答案为C。"}, {"type": "p", "text": "神经根颈椎病手术指征为：①经合理的保守治疗，半年以上无效，或反复发作，并影响正常正常生活或工作，而且同意手术治疗；②神经根性疼痛剧烈，严重地影响生活，保守治疗2周仍不减轻；③上肢某些肌肉，尤其是手内肌无力、萎缩，保守治疗4～6周仍有发展趋势。本题AB均对，正确答案为C。"}, {"type": "p", "text": "患者双下肢腱反射亢进，双侧Babinski征（+），诊断考虑脊髓型颈椎病。"}, {"type": "p", "text": "颈₄～₅（C₅）受累表现为一侧颈部及肩部放射痛，三角肌处麻木，无反射改变。"}, {"type": "p", "text": "颈₅～₆（C₆）受累表现为拇指放射痛，桡骨膜反射和肱二头肌反射减弱。"}, {"type": "p", "text": "颈₆～₇（C₇）受累表现为中指放射痛，肱三头肌反射减弱。"}, {"type": "p", "text": "颈₇～胸₁（C₈）受累表现为环指和小指放射痛，无反射改变。"}, {"type": "p", "text": "病人左上肢桡骨膜反射减弱，左手拇指针刺觉减退，因此颈椎病病变应该定位于颈₅～₆"}, {"type": "p", "text": "/"}, {"type": "p", "text": "挺早以前我在朋友圈写过了这个， 发到评 论区请大家指点指正"}, {"type": "p", "text": "谈谈脊髓，脊神经，骨折的关系。"}, {"type": "p", "text": "脊髓， 上起延髓，终于马尾，位于椎孔。 脊髓是中枢神经， 而脊神经是周围神经。 所谓的神经根， 就是脊髓和脊神经之间的 连接神经。 解决这部分题要围绕两个核心 ， 一是究竟是脊髓损伤，还是脊神经损伤 。二是究竟是骨折，还是退行性变？"}, {"type": "p", "text": "这两个问题的核心在于对解剖知识的掌握 。"}, {"type": "p", "text": "1软瘫和硬瘫"}, {"type": "p", "text": "所谓的软瘫， 也叫周围瘫，下神经元瘫痪 。 而硬瘫与之对应，指的是中枢瘫，上神 经元瘫痪。 就像我以前最喜欢举的例子， 我们每一个人的大脑相当于周围神经， 而 我们的班主任的大脑相当于中枢神经的话 。 假如班主任坐在班里，大家都十分平和 ， 这就叫软瘫。假如班主任出差了，班里 就闹腾开了，这就叫硬瘫。"}, {"type": "p", "text": "中枢神经受损， 表现为肌张力增高，病理 反射阳性， 所谓的硬瘫就是指肌张力高， 摸起来硬硬的。 周围神经受损，相当于直 接支配肌肉的神经断了， 肌肉没有指令了 ，就像一块肉一样瘫了，摸起来软软的。"}, {"type": "p", "text": "（这里我想起了一个英语单词，inertia，意 思是惰性惯性，它是由Iner，在里面的，和 tia（短暂性脑缺血发作） 组成的单词。如 果出现TIA， 直接损伤大脑，自然是中枢神 经受损， 所以发生硬瘫，其读音也类似硬 瘫）"}, {"type": "p", "text": "我们可以明白的一点是， 如果是脊髓受损 ， 发生的是硬瘫，而脊神经受损，发生的 是软瘫。"}, {"type": "p", "text": "2脊髓和脊神经"}, {"type": "p", "text": "脊髓，有两个膨大。颈膨大（C5-T2）腰膨 大（L1-S2） 。为什么会有这两个东西呢？ 因为在这里， C5-T1构成了臂丛，而L1-S2 构成了腰丛和骶丛。 因为这些神经在一个 平面扎堆了， 所以出现了膨大。如果骨折 平面损伤脊髓， 在颈膨大以上，则发生四 肢硬瘫。 如果在颈膨大，因为主要伤害的 是臂丛神经和对应的C5平面以下， 所以上 肢是软瘫（上肢的C5脊髓节段平对第四颈 椎），下肢是硬瘫。"}, {"type": "p", "text": "脊髓节段和对应椎体是有一个公式的， 如 下："}, {"type": "p", "text": "颈1-4脊髓节段 平对颈椎1-4"}, {"type": "p", "text": "颈5-8，胸1-4脊髓节段 减1=对应椎体"}, {"type": "p", "text": "胸5-8脊髓节段 减2=对应椎体"}, {"type": "p", "text": "胸9-12脊髓节段 减3=对应椎体"}, {"type": "p", "text": "腰1-5脊髓节段 平对胸10-12椎体"}, {"type": "p", "text": "骶1-5脊髓节段 平对12胸椎和第1腰椎"}, {"type": "p", "text": "这里要注意， 我说的是脊髓节段，而不是 脊神经。 脊神经根是从对应椎体的椎间孔 穿出来的， 但是脊髓节段是略高于对应椎 体的。 人体组胚发育过程中，脊髓比脊椎 短，因此造成了这样的不平衡现象。"}, {"type": "p", "text": "脊神经根从椎间孔出来后就分为四支。 前 支， 后支，交通支，脊膜支。前支分别交 织成丛， 也即颈丛，臂丛，腰丛和骶丛（ 没有胸丛！ 别胡扯！），一般司四肢肌肉 运动和感觉。 后支分成肌支和皮支，司躯 干的肌肉运动和感觉。 脊膜支司一般感觉 （痛温觉） 和内脏运动，交通支则是自主 交感神经和脊髓之间的连接。 其实这个分 支完全没有什么卵用，随口一写。"}, {"type": "p", "text": "3骨折还是退行性变"}, {"type": "p", "text": "二者区别截然不同"}, {"type": "p", "text": "很少有脊柱骨折不伤及脊髓的， 因为脊柱 骨折以前后脱位多见， 压迫脊髓节段实属 平常。 而退行性变则多以椎间盘突出为多 见， 椎间盘突出，因为椎间盘的特异性位 置， 他压迫的是下一位的神经根。比如L3- L4的椎间盘突出， 压迫的是L4的神经根（ 是神经根不是L4脊髓节段） ，因为L3的神 经根从L3的椎间孔出来， 他的位置高于L3- L4椎间盘， 而L4的神经根正好穿过椎间盘 从L4椎间孔出来， 因此椎间盘突出压迫的 是L4神经根。 颈椎病当然也分为脊髓型和 神经根型， 但前者罕见，后者常见。脊髓 型， 如果是C6神经以及对应的脊髓C5阶段 受损，病变平面必定位于C5-C6颈椎。"}, {"type": "p", "text": "4做题思路"}, {"type": "p", "text": "拿到一个判定位置的题， 要看是骨折还是 退行性变？"}, {"type": "p", "text": "比如本题， 退行性变，脊髓型颈椎病，由 于左手拇指痛觉减退， 可以判定是C6神经 根受损， C6神经根受损，出现脊髓退行性 变的部位只可能是第五颈椎和第六颈椎（ 第五颈椎压迫C6脊髓节段， 第六颈椎压迫 C6神经根， 因此出现脊髓型颈椎病，临床 较少见）因此本题选B"}, {"type": "p", "text": "帮助理解！ /"}, {"type": "p", "text": "按照2008、2015 118A两道题总结"}, {"type": "p", "text": "神经定位诊断："}, {"type": "p", "text": "|颈椎4| C5脊髓"}, {"type": "p", "text": "C5神经根ﾉ"}, {"type": "p", "text": "|颈椎5| C6脊髓"}, {"type": "p", "text": "C6神经根ﾉ"}, {"type": "p", "text": "|颈椎6| C7脊髓"}, {"type": "p", "text": "C7神经根ﾉ"}, {"type": "p", "text": "|颈椎7| C8脊髓"}, {"type": "p", "text": "C5脊髓-C5神经根-对应颈4"}, {"type": "p", "text": "感觉：上臂外侧 运动：三角肌"}, {"type": "p", "text": "腱反射：桡骨膜"}, {"type": "p", "text": "C6脊髓-C6神经根-对应颈5"}, {"type": "p", "text": "感觉：前臂外侧、拇指 运动：屈曲力量（ 肱二）"}, {"type": "p", "text": "腱反射：桡骨膜、肱二头肌反射"}, {"type": "p", "text": "C7脊髓-C7神经根-对应颈6"}, {"type": "p", "text": "感觉：中指 运动：伸肘力量（ 肱三）"}, {"type": "p", "text": "腱反射：肱三头肌反射"}, {"type": "p", "text": "C8脊髓-C8神经根-对应颈7"}, {"type": "p", "text": "感觉：小指、前臂内侧"}, {"type": "p", "text": "T1脊髓"}, {"type": "p", "text": "感觉：上臂内侧中下部"}, {"type": "p", "text": "2008. 118A 不能做伸肘-C7损伤-对应颈6 且C7略高于颈6 因此是颈5. 6 也可以按横 截面解释 ：C7横截面对应颈椎阶段在 颈5- 6 （第七版神经病学20页）"}, {"type": "p", "text": "双下肢软瘫-脊休克急性期-弛缓性瘫痪"}, {"type": "p", "text": "2015.118A 桡骨膜反射减弱-C5.6 神经根受 压"}, {"type": "p", "text": "拇指针刺觉减弱-C6 神经根受压"}, {"type": "p", "text": "下肢反正亢进，病理征阳性-脊髓型颈椎病"}, {"type": "p", "text": "因此这道题不能简单定义为神经根型或脊 髓型颈椎病"}, {"type": "p", "text": "但是我们可以从体征中定位-C6神经根-C6 脊髓"}, {"type": "p", "text": "C6神经根对应颈5与颈6之间穿出"}, {"type": "p", "text": "总结2008. 118考察完全性脊髓损伤-脊髓节 段定位"}, {"type": "p", "text": "2015.118考察颈椎病-神经根定位 /"}, {"type": "p", "text": "肩周炎又称冻结肩，本病好发于40岁以上的中老年，女性多于男性，左侧多于右侧（A错，为本题正确答案），为肩周、肌腱、肌肉、滑囊及关节囊的慢性损伤性炎症（B对）。以活动时疼痛、功能受限为其临床特点（C对）。肩周炎有其自然病程，有自愈倾向，可遗留不同程度的功能障碍（D错，为本题正确答案）。"}, {"type": "p", "text": "三版八年制外科学P946页认为，腰肌劳损的治疗原则为：（1）病情较重时，应适当休息，定时改变姿势，必要时可在工作中使用腰围（A对），但休息时应解除；（2）腰部进行物理治疗（B对），为治疗腰肌劳损的主要方法；（3）腰痛点可行糖皮质激素注射封闭治疗（D对）；（4）腰痛明显时，可服用非甾体类抗炎药，但不能多种合用，否则可增加不良反应，而治疗效果增强不明显（C错）。"}, {"type": "p", "text": "椎间盘突出症"}, {"type": "p", "text": "腰椎间盘突出症是腰腿痛常见及重要的原因。由于椎间盘组织承受人体躯干及上肢的重量，在日常生活及劳动中，劳损较其他的组织为重，此为椎间盘变性的主要原因（C对）；"}, {"type": "p", "text": "又因椎间盘纤维环仅有少量血供，营养依靠软骨终板有限的渗透，因而极易退变，这是发病的基本因素（B对）。"}, {"type": "p", "text": "高处坠落伤主要可引起脊柱的骨折和脊神经的损害，腰椎间盘突出症属于慢性退行性病变，极少因强烈暴力致病（D错，为本题正确答案）。"}, {"type": "p", "text": "破裂椎间盘组织产生化学物质是一种本身不存在于神经根生存环境的物质，自然会刺激神经根产生疼痛（B对）。"}, {"type": "p", "text": "椎间盘破裂产生的化学物质同时作为自身抗原使得机体产生免疫反应/自身免疫反应/，使得神经根周围组织产生炎症，波及神经根产生疼痛（C对）。"}, {"type": "p", "text": "神经根受到突入椎管的髓核的急性机械性压迫会产生腰腿痛症状，此外受压神经由于压迫缺血也可产生疼痛（D对）。"}, {"type": "p", "text": "椎间盘由外层纤维环及中央的髓核构成，软骨板形成椎间盘的上下壁。只有纤维环破裂，髓核经破口脱出时，方可刺激神经根产生坐骨神经痛，单纯纤维环内层受到突出的髓核刺激不会产生坐骨神经痛（A错）。"}, {"type": "p", "text": "下肢放射性痛多由病变累及坐骨神经所致，而坐骨神经源自腰₄、₅骶₁～₃神经，只要椎间盘突出时累及这些神经根，均可引起下肢放射性痛（A对）。小腿外侧感觉障碍，趾背伸力弱（B错）为腰₄～₅椎间盘突出压迫腰5神经的临床表现。"}, {"type": "p", "text": "L₁～₂椎间盘突出（A错）压迫L₂神经根，表现为大腿前中部感觉障碍，屈髋无力。"}, {"type": "p", "text": "L₂～₃椎间盘突出（B错）压迫L₃神经根，表现为股骨内髁感觉障碍，伸膝无力，膝反射减弱或消失。"}, {"type": "p", "text": "L₃～₄椎间盘突出（C错）压迫L₄神经根，表现为小腿前内侧及膝前感觉障碍，伸膝无力，膝反射减弱或消失。"}, {"type": "p", "text": "L₄～₅椎间盘突出（D对）压迫L₅神经根，表现为小腿前外侧及足背内侧感觉障碍，足趾背伸乏力或不能。"}, {"type": "p", "text": "L₅S₁椎间盘突出（E错）压迫S₁神经根，表现为小腿后外侧及外踝、足外侧感觉障碍，趾及足跖屈无力，踝反射下降。"}, {"type": "p", "text": "X线片对腰椎显示良好，在腰椎间盘突出病人中，在侧位片上可见到病人腰椎生理前凸变小或消失（A对）。"}, {"type": "p", "text": "在正位片上可见腰椎侧弯，椎问盘突出间隙左右不等宽（B对）。"}, {"type": "p", "text": "椎间盘病变后前部椎间隙缺少椎间盘支撑而塌陷，后部椎间盘因关节突出而塌陷不明显，因此Ｘ线可表现为椎间隙前窄后宽（D对）。"}, {"type": "p", "text": "椎间盘主要由外层的纤维环（纤维软骨）和内层的髓核构成，在X线片上不显影（C错）。"}, {"type": "p", "text": "第三腰椎横突综合征好发于青壮年体力劳动者，由于第三腰椎横突特别长，且水平位伸出，附近有血管、神经束经过，有较多的肌筋膜附着；在正位上第三腰椎处于腰椎生理前凸弧度的顶点，为力学传递的重要部位，易受外力作用的影响，容易受损伤。该处损伤可造成刺激、压迫症状，主要表现为腰痛，少数可沿骶棘肌向下放射。由于腰椎横突周围无神经根的通过，故无神经受累体征，不会出现神经源性间歇性跛行（A错）及坐骨神经支配区的放射痛（B错）。"}, {"type": "p", "text": "（P756-P757）“1.非手术治疗 （1）适应证：①初次发病，病程较短的病人…（2）治疗方法：①卧床休息，一般严格卧床3周，带腰围逐步下地活动（A对）；②非甾体抗炎药物；③牵引治疗，骨盆牵引最常用（B对）；④理疗（C对）”。"}, {"type": "p", "text": "（P757）“手术治疗适应证：①腰腿痛症状严重，反复发作，经半年以上非手术治疗无效，且病情逐渐加重，影响工作和生活者；②中央型突出有马尾综合征，括约肌功能障碍者，应按急诊进行手术；③有明显的神经受累表现者”。"}, {"type": "p", "text": "梨状肌出口综合征（P727）（D错）为坐骨神经在臀部受到卡压的一种综合征，主要表现为坐骨神经痛，疼痛从臀部经大腿后方向小腿和足部放射，可有轻度跛行，但一般不出现明显腰痛。"}, {"type": "p", "text": "单纯腰椎间盘突出症的治疗首选小开窗椎间盘切除术（C对），此术式创伤较小，术后即能早期活动，迅速返回工作岗位，避免了开放性腰椎间盘手术后的硬膜外瘢痕形成、腰椎不稳等并发症。"}, {"type": "p", "text": "全椎板切除椎间盘切除术（A错）适应证包括：椎间盘突出合并有椎管狭窄、椎间盘向两侧突出、中央型巨大突出以及游离椎间盘突出。"}, {"type": "p", "text": "半椎板切除椎间盘切除术（B错）适用于单纯椎间盘向一侧突出者。"}, {"type": "p", "text": "L₅S₁椎间盘因髂骨翼遮挡，采用常规的后外侧入路穿刺成功率较低，可采用经腹椎间盘切除术"}, {"type": "p", "text": "患者搬重物后突发疼痛加重，伴大小便障碍，提示椎间盘突出加重，出现马尾综合征，应立即行腰椎核磁共振扫描"}, {"type": "p", "text": "/如果出现脊髓受压症状， 一定要考虑磁共 振。查软组织/"}, {"type": "p", "text": "骨与关节化脓性感染"}, {"type": "p", "text": "急性化脓性骨髓炎主要表现为全身中毒症状，寒战、高热、呕吐，成脓毒症样发作，长骨干骺端疼痛剧烈而不愿活动肢体，局部深压痛（C对）。左股骨下端皮温升高（A错），左股骨下端肿胀（B错），左膝关节伸屈受限（D错）均为急性化脓性脊髓炎的一般表现，缺乏特异性，不作为体格检查有力证据。"}, {"type": "p", "text": "疑诊为急性骨髓炎患者，可选用有内芯的穿刺针，在压痛最明显的干骺端刺入，边吸边深入，不要一次穿入骨内，以免将单纯软组织脓肿的细菌带入骨内，抽出浑浊液体或血性液可作涂片检查与细菌培养，涂片中发现多是脓细胞或细菌即可明确诊断，故骨穿（D对）是急性骨髓炎有诊断意义的辅助检查。/应是“局部分层穿刺”/"}, {"type": "p", "text": "急性骨髓炎的致病菌系经过血源性播散，虽血培养（A错）可获致病菌、血常规（B错）可示白细胞计数增高，但两者特异性差，可见于其他感染。"}, {"type": "p", "text": "急性骨髓炎起病后的14天内的X线检查往往无异常发现，该患者起病1天，X线检查（C错）对早期诊断意义不大。"}, {"type": "p", "text": "手术的目的是引流骨脓肿，无需行组织切开，钻孔引流和开窗减压可以很好的引流和冲洗，创口小且治疗效果好，小创口也限制了脓液的扩散。单纯行软组织切开引流术（C错，为本题正确答案）并不能引流髓腔内脓肿，无法达到理想的治疗效果。"}, {"type": "p", "text": "慢性骨髓炎的治疗，主要为手术治疗，行病灶清除术，原则是清除病灶、消灭死腔、伤口闭合（A对）。"}, {"type": "p", "text": "腓骨、肋骨、髂骨翼等不重要部位的慢性骨髓炎，可将病骨整段切除，一期缝合伤口（B对）。"}, {"type": "p", "text": "部分病例病程久、已有窦道口皮肤癌变或足部广泛骨髓炎骨质损毁严重不可能彻底清除病灶者，可施行截肢术（C对）。"}, {"type": "p", "text": "慢性骨髓炎急性发作期不宜作病灶清除术，应以抗生素治疗为主（D错），积脓时可切开引流"}, {"type": "p", "text": "/急性骨髓炎一般就是脓肿， 死骨有没有真 是两说的事， 没必要专门做切除。大剂量 抗生素上了， 把体内原发感染灶扑灭，如 果骨髓局部感染症状不消失或者全身感染 仍然存在， 那就要做手术把脓引流出来， 快死的骨也能成活（死骨是被脓液包绕的 骨）。"}, {"type": "p", "text": "慢性骨髓炎形成了包壳了， 出现了死腔了 ， 死骨是死的很彻底，一般就把死骨拿出 来， 把死腔填塞一下或者小孩的话引流一 下脓液不填塞也行， 因为小孩生长旺盛。 然后做个皮瓣覆盖下一期缝合就完了。"}, {"type": "p", "text": "慢性骨髓炎急性发作的时候， 很容易出现 菌血症， 这时候骨髓里的细菌反而成了原 发感染灶了， 要先用抗生素控制全身感染 ， 上个引流解除下骨压迫症状，等全身感 染控制了， 生命体征平稳了，做手术就行 了。 /"}, {"type": "p", "text": "关节切开引流适用于髋关节等深部大关节，膝关节属于表浅关节（C错）。早期治疗膝关节化脓性关节炎最好的方法是足量有效抗生素全身应用、关节腔穿刺灌洗抽出脓液加抗生素膝关节腔局部注入"}, {"type": "p", "text": "骨与关节结核"}, {"type": "p", "text": "骨关节结核好发于脊椎，约占全部病例的50%，其次是髋关节、膝关节和肘关节等。这些部位大多在负重大（A对）、活动多、易遭受慢性劳损（B对）以及肌肉附着少（C对）的部位。急性外伤通常造成非特异性感染，极少引起结核杆菌的感染"}, {"type": "p", "text": "骨关节结核多为单发病灶（D错），少数为多发性，但对称性十分罕见。起病缓慢，有低热、乏力、盗汗等结核全身症状。肘、腕、膝、踝以及手足等处的病变，位置表浅肿胀容易发现，有轻度肿胀疼痛与压痛（A对）。脊柱以及髋关节等深部关节病灶，早期局部肿胀或脓肿不易发现（B对）。结核杆菌感染不会引起急性炎症反应，故不会出现红、热表现，脓肿较局限，但有穿破可能（C对）。"}, {"type": "p", "text": "骨关节结核病灶清除术的适应证："}, {"type": "list", "items": ["经非手术治疗效果不佳，病变仍有进展；", "有明显的死骨或较大脓肿形成（A对）；", "窦道流脓经久不愈（B对）；", "脊柱结核有脊髓、马尾神经受压表现等（D对）；", "单纯骨或滑膜结核，即将发展成全关节结核者（C对）。"]}, {"type": "p", "text": "骨关节结核病灶清除术的禁忌证："}, {"type": "list", "items": ["伴有其他脏器活动期结核者；", "病情危重，全身情况差；", "合并有其他疾病难以耐受手术者。"]}, {"type": "p", "text": "在全身中毒症状重、抗结核药物效果不佳产生耐药的患者（E错，为本题正确答案），若实行手术，很可能会造成无法控制的结核菌的扩散，使得病情更加复杂和恶化。此时应积极采取支持治疗，更换敏感抗结核药，待一般情况改善后再作下一步治疗。"}, {"type": "p", "text": "脊柱结核以腰椎结核发生率最高，其次是胸椎，颈椎和骶尾段发病最少（A对）。"}, {"type": "p", "text": "骨与关节结核一般多为单发病灶，少数可呈跳跃性（B对）。"}, {"type": "p", "text": "小儿椎体结核多为中心型，从椎体中心开始，一般只侵犯一个椎体（C错，为本题正确答案）。成人椎体结核多起自椎体边缘。儿童成人均可发生，儿童多见。"}, {"type": "p", "text": "脊椎结核病人中约10%～30%并发截瘫，其中病变在胸椎中下段居多，约80%，其次为颈椎、颈胸椎和胸腰椎结核，第一腰椎以下极少见。"}, {"type": "p", "text": "脊柱转移癌（原试题叙述有误）多见于中老年，病变先侵袭椎弓根，后累及椎体，椎间盘较少受累（E对），早期椎间隙正常。"}, {"type": "p", "text": "脊柱结核（A对）的典型X线表现为骨破坏和椎间隙狭窄。其中，中心型椎体结核的骨质破坏集中在椎体中央，很快出现椎体压缩成楔状，前窄后宽。边缘型的骨质破坏集中在椎体的上下缘或下缘，表现为进行性椎间隙狭窄，并累及邻近两个椎体。"}, {"type": "p", "text": "脊柱恶性肿瘤（P777）（B错）的X线可见骨破坏累及椎弓根，椎间隙高度正常，一般无椎旁软组织影。"}, {"type": "p", "text": "强制性脊柱炎（P788）（C错）的X线早期表现为骶髂关节骨质疏松，关节边缘呈虫蛀状改变，间隙不规则增宽，软骨下骨有硬化致密改变；以后关节面渐趋模糊，间隙逐渐变窄，直至双侧骶髂关节完全融合。椎间小关节出现类似变化，随病变发展椎间盘的纤维环和脊柱前、后纵韧带发生骨化，形成典型的“竹节样”脊柱。"}, {"type": "p", "text": "退行性脊柱关节病（D错）X线平片可见椎间隙变窄，脊柱边缘增生和骨赘形成。"}, {"type": "p", "text": "/1. 椎间隙变窄 2. 骨质破坏."}, {"type": "p", "text": "脊柱恶性肿瘤------ 2 强直性脊柱炎------ 1 退行性 骨关节病---- 1 脊柱结核-----------1+2"}, {"type": "p", "text": "书本777页/"}, {"type": "p", "text": "52岁男性患者，双下肢无力，行走受限2月。体查：T₉压痛，叩痛明显（提示T₉节段存在病变），脐以下痛觉减退，下肢不能自主活动，足趾可微动，病理征阳性（病变压迫脊髓，累及锥体系）。X线射片见T₉椎弓根及椎体后缘显影不清，未见软组织肿大阴影（脊柱肿瘤的典型影像学表现）。综合该患者的病史、体查及影像学检查，诊断考虑T₉转移瘤（B对）并脊髓受压。原发性T₉肿瘤（A错）临床上少见，一般不作优先考虑。"}, {"type": "p", "text": "T₉结核（P775）（C错）一般先累及椎体，后累及椎弓根，椎间隙狭窄，常见椎旁软组织影，且有低热、盗汗等结合中毒症状，与患者表现不符。"}, {"type": "p", "text": "T₉骨髓炎（P759）（D错）起病急骤，寒战后高热，可达39℃以上，多有明显感染中毒症状，患处存在明显的疼痛、红肿，与患者表现不符。"}, {"type": "p", "text": "患者一般情况较好，进一步治疗方案为病灶清除术（D对）。肿物切除术（A错）多用于体温高，中毒症状明显和全身状况不好不能耐受病灶清除术的患者。"}, {"type": "p", "text": "/第一， 患者是全髋关节结核，P781第二行 写道:如无手术禁忌症， 应及时进行病灶清 除术"}, {"type": "p", "text": "第二，复查血沉是20mm/h,正常值，根据P 772实验室检查第二行，说明结核处于静止 期，不符合手术禁忌症P774“伴有其他脏器 活动期结核者”这一条， 所以无禁忌症，可 以手术"}, {"type": "p", "text": "第三， P774,术前要规范应用抗结核药物治 疗4~6周， 至少2周,所以药物治疗时间也符 合要求"}, {"type": "p", "text": "综上，答案没错啊！ /"}, {"type": "p", "text": "Thomas征用来检查髋关节有无屈曲畸形。方法如下：病人平卧于检查床上，检查者将其健侧髋、膝关节完全屈曲，使膝部贴住或尽可能贴近前胸，此时腰椎前凸完全消失而腰背平贴于床面，若患髋存在屈曲畸形，即能一目了然，根据大腿与床面所成之角度，断定屈曲畸形为多少。除关节本身的因素如髋关节结核外，关节前部的软组织（髂腰肌（B对）、髂股韧带（C对）、髋关节前部的关节囊（D对））挛缩均可出现Thomas征阳性。大腿内收肌群包括耻骨肌、长收肌、股薄肌、短收肌和大收肌5块肌肉，其主要作用是使髋关节内收，而Thomas征主要是检查髋关节有无屈曲畸形，因此内收肌挛缩不会出现Thomas征阳性（A错）。"}, {"type": "p", "text": "非化脓性关节炎"}, {"type": "p", "text": "原发性骨关节病变起自于关节软骨（A对），软骨破坏后可出现软骨下骨质增生、硬化和囊肿形成，滑膜增厚和炎性炎症。"}, {"type": "p", "text": "类风湿关节炎病变起自于滑膜（B对），为关节滑膜的慢性炎症，早期滑膜充血、水肿，单核细胞、淋巴细胞和浆细胞浸润，纤维蛋白渗出。"}, {"type": "p", "text": "强直性脊椎炎病变起自于骶髂关节（C对），逐渐向上蔓延至脊柱，导致纤维性或骨性强直和畸形。血友病患者由于缺乏凝血因子，不能将凝血酶原转变为凝血酶，使纤维蛋白原无法形成纤维蛋白而易在轻微外因作用下出血，且不易止血；"}, {"type": "p", "text": "血友病性关节病变起自于关节内出血（D错）。血友病患者关节内出血时可形成关节内血肿，血肿机化和炎症反应可损伤关节软骨，反复发作可损伤关节结构，导致血友病性关节病"}, {"type": "p", "text": "骨关节炎是一种以关节软骨退行性变和继发性骨质增生为特征的慢性关节病。分为原发性和继发性两类。继发性骨关节炎是由于创伤（如关节内骨折）、关节面后天性不平整（A对）（如缺血性骨坏死导致的关节面变性塌陷）、先天性关节结构异常（B对）（如发育性髋关节脱位）、关节不稳定（C对）（如关节囊韧带松弛）、关节畸形引起的关节面对合不良，在关节局部原有病变的基础上发生的骨关节炎。"}, {"type": "p", "text": "体重超重者下肢关节过于承重劳损（D错）为原发性骨关节炎的病因之一。"}, {"type": "p", "text": "/原发:负荷大 继发:关节差 /"}, {"type": "p", "text": "类风湿性关节炎是一种病因尚未明了的以关节病变为主的非特异性炎症（A对），通常缓慢起病，好发于手、腕、足等小关节，表现为多发性和对称性关节炎（B对）。该疾病发展缓慢，但常有急性发作，急性炎症期关节红肿热，大关节有积液，可缓解，反复发生关节囊、韧带及骨的破坏使出现多种畸形（D对）。其发生与免疫机制和HLA-DR4抗原有关"}, {"type": "p", "text": "（P789）“类风湿性关节炎，是一种病因尚未明了的以关节病变为主的非特异性炎症（A对），以慢性、对称性（C对）、多滑膜关节炎和关节外病变为主要临床表现，属于自身免疫病”。（P789）“多发生在20～45岁，女性多见（B对）”。（P790）“大约70%～80%的病例类风湿因子阳性”"}, {"type": "p", "text": "强直性脊柱炎的病变常从骶髂关节开始，逐渐向上蔓延至脊柱（A错），向下蔓延累及双髋关节（B错），较少波及膝关节（C对），极少累及手关节（D错）。"}, {"type": "p", "text": "骨肿瘤"}, {"type": "p", "text": "良性骨肿瘤形态规则，与周围正常骨组织界限清楚，以硬化边为界，骨皮质因膨胀而变薄，但仍保持完整，无骨膜反应（B错）。骨肿瘤无论良恶性，均可因肿瘤细胞的生长而导致骨质破坏"}, {"type": "p", "text": "恶性骨肿瘤的X线可见骨质破坏、骨膜增生（A对）。临床表现可见肿物生长快（B对），局部软组织侵袭明显（D对）。"}, {"type": "p", "text": "酸性磷酸酶增高（C错），多作为前列腺癌和前列腺癌发生骨转移的辅助诊断。"}, {"type": "p", "text": "血清碱性磷酸酶反应成骨活动，在成骨性肿瘤如骨肉瘤中，患者血清碱性磷酸酶明显升高。"}, {"type": "p", "text": "/成骨反应：碱性磷酸酶升高"}, {"type": "p", "text": "溶骨反应：血钙升高"}, {"type": "p", "text": "骨肉瘤→碱性磷酸酶（剪骨肉）"}, {"type": "p", "text": "前列腺癌→酸性磷酸酶"}, {"type": "p", "text": "前列腺癌骨转移→酸性+碱性磷酸酶 /"}, {"type": "p", "text": "脊索瘤（P801）（A错）是一种先天性的，来源于残余的胚胎性脊索组织的恶性肿瘤。"}, {"type": "p", "text": "常考好发部位总结如下："}, {"type": "p", "text": "骨软骨瘤好发于长骨干骺端（B对），如股骨远端、胫骨近端和肱骨近端。"}, {"type": "p", "text": "骨瘤好发于颅骨和下颌骨；"}, {"type": "p", "text": "内生软骨瘤好发于手足的短管状骨；"}, {"type": "p", "text": "骨样骨瘤好发于长骨；最常见于股骨、胫骨和肱骨的骨干和骨骺端；"}, {"type": "p", "text": "骨巨细胞瘤好发于长骨末端如股骨下端、胫骨上端；骨巨细胞瘤好发于20～40岁，女性略多，好发部位为长骨干骺端（B对）和椎体，特别是股骨远端和胫骨近端”。"}, {"type": "p", "text": "骨肉瘤好发于四肢长骨，尤其是股骨远端、胫骨近端和肱骨近端；"}, {"type": "p", "text": "软骨肉瘤好发于骨盆，以髂骨最常见；"}, {"type": "p", "text": "Ewing肉瘤好发于长骨骨干和干骺端、盆骨、肋骨；"}, {"type": "p", "text": "骨纤维肉瘤好发于四肢长骨干骺端偏骨干，以股骨多见。"}, {"type": "p", "text": "骨肉瘤（P799）（A错）为最常见的恶性骨肿瘤，病变局部皮温升高、静脉怒张、疼痛明显，疾病进展较快，X线可呈不同形态，密质骨和髓腔有成骨性、溶骨性和混合性骨质破坏，骨膜反应明显，呈侵袭性发展，可见Codman三角或呈日光射线形态。"}, {"type": "p", "text": "骨巨细胞瘤（P798）（B错）又称破骨细胞瘤，主要症状为疼痛和肿胀，X线片呈偏心、溶骨、膨胀生长，无骨膜反应，病灶膨胀生长、骨皮质变薄，呈肥皂泡样改变，与病人表现不符。"}, {"type": "p", "text": "软骨肉瘤（P799）（C错）发病缓慢，以疼痛和肿胀为主，X线表现为一密度减低的溶骨性破坏，边界不清，病灶内有散在的钙化斑点或絮状骨化影，典型这可有云雾状改变。"}, {"type": "p", "text": "骨样骨瘤（E错）疼痛是常见症状，典型症状为持续性钝痛，夜间加重，服用水杨酸制剂可缓解，这是重要的鉴别点。"}, {"type": "p", "text": "生长较慢，无明显疼痛（生长慢，症状不明显，提示为良性病变）。X线平片示股骨下端内侧干骺端杵状肿块，边缘清楚（骨软骨瘤的典型X线表现）。综合该患者的病史及影像学检查，诊断考虑骨软骨瘤"}, {"type": "p", "text": "骨巨细胞瘤是一种交界性肿瘤，以手术治疗为主，采用切除术和灭活处理，在植入自体或异体骨或骨水泥，单纯手术刮除易复发"}, {"type": "p", "text": "骨巨细胞瘤为交界性肿瘤，以手术治疗（C对）为主，但术后易复发。骨巨细胞瘤对化疗不敏感（D错）。放射治疗（A错）仅用于手术困难部位（例如原发于脊椎者），但放疗后易肉瘤变。放射治疗+手术治疗（B错）可能出现放疗后肉瘤变，因而不作优选"}, {"type": "p", "text": "骨巨细胞瘤典型的X线特征为骨端偏心位、溶骨性、囊性破坏而无骨膜反应，病灶膨胀生长、骨皮质变薄，呈肥皂泡样改变（A对）。"}, {"type": "p", "text": "骨肉瘤（P799）X线表现为不同形态，密质骨和髓腔有成骨性、溶骨性和混合性骨质破坏，骨膜反应明显，呈侵袭性发展，可见Codman三角或呈“日光射线”形态（B错）。"}, {"type": "p", "text": "尤文（Ewing）肉瘤（P800）X线表现为虫蛀样溶骨改变，界限不清，外有骨膜反应，呈板层状或“葱皮状”的现象（C错）。"}, {"type": "p", "text": "恶性淋巴瘤（P800）是一种恶性淋巴细胞组成并在骨骼内产生膨胀性病灶的肿瘤，X线有时呈“溶冰征”（D错），骨膜反应少见。"}, {"type": "p", "text": "骨肉瘤是典型的恶性肿瘤，应采取手术治疗。但单纯根治性手术（C错）5年存活期不足20%（参阅七版黄家驷外科学P3080）。由于对化疗敏感，因此术前、术后可给予大剂量化疗，可降低瘤负荷，延长患者生存期，因此最佳治疗方法为化疗和根治性手术（D对）。除少数血液系统肿瘤及滋养层细胞肿瘤、睾丸精原细胞瘤、胚胎性横纹肌肉瘤可单独应用化疗（A错）以外，多数恶性肿瘤应采取手术治疗为主的综合治疗。骨肉瘤对于放射治疗（BE错）通常不敏感。"}, {"type": "p", "text": "骨肉瘤极易发生肺转移，因此术前必须进行的检查为胸部X线摄片（D对）。若发现肺部转移灶，而患者临床分期为G₂T₁₋₂M₁者，除原发灶根治性切除及术前术后化疗外，可同时行手术切除转移灶。"}, {"type": "p", "text": "软骨肉瘤为骨的恶性肿瘤，对于放疗和化疗均不敏感，只能根据外科分期和肿瘤部位来制定手术方法，低度恶性软骨肉瘤可行广泛或根治性切除及保肢手术。"}, {"type": "p", "text": "骨的转移瘤是经血或淋巴转移至骨的恶性肿瘤。七版黄家驷外科学P3108页认为不同系统原发肿瘤骨转移发生率如下：乳腺癌（A对）为47%～85%，前列腺癌为33%～85%，甲状腺癌为28%～60%，肺癌为30%～64%。骨转移瘤好发于椎体、骨盆及股骨"}, {"type": "p", "text": "/恭喜你做完骨科的题了， 之前记的还记得 吗？"}, {"type": "p", "text": "( ⁼̴̀ .̫ ⁼̴́ )✧"}, {"type": "p", "text": "那些年骨科中让人懵逼的英文总结！"}, {"type": "p", "text": "肯定不是最全，但涵盖绝大部分！"}, {"type": "p", "text": "如果你想看，请复制到笔记中去！"}, {"type": "p", "text": "Allis征：膝关节脱位"}, {"type": "p", "text": "Trendelenburg征：单足站立试验， 先髋脱 位期，臀中小肌"}, {"type": "p", "text": "Tinel征：判断神经损伤部位和神经损伤后 再生情况"}, {"type": "p", "text": "Dugas征：肩关节脱位"}, {"type": "p", "text": "Froment征：尺神经损伤"}, {"type": "p", "text": "Phalen征：正中神经"}, {"type": "p", "text": "Thomas征：髋关节结核、髂腰肌"}, {"type": "p", "text": "Ortolani试验：先髋弹入"}, {"type": "p", "text": "Barlow试验：先髋弹出"}, {"type": "p", "text": "Allen试验：判断尺桡动脉吻合通畅"}, {"type": "p", "text": "Lachman试验：膝关节韧带损伤"}, {"type": "p", "text": "McMurray试验：膝关节半月板损伤"}, {"type": "p", "text": "Apley试验：膝关节半月板损伤"}, {"type": "p", "text": "Eaton试验：神经根型颈椎病"}, {"type": "p", "text": "Spurling试验：神经根型颈椎病"}, {"type": "p", "text": "Finkelstein试验：桡骨茎突狭窄性腱鞘炎"}, {"type": "p", "text": "Mills试验：肱骨外上髁炎，“网球肘”"}, {"type": "p", "text": "4字试验：骶髂关节、髋关节结核、内收肌"}, {"type": "p", "text": "Hippocrates法：肩关节脱位手法复位"}, {"type": "p", "text": "Allis法：髋关节脱位复位"}, {"type": "p", "text": "Neer分型：肱骨近段骨折分型（1㎝/45°）"}, {"type": "p", "text": "Garden分型：股骨颈骨折分型"}, {"type": "p", "text": "Schatzker分型：胫骨平台骨折分型"}, {"type": "p", "text": "Tile分型：骨盆骨折分型"}, {"type": "p", "text": "Letournel-Judet分型：髋臼骨折分型"}, {"type": "p", "text": "Colles骨折：伸直型桡骨远端骨折"}, {"type": "p", "text": "Smith骨折：屈曲型桡骨远端骨折"}, {"type": "p", "text": "Barton骨折：桡骨远端关节面骨折伴腕关 节脱位"}, {"type": "p", "text": "Monteggia骨折：尺骨折 桡脱位"}, {"type": "p", "text": "Galeazzi骨折：桡骨 尺脱"}, {"type": "p", "text": "Jefferson骨折：C1"}, {"type": "p", "text": "Hangman骨折：C2"}, {"type": "p", "text": "Chance骨折：经椎体、椎弓、棘突的横向 骨折"}, {"type": "p", "text": "最后说一句， 总结的过程也是复习的过程 ，预祝大家考研成功！ /"}];</script>
<script>
(function () {
  if (WB.mountChrome) WB.mountChrome('materials');

  var body = document.getElementById('body');
  body.innerHTML = WB.renderBlocks(window.__DOC_BLOCKS || []);
  if (WB.fx && WB.fx.init) WB.fx.init();

  var base = (window.R2_BASE || '').replace(/\/+$/, '');
  var prefix = window.R2_PREFIX || '';
  var dl = document.getElementById('dgDl');
  if (base && /^https?:/.test(base) && dl && dl.getAttribute('data-key')) {
    dl.href = base + '/' + prefix + dl.getAttribute('data-key').split('/').map(encodeURIComponent).join('/');
  } else if (dl) {
    dl.style.display = 'none';
  }

  // 阅读 / 练习 切换
  var tabs = [].slice.call(document.querySelectorAll('.doc-tabs button'));
  tabs.forEach(function (b) {
    b.addEventListener('click', function () {
      var p = b.getAttribute('data-pane');
      tabs.forEach(function (x) { x.classList.toggle('on', x === b); });
      document.getElementById('paneRead').classList.toggle('hide', p !== 'read');
      document.getElementById('paneQuiz').classList.toggle('hide', p !== 'quiz');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });

  var links = [].slice.call(document.querySelectorAll('.toc a[href^="#"]'));
  if (!links.length) return;
  var heads = links.map(function (a) { return document.getElementById(a.getAttribute('href').slice(1)); });
  function paint() {
    var top = window.scrollY + 120, idx = 0;
    heads.forEach(function (h, i) { if (h && h.offsetTop <= top) idx = i; });
    links.forEach(function (a, i) { a.classList.toggle('on', i === idx); });
  }
  window.addEventListener('scroll', paint, { passive: true });
  paint();
})();
</script>
