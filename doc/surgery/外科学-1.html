<script>window.__DOC_BLOCKS = [{"type": "list", "items": ["什么是无菌术，它包括哪些内容？灭菌和消毒有什么区别？"]}, {"type": "p", "text": "答:无菌术是针对微生物及感染途径所采取的一系列预防措施。内容包括灭菌，消毒法，操作规则及管理制度。区别是否消灭一切微生物。"}, {"type": "list", "items": ["什么是低钾血症，临床静脉补钾要注意哪些事项？"]}, {"type": "p", "text": "答:血清钾＜3.5mmol/L注意：分次补钾，边补边观察，注意浓度＜40mmol/L(＜0.3%)和速度＜20mmol/h，尿量＞40ml/h再补钾。"}, {"type": "list", "items": ["人体通过哪些机制维持体液酸碱平衡？"]}, {"type": "p", "text": "答:体内缓冲系统，肺的呼吸，肾的调节。"}, {"type": "list", "items": ["什么叫反常性酸性尿？"]}, {"type": "p", "text": "答:低钾血症，碱中毒时，肾小管排钾降低而排氢增多，尿呈酸性，称反常性酸性尿。"}, {"type": "list", "items": ["为什么术后应早期下床活动？"]}, {"type": "p", "text": "答：早期活动有增加肺活量，减少肺部并发症，改善血液循环，促进伤口愈合，减少因下肢静脉瘀血而发生血栓形成的优点。尚有于肠道和膀胱功能的恢复，从而减少腹胀和尿潴留的发生。早期下床活动应注意循序渐进的原则。"}, {"type": "list", "items": ["麻醉前用药的主要目的及临床最常见的选择？"]}, {"type": "p", "text": "答:主要目的是消除麻醉、手术引起的不良反应，特别是迷走神经反射，抑制呼吸，消化道腺体分泌，保持呼吸通畅，以防误吸。临床常选用镇静、镇痛药及抗提药（杜冷丁、阿托品也可）。"}, {"type": "list", "items": ["局麻药分类，常用药，最大服量是多少？"]}, {"type": "p", "text": "答:酯类：普鲁卡因、丁卡因10mg。酰胺类：利多卡因400mg、布比卡因150mg。"}, {"type": "list", "items": ["什么叫局麻药中毒?有什么表现?怎样防治?"]}, {"type": "p", "text": "答:①毒性反应 指单位时间内血液中局麻药浓度超过了机体的耐力而引起的中毒症状。②主要表现为中枢神经及循环系统的变化。引起中枢兴奋和惊厥。引起中枢兴奋的全面抑制，表现神志漠糊或昏迷、呼吸抑制或停止、循环衰竭等。局麻中毒时除直接舒张外周血管外，亦抑制心肌的收缩和传导，使心排血量下降，导致低血压、循环衰竭、甚至心跳停止。③局麻前应给予适量镇静药。一次用药不要超限量。局麻药液中加肾上腺素。足趾、手指和阴茎等处作局麻时，不应加肾上腺素。老年、甲亢、心律失常、高血压和周围疾病亦不宜使用。注药前回抽注射器。④立即停用局麻药。支持呼吸和循环功能，如人工呼吸、给氧和使用升压药，心跳停止时应立即复苏。抗掠厥静注安定或2.5％硫喷妥钠，亦可用速效肌松药。"}, {"type": "list", "items": ["局部麻醉不能加肾上腺素的情况有哪些？"]}, {"type": "p", "text": "答:麻醉部位：手指足趾、阴茎、气管内。疾病：高血压，心脏病，甲亢。"}, {"type": "list", "items": ["腰麻的平面控制，影响平面的因素有哪些？"]}, {"type": "p", "text": "答:药品剂量、比重、容积、穿刺间隙，病人体位及注药速度。"}, {"type": "list", "items": ["麻醉深度临床通常分哪三期？"]}, {"type": "p", "text": "答:浅麻醉期、手术腐醉期、深麻醉期"}, {"type": "list", "items": ["吸入麻醉药的麻醉强度用什么衡量？"]}, {"type": "p", "text": "答:用局麻药的最低肺胞有效浓度（MAC）来衡量，MAC越小。麻醉强度越强（答成反比也对）"}, {"type": "list", "items": ["肌松药使用的主要条件有哪些？"]}, {"type": "p", "text": "答:气管插管、有辅助呼吸或控制呼吸时配合全麻醉使用，并无麻醉作用，不能单纯用于麻醉。"}, {"type": "list", "items": ["简述休克的检测指标？"]}, {"type": "p", "text": "答:精神状态；皮温、色泽；血压、脉搏；尿量、比重；休克指数；CVP；PCWP；血生化：PaO2 , PaCO2 , CO2CP；DIC检测。"}, {"type": "list", "items": ["休克补液试验的临床意义？"]}, {"type": "p", "text": "答:①CVP正常而BP下降时进行②0.9% NS 250ml/10分钟输入③BP升高，CVP不变是容量不足④BP不变而CVP升高是心功不全。"}, {"type": "list", "items": ["休克的定义和一般监测项目有哪些？"]}, {"type": "p", "text": "答:定义：机体有效循环血容量减少，组织灌注不足，细胞代谢紊乱和功能受损的病理过程，是多病因的综合症。一般监测项目：①精神状态②皮肤温度色泽③血压④脉率⑤尿量。"}, {"type": "list", "items": ["输血适应症有哪些？"]}, {"type": "p", "text": "答:大量失血贫血或低蛋白血症重症感染凝血异常。"}, {"type": "list", "items": ["什么是MODS，如何有效预防？"]}, {"type": "p", "text": "答:急性疾病过程中两个或两个以上的器官或系统同时或序贯发生功能障。预防：①积极治疗原发病②重点监测病人的生命体征③防治感染④改善全身情况和免疫调理⑤保护肠黏膜的屏障作用⑥及早治疗首先发生功能障碍的器官。"}, {"type": "list", "items": ["什么是少尿和无尿，ARF少尿期的常见电介质紊乱有哪些？"]}, {"type": "p", "text": "答:少尿＜400ml/d无尿＜100ml/d。高钾高镁高磷低钠钙低氯水中毒酸中毒。"}, {"type": "list", "items": ["什么是TPN、PN、EN?"]}, {"type": "p", "text": "答:完全胃肠外营养，肠外营养，肠内营养。"}, {"type": "list", "items": ["什么是二重感染、条件性感染、脓毒症、菌血症？"]}, {"type": "p", "text": "答:二重感染：在使用广谱抗生素或联合使用抗菌药物治疗感染过程中，原来致病菌被抑制，但耐药菌株大量繁殖，致使病情加重。条件性感染：在抗感染能力低下的情况下，本来栖居于人体但未致病的菌群可以变成致病微生物，所引起的感染称条件性感染。脓毒症：因感染引起的全身炎症反应，体温循环呼吸有明显改变。菌血症：血培养检出病原菌。"}, {"type": "list", "items": ["痈切开引流的要点？"]}, {"type": "p", "text": "答:①“+”或“++”切口，切口线应超出皮肤病变边缘；②尽量清除已化脓和已失活组织；③用生理盐水纱条或碘仿纱条填塞，每日换药一次。"}, {"type": "list", "items": ["外科感染局部治疗的目的？"]}, {"type": "p", "text": "答:减少毒素吸收，减轻疼痛，使感染局限化，吸收或早日成脓肿后切开引流。"}, {"type": "list", "items": ["什么是SIRS，诊断标准如何？"]}, {"type": "p", "text": "答:全身炎症反应综合征①体温＞或＜，②心率＞90，③呼吸＞20，④白细胞＞12×109或＜4×109或未成熟白细胞＞10%。"}, {"type": "list", "items": ["伤口的分类，创伤愈合的类型？"]}, {"type": "p", "text": "答:Ⅰ、Ⅱ、Ⅲ。愈合的类型：一期愈合二期愈合。"}, {"type": "list", "items": ["简述创伤的修复过程？"]}, {"type": "p", "text": "答:①纤维蛋白充填：创伤后局部血管扩张，纤维蛋白渗出，起到止血和封闭创面的作用。②细胞增生：伤后不久，即有新生的细胞在局部出现，成纤维细胞，血管内皮细胞增生成毛细血管，三者共同构成肉芽组织，可充填组织裂隙。成纤维细胞合成胶原纤维，肉芽组织内的胶原纤维增多，其硬度与张力强度随之增加。上皮细胞从创缘向内增生，覆盖创面，伤口趋于愈合。③组织塑形：经过细胞增生和基质沉积，伤后组织经初步修复。但纤维组织，骨痂，在数量和质量上不适应生理功能需要，瘢痕内的胶原和其他基质有一部分被吸收，使瘢痕软化又能保持张力强度，一部分是组织吸收，而新骨的坚强性并不减或更增强。"}, {"type": "list", "items": ["男性30岁，体重60公斤，不慎被蒸气喷伤面部、前胸腹部和双上臂； 面部红斑、疼痛、无水泡，其余部位剧痛，有大水泡。问烫伤总面积？深度？烫伤后第一个24小时应补丢失液量是多少？"]}, {"type": "p", "text": "答:20+3=23，一度3，浅二度20，1800 ml。"}, {"type": "list", "items": ["恶性肿瘤的转移途径有那几种？"]}, {"type": "p", "text": "答:①直接蔓延；②淋巴道转移；③种植性转移；④血道转移。"}, {"type": "list", "items": ["目前确诊肿瘤最直接而可靠的依据是什么？"]}, {"type": "p", "text": "答:病理形态学检查，包括：①细胞学检查；②病理组织学检查。"}, {"type": "list", "items": ["何谓肿瘤的TNM分期？"]}, {"type": "p", "text": "答:T指原发肿瘤，N指淋巴结，M为远处转移。再根据肿块程度在字母后标以0至4的数字，表示肿瘤发展程度。1代表小，4代表大，0为无。"}, {"type": "list", "items": ["何谓癌症的三级预防？"]}, {"type": "p", "text": "答:一级预防是消除或减少可能致癌的因素，防止癌症的发生，其目的是减少癌症的发病率；二级预防是指癌症一旦发生，如何在其早期阶段发现它，予以及时治疗，其目的是降低癌症的死亡率；三级预防指诊断与治疗后的康复，目的是提高生存质量及减轻痛苦，延长生命。"}, {"type": "list", "items": ["癌症三级止痛的基本原则是什么？"]}, {"type": "p", "text": "答:①最初用非吗啡类药，效果不明显时追用吗啡类药，仍不明显时换为强吗啡类药，如仍不明显，考虑药物以外的治疗；②从小剂量开始，视止痛效果渐增量；③口服为主，无效时直肠给药，最后注射给药；④定期给药。"}, {"type": "list", "items": ["恶性肿瘤的综合治疗方法有哪些？"]}, {"type": "p", "text": "答:①手术治疗；②化学治疗；③放射治疗；④生物治疗；⑸中医中药治疗。"}, {"type": "list", "items": ["什么是颅腔的体积/压力关系？"]}, {"type": "p", "text": "答:在颅腔内容物增加的早期，由于颅内的容积代偿作用，颅内压变动很小或不明显。当代偿功能的消耗终于到达一个临界点时，这时即使容积少量增加也会使颅内压大幅升高，这就是颅腔的体积/压力关系。"}, {"type": "list", "items": ["颅内压增高的临床表现有哪些？"]}, {"type": "p", "text": "答:颅内压增高的三主征：头痛、呕吐和视乳头水肿。另外可引起双侧外展神经不全麻痹，复社，陈发性黑朦，头晕，猝倒，意识障碍，头皮静脉怒张，血压增高，脉搏徐缓，小儿头颅增大，颅缝增宽，前囟门饱满，头颅叩诊呈破罐声。最后导致脑疝。"}, {"type": "list", "items": ["什么叫小脑幕切迹疝，其主要临床表现有哪些？"]}, {"type": "p", "text": "答:小脑幕上占位病变或严重脑水肿常常可引起颅内压增高。导致颞叶钩回通过小脑幕切迹，从高压区向低压区移位，疝出到幕下，压迫损害患侧中脑、动眼神经及阻塞环池和中脑导水管等，从而产生了一系列的临床表现，称为小脑幕切迹疝。临床表现主要有①颅内压增高症状。②生命体征明显改变。③病人意识模糊或昏迷，且逐渐加深。④早期患侧瞳孔短时间缩小，继之逐渐散大对光反射消失，对侧瞳孔亦逐渐散大。对侧肢体出现锥体束征或偏瘫，晚期出现去大脑强直。"}, {"type": "list", "items": ["颅底骨折的临床表现和诊断依据？"]}, {"type": "p", "text": "答:①伤后逐渐出现皮下血淤斑。颅前窝骨折位于眶周、球结膜部位，颅中窝骨折位于耳后乳突部位，后颅窝骨折位于枕下及上颈部皮下。②鼻、口咽部出血和/或脑脊液耳鼻漏。③颅神经损害症状、颅内积气等。诊断主要靠临床表现。"}, {"type": "list", "items": ["脑震荡的概念？"]}, {"type": "p", "text": "答:脑震荡是一种轻型颅脑损伤，主要指头部位外伤后立即出现短暂的脑功能损害而无确定的脑器质改变。病理上没有肉眼可见的神经病理改变，显微镜下可见神经组织结构紊乱。"}, {"type": "list", "items": ["急性颅内血肿手术指征？"]}, {"type": "p", "text": "答:①脑疝形成患者。②CT估计幕上血肿超过30-40ml，脑室系统受压和中线移位；幕下血肿超过10ml，脑室受压或脑积水征。③脑幕上血肿小于20ml，幕下血肿小于10ml，但脑室受压明显或中线结构移位或脑积水征明显，ICP大于2.67kpa或临床症状脱水治疗无好转且恶化，CT复查血肿扩大或迟发性。④广泛脑挫裂伤虽无颅内血肿，但是保守治疗情况下出现脑疝或ICP大于4kpa、临床症状恶化者。"}, {"type": "list", "items": ["开放性颅脑损伤的治疗原则？"]}, {"type": "p", "text": "答:伤后24-48小时应彻底清创，伤后72小时以上，无明显感染者亦应清创，酌情做伤口全部或部分缝合，待后二期处理。"}, {"type": "list", "items": ["颅脑损伤病人的主要观察的主要内容是什么？"]}, {"type": "p", "text": "答:①意识状态是判断病情轻重的重要标志，是最重要的观察项目。临床以呼喊病人的名字、压迫眶上神经和疼痛刺激等观察病人的反应，将意识分为嗜睡、昏睡、浅昏迷和深昏迷。国际通用格拉斯哥昏迷分级记分法，总分越低，意识障碍或脑损伤越重。②生命体征 定时测定呼吸、脉搏、血压及体温。③瞳孔变化在伤晴判断中起决定性作用，必须密切连续观察瞳孔的大小，两侧是否对称，对光反应是否存在、敏感度如何。④肢体活动及锥体束征 主要观察肢体的肌力、肌张力、腱反射及病理反射。⑤头痛呕吐等其它颅内压增高的表现。"}, {"type": "list", "items": ["单纯性或结节性甲状腺肿的手术指征有哪些？"]}, {"type": "p", "text": "答:①因气管、食管或喉返神经受压引起临床症状者；②胸骨后甲状腺肿；③巨大甲状腺肿影响生活和工作者；④结节性甲状腺肿继发功能亢进者；⑸结节性甲状腺肿疑有恶变者。"}, {"type": "list", "items": ["甲亢病人术前服用碘剂的作用是什么？"]}, {"type": "p", "text": "答:①抑制蛋白水解酶，减少甲状腺球蛋白的分解，从而抑制甲状腺素的释放，降低基础代谢率；②减少甲状腺的血流量，使腺体充血减少，缩小变硬，从而减少手术中出血。"}, {"type": "list", "items": ["甲亢术后并发呼吸困难和窒息的常见原因有哪些？"]}, {"type": "p", "text": "答:①因手术时止血不完善，切口内出血压迫气管；②喉头水肿，主要是手术创伤所致，也可因气管插管引起；③气管塌陷，是因为软化的气管壁失去支撑所致。"}, {"type": "list", "items": ["乳房的淋巴引流有哪四个途径？"]}, {"type": "p", "text": "答:①乳房外侧和上部淋巴液引流向腋窝淋巴结；②乳房内侧淋巴液引流向内乳淋巴结；③乳房皮下淋巴液可引流向对侧乳房；④乳房深部淋巴液可流向肝脏。"}, {"type": "list", "items": ["简述胸部外伤剖胸探查的指征？"]}, {"type": "p", "text": "答:①进行性出血；②广泛肺裂伤或支气管断裂；③心脏损伤；④胸腹联合伤；⑤较大异物。"}, {"type": "list", "items": ["简述开放性气胸的急救、处理原则？"]}, {"type": "p", "text": "答:①变开放性气胸为闭合性气胸：尽快用无菌敷料严密封闭伤口，并包扎固定。②胸膜腔抽气减压；先穿刺抽气，清创缝合伤口后行闭式胸膜腔引流。③抗休克治疗：给氧、输血、补液等。④手术：及早清创，缝闭伤口，如疑有胸膜腔内脏器损伤或活动性出血，侧需剖胸探查。⑤应用抗生素预防感染。"}, {"type": "list", "items": ["简述张力性气胸的急救原则？"]}, {"type": "p", "text": "答:急救穿刺针排气减压。"}, {"type": "list", "items": ["简述活动性胸腔出血的明显征象有哪些？"]}, {"type": "p", "text": "答:①休克；②闭式引流每小时200ml，持续3小时；③Hb持续下降；④胸穿不凝血液，X线胸腔阴影增大。"}, {"type": "list", "items": ["简述血心包的临床表现？"]}, {"type": "p", "text": "答:Beck三联症：静脉压升高，心音遥远，动脉压降低。(心超或心包穿刺有确诊意义)。"}, {"type": "list", "items": ["简述早期食道癌的临床和X线表现？"]}, {"type": "p", "text": "答:进食哽咽感、胸骨后疼痛或烧灼感、异物感。小充盈缺损、小龛影、黏膜增粗紊乱、管壁僵硬。"}, {"type": "list", "items": ["结合纵隔的临床解剖特征，简述在各个部位的常见纵隔肿瘤？"]}, {"type": "p", "text": "答:后纵隔：神经源性；前上纵隔：胸腺瘤，胸骨后甲状腺肿；前纵隔：畸胎瘤与皮样囊肿。"}, {"type": "list", "items": ["简述风湿性二尖瓣狭窄的手术方式？"]}, {"type": "p", "text": "答:球囊扩张、闭式或直视下分离、换瓣术。"}, {"type": "list", "items": ["什么是嵌顿性疝？绞窄性疝？什么是海氏三角？腹股沟管？"]}, {"type": "p", "text": "答:嵌顿性疝：疝门较小而腹内压突然增高时，疝内容物可强行扩张囊颈而进入疝囊，随后因疝囊颈的弹性回缩，又将内容物卡住，使其不能回缩。绞窄性疝：嵌顿不能及时解除，肠管及其系膜受压情况不断加重可使动脉血流减少，最后完全阻断。海氏三角：直疝三角的外侧边是腹壁下动脉，内侧边为腹直肌外侧缘，底边为腹股沟韧带。腹股沟管：两环四壁。"}, {"type": "list", "items": ["试述斜疝与直疝的鉴别？"]}, {"type": "p", "text": "斜疝"}, {"type": "p", "text": "直疝"}, {"type": "p", "text": "发病年龄"}, {"type": "p", "text": "儿童、青壮年多见"}, {"type": "p", "text": "老年"}, {"type": "p", "text": "突出途径"}, {"type": "p", "text": "经腹股沟管突出，可降入阴囊"}, {"type": "p", "text": "经直疝三角突出，不进阴囊"}, {"type": "p", "text": "疝块外形"}, {"type": "p", "text": "椭圆或梨形"}, {"type": "p", "text": "关球型"}, {"type": "p", "text": "回纳后指压内环"}, {"type": "p", "text": "疝不再突出"}, {"type": "p", "text": "仍可突出"}, {"type": "p", "text": "精索与疝囊的关系"}, {"type": "p", "text": "精索在其后方"}, {"type": "p", "text": "在其前外方"}, {"type": "p", "text": "疝囊颈与腹壁下动脉关系"}, {"type": "p", "text": "在其外侧"}, {"type": "p", "text": "在其内侧"}, {"type": "list", "items": ["闭合性腹部损伤的诊断思路怎样？"]}, {"type": "p", "text": "答:①有无内脏损伤②什么脏器损伤③是否多发性损伤④诊断困难时怎办：其它辅助检查、进行严密观察、剖腹探察。"}, {"type": "list", "items": ["脾破裂的诊断指标？"]}, {"type": "p", "text": "答:外伤史、失血征、腹膜炎体征、抽出不凝固血液，移动性注音阳性。"}, {"type": "list", "items": ["什么是腹膜刺激症，腹膜炎放置腹腔引流的指征有哪些？"]}, {"type": "p", "text": "答:压痛、反跳痛、肌紧张。腹膜炎放置腹腔引流的指征：①坏死灶未能彻底清除或有大量坏死组织无法清楚②预防胃肠道穿孔修补等术后发生漏③手术部位有较多渗液或渗血④已形成的局限性脓肿。"}, {"type": "list", "items": ["腹膜炎除病史、体征外，哪些检查有助于诊断？"]}, {"type": "p", "text": "答:淀粉酶、血象、X线、B超、腹穿、腹腔灌洗。"}, {"type": "list", "items": ["胃十二指肠溃疡的发病机制如何？"]}, {"type": "p", "text": "答:①幽门螺杆菌感染②胃酸分泌过多③非甾体类抗炎药与黏膜屏障损害。"}, {"type": "list", "items": ["胃十二指肠溃疡急性穿孔的诊断要点?"]}, {"type": "p", "text": "答:①有溃疡病史②上腹刀割样剧痛③伴休克或恶心呕吐④明显的腹膜刺激征⑤WBC升高、X线膈下气体、腹穿有食物残渣。"}, {"type": "list", "items": ["胃十二指肠溃疡急性穿孔的术式选择及选择原因？"]}, {"type": "p", "text": "答:单纯穿孔缝合术：穿孔时间超出8小时，腹腔内感染及炎症水肿严重，有大量脓性渗出液；不能耐受急诊彻底性溃疡手术，为单纯穿孔缝合术的适应证。彻底性溃疡手术：穿孔时间短、腹腔内感染及炎症水肿轻、全身情况好。"}, {"type": "list", "items": ["胃十二指肠溃疡的手术适应症？"]}, {"type": "p", "text": "答:严重并发症：急性穿孔、大出血和瘢痕性幽门梗阻。经正规内科治疗无效或反复发作。较大或有恶变可能的胃溃疡。复合性溃疡。"}, {"type": "list", "items": ["胃大部切除术后的早期并发症？"]}, {"type": "p", "text": "答:出血、吻合口破裂或十二指肠残端破裂、梗阻(输入襻、输出襻、吻合口梗阻)或胃排空障碍。"}, {"type": "list", "items": ["胃癌的癌前期病变有哪些？"]}, {"type": "p", "text": "答:胃息肉，慢性萎缩性胃炎，胃溃疡、残胃。"}, {"type": "list", "items": ["进展期胃癌的Boarmman分型？"]}, {"type": "p", "text": "答:①结节型②溃疡局限型③溃疡浸润型④弥漫浸润型。"}, {"type": "list", "items": ["胃癌的常见转移途径？"]}, {"type": "p", "text": "答:①直接浸润②血行转移③腹膜种植转移④淋巴转移。"}, {"type": "list", "items": ["什么是胃癌根治术(D2)和扩大根治术？"]}, {"type": "p", "text": "答[img=http://www.iiyi.com/bbs/images/smilies/default/biggrin.gif]外科学基本知识简答120题(答案) - 雯雯的天空不落泪 - 雯雯的天空不落泪的博客[/img]2：包括周围正常组织的胃部分或全部切除、第二站淋巴结完全清除者。扩大根治术：在根治术的基础上，附有周围脏器的切除、淋巴结的进一步清扫。"}, {"type": "list", "items": ["胃癌的根治程度分级？"]}, {"type": "p", "text": "答:A级：D＞N，切缘无癌细胞浸润。B级：D=N或切缘内有癌细胞累及。C级：仅切除原发灶和部分转移灶，有肿瘤残余。"}, {"type": "list", "items": ["肠梗阻的病因及分类？"]}, {"type": "p", "text": "答:机械性、动力性、血运性肠梗阻。机械性又可分为肠腔堵塞，肠管受压，肠壁病变。"}, {"type": "list", "items": ["简述肠梗阻局部病理生理变化？"]}, {"type": "p", "text": "答:①梗阻上肠蠕动增强，如梗阻不解除，肠蠕动则由强变弱，出现麻痹；②梗阻上段肠腔膨胀，积气积液，70%是吞下的气体，部分来自发酵和血液内气弥散。梗阻后肠壁不再吸收肠内消化液。③肠壁充血水肿，通透性增加，肠腔内压力增高，静脉回流障碍，加上组织缺氧，如压力进一步增加，动脉梗阻肠管坏化。"}, {"type": "list", "items": ["绞窄性肠梗阻的特征？"]}, {"type": "p", "text": "答:①腹痛发作急骤持续性痛②早期出现休克③明显腹膜刺激征④腹胀不对称⑤呕吐物肛门排出血性腹穿血性液⑥积极非手术治疗无改善⑦腹部X片见孤立突出胀大的肠袢不因时间而改变位置或假肿瘤征。"}, {"type": "list", "items": ["试述阑尾炎的临床病理分型及其特点？"]}, {"type": "p", "text": "答:①急性单纯性阑尾炎：属轻型或病变早期，病变只限于粘膜和粘膜下层，阑尾轻度肿胀，有中性粒细胞浸润，临床症状和体征较轻。②急性化脓性阑尾炎：阑尾肿胀明显，浆膜充血，表面有脓性渗出物，病变深达肌层和浆膜的阑尾全层，腔内可积脓，临床症状和体征典型，可形成局限性腹膜炎。③坏疽性及穿孔性阑尾炎：属重型，阑尾管壁坏死，呈暗紫或发黑，腔内积脓，压力高，可发生血运障碍，最后导致穿孔，感染扩散可引起弥漫性腹膜炎。④阑尾炎周围脓肿：大网膜将坏疽或穿孔的阑尾包裹并形成粘连，形成炎性肿块，属炎症局限化的结果。"}, {"type": "list", "items": ["急性阑尾炎诊断要点？"]}, {"type": "p", "text": "答:转移性右下腹痛，右下腹麦氏点固定压痛。"}, {"type": "list", "items": ["急性阑尾炎的鉴别诊断？"]}, {"type": "p", "text": "答:①胃十二指肠溃疡穿孔②右侧输尿管结石③妇产科急腹症④急性肠系膜淋巴结炎⑤其它。"}, {"type": "list", "items": ["对一个右下腹痛的病人，如何考虑阑性炎的诊断？"]}, {"type": "p", "text": "答:①病史上多有转移性右下腹痛的特点；②症状以腹痛为主，多为持续性，疼痛程度与临床病理类型有关；③多伴有恶心，呕吐（反射性），腹泻等胃肠道症状，严重的可出现发热，寒战等感染中毒症状。④体征上以麦氏点周围固定压痛为最常见的重要体征，伴有腹膜刺激征提示发展至化脓性阶段，其余叩诊，结肠充气征，腰大肌征，闭孔肌征亦为辅助手段。⑤实验室检查：白细胞升高（10-20）×109/L，中性粒比例升高。"}, {"type": "list", "items": ["右半及左半结肠癌的临床表现、病理及伴梗阻时处理有何不同？"]}, {"type": "p", "text": "答:右半以肿块型为主，以全身症状、贫血、腹部肿块为主。左半以浸润型为主，以肠梗阻、便秘、腹泻、便血(大便习惯或性状改变)为主。梗阻时：右半结肠癌一般作右半结肠切除一期回结肠吻合术，左半结肠癌一般作梗阻部位的近侧作结肠造口，在肠道充分准备的情况下，再二期手术行根治性切除。"}, {"type": "list", "items": ["直肠癌的常用术式及其适应症？"]}, {"type": "p", "text": "答:①Miles手术适用于腹膜返折以下直肠癌②Dixon手术适用于距齿状线以上的直肠癌③Hartmann手术适用于全身一般情况很差，不能行上述两种手术。"}, {"type": "list", "items": ["肝脏Couinaud分段及Glisson系统？"]}, {"type": "p", "text": "答:肝脏Couinaud分段：以肝静脉及门静脉在肝内分布将肝分为八段。Glisson系统：门静脉、肝动脉和肝胆管分布大体一致共同包绕在Glisson纤维鞘内。"}, {"type": "list", "items": ["细菌性肝脓肿的感染途径及主要治疗方式？"]}, {"type": "p", "text": "答:感染途径：①胆道②肝动脉③门静脉④其它如肝临近感染病灶循淋巴系统侵入。经皮肝穿刺脓肿置管引流或切开引流。"}, {"type": "list", "items": ["原发性肝癌的诊断要点及治疗方式？"]}, {"type": "p", "text": "答:肝硬化病史，典型症状：肝区疼痛，进行性肝肿大；AFP；影象学(B超、CT、MRI、肝动脉造影)；肝穿刺针吸细胞学检查等。治疗方式:①手术治疗包括规则和非规则性切除；②不能切除的行TAE、射频、微波或无水酒精注射等③化疗④放疗⑤生物治疗⑥中医中药治疗。"}, {"type": "list", "items": ["门脉高压症的定义及主要病理改变？"]}, {"type": "p", "text": "答:门脉压力＞30cmH2O，主要病理改变：①脾肿大②交通支扩张③腹水。"}, {"type": "list", "items": ["门脉高压症发生后的侧支循环有哪些？"]}, {"type": "p", "text": "答:①胃底、食管下段交通支②直肠下端、肛管交通支③前腹壁交通支④腹膜后交通支。"}, {"type": "list", "items": ["门脉高压症合并食管胃底静脉曲张破裂出血的手术治疗方式及其优缺点？"]}, {"type": "p", "text": "答:⑴门体分流①非选择性，止血效果好，但肝性脑病发生率高，日后肝移植困难②选择性，优点是肝性脑病发生率低。⑵断流术：优点急诊出血首选，对肝功能影响小，缺点易复发。"}, {"type": "list", "items": ["门脉高压症合并食管胃底静脉曲张破裂出血的非手术治疗有哪些？"]}, {"type": "p", "text": "答:药物止血、内镜治疗、三腔管压迫止血、TIPS。"}, {"type": "list", "items": ["什么是Calot三角？"]}, {"type": "p", "text": "答:由胆囊管、肝总管、肝下缘构成的三角。"}, {"type": "list", "items": ["什么是夏科氏三联症？"]}, {"type": "p", "text": "答:腹痛，寒战高热，黄疸。"}, {"type": "list", "items": ["胆囊结石的主要临床表现、并发症、术式选择？"]}, {"type": "p", "text": "答:胆绞痛是典型表现，Mrizzi综合征，胆囊积液。并发症：①继发胆总管结石②胆原性胰腺炎③胆石性肠梗阻④胆囊癌变。术式选择：①胆囊开腹切除②胆囊造瘘③LC。"}, {"type": "list", "items": ["简述行胆囊切除时，胆总管探查术的指征？"]}, {"type": "p", "text": "答: ①有梗阻性黄疸性，此次发作有明显黄疽者；②手术中扪到胆总管内有结石，蛔虫者；③术中胆道适影显示有胆管结石者；④术中发现胆总管扩张，直径>；⑤术中胆总管穿刺抽出脓血者。"}, {"type": "list", "items": ["肝内、外胆管结石的手术治疗原则？"]}, {"type": "p", "text": "答:取尽结石，解除狭窄，去除病灶，通畅引流。"}, {"type": "list", "items": ["AOSC的诊断要点及治疗原则？"]}, {"type": "p", "text": "答:Reynold五联征:Charcot三联征加休克，神经中枢受抑制。治疗原则：紧急手术解除胆道梗阻并引流。"}, {"type": "list", "items": ["何谓消化道大出血，常见病因？"]}, {"type": "p", "text": "答:一次失血达800ml以上或占总循环血量的20%。常见病因：①胃十二指肠溃疡②门脉高压③出血性胃炎④胃癌⑤胆道出血。"}, {"type": "list", "items": ["急性胰腺炎的常见病因、临床类型？"]}, {"type": "p", "text": "答:常见病因：①胆道疾病②过量饮酒③十二指肠液返流④创伤⑤胰腺血运⑤其它。临床类型：轻型，重型。"}, {"type": "list", "items": ["急性胰腺炎非手术治疗方法有哪些？"]}, {"type": "p", "text": "答:①禁食，胃肠减压②补液，防治休克③镇痛解痉④抑制胰腺分泌⑤营养支持⑥抗生素使用⑦中药⑧腹腔灌洗。"}, {"type": "list", "items": ["痔的临床表现"]}, {"type": "p", "text": "答:①便血：无痛性间歇性便后出鲜血；②痔块脱落：第二、三、四期内痔或混合痔可出现；③疼痛：单纯内痔无疼痛，当合并有血栓形成，嵌顿，感染等情况时，才出现疼痛。④肛周瘙痒。"}, {"type": "list", "items": ["简述内痔分期？"]}, {"type": "p", "text": "答:分四期。第一期：只在排便时出血，痔块不脱出于肛门外；第二期：排便时痔块脱出肛门外，排便后自行还纳；第三期：痔脱出于肛门外需用手辅助才可还纳：第四期：痔块长期在肛门外，不能还纳或还纳后又立即脱出。"}, {"type": "list", "items": ["什么叫膀胱刺激征？"]}, {"type": "p", "text": "答:尿频、尿急、尿痛。"}, {"type": "list", "items": ["血尿不同阶段的临床意义？"]}, {"type": "p", "text": "答:初始血尿提示尿道、膀胱颈部出血。终末血尿提示后尿道、膀胱颈部或膀胱三角区出血。全程血尿提示出血部位在膀胱及其以上部位。"}, {"type": "list", "items": ["尿失禁的类型？"]}, {"type": "p", "text": "答:①真性尿失禁指尿液连续从膀胱中流出，膀胱呈空虚状态。常见于外伤，手术或先天性疾病引起的膀胱颈和尿道括约肌的损伤。②压力性尿失禁当腹内压突然增加(咳嗽，喷嚏大笑屏气)时，尿液不随意地流出。多见于女性多次分娩或产伤者。③急迫性尿失禁严重的尿频尿急而膀胱不受意识控制而发生排空，通常继发于膀胱的严重感染。④充溢性尿失禁指膀胱功能完全失代偿，膀胱过度充盈而造成尿不断溢出，见于各种原因所致的慢性尿潴留。"}, {"type": "p", "text": "100、肾损伤的病理类型？"}, {"type": "p", "text": "答:①肾挫伤；②肾部分裂伤；③肾全程裂伤；④肾蒂损伤。"}, {"type": "p", "text": "101、尿道损伤治疗原则有哪些?(5分)"}, {"type": "p", "text": "答:①引流尿液，解除尿潴留②多个皮肤切口，引流尿外渗部位③恢复尿道的连续性④防止尿道狭窄及尿瘘⑤防治休克。"}, {"type": "p", "text": "102、泌尿系的感染途径？"}, {"type": "p", "text": "答:上行感染，血行感染，淋巴感染，直接感染。"}, {"type": "p", "text": "103、前列腺增生的临床表现？"}, {"type": "p", "text": "答:①尿频、夜尿次数增多，②排尿困难，③残余尿增多，充盈性尿失禁，急性尿潴留。"}, {"type": "p", "text": "104、肾癌的诊断与治疗？"}, {"type": "p", "text": "答:临床表现：血尿、疼痛和肿块；辅助检查：B超、CT、MRI；根治性切除术是肾癌最主要的治疗方法。"}, {"type": "p", "text": "105、膀胱肿瘤的诊断？"}, {"type": "p", "text": "答:无痛性肉眼血尿；影像学检查:B超、IVP、CT和MRI；膀胱镜检查。"}, {"type": "p", "text": "106、双侧上尿路结石的手术治疗原则？"}, {"type": "p", "text": "答:①双侧输尿管结石时，先处理梗阻严重侧。②一侧肾结石，另一侧输尿管结石时先处理输尿管结石。③双侧肾结石时，在尽可能保留肾的前提下，先处理容易一侧，肾功能极差时宜先行皮肾造漏。④孤立肾上尿路结石或双侧上尿路梗阻引起急性完全性梗阻无尿时及时施行手术。全身情况不允许时应置管引流或皮肾造漏。"}, {"type": "p", "text": "107、简述骨折的原因并举例?"}, {"type": "p", "text": "答:①直接暴力，如车轮撞击小腿致胫腓骨骨折；②间接暴力，如股四头肌猛烈收缩致髌骨骨折；③积累性劳损，如远距离行军致第二跖骨骨折及腓骨下1/3骨干骨折。"}, {"type": "p", "text": "108、简述骨折段移位类型及影响因素？"}, {"type": "p", "text": "答:类型①成角移位：以顶角方向为准②侧方移位：近折段为准③缩短移位：重叠成嵌插④分离移位：间隙⑤旋转移位。影响因素：①外界暴力的性质、大小和作用方向②肌肉的牵拉③骨折远侧段肢体的牵拉，可致骨折分离移位④不恰当的搬运和治疗。"}, {"type": "p", "text": "109、列举骨折的晚期并发症?"}, {"type": "p", "text": "答:①坠积性肺炎；②褥疮；③下肢深静脉血栓形成；④感染；⑤损伤性骨化；⑥创伤性骨化；⑦关节僵直；⑧急性骨萎缩。"}, {"type": "p", "text": "110、骨折功能复位的标准?"}, {"type": "p", "text": "答:①骨折部位的旋转移位、分离移位必须完全矫正；②缩短移位在成人下肢骨折不超过，儿童在以内；③成角移位：下肢若向侧方移位，与关节活动方向垂直，必须完全矫正；上肢骨折，前臂双骨折要求对位、对线均好；④长骨干横性骨折：骨折端对位至少达1/3，干骺端骨折至少应达到对位3/4。"}, {"type": "p", "text": "111、骨折临床愈合标准?"}, {"type": "p", "text": "答:①局部无压痛及纵向叩击痛；②局部无异常活动；③X线示骨折处连续性骨痂，骨折线已模糊；④拆除外固定后，上肢能向前平举重物持续达1分钟；下肢不扶拐平地连续步行1分钟，并不少于30步；连续观察2周骨折处不变形。"}, {"type": "p", "text": "112、骨折延迟愈合、不愈合和畸形愈合的概念?"}, {"type": "p", "text": "答:骨折延迟愈合：经治疗，超过一般愈合所需的时间，骨折断端仍然未出现骨折连接；骨折不愈合：经治疗，超过一般愈合的时间，且经再度延长治疗时间，仍然达不到骨性愈合；骨折畸形愈合：骨折愈合的位置未达到功能复位的要求，存在成角、旋转或重叠畸形。"}, {"type": "p", "text": "113、简述骨折愈合过程简述影响骨折愈合的因素?"}, {"type": "p", "text": "答:①全身因素：年龄、健康等；②局部因素：骨折的类型和数量；骨折部位的血液供应；软组织损伤程度；软组织嵌入；感染等；③治疗方法的影响：反复手法复位、手术时软组织和骨膜剥离太多，骨折固定不牢固等。"}, {"type": "p", "text": "114、Colles骨折和Smith骨折的体征和骨折端移位情况？"}, {"type": "p", "text": "答:Colles骨折典型体征和移位情况：局部肿胀、瘀斑，腕部活动受限，侧面呈“银叉样”畸形，正面呈“枪刺样”畸形；骨折远端向桡、背侧移位，近端向掌侧移位；Smith骨折典型体征和移位情况：腕部下垂，局部肿胀、瘀斑，腕部活动受限；骨折远端向掌、桡侧移位，近折端向背侧移位。"}, {"type": "p", "text": "115、列举股骨颈骨折的三种分类方法(骨折线、X线、移位程度)？"}, {"type": "p", "text": "答:按骨折线部位分股骨头下骨折、经股骨颈骨折、股骨颈基底骨折；按X线变现分内收骨折、外展骨折；按移位程度分不完全骨折、完全骨折(无移位的完全骨折、部分移位的完全骨折和完全移位的完全骨折)。"}, {"type": "p", "text": "116、 关节脱位的诊断？"}, {"type": "p", "text": "答:⑴外伤史⑵除外局部肿胀、疼痛、功能障碍，有以下特征：①肘部明显畸形，肘关节周径增加，前臂缩短②肘关节弹性固定于半伸位③肘后失去正常三角关系④肘前方可触及肱骨远端，肘后方可触及尺骨鹰嘴。"}, {"type": "p", "text": "117、肩关节脱位的主要症状和体征？如何分型？"}, {"type": "p", "text": "答:局部症状：患处疼痛、肿胀，患者不敢活动肩关节；主要体征：方肩畸形、Dugas征阳性；肩关节脱位可分为前脱位、后脱位、盂下脱位、盂上脱位。"}, {"type": "p", "text": "119、试述腰椎间盘突出症的重要体征？"}, {"type": "p", "text": "答:①腰椎侧凸②腰部活动受限③压痛及骶棘肌痉挛④直腿抬高试验或加强试验阳性⑤双下肢感觉异常及肌力下降⑥踝反射减弱或消失表示骶神经受压⑦可伴马尾神经受压症状。"}, {"type": "p", "text": "120、描述骨巨细胞瘤和骨肉瘤的X线征象?"}, {"type": "p", "text": "答:骨巨细胞瘤的X线变现：骨端偏心位溶骨性破坏而无骨膜反应，病灶骨皮质膨胀变薄，呈肥皂泡样改变；骨肉瘤的X线表现：主要一成骨性的骨硬化化灶或溶骨性的破坏，骨膜反应可见Codman三角或“日光射线”现象。"}];</script>
<script>
(function () {
  if (WB.mountChrome) WB.mountChrome('materials');

  var body = document.getElementById('body');
  body.innerHTML = WB.renderBlocks(window.__DOC_BLOCKS || []);
  if (WB.fx && WB.fx.init) WB.fx.init();

  var base = (window.R2_BASE || '').replace(/\/+$/, '');
  var prefix = window.R2_PREFIX || '';
  var dl = document.getElementById('dgDl');
  if (base && /^https?:/.test(base) && dl && dl.getAttribute('data-key')) {
    dl.href = base + '/' + prefix + dl.getAttribute('data-key').split('/').map(encodeURIComponent).join('/');
  } else if (dl) {
    dl.style.display = 'none';
  }

  var links = [].slice.call(document.querySelectorAll('.toc a[href^="#"]'));
  if (!links.length) return;
  var heads = links.map(function (a) { return document.getElementById(a.getAttribute('href').slice(1)); });
  function paint() {
    var top = window.scrollY + 120, idx = 0;
    heads.forEach(function (h, i) { if (h && h.offsetTop <= top) idx = i; });
    links.forEach(function (a, i) { a.classList.toggle('on', i === idx); });
  }
  window.addEventListener('scroll', paint, { passive: true });
  paint();
})();
</script>
