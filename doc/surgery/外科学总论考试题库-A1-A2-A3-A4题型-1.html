"type": "p", "text": "B、静脉血管张力"}, {"type": "p", "text": "C、肺动脉楔压"}, {"type": "p", "text": "D、静脉回心血量"}, {"type": "p", "text": "B 低"}, {"type": "p", "text": "B、用一般的吸氧法可缓解早期的呼吸窘迫"}, {"type": "p", "text": "8．OKPa D、气道阻塞引起通气障碍可引起本病"}, {"type": "p", "text": "C、动脉血氧分压多低于"}, {"type": "p", "text": "E、本病最终可导致死亡"}, {"type": "p", "text": "18．下列关于术前准备的叙述中，哪个不正确"}, {"type": "p", "text": "A、术前应学会正确咳嗽和咯痰的方法"}, {"type": "p", "text": "E 低"}, {"type": "p", "text": "B、术前应练习在床上大、小便"}, {"type": "p", "text": "C、对操作时间长的大手术，术前应预防性应用抗生素"}, {"type": "p", "text": "E、有吸烟习惯的病人应于术前 1 周开始停止吸烟"}, {"type": "p", "text": "D、术前 4 小时开始禁止饮水"}, {"type": "p", "text": "19．对烧伤创面的处理，下列说法中哪个不正确"}, {"type": "p", "text": "A、宜先行烧伤清创术"}, {"type": "p", "text": "C 低"}, {"type": "p", "text": "B、小面积的Ⅱ °烧伤者，如水泡完整，宜先在表面涂碘伏，再吸出泡内液体，包扎"}, {"type": "p", "text": "C、创面表面涂抗生素软膏，以防止细菌感染"}, {"type": "p", "text": "E、全身多处烧伤可用包扎和暴露相结合的方法"}, {"type": "p", "text": "D、头部、颈部创面宜用暴露法"}, {"type": "p", "text": "20．高钾血症的心电图改变最不可能是"}, {"type": "p", "text": "A、T 波高而尖 B、QT 间期延长"}, {"type": "p", "text": "D 低"}, {"type": "p", "text": "C、QRS 增宽 D、 U 波 E、RP 间期延长"}, {"type": "p", "text": "21．下列哪一项不是肾调节机体酸碱平衡的机理"}, {"type": "p", "text": "A、H+-Na+ 的交换 B、HCO3- 的重吸收"}, {"type": "p", "text": "C、肾素 — — 醛固硐系统兴奋，醛固硐的分泌增加"}, {"type": "p", "text": "D、分泌 NH3 与 H+结合成 NH4+ 排出 E、尿的酸化而排出 H+"}, {"type": "p", "text": "22．下列哪项不是气管插管的并发症 C 中"}, {"type": "p", "text": "A、喉头水肿 B、肺不张 C、苏醒延迟"}, {"type": "p", "text": "23．下列哪项不是深静脉插管引起感染的原因"}, {"type": "p", "text": "A、插管时无菌操作不严格"}, {"type": "p", "text": "C 低"}, {"type": "p", "text": "D、心律失常"}, {"type": "p", "text": "C 中"}, {"type": "p", "text": "E、肺部感染"}, {"type": "p", "text": "B、经常往导管系统加人药物"}, {"type": "p", "text": "24 小时才使用"}, {"type": "p", "text": "C、营养液配制后低温环境保存超过"}, {"type": "p", "text": "D、插管后局部伤口处理不妥"}, {"type": "p", "text": "E、营养液配制过程在普通治疗室进行"}, {"type": "p", "text": "E 中"}, {"type": "p", "text": "24．下列哪项不属于开放性伤口"}, {"type": "p", "text": "A、清洁伤口"}, {"type": "p", "text": "B、沾染伤口"}, {"type": "p", "text": "C、感染伤口"}, {"type": "p", "text": "D、刀刃切割伤"}, {"type": "p", "text": "E、高处坠落肝破裂"}, {"type": "p", "text": "25．烧伤休克期补液时，调节补液量及速度的指标不包括"}, {"type": "p", "text": "中"}, {"type": "p", "text": "A"}, {"type": "p", "text": "A、血 pH 值、 CO2CP，红细胞压积"}, {"type": "p", "text": "E、肢体浅静脉和甲下毛细血管充盈情况"}, {"type": "p", "text": "26．下列哪一项不属于临界性肿瘤"}, {"type": "p", "text": "A、良性肿瘤位于两个脏器交界处"}, {"type": "p", "text": "B、中心静脉压"}, {"type": "p", "text": "A 中"}, {"type": "p", "text": "C、尿量"}, {"type": "p", "text": "D、口渴"}, {"type": "p", "text": "B、包膜不完整的纤维瘤"}, {"type": "p", "text": "C、生物学行为介于良恶性之间"}, {"type": "p", "text": "D、切除后易复发"}, {"type": "p", "text": "C 中"}, {"type": "p", "text": "E、唾液腺混合瘤"}, {"type": "p", "text": "27．ARF 时最需紧急处理的情况是"}, {"type": "p", "text": "A、酸中毒"}, {"type": "p", "text": "28．不用造影剂而显示尿路梗阻部位及程度的检查是"}, {"type": "p", "text": "A、CT B、KUB+IVP C、KUB D、肾图"}, {"type": "p", "text": "29．患者腰部绞痛后突然无尿常提示 B 中"}, {"type": "p", "text": "A、肾前性 ARF B、肾后性 ARF C、肾性 ARF D、 MOD E、ARDS"}, {"type": "p", "text": "30．MODS 一期速发型的发生往往由于 B 中"}, {"type": "p", "text": "C、肾功能障碍"}, {"type": "p", "text": "B、水中毒"}, {"type": "p", "text": "C、高钾血症"}, {"type": "p", "text": "D、感染"}, {"type": "p", "text": "E、低钠血症"}, {"type": "p", "text": "E 中"}, {"type": "p", "text": "E、磁共振水成像"}, {"type": "p", "text": "A、原发急症甚轻"}, {"type": "p", "text": "D、肺功能障碍"}, {"type": "p", "text": "B、原发急症甚为严重"}, {"type": "p", "text": "E、胃肠功能障碍"}, {"type": "p", "text": "31．发生 MODS 时，要待病变进展到相当程度方有明显临床表现的系统或器官是"}, {"type": "p", "text": "C"}, {"type": "p", "text": "中"}, {"type": "p", "text": "A、心血管"}, {"type": "p", "text": "B、肺 C、肝、胃肠和血液凝固系统"}, {"type": "p", "text": "E 中"}, {"type": "p", "text": "D、脑 E、肾"}, {"type": "p", "text": "32．关于 MODS 以下哪个是正确的？"}, {"type": "p", "text": "A、凡有两个或两个以上的重要器官功能衰竭即是"}, {"type": "p", "text": "B、肝脏损害往往是首发器官"}, {"type": "p", "text": "MODS"}, {"type": "p", "text": "C、全身性炎症反应（ SIRS）只表现在感染而与损伤无关"}, {"type": "p", "text": "D、肠道细菌 /内毒素移位可触发（ SIRS），但不会导致 MODS"}, {"type": "p", "text": "E、以上都是错的"}, {"type": "p", "text": "33．关于 MODS 以下叙述哪个是不正确的？"}, {"type": "p", "text": "C 中"}, {"type": "p", "text": "A、当病人出现创伤、休克、严重脓毒症时，应警惕有可能并发"}, {"type": "p", "text": "B、对病人的救治必须有整体观念"}, {"type": "p", "text": "MODS"}, {"type": "p", "text": "C、急性创伤时，只要出现呼吸困难，就可以诊断为"}, {"type": "p", "text": "D、病因治疗是防治 MODS 的首要措施"}, {"type": "p", "text": "ARDS"}, {"type": "p", "text": "E、防治感染是预防 MODS 极为重要的措施"}, {"type": "p", "text": "34．关于多器管功能不全综合症（"}, {"type": "p", "text": "A、MODS 常指急性疾病过程中发生的两个或两个以上主要器官功能不全"}, {"type": "p", "text": "B、其特点之一是急性 C、死亡率高"}, {"type": "p", "text": "MODS ）以下哪个是错误的？"}, {"type": "p", "text": "D 中"}, {"type": "p", "text": "D、凡是两个或两个以上的主要器官功能不全就是"}, {"type": "p", "text": "E、MODS 最好的治疗是预防"}, {"type": "p", "text": "MODS"}, {"type": "p", "text": "35．现在认识MSOF 属于全身性病理连锁反应，受累的器官处于变化中，病变有轻有"}, {"type": "p", "text": "重，所以改称为 B 中"}, {"type": "p", "text": "A、ARDS B、MODS C、ARF D、AOSC E、DIC"}, {"type": "p", "text": "36．MODS 二期迟发型的形成往往由于 D 中"}, {"type": "p", "text": "B、心衰 C、肾衰 D、继发感染特续存在毒素或抗原"}, {"type": "p", "text": "A、原发急症甚为严重"}, {"type": "p", "text": "E、肝衰"}, {"type": "p", "text": "37．ARF 时，若尿素氮升高较肌酐明显，其比例>20 时，提示"}, {"type": "p", "text": "C 中"}, {"type": "p", "text": "A、肾前性 ARF B、肾后性 ARF C、高分解代谢存在"}, {"type": "p", "text": "E、肾性 ARF"}, {"type": "p", "text": "D、低分解代谢存在"}, {"type": "p", "text": "38．ARF 当有高钾血症时必然有："}, {"type": "p", "text": "A、高钠血症 B、高钙血症 C、高氯血症"}, {"type": "p", "text": "39．ARF 时，导致低血钠的主要原因是："}, {"type": "p", "text": "D 中"}, {"type": "p", "text": "D、高镁血症"}, {"type": "p", "text": "D 中"}, {"type": "p", "text": "B、代谢障碍使 “钠泵效应下降 ”"}, {"type": "p", "text": "D、水潴留 E、代谢性酸中毒"}, {"type": "p", "text": "E、低磷血症"}, {"type": "p", "text": "A、钠丢失过多"}, {"type": "p", "text": "C、肾小管功能障碍"}, {"type": "p", "text": "40．关于 ARDS 以下哪种说法最正确？中"}, {"type": "p", "text": "A、有明显的呼吸困难 B、呼吸频率增快"}, {"type": "p", "text": "C、有发绀征象，并有烦躁不安"}, {"type": "p", "text": "E、动脉血气检查异常"}, {"type": "p", "text": "D、是急性呼吸衰竭的一种类型"}, {"type": "p", "text": "41．有关 ARDS 的诊断以下哪项是错的？"}, {"type": "p", "text": "E 中"}, {"type": "p", "text": "A、有诱发 ARDS 的基础病因，如严重创伤、脓毒症等"}, {"type": "p", "text": "B、急性呼吸困难节律频速"}, {"type": "p", "text": "C、胸片示双肺有弥漫性浸润病灶"}, {"type": "p", "text": "D、一般的氧疗其低氧难以纠正"}, {"type": "p", "text": "42．肾性 ARF ，尿比重恒定于"}, {"type": "p", "text": "E、动脉血气分析是正常的"}, {"type": "p", "text": "B 中"}, {"type": "p", "text": "A、1.000-1.009 B、1.010-1.014 C、1.015-1.019 D、1.020-1.024 E、1.025-1.030"}, {"type": "p", "text": "43．治疗急性呼吸窘迫综合征以下哪项是错的？"}, {"type": "p", "text": "A、主要支持呼吸的方法用呼吸机进行呼末正压通气"}, {"type": "p", "text": "B、因正压在通气使回心血量减少，所以要大量快速输液"}, {"type": "p", "text": "B 中"}, {"type": "p", "text": "C、防治感染是重要措施"}, {"type": "p", "text": "E、纠正低氧的同时，应兼顾其它主要器官功能的支持治疗，防止"}, {"type": "p", "text": "44．治疗 ARF 以下哪项是不正确的？ E 中"}, {"type": "p", "text": "A、有效的治疗基于正确的诊断。不同原因所致"}, {"type": "p", "text": "D、可选用改善肺循环的药物"}, {"type": "p", "text": "MODS"}, {"type": "p", "text": "ARF 需要不同的治疗方法"}, {"type": "p", "text": "B、对于肾前性 ARF ，简单而有效的方法就是补充血容量"}, {"type": "p", "text": "C、尿路梗阻患者必须解除梗阻"}, {"type": "p", "text": "D、在对 ARF 的保守治疗中，纠正水电解质酸平衡紊乱十分重要"}, {"type": "p", "text": "E、一旦确认急性肾衰竭，立即行血液透析治疗"}, {"type": "p", "text": "45．ARF 病人出现高钾血症时其治疗以下哪项是不正确的？"}, {"type": "p", "text": "A、血钾超过 6.5mmol/L 立即进行血液透析"}, {"type": "p", "text": "A 中"}, {"type": "p", "text": "B、10%葡萄糖酸钙静脉推注"}, {"type": "p", "text": "C、5%碳酸氢钠 100ml 静脉滴注"}, {"type": "p", "text": "E、口服钙离子交换树脂"}, {"type": "p", "text": "A 中"}, {"type": "p", "text": "C、酸中毒"}, {"type": "p", "text": "C 中"}, {"type": "p", "text": "D、葡萄糖 — 胰岛素混合液静脉滴注"}, {"type": "p", "text": "46．多尿期常见的死亡原因是："}, {"type": "p", "text": "A、低血钾或感染"}, {"type": "p", "text": "B、消化道出血"}, {"type": "p", "text": "D、高钾血症"}, {"type": "p", "text": "E、低钠血症"}, {"type": "p", "text": "47．急性肾衰竭时以下哪个是错的？"}, {"type": "p", "text": "A、机体代谢产生的固定酸需通过肾排出体外，因此，"}, {"type": "p", "text": "B、因磷排泄减少，导致钙吸收减少，出现低钙血症"}, {"type": "p", "text": "C、病人易出现负氮平衡，因此，补氮量愈多愈好"}, {"type": "p", "text": "ARF 经常会导致酸中毒"}, {"type": "p", "text": "D、血液透析的优点是能快速清除过多的水分、电解质和代谢产物"}, {"type": "p", "text": "E、高血钾时见效最快的方法是静脉内注入钙离子"}, {"type": "p", "text": "48．关于急性肾衰竭（ ARF）以下哪个是正确的？"}, {"type": "p", "text": "C 中"}, {"type": "p", "text": "A、肾前性肾功能不全，尿比重通常小于"}, {"type": "p", "text": "C、血液滤过是治疗严重酸中毒的最佳方法"}, {"type": "list", "items": ["010"]}, {"type": "p", "text": "B、急性肾衰一定伴有少尿"}, {"type": "p", "text": "D、严重创伤并发 ARF 时要严格控制蛋白质摄入"}, {"type": "p", "text": "E、以上都正确"}, {"type": "p", "text": "49．患者手术中误输异型血后无尿"}, {"type": "p", "text": "2 天，最有效的治疗方案是？"}, {"type": "p", "text": "C、输注甘露醇 D、输注速尿"}, {"type": "p", "text": "50．有时 24 小时尿量超过 800ml，但血中肌肝、尿素氮进行性升高，称为"}, {"type": "p", "text": "E 中"}, {"type": "p", "text": "A、输注地塞米松"}, {"type": "p", "text": "B、输注碳酸氢钠"}, {"type": "p", "text": "E、血液透析"}, {"type": "p", "text": "C 中"}, {"type": "p", "text": "A、急性肾衰"}, {"type": "p", "text": "B、慢性肾衰"}, {"type": "p", "text": "C、非少尿型急性肾衰"}, {"type": "p", "text": "A 中"}, {"type": "p", "text": "D、MOSD E、ARDS"}, {"type": "p", "text": "51．ARF 发生的主要原因是："}, {"type": "p", "text": "A、肾血管收缩缺血和肾小管细胞变性坏死"}, {"type": "p", "text": "B、肾小球滤过率下降"}, {"type": "p", "text": "C、代谢性酸中"}, {"type": "p", "text": "毒"}, {"type": "p", "text": "D、高钾血症"}, {"type": "p", "text": "52．ARF 少尿无尿阶段最主要的死亡原因是："}, {"type": "p", "text": "A、低钠血症 B、高磷及低钙血症 C、高钾血症"}, {"type": "p", "text": "53．ARF 少尿期治疗以下哪项是错的？ C 中"}, {"type": "p", "text": "A、限制水份，防治高血钾 B、血液滤过是治疗严重酸中毒的最佳方法"}, {"type": "p", "text": "E、水中毒"}, {"type": "p", "text": "C 中"}, {"type": "p", "text": "D、高镁血症"}, {"type": "p", "text": "E、水中毒"}, {"type": "p", "text": "C、腹膜透析治疗适于所有的病人且效果最佳"}, {"type": "p", "text": "E、维持营养，补充适量热卡和蛋白质"}, {"type": "p", "text": "D、严格控制感染"}, {"type": "p", "text": "54．下列哪项是血液透析的禁忌症？"}, {"type": "p", "text": "E 中"}, {"type": "p", "text": "A、BuN>30mmol/L"}, {"type": "p", "text": "B、血清钾 >6.5mmol/L C、血清肌酐 >908umot/L D、严重酸中"}, {"type": "p", "text": "毒"}, {"type": "p", "text": "E、休克"}, {"type": "p", "text": "55．下列哪个部位施行局部麻醉时麻醉药可加肾上腺素"}, {"type": "p", "text": "B 中"}, {"type": "p", "text": "A、高血压病人椎管内麻醉"}, {"type": "p", "text": "B、疝气修补，局部浸润麻醉"}, {"type": "p", "text": "E、气管内粘膜麻醉"}, {"type": "p", "text": "C、阴茎神经阻滞"}, {"type": "p", "text": "D、指间神经阻滞"}, {"type": " "type": "p", "text": "C、循环超负荷致急性心衰"}, {"type": "p", "text": "E、过敏反应"}, {"type": "p", "text": "D、细菌污染反应"}, {"type": "p", "text": "131、以下哪种血浆增量剂输入过量时可引起出血倾向："}, {"type": "p", "text": "A 中"}, {"type": "p", "text": "A、右旋糖酐"}, {"type": "p", "text": "D、明胶类代血浆"}, {"type": "p", "text": "132.以下哪项不是休克代偿期的临床表现："}, {"type": "p", "text": "A、心率增快 B、精神紧张 C、面色苍白"}, {"type": "p", "text": "133.反映休克病人脑组织灌流不足的主要指标是："}, {"type": "p", "text": "A、精神状态 B、动脉血压 C、皮肤色泽"}, {"type": "p", "text": "134.反映肾血流灌注的可靠指标是："}, {"type": "p", "text": "A、血压 B、脉率 C、尿量"}, {"type": "p", "text": "B、6%羟乙基淀粉代血浆"}, {"type": "p", "text": "C、10%羟乙基淀粉代血浆"}, {"type": "p", "text": "E、以上均不是"}, {"type": "p", "text": "E 中"}, {"type": "p", "text": "D、脉压差缩小"}, {"type": "p", "text": "A 中"}, {"type": "p", "text": "E、血压降低"}, {"type": "p", "text": "D、尿量"}, {"type": "p", "text": "E、脉率"}, {"type": "p", "text": "C 中"}, {"type": "p", "text": "D、中心静脉压"}, {"type": "p", "text": "E、肺毛细血管楔压"}, {"type": "p", "text": "D 中"}, {"type": "p", "text": "A、5cmH2O B、10cmH2O C、15cmH2O D、 20cmH2O E、25cmH?2O"}, {"type": "p", "text": "136.当中心静脉压（ CVP）低于多少时常表示血容量不足： A 中"}, {"type": "p", "text": "A、5cmH2O B、10cmH2O C、15cmH2O D、 20cmH2O E、25cmH2O"}, {"type": "p", "text": "137、肺毛细血管楔压的正常值是： B 中"}, {"type": "p", "text": "135.当中心静脉压（ CVP）超过多少时表示有充血性心衰："}, {"type": "p", "text": "A、5～6mmHg B、6～15mmHg C、10～20mmHg D、20～25mmHg"}, {"type": "p", "text": "E、10～21mmHg"}, {"type": "p", "text": "138 当肺毛细血管楔压（ PCWP）低于多少时表示血容量不足："}, {"type": "p", "text": "A、4mmHg B、6mmHg C、10mmHg D、 15mmHg E、20mmHg"}, {"type": "p", "text": "139.有关休克监测指标的叙述，以下哪项正确： D 中"}, {"type": "p", "text": "A、脉率的变化多出现在血压下降之后 B、脉压差缩正常出现在血压下降之后"}, {"type": "p", "text": "C、中心静脉压在反映全身血容量及心功能状态方面其变化此动脉压晚"}, {"type": "p", "text": "B 中"}, {"type": "p", "text": "D、肺毛细血管楔压（ PCWP）反映低血容量较中心静脉压（"}, {"type": "p", "text": "E、当脉率 /收缩压指数＞ 1.0 时多表示无休克"}, {"type": "p", "text": "CVP）敏感"}, {"type": "p", "text": "140、鉴别心源性和低血容量性休克最可靠的指标是"}, {"type": "p", "text": "A、血压 B、心率 C、尿量 D、CVP E、血乳酸盐"}, {"type": "p", "text": "141.可增强心肌收缩力，同时能扩张肾和内脏血管的多巴胺剂量是："}, {"type": "p", "text": ": D 中"}, {"type": "p", "text": "D 中"}, {"type": "p", "text": "A、＞10μ g/(mni 2 kg) B、＞15μ g/(mni 2 kg) C、＜20μ g/(mni 2 kg) D、＜ 10μ g/(mni2 kg)"}, {"type": "p", "text": "E、＜ 15μ g/(mni2 kg)"}, {"type": "p", "text": "142.小剂量多巴胺主要兴奋："}, {"type": "p", "text": "A、 α受体 B、 β1受体 C、 β2受体 D、多巴胺受体"}, {"type": "p", "text": "143.治疗失血性休克的关键是： B 中"}, {"type": "p", "text": "E 中"}, {"type": "p", "text": "E、多巴胺受体和 β1受体"}, {"type": "p", "text": "A、应用糖皮质激素"}, {"type": "p", "text": "D、纠正电解质紊乱"}, {"type": "p", "text": "B、补充血容量和止血"}, {"type": "p", "text": "E、血管活性药的应用"}, {"type": "p", "text": "C、纠正酸碱平衡失调"}, {"type": "p", "text": "144.一位失血性休克病人，经补充血容量后其血压及"}, {"type": "p", "text": "CVP 仍低，此时的处理"}, {"type": "p", "text": "D、给予酚妥拉明"}, {"type": "p", "text": "是： E"}, {"type": "p", "text": "中"}, {"type": "p", "text": "A、给予两地兰"}, {"type": "p", "text": "B、给予多巴胺"}, {"type": "p", "text": "C、给予阿拉明"}, {"type": "p", "text": "E、继续充分补液"}, {"type": "p", "text": "145.一位低血容量性休克患者，经治疗后血压恢复正常，"}, {"type": "p", "text": "E 中"}, {"type": "p", "text": "CVP 却高于正常值，原因是："}, {"type": "p", "text": "A、血容量严重不足"}, {"type": "p", "text": "E、左心功能不全"}, {"type": "p", "text": "B、血容量不足"}, {"type": "p", "text": "C、右心功能不全"}, {"type": "p", "text": "E 中"}, {"type": "p", "text": "D、容量血管过度收缩"}, {"type": "p", "text": "146.以下哪项不是 “冷休克 ”的临床表现："}, {"type": "p", "text": "A、躁动或神志淡漠"}, {"type": "p", "text": "E、尿量＞ 30ml/h"}, {"type": "p", "text": "B、血压降低"}, {"type": "p", "text": "C、心率增快"}, {"type": "p", "text": "D、脉压差缩小"}, {"type": "p", "text": "147.低血容量性休克患者经治疗后其"}, {"type": "p", "text": "CVP 高，血压仍低，原因是："}, {"type": "p", "text": "C 中"}, {"type": "p", "text": "A、血容量严重不足"}, {"type": "p", "text": "B、血容量不足"}, {"type": "p", "text": "C、血容量相对过多或心功能不全"}, {"type": "p", "text": "D、容量血管过度收缩"}, {"type": "p", "text": "E、心功能不全或血容量不足"}, {"type": "p", "text": "148 低血容量性休克患者测得其"}, {"type": "p", "text": "CVP 为 3cmH2O ，血压 90/60mmHg ，处理原则是： B"}, {"type": "p", "text": "中"}, {"type": "p", "text": "A、充分快速补液"}, {"type": "p", "text": "B、适当补液"}, {"type": "p", "text": "C、给强心药物"}, {"type": "p", "text": "D、舒张血管"}, {"type": "p", "text": "E、补液试验"}, {"type": "p", "text": "149.低血容量性休克患者，治疗后测得"}, {"type": "p", "text": "CVP6cmH2O ，血压 85/60mmHg ，处理原则是："}, {"type": "p", "text": "E 中"}, {"type": "p", "text": "A、充分补液"}, {"type": "p", "text": "150.关于损伤性休克的治疗，以下哪项不正确："}, {"type": "p", "text": "B、适当补液"}, {"type": "p", "text": "C、给强心药物"}, {"type": "p", "text": "D、舒张血管"}, {"type": "p", "text": "A 中"}, {"type": "p", "text": "E、补液实验"}, {"type": "p", "text": "A、损伤性休克的急救不需补充血容量"}, {"type": "p", "text": "C、妥善固定（制动）受伤部位"}, {"type": "p", "text": "B、疼痛刺激严重者可适当镇痛"}, {"type": "p", "text": "D、对危及生命的创伤（如张力性气胸）应作必要的紧急处理"}, {"type": "p", "text": "E、应使用抗生素，防继发感染"}, {"type": "p", "text": "151 关于 “暖休克 ”的叙述，以下哪项不正确："}, {"type": "p", "text": "A、血流动力学改变为低排高阻型 B、动静脉短路大量开放"}, {"type": "p", "text": "D、存在细胞代谢障碍 E、一般出现在革兰氏阳性菌感染引起的感染性休克早期"}, {"type": "p", "text": "152、有关感染性休克的叙述，以下哪项不正确："}, {"type": "p", "text": "A、病理生理改变复杂 B、不易产生心和肾损害"}, {"type": "p", "text": "A 中"}, {"type": "p", "text": "C、存在组织灌流不足"}, {"type": "p", "text": "B 中"}, {"type": "p", "text": "C、易产生组织细胞氧利用障碍"}, {"type": "p", "text": "D、易并发 DIC E、酸中毒发生早"}, {"type": "p", "text": "153.有关 “冷休克 ”的叙述，以下哪项不正确："}, {"type": "p", "text": "A 中"}, {"type": "p", "text": "A、血流动力学改变为高排低阻型"}, {"type": "p", "text": "C、临床上较 “暖休克 ”多见"}, {"type": "p", "text": "E、革兰氏阳性菌感染引起的"}, {"type": "p", "text": "B、因大量毛细血管通透性增加致血容量减少"}, {"type": "p", "text": "D、可由革兰氏阴性菌感染引起"}, {"type": "p", "text": "“暖休克 ”加重时，可转为 “冷休克 ”、"}, {"type": "p", "text": "154.有关感染性休克的治疗，以下哪项不正确："}, {"type": "p", "text": "A、血流动力学改变为高排低阻型"}, {"type": "p", "text": "E 中"}, {"type": "p", "text": "B、常有心和肾损害，一般应监测"}, {"type": "p", "text": "C、应尽早处理原发病灶以控制感染"}, {"type": "p", "text": "E、可大量长期应用糖皮质激素"}, {"type": "p", "text": "CVP，指导输液量和速度"}, {"type": "p", "text": "D、常需使用心血管药物维持循环平稳"}, {"type": "p", "text": "155.脾破裂失血性休克患者，在快速大量补充血容量后，血压仍低，心率快，且腹胀加"}, {"type": "p", "text": "重，此时最重要的紧急处理措施是： B 中"}, {"type": "p", "text": "B、急诊手术止血"}, {"type": "p", "text": "A、继续补液治疗"}, {"type": "p", "text": "C、给予多巴胺"}, {"type": "p", "text": "D、给予阿拉明"}, {"type": "p", "text": "E、给予大剂量糖皮质激素"}, {"type": "p", "text": "156、以下哪项不是低血容量性休克的表现："}, {"type": "p", "text": "B 中"}, {"type": "p", "text": "A、CVP 降低 B、PCWP 高于 15mmHg C、心输出量（ CO）降低"}, {"type": "p", "text": "D、外周血管阻力增加"}, {"type": "p", "text": "E、心率增快"}, {"type": "p", "text": "CVP 正常，心输出量增高，外周血管阻力降低，血压"}, {"type": "p", "text": "A 中"}, {"type": "p", "text": "C、酚妥拉明"}, {"type": "p", "text": "157.感染性休克患者测得其"}, {"type": "p", "text": "80/60mmHg ，此时最适用的血管活性药是："}, {"type": "p", "text": "A、多巴胺 B、多巴酚丁胺"}, {"type": "p", "text": "D、去甲肾上腺素"}, {"type": "p", "text": "E、西地兰"}, {"type": "p", "text": "158.临床上常通过观察尿量的变化来评价休克的治疗效果，当成人尿量维持"}, {"type": "p", "text": "超过多少时表示休克已纠正： C 中"}, {"type": "p", "text": "A、10ml/h B、20ml/h C、30ml/h D、 40ml/h E、50ml/h"}, {"type": "p", "text": "159.关于休克病人几个监测指标的叙述，以下哪项不正确："}, {"type": "p", "text": "A、精神状态反映脑组织血液灌流情况"}, {"type": "p", "text": "C 中"}, {"type": "p", "text": "B、皮肤色泽、温度是体表血管灌注情况的标志"}, {"type": "p", "text": "C、血压是反映休克程度及治疗效果最敏感的指标"}, {"type": "p", "text": "D、脉率的变化多出现在血压下降之前"}, {"type": "p", "text": "E、尿量是反映肾血液灌注情况的有用指标"}, {"type": "p", "text": "160.以下哪项不是休克抑制期的临床表现："}, {"type": "p", "text": "A、神志淡漠 B、极度口渴 C、肢端发绀"}, {"type": "p", "text": "D、脉率大于 100 次 /分 E、血压 95/60mmHg"}, {"type": "p", "text": "161.肝破裂失血性休克患者，其血压 82/50mmHg ，心率 120 次/分，皮肤苍白，"}, {"type": "p", "text": "神志淡漠，估计失血量为： E 中"}, {"type": "p", "text": "A、300ml 以下 B、400～800ml C、500～700ml D、800～1600ml E、 1600ml 以"}, {"type": "p", "text": "E 中"}, {"type": "p", "text": "上"}, {"type": "p", "text": "162、有关麻醉学的内容下列哪项正确："}, {"type": "p", "text": "A、临床麻醉 B、急救与复苏 C、重症监测与治疗"}, {"type": "p", "text": "163、有关现代麻醉方法，下列哪项不正确 B 中"}, {"type": "p", "text": "A、全身麻醉 B、中药麻醉 C、局部麻醉"}, {"type": "p", "text": "164、有关围手术期潜在危险因素下列哪项正确"}, {"type": "p", "text": "E 中"}, {"type": "p", "text": "D、疼痛诊治"}, {"type": "p", "text": "E、以上都是"}, {"type": "p", "text": "D、粘膜麻醉"}, {"type": "p", "text": "E、椎管内麻醉"}, {"type": "p", "text": "E 中"}, {"type": "p", "text": "A、手术创伤和失血"}, {"type": "p", "text": "C、外科疾病本身"}, {"type": "p", "text": "B、麻醉方法及药物对病人生理功能影响"}, {"type": "p", "text": "D、并存症 E、以是都是"}, {"type": "p", "text": "165、存在胃癌根治手术中潜在危险因素下列哪项不正确"}, {"type": "p", "text": "E 中"}, {"type": "p", "text": "A、麻醉方法及药物"}, {"type": "p", "text": "B、手术创伤和失症"}, {"type": "p", "text": "E、外科疾病本身"}, {"type": "p", "text": "C、并存症"}, {"type": "p", "text": "D、背部脂肪瘤"}, {"type": "p", "text": "166、有关美国麻醉医师协会（"}, {"type": "p", "text": "A、I 级病人病情最重，Ⅴ级最轻"}, {"type": "p", "text": "ASA ）分级下列哪项正确"}, {"type": "p", "text": "B 中"}, {"type": "p", "text": "B、Ⅲ级病人的器官功能已受损但在代偿范围内"}, {"type": "p", "text": "C、Ⅴ级病人风险大，但仍可考虑行择期手术"}, {"type": "p", "text": "D、体格健康，发育营养良好各器官功能正常属Ⅱ级"}, {"type": "p", "text": "E、I 级病人无手术死亡率"}, {"type": "p", "text": "167、有关美国麻醉医师协会（"}, {"type": "p", "text": "ASA ）分级下列哪项不正确"}, {"type": "p", "text": "C 中"}, {"type": "p", "text": "A、ASA 分级分为 5 级 B、分级越高，病情越重，死亡率也越高"}, {"type": "p", "text": "C、急性阑尾炎病人有发热、无伴随病应分类为Ⅰ级"}, {"type": "p", "text": "D、Ⅴ级者为濒死病人，麻醉和手术异常危险"}, {"type": "p", "text": "E、Ⅲ级病人如术前准备充分，尚能耐受手术"}, {"type": "p", "text": "168、ASA 分级标准哪项不正确"}, {"type": "p", "text": "C 中"}, {"type": "p", "text": "A、Ⅰ级身体健康，发育营养良好，各器官功能正常"}, {"type": "p", "text": "B、Ⅱ级除外科疾病外，有轻度并存病，功能代偿健全，"}, {"type": "p", "text": "C、Ⅲ级并存病较严重，体力活动有限，生活不能自理"}, {"type": "p", "text": "D、Ⅳ级并存病严重，丧失日常工作能力，经常面临生命威胁"}, {"type": "p", "text": "E、Ⅴ级：无论手术与否，生命难以维持"}, {"type": "p", "text": "24 小时的濒死病人"}, {"type": "p", "text": "169、麻醉前准备事项哪项不正确 B 中"}, {"type": "p", "text": "A、纠正或改善病理生理状态"}, {"type": "p", "text": "B、高血压病人抗高血压药物术前应停用"}, {"type": "p", "text": "E、麻醉设备和用具及药品准备"}, {"type": "p", "text": "A 中"}, {"type": "p", "text": "C、精神状态准备"}, {"type": "p", "text": "D、胃肠道准备"}, {"type": "p", "text": "170、有关术前禁食禁饮哪项不正确"}, {"type": "p", "text": "A、应激情况胃排空加速"}, {"type": "p", "text": "B、成人禁食 12 小时，禁饮 4 小时"}, {"type": "p", "text": "C、小儿禁食 4— 8 小时，禁水 2— 3 小时"}, {"type": "p", "text": "D、急症病人病情紧急时，不能等待禁食，应立即手术"}, {"type": "p", "text": "E、饱胃病人必需立即手术时，应采取避免呕吐误吸的措施"}, {"type": "p", "text": "171、有关术前准备哪些正确"}, {"type": "p", "text": "B 中"}, {"type": "p", "text": "A、高血压病术前宜使用中枢性降压药"}, {"type": "p", "text": "B、抗高血压治疗应持续到手术当日"}, {"type": "p", "text": "C、术前高血压病人，术前血压应降至正常水平"}, {"type": "p", "text": "E、单胺氧化酶抑制剂不影响病人手术中血压情况"}, {"type": "p", "text": "D、血压高不宜行择期手术"}, {"type": "p", "text": "172、麻醉前用药的目的不包括"}, {"type": "p", "text": "B 中"}, {"type": "p", "text": "A、清除病人紧张焦虑"}, {"type": "p", "text": "B、预防术后感染"}, {"type": "p", "text": "C、提高病人疼痛阈值减轻痛苦"}, {"type": "p", "text": "D、抑制呼吸道腺体分泌功能"}, {"type": "p", "text": "173、下列叙述哪项不正确"}, {"type": "p", "text": "E、减轻式清除手术或麻醉引起的不良反射"}, {"type": "p", "text": "D 中"}, {"type": "p", "text": "A、抗胆碱药目前并不常规作为术前用药"}, {"type": "p", "text": "C、东莨菪碱对心率增快的影响弱于阿托品"}, {"type": "p", "text": "B、阿托品的中枢作用弱于东莨菪碱"}, {"type": "p", "text": "D 、抗胆碱药不影响散热"}, {"type": "p", "text": "E、抗胆碱能减轻椎管内麻醉时迷走神经亢进反应"}, {"type": "p", "text": "174、术前用药的使用原则下列叙述哪项正确"}, {"type": "p", "text": "A、老人、小儿宜用麻醉性镇痛药于手术前缓解疼痛"}, {"type": "p", "text": "D 中"}, {"type": "p", "text": "B、老人、小儿宜首选东莨菪碱"}, {"type": "p", "text": "C、婴幼儿代谢率高镇静药相对较大"}, {"type": "p", "text": "D、小儿腺体分泌旺盛，术前抗胆碱药量可偏大"}, {"type": "p", "text": "E、术前用药只能采用肌肉注射途径给药"}, {"type": "p", "text": "175、术前用药原则下列哪项不正确"}, {"type": "p", "text": "C 中"}, {"type": "p", "text": "A、一般情况差，老年体弱术前用药应酌情减量"}, {"type": "p", "text": "B、冠心病、高血压病人镇静药可适当加量"}, {"type": "p", "text": "D、全身麻醉一般使用镇静药和抗胆碱药"}, {"type": "p", "text": "C、选择椎管内麻醉者一般不用抗胆碱药"}, {"type": "p", "text": "E、有呼吸抑制的病人一般术前不使用镇静药和阿片类药"}, {"type": "p", "text": "176、下列有关术前常用药物的叙述哪些不正确"}, {"type": "p", "text": "A、地西泮具有镇静、催眠、抗焦虑及抗惊厥的作用"}, {"type": "p", "text": "B、苯巴比妥具有镇静、催眠和抗惊厥的作用"}, {"type": "p", "text": "C 中"}, {"type": "p", "text": "C、抗胆碱药能拮抗 N 受体激动剂作用"}, {"type": "p", "text": "D、阿托品有明显抑制汗腺分泌的能力"}, {"type": "p", "text": "E、镇静催眠药均具有对局麻药毒性反应也有一定的防治作用"}, {"type": "p", "text": "177、影响吸入麻醉药吸收的因素，下列哪项不正确"}, {"type": "p", "text": "A、通气效应即有效肺泡通气量 B、浓度效应，即吸入药浓度"}, {"type": "p", "text": "D、血气分配系数，指药物的溶解度"}, {"type": "p", "text": "E 中"}, {"type": "p", "text": "C、心输出量"}, {"type": "p", "text": "E、最低肺胞有效浓度"}, {"type": "p", "text": "178、吸入麻醉药的主要排出途径"}, {"type": "p", "text": "D 中"}, {"type": "p", "text": "A、肾 B、肝 C、皮肤 D、呼吸道"}, {"type": "p", "text": "E、胆汁"}, {"type": "p", "text": "180、下列吸入麻醉药属气体麻醉药是"}, {"type": "p", "text": "A 中"}, {"type": "p", "text": "A、氧化亚氮"}, {"type": "p", "text": "B、恩氟烷（安氟醚）"}, {"type": "p", "text": "C、异氟烷（异氟醚）"}, {"type": "p", "text": "D、七氟烷（七氟醚）"}, {"type": "p", "text": "E、地氟烷（地氟醚）"}, {"type": "p", "text": "182 非特异性感染不包括："}, {"type": "p", "text": "A、多菌感染 B、伤口金葡菌感染"}, {"type": "p", "text": "囊炎"}, {"type": "p", "text": "183 急性感染是指："}, {"type": "p", "text": "D 中"}, {"type": "p", "text": "C、化脓性阑尾炎"}, {"type": "p", "text": "D、肺部隐球菌感染"}, {"type": "p", "text": "E 胆"}, {"type": "p", "text": "A 中"}, {"type": "p", "text": "A、病变在 2 周以内的感染"}, {"type": "p", "text": "D、数小时至 1 周的感染"}, {"type": "p", "text": "B、7~10 天的感染"}, {"type": "p", "text": "E 三天以内"}, {"type": "p", "text": "C、急性炎症为主，发病"}, {"type": "p", "text": "3 周以内"}, {"type": "p", "text": "184 外科感染的特点，下列哪项是错误的："}, {"type": "p", "text": "A、常有明显的局部症状 B、不会引起严重的全身感染"}, {"type": "p", "text": "C、一般需要外科治疗的感染性疾病 D、可以是几种细菌的混合感染"}, {"type": "p", "text": "B 中"}, {"type": "p", "text": "E 局部红肿热"}, {"type": "p", "text": "痛"}, {"type": "p", "text": "185 感染灶近侧皮肤出现 “红线 ”是： D 中"}, {"type": "p", "text": "A、网状淋巴管炎"}, {"type": "p", "text": "B、浅部静脉炎"}, {"type": "p", "text": "C、深部淋巴管炎"}, {"type": "p", "text": "D、浅表淋巴管炎"}, {"type": "p", "text": "E 深静"}, {"type": "p", "text": "脉炎"}, {"type": "p", "text": "186 丹毒的致病菌是："}, {"type": "p", "text": "A、金黄葡萄球菌"}, {"type": "p", "text": "B 中"}, {"type": "p", "text": "B、乙型溶血性链球菌"}, {"type": "p", "text": "C、大肠杆菌"}, {"type": "p", "text": "D、拟杆菌"}, {"type": "p", "text": "E 绿脓杆菌"}, {"type": "p", "text": "187 感染早期中性粒细胞增多是由于："}, {"type": "p", "text": "D 中"}, {"type": "p", "text": "A 中性粒细胞数量多"}, {"type": "p", "text": "B、中性粒细胞体积小"}, {"type": "p", "text": "C、中性粒细胞可塑性大"}, {"type": "p", "text": "D、中性粒细胞移动迅速"}, {"type": "p", "text": "E 中性粒细胞体积大"}, {"type": "p", "text": "188 面部 “危险三角区 ”的危险在于："}, {"type": "p", "text": "A、侵入上颌窦 B、颅内化脓性感染"}, {"type": "p", "text": "189 痈切开引流与一般脓肿的切开不同在于："}, {"type": "p", "text": "B 中"}, {"type": "p", "text": "C、内眦静脉炎"}, {"type": "p", "text": "D 中"}, {"type": "p", "text": "D、做 “ +或”“ + +切”口 E 对口切口"}, {"type": "p", "text": "D、演变成痈"}, {"type": "p", "text": "E 在面部"}, {"type": "p", "text": "A、切口较大"}, {"type": "p", "text": "190 脓性指头炎切开引流的指征是："}, {"type": "p", "text": "A、掌指功能障碍 B、红肿热痛"}, {"type": "p", "text": "191 破伤风是破伤风梭菌引起的："}, {"type": "p", "text": "A、菌血症 B、局部感染"}, {"type": "p", "text": "192 破伤风最早出现强烈收缩的肌肉是："}, {"type": "p", "text": "A、上肢肌 B、背肌 C、、咀嚼肌"}, {"type": "p", "text": "193 自动免疫法预防破伤风时间为："}, {"type": "p", "text": "B、要多个小切口"}, {"type": "p", "text": "C、切口深"}, {"type": "p", "text": "D 中"}, {"type": "p", "text": "C、有波动感"}, {"type": "p", "text": "C 中"}, {"type": "p", "text": "D、搏动性跳痛"}, {"type": "p", "text": "E 破溃"}, {"type": "p", "text": "C、脓毒症"}, {"type": "p", "text": "D、MODS"}, {"type": "p", "text": "E FOS"}, {"type": "p", "text": "C 高"}, {"type": "p", "text": "D、颈项肌"}, {"type": "p", "text": "D 高"}, {"type": "p", "text": "E 四肢肌"}, {"type": "p", "text": "A、1~3 年 B、3~5 年 C、5~10 年 D、10~15 年 E 终生"}, {"type": "p", "text": "194 破伤风的治疗原则中，错误的是： D 高"}, {"type": "p", "text": "A、及时正确处理伤口"}, {"type": "p", "text": "C、补充水、电解质"}, {"type": "p", "text": "B、应用抗毒素中和毒素"}, {"type": "p", "text": "D、常规气管切开保证气道通畅"}, {"type": "p", "text": "E 避声光"}, {"type": "p", "text": "195 破伤风病人注射大量抗毒素的目的是："}, {"type": "p", "text": "D 高"}, {"type": "p", "text": "A、控制和解除痉挛"}, {"type": "p", "text": "C、减少毒素的产生"}, {"type": "p", "text": "B、抑制破伤风梭菌的繁殖"}, {"type": "p", "text": "D、中和游离毒素"}, {"type": "p", "text": "E 杀细菌"}, {"type": "p", "text": "A 高"}, {"type": "p", "text": "196 预防创伤后气性坏疽最可靠的方法是："}, {"type": "p", "text": "A、彻底清创 B、使用大剂量抗生素"}, {"type": "p", "text": "C、双氧水冲洗或湿敷伤口"}, {"type": "p", "text": "E 开放创口"}, {"type": "p", "text": "D、及时气性坏疽抗毒血清治疗"}, {"type": "p", "text": "197 关于创伤分类，哪项不对： E 高"}, {"type": "p", "text": "A、按致伤原因"}, {"type": "p", "text": "B、按组织器官"}, {"type": "p", "text": "C、按受伤部位"}, {"type": "p", "text": "D、按伤情的轻重"}, {"type": "p", "text": "E、按有无骨折或内脏伤"}, {"type": "p", "text": "198 关于切伤，下列哪项是错误的："}, {"type": "p", "text": "E 高"}, {"type": "p", "text": "A、伤口缘整齐"}, {"type": "p", "text": "B、出血较多"}, {"type": "p", "text": "C、周围组织损伤较轻"}, {"type": "p", "text": "D、损伤深时可切断大血管、肌腱等"}, {"type": "p", "text": "199．组织烧伤后的体液渗出，一般要持续到伤后："}, {"type": "p", "text": "A、24 小时 B、72 小时 C、12 小时 D、8 小时 E、36～48 小时"}, {"type": "p", "text": "E、伤口内常留有异物"}, {"type": "p", "text": "E 高"}, {"type": "p", "text": "200．根据烧伤体液渗出的规律，烧伤早期的补液速度应是："}, {"type": "p", "text": "C 高"}, {"type": "p", "text": "A、均匀补充"}, {"type": "p", "text": "B、先慢后快"}, {"type": "p", "text": "C、先快后慢"}, {"type": "p", "text": "D 高"}, {"type": "p", "text": "D、快速补充"}, {"type": "p", "text": "E、慢速补充"}, {"type": "p", "text": "201．烧伤早期发生的休克属于："}, {"type": "p", "text": "A、失血性休克"}, {"type": "p", "text": "B、损伤性休克"}, {"type": "p", "text": "C、感染性休克"}, {"type": "p", "text": "D、低血容量性休克"}, {"type": "p", "text": "E、神经性休克"}, {"type": "p", "text": "202．关于烧伤急救正确的是："}, {"type": "p", "text": "D 高"}, {"type": "p", "text": "B、不能用冷水冲洗"}, {"type": "p", "text": "E、不能用非易燃品覆盖灭火"}, {"type": "p", "text": "203．关于大面积严重烧伤早期处理，不正确的是： D 高"}, {"type": "p", "text": "A、火焰烧伤者可用双手扑打火焰"}, {"type": "p", "text": "C、可以奔跑呼救"}, {"type": "p", "text": "D、用冷水冲洗"}, {"type": "p", "text": "A、尽量避免长途转运"}, {"type": "p", "text": "E、必要时做气管切开"}, {"type": "p", "text": "B、可用止痛剂"}, {"type": "p", "text": "C、最好就近输液抗休克"}, {"type": "p", "text": "D、大量口服盐水"}, {"type": "p", "text": "204．已发生了休克的烧伤病人清创时机应在"}, {"type": "p", "text": "C 高"}, {"type": "p", "text": "A、待生命体征完全正常后清创"}, {"type": "p", "text": "B、立即清创"}, {"type": "p", "text": "C、休克好转后清创"}, {"type": "p", "text": "D、烧伤后 8 小时内清创"}, {"type": "p", "text": "E、烧伤后 24 小时内清创"}, {"type": "p", "text": "E 高"}, {"type": "p", "text": "205．关于冻疮的描述正确的是："}, {"type": "p", "text": "A、冻疮是低温造成，因此北方发病率较高"}, {"type": "p", "text": "C、发生冻疮后不会发生局部溃疡"}, {"type": "p", "text": "B、冻疮的发生 type": "p", "text": "A、限制水份，防治高血钾"}, {"type": "p", "text": "C"}, {"type": "p", "text": "中"}, {"type": "p", "text": "B、血液滤过是治疗严重酸中毒的最佳方法"}, {"type": "p", "text": "C、腹膜透析治疗适于所有的病人且效果最佳"}, {"type": "p", "text": "D、严格控制感染"}, {"type": "p", "text": "E、维持营养，补充适量热卡和蛋白质"}, {"type": "p", "text": "105．ARF病人出现高钾血症时其治疗以下哪项是不正确的？"}, {"type": "p", "text": "A、血钾超过 6.5mmol/L 立即进行血液透析"}, {"type": "p", "text": "B、10%葡萄糖酸钙静脉推注"}, {"type": "p", "text": "A"}, {"type": "p", "text": "中"}, {"type": "p", "text": "C、5%碳酸氢钠 100ml 静脉滴注"}, {"type": "p", "text": "D、葡萄糖— 胰岛素混合液静脉滴注"}, {"type": "p", "text": "E、口服钠离子或钙离子交换树脂"}, {"type": "p", "text": "106．治疗 ARF以下哪项是不正确的？"}, {"type": "p", "text": "E"}, {"type": "p", "text": "中"}, {"type": "p", "text": "A、有效的治疗基于正确的诊断。不同原因所致"}, {"type": "p", "text": "ARF需要不同的治疗方法"}, {"type": "p", "text": "B、对于肾前性 ARF，简单而有效的方法就是补充血容量"}, {"type": "p", "text": "C、尿路梗阻患者必须解除梗阻"}, {"type": "p", "text": "D、在对 ARF的保守治疗中，纠正水电解质酸平衡紊乱十分重要"}, {"type": "p", "text": "E、一旦确认急性肾衰竭，立即行血液透析治疗"}, {"type": "p", "text": "107．治疗急性呼吸窘迫综合征以下哪项是错的？"}, {"type": "p", "text": "A、主要支持呼吸的方法用呼吸机进行呼末正压通气"}, {"type": "p", "text": "B、因正压在通气使回心血量减少，所以要大量快速输液"}, {"type": "p", "text": "B"}, {"type": "p", "text": "中"}, {"type": "p", "text": "C、防治感染是重要措施"}, {"type": "p", "text": "E、纠正低氧的同时，应兼顾其它主要器官功能的支持治疗，防止"}, {"type": "p", "text": "108 有关 ARDS的诊断以下哪项是错的？"}, {"type": "p", "text": "A、有诱发 ARDS的基础病因，如严重创伤、脓毒症等"}, {"type": "p", "text": "D 、可选用改善肺循环的药物"}, {"type": "p", "text": "MODS"}, {"type": "p", "text": "E"}, {"type": "p", "text": "中"}, {"type": "p", "text": "B、急性呼吸困难节律频速"}, {"type": "p", "text": "C 、胸片示双肺有弥漫性浸润病灶"}, {"type": "p", "text": "D、一般的氧疗其低氧难以纠正"}, {"type": "p", "text": "E 、动脉血气分析是正常的"}, {"type": "p", "text": "109．关于 ARDS以下哪种说法最正确？"}, {"type": "p", "text": "D"}, {"type": "p", "text": "中"}, {"type": "p", "text": "A、有明显的呼吸困难 B 、呼吸频率增快 C 、有发绀征象，并有烦躁不安"}, {"type": "p", "text": "D、是急性呼吸衰竭的一种类型"}, {"type": "p", "text": "E 、动脉血气检查异常"}, {"type": "p", "text": "110 心肺复苏成功与否的关键是："}, {"type": "p", "text": "C"}, {"type": "p", "text": "中"}, {"type": "p", "text": "A、有气管插管 B 、在医院 C 、时间的早晚 D 、是否给药 E 、是否除颤"}, {"type": "p", "text": "111 最简单、快捷适于现场复苏的人工呼吸方法是："}, {"type": "p", "text": "B"}, {"type": "p", "text": "中"}, {"type": "p", "text": "A、呼吸机控制呼吸"}, {"type": "p", "text": "D、食道堵塞通气法"}, {"type": "p", "text": "B 、徒手人工呼吸 C 、面罩人工呼吸法"}, {"type": "p", "text": "E 、喉罩人工通气法"}, {"type": "p", "text": "112，、采用吹入呼气的人工呼吸法时， 成人呼出气中氧含量在下列数值中哪个是正确的？"}, {"type": "p", "text": "B 中"}, {"type": "p", "text": "A、5％ B 、16％ C 、20.9% D 、32% E 、47%"}, {"type": "p", "text": "4，关于心跳骤停的诊断，下列哪项是最正确的？"}, {"type": "p", "text": "D"}, {"type": "p", "text": "中"}, {"type": "p", "text": "A、病人动桡脉搏动摸不到"}, {"type": "p", "text": "B 、无自主呼吸 C 、病人心音听不到，称为心搏停止"}, {"type": "p", "text": "E 、神志消失"}, {"type": "p", "text": "D、颈总动脉搏动消失"}, {"type": "p", "text": "113，常温下心脏停搏导致脑细胞不可逆损伤的脑细胞耐受缺血缺氧时间大约是多少分"}, {"type": "p", "text": "钟？ B"}, {"type": "p", "text": "中"}, {"type": "p", "text": "A、8— 10 分钟 B 、 4— 6 分钟 C 、10— 20 分钟 D 、4— 5 秒钟 E 、15— 20 分钟"}, {"type": "p", "text": "114，胸外心脏按压最常见的并发症是？"}, {"type": "p", "text": "A、肋骨骨折 B 、心脏破裂 C 、肝脏破裂 D 、脾脏破裂 E 、胃破裂"}, {"type": "p", "text": "115，有效的心脏按压，双手应放在病人的什么部位？"}, {"type": "p", "text": "A"}, {"type": "p", "text": "中"}, {"type": "p", "text": "B"}, {"type": "p", "text": "中"}, {"type": "p", "text": "胸骨的上段 B 、胸骨上 2/3 与下 1/3 交接处 C 、剑突 D 、胸骨中、上 1/3 交界处"}, {"type": "p", "text": "E、心前区"}, {"type": "p", "text": "8，心跳骤停，最迅速、最重要的抢救措施是？"}, {"type": "p", "text": "D"}, {"type": "p", "text": "中"}, {"type": "p", "text": "口对口人工呼吸 B 、拖起下颌C 、心前区除颤 D 、胸外心脏按压"}, {"type": "p", "text": "E、气管插管"}, {"type": "p", "text": "116，心肺复苏中处理室颤最有效的措施是？"}, {"type": "p", "text": "A、静脉注射肾上腺素 B 、静脉注射利多卡因"}, {"type": "p", "text": "D 中"}, {"type": "p", "text": "C、同步电击除颤 D 、非同步电击除颤"}, {"type": "p", "text": "E、立即按放心脏起搏器"}, {"type": "p", "text": "117，CPR时，用于提高心、脑血流灌注的药物是？"}, {"type": "p", "text": "B"}, {"type": "p", "text": "中"}, {"type": "p", "text": "A、阿托品 B 、肾上腺素 C 、去甲肾上腺素 D 、氯化钙 E 、利多卡因"}, {"type": "p", "text": "118，低温在脑复苏中的应用以下哪项是错的？"}, {"type": "p", "text": "A、CPCR时，头部应是重点降温"}, {"type": "p", "text": "E"}, {"type": "p", "text": "中"}, {"type": "p", "text": "B、体温每降低 1℃可使代谢率下降 5%--6%"}, {"type": "p", "text": "C、在降温过程中应防止寒战抽搐"}, {"type": "p", "text": "D、复温应使体温缓慢回升"}, {"type": "p", "text": "E、凡是心脏停搏者都必须降温"}, {"type": "p", "text": "119，在脑复苏时，防治急性脑水肿下列哪项是错的？"}, {"type": "p", "text": "A、甘露醇是最常用的渗透性利尿药为主要的脱水剂"}, {"type": "p", "text": "B、快速利尿剂速尿可作为辅助用药"}, {"type": "p", "text": "E"}, {"type": "p", "text": "中"}, {"type": "p", "text": "C、白蛋白也是能防治脑水肿的药物之一"}, {"type": "p", "text": "D、50%高渗葡萄糖是防治脑水肿的常用药物"}, {"type": "p", "text": "E、肾上腺皮质激素也作为治疗脑水肿的常用药物"}, {"type": "p", "text": "120，有关 CPCR以下哪项是错的？"}, {"type": "p", "text": "D"}, {"type": "p", "text": "中"}, {"type": "p", "text": "A、脑复苏的成功与否取决于早期有效的心肺复苏"}, {"type": "p", "text": "B、脑缺血缺氧性损害主要是在脑再灌注后"}, {"type": "p", "text": "C、脑再灌注后损伤的主要病理生理改变是脑水肿和颅内压升高"}, {"type": "p", "text": "D、只要采取了脑复苏措施，病人就一定会苏醒"}, {"type": "p", "text": "E、脱水、低温和肾上腺皮质激素是防治心停后急性脑水肿的主要措施"}, {"type": "p", "text": "121，关于复苏后的治疗以下哪项是错的？"}, {"type": "p", "text": "A、心肺复苏后应保持呼吸和循环功能良好和稳定"}, {"type": "p", "text": "B、预防应激性溃疡 C 、防治肾功能衰竭"}, {"type": "p", "text": "D、对中枢神经系统功能加以判断和评估预后"}, {"type": "p", "text": "E、为了不影响神志，病人寒战抽搐应禁止用镇静止惊药"}, {"type": "p", "text": "E"}, {"type": "p", "text": "中"}, {"type": "p", "text": "122，电除颤在 CPR时应用以下哪项是正确的？"}, {"type": "p", "text": "A、室细颤、粗颤，电除颤效果都好"}, {"type": "p", "text": "B"}, {"type": "p", "text": "中"}, {"type": "p", "text": "B、除颤是治疗室颤的唯一有效方法"}, {"type": "p", "text": "C、除颤的电能愈大愈好，所以首次即用"}, {"type": "p", "text": "D、首次除颤未成功，紧接着反复除颤"}, {"type": "p", "text": "E、交流电除颤优于直流电除颤"}, {"type": "p", "text": "360J"}, {"type": "p", "text": "121，以下哪项是错的？"}, {"type": "p", "text": "B"}, {"type": "p", "text": "中"}, {"type": "p", "text": "A、高钾引起的心脏骤停，钙剂是绝对适应症"}, {"type": "p", "text": "B、异丙肾上腺素在 CPR时是常规用药"}, {"type": "p", "text": "C、心肺复苏过程中，应重视低血容量的纠正"}, {"type": "p", "text": "D、CPR时，最好以血气结果指导碱性药物的应用"}, {"type": "p", "text": "E 反射性心脏骤停（如胆心反射） ，应立即静注阿托品"}, {"type": "p", "text": "123，有关 CPR以下哪项是正确的？"}, {"type": "p", "text": "A、病人突然神志消失应立即胸外心脏按压"}, {"type": "p", "text": "B、对口人工呼吸效果优于简易呼吸囊辅助呼吸"}, {"type": "p", "text": "C、判断病人是否心停应即刻行 ECG监测"}, {"type": "p", "text": "D"}, {"type": "p", "text": "中"}, {"type": "p", "text": "D、要具备开胸条件，应随时准备开胸心脏按压"}, {"type": "p", "text": "E、以上都对"}, {"type": "p", "text": "124，以下叙述哪项是正确的？"}, {"type": "p", "text": "C"}, {"type": "p", "text": "中"}, {"type": "p", "text": "A、常温下脑对无氧的耐受时间可达"}, {"type": "p", "text": "8---14 分钟"}, {"type": "p", "text": "B、胸外心脏按压时，停止口对口人工呼吸"}, {"type": "p", "text": "C、胸外心脏按压促使血流的动力主要是胸泵机制"}, {"type": "p", "text": "D、心脏按压有效的指征是可以听到心音"}, {"type": "p", "text": "E、心脏按压有效时双瞳孔一定会恢复"}, {"type": "p", "text": "125．术前禁食的最主要目的是："}, {"type": "p", "text": "E"}, {"type": "p", "text": "中"}, {"type": "p", "text": "A、避免术后腹胀 B 、促进术后肛门排气"}, {"type": "p", "text": "C、避免胃肠道膨胀影响手术"}, {"type": "p", "text": "E、防止术中、术后误吸和呕吐"}, {"type": "p", "text": "D 、减少肠麻痹的发生"}, {"type": "p", "text": "126．结肠手术术前准备哪项不正确："}, {"type": "p", "text": "D"}, {"type": "p", "text": "中"}, {"type": "p", "text": "A、术前会阴部备皮 B 、术前 1～ 2 天进流质饮食"}, {"type": "p", "text": "C、术前清洁灌肠 D 、术前 1～2 天静脉应用抗生素"}, {"type": "p", "text": "E、术前插胃管"}, {"type": "p", "text": "127．下列哪种情况为择期手术"}, {"type": "p", "text": "E"}, {"type": "p", "text": "中"}, {"type": "p", "text": "A、甲亢服碘 10 天 B 、胆囊结石嵌顿C 、黄疸、胆总管结石并感染"}, {"type": "p", "text": "E、十二指肠溃疡"}, {"type": "p", "text": "D 、胃癌"}, {"type": "p", "text": "128 下列哪种情况只作重点必要的准备即需紧急手术："}, {"type": "p", "text": "A、被膜下脾破裂 B 、阑尾炎穿孔脓肿形成"}, {"type": "p", "text": "D"}, {"type": "p", "text": "中"}, {"type": "p", "text": "C、溃疡病空腹穿孔"}, {"type": "p", "text": "D 、绞窄性肠梗阻 E 、疝修补术"}, {"type": "p", "text": "129．下列哪种情况不需预防性应用抗生素"}, {"type": "p", "text": "A、结肠手术 B 、胃癌根治术 C 、慢性阑尾炎阑尾切除术"}, {"type": "p", "text": "D、髂内动脉瘤手术 E 、胰十二脂肠切除术"}, {"type": "p", "text": "C"}, {"type": "p", "text": "中"}, {"type": "p", "text": "130．有心脏合并症的患者手术耐受力的估计中，哪种最差："}, {"type": "p", "text": "A、冠心病 B 、急性心肌炎 C 、高血压心脏病"}, {"type": "p", "text": "D、风湿性心脏病 E 、先心病室间隔缺损"}, {"type": "p", "text": "B"}, {"type": "p", "text": "中"}, {"type": "p", "text": "131．下列哪类心脏病人的手术耐受力最好："}, {"type": "p", "text": "A"}, {"type": "p", "text": "中"}, {"type": "p", "text": "A、先心病房间隔缺损"}, {"type": "p", "text": "D、Ⅲ度房室传导阻滞"}, {"type": "p", "text": "B 、心力衰竭 C 、冠心病多发室性早博"}, {"type": "p", "text": "E 、急性心肌梗塞"}, {"type": "p", "text": "132．关于心脏病人术前准备以下哪项错误："}, {"type": "p", "text": "A、术前纠正水、电失衡 B 、纠正贫血"}, {"type": "p", "text": "C"}, {"type": "p", "text": "中"}, {"type": "p", "text": "C、房颤伴心室率快者不必特殊处理"}, {"type": "p", "text": "D、偶发室性早博者不必特殊处理"}, {"type": "p", "text": "E、冠心病心动过缓者应进行有效内科治疗"}, {"type": "p", "text": "133．呼吸功能障碍者的术前准备，下列哪项不正确"}, {"type": "p", "text": "A、术前停止吸烟 2 周"}, {"type": "p", "text": "D"}, {"type": "p", "text": "中"}, {"type": "p", "text": "B、对阻塞性肺功能不全者应给予支气管扩张剂"}, {"type": "p", "text": "C、常发哮喘者，可口服地塞米松"}, {"type": "p", "text": "D、麻醉前用药可按一般患者要求进行"}, {"type": "p", "text": "E、有肺部感染者，需积极控制感染"}, {"type": "p", "text": "134．关于呼吸功能障碍病人术前准备哪项错误："}, {"type": "p", "text": "A、可用蒸气吸入或口服药液使痰液稀薄，易于咳出"}, {"type": "p", "text": "B、麻醉前给药要适量，以免抑制呼吸"}, {"type": "p", "text": "C"}, {"type": "p", "text": "中"}, {"type": "p", "text": "C、急性呼吸道感染者，如系急症手术，可采用吸入麻醉"}, {"type": "p", "text": "D、哮喘患者可用支气管扩张剂或激素"}, {"type": "p", "text": "E、多练习深呼吸、咳嗽，增加肺活量，排出分沁物"}, {"type": "p", "text": "135．尚可耐受中型手术的轻度肺功能不全，其最大通气量是："}, {"type": "p", "text": "C"}, {"type": "p", "text": "中"}, {"type": "p", "text": "A、90%～100% B、75%～90% C 、60%～70% D、40%～60% E 、小于 40%"}, {"type": "p", "text": "136．肺功能正常时氧分压（ kPa）应为： D"}, {"type": "p", "text": "A、5、5 以上 B 、6、6 以上 C 、7、 5 以上 D 、 9、3 以上 E 、15 以上"}, {"type": "p", "text": "137．肺功能正常者血氧饱和度（"}, {"type": "p", "text": "A、100% B、大于 90% C、大于 80% D 、大于 70% E 、大于 60%"}, {"type": "p", "text": "138．肺功能正常者二氧化碳分压（ PaCO2：kPa）应为： A"}, {"type": "p", "text": "A、小于 5、 2 B 、小于 4、0 C 、小于 6、4 D 、小于 7、1 E 、小于 8、5"}, {"type": "p", "text": "139．以下哪项属轻度肺功能不全："}, {"type": "p", "text": "%）应为 B"}, {"type": "p", "text": "中"}, {"type": "p", "text": "C"}, {"type": "p", "text": "A、氧分压： 9、5kPa B 、血氧饱和度： 96% C、二氧化碳分压： 6、4kPa"}, {"type": "p", "text": "D、最大通气量 80% E 、最大通气量 85%"}, {"type": "p", "text": "140．以下哪项属重度肺功能不全："}, {"type": "p", "text": "E"}, {"type": "p", "text": "中"}, {"type": "p", "text": "A、血氧饱和度： 90% B 、氧分压： 8、9kPa C 、氧分压： 9、 4kPa"}, {"type": "p", "text": "D、二氧化碳分压： 5、5kPa"}, {"type": "p", "text": "E、最大通气量： 40%"}, {"type": "p", "text": "141．长期应用皮质激素者需紧急手术，患者应作："}, {"type": "p", "text": "A、继续用药至应激期过后 B 、停用激素 C 、根据病情决定是否给予"}, {"type": "p", "text": "D、减量给予 E 、术前给，术后不需给"}, {"type": "p", "text": "A"}, {"type": "p", "text": "中"}, {"type": "p", "text": "142．以下叙述哪项不正确："}, {"type": "p", "text": "B"}, {"type": "p", "text": "中"}, {"type": "p", "text": "A、凡有肾病者术前均应进行肾功能检查"}, {"type": "p", "text": "B、麻醉、手术不影响肾功能"}, {"type": "p", "text": "C、术前准备要点是最大限度改善肾功能"}, {"type": "p", "text": "D、肾功能损害越重，手术耐受力越差"}, {"type": "p", "text": "E、重度损害者，需有效透折后才能实施手术"}, {"type": "p", "text": "143．肾功能不全者需行胃癌根治术，术前准备下列哪项不正确："}, {"type": "p", "text": "A、肌苷、尿素氮必须在正常范围才能手术"}, {"type": "p", "text": "A"}, {"type": "p", "text": "中"}, {"type": "p", "text": "B、避免使用对肾脏有损伤的药物"}, {"type": "p", "text": "D、纠正水、电解质及酸碱失衡"}, {"type": "p", "text": "C 、尽量避免使用血管收缩药"}, {"type": "p", "text": "E 、补足血容量"}, {"type": "p", "text": "144．术前特殊准备中，下列哪项是不对的："}, {"type": "p", "text": "D"}, {"type": "p", "text": "中"}, {"type": "p", "text": "A、高血压患者血压为 158/95mmHg，可不必特殊处理"}, {"type": "p", "text": "B、偶发室性早搏者不需特殊准备"}, {"type": "p", "text": "C、凡有肝病者，应增加肝糖原储备"}, {"type": "p", "text": "D、6 个月内用皮质激素不超过"}, {"type": "p", "text": "2~3 周者，可不必特殊准备"}, {"type": "p", "text": "E、大手术前，血糖为 10mmol/L，尿糖（ +），可不必特殊准备"}, {"type": "p", "text": "145．关于糖尿病人术前准备，以下哪项错误："}, {"type": "p", "text": "A、糖尿病人手术耐受力差，术前应控制血糖"}, {"type": "p", "text": "C、纠正酸中毒 D 、有感染者使用抗生素控制感染"}, {"type": "p", "text": "B"}, {"type": "p", "text": "中"}, {"type": "p", "text": "B 、尿糖应为阴性"}, {"type": "p", "text": "E 、术中监测血糖"}, {"type": "p", "text": "146．下列哪种药物手术前应停止使用："}, {"type": "p", "text": "B"}, {"type": "p", "text": "中"}, {"type": "p", "text": "A、类风湿病应用的皮质激素"}, {"type": "p", "text": "C、糖尿病人应用的达美康"}, {"type": "p", "text": "E、结肠手术前应用的抗生素"}, {"type": "p", "text": "B 、冠心病应用的阿司匹林"}, {"type": "p", "text": "D 、高血压病人应用的尼群地平"}, {"type": "p", "text": "147．关于术后病人的卧位，以下哪项错误："}, {"type": "p", "text": "A、全麻尚未清醒者，应平卧，头偏向一侧"}, {"type": "p", "text": "B、颅脑手术采取头高脚低斜坡卧位"}, {"type": "p", "text": "C"}, {"type": "p", "text": "中"}, {"type": "p", "text": "C、硬膜外腔麻醉者术后去枕平卧"}, {"type": "p", "text": "D、腹部手术采取低半坐卧位"}, {"type": "p", "text": "E、臀部手术采取俯卧位"}, {"type": "p", "text": "12 小时防术后头痛"}, {"type": "p", "text": "148．术后尿潴留较多见于："}, {"type": "p", "text": "A"}, {"type": "p", "text": "中"}, {"type": "p", "text": "A、肛管直肠手术 B 、胆囊切除术 C 、胃大部分切除术"}, {"type": "p", "text": "D、包皮环切术 E 、斜疝修补术"}, {"type": "p", "text": "149．关于非腹部手术术后进食时间的叙述哪项不正确："}, {"type": "p", "text": "A、一般体表或肢体的手术，全身反应轻者，术后即可进食"}, {"type": "p", "text": "D"}, {"type": "p", "text": "中"}, {"type": "p", "text": "B、手术范围大，全身反应明显者，需"}, {"type": "p", "text": "C、局麻下施行小手术，术后即可进食"}, {"type": "p", "text": "2~4 日后才可进食"}, {"type": "p", "text": "D、硬膜外麻醉者，术后"}, {"type": "p", "text": "E、全麻者完全清醒，恶心呕吐消失后方可进食"}, {"type": "p", "text": "150．以下叙述哪项错误："}, {"type": "p", "text": "3 日方可进食"}, {"type": "p", "text": "C"}, {"type": "p", "text": "中"}, {"type": "p", "text": "A、肝功能轻度损害者，不影响手术耐受力"}, {"type": "p", "text": "B、肝功能损害越重，手术耐受力越差"}, {"type": "p", "text": "C、急性肝炎病人不影响手术期限"}, {"type": "p", "text": "D、肝功能明显受损者，多不宜施行手术"}, {"type": "p", "text": "E、有明显营养不良、腹水者术前应经较长时间准备才可施行择期手术"}, {"type": "p", "text": "151．腹部手术后，患者进食的一般标志是："}, {"type": "p", "text": "A、麻醉已苏醒，且麻醉反应小 B 、患者要求进食"}, {"type": "p", "text": "C、患者已下床活动 D 、肛门已排气 E 、可闻及肠鸣音"}, {"type": "p", "text": "D"}, {"type": "p", "text": "中"}, {"type": "p", "text": "152．手术后并发症的原因，下列哪项不正确："}, {"type": "p", "text": "A、术中止血不完善是造成术后出血的原因"}, {"type": "p", "text": "B、Ⅰ、Ⅱ类切口感染的主要原因是未用抗生素"}, {"type": "p", "text": "C、低蛋白血症是术后伤口裂开的主要原因之一"}, {"type": "p", "text": "D、有急、慢性呼吸道感染者易发生肺不张"}, {"type": "p", "text": "E、术后恶心呕吐的常见原因是麻醉反应"}, {"type": "p", "text": "B"}, {"type": "p", "text": "中"}, {"type": "p", "t <script>
(function () {
  if (WB.mountChrome) WB.mountChrome('materials');

  var body = document.getElementById('body');

  if (WB.fx && WB.fx.init) WB.fx.init();

  var base = (window.R2_BASE || '').replace(/\/+$/, '');
  var prefix = window.R2_PREFIX || '';
  var dl = document.getElementById('dgDl');
  if (base && /^https?:/.test(base) && dl && dl.getAttribute('data-key')) {

    dl.style.display = 'none';

  var tabs = [].slice.call(document.querySelectorAll('.doc-tabs button'));

      var p = b.getAttribute('data-pane');
      tabs.forEach(function (x) { x.classList.toggle('on', x === b); });
      document.getElementById('paneRead').classList.toggle('hide', p !== 'read');
      document.getElementById('paneQuiz').classList.toggle('hide', p !== 'quiz');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });

  var links = [].slice.call(document.querySelectorAll('.toc a[href^="#"]'));
  if (!links.length) return;
  var heads = links.map(function (a) { return document.getElementById(a.getAttribute('href').slice(1)); });
  function paint() {
    var top = window.scrollY + 120, idx = 0;
    heads.forEach(function (h, i) { if (h && h.offsetTop <= top) idx = i; });
    links.forEach(function (a, i) { a.classList.toggle('on', i === idx); });
  }
  window.addEventListener('scroll', paint, { passive: true });
  paint();
})();
