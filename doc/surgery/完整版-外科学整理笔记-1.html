<script>window.__DOC_BLOCKS = [{"type": "h", "level": 3, "id": "s1", "text": "创伤"}, {"type": "h", "level": 3, "id": "s2", "text": "按照伤后皮肤完整性分类"}, {"type": "p", "text": "闭合伤：皮肤保持完整无开放性伤口者，如挫伤，挤压伤，扭伤等。"}, {"type": "p", "text": "开放伤：有皮肤破损者，如擦伤，撕裂伤等。又根据伤道类型再分为贯通伤，盲管伤，切线伤，反跳伤。"}, {"type": "p", "text": "按伤情轻重分类："}, {"type": "p", "text": "轻伤：局部软组织损伤，但仍可坚持工作，无生命危险，或只需小手术。"}, {"type": "p", "text": "中等伤：丧失作业能力和生活能力，需手术，但一般无生命危险。"}, {"type": "p", "text": "重伤：危及生命或治愈后有严重残疾者。"}, {"type": "p", "text": "==组织修复的基本方式==是由伤后增生的细胞和细胞间质再生增殖.充填.连接或替代损伤后的缺损组织。"}, {"type": "p", "text": "完全修复：组织缺损完全由原来性质的细胞来修复，恢复原有的结构和功能，为理想的恢复。"}, {"type": "p", "text": "不完全修复，多见，组织损伤不能由原来性质的细胞修复，而是由其他性质的细胞增生代替来完成。"}, {"type": "h", "level": 3, "id": "s3", "text": "组织修复的基本过程："}, {"type": "p", "text": "局部炎症反应阶段：主要是血管和细胞反应、免疫应答，血液凝固和纤维蛋白的溶解"}, {"type": "p", "text": "细胞增殖分化和肉芽组织生成阶段：成纤维细胞、内皮细胞等增殖、分化、迁移，分别合成分泌组织基质和形成新生毛细血管，并共同构成肉芽组织。"}, {"type": "p", "text": "组织塑形阶段：胶原纤维交联增加、强度增加；多余的胶原纤维被胶原蛋白酶降解；过度丰富的毛吸血管网消退和伤口的粘蛋白及水分减少等。"}, {"type": "h", "level": 3, "id": "s4", "text": "创伤愈合的类型："}, {"type": "p", "text": "一期愈合：组织修复以原来的细胞为主，仅含少量纤维组织，局部无感染、血肿或坏死组织，再生修复过程迅速，结构和功能修复良好。"}, {"type": "p", "text": "二期愈合：以纤维组织修复为主，不同程度的影响结构和功能恢复，多见于损伤程度重、范围大、坏死组织多，且常伴有感染而未经合理的早期外科处理的伤口。"}, {"type": "p", "text": "==创伤并发症：==感染、休克、脂肪栓塞综合症、应激性溃疡、凝血功能障碍、器官功能障碍。"}, {"type": "p", "text": "==造成呼吸道阻塞的原因==：①颌面、颈部损伤后，血液、血凝块、骨碎片、软组织块、呕出物和分泌物及异物阻塞气道；颈部血管伤形成血肿压迫，或气管直接受损等也可造成气道阻塞。②重型颅脑伤致伤员深度昏迷，下颌及舌根后坠，口腔分泌物或呕吐物吸入或阻塞气道，③吸入性损伤时，喉及气道粘膜水肿，④肺部爆震伤造成的肺出血或气管损伤。"}, {"type": "p", "text": "==常用的止血方法有==：指压法，加压包扎法，填塞法，止血带法"}, {"type": "p", "text": "==急救程序==：基本原则是先救命，后治伤"}, {"type": "p", "text": "分为5个步骤：①把握呼吸、血压、心率、意识和瞳孔等生命体征，视察伤部，迅速评估伤情；②对生命体征的重要改变迅速做出反应③重点询问受伤史，分析受伤情况，仔细体格检查；④实施各种诊断性穿刺或安排必要的辅助检查；⑤进行确定性治疗。"}, {"type": "h", "level": 3, "id": "s5", "text": "胃十二指肠疾病"}, {"type": "p", "text": "==胃十二指肠溃疡(gastroduodenal ulcer)==:胃、十二指肠局限性圆形或椭圆形的全层粘膜缺损。因溃疡的形成与胃酸—蛋白酶的消化作用有关，也称消化性溃疡(peptic ulcer)"}, {"type": "p", "text": "==幽门梗阻(pyloric obstruction)==胃十二指肠溃疡病人因幽门管、幽门溃疡或十二指肠球部溃疡反复发作形成瘢痕狭窄，合并幽门痉挛水肿可以造成幽门梗阻。"}, {"type": "p", "text": "==好发部位：==胃溃疡多发生在胃小弯，以胃角多见，胃窦部与胃体也可见，大弯胃底少见。十二指肠溃疡多发生于球部，发生在球部以下的溃疡称为球后溃疡。球部前后璧或是胃大弯、小弯侧同时见到的溃疡称为对吻溃疡。"}, {"type": "p", "text": "==溃疡的发病机制==：①幽门螺杆菌感染；②胃酸分泌过多；③非甾体类抗炎药与粘膜屏障损害；④其他致病因素包括遗传、吸烟、心理压力和咖啡因等。"}, {"type": "p", "text": "==胃溃疡的手术适应症==："}, {"type": "p", "text": "包括抗Hp措施在内的严格内科治疗无效的顽固性溃疡，如溃疡不愈合或短期内复发者；"}, {"type": "p", "text": "发生溃疡出血、瘢痕性幽门梗阻、溃疡穿孔及溃疡穿透致胃壁外者；"}, {"type": "p", "text": "溃疡巨大(直径>2.5cm)或高位溃疡；"}, {"type": "p", "text": "胃十二指肠复合性溃疡；"}, {"type": "p", "text": "溃疡不能除外恶变或已恶变者。"}, {"type": "h", "level": 3, "id": "s6", "text": "急性胃十二指肠溃疡穿孔的诊断及鉴别诊断："}, {"type": "p", "text": "诊断：既往有溃疡病史，突发上腹部剧烈疼痛并迅速扩展为全腹疼痛伴腹膜刺激征等上消化道穿孔的特征性临床表现，结合X线检查腹部发现膈下游离气体，诊断性腹腔穿刺抽出液含胆汁或事物残渣，可确诊。"}, {"type": "p", "text": "鉴别诊断："}, {"type": "p", "text": "急性胆囊炎：表现为右上腹绞痛或持续性疼痛拌阵发加剧，疼痛向右肩放射，伴畏寒发热。右上腹局部压痛、反跳痛，可触及重大的胆囊，Murphy征阳性。胆囊坏疽穿孔时有弥漫性腹膜炎表现，但X线膈下检查无游离性气体。B超提示胆囊炎或胆囊结石。"}, {"type": "p", "text": "急性胰腺炎：急性胰腺炎的腹痛发作一般不如溃疡穿孔者急骤，腹痛多位于上腹部偏左并向背部放射。腹痛有一个由轻转重的过程，肌紧张程度相对较轻。血清、尿液和腹腔穿刺液淀粉酶明显升高。X线检查膈下无游离气体，CT\\、B超提示胰腺肿胀。"}, {"type": "p", "text": "急性阑尾炎：溃疡穿孔后消化液沿右结肠旁沟流到右下腹，引起右下腹痛和腹膜炎体征，可与急性阑尾炎相混。但阑尾炎一般症状较轻，体征局限于右下腹，无腹壁板样强直，X闲检查无膈下游离气体。"}, {"type": "p", "text": "==溃疡引起幽门梗阻的机制==有痉挛、严重水肿和瘢痕三种，前两种情况是可逆的、暂时性的，在炎症消退、痉挛缓解后幽门恢复通畅，瘢痕造成的梗阻是永久的则需要手术方能解除。"}, {"type": "h", "level": 3, "id": "s7", "text": "胃十二指肠溃疡瘢痕性幽门梗阻的临床表现："}, {"type": "p", "text": "腹痛与反复发作的呕吐；"}, {"type": "p", "text": "有少尿、便秘、贫血等慢性消耗表现"}, {"type": "p", "text": "有营养不良、消瘦、皮肤干燥，弹性消失"}, {"type": "p", "text": "上腹隆起可见胃型，有时有自左向右的胃蠕动波，晃动上腹部可闻及振水音。"}, {"type": "h", "level": 3, "id": "s8", "text": "胃大部切除术术式极其优缺点："}, {"type": "p", "text": "Billroth I式吻合：残胃与十二指肠直接吻合，多用于胃溃疡病人。"}, {"type": "p", "text": "优点：简单、符合生理；减少胆汁、胰液返流，减少残胃炎、残胃癌；刺激胆囊收缩素分泌，减少胆石症。溃疡穿透胰腺等脏器，并与之粘连者，不适用于该术式。"}, {"type": "p", "text": "Billroth II 式吻合：残胃与近端空肠吻合，十二指肠残端关闭。"}, {"type": "p", "text": "优点：吻合口张力低，吻合口溃疡少；对难以切除的十二指肠溃疡可行Bancroft溃疡旷置术。"}, {"type": "p", "text": "缺点：胆汁、胰液返流多。"}, {"type": "p", "text": "Roux-en-Y胃空肠吻合 在距Treitz韧带10~处切断空肠，将远端空肠与残胃吻合，距此吻合口下行近、远端空肠端侧或侧-侧吻合。"}, {"type": "p", "text": "==术后并发症==："}, {"type": "p", "text": "早期:（1）术后胃出血：术后24小时内，注意手术技巧；术后4~6天，吻合口黏膜坏死脱落；术后10~20天，缝合处感染或黏膜下脓肿。"}, {"type": "list", "items": ["胃排空障碍", "胃壁缺血坏死、吻合口破裂或瘘：胃穿孔是发生在高选择性胃迷走神经切断术后的严重并发症。原因与缝合技术不当、吻合口张力过大、组织血供不足有关，在贫血、水肿、低蛋白血症的病人中易出现。", "十二指肠残端破裂：发生在毕II式胃切除术后早期的严重并发症，原因与十二指肠残端处理不当以及胃空肠吻合口输入攀梗阻引起十二指肠腔内压力升高有关。", "术后梗阻：", "输入襻梗阻：急性输入襻梗阻多发生于毕II式结肠前输入段对胃小弯的吻合术。输出襻系膜悬吊过紧压迫输入襻，或是输入襻过长穿入输出襻横结肠系膜的间隙孔形成内疝，是造成输入襻梗阻的主要原因。慢性不完全性输入襻梗阻产生的原因是输入襻过长扭曲，或输入襻受牵拉在吻合口处呈锐角影响到肠道的排空。", "输出襻梗阻：常见于毕II式胃大部切除术后。", "吻合口梗阻：吻合口太小或是吻合时胃肠璧组织内翻过多而引起，也可因术后吻合口炎症水肿出现暂时性梗阻。"]}, {"type": "p", "text": "远期：(1) 碱性反流性性胃炎：多在胃切除术或迷走神经切断加胃引流术后数月至数年发生，由于毕II式术后碱性胆汁、胰液、肠液流入胃中，破坏胃黏膜屏障，导致胃黏膜充血、水肿、糜烂等改变。"}, {"type": "list", "items": ["倾倒综合症(dumping syndrome)系由于胃大部切除术后，原有的控制胃排空的幽门窦、幽门括约肌及十二指肠球部解剖结构不复存在，加上部分病人胃肠吻合口过大，导致胃排空过速所产生的一系列综合症。", "溃疡复发：由于胃切除量不够，胃窦部黏膜残留；迷走神经切断不完全；或是输入空肠过长等因素引起。", "营养型并发症：由于胃大部切除术后，胃容量减少，容易出现饱胀感，使得摄入量不足，引起体重减轻、营养不良。", "迷走神经切除术后腹泻：以迷走神经干切断术后最常见，高选择性迷走神经切断术后少见。", "残胃癌：可能与残胃癌常有萎缩性胃炎有关。"]}, {"type": "p", "text": "==11. ====胃癌癌前病变有==：胃息肉，慢性萎缩性胃炎，胃部分切除术后的残胃"}, {"type": "p", "text": "胃息肉可分为炎性息肉，增生性息肉和腺瘤。"}, {"type": "p", "text": "==12.====早期胃癌：==胃癌仅限于粘膜及粘膜下层者，不论病灶大小或有无淋巴结转移，均为早期胃癌。"}, {"type": "p", "text": "==13.====早期胃癌根据病灶形态可分三型：=="}, {"type": "p", "text": "I型 隆起型，病灶凸向胃腔。"}, {"type": "p", "text": "II型 浅表型，病灶比较平坦没有明显的隆起与凹陷。IIa浅表隆起型，IIb浅表平坦型，IIc浅表凹陷型。"}, {"type": "p", "text": "III型 凹陷型，为较深的溃疡。"}, {"type": "p", "text": "==14====. ====胃癌的组织学分型==：乳头状腺癌、管状腺癌、低分化腺癌、粘液腺癌、印戒细胞癌、"}, {"type": "p", "text": "特殊型癌主要有：腺鳞癌、鳞状细胞癌、类癌、未分化癌。"}, {"type": "p", "text": "==15.====胃癌的扩散与转移==：直接浸润、血型转移、腹膜种植转移、淋巴转移，淋巴转移为最主要的转移途径。"}, {"type": "h", "level": 3, "id": "s9", "text": "小肠疾病"}, {"type": "p", "text": "==肠结核====(tuberculosis of infection==)是结核杆菌侵犯肠道引起的慢性特异性感染。多继发于肺结核，好发部位为回盲部和回肠末端。"}, {"type": "p", "text": "==肠梗阻====(intestinal obstruction)==肠内容物不能正常运行，顺利通过肠道。"}, {"type": "p", "text": "==肠扭转====(volvulus)==是一段肠絆沿其系膜长轴旋转而造成的闭袢型肠梗阻，同时肠系膜血管受压，也是绞窄型肠梗阻。"}, {"type": "p", "text": "==肠套叠====(intussusception==)一段肠管套入其相连的肠管腔内称肠套叠，其发生常与肠管解剖特点，病理因素以及肠功能失调、异常蠕动等有关。"}, {"type": "p", "text": "==断肠综合征====(short bowel syndrome==)是因小肠被广泛切除后，小肠吸收面积不足导致的消化、吸收功能不良的临床综合病征。最常见的病因是肠扭转、肠系膜血管栓塞或血栓形成和Crohn病行肠切除术所致。其主要临床表现是早期的腹泻和后期的严重营养障碍。"}, {"type": "h", "level": 3, "id": "s10", "text": "肠梗阻分类："}, {"type": "p", "text": "按原因分:"}, {"type": "p", "text": "机械性肠梗阻(mechanical intestinal obstruction)最常见。病因：肠腔阻塞、肠管受压、肠壁病变。"}, {"type": "p", "text": "动力性肠梗阻 由于神经反射或毒素刺激引起肠壁肌功能紊乱，是肠蠕动丧失或肠管痉挛，以致肠内容物不能正常运行，但无器质性的肠腔绞窄。多见各种原因引起的麻痹性肠梗阻(paralytic ileus)。"}, {"type": "p", "text": "血运性肠梗阻 由于肠系膜血管栓塞或血栓形成，使肠管血运障碍，继而发生肠麻痹而使肠内容物不能正常运行。"}, {"type": "p", "text": "按肠壁有无血运障碍分："}, {"type": "p", "text": "单纯性肠梗阻：只是肠内容物通过受阻，而无肠管血运障碍。"}, {"type": "p", "text": "绞窄性肠梗阻(strangulated intestinal obstruction)系指梗阻并伴有肠壁血运障碍者，可因肠系膜血管受压、血栓形成或栓塞引起。"}, {"type": "p", "text": "==肠梗阻的全身性病理生理改变==：主要由于体液丧失、肠膨胀、毒素的吸收和感染所致。"}, {"type": "p", "text": "体液丧失，电解质紊乱；②感染和中毒；③休克；④呼吸和循环功能障碍。"}, {"type": "p", "text": "==肠梗阻的临床表现：（吐、痛、胀、闭==）"}, {"type": "p", "text": "腹痛：机械性肠梗阻为阵发性绞痛，肠鸣音高亢；麻痹性肠梗阻为持续胀痛，肠鸣音消失。"}, {"type": "p", "text": "呕吐：高位早，低位晚；呕吐物呈棕色或血性，为血运障碍表现。"}, {"type": "p", "text": "腹胀：高位不明显，结肠梗阻为腹周膨胀，闭襻型梗阻腹部隆起不对称。"}, {"type": "p", "text": "排气、排便停止：某些绞窄性肠梗阻可排出血性粘液样便。"}, {"type": "h", "level": 3, "id": "s11", "text": "有下列表现者，应考虑绞窄性肠梗阻的可能："}, {"type": "p", "text": "腹痛发作急骤，起始即为持续性剧烈疼痛，或在阵发性加重之间仍有持续性疼痛，肠鸣音可不亢进。有时出现腰背部痛，呕吐出现早、剧烈而频繁。"}, {"type": "p", "text": "病情发展迅速，早期出现休克，抗休克治疗后改善不显著。"}, {"type": "p", "text": "有明显腹膜刺激征，体温上升、脉搏加快、白细胞计数增高。"}, {"type": "p", "text": "腹胀不对称，腹部有局部隆起或触及有压痛的肿块。"}, {"type": "p", "text": "呕吐物、胃肠减压抽出液、肛门排出物为血性，或腹腔穿刺抽出血性液体。"}, {"type": "p", "text": "经积极非手术治疗而症状体征无明显改善。"}, {"type": "p", "text": "腹部X线检查见孤立、凸出胀大的肠袢、不因时间而改变位置，或有假肿瘤状阴影；或肠间隙增宽，提示有腹腔积液。"}, {"type": "p", "text": "肠套叠最常见的是回肠末端套入结肠。肠套叠的三大典型症状是==腹痛、血便和腹部肿块==，表现为突然发作阵发性腹痛。空气或钡餐灌肠X线检查，可见空气或钡剂在结肠受阻，阻端钡影呈“杯口”状，甚至呈“弹簧”状阴影。"}, {"type": "p", "text": "高位小肠梗阻与低位小肠梗阻的临床表现有何不同："}, {"type": "p", "text": "高位小肠梗阻的特点是呕吐发生早而频繁，腹胀不明显。低位小肠梗阻的特点是腹胀明显，呕吐出现晚而次数少，并可吐粪样物。"}, {"type": "h", "level": 3, "id": "s12", "text": "结直肠与肛管疾病"}, {"type": "p", "text": "==乙状结肠扭转====(sigmoid volvulus)==是乙状结肠以肠系膜为中轴发生扭转，导致肠管部分或完梗阻。乙状结肠扭转是结肠扭转最常见的部位，其次为盲肠和横结肠。小肠扭转多见于青年人，结肠扭转常见于老年人。"}, {"type": "p", "text": "==肠息肉====(polyps)==及==肠息肉病====(polypsis)==是一类从粘膜表面突出到肠腔内的隆起状病变的临床诊断。从病理上可分为：①腺瘤性息肉：包括管状绒毛状以及管状绒毛状腺瘤；②炎性息肉：粘膜炎性增生或血吸虫卵性以及良性淋巴样息肉；③错构瘤性：年幼息肉及色素沉着息肉综合征(Peutz-Jeghers综合症)；④其他：化生性息肉及粘膜肥大赘生物。"}, {"type": "p", "text": "==家族性肠息肉病(familial intestinal polyposis)==又称家族性腺瘤性息肉病(familial adenomatous polyposis,FAP)与遗传因素有关，其特点是婴幼儿期并无息肉，常开始出现于青少年时期，癌变的倾向性很大。直肠及结肠常布满腺瘤，极少累及小肠。乙状结肠镜检查可见肠黏膜遍布大带蒂的小息肉。"}, {"type": "p", "text": "==直肠癌(rectal cancer)==是乙状结肠直肠交界处至齿状线之间的癌，是消化道常见的恶性肿瘤。有三个流行病学特点：①直肠癌比结肠癌发病率高；②低位直肠癌所占的比例高；③青年人所占的比例高。"}, {"type": "p", "text": "==肛裂(anal fissu====e)==是齿状线下肛管皮肤层裂伤后形成的小溃疡。因肛裂、前哨痔、乳头肥大常同时存在，成为肛裂“三联征”。"}, {"type": "p", "text": "==直肠肛管周围脓肿(perianorectal abscess)==是指直肠肛管周围软组织或其周围间隙发生的急性化脓性感染，并形成脓肿。脓肿破溃或切开引流后常形成肛瘘。"}, {"type": "p", "text": "==肛瘘(anal fistula)==是指肛管周围的肉芽肿性管道，由内口、瘘管、外口三部分组成，内口常位于直肠下部或肛管，多为一个；外口在肛周皮肤上，可为一个或多个，经久不愈或反复发作，是最常见的直肠肛管疾病之一，任何年龄都可发病，多见于青壮年男性。"}, {"type": "p", "text": "==内痔(internal hemorrhoids)==是缸垫的支持结构、静脉丛及动静脉吻合支发生病理性改变或移位。"}, {"type": "p", "text": "==外痔(external hemorrhoids)==是齿状线远侧皮下静脉丛的病理性扩张或血栓形成。"}, {"type": "p", "text": "==混合痔(mixed hemorrhoids)==内痔通过丰富的静脉丛吻合支和相应部位的外痔相互融合。"}, {"type": "p", "text": "==直肠脱垂(rectal prolapse)==直肠壁部分或全层向下移位，即直肠脱垂。直肠壁部分下移，即直肠粘膜下移，称粘膜脱垂或不完全脱垂；直肠壁全层下移称完全脱垂。若下移的直肠壁在肛管直肠腔内称内脱垂；下移到肛门外称外脱垂。"}, {"type": "p", "text": "==齿状线的重要性==：①齿状线以上是粘膜，是自主神经支配，无疼痛感；齿状线以下为皮肤，受阴部内神经支配，疼痛敏锐。故内痔的注射及手术治疗均需在齿状线以上进行 ，无麻醉情况下累及齿状线以下部位时将引起剧烈疼痛。②齿状线以上由直肠上下动脉供应，齿状线以下由属肛管动脉供应。③齿状线以上的直肠上静脉丛通过直肠上静脉回流至门静脉；齿状线以下的直肠静脉丛通过肛管静脉回流至腔静脉；齿状线以上的淋巴引流主要入腹主动脉旁或髂内淋巴结；齿状线以下的淋巴引流主要如腹股沟淋巴结及髂外淋巴结。"}, {"type": "p", "text": "==溃疡性结肠炎(ulcerative colitis)==是发生在结直肠粘膜层的一种弥漫性的炎症性病变。可发生在结、直肠的任何部位，其中以直肠和乙状结肠最为常见。"}, {"type": "p", "text": "==大肠息肉约半数无临床症状==，发生并发症时才被发现，其表现为：①肠道刺激症状，腹泻或排便次数增多，继发感染者可出现粘液脓血便。②便血可因部位及出血量而表现不一，高位者粪便中混有血，直肠下段者粪便外混有血，出血量多者为鲜血或血块。③肠梗阻及肠套叠，以盲肠息肉多见。"}, {"type": "p", "text": "==结肠癌的Dukes分期==：A期：癌仅限于肠壁内；B期穿透肠壁侵入浆膜及/或浆膜外，但无淋巴结转移；C期：有淋巴结转移者，其中淋巴结转移仅限于癌肿附近如肠壁附近如结肠壁及结肠旁淋巴结者为C1期，转移至系膜和系膜根部淋巴结者为C2期；D期：已有远处转移或腹腔转移，或广泛侵及临近脏器无法切除者。"}, {"type": "h", "level": 3, "id": "s13", "text": "结肠癌的临床表现："}, {"type": "p", "text": "排便习惯和性状的改变：常为最早出现的症状。多变现为排便次数增加、腹泻、便秘、粪便中带血、脓或粘液。"}, {"type": "p", "text": "腹痛：也是早期症状之一，常为定位不确切的持续性隐痛，或仅为腹部不适或腹胀感，出现肠梗阻时则腹痛加重或为阵发性绞痛。"}, {"type": "p", "text": "腹部肿块：多为瘤体本身，有时也可能是梗阻近侧肠腔内的积粪。肿块大多坚硬呈结节状。如为横结肠和乙状结肠可有一定活动度。如癌肿穿透并发感染时，肿块固定且可有明显压痛。"}, {"type": "p", "text": "肠梗阻症状：一般属结肠癌的中晚期症状，多表现为慢性地位不完全肠梗阻，主要表现是腹胀和便秘。腹部胀痛或阵发性绞痛。当发生完全性梗阻时，症状加剧。左侧结肠癌有时可以急性完全性结肠梗阻为首先出现的症状。"}, {"type": "p", "text": "全身症状：由于慢性失血、癌肿糜烂、感染、毒素吸收等，病人可出现贫血、消瘦、乏力、低热等。病情晚期可出现肝肿大、黄疸、浮肿、腹水、直肠前凹肿块、锁骨上淋巴结重大及恶病质等。"}, {"type": "p", "text": "17 ==直肠癌的临床表现==：早期无明显症状，癌肿破溃形成溃疡或感染时才出现症状。"}, {"type": "list", "items": ["直肠刺激症状：便意频繁，排便习惯改变；便前肛门有下坠感、里急后重、排便不尽感，晚期有下腹痛。", "肠腔狭窄症状：癌肿侵犯致肠管狭窄，初时大便变形，变细，当造成肠管部分梗阻后，有腹痛、腹胀、肠鸣音亢进等不全性肠梗阻表现。", "癌肿破溃感染症状：大便表面带血及粘液，甚至有脓血便。"]}, {"type": "p", "text": "癌肿侵犯前列腺、膀胱，可出现尿频、尿痛、血尿。侵犯骶前神经可出现骶尾部持续性疼痛。晚期出现肝转移时可有腹水、肝大、黄疸、贫血、消瘦、浮肿、恶病质等。"}, {"type": "p", "text": "18 ==直肠指诊：==是诊断直肠癌最重要的方法。凡遇到病人有便血、大便习惯改变、大便变形等症状，均应直肠指诊。指诊可查出癌肿的部位，距肛缘的距离，癌肿的大小、范围、固定程度、与周围组织的关系等。"}, {"type": "p", "text": "19 ==腹会阴联合直肠癌根治手术====(Miles====手术====)====：==原则上适用于腹膜折返部位以下的直肠癌。切除范围包括乙状结肠远端、全部直肠、肠系膜下动脉及其区域淋巴结、全直肠系膜、肛提肌、坐骨直肠窝内脂肪、肛管及肛门周围3~的皮肤、皮下组织及全部肛门括约肌，于左下腹行永久性乙状结肠单腔造口。"}, {"type": "p", "text": "20 ==肛裂的典型临床表现==："}, {"type": "p", "text": "即疼痛、便秘和出血。疼痛多剧烈，有典型的周期性：排便时由于肛裂内神经末梢受到刺激，立刻感觉到肛管灼烧样或刀割样疼痛，称为排便时疼痛；便后数分钟可缓解，称为间歇期；随后因肛门括约肌收缩痉挛，再次剧痛，此期可持续半到数小时，临床称为括约肌挛缩痛。直至括约肌疲劳、松弛后疼痛缓解，但再次排便时又出现疼痛。即肛裂疼痛周期。"}, {"type": "p", "text": "21 ==痔形成的学说：=="}, {"type": "list", "items": ["缸垫下移学说：在肛管的粘膜下有一层环状的由静脉、平滑肌、弹性组织和结缔组织组成的肛管血管垫，简称缸垫。起闭合肛管、节制排便作用。", "静脉曲张学说：长期坐立、便秘、妊娠、前列腺肥大等导致血液回流障碍，直至静脉淤血扩张。"]}, {"type": "p", "text": "其他还有长期饮酒和进食大量刺激性食物可使局部充血；肛周感染可引起静脉周围炎，使静脉失去弹性而扩张；营养不良可使局部组织萎缩无力。"}, {"type": "p", "text": "22 ==内痔的临床表现及分度==："}, {"type": "p", "text": "内痔的主要临床表现是出血和脱出。无痛性间歇性便后出鲜血是内痔的常见症状。未发生血栓、嵌頓、感染时内痔无疼痛，部分病人可伴发排便困难。内痔的好发部位为截石位的3、7、11点。"}, {"type": "p", "text": "分度：I度：便时带血、滴血或喷射状出血，便后出血可自行停止，无痔脱出；II度：常有便血，排便时有痔脱出，便后可自行还纳；III;偶有便血，排便或久站、咳嗽、劳累、负重时痔脱出，需用手还纳；IV：偶有便血，痔脱出不能还纳或还纳后又脱出。"}, {"type": "p", "text": "==23 ====痔的鉴别诊断====;=="}, {"type": "list", "items": ["直肠癌：临床上常有将直肠癌误诊为痔而延误治疗的病例，主要原因是仅凭借症状及大便化验而诊断，未进行肛门指诊和直肠镜检查。直肠癌在直肠指检时可扪及到高低不平的硬块；而痔为暗红色圆形而柔软的血块团。", "直肠息肉：低位带蒂息肉脱出肛门外易误诊为痔脱出。但息肉为圆形、实质性、有蒂、可活动，多见于儿童。", "直肠脱垂：易误诊为环状痔，但直肠脱垂粘膜呈环形，表面平滑，括约肌松弛；而后者黏膜呈梅花瓣状，括约肌不松弛。"]}, {"type": "p", "text": "==24 ====典型的右侧结肠癌和左侧结肠癌临床表现的区别：=="}, {"type": "p", "text": "一般右侧结肠癌以全身症状、贫血、腹部肿块为主要表现，左侧结肠癌以肠梗阻、便秘、腹泻、便血等症状为显著。"}, {"type": "h", "level": 3, "id": "s14", "text": "肝疾病"}, {"type": "p", "text": "==1. ====第一肝门：==门静脉、肝动脉和肝总管在肝脏面横沟各自分出左右干进入肝实质内，即第一肝门。"}, {"type": "p", "text": "==2. ====第二肝门：==肝静脉是肝血液的流出管道，三条主要的肝静脉在肝后上方的静脉窝进入下腔静脉，即第二肝门。"}, {"type": "p", "text": "==3. ====第三肝门==：肝还有小部分血液经数支肝短静脉流入肝后方的下腔静脉，即第三肝门。"}, {"type": "p", "text": "==4==. ==细菌性肝脓肿细菌可经以下途径进入肝内==：胆道，肝动脉，门静脉，淋巴系统。"}, {"type": "p", "text": "==5. 原发性肝癌的临床表现：=="}, {"type": "list", "items": ["肝区疼痛：有半数以上病人以此为首发症状，多为持续性钝痛、刺痛或胀痛。主要是 由于肿瘤快速生长，使肝包膜张力增加所致。位于肝右叶顶部的癌肿累及横隔，则疼痛可牵涉至右肩背部。当肝癌结节发生坏死、破裂，引起腹腔内出血时，则表现为突然引起右上腹剧痛和压痛，出现腹膜刺激征等急腹症表现。", "全身和消化道症状：早期不常引起注意，主要表现为乏力、消瘦、食欲减退、腹胀等。部分病人可伴有恶心、呕吐、发热、腹泻等症状。晚期则出现贫血、黄疸、腹水、下肢浮肿、皮下出血及恶病质等。", "肝肿大：为中晚期肝癌常见的主要体征。肝肿大呈进行性，质地坚硬，边缘不规则，表面凹凸不平呈大小结节或巨块。癌肿位于肝右叶顶部者可使膈肌抬高，肝浊音界抬高。在不少情况下，肝肿大或肝区肿块是病人自己偶然扪及而成为肝癌的首发症状的。肝肿大显著者可充满整个右上腹或上腹，右季肋部明显隆起。"]}, {"type": "p", "text": "此外，如发生肺、骨、脑等处转移，可产生相应症状。少数病人还可有低血糖症、红细胞增多症、高血钙和高胆固醇血症等特殊表现。"}, {"type": "p", "text": "==6. 下列情况下可做根治性肝切除：=="}, {"type": "list", "items": ["单发的微小肝癌；②单发的小肝癌；③单发的向肝外生长的大肝癌或巨大肝癌，表面较光滑，周围界限较清楚，受肿瘤破坏的肝组织少于30%；④多发性肿瘤，但肿瘤结节少于3个，且局限在肝的一段或一叶内。"]}, {"type": "p", "text": "==7. 下列情况仅可做姑息性肝切除：=="}, {"type": "list", "items": ["3~5个多发性肿瘤，局限于相邻2~3肝段或半肝内，影像学显示无瘤肝组织明显代偿性增大，达全肝的50%以上；如肿瘤分散，可分别做局限性切除。", "左半肝或右半肝的大肝癌或巨大肝癌，边界较清楚，第一、二肝门未受侵犯，影像学显示无瘤侧肝代偿性增大明显，达全肝组织的50%以上。", "位于肝中央区的大肝癌，无瘤肝组织明显代偿性增大，达全肝的50%以上。", "I 或VIII段的大肝癌或巨大肝癌。", "肝门部有巨大肝癌转移者，如原发性肝癌可切除，应做肿瘤切除，同时进行肝门部淋巴结清扫；淋巴结难以清扫者，术后可进行放射治疗。", "周围脏器受侵犯，如原发肿瘤可切除，应连同受侵犯脏器一并切除；远处脏器单发转移性肿瘤，可同时作原发肝癌切除和转移瘤切除术。"]}, {"type": "h", "level": 3, "id": "s15", "text": "胆道疾病"}, {"type": "p", "text": "==1. 胆囊三角==：胆囊管、肝总管、肝下缘所构成的三角区成为胆囊三角，可作为手术寻找胆囊动脉和胆管的重要标志。"}, {"type": "p", "text": "==2. 先天性胆总管囊肿(congenital choledochal cyst)==：先天性胆管扩张症可发生于肝内、肝外胆管的任何部分，因好发于胆总管，曾称之为先天性胆总管囊肿。胆管壁先天性发育不良及胆管末端狭窄或闭锁是发生本病的基本因素。"}, {"type": "p", "text": "==3. 胆石病(cholelithiasis)==包括发生在胆囊和胆管的结石。胆石常分为三类：胆固醇结石、胆色素结石、混合性结石。"}, {"type": "p", "text": "==4. 胆囊结石(cholecystolithiasis):==主要为胆固醇结石或以胆固醇为主的混合性结石和黑色胆色素结石。"}, {"type": "p", "text": "==5. 急性胆囊炎(acute cholecystitis):==是胆囊管梗阻和细菌感染引起的炎症。"}, {"type": "p", "text": "==6. 急性化脓性胆管炎(acute obstructive suppurative cholangitis，AOSC)==是急性胆管炎的严重阶段，也称急性重症胆管炎(acute cholangitis of severe type，ACST).本病的发病基础是胆道梗阻及细菌感染。"}, {"type": "p", "text": "==7. Charcot三联征==：腹痛、寒战高热、黄疸。肝外胆管结石继发胆管炎是可发生。"}, {"type": "p", "text": "==8．Reynolds五联征==：腹痛、寒战高热、黄疸、休克、神经中枢系统受抑制表现。"}, {"type": "p", "text": "==9. 原发性硬化性胆管炎(primary sclerosing cholangitis,PSC):==是以肝内和肝外胆管进行性纤维化狭窄为特点的疾病。主要表现为肝内胆汁瘀滞。"}, {"type": "p", "text": "==10．先天性胆管扩张症的分型：==I型：囊性扩张；II:窒息样扩张：III胆总管开口部囊性脱垂；IV：肝内外胆管扩张；V型：肝内胆管扩张。"}, {"type": "p", "text": "==11. 先天性胆管扩张症的手术方案：==A：主要治疗手段是完全切除囊肿和胆肠Roux-en-Y吻合，疗效好。B：对于并发严重感染或穿孔等病情危重者，可先行囊肿造瘘外引流术，待病征控制，一般情况改善，黄疸消退后再行二期胆囊切除和胆肠内引流术。C：对于合并局限性肝内胆管扩张者，可同时行病变段肝切除术。D：如肝内胆管扩张病变累及全肝或以并发肝硬化，可考虑施行肝移植手术。"}, {"type": "p", "text": "==12. 胆囊结石的临床表现：=="}, {"type": "list", "items": ["胆绞痛：典型的发作是在饱餐，进食油腻食物后或睡眠中体位改变时，由于胆囊收缩或结石移位加上迷走神经兴奋，结石嵌頓在胆囊壶腹部或颈部，胆囊排空受阻，胆囊内压力增高，胆囊强力收缩而发生绞痛。疼痛位于右上腹或上腹部，呈阵发性，活着持续疼痛阵发性加剧，可向右肩胛部放射，可伴有恶心、呕吐。", "上腹隐痛：多数病人仅在进食过多、吃肥腻食物、工作紧张或休息不好时感到上腹部或右上腹隐痛，或者有饱胀不适、嗳气、呃逆等，常被误诊为“胃病”。", "胆囊积液：胆囊结石长期嵌頓或阻塞胆囊管但未合并感染时，胆囊粘膜吸收胆汁中的胆色素，并分泌粘液性物质，导致当囊积液。", "其他：①极少引起黄疸，即使黄疸也较轻；②小结石可通过胆囊管进入并停留于胆总管内形成胆总管结石；③进入胆总管的结石通过Oddi括约肌可引起损伤或嵌頓于壶腹部导致胰腺炎，称为胆囊性胰腺炎；④因结石压迫引起当囊炎症慢性穿孔、可造成胆囊十二指肠瘘或胆囊结肠瘘，大的结石通过瘘管进入肠道偶尔可引起肠梗阻称为胆石性肠梗阻；⑤结石及炎症的长期刺激可诱发胆囊癌。", "Mirizzi:是特殊类型的胆囊结石形成的解剖因素是胆囊管与肝总管伴行过长或者胆囊管与肝总管汇合位置过低，持续嵌頓于胆囊颈部的较大的胆囊管结石压迫肝总管，引起肝总管狭窄；反复的炎症发作更导致胆囊肝总管瘘管，胆囊管消失、结石部分或全部阻塞肝总管。临床特点是反复发作胆囊炎及胆管炎，明显的梗阻性黄疸。"]}, {"type": "p", "text": "==13. 胆囊结石以下情况应考虑手术治疗：==①结石直径>=;②合并需要开腹的手术；③伴有胆囊息肉>；④胆囊壁增厚；⑤胆囊壁钙化或瓷性胆囊；⑥儿童胆囊结石；⑦合并糖尿病；⑧有心肺功能障碍；⑨边远或交通不发达地区、野外工作人员；⑩发现胆囊结石10年以上。"}, {"type": "p", "text": "==14. 胆道疾病常见并发症：==胆囊穿孔、胆道出血、胆管炎性狭窄、胆源性肝脓肿、胆源性胰腺炎。"}, {"type": "p", "text": "==15. 术中胆道损伤的征象：=="}, {"type": "list", "items": ["术中发现胆汁漏出；②检查切除的胆囊标本，发现胆囊管处有2个开口；③术中胆道造影显示胆管影像中断、狭窄或造影剂外溢；④术中发生胆汁性腹膜炎，或腹腔引流管引出胆汁，或术后早期出现梗阻性黄疸；⑤术后数周或数月出现反复发作的胆道感染症状。"]}, {"type": "h", "level": 3, "id": "s16", "text": " 胰腺疾病"}, {"type": "p", "text": "==1.胰腺炎(acute pancreatitis==)：各种原因造成的胰管、腺泡压力增高，胆汁逆流，引起胰酶在胰腺内异常激活导致的胰腺非细菌性炎症改变。包括水肿、渗出、出血和坏死；并引起全身一系列炎性反应。"}, {"type": "p", "text": "==2==.全身炎症反应综合征:systemic inflammary response syndrome ;SIRS"}, {"type": "p", "text": "多器官功能障碍综合征:multiple organ dysfunction syndrone ;MODS"}, {"type": "p", "text": "==3.====胰腺假性囊肿(pancreatic pseudocyst)：==是胰腺炎的并发症，也可由外伤引起。其形成是由于胰管破裂，胰液流出积聚在网膜囊内，刺激周围组织及器官的浆膜形成纤维包膜，囊内壁无上皮细胞，故称为假性囊肿。 真性囊肿多由先天形成。"}, {"type": "p", "text": "==4.壶腹周围癌(periampullary adenocarcinoma)==主要包括壶腹癌、胆总管下端癌、十二指肠腺癌和胰头癌。"}, {"type": "p", "text": "==5.胃泌素瘤(gastrinoma),==又称佐林格-艾利森综合征(zollinger-ellison syndrome),主要表现为消化性溃疡的症状和腹泻。溃疡最常见于十二指肠球部。"}, {"type": "p", "text": "==6.====急性胰腺炎的临床表现：=="}, {"type": "list", "items": ["腹痛：是本病的主要症状。刀割样疼痛，钻痛、绞痛。常于饱餐或饮酒后发作，腹痛剧烈，多位于左上腹，向左肩及左腰背部放射。胆源性者腹痛始发于右上腹，逐渐向左侧转移。病变累及全胰时，疼痛范围较宽并呈束状带向腰背部放射。", "腹胀：与腹痛同时存在。是腹腔神经丛受刺激产生肠麻痹的结果，早期为反射性，继发感染后则由腹膜后的炎症刺激所致。腹膜后炎症越严重，腹胀越明显。腹腔积液时可加重腹胀。病人排气、排便停止。", "恶心、呕吐：该症状早期即可出现，常与腹痛伴发。呕吐剧烈而频繁。呕吐物为胃十二指肠内容物，偶可呈咖啡色。呕吐后腹痛不缓解。", "腹膜炎体征：急性水肿性胰腺炎时压痛多只限于上腹部，常无明显肌紧张。急性出血坏死性胰腺炎压痛明显，并有肌紧张和反跳痛，范围较广或延及全腹。移动性浊音多为阳性。肠鸣音减弱或消失。", "其他：较轻的急性水肿性胰腺炎可不发热或轻度发热。合并胆道感染常伴有寒战、高热。胰腺坏死伴感染时，持续性高热为主要症状之一。在腰部、季肋部和下腹部皮肤出现大量青紫色瘀斑，称Grey-Turner征；若出现在脐周，称Cullen征。"]}, {"type": "p", "text": "==7.急性胰腺炎的手术适应证：==①不能排除其他急腹症时；②胰腺和胰周坏死组织继发感染；③经非手术治疗，病情继续恶化；④暴发性胰腺炎经过短期非手术治疗多器官功能障碍仍不能得到纠正；⑤伴胆总管下端梗阻或胆道感染者；⑥合并肠穿孔、大出血或胰腺假性囊肿。"}, {"type": "p", "text": "==8.胰岛素瘤(insulinoma)的定性诊断==：whipple三联征：空腹低血糖，发作时血糖低于28mmol/L,给糖迅速缓解。"}, {"type": "p", "text": "==9.====慢性胰腺炎的四联症==：腹痛、体重下降、糖尿病、脂肪泻。"}, {"type": "p", "text": "==10.====急性胰腺炎==：阻塞、压力、胆疾患、酗酒、暴饮暴食、高脂高血钙、寄生虫、医源性"}, {"type": "p", "text": "特发性。"}, {"type": "p", "text": "慢性胰腺炎：胆道疾患、慢性酒精中毒、急性后遗症、甲旁亢、胰腺创伤、先天畸形、遗传因素、自身免疫因素、热带性。"}, {"type": "h", "level": 3, "id": "s17", "text": "麻醉、重症监护与复苏"}, {"type": "p", "text": "==1. ====目前临床常用的全身麻醉药==包括（吸入麻醉药）和（静脉麻醉药）两大类。"}, {"type": "p", "text": "==2. ====肌肉松弛药按作用机制不同区分为==（去极化肌松药）和（非去极化肌松药）两大类，"}, {"type": "p", "text": "中（非去极化肌松药）的肌松残留作用可用胆碱酯酶抑制剂来拮抗。"}, {"type": "list", "items": ["局部麻醉药按分子结构的中间链不同，区分为（酯类）和（酰胺类），利多卡因属于（酰胺类）局部麻醉药。", "打开气道并检查呼吸，如果没有呼吸，应先进行（2次）人工呼吸。", "每次人工呼吸的吸气时间应==大于====1====秒钟==，并可看到胸廓起伏，成人潮气量约500~600ml。", "胸外按压与人工呼吸的比例为==30:2==", "每次下压使胸骨下段极其相连的肋软骨下陷==4~==后即放松胸骨。", "按压与松开的时间比为==1:1==时心排血量最大。", "推荐胸外按压频率为==100====次====/====分==，按压不应被人工呼吸打断。", "当下列五项检查中出现三项以上异常，结合临床上有休克及微血管栓塞症状和出血倾向时，便可诊断==DIC==：", "血小板计数低于80x109/L", "凝血酶原时间比对照组延长了3秒以上", "血浆纤维蛋白原低于/L或呈进行性降低", "3p（血浆鱼精蛋白副凝）试验阳性", "血涂片中破碎红细胞超过2%等。"]}];</script>

  }

  // 阅读 / 练习 切换
  var tabs = [].slice.call(document.querySelectorAll('.doc-tabs button'));
  tabs.forEach(function (b) {
    b.addEventListener('click', function () {
      var p = b.getAttribute('data-pane');
      tabs.forEach(function (x) { x.classList.toggle('on', x === b); });
      var r = document.getElementById('paneRead');
      var q = document.getElementById('paneQuiz');
      if (r) r.classList.toggle('hide', p !== 'read');
      if (q) q.classList.toggle('hide', p !== 'quiz');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });

  var links = [].slice.call(document.querySelectorAll('.toc a[href^="#"]'));
  if (!links.length) return;
  var heads = links.map(function (a) { return document.getElementById(a.getAttribute('href').slice(1)); });
  function paint() {
    var top = window.scrollY + 120, idx = 0;
    heads.forEach(function (h, i) { if (h && h.offsetTop <= top) idx = i; });
    links.forEach(function (a, i) { a.classList.toggle('on', i === idx); });
  }
  window.addEventListener('scroll', paint, { passive: true });
  paint();
})();
</script>

</body>
</html>
