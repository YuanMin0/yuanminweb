<script>window.__DOC_BLOCKS = [{"type": "p", "text": "==第六章 建设社会主义文化强国==\n==一、坚定中国特色社会主义文化自信的底气来自于哪些方面？==\n中华优秀传统文化；革命文化；社会主义先进文化；中国特色社会主义的伟大实践\n==二、为什么说文化自信是一个国家、一个民族发展中最基本、最深沉、最持久的力量？==\n文化自信具有凝聚力；文化自信具有影响力；文化自信具有延续性；文化自信具有生产力\n==三、如何推动中华优秀传统文化创造性转化、创新性发展？==\n传承中华优秀传统文化；创新发展文化事业和文化产业；加强文化之间的交流互鉴\n==四、“二为”方向“双百”方针==\n二为方向指的是文艺为人民服务、为社会主义服务；双百方针指的是“百花齐放、百家争鸣”\n==五、什么是意识形态？试述如何建设具有强大凝聚力和引领力的社会主义意识形态？==\n意识形态本质内涵；是一个以社会存在为前提的，围绕一定阶级利益而形成的庞大思想体系，核心问题是夺取和巩固政权\n如何:\n1、要有足够的识别力；\n2、强烈的忧患意识；\n3、主动作为；\n4、捍卫好我们意识形态领域；\n5、掌握党对意识形态工作的领导权。这是建设强大凝聚力和引领力社会主义意识形态的根本保证。必须全面加强党对意识形态领域的领导和管理工作，确保意识形态领域的安全稳定。\n6、坚持马克思主义在意识形态领域的指导地位。马克思主义是我们立党立国、兴党兴国的根本指导思想，是社会主义意识形态的旗帜和灵魂。要坚持用马克思主义中国化最新成果武装全党、教育人民，推动马克思主义在意识形态领域的深入发展。\n7、加强理论武装工作。要通过深入学习、研究和宣传党的创新理论，不断提高广大党员干部和人民群众的思想觉悟和理论水平，使他们更好地理解和认同社会主义意识形态。\n8、强化阵地建设和内容创新。要充分利用各种媒体平台，加强正面宣传和舆论引导，传播正能量，弘扬主旋律。同时，要注重内容创新和形式创新，使社会主义意识形态更加贴近实际、贴近生活、贴近群众。\n9、提升文化软实力。要加强文化建设，推动中华优秀传统文化创造性转化和创新性发展，提高国家文化软实力。通过文化交流互鉴，展示中华文化的独特魅力，增强文化自信和民族自豪感。\n==六、 怎样确保牢牢掌握意识形态工作领导权==\n1、坚持举旗定向，增强意识形态引领力\n2、加强中国阐释，增强意识形态凝聚力\n3、保持斗争精神，增强意识形态战斗力\n==第七章 以保障和改善民生为重点加强社会建设==\n==一、增进民生福祉的原因==\n1、增进民生福祉是社会主义生产的根本目的\n2、增进民生福祉是马克思主义政党的本质要求\n3、增进民生福祉是全面建设社会主义现代化国家的应有之义\n==二、打赢脱贫攻坚战，实施精准扶贫方略==\n“六个精准”：扶持对象、项目安排、资金使用、措施到户、因村派人、脱贫成效；“五个一批”：发展生产脱贫、易地搬迁脱贫、生态补偿脱贫、发展教育脱贫、社会保障兜底；“两不愁三保障”：不愁吃、不愁穿，义务教育、基本医疗、住房安全有保障\n==三、正确把握民生和发展的关系==\n发展是解决民生问题的“总钥匙”，民生是发展的“指南针”；既要发展经济为持续改善民生奠定坚实物质基础，又要持续不断改善民生为经济发展创造更多需求；全面把握民生和发展相互牵动、互为条件的关系\n==四、保障和改善民生的相关要求==\n1、保障和改善民生的重要前提：正确把握民生和发展的关系\n2、保障和改善民生的工作思路：坚守底线、突出重点、完善制度、引导预期；3、保障和改善民生的:解决人民群众最关心最直接最现实的利益问题\n4、保障和改善民生的重要方针：尽力而为、量力而行\n5、保障和改善民生的重要原则：人人尽责、人人享有\n==五、解决人民群众最关心最直接最现实的利益问题的具体要求==\n提高收入水平；实施就业有限战略；健全社会保障体系；推进健康中国建设；办好人民满意的教育；扎实推进共同富裕\n==六、健康中国建设具体要求==\n普及健康生活；优化健康服务；完善健康保障；建设健康环境；发展健康产业"}, {"type": "p", "text": "==第八章 建设社会主义生态文明==\n==一、习近平生态文明思想==\n生态兴则文明兴、生态衰则文明衰，人与自然和谐共生的新生态自然观；绿水青山就是金山银山，保护环境就是保护生产力的新经济发展观；山水林田湖草是一个生命共同体的新系统观；环境就是民生，人民群众对美好生活的需求就是我们的奋斗目标的新民生政绩观\n==二、加快发展绿色转型==\n1、坚持党对生态文明建设的全面领导\n2、坚持统筹山水林田湖草沙系统治理\n3、坚持用最严格制度最严密法治保护生态环境\n4、坚持把建设美丽中国转化为全体人民自觉行动\n\n==第九章 坚持总体国家观 推进祖国完全统一==\n==一、总体国家安全观内涵及其如何防范重大风险==\n在2014年4月15日中央国家安全委员会第一次会议上，习主席指出，必须坚持总体国家安全观，以人民安全为宗旨，以政治安全为根本，以经济安全为基础，以军事、文化、社会安全为保障，以促进国际安全为依托，走出一条中国特色国家安全道路。\n==二、“一国两制”的内涵及党解决台湾问题的方略==\n==一国两制的内涵:=="}, {"type": "list", "items": ["一国两制的根本宗旨是维护国家主权、安全、发展利益，保持香港、澳门长期繁荣稳定", "“一国”是实行“两制”的前提和基础，“两制”从属和派生于“一国”，并统一于“一国”之内", "坚持中央全面管治权和保障特别行政区高度自治权相统一", "坚定落实“爱国者治港”“爱国者治澳”的原则", "坚持依法治港治澳"]}, {"type": "p", "text": "党解决台湾问题的方略:"}, {"type": "list", "items": ["实现祖国完全统一是中华民族伟大复兴的必然要求", "坚持贯彻新时代党解决台湾问题的总体方略", "坚持党中央对台工作的集中统一领导（根本保证）", "坚持在中华民族伟大复兴进程中推进祖国统一（历史方位）", "坚持在祖国大陆发展进步基础上解决台湾问题（战略思路）", "坚持“和平统一、一国两制”基本方针（大政方针）", "坚持一个中国原则和“九二共识”（政治基础）", "坚持推动两岸关系和平发展、融合发展（实践途径）", "坚持团结台湾同胞，争取台湾民心（根本动力）", "坚持粉碎“台独”分裂图谋（必然要求）", "坚持反对外部势力干涉（外部条件）", "坚持决不承诺放弃使用武力（战略支撑）", "牢牢把握两岸关系的主导权和主动权"]}, {"type": "p", "text": "（ppt上看看吧）"}, {"type": "p", "text": "==（一）==、台湾问题关系到国家根本利益\n第一，解决台湾问题是中党矢志不渝的历史任务\n第二，解决台湾问题是全体中华儿女的共同愿望\n第三，解决台湾问题关乎祖国的领土完整\n第四、台湾问题涉及到国家主权和民族复兴\n第五，台湾问题涉及到中国的国家安全利益\n（二）、祖国必须统一，也必然统一\n（三）、推进祖国和平统一进程\n第一，恪守“一个中国”原则，努力实现两岸和平统一\n第二，推进两岸经济社会融合发展\n第三，秉持“两岸一家亲”，出台一系列惠及广大台胞的政策\n（四）、绝不允许把任何一块中国领土从中国分裂出去\n第一，坚决反对任何形式的“台独”分裂行径\n第二，“台独”分裂势力抗拒统一不会得逞\n第三，外部势力阻碍中国完全统一必遭失败\n\n三、国家安全是民族复兴的根基，社会稳定是国家强盛的前提"}, {"type": "p", "text": "四、总体国家安全观把维护政治安全放在首要位置"}, {"type": "p", "text": "五、2015年7月1日，全国人大常委会通过《国家安全法》，将每年4月15日确定为全民国家安全教育日。《国家安全法》属于宪法及宪法相关法。"}, {"type": "p", "text": "六、发展与安全的关系：发展是安全的基础，安全是发展的保障。"}, {"type": "p", "text": "七、根本宗旨：维护国家主权、安全、发展利益，保持香港、澳门长期繁荣稳定。"}, {"type": "p", "text": "最高原则：维护国家主权、安全、发展利益。"}, {"type": "p", "text": "两者关系：“一国”是实行“两制”的前提和基础，“两制”从属和派生于“一国”，并统一于“一国”之内。"}, {"type": "p", "text": "==第十章====第一节 习近平强军思想==\n==一、习近平强军思想产生的时代背景是什么？==\n1、习近平强军思想来自对当今世界形势的准确把握\n2、习近平强军思想来自对我国安全形势的清醒认识\n3、习近平强军思想来自对世界新军事革命发展趋势的科学判断\n==二、习近平强军思想的内容（十一个明确）==\n明确党对人民军队的绝对领导是人民军队建军之本、强军之魂；明确强国必须强军；明确党在新时代的强军目标是建设一支听党指挥、能打胜仗、作风优良的人民军队；明确军队是要准备打仗的；明确推进强军事业必须坚持政治建军、改革强军、科技强军、人才强军、依法治军；明确改革是强军的必由之路；明确科技是核心战斗力；明确强军之道要在得人；明确依法治军是我们党建军治军基本方式；明确军民融合发展是兴国之举、强军之策；明确作风优良是我军鲜明特色和政治优势\n==三、近平强军思想蕴含的马克思主义立场观点方法有哪些？==\n1、马克思主义战争观军事观\n2、人民战争战略战术和军事斗争艺术\n3、共产党人科学的思维品格和思想风范\n4、传统军事文化养分的吸纳借鉴和发扬光大\n==四、 习近平强军思想回答了新时代建设一支什么样的强大人民军队、==怎样建设强大人民军队。是马克思主义军事理论中国化时代化的新飞跃；党的军事指导理论的最新成果；习近平新时代中国特色社会主义思想的“军事篇”\n==五、 重振政治纲纪、重塑组织形态、重整斗争格局、重构建设布局、重树作风形象=="}, {"type": "p", "text": "==第十章 第二节 坚持党对军队绝对领导==\n==一、党对军队绝对领导的主要内容和特点==\n内容:\n军委主席负责制；党委制；实行党委统一的集体领导下的首长分工负责制；各级党委集体领导必须贯彻民主集中制的组织原则\n特点:\n一是最高的领导----保持人民军队性质宗旨的必然选择\n二是唯一的领导----确保了党和国家长治久安的根本要求\n三是全面的领导---凝聚军心和提高战斗力的坚强保障\n==二、军委主席负责制:==\n中央军委主席负责中央军委全面工作；中央军委主席领导指挥全国武装力量；中央军委主席决定国防和军队建设一切重大问题\n==三、对 “军队非党化、军队非政治化”和“军队国家化”的认识==\n抵制西方错误思潮，坚定听党指挥的政治信念。敌对势力借民主政治之名，极力向我军官兵宣传鼓吹“军队非党化、军队非政治化”和“军队国家化”等反动政治观点，千方百计拉拢腐蚀军队人员，妄图使我军脱离党的领导，改变性质宗旨。\n==四、 党对军队绝对领导是人民军队建军之本、强军之魂==\n==五、2014年10月在古田召开全军政治工作会议、2024年6月在延安==召开中央军委政治工作会议\n==六、中央军委实行主席负责制：中央军委主席负责中央军委全面工作，==领导指挥全国武装力量，决定国防和军队建设一切重大问题。\n==七、军委主席负责制，是坚持党对军队绝对领导的根本制度和根本实==现形式，关乎我军建设根本方向，关乎新时代强国强军事业发展，关乎党和国家长治久安，关乎中国特色社会主义前途命运。\n\n==第十章 第三节 实现党在新时代的强军目标==\n==一、强军目标提出的重大意义==\n党在新时代强军目标的提出，体现了我们党一以贯之的建军治军指导思想和方针原则，回答了为什么强军、强军强什么、怎样强军的重大课题，立起了人民军队作为大国军队、强国军队应有的样子"}, {"type": "list", "items": ["理论创新：强军目标是对新形势下我军强军战略理论的深化与重大拓展，它不是对过去军事理论的简单重复，而是根据新时代新形势新任务，对建军治军理念的凝练升华。", "经验总结：强军目标的提出，也是对我军建设成功经验的深刻总结。习主席指出，建设强大的人民军队是我们党的不懈追求，在各个历史时期，我们党都根据形势任务的变化，及时提出明确的目标要求，引领我军建设不断向前发展。", "问题导向：强军目标的提出，体现了鲜明的问题导向，明确了军队建设的主要任务和努力方向。面对国家安全需求和世界先进军事水平的差距，强军目标为推动国防和军队现代化建设跨越式发展提供了有力牵引。", "战略引领：强军目标为国防和军队现代化提供了战略引领，有助于确保军队建设和发展始终符合国家安全和发展利益的需要，有助于推动军事理论、军队组织形态、军事人员、武器装备的现代化。", "精神支柱：强军目标的提出，强固了全军官兵奋斗强军的精神支柱。习近平强军思想激励广大官兵向党看齐、向心凝聚，当好红色血脉的时代传人，厚植家国情怀、矢志奋斗强军。"]}, {"type": "p", "text": "==二、强军目标的科学内涵==\n①听党指挥是灵魂，决定军队建设的政治方向，引领我军从胜利走向胜利，确保我军不变质不变色\n②能打胜仗是核心，英雄的人民军队打出了国威军威，切实把战斗队思想立起来\n③作风优良是保证，人民军队在党的旗帜下前进，培育了特有的光荣传统和优良作风，为党的伟大精神形成作出突出贡献，风清弊绝才能实现强军目标\n==三、国防和军队现代化新“三步走”战略安排==\n2027年：实现建军一百年奋斗目标"}, {"type": "p", "text": "2035年：基本实现国防和军队现代化"}, {"type": "p", "text": "本世纪中叶：把人民军队全面建成世界一流军队\n==第十章 第四节 全面提高新时代备战打仗能力==\n==一、加强联合作战能力要求==\n1.现代战争无战不联、无联不胜\n2.加快打造坚强高效的战区联合作战指挥机构\n3.强化联合思想，培育联合文化\n\n==二、如何深入推进实战化军事训练==\n1、军事训练是最直接的军事斗争准备\n2、军事训练必须立起实战标准\n3、军事训练必须要端正训风\n4、军事训练必须紧盯对手\n\n==三、提升战斗力具体要求==\n1、能打仗打胜仗是强军兴军的根本指向\n2、着力加强联合作战指挥体系和能力建设\n3、深入推进实战化军事训练\n4、把武器装备搞上去\n5、加强战斗精神培育\n\n==四、 能打仗、打胜仗是党和人民对军队的根本要求==\n1、牢固树立战斗力这个唯一的根本的标准\n军人的职业化；战斗队是军队的根本职能；坚决清除“和平积弊”\n2、坚决把全军工作重心归正到备战打仗上来\n我军是从无数战斗中成长起来的胜利之师；紧抓备战打仗主责主业\n\n==五、 军委的工作重心就是抓备战打仗，必须全部精力向备战打仗聚==焦，全部工作向备战打仗用劲，加快提高打赢能力"}, {"type": "p", "text": "==六、“战区作为本区域、本方向唯一最高指挥机构，其指挥权责是中==央军委赋予的，所有担负战区作战任务的部队必须坚决服从指挥。”"}, {"type": "p", "text": "==七、军事训练是最直接的军事斗争准备；军事训练必须立起实战标准；==军事训练必须要端正训风；军事训练必须紧盯对手"}, {"type": "p", "text": "==八、军事斗争是进行伟大斗争的重要方面、军事手段是实现伟大梦想==的保底手段、打赢能力是维护国家安全的战略能力"}, {"type": "p", "text": "==第十章 第五节 加快国防和军队现代化==\n==一、国防和军队现代化含义==\n国防和军队现代化，是中国式现代化的重要组成部分，是实现中华民族伟大复兴的战略支撑。"}, {"type": "list", "items": ["全面加强人民军队的建设。", "全面加强练兵备战，提高人民军队打赢能力。", "全面加强军事治理，完善军事力量结构编成，体系优化军事政策制度。", "巩固提高一体化国家战略体系和能力，优化国防科技工业体系，加强国防科技工业能力", "提高捍卫国家主权、安全、发展利益战略能力，有效履行人民军队使命任务"]}, {"type": "p", "text": "==二、党对人民军队的绝对领导==\n1.党对人民军队的绝对领导觉醒于大革命失败，开端于南昌起义，奠基于三湾改编，定型于古田会议\n2.党对人民军队的绝对领导是人民军队建军的根本原则，并在严峻复杂的考验中完善\n3.党对人民军队的绝对领导是近代以来中国历史发展的必然结果\n4.党对人民军队的绝对领导实现了中国军事制度的深刻变革\n5.党对人民军队的绝对领导是我军优良传统的核心内容\n6.党对人民军队的绝对领导是具有中国特色的制度创新\n\n==三、军委主席负责制含义==\n一是全国武装力量由军委主席统一领导和指挥；\n二是国防和军队建设一切重大问题由军委主席决策和决定；\n三是中央军委全面工作由军委主席主持和负责。"}, {"type": "p", "text": "==四、改革强军的具体措施==\n1、全面加强军事治理\n2、加快构建新型军事训练体系\n3、深化国防和军队改革的“三大战役”\n第一大战役:领导指挥体制改革，重在解决体制性障碍（2015年底开始）\n第二大战役:推进规模结构和力量编成改革，重在解决结构性矛盾（2016年底开始）\n第三大战役:深化军事政策制度改革，重在解决政策性问题（2018年底开始）\n4、深化国防和军队改革取得重大成效\n打破了长期实行的总部体制、大军区体制、大陆军体制；形成了军委管总、战区主战、军种主建的新格局；改变了长期以来陆战型、国土防御型的力量结构和兵力布势；实现了我军组织架构和力量体系的整体性、革命性重塑"}, {"type": "p", "text": "==五、军事理论现代化、军队组织形态现代化、军事人员现代化、武器==装扮现代化"}, {"type": "p", "text": "==六、加快机械化信息化智能化融合发展；必须全面推进政治建军、改==革强军、科技强军、人才强军、依法强军。\n==第十章 第六节 深化国防和军队改革==\n==一、深化国防和军队改革的重点内容有哪些？==\n体制性障碍、结构性矛盾、政策性问题——“三大战役”\n（一）重塑重构领导指挥体制改革\n1、破除长期实行的总部体制，建立军委多部门制\n2、破除长期实行的大军区体制，建立联合作战指挥体制\n3、破除长期实行的大陆军体制，建立新的军兵种和武警部队领导管理体制\n（二）优化规模结构和力量编成\n（三）建立健全中国特色社会主义军事政策制度体系\n改革的必要性:契合新体制、解决深层次问题、新形势催生新制度。\n改革的核心内容:深化军队党的建设制度改革、创新军事力量运用政策与制度体系、重塑军事力量建设政策制度、改革军事管理政策制度\n\n==二、建立健全中国特色社会主义军事政策制度体系改革的核心内容==\n深化军队党的建设制度改革、创新军事力量运用政策与制度体系、重塑军事力量建设政策制度、改革军事管理政策制度\n\n==三、试述重塑重构领导指挥体制改革的成果有哪些？==\n1、破除长期实行的总部体制，建立军委多部门制\n总参谋部、总政治部、总后勤部、总装备部\n2、破除长期实行的大军区体制，建立联合作战指挥体制\n军委联合作战指挥中心，健全战区联合作战指挥机构，实现中央军委对全军部队集中统一指挥，实现诸军兵种力量联合运用。\n3、破除长期实行的大陆军体制，建立新的军兵种和武警部队领导管理体制\n成立陆军领导机构，组建5个战区陆军机关。第二炮兵更名为火箭军、由原来的战略性独立兵种上升为独立军种。\n\n==四、军委管总、战区主战、军种主建；东西南北中五大战区=="}, {"type": "h", "level": 3, "id": "s1", "text": "第十章第七节巩固提高一体化国家战略体系和能力"}, {"type": "p", "text": "==一、巩固提高一体化国家战略体系和能力的重大意义==\n巩固提高一体化国家战略体系和能力，是党中央把握强国强军面临的新形势新任务新要求，着眼于更好统筹发展和安全、更好统筹经济建设和国防建设作出的战略部署。贯彻落实好这一部署，对全面建设社会主义现代化国家、全面推进中华民族伟大复兴，对实现建军一百年奋斗目标、加快把我军建成世界一流军队，都具有十分重要的意义。"}, {"type": "p", "text": "==二、推进一体化国家战略体系和能力的内容要求==\n1、深化国防和军队改革\n2、加强国防动员和后备力量建设\n3、建设强大稳固的现代边海空防\n4、巩固发展军政军民团结"}, {"type": "p", "text": "==三、什么是一体化国家战略体系和能力==\n1.国家战略体系是为实现国家利益而形成的有机战略系统，它是由国家总体战略、国家发展战略和国家安全战略构成的。\n2.国家战略能力，是国家经济实力、科技实力、军事实力、国际影响力的综合体现，在加强国际战略运筹、为国家发展营造良好环境上发挥着关键作用。\n3.国家战略体系和国家战略能力的关系\n国家战略体系和能力是一个有机整体，是国家战略意愿与战略能力的统一。构建完整有效的国家战略体系，目的在于形成强大的国家战略能力进而实现国家战略意愿。"}, {"type": "p", "text": "==四、为什么要巩固发展新时代军政军民团结？==\n1、坚如磐石的军政军民团结，永远是我们战胜一切艰难险阻、不断从胜利走向胜利的重要法宝。\n2、兵民是胜利之本。这是人民军队建军治军的宝贵经验，也是立于不败之地的制胜密码，也是我党我军军政军民团结特有的政治优势。\n3、要坚持人民战争的战略思想，把握新的时代条件下人民战争的新特点新要求，创新内容和方式方法，充分发挥人民战争的整体威力。\n4、要坚持人民战争的战略思想，把握新的时代条件下人民战争的新特点新要求，创新内容和方式方法，充分发挥人民战争的整体威力。\n5、大力弘扬军爱民、民拥军的光荣传统，不断发展坚如磐石的军政军民关系，推动实现强国梦、强军梦。"}, {"type": "p", "text": "==第十章====第八节习近平强军思想的军事观方法论==\n==一、五个坚持==\n坚持政治引领、坚持以武止戈、坚持积极进取、坚持统筹兼顾、坚持敢打必胜\n\n==二、“以武止戈”的科学内涵==\n坚持以武止戈 : 在战争与和平的矛盾关系中展开\n1.坚持“以武止戈”的科学内涵，培塑信仰坚定、矢志强军的政治自觉\n（1）和平必须以强大实力为后盾\n（2）把军事斗争准备建立在应对最复杂最困难情况的基础上\n2.感悟“坚持以武止戈”实践伟力，增强建军百年、强军胜战的战略自信\n（1）战略惩戒发端于能战底气，彰显了坚持以武止戈“战”的威力\n（2）战略布势源自于底线思维，展示了坚持以武止戈“备”的质效\n（3）战略博弈得成于战略智慧与综合国力，体现了坚持以武止戈“弈”的方略\n总结：以武止戈，在战争与和平关系中展开，我们要有捍卫和平的强大军事实力，并且时刻准备着为国家核心利益而战。我们渴望和平，但任何时候任何情况下，都决不会因此而放弃我们的正当权益，决不会拿国家的核心利益做交易。为维护国家主权和领土完整，我们不惜一战，关键是要打得赢。如果有人要把战争强加到我们头上，我们必须能决战决胜。\n\n==三、军事和政治的辩证关系（答案主要是第一条）==\n军事服从政治、战略服从政略\n1、政治性是军队的本质属性，强调了军事必须无条件的服从政治，政治性是军队与生俱来的本质属性，从而凸显了政治在军队中的首位和统领地位，以及政略在战略决策中的决定性和引领性作用\n2、坚决抵制“军队非党化、非政治化”“军队国家化”等错误政治观点。\n3、军队统帅出于政党，是执政党的领袖。“三化”最核心的就是“军队非党化”，就是剥夺军队的组织结构。\n4、直接控制政权和军队的是执政党的政治家\n5、政党轮流执政不等于就是非党化\n6、始终从政治的高度思考和处理军事问题是“政治引领”的基本原则；坚持政治引领，把思想和行动坚决统一到党中央习主席决策指挥上来，是“政治引领”的关键所在\n==第十一章 中国特色大国外交和推动构建人类命运共同体=="}, {"type": "p", "text": "一、世界正处于大发展大变革大调整时期\n权力转移引发国际力量对比的“大变局”；科技革命引发国家间竞争形态的“大变局”；“四大赤字”引发全球秩序调整“大变局”\n\n二、人类命运共同体的基本内涵\n持久和平的世界、普遍安全的世界、共同繁荣的世界、开放包容的世界、清洁美丽的世界\n\n三、推动建设新型国际关系\n相互尊重是前提，国家主权平等，主权和尊严必须得到尊重，内政不容干涉；公平正义是准则，中国坚持独立自主的和平外交政策跟据事情本身是非曲直决定自己的立场和政策；合作共赢是目标，中国贡献中国智慧和中国方案，为世界稳定发挥更大建设性作用\n\n四、我国外交工作的总体布局\n大国是关键，周边是首要，发展中国家是基础，多边是重要舞台"}, {"type": "p", "text": "==第十二章 坚持党的领导和全面从严治党==\n==一、中国共产党的领导是中国特色社会主义最本质的特征==\n1.党的领导地位不是自封的，是由党的性质决定的，是历史和人民的选择\n2.坚持无产阶级政党领导是科学社会主义的一条基本原则\n3.党的领导直接关系着中国特色社会主义的性质、方向和命运\n4.党领导是中国特色社会主义制度的最大优势\n（1）党是中国特色社会主义制度的创建者\n（2）党为中国特色社会主义制度提供“三个保证”\n5.党的领导是实现社会主义现代化和中华民族伟大复兴的根本保证（党领导是由中国特色社会主义迈向新征程的实践逻辑决定的）\n\n==二、“四个意识”“四个自信”“两个维护”==\n四个意识:政治意识、核心意识、大局意识、看齐意识\n四个自信:道路自信、制度自信、理论自信、文化自信\n两个维护:坚决维护习主席党中央的核心、全党的核心地位，坚决维护党中央权威和集中统一领导。\n\n==三、全面从严治党的重要性和必要性==\n1.全面从严治党是新时代党的建设的鲜明主题\n①加强党的自身建设是新形式下推进伟大事业进行伟大斗争实现伟大梦想的必然要求\n②加强党的自身建设是把党锻造成为坚强有力的马克思主义执政党的迫切需要\n2.坚定不移全面从严治党\n①全面从严治党，就是要克服党组织软弱涣散特别是腐败问题，始终保持党的先进性和纯洁性\n②全面从严治党，要落实一个布局合理、内容科学、要素齐备、统一高效的全面从严治党体系\n3.全面从严治党取得历史性开创性成就\n①坚持把政治建设放在首位，推动从严治党不断深入\n②在推进从严治党的实践中，我们党不断深化对管党治党规律的认识，形成了一系列重要经验\n③必须始终坚持问题导向，保持战略定力，一以贯之，持之以恒\n\n==四、“四大考验”“四大危险”==\n四大危险:执政考验、改革开放考验、市场经济考验、外部环境考验\n四大危险:精神懈怠危险、能力不足危险、脱离群众危险、消极腐败危险\n\n==五、党的建设的总布局——六大建设体系==\n政治建设、思想建设、组织建设、作风建设、纪律建设、制度建设\n\n==六、维护党中央权威和集中统一领导与坚持民主集中制的关系==\n维护党中央权威和集中统一领导，同坚持党的民主集中制是完全一致的。\n①中国共产党是以民主集中制为根本组织原则和领导制度的马克思主义政党。必须坚持党员个人服从党的组织，少数服从多数，下级组织服从上级组织，全党各个组织和全体党员服从党的全国代表大会和中央委员会，核心是全党各个组织和全体党员服从党的全国代表大会和中央委员会。\n②民主集中制是民主和集中紧密结合的制度，民主和集中这两个方面中的任何一个方面都不能偏废。我们党实行的民主集中制，是又有集中又有民主、又有纪律又有自由、又有统一意志又有个人心情舒畅生动活泼的制度。\n③维护党中央权威和集中统一领导，既有利于做到科学决策、民主决策、依法决策，避免发生重大失误甚至颠覆性错误;又有利于克服分散主义、本位主义，避免议而不决、决而不行，形成推进党和国家事业发展的强大合力。\n\n==七、新时代党的建设总要求是什么？二十大对全面从严治党做出的部署是什么？==\n1.把全面从严治党纳入“四个全面”战略布局\n2. 把党的政治建设摆在首位\n3.思想建党和制度治党同向发力\n4.加强干部队伍建设和组织体系建设\n5.以严的基调正风肃纪\n6.坚定不移推进反腐败斗争"}];</script>
<script>
(function () {
  if (WB.mountChrome) WB.mountChrome('materials');

  var body = document.getElementById('body');
  if (body) body.innerHTML = WB.renderBlocks(window.__DOC_BLOCKS || []);
  if (WB.fx && WB.fx.init) WB.fx.init();

  var base = (window.CDN_BASE || '').replace(/\/+$/, '');
  var prefix = window.CDN_PREFIX || '';
  var dl = document.getElementById('dgDl');
  if (base && /^https?:/.test(base) && dl && dl.getAttribute('data-key')) {
    dl.href = base + '/' + prefix + dl.getAttribute('data-key').split('/').map(encodeURIComponent).join('/');
  } else if (dl) {
    dl.style.display = 'none';
  }

  // 阅读 / 练习 切换
  var tabs = [].slice.call(document.querySelectorAll('.doc-tabs button'));
  tabs.forEach(function (b) {
    b.addEventListener('click', function () {
      var p = b.getAttribute('data-pane');
      tabs.forEach(function (x) { x.classList.toggle('on', x === b); });
      var r = document.getElementById('paneRead');
      var q = document.getElementById('paneQuiz');
      if (r) r.classList.toggle('hide', p !== 'read');
      if (q) q.classList.toggle('hide', p !== 'quiz');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });

  var links = [].slice.call(document.querySelectorAll('.toc a[href^="#"]'));
  if (!links.length) return;
  var heads = links.map(function (a) { return document.getElementById(a.getAttribute('href').slice(1)); });
  function paint() {
    var top = window.scrollY + 120, idx = 0;
    heads.forEach(function (h, i) { if (h && h.offsetTop <= top) idx = i; });
    links.forEach(function (a, i) { a.classList.toggle('on', i === idx); });
  }
  window.addEventListener('scroll', paint, { passive: true });
  paint();
})();

/* ---------- 章节入场 ---------- */
(function () {
  var hs = [].slice.call(document.querySelectorAll('.article h3'));
  if (!hs.length) return;
  if (!('IntersectionObserver' in window)) {
    hs.forEach(function (h) { h.classList.add('in'); });
    return;
  }
  var io = new IntersectionObserver(function (es) {
    es.forEach(function (e) {
      if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
    });
  }, { rootMargin: '0px 0px -8% 0px' });
  hs.forEach(function (h) { io.observe(h); });
  setTimeout(function () { hs.forEach(function (h) { h.classList.add('in'); }); }, 2500);
})();

/* ---------- 记住阅读位置 ---------- */
(function () {
  if (!document.getElementById('body')) return;
  var KEY = 'medilearn.docpos:' + location.pathname;
  var timer = 0;
  window.addEventListener('scroll', function () {
    if (timer) return;
    timer = setTimeout(function () {
      timer = 0;
      try { localStorage.setItem(KEY, String(Math.round(window.scrollY))); } catch (e) {}
    }, 600);
  }, { passive: true });

  var y = 0;
  try { y = parseInt(localStorage.getItem(KEY) || '0', 10) || 0; } catch (e) {}
  if (y < 600) return;
  setTimeout(function () {
    window.scrollTo(0, y);
    var t = document.createElement('div');
    t.textContent = '已回到上次阅读位置';
    t.style.cssText = 'position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:9600;' +
      'background:var(--text);color:var(--surface);font:500 13px/1 var(--font-sans,sans-serif);' +
      'padding:9px 16px;border-radius:999px;box-shadow:0 10px 30px rgba(15,23,42,.22);' +
      'opacity:0;transition:opacity .3s;pointer-events:none';
    document.body.appendChild(t);
    requestAnimationFrame(function () { t.style.opacity = '1'; });
    setTimeout(function () {
      t.style.opacity = '0';
      setTimeout(function () { t.remove(); }, 400);
    }, 1900);
  }, 80);
})();
</script>
