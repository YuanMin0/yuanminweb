<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的收藏 · MediLearn</title>
<meta name="description" content="我的收藏：把刷题时标记的题目集中在这里，支持按科目筛选、查看答案解析、一键回到原题重做。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M14 7h4v7h7v4h-7v7h-4v-7H7v-4h7z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2563eb">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MediLearn">
<link rel="stylesheet" href="css/changelog.css">
<style>.hero-h{font-size:clamp(23px,3vw,31px);letter-spacing:-.025em;margin:0 0 12px;line-height:1.25}</style>
<!-- 访问门禁：未登录直接跳转登录页（置于 head 内，避免内容闪现） -->
<script src="js/auth.js"></script>
<script>if(window.WB&&WB.auth)WB.auth.guard();</script>
</head>
<body>
<noscript>
<div style="max-width:600px;margin:64px auto;padding:24px 26px;border:1px solid #e3e8f0;border-radius:16px;background:#fff;color:#0f172a;font:15px/1.85 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <b style="font-size:17px">需要启用 JavaScript</b>
  <p style="margin:8px 0 0;color:#475569">本站是纯前端站点，内容与练习均由浏览器脚本渲染。请在浏览器设置中开启 JavaScript 后刷新页面。</p>
</div>
</noscript>

<header class="hdr" data-hdr></header>

<main class="page">
  <div class="wrap" id="root"></div>
</main>

<footer class="ftr" data-ftr></footer>

<script src="js/core.js"></script>
<script src="js/loader.js"></script>
<script src="data/_meta.js"></script>
<script src="data/changelog.js"></script>
<script src="js/fx.js"></script>
<script>
(function () {
  WB.mountChrome('wrong');
  var root = document.getElementById('root');
  var filter = WB.qs('s') || 'all';

  function render() {
    var all = WB.store.favList();

    /* 按科目统计 */
    var bySub = {};
    all.forEach(function (f) { bySub[f.subjectId] = (bySub[f.subjectId] || 0) + 1; });

    /* 单一 h1：空态与非空态共用同一段 hero，避免出现两个 h1 */
    function hero(empty) {
      return '<section class="hero hero-fx rv" style="padding:30px 32px">' +
        '<span class="orb o1"></span><span class="orb o2"></span>' +
        '<div class="hero-tag"><span class="badge-dot"></span> 本地保存 · 跨科目汇总</div>' +
        '<h1 class="hero-h">我的收藏</h1>' +
        (empty
          ? '<p class="lead">刷题时点题目右上角的「☆ 收藏」，题目就会集中到这里，方便考前回看。</p>' +
            '<div class="hero-actions">' +
              '<a class="gbtn gbtn-primary gbtn-lg" href="subjects.html"><span class="gbtn-ico">◈</span> 去刷题</a>' +
              '<a class="gbtn gbtn-lg" href="wrongbook.html"><span class="gbtn-ico">✦</span> 我的学习</a>' +
            '</div>'
          : '<p class="lead">共 <b data-count="' + all.length + '">0</b> 道收藏题，涉及 <b>' + Object.keys(bySub).length +
              '</b> 个科目。收藏的是「值得再看一眼」的题，不是错题。</p>' +
            '<div class="hero-actions">' +
              '<button class="gbtn gbtn-lg" id="exportBtn"><span class="gbtn-ico">⇩</span> 导出收藏</button>' +
              '<button class="gbtn gbtn-lg" id="clearBtn"><span class="gbtn-ico">✕</span> 清空</button>' +
            '</div>') +
      '</section>';
    }

    if (!all.length) {
      root.innerHTML =
        WB.crumb([{ text: '首页', href: 'index.html' }, { text: '我的' }]) +
        hero(true) +
        WB.empty('☆', '收藏夹还是空的', '在刷题页点「☆ 收藏」就能把题目存到这里，按科目自动归档。',
          '<a class="gbtn gbtn-primary" href="subjects.html">去刷题</a>', 'done');
      WB.fx.init();
      return;
    }

    var list = filter === 'all' ? all : all.filter(function (f) { return f.subjectId === filter; });

    root.innerHTML =
      WB.crumb([{ text: '首页', href: 'index.html' }, { text: '我的' }]) +
      hero(false) +

      '<div class="tabs mt-3 rv rv-d1" id="tabs">' +
        tab('all', '全部', all.length) +
        WB.subjects().map(function (s) {
          return bySub[s.id] ? tab(s.id, s.icon + ' ' + s.name, bySub[s.id]) : '';
        }).join('') +
      '</div>' +

      '<div id="list">' +
        (list.length ? list.map(row).join('') :
          '<div class="card card-pad center muted rv">该科目暂无收藏</div>') +
      '</div>';

    function tab(id, label, n) {
      return '<button class="tab' + (filter === id ? ' on' : '') + '" data-f="' + id + '">' + WB.esc(label) +
        ' <span style="opacity:.7">' + n + '</span></button>';
    }

    function drillLink(f) {
      /* 环境卫生学的选择题在独立刷题页，其余科目走 drill.html */
      if (/^huanjingweisheng-quiz\|/.test(f.uid)) {
        return 'huanjingweisheng-quiz.html?q=' + encodeURIComponent(f.uid.split('|')[1]);
      }
      return WB.link('drill.html', { s: f.subjectId, q: f.uid });
    }

    function row(f) {
      var s = WB.subjectOf(f.subjectId);
      var acc = s ? s.accent : 'var(--brand)';
      var accSoft = s ? s.accentSoft : 'var(--brand-soft)';
      var opts = (f.options || []).map(function (o, i) {
        return '<div>' + 'ABCDEFGH'[i] + '. ' + WB.rich(o) + '</div>';
      }).join('');
      return '<div class="wrow spot rv" style="--accent:' + acc + ';border-left:4px solid ' + acc + '">' +
        '<div class="wrow-hd">' +
          '<span class="chip" style="background:' + accSoft + ';color:' + acc + '">' + (s ? s.icon + ' ' + WB.esc(s.name) : '—') + '</span>' +
          '<span class="chip chip-line">' + WB.typeLabel(f.type) + '</span>' +
          (f.chapterTitle ? '<span class="chip chip-line">' + WB.esc(f.chapterTitle) + '</span>' : '') +
          '<div class="spacer"></div>' +
          '<span class="tiny dim">' + WB.fmtDate(f.ts) + '</span>' +
        '</div>' +
        '<div class="wrow-q">' + WB.rich(f.stem) + '</div>' +
        '<div class="wrow-line">正确答案：<b style="color:var(--ok)">' + WB.esc(WB.answerPlain(f)) + '</b></div>' +
        '<details class="mt-1"><summary class="tiny" style="cursor:pointer;color:var(--brand)">查看选项与解析</summary>' +
          (opts ? '<div class="wrow-line muted mt-1" style="line-height:1.9">' + opts + '</div>' : '') +
          (f.explain ? '<div class="wrow-line muted mt-1" style="line-height:1.8">' + WB.rich(f.explain) + '</div>' : '') +
          (f.source ? '<div class="wrow-line tiny dim mt-1">来源：' + WB.esc(f.source) + '</div>' : '') +
        '</details>' +
        '<div class="mt-2 row" style="flex-wrap:wrap">' +
          '<a class="gbtn gbtn-sm gbtn-primary" href="' + drillLink(f) + '">✎ 去做这道题</a>' +
          (f.kid ? '<a class="gbtn gbtn-sm" href="' + WB.link('knowledge.html', { s: f.subjectId, k: f.kid }) + '">📖 复习知识点</a>' : '') +
          '<button class="gbtn gbtn-sm" data-rm="' + WB.esc(f.uid) + '">★ 取消收藏</button>' +
        '</div>' +
      '</div>';
    }

    document.getElementById('tabs').addEventListener('click', function (e) {
      var b = e.target.closest('[data-f]'); if (!b) return;
      filter = b.getAttribute('data-f'); render(); window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    document.getElementById('list').addEventListener('click', function (e) {
      var rm = e.target.closest('[data-rm]'); if (!rm) return;
      var uid = rm.getAttribute('data-rm');
      if (confirm('确定取消收藏这道题吗？')) {
        WB.store.removeFav(uid); WB.toast('已取消收藏'); render();
      }
    });

    document.getElementById('clearBtn').addEventListener('click', function () {
      if (confirm('确定清空全部收藏吗？该操作不可恢复。')) {
        var f = WB.store.fav(); Object.keys(f).forEach(function (k) { WB.store.removeFav(k); });
        WB.toast('收藏夹已清空'); render();
      }
    });

    document.getElementById('exportBtn').addEventListener('click', function () {
      var lines = ['# MediLearn 收藏夹', '', '> 导出时间：' + WB.fmtDate(Date.now()) + '　共 ' + all.length + ' 道收藏', '', '---', ''];
      all.forEach(function (f, i) {
        lines.push('## ' + (i + 1) + '. ' + WB.plain(f.stem));
        lines.push('');
        lines.push('- 科目：' + (f.subjectName || '—') + '　章节：' + (f.chapterTitle || '—') + '　知识点：' + (f.kTitle || '—'));
        lines.push('- 题型：' + WB.typeLabel(f.type));
        if (f.options) f.options.forEach(function (o, oi) { lines.push('  - ' + 'ABCDEF'[oi] + '. ' + WB.plain(o)); });
        lines.push('- 正确答案：' + WB.answerPlain(f));
        if (f.explain) lines.push('- 解析：' + WB.plain(f.explain));
        if (f.source) lines.push('- 来源：' + WB.plain(f.source));
        lines.push('');
      });
      WB.downloadModal('导出收藏夹', [
        { icon: '⭐', label: '下载为 Markdown', desc: '含题干、选项、答案、解析与来源',
          run: function () { WB.download('MediLearn-收藏-' + WB.fmtDate(Date.now()).slice(0, 10) + '.md', lines.join('\n')); WB.toast('已开始下载'); } },
        { icon: '📋', label: '复制为 Markdown', desc: '直接复制到剪贴板',
          run: function () { WB.copy(lines.join('\n')); } },
        { icon: '🖨', label: '打印 / 另存为 PDF', desc: '使用浏览器打印功能', run: function () { window.print(); } }
      ]);
    });

    WB.fx.init();
  }

  render();
})();
</script>
<script src="js/changelog.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
