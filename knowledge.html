<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>知识点 · MediLearn</title>
<meta name="description" content="知识点讲义：结构化的表格、要点框、术语卡与自测练习，可下载为 Markdown 或打印为 PDF。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M14 7h4v7h7v4h-7v7h-4v-7H7v-4h7z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/changelog.css">
<!-- 访问门禁：未登录直接跳转登录页（置于 head 内，避免内容闪现） -->
<script src="js/auth.js"></script>
<script>if(window.WB&&WB.auth)WB.auth.guard();</script>
</head>
<body>
<noscript>
<div style="max-width:600px;margin:64px auto;padding:24px 26px;border:1px solid #e3e8f0;border-radius:16px;background:#fff;color:#0f172a;font:15px/1.85 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <b style="font-size:17px">需要启用 JavaScript</b>
  <p style="margin:8px 0 0;color:#475569">本站是纯前端站点，内容与练习均由浏览器脚本渲染。请在浏览器设置中开启 JavaScript 后刷新页面。</p>
</div>
</noscript>

<header class="hdr" data-hdr></header>

<main class="page">
  <div class="wrap" id="root"></div>
</main>

<footer class="ftr" data-ftr></footer>

<script src="js/core.js"></script>
<script src="data/xssx.js"></script>
<script src="data/exam-xssx.js"></script>
<script src="data/ethics.js"></script>
<script src="data/exam-ethics.js"></script>
<script src="data/bigdata.js"></script>
<script src="data/exam-bigdata.js"></script>
<script src="data/statistics.js"></script>
<script src="data/exam-statistics.js"></script>
<script src="data/pharmacology.js"></script>
<script src="data/exam-pharmacology.js"></script>
<script src="data/respiratory.js"></script>
<script src="data/exam-respiratory.js"></script>
<script src="data/cardiology.js"></script>
<script src="data/exam-cardiology.js"></script>
<script src="data/hematology.js"></script>
<script src="data/exam-hematology.js"></script>
<script src="data/endocrinology.js"></script>
<script src="data/exam-endocrinology.js"></script>
<script src="data/diagnostics.js"></script>
<script src="data/exam-diagnostics.js"></script>
<script src="data/surgery.js"></script>
<script src="data/exam-surgery.js"></script>
<script src="data/surgery-nursing.js"></script>
<script src="data/internal-nursing.js"></script>
<script src="js/fx.js"></script>
<script src="js/viz.js"></script>
<script>
(function () {
  WB.mountChrome('subjects');
  var sid = WB.qs('s'), kid = WB.qs('k');
  var s = WB.getSubject(sid), k = s ? WB.getKnowledge(sid, kid) : null;
  var root = document.getElementById('root');

  if (!s || !k) {
    root.innerHTML = WB.empty('🧭', '知识点不存在', '该知识点可能已被移除，或链接参数不正确。',
      '<a class="gbtn gbtn-primary" href="subjects.html">返回科目列表</a>');
    WB.fx.init(); return;
  }

  document.title = k.title + ' · ' + s.name + ' · MediLearn';
  document.documentElement.style.setProperty('--accent', s.accent);
  document.documentElement.style.setProperty('--accent-soft', s.accentSoft);

  /* 上一条 / 下一条 */
  var flat = WB.flatKnowledge(sid);
  var idx = -1;
  for (var i = 0; i < flat.length; i++) if (flat[i].id === k.id) { idx = i; break; }
  var prev = idx > 0 ? flat[idx - 1] : null;
  var next = idx < flat.length - 1 ? flat[idx + 1] : null;

  /* 相关知识点：先取同章其余，再用本科目其他章补足 3 条 */
  var relatedItems = flat.filter(function (x) {
    return x.id !== k.id && x.chapterId === k.chapterId;
  });
  if (relatedItems.length < 3) {
    flat.forEach(function (x) {
      if (relatedItems.length >= 3) return;
      if (x.id === k.id || x.chapterId === k.chapterId) return;
      relatedItems.push(x);
    });
  }
  relatedItems = relatedItems.slice(0, 3);
  var related = relatedItems.length
    ? '<section class="related no-print">' +
        '<div class="related-h">继续看 · 同科相关知识点</div>' +
        '<div class="related-grid">' +
        relatedItems.map(function (x) {
          return '<a class="related-card spot" style="--accent:' + s.accent + '" href="' +
            WB.link('knowledge.html', { s: s.id, k: x.id }) + '">' +
            '<div class="related-ch">' + WB.esc(x.chapterTitle) + '</div>' +
            '<div class="related-t">' + WB.esc(x.title) + '</div>' +
            '<div class="related-m">' + (x.quiz || []).length + ' 题</div>' +
          '</a>';
        }).join('') +
        '</div></section>'
    : '';

  /* 目录 */
  var toc = WB.outline(k.content);

  var head =
    WB.crumb([
      { text: '首页', href: 'index.html' },
      { text: s.name, href: WB.link('subject.html', { s: s.id }) },
      { text: k.chapterTitle },
      { text: k.title }
    ]) +
    '<div class="toolbar rv">' +
      '<div style="flex:1;min-width:0">' +
        '<div class="row" style="gap:8px;flex-wrap:wrap">' +
          '<span class="chip" style="background:' + s.accentSoft + ';color:' + s.accent + '">' + s.icon + ' ' + WB.esc(s.name) + '</span>' +
          '<span class="chip chip-line">' + WB.esc(k.chapterTitle) + '</span>' +
          (k.tags || []).map(function (t) { return '<span class="chip chip-line">' + WB.esc(t) + '</span>'; }).join('') +
        '</div>' +
      '</div>' +
      '<button class="gbtn gbtn-sm" id="learnBtn"></button>' +
      '<button class="gbtn gbtn-sm" id="dlBtn"><span class="gbtn-ico">⇩</span> 下载</button>' +
      '<a class="gbtn gbtn-sm gbtn-primary" href="' + WB.link('quiz.html', { s: s.id, k: k.id }) + '"><span class="gbtn-ico">◉</span> 做题 ' + k.quiz.length + '</a>' +
    '</div>';

  var layout =
    '<div class="klayout mt-3">' +
      '<aside class="toc rv rv-l">' +
        (toc.length ? '<div class="toc-h">本页目录</div>' + toc.map(function (t) {
          return '<a href="#' + WB.esc(t.id) + '">' + WB.esc(t.text) + '</a>';
        }).join('') : '') +
        '<div class="toc-h" style="margin-top:20px">本科目速览</div>' +
        '<div class="small dim" style="padding:0 11px;line-height:1.9">' +
          '共 ' + s._count.knowledge + ' 个知识点<br>' +
          '已学 ' + WB.store.learnedCount(s.id) + ' / ' + s._count.knowledge + '<br>' +
          '本章 ' + k.chapterId.replace(/^.*-c/, '第 ') + ' 章' +
        '</div>' +
      '</aside>' +
      '<article class="article rv rv-r">' +
        '<h2>' + WB.esc(k.title) + '</h2>' +
        '<div class="k-meta">' + (k.tags || []).map(function (t) { return '<span class="chip chip-line">' + WB.esc(t) + '</span>'; }).join('') + '</div>' +
        (k.summary ? '<p style="font-size:15.5px;color:var(--text-2);padding:14px 16px;border-radius:12px;background:var(--surface-2);border:1px dashed var(--border-2)"><b>概要</b>：' + WB.rich(k.summary) + '</p>' : '') +
        '<div id="body">' + WB.renderBlocks(k.content) + '</div>' +
        '<div class="pager no-print">' +
          (prev ? '<a class="spot" style="--accent:' + s.accent + '" href="' + WB.link('knowledge.html', { s: s.id, k: prev.id }) + '"><div class="dir">← 上一个</div><div class="t">' + WB.esc(prev.title) + '</div></a>' : '<span style="flex:1"></span>') +
          (next ? '<a class="next spot" style="--accent:' + s.accent + '" href="' + WB.link('knowledge.html', { s: s.id, k: next.id }) + '"><div class="dir">下一个 →</div><div class="t">' + WB.esc(next.title) + '</div></a>' : '<span style="flex:1"></span>') +
        '</div>' +
        '<div class="mt-3 no-print" style="text-align:center">' +
          '<a class="gbtn gbtn-primary gbtn-lg" href="' + WB.link('quiz.html', { s: s.id, k: k.id }) + '">开始自测（' + k.quiz.length + ' 题）</a>' +
        '</div>' +
        related +
      '</article>' +
    '</div>';

  root.innerHTML = head + layout;

  /* ---------- 交互动画（统计学） ---------- */
  if (WB.viz) WB.viz.mount(document.getElementById('body'));

  /* 记录「上次学习」 */
  try { localStorage.setItem('medilearn.last.v1', JSON.stringify({ s: s.id, k: k.id, name: s.name, kTitle: k.title })); } catch (e) {}

  /* ---------- 已学按钮 ---------- */
  var lb = document.getElementById('learnBtn');
  function paintLearn() {
    var on = WB.store.isLearned(s.id, k.id);
    lb.innerHTML = (on ? '<span class="gbtn-ico">✓</span> 已学' : '<span class="gbtn-ico">○</span> 标记已学');
    lb.classList.toggle('gbtn-primary', on);
  }
  paintLearn();
  lb.addEventListener('click', function () {
    WB.store.toggleLearned(s.id, k.id);
    paintLearn();
    WB.toast(WB.store.isLearned(s.id, k.id) ? '已标记为「已学」' : '已取消「已学」');
  });

  /* ---------- 下载 ---------- */
  document.getElementById('dlBtn').addEventListener('click', function () {
    WB.downloadModal('下载《' + k.title + '》', [
      { icon: '📄', label: '知识点讲义（含习题与答案）', desc: 'Markdown 格式，含全部内容块、自测题与参考答案',
        run: function () { WB.download('MediLearn-' + WB.slug(k.title) + '.md', WB.knowledgeToMd(k, { withQuiz: true })); WB.toast('已开始下载'); } },
      { icon: '📃', label: '知识点讲义（仅正文）', desc: '不含习题，便于快速阅读',
        run: function () { WB.download('MediLearn-' + WB.slug(k.title) + '-正文.md', WB.knowledgeToMd(k, { withQuiz: false })); WB.toast('已开始下载'); } },
      { icon: '📋', label: '复制为 Markdown', desc: '直接复制到剪贴板，粘贴进笔记软件',
        run: function () { WB.copy(WB.knowledgeToMd(k, { withQuiz: true })); } },
      { icon: '🖨', label: '打印 / 另存为 PDF', desc: '自动隐藏导航与按钮，只保留正文',
        run: function () { window.print(); } }
    ]);
  });

  /* ---------- 目录高亮 ---------- */
  var links = Array.prototype.slice.call(document.querySelectorAll('.toc a'));
  if (links.length && 'IntersectionObserver' in window) {
    var obs = new IntersectionObserver(function (es) {
      es.forEach(function (en) {
        if (en.isIntersecting) {
          links.forEach(function (a) { a.classList.toggle('on', a.getAttribute('href') === '#' + en.target.id); });
        }
      });
    }, { rootMargin: '-15% 0px -70% 0px' });
    document.querySelectorAll('#body h3[id]').forEach(function (h) { obs.observe(h); });
  }

  /* ---------- 键盘翻页 ---------- */
  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'ArrowLeft' && prev) location.href = WB.link('knowledge.html', { s: s.id, k: prev.id });
    if (e.key === 'ArrowRight' && next) location.href = WB.link('knowledge.html', { s: s.id, k: next.id });
  });

  WB.fx.init({
    dock: [
      { ico: '⌂', label: '总览', href: 'index.html' },
      { ico: '◈', label: s.name.slice(0, 6), href: WB.link('subject.html', { s: s.id }) },
      { ico: '◉', label: '做题', href: WB.link('quiz.html', { s: s.id, k: k.id }) },
      { ico: '⇩', label: '下载', href: '#' }
    ]
  });
  var dock = document.querySelector('.dock');
  if (dock) dock.lastElementChild.addEventListener('click', function (e) { e.preventDefault(); document.getElementById('dlBtn').click(); });
})();
</script>
<script src="data/changelog.js"></script>
<script src="js/changelog.js"></script>
</body>
</html>
