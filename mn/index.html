<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>考前速记 | MediLearn</title>
<meta name="description" content="考前速记 | MediLearn：MediLearn 医学学习站资料，支持在线阅读、检索与原文下载，配套知识点与练习题。">

<script src="../js/auth.js"></script>
<script>if(window.WB&&WB.auth)WB.auth.guard();</script>
<link rel="stylesheet" href="../css/style.css">
<style>
  :root {
    color-scheme: light only;
    --monet-cream: #FAF6EC;
    --monet-ink: #2C3418;
    --monet-blue: #5B84A8;
    --monet-deep: #3E5F7D;
    --monet-iris: #8E7BA8;
    --monet-red: #C0554A;
    --monet-gold: #D9A75E;
    --monet-green: #8FA96B;
  }
  body {
    background:
      radial-gradient(ellipse 62% 52% at 10% 6%, rgba(91,132,168,.26), transparent 62%),
      radial-gradient(ellipse 52% 46% at 90% 4%, rgba(142,123,168,.24), transparent 64%),
      radial-gradient(ellipse 58% 52% at 80% 90%, rgba(143,169,107,.20), transparent 62%),
      radial-gradient(ellipse 46% 42% at 6% 94%, rgba(192,85,74,.14), transparent 62%),
      var(--monet-cream);
    background-attachment: fixed;
  }
  .hdr {
    background: rgba(250,246,236,.82) !important;
    backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(44,52,24,.10);
  }

  .mn-hero { padding: 40px 0 26px; }
  .mn-hero h1 {
    margin: 0; font-family: var(--font-serif, Georgia, "Songti SC", serif);
    font-size: clamp(28px, 4vw, 40px); font-weight: 700; color: var(--monet-ink);
    letter-spacing: .02em;
  }
  .mn-hero h1::after {
    content: ''; display: block; width: 72px; height: 5px; margin-top: 12px;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--monet-red), var(--monet-gold) 55%, var(--monet-green));
  }
  .mn-hero p { margin: 14px 0 0; color: #5E6440; font-size: 14.5px; line-height: 1.7; }

  .mn-search {
    width: 100%; max-width: 420px; margin-top: 20px; padding: 12px 18px;
    border-radius: 999px; border: 2px solid rgba(44,52,24,.55);
    background: #FFFDF7; color: var(--monet-ink); font-size: 14px; outline: none;
    box-shadow: 3px 3px 0 rgba(44,52,24,.10);
    transition: box-shadow .18s, border-color .18s, transform .18s;
  }
  .mn-search::placeholder { color: #9AA07E; }
  .mn-search:focus {
    border-color: var(--monet-blue);
    box-shadow: 4px 4px 0 rgba(91,132,168,.28);
    transform: translate(-1px, -1px);
  }

  .mn-cat {
    display: flex; align-items: center; gap: 10px;
    margin: 34px 0 14px; font-size: 15px; font-weight: 700;
    color: var(--monet-deep); letter-spacing: .04em;
    font-family: var(--font-serif, Georgia, "Songti SC", serif);
  }
  .mn-cat::before {
    content: ''; width: 9px; height: 9px; border-radius: 50%;
    background: var(--monet-red); flex: 0 0 9px;
    box-shadow: 0 0 0 3px rgba(192,85,74,.18);
  }
  .mn-cat::after {
    content: ''; flex: 1; height: 2px; border-radius: 1px;
    background: repeating-linear-gradient(90deg,
      rgba(44,52,24,.22) 0 6px, transparent 6px 12px);
  }

  .mn-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(246px, 1fr)); gap: 16px; }

  .mn-card {
    display: flex; align-items: center; gap: 13px; padding: 15px 17px;
    background: #FFFDF7;
    border: 2px solid rgba(44,52,24,.78);
    border-radius: 14px;
    text-decoration: none; color: inherit;
    box-shadow: 4px 4px 0 rgba(44,52,24,.13);
    transition: transform .18s cubic-bezier(.22,1,.36,1), box-shadow .18s;
  }
  .mn-card:hover {
    transform: translate(-2px, -2px);
    box-shadow: 7px 7px 0 rgba(44,52,24,.20);
    text-decoration: none;
  }
  .mn-card-ico {
    flex: 0 0 42px; width: 42px; height: 42px; border-radius: 12px;
    display: grid; place-items: center; font-size: 20px; line-height: 1;
    border: 1.5px solid rgba(44,52,24,.28);
  }
  .mn-card-b { min-width: 0; flex: 1; }
  .mn-card-t {
    display: block; font-size: 14.5px; font-weight: 700; color: var(--monet-ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .mn-card-d { display: block; margin-top: 3px; font-size: 12px; color: #7A8060; }

  .mn-empty { padding: 44px 0; text-align: center; color: #8A9068; font-size: 14px; }

  @media (max-width: 560px) {
    .mn-hero { padding: 26px 0 18px; }
    .mn-grid { grid-template-columns: 1fr; gap: 12px; }
    .mn-card { padding: 13px 15px; }
  }
</style>
</head>
<body>
<header class="hdr" data-hdr></header>
<main class="page">
  <div class="wrap">
    <div class="mn-hero">
      <h1>考前速记</h1>
      <p>每个科目一页纯知识点，去掉题目与解析，适合考前快速过一遍。</p>
      <input class="mn-search" id="q" type="search" aria-label="搜索科目" placeholder="搜索科目…" autocomplete="off">
    </div>
    <div id="list"></div>
  </div>
</main>

<script src="../js/core.js"></script>
<script src="../data/_meta.js"></script>
<script src="list.js"></script>
<script>
(function () {
  var BASE = '../';
  WB.mountChrome('mn');

  var meta = (window.WB_META || []);
  var MN = window.WB_MN || {};
  var byId = {};
  meta.forEach(function (m) { byId[m.id] = m; });

  var items = Object.keys(MN).map(function (id) {
    var m = byId[id] || {};
    return {
      id: id,
      name: m.name || id,
      icon: m.icon || '▤',
      sem: m.sem || '',
      chapters: (m._count && m._count.chapters) || 0,
      knowledge: (m._count && m._count.knowledge) || 0,
      /* mn/ 下的页面用相对路径；根目录页面（如环境卫生学）需要回退一级 */
      href: MN[id].indexOf('mn/') === 0 ? MN[id].slice(3) : '../' + MN[id]
    };
  }).sort(function (a, b) { return a.name.localeCompare(b.name, 'zh'); });

  var root = document.getElementById('list');
  var input = document.getElementById('q');

  /* 莫奈色板：睡莲蓝 / 鸢尾紫 / 罂粟红 / 干草金 / 草绿 / 深蓝 */
  var PALETTE = ['#5B84A8', '#8E7BA8', '#C0554A', '#D9A75E', '#8FA96B', '#3E5F7D'];
  var COLOR_I = 0;

  function render(kw) {
    COLOR_I = 0;
    var list = items.filter(function (x) {
      return !kw || x.name.indexOf(kw) > -1 || x.id.indexOf(kw) > -1;
    });
    if (!list.length) {
      root.innerHTML = '<div class="mn-empty">没有匹配的科目</div>';
      return;
    }
    var groups = {}, order = [];
    list.forEach(function (x) {
      var k = x.sem || 'other';
      if (!groups[k]) { groups[k] = []; order.push(k); }
      groups[k].push(x);
    });
    var SEM = { dasan1:'大三上', dasan2:'大三下', daer1:'大二上', daer2:'大二下', dayi1:'大一下', other:'其他' };
    var SEM_ORDER = ['dasan1', 'dasan2', 'daer1', 'daer2', 'dayi1', 'other'];
    /* 按学期顺序输出，未在列表中的归到末尾 */
    var sorted = SEM_ORDER.filter(function (k) { return groups[k]; })
      .concat(order.filter(function (k) { return SEM_ORDER.indexOf(k) < 0; }));
    root.innerHTML = sorted.map(function (k) {
      return '<div class="mn-cat">' + (SEM[k] || k) + '</div>' +
        '<div class="mn-grid">' + groups[k].map(function (x) {
          var color = PALETTE[COLOR_I++ % PALETTE.length];
          return '<a class="mn-card" href="' + x.href + '">' +
            '<span class="mn-card-ico" style="background:' + color + '1f;border-color:' + color + '66">' + x.icon + '</span>' +
            '<span class="mn-card-b">' +
              '<span class="mn-card-t">' + WB.esc(x.name) + '</span>' +
              '<span class="mn-card-d">' + x.chapters + ' 讲 · ' + x.knowledge + ' 个知识点</span>' +
            '</span></a>';
        }).join('') + '</div>';
    }).join('');
  }

  render('');
  input.addEventListener('input', function () { render(this.value.trim()); });
})();
</script>
</body>
</html>
