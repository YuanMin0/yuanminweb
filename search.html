<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>知识点检索 · MediLearn</title>
<meta name="description" content="全站知识点检索：输入关键词即可查找 50 个科目、547 个知识点，结果标注所属科目与章节来源。">

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2563eb">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MediLearn">

<script src="js/auth.js"></script>
<script>if(window.WB&&WB.auth)WB.auth.guard();</script>
<style>
  .ks-hero{padding:34px 0 6px}
  .ks-hero h1{margin:0;font-size:clamp(24px,3.6vw,34px);letter-spacing:.01em}
  .ks-hero p{margin:10px 0 0;color:var(--text-2);font-size:14.5px}
  .ks-box{position:relative;margin:20px 0 6px}
  .ks-input{
    width:100%;padding:16px 54px 16px 50px;border-radius:16px;border:2px solid var(--border);
    background:var(--surface);color:var(--text-1);font:600 16px var(--font);
    outline:none;transition:border-color .18s,box-shadow .18s;
  }
  .ks-input:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(37,99,235,.12)}
  .ks-ico{position:absolute;left:17px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--text-3);pointer-events:none}
  .ks-clear{
    position:absolute;right:10px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;
    border:0;background:transparent;color:var(--text-3);font-size:16px;cursor:pointer;display:none;
  }
  .ks-clear:hover{background:var(--surface-2);color:var(--text-1)}
  .ks-clear.on{display:block}
  .ks-hots{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0;align-items:center}
  .ks-hots span{font-size:12.5px;color:var(--text-3)}
  .ks-hot{
    padding:5px 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);
    font:600 12.5px var(--font);color:var(--text-2);cursor:pointer;transition:.16s;
  }
  .ks-hot:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}

  .ks-sum{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px;color:var(--text-3);font-size:13.5px}
  .ks-sum b{color:var(--text-1);font-size:15px}
  .ks-list{display:flex;flex-direction:column;gap:12px;padding-bottom:60px}

  .ks-card{
    display:block;padding:16px 18px;border-radius:14px;border:1px solid var(--border);
    background:var(--surface);text-decoration:none;color:inherit;
    transition:transform .18s var(--ease),box-shadow .18s var(--ease),border-color .18s;
  }
  .ks-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--brand)}
  .ks-path{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--text-3);margin-bottom:7px}
  .ks-path .sb{color:var(--brand);font-weight:700}
  .ks-path .sep{opacity:.5}
  .ks-t{font:700 16px/1.5 var(--font);color:var(--text-1);margin:0 0 6px}
  .ks-d{margin:0;color:var(--text-2);font-size:13.5px;line-height:1.72;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .ks-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;font-size:12px;color:var(--text-3)}
  .ks-src{padding:2px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border)}
  .ks-src b{color:var(--text-2);font-weight:700}
  .ks-tag{padding:2px 8px;border-radius:999px;background:var(--brand-soft);color:var(--brand);font-weight:700}
  mark{background:#FDE68A;color:#7C2D12;padding:0 2px;border-radius:3px}
  html[data-theme="dark"] mark{background:#8A6D1F;color:#FDE68A}

  .ks-empty{padding:56px 0 80px;text-align:center;color:var(--text-3)}
  .ks-empty b{display:block;color:var(--text-1);font-size:16px;margin-bottom:8px}
  .ks-empty p{margin:0;font-size:13.5px}
</style>
</head>
<body>
<noscript>
<div style="max-width:600px;margin:64px auto;padding:24px 26px;border:1px solid #e3e8f0;border-radius:16px;background:#fff;color:#0f172a;font:15px/1.85 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <b style="font-size:17px">需要启用 JavaScript</b>
  <p style="margin:8px 0 0;color:#475569">本站是纯前端站点，检索由浏览器脚本完成，请开启 JavaScript 后刷新。</p>
</div>
</noscript>

<header class="hdr" data-hdr></header>

<main class="page">
  <div class="wrap">
    <section class="ks-hero rv">
      <h1>知识点检索</h1>
      <p>输入关键词，查找全站 <b id="ksTotal">—</b> 个知识点；每条结果都标注所属科目与章节，可直接跳转查看原文。</p>

      <div class="ks-box">
        <span class="ks-ico" aria-hidden="true">⌕</span>
        <input class="ks-input" id="ksInput" type="search" autocomplete="off" spellcheck="false"
               placeholder="搜索知识点，如：休克、逆流倍增、酸碱平衡、半衰期…" aria-label="搜索知识点">
        <button class="ks-clear" id="ksClear" type="button" aria-label="清空">✕</button>
      </div>

      <div class="ks-hots" id="ksHots">
        <span>试试：</span>
      </div>
    </section>

    <div class="ks-sum" id="ksSum"></div>
    <div class="ks-list" id="ksList"></div>
  </div>
</main>

<script src="js/core.js"></script>
<script src="data/_meta.js"></script>
<script src="data/ksearch.js"></script>
<script>
(function () {
  'use strict';
  WB.mountChrome('subjects');

  var DATA = (window.KSEARCH && window.KSEARCH.items) || [];
  var input = document.getElementById('ksInput');
  var listEl = document.getElementById('ksList');
  var sumEl = document.getElementById('ksSum');
  var clearBtn = document.getElementById('ksClear');
  var hotsEl = document.getElementById('ksHots');

  document.getElementById('ksTotal').textContent = DATA.length;

  var HOTS = ['休克', '逆流倍增', '酸碱平衡', '半衰期', '免疫球蛋白', '心力衰竭', '肾糖阈', '心理应激'];
  HOTS.forEach(function (w) {
    var b = document.createElement('button');
    b.className = 'ks-hot'; b.type = 'button'; b.textContent = w;
    b.addEventListener('click', function () { input.value = w; run(w, true); input.focus(); });
    hotsEl.appendChild(b);
  });

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function escRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  function mark(text, terms) {
    var out = esc(text);
    if (!terms.length) return out;
    var re = new RegExp('(' + terms.map(escRe).join('|') + ')', 'gi');
    return out.replace(re, '<mark>$1</mark>');
  }

  function score(it, terms) {
    var t = it.t || '', d = it.d || '', c = it.c || '', sn = it.sn || '', x = it.x || '', g = it.g || '';
    var s = 0;
    for (var i = 0; i < terms.length; i++) {
      var w = terms[i];
      var hit = false;
      if (t.indexOf(w) > -1) { s += 6; hit = true; }
      if (g.indexOf(w) > -1) { s += 3; hit = true; }
      if (c.indexOf(w) > -1) { s += 3; hit = true; }
      if (sn.indexOf(w) > -1) { s += 2; hit = true; }
      if (d.indexOf(w) > -1) { s += 2; hit = true; }
      if (x.indexOf(w) > -1) { s += 1; hit = true; }
      if (!hit) return -1;   /* 多关键词取交集 */
    }
    if (t.indexOf(terms[0]) === 0) s += 4;   /* 标题开头命中加权 */
    return s;
  }

  function run(q, fromHot) {
    q = String(q || '').trim();
    clearBtn.classList.toggle('on', !!q);

    var terms = q ? q.split(/\s+/).filter(Boolean) : [];
    if (!terms.length) {
      sumEl.innerHTML = '';
      listEl.innerHTML = '';
      return;
    }

    var hits = [];
    for (var i = 0; i < DATA.length; i++) {
      var sc = score(DATA[i], terms);
      if (sc > 0) hits.push({ it: DATA[i], sc: sc });
    }
    hits.sort(function (a, b) { return b.sc - a.sc; });

    var shown = hits.slice(0, 80);
    sumEl.innerHTML = hits.length
      ? '找到 <b>' + hits.length + '</b> 个相关知识点' + (hits.length > 80 ? '，显示前 80 条' : '')
      : '';

    if (!hits.length) {
      listEl.innerHTML = '<div class="ks-empty"><b>没有找到「' + esc(q) + '」</b>' +
        '<p>换个更短的关键词试试，比如把「肾小管浓缩机制」换成「浓缩」。</p></div>';
      return;
    }

    listEl.innerHTML = shown.map(function (h, idx) {
      var it = h.it;
      return '<a class="ks-card" href="knowledge.html?s=' + encodeURIComponent(it.s) + '&k=' + encodeURIComponent(it.kid) + '"' +
        (idx === 0 ? ' data-first="1"' : '') + '>' +
        '<div class="ks-path"><span class="sb">' + esc(it.sn) + '</span><span class="sep">/</span><span>' + esc(it.c) + '</span></div>' +
        '<h3 class="ks-t">' + mark(it.t, terms) + '</h3>' +
        '<p class="ks-d">' + mark(it.d, terms) + '</p>' +
        '<div class="ks-foot">' +
          '<span class="ks-src">来源：<b>' + esc(it.sn) + '</b> · ' + esc(it.c) + '</span>' +
          (it.g ? '<span class="ks-tag">' + esc(it.g.split(' ').join(' · ')) + '</span>' : '') +
        '</div>' +
      '</a>';
    }).join('');
  }

  var timer = null;
  input.addEventListener('input', function () {
    clearTimeout(timer);
    var v = input.value;
    timer = setTimeout(function () { run(v); }, 120);
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      var first = listEl.querySelector('[data-first="1"]');
      if (first) location.href = first.getAttribute('href');
    } else if (e.key === 'Escape') {
      input.value = ''; run('');
    }
  });
  clearBtn.addEventListener('click', function () { input.value = ''; run(''); input.focus(); });

  /* URL 里带 q 时直接检索，方便分享 */
  var q0 = WB.qs ? (WB.qs('q') || '') : '';
  if (q0) { input.value = q0; run(q0); }
  else { input.focus(); }

  WB.fx.init();
})();
</script>
<script src="data/changelog.js"></script>
<script src="js/changelog.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
